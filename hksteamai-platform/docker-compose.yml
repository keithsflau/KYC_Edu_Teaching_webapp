services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hksteamai
      POSTGRES_PASSWORD: hksteamai_local
      POSTGRES_DB: hksteamai
    volumes:
      - hksteamai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hksteamai -d hksteamai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hksteamai_pgdata:
