      body {
        font-family: "Outfit", sans-serif;
        background: #1a1a1a;
        color: white;
      }

      /* Flame Animation */
      .flame {
        border-radius: 50% 50% 20% 20%;
        position: absolute;
        bottom: 0px;
        left: 50%;
        transform: translateX(-50%);
        filter: blur(10px);
        transition: all 0.5s ease;
      }

      /* Luminous Flame (Air hole closed) - Yellow, Wavy, Quiet */
      .flame-luminous {
        width: 40px;
        height: 120px;
        background: linear-gradient(
          to top,
          rgba(255, 100, 0, 0.8),
          rgba(255, 200, 0, 0.8)
        );
        animation: flicker 1s infinite alternate;
      }

      /* Non-luminous Flame (Air hole open) - Blue, Steady, Hotter */
      .flame-non-luminous {
        width: 30px;
        height: 100px;
        background: linear-gradient(
          to top,
          rgba(0, 50, 255, 0.6),
          rgba(0, 200, 255, 0.4)
        );
        border-radius: 50% 50% 35% 35%;
        filter: blur(5px);
      }

      .inner-cone {
        position: absolute;
        bottom: 5px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 40px;
        background: rgba(0, 255, 255, 0.8);
        border-radius: 50% 50% 0 0;
        opacity: 0;
        transition: opacity 0.5s;
      }
      .flame-non-luminous .inner-cone {
        opacity: 1;
      }

      @keyframes flicker {
        0% {
          transform: translateX(-50%) scaleY(1);
        }
        100% {
          transform: translateX(-50%) scaleY(1.1) skewX(2deg);
        }
      }

      .burner-body {
        background: linear-gradient(to right, #444, #777, #444);
      }

      .air-hole {
        background: #000;
        transition: height 0.3s;
      }
    </style>
