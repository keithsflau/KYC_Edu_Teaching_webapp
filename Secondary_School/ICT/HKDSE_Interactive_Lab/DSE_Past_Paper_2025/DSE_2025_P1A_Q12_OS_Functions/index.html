        left: 0;

        right: 0;

        bottom: 0;

        background-color: #334155;

        transition: 0.4s;

        border-radius: 34px;

      }

      .slider:before {

        position: absolute;

        content: "";

        height: 18px;

        width: 18px;

        left: 2px;

        bottom: 2px;

        background-color: white;

        transition: 0.4s;

        border-radius: 50%;

      }

      input:checked + .slider {

        background-color: #10b981;

      }

      input:checked + .slider:before {

        transform: translateX(20px);

      }
