<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Energy Grid Security Model | S5 Math 能源網絡安全模型</title>
  <!--
    Curriculum Alignment
    - Audience: Form 5
    - Curriculum: Rates, percentages, linear constraints / intro LP ideas; NSE Resource / Economic Security
    - Objectives: K — mix & capacity constraints; S — balance supply vs demand; A — weigh reliability vs cost
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
  <style>body{font-family:"Outfit","Noto Sans TC",sans-serif}</style>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const T = {
      en: {
        back: "← Form 5", lang: "中文", badge: "Modelling · Energy Security",
        title: "Energy Grid Security Model",
        sub: "Allocate generation mix to meet demand under reliability constraints",
        k: "K: Total supply = Σ sources; reserve margin = (supply − demand)/demand",
        s: "S: Meet peak demand with ≥15% reserve while limiting cost index",
        a: "A: Appreciate diversified supply as a resilience strategy",
        ns: "NSE (Resource / Economic Security): Model electricity mix for reliability — maths-first.",
        demand: "Peak demand (GW)",
        gas: "Gas (GW)",
        nuclear: "Nuclear (GW)",
        renew: "Renewables (GW)",
        import: "Import (GW)",
        cost: "Cost index (relative)",
        carbon: "Carbon index (relative)",
        reserve: "Reserve margin",
        target: "Target reserve ≥ 15%",
        ok: "Grid meets reliability target under these assumptions.",
        fail: "Insufficient reserve — raise firm capacity (gas/nuclear/import) or cut demand.",
        coach: "AI coach (offline heuristic)",
        formula: "Reserve = (S − D) / D · 100%",
        challenge: "Challenge: demand ≥ 9 GW, reserve ≥ 15%, cost index ≤ 60.",
        note: "Assumptions: renewables are variable — model treats current output as fixed for one peak hour."
      },
      zh: {
        back: "← 中五", lang: "ENG", badge: "建模 · 能源安全",
        title: "能源網絡安全模型",
        sub: "在可靠度約束下分配發電組合以滿足需求",
        k: "知：總供應=各來源之和；備用率=(供應−需求)/需求",
        s: "技：以 ≥15% 備用滿足高峰，並控制成本指數",
        a: "態：理解多元化供應作為韌性策略",
        ns: "國家安全教育（資源／經濟安全）：以數學模擬電力組合可靠度。",
        demand: "高峰需求（GW）",
        gas: "燃氣（GW）",
        nuclear: "核能（GW）",
        renew: "再生能源（GW）",
        import: "輸入電力（GW）",
        cost: "成本指數（相對）",
        carbon: "碳指數（相對）",
        reserve: "備用率",
        target: "目標備用 ≥ 15%",
        ok: "在此假設下電網達到可靠度目標。",
        fail: "備用不足——提高穩定容量（燃氣／核能／輸入）或降低需求。",
        coach: "AI 教練（離線啟發式）",
        formula: "備用率 = (S − D) / D · 100%",
        challenge: "挑戰：需求 ≥ 9 GW，備用 ≥ 15%，成本指數 ≤ 60。",
        note: "假設：再生能源有變動——模型將當前輸出視為某一高峰小時固定值。"
      }
    };

    function App() {
      const [lang, setLang] = useState("en");
      const t = T[lang];
      const [D, setD] = useState(9.2);
      const [gas, setGas] = useState(4.1);
      const [nuc, setNuc] = useState(2.8);
      const [ren, setRen] = useState(1.6);
      const [imp, setImp] = useState(2.2);

      const m = useMemo(() => {
        const S = gas + nuc + ren + imp;
        const reserve = D > 0 ? (S - D) / D : 0;
        const cost = gas * 7 + nuc * 5 + ren * 4 + imp * 6; // relative units (fictional indices)
        const carbon = gas * 11 + nuc * 3 + ren * 2 + imp * 6;
        return { S, reserve, cost, carbon };
      }, [D, gas, nuc, ren, imp]);

      const reliable = m.reserve >= 0.15;
      const challenge = D >= 9 && m.reserve >= 0.15 && m.cost <= 60;

      const coach = !reliable
        ? (lang === "en" ? "Raise firm sources first; renewables help carbon but may not fix a peak shortfall alone." : "先提高穩定電源；再生能源有助減碳，但未必單獨補足高峰缺口。")
        : m.cost > 60
          ? (lang === "en" ? "Reliable but pricey — try shifting some gas to nuclear/renewables if assumptions allow." : "可靠但偏貴——若假設允許，可把部分燃氣轉至核能／再生能源。")
          : (lang === "en" ? "Balanced mix. Stress-test: drop renewables by 35% (cloudy/calm) and recheck reserve." : "組合均衡。壓力測試：再生能源降 35%（陰／無風）再檢查備用。");

      const sources = [
        { name: "Gas", v: gas, c: "#f59e0b" },
        { name: "Nuclear", v: nuc, c: "#6366f1" },
        { name: "Renew", v: ren, c: "#10b981" },
        { name: "Import", v: imp, c: "#0ea5e9" }
      ];
      let acc = 0;

      return (
        <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-slate-50">
          <a href="../index.html" className="fixed top-4 left-4 z-50 text-sm bg-white/90 px-3 py-1.5 rounded-lg border shadow-sm">{t.back}</a>
          <button onClick={() => setLang(lang === "en" ? "zh" : "en")} className="fixed top-4 right-4 z-50 text-sm font-bold text-amber-800 bg-white/90 px-3 py-1.5 rounded-lg border">{t.lang}</button>

          <header className="max-w-5xl mx-auto pt-16 px-4 text-center">
            <div className="text-amber-700 text-xs font-bold tracking-widest uppercase mb-2">{t.badge}</div>
            <h1 className="text-3xl md:text-5xl font-extrabold mb-2">{t.title}</h1>
            <p className="text-slate-500">{t.sub}</p>
            <div className="mt-4 flex flex-wrap justify-center gap-2 text-xs">
              <span className="bg-white px-3 py-1 rounded-full border">{t.k}</span>
              <span className="bg-white px-3 py-1 rounded-full border">{t.s}</span>
              <span className="bg-white px-3 py-1 rounded-full border">{t.a}</span>
            </div>
            <p className="text-xs text-slate-500 mt-3 max-w-2xl mx-auto">{t.ns}</p>
          </header>

          <main className="max-w-5xl mx-auto px-4 py-8 grid lg:grid-cols-2 gap-6">
            <section className="bg-white rounded-3xl shadow-xl border p-6 space-y-4">
              <div className="font-mono text-center bg-amber-50 text-amber-900 rounded-xl p-3 text-sm">{t.formula}</div>
              {[
                [t.demand, D, setD, 5, 12, 0.1],
                [t.gas, gas, setGas, 0, 6, 0.1],
                [t.nuclear, nuc, setNuc, 0, 5, 0.1],
                [t.renew, ren, setRen, 0, 5, 0.1],
                [t.import, imp, setImp, 0, 4, 0.1]
              ].map(([label, val, set, min, max, step]) => (
                <div key={label}>
                  <div className="flex justify-between text-sm mb-1"><span className="font-bold text-slate-500">{label}</span><span className="font-mono font-bold">{val.toFixed(1)}</span></div>
                  <input type="range" min={min} max={max} step={step} value={val} onChange={e => set(+e.target.value)} className="w-full accent-amber-600" />
                </div>
              ))}
              <p className="text-xs text-slate-400">{t.note}</p>
            </section>

            <section className="bg-white rounded-3xl shadow-xl border p-6">
              <div className="h-10 flex rounded-xl overflow-hidden border mb-2">
                {sources.map(s => {
                  const w = m.S > 0 ? (s.v / Math.max(m.S, D)) * 100 : 0;
                  const el = <div key={s.name} style={{ width: `${w}%`, background: s.c }} title={`${s.name}: ${s.v}`} />;
                  return el;
                })}
              </div>
              <div className="relative h-3 bg-slate-100 rounded-full mb-6">
                <div className="absolute top-0 bottom-0 w-0.5 bg-rose-500" style={{ left: `${Math.min(100, (D / Math.max(m.S, D, 1)) * 100)}%` }} />
                <span className="absolute -top-5 text-[10px] text-rose-600 font-bold" style={{ left: `${Math.min(90, (D / Math.max(m.S, D, 1)) * 100)}%` }}>D</span>
              </div>

              <div className="grid grid-cols-2 gap-3 mb-4">
                <div className="rounded-2xl bg-slate-50 border p-4"><div className="text-xs text-slate-400">Supply S</div><div className="text-2xl font-extrabold">{m.S.toFixed(1)} GW</div></div>
                <div className="rounded-2xl bg-slate-50 border p-4"><div className="text-xs text-slate-400">{t.reserve}</div><div className={`text-2xl font-extrabold ${reliable?"text-emerald-600":"text-rose-600"}`}>{(m.reserve*100).toFixed(1)}%</div></div>
                <div className="rounded-2xl bg-slate-50 border p-4"><div className="text-xs text-slate-400">{t.cost}</div><div className="text-2xl font-extrabold">{m.cost.toFixed(0)}</div></div>
                <div className="rounded-2xl bg-slate-50 border p-4"><div className="text-xs text-slate-400">{t.carbon}</div><div className="text-2xl font-extrabold">{m.carbon.toFixed(0)}</div></div>
              </div>

              <div className={`rounded-2xl p-4 text-sm border-2 mb-4 ${reliable ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"}`}>
                <div className="font-bold mb-1">{t.target}</div>
                {reliable ? t.ok : t.fail}
              </div>

              <div className="rounded-2xl bg-violet-50 border border-violet-100 p-4 text-sm mb-4">
                <div className="font-bold text-violet-800 mb-1"><i className="fa-solid fa-robot mr-2" />{t.coach}</div>
                {coach}
              </div>

              <div className={`rounded-2xl border p-4 text-sm ${challenge ? "bg-emerald-50 border-emerald-200" : "bg-slate-50"}`}>
                <div className="font-bold mb-1">{t.challenge}</div>
                <div className="font-mono text-xs">{challenge ? "✓ PASS" : "… in progress"}</div>
              </div>
            </section>
          </main>
          <footer className="text-center py-4 text-slate-500 text-xs border-t">Jeremiah 10:12 · SF Lau</footer>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
