<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misuse of Statistics | S6 Math 統計陷阱與資訊素養</title>
  <!--
    Curriculum: HKDSE Statistics — misuse of data representation
    NSE: Information literacy / resisting misleading charts (maths-first)
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
  <style>body{font-family:"Outfit","Noto Sans TC",sans-serif}</style>
</head>
<body class="bg-red-50 text-slate-800 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const translations = {
      en: {
        back: "← Form 6", lang: "中文",
        unit: "Statistics · Information literacy",
        title: "Misuse of Statistics",
        desc: "How truncated axes and cherry-picked baselines exaggerate differences.",
        mode: "Mode",
        honest: "Honest (start at 0)",
        misleading: "Misleading (truncated)",
        dataA: "Series A",
        dataB: "Series B",
        perception: "Perceived vs true difference",
        trueDiff: "True relative difference",
        visual: "Visual bar-height ratio (approx)",
        obj: "Objectives",
        k: "K: Axis scaling changes perception without changing data",
        s: "S: Compute relative change and detect truncation",
        a: "A: Refuse to share charts that fail integrity checks",
        ns: "NSE: Information literacy protects public judgement — maths critique, not slogans.",
        quiz: "Spot the trap",
        q1: "A chart starts the vertical axis at 82 instead of 0. What should you do first?",
        opts: ["Trust the dramatic gap", "Recompute (B−A)/A and redraw from 0", "Ignore the numbers"],
        ans: 1,
        scenarios: "Quick scenarios",
        sc1: "Clinic wait score 83 vs 87",
        sc2: "Pass rate 72% vs 76%",
        coach: "Share this? Only if the axis is honest and the claim matches the relative change.",
        link: "Open AI Modelling Coach → Misinfo lab"
      },
      zh: {
        back: "← 中六", lang: "ENG",
        unit: "統計 · 資訊素養",
        title: "統計的濫用",
        desc: "截斷座標軸與挑選基線如何誇大差異。",
        mode: "模式",
        honest: "誠實（由 0 起）",
        misleading: "誤導（截斷）",
        dataA: "數列 A",
        dataB: "數列 B",
        perception: "感知差異 vs 真實差異",
        trueDiff: "真實相對差異",
        visual: "視覺柱高比（約）",
        obj: "學習目標",
        k: "知：軸刻度可在不改數據下改變觀感",
        s: "技：計算相對變化並偵察截斷",
        a: "態：拒絕分享未通過誠信檢查的圖表",
        ns: "國家安全教育：資訊素養保障公眾判斷——數學批判，非口號。",
        quiz: "找出陷阱",
        q1: "圖表縱軸由 82 而非 0 開始。你應先做什麼？",
        opts: ["相信誇張差距", "重算 (B−A)/A 並由 0 重繪", "忽略數字"],
        ans: 1,
        scenarios: "快速情境",
        sc1: "診所等候分 83 vs 87",
        sc2: "合格率 72% vs 76%",
        coach: "要分享嗎？僅當軸誠實且說法符合相對變化。",
        link: "開啟 AI 建模教練 → 誤導圖表實驗"
      }
    };

    function App() {
      const [lang, setLang] = useState("en");
      const t = translations[lang];
      const [valA, setValA] = useState(87);
      const [valB, setValB] = useState(94);
      const [isTruncated, setIsTruncated] = useState(false);
      const [pick, setPick] = useState(null);

      const stats = useMemo(() => {
        const truePct = Math.abs(valB - valA) / Math.max(valA, 1) * 100;
        const maxVal = Math.max(valA, valB);
        const minVal = Math.min(valA, valB);
        const honestMax = maxVal * 1.2;
        const truncMin = minVal * 0.95;
        const truncMax = maxVal * 1.05;
        const currentMin = isTruncated ? truncMin : 0;
        const currentMax = isTruncated ? truncMax : honestMax;
        const h = 280;
        const norm = (v) => ((v - currentMin) / Math.max(currentMax - currentMin, 0.01)) * h;
        const hA = Math.max(2, norm(valA));
        const hB = Math.max(2, norm(valB));
        const visualRatio = Math.max(hA, hB) / Math.max(Math.min(hA, hB), 1);
        const trueRatio = Math.max(valA, valB) / Math.max(Math.min(valA, valB), 1);
        return { truePct, currentMin, currentMax, hA, hB, visualRatio, trueRatio, h };
      }, [valA, valB, isTruncated]);

      return (
        <div className="min-h-screen bg-gradient-to-br from-red-50 via-white to-orange-50">
          <a href="../index.html" className="fixed top-4 left-4 z-50 text-sm bg-white/90 px-3 py-1.5 rounded-lg border shadow-sm">{t.back}</a>
          <button onClick={() => setLang(lang === "en" ? "zh" : "en")} className="fixed top-4 right-4 z-50 text-sm font-bold text-red-600 bg-white/90 px-3 py-1.5 rounded-lg border">{t.lang}</button>

          <header className="max-w-4xl mx-auto pt-16 px-4 text-center">
            <div className="text-red-600 font-bold uppercase text-xs tracking-widest mb-2">{t.unit}</div>
            <h1 className="text-4xl font-extrabold text-slate-900 mb-2">{t.title}</h1>
            <p className="text-slate-500 mb-3">{t.desc}</p>
            <div className="flex flex-wrap justify-center gap-2 text-xs mb-2">
              <span className="bg-white px-3 py-1 rounded-full border">{t.k}</span>
              <span className="bg-white px-3 py-1 rounded-full border">{t.s}</span>
              <span className="bg-white px-3 py-1 rounded-full border">{t.a}</span>
            </div>
            <p className="text-xs text-slate-500">{t.ns}</p>
          </header>

          <main className="max-w-4xl mx-auto px-4 py-8 space-y-6">
            <div className="flex flex-wrap gap-2 justify-center">
              <span className="text-xs font-bold text-slate-400 self-center">{t.scenarios}:</span>
              <button onClick={() => { setValA(83); setValB(87); setIsTruncated(true); }} className="text-xs px-3 py-1.5 rounded-full bg-white border font-semibold hover:border-red-300">{t.sc1}</button>
              <button onClick={() => { setValA(72); setValB(76); setIsTruncated(true); }} className="text-xs px-3 py-1.5 rounded-full bg-white border font-semibold hover:border-red-300">{t.sc2}</button>
            </div>

            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl border border-red-100">
              <div className="flex justify-center mb-8">
                <div className="flex bg-slate-100 p-1 rounded-xl">
                  <button onClick={() => setIsTruncated(false)} className={`px-5 py-2 rounded-lg font-bold transition text-sm ${!isTruncated ? "bg-white text-emerald-600 shadow-sm" : "text-slate-400"}`}>{t.honest}</button>
                  <button onClick={() => setIsTruncated(true)} className={`px-5 py-2 rounded-lg font-bold transition text-sm flex items-center gap-2 ${isTruncated ? "bg-white text-red-600 shadow-sm" : "text-slate-400"}`}>
                    <i className="fa-solid fa-triangle-exclamation" />{t.misleading}
                  </button>
                </div>
              </div>

              <div className="flex justify-center items-end gap-12 md:gap-16 h-[320px] border-b-2 border-slate-200 px-4 relative">
                <div className="absolute left-0 top-0 bottom-0 flex flex-col justify-between text-xs text-slate-400 font-mono py-2">
                  <span>{stats.currentMax.toFixed(0)}</span>
                  <span>{((stats.currentMax + stats.currentMin) / 2).toFixed(0)}</span>
                  <span>{stats.currentMin.toFixed(0)}</span>
                </div>
                <div className="flex flex-col items-center gap-2">
                  <span className="font-bold font-mono text-slate-600">{valA}</span>
                  <div style={{ height: `${stats.hA}px`, width: "90px" }} className="bg-slate-400 rounded-t-xl transition-all duration-500" />
                  <span className="font-bold text-slate-500 text-xs uppercase mt-2">A</span>
                </div>
                <div className="flex flex-col items-center gap-2">
                  <span className="font-bold font-mono text-slate-600">{valB}</span>
                  <div style={{ height: `${stats.hB}px`, width: "90px" }} className="bg-blue-500 rounded-t-xl transition-all duration-500 shadow-lg shadow-blue-200" />
                  <span className="font-bold text-slate-500 text-xs uppercase mt-2">B</span>
                </div>
              </div>

              <div className="grid md:grid-cols-2 gap-4 mt-8">
                <div>
                  <div className="flex justify-between mb-1 text-sm"><label className="font-bold text-slate-500">{t.dataA}</label><span className="font-bold">{valA}</span></div>
                  <input type="range" min="50" max="150" value={valA} onChange={e => setValA(+e.target.value)} className="w-full accent-slate-500" />
                </div>
                <div>
                  <div className="flex justify-between mb-1 text-sm"><label className="font-bold text-slate-500">{t.dataB}</label><span className="font-bold text-blue-600">{valB}</span></div>
                  <input type="range" min="50" max="150" value={valB} onChange={e => setValB(+e.target.value)} className="w-full accent-blue-500" />
                </div>
              </div>

              <div className={`mt-6 p-4 rounded-xl text-center border-2 ${isTruncated ? "bg-red-50 border-red-200 text-red-700" : "bg-green-50 border-green-200 text-green-700"}`}>
                <div className="text-lg font-bold mb-1">{t.perception}</div>
                <div className="text-sm grid grid-cols-2 gap-2 mt-2">
                  <div><div className="text-xs opacity-70">{t.trueDiff}</div><div className="font-mono font-bold">{stats.truePct.toFixed(1)}%</div></div>
                  <div><div className="text-xs opacity-70">{t.visual}</div><div className="font-mono font-bold">×{stats.visualRatio.toFixed(2)}</div></div>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-3xl border shadow p-6">
              <div className="font-bold mb-2">{t.quiz}</div>
              <p className="text-sm mb-3">{t.q1}</p>
              <div className="flex flex-wrap gap-2">
                {t.opts.map((o, i) => (
                  <button key={o} onClick={() => setPick(i)} className={`text-left text-xs px-3 py-2 rounded-xl border font-semibold ${pick === i ? (i === t.ans ? "bg-emerald-600 text-white" : "bg-rose-100 text-rose-700") : "bg-slate-50"}`}>{o}</button>
                ))}
              </div>
              <p className="text-sm text-slate-600 mt-4">{t.coach}</p>
              <a href="../26_AI_Modelling_Coach/index.html" className="inline-block mt-3 text-sm font-bold text-red-600 underline">{t.link}</a>
            </div>
          </main>
          <footer className="text-center py-4 text-slate-500 text-xs border-t">Jeremiah 10:12 · SF Lau</footer>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
