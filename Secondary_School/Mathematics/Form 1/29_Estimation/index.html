<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estimation Jar | S1 Math 估算瓶</title>
  <!--
    Curriculum: Form 1 estimation strategies; measurement accuracy / percentage error (NSE data-accuracy enrichment)
    Objectives: K/S/A for estimation error percentage
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
  <style>body{font-family:"Outfit","Noto Sans TC",sans-serif}</style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const T = {
      en: {
        back: "← Form 1", lang: "中文", unit: "Unit 3: Data · Estimation",
        title: "Estimation Jar",
        desc: "Practise estimation strategies and measure percentage error.",
        k: "K: Estimation error = |estimate − actual| / actual × 100%",
        s: "S: Use grouping / sampling strategies before counting",
        a: "A: Value reasonable accuracy — good enough for decisions",
        hint: "Strategy tip: estimate a cluster, then multiply by how many clusters you see.",
        guess: "Your estimate",
        check: "Check",
        again: "New jar",
        actual: "Actual count",
        error: "Percentage error",
        great: "Excellent estimator!",
        ok: "Close — refine your strategy.",
        far: "Far off — try grouping next time.",
        rounds: "Rounds",
        avgErr: "Average |error| %"
      },
      zh: {
        back: "← 中一", lang: "ENG", unit: "單元三：數據 · 估算",
        title: "估算瓶",
        desc: "練習估算策略並計算百分誤差。",
        k: "知：估算誤差 = |估計 − 實際| / 實際 × 100%",
        s: "技：先用分組／抽樣策略再數",
        a: "態：重視合理準確度——足夠作決定即可",
        hint: "策略：估計一小簇，再乘以簇數。",
        guess: "你的估計",
        check: "檢查",
        again: "新瓶子",
        actual: "實際數量",
        error: "百分誤差",
        great: "估算高手！",
        ok: "接近——再優化策略。",
        far: "偏差大——下次試分組。",
        rounds: "回合",
        avgErr: "平均 |誤差| %"
      }
    };

    function App() {
      const [lang, setLang] = useState("en");
      const t = T[lang];
      const [count, setCount] = useState(0);
      const [guess, setGuess] = useState("");
      const [submitted, setSubmitted] = useState(false);
      const [candies, setCandies] = useState([]);
      const [history, setHistory] = useState([]);
      const colors = ["bg-red-500", "bg-green-500", "bg-blue-500", "bg-yellow-500", "bg-purple-500", "bg-pink-500"];

      const generate = () => {
        const n = Math.floor(Math.random() * 81) + 35;
        setCount(n);
        setSubmitted(false);
        setGuess("");
        setCandies(Array.from({ length: n }).map((_, i) => ({
          id: i,
          x: Math.random() * 78 + 11,
          y: Math.random() * 70 + 15,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * 360
        })));
      };

      useEffect(() => { generate(); }, []);

      const check = (e) => {
        e.preventDefault();
        if (!guess || submitted) return;
        const err = Math.abs(count - Number(guess)) / count * 100;
        setHistory(h => [...h, err]);
        setSubmitted(true);
      };

      const diff = Math.abs(count - Number(guess));
      const error = submitted ? (diff / count * 100) : 0;
      const avg = history.length ? history.reduce((a, b) => a + b, 0) / history.length : 0;
      const msg = error < 12 ? t.great : error < 28 ? t.ok : t.far;

      return (
        <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-50">
          <a href="../index.html" className="fixed top-4 left-4 z-50 text-sm bg-white/90 px-3 py-1.5 rounded-lg border shadow-sm">{t.back}</a>
          <button onClick={() => setLang(lang === "en" ? "zh" : "en")} className="fixed top-4 right-4 z-50 text-sm font-bold text-amber-700 bg-white/90 px-3 py-1.5 rounded-lg border">{t.lang}</button>

          <header className="max-w-4xl mx-auto pt-16 px-4 text-center">
            <div className="text-amber-600 font-bold uppercase text-xs tracking-widest mb-2">{t.unit}</div>
            <h1 className="text-4xl font-extrabold text-slate-900 mb-2">{t.title}</h1>
            <p className="text-slate-500 mb-3">{t.desc}</p>
            <div className="flex flex-wrap justify-center gap-2 text-xs">
              <span className="bg-white px-3 py-1 rounded-full border">{t.k}</span>
              <span className="bg-white px-3 py-1 rounded-full border">{t.s}</span>
              <span className="bg-white px-3 py-1 rounded-full border">{t.a}</span>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 py-8 flex flex-col md:flex-row items-center gap-10">
            <div className="relative w-64 h-80 bg-gradient-to-b from-amber-100 to-amber-200 rounded-[40%] border-4 border-amber-300 shadow-inner overflow-hidden">
              {candies.map(c => (
                <div key={c.id} className={`absolute w-3 h-3 rounded-full ${c.color} opacity-90`} style={{ left: `${c.x}%`, top: `${c.y}%`, transform: `rotate(${c.rot}deg)` }} />
              ))}
              <div className="absolute bottom-2 left-0 right-0 text-center text-[10px] text-amber-800/60 font-bold">JAR</div>
            </div>

            <div className="flex-1 w-full space-y-4">
              <p className="text-sm text-amber-900 bg-amber-100/80 rounded-xl p-3 border border-amber-200">{t.hint}</p>
              <form onSubmit={check} className="bg-white rounded-2xl border shadow p-5 space-y-3">
                <label className="text-sm font-bold text-slate-500">{t.guess}</label>
                <input type="number" value={guess} onChange={e => setGuess(e.target.value)} className="w-full border rounded-xl px-4 py-3 font-mono text-xl" disabled={submitted} />
                <div className="flex gap-2">
                  <button type="submit" disabled={submitted || !guess} className="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl disabled:opacity-40">{t.check}</button>
                  <button type="button" onClick={generate} className="px-4 py-3 rounded-xl border font-bold bg-white">{t.again}</button>
                </div>
              </form>

              {submitted && (
                <div className="bg-white rounded-2xl border shadow p-5 space-y-2">
                  <div className="flex justify-between"><span className="text-slate-500">{t.actual}</span><span className="font-mono font-bold text-2xl">{count}</span></div>
                  <div className="flex justify-between"><span className="text-slate-500">{t.error}</span><span className="font-mono font-bold text-2xl text-amber-700">{error.toFixed(1)}%</span></div>
                  <p className="text-sm font-bold text-slate-700 pt-2">{msg}</p>
                </div>
              )}

              <div className="grid grid-cols-2 gap-3 text-center">
                <div className="bg-white rounded-xl border p-3"><div className="text-xs text-slate-400">{t.rounds}</div><div className="text-xl font-extrabold">{history.length}</div></div>
                <div className="bg-white rounded-xl border p-3"><div className="text-xs text-slate-400">{t.avgErr}</div><div className="text-xl font-extrabold">{avg.toFixed(1)}</div></div>
              </div>
            </div>
          </main>
          <footer className="text-center py-4 text-slate-500 text-xs border-t">Jeremiah 10:12 · SF Lau</footer>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
