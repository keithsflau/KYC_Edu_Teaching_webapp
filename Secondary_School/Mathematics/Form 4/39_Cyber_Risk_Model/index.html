<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Risk Probability Model | S4 Math 網絡風險概率模型</title>
  <!--
    Curriculum Alignment
    - Audience: Form 4
    - Curriculum: HKDSE Probability (tree diagrams, independent events); NSE Data / Tech Security via probability literacy — fictional phishing rates
    - Objectives: K — compound probability; S — build risk tree; A — practise cyber hygiene with evidence
    - NS: Data Security / Tech Security via probability literacy (phishing risk) — maths-first
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
  <style>body{font-family:"Outfit","Noto Sans TC",sans-serif}</style>
</head>
<body class="bg-indigo-50 min-h-screen text-slate-800">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const C = {
      en: {
        back: "← Form 4", lang: "中文", badge: "Probability · Data Security",
        title: "Cyber Risk Probability Model",
        sub: "Tree-diagram model of phishing → click → credential loss",
        k: "K: P(A∩B) = P(A)·P(B|A) along a path",
        s: "S: Adjust branch probabilities and compare defence strategies",
        a: "A: Use probability to justify safer digital habits",
        ns: "NSE (Data / Tech Security): Quantify phishing risk — pedagogical, maths-first.",
        pPhish: "P(receive phishing mail)",
        pClick: "P(click | phishing)",
        pCred: "P(enter credentials | click)",
        defence: "Defence mode",
        none: "No training",
        train: "Staff training (−45% click)",
        mfa: "MFA (+blocks 82% credential loss)",
        both: "Training + MFA",
        breach: "P(account compromise)",
        safe: "P(no compromise) = 1 − P(breach)",
        tree: "Risk tree",
        coach: "AI coach says",
        interpret: "Interpretation",
        quizQ: "If training halves click rate, what happens to breach probability (other probs fixed)?",
        quizA: ["Unchanged", "It halves (along that path)", "It doubles"],
        quizOk: 1
      },
      zh: {
        back: "← 中四", lang: "ENG", badge: "概率 · 數據安全",
        title: "網絡風險概率模型",
        sub: "釣魚郵件 → 點擊 → 憑證外洩的樹形圖模型",
        k: "知：路徑上 P(A∩B)=P(A)·P(B|A)",
        s: "技：調校分支概率並比較防衛策略",
        a: "態：用概率理據支持更安全的數碼習慣",
        ns: "國家安全教育（數據／科技安全）：量化釣魚風險——教學為本、數學為先。",
        pPhish: "P(收到釣魚郵件)",
        pClick: "P(點擊 | 釣魚)",
        pCred: "P(輸入憑證 | 點擊)",
        defence: "防衛模式",
        none: "無培訓",
        train: "員工培訓（點擊 −45%）",
        mfa: "多重認證（阻截 82% 憑證損失）",
        both: "培訓 + MFA",
        breach: "P(帳戶被入侵)",
        safe: "P(未入侵) = 1 − P(入侵)",
        tree: "風險樹",
        coach: "AI 教練",
        interpret: "詮釋",
        quizQ: "若培訓使點擊率減半，其他概率不變，入侵概率如何？",
        quizA: ["不變", "沿該路徑減半", "加倍"],
        quizOk: 1
      }
    };

    function App() {
      const [lang, setLang] = useState("en");
      const t = C[lang];
      const [pPhish, setPPhish] = useState(0.42);
      const [pClick, setPClick] = useState(0.22);
      const [pCred, setPCred] = useState(0.38);
      const [mode, setMode] = useState("none");
      const [pick, setPick] = useState(null);

      const calc = useMemo(() => {
        let click = pClick;
        let cred = pCred;
        if (mode === "train" || mode === "both") click *= 0.55;
        if (mode === "mfa" || mode === "both") cred *= 0.18;
        const breach = pPhish * click * cred;
        return { click, cred, breach, safe: 1 - breach };
      }, [pPhish, pClick, pCred, mode]);

      const coachMsg = useMemo(() => {
        if (calc.breach > 0.06) return lang === "en"
          ? "Breach risk > 6%. Layered defence (training + MFA) usually beats changing one branch alone."
          : "入侵風險 > 6%。分層防衛（培訓+MFA）通常優於只改單一分支。";
        if (mode === "none") return lang === "en"
          ? "Risk looks low under current numbers — still test a worse phishing wave (raise P(phish))."
          : "現時數字風險偏低——仍應測試更差的釣魚潮（提高 P(釣魚)）。";
        return lang === "en"
          ? "Good: you reduced conditional probabilities. State assumptions clearly in your write-up."
          : "很好：你降低了條件概率。寫報告時請清楚列出假設。";
      }, [calc.breach, mode, lang]);

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-slate-50 to-violet-50">
          <a href="../index.html" className="fixed top-4 left-4 z-50 text-sm bg-white/90 px-3 py-1.5 rounded-lg border shadow-sm">{t.back}</a>
          <button onClick={() => setLang(lang === "en" ? "zh" : "en")} className="fixed top-4 right-4 z-50 text-sm font-bold text-indigo-700 bg-white/90 px-3 py-1.5 rounded-lg border">{t.lang}</button>

          <header className="max-w-5xl mx-auto pt-16 px-4 text-center">
            <div className="text-indigo-700 text-xs font-bold tracking-widest uppercase mb-2">{t.badge}</div>
            <h1 className="text-3xl md:text-5xl font-extrabold mb-2">{t.title}</h1>
            <p className="text-slate-500">{t.sub}</p>
            <div className="mt-4 flex flex-wrap justify-center gap-2 text-xs">
              <span className="bg-white px-3 py-1 rounded-full border">{t.k}</span>
              <span className="bg-white px-3 py-1 rounded-full border">{t.s}</span>
              <span className="bg-white px-3 py-1 rounded-full border">{t.a}</span>
            </div>
            <p className="text-xs text-slate-500 mt-3 max-w-2xl mx-auto">{t.ns}</p>
          </header>

          <main className="max-w-5xl mx-auto px-4 py-8 grid lg:grid-cols-2 gap-6">
            <section className="bg-white rounded-3xl shadow-xl border p-6 space-y-5">
              {[
                [t.pPhish, pPhish, setPPhish],
                [t.pClick, pClick, setPClick],
                [t.pCred, pCred, setPCred]
              ].map(([label, val, set]) => (
                <div key={label}>
                  <div className="flex justify-between text-sm mb-1"><span className="font-bold text-slate-500">{label}</span><span className="font-mono font-bold">{(val * 100).toFixed(0)}%</span></div>
                  <input type="range" min="5" max="80" value={Math.round(val * 100)} onChange={e => set(+e.target.value / 100)} className="w-full accent-indigo-600" />
                </div>
              ))}
              <div>
                <div className="text-sm font-bold text-slate-500 mb-2">{t.defence}</div>
                <div className="grid grid-cols-2 gap-2">
                  {[["none", t.none], ["train", t.train], ["mfa", t.mfa], ["both", t.both]].map(([id, label]) => (
                    <button key={id} onClick={() => setMode(id)} className={`text-left text-xs p-3 rounded-xl border font-semibold ${mode === id ? "bg-indigo-600 text-white border-indigo-600" : "bg-slate-50 border-slate-200"}`}>{label}</button>
                  ))}
                </div>
              </div>
            </section>

            <section className="bg-white rounded-3xl shadow-xl border p-6">
              <h3 className="font-bold text-slate-500 text-xs uppercase tracking-widest mb-4">{t.tree}</h3>
              <div className="space-y-3 font-mono text-sm">
                <div className="flex items-center gap-2"><span className="w-28 text-slate-400">Phish</span><div className="flex-1 h-3 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-amber-400" style={{width:`${pPhish*100}%`}}/></div><span>{(pPhish*100).toFixed(0)}%</span></div>
                <div className="flex items-center gap-2 pl-4"><span className="w-24 text-slate-400">Click</span><div className="flex-1 h-3 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-orange-500" style={{width:`${calc.click*100}%`}}/></div><span>{(calc.click*100).toFixed(0)}%</span></div>
                <div className="flex items-center gap-2 pl-8"><span className="w-20 text-slate-400">Cred</span><div className="flex-1 h-3 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-rose-500" style={{width:`${calc.cred*100}%`}}/></div><span>{(calc.cred*100).toFixed(0)}%</span></div>
              </div>
              <div className="mt-6 rounded-2xl bg-slate-900 text-center p-6">
                <div className="text-indigo-300 text-xs uppercase tracking-widest mb-1">{t.breach}</div>
                <div className="text-4xl font-extrabold text-white">{(calc.breach * 100).toFixed(2)}%</div>
                <div className="text-slate-400 text-xs mt-2 font-mono">= {(pPhish).toFixed(2)} × {calc.click.toFixed(2)} × {calc.cred.toFixed(2)}</div>
                <div className="text-emerald-300/90 text-xs mt-3 font-mono">{t.safe} ≈ {(calc.safe * 100).toFixed(2)}%</div>
              </div>
              <div className={`mt-4 rounded-2xl p-4 text-sm border-2 ${calc.breach > 0.06 ? "bg-rose-50 border-rose-200 text-rose-800" : "bg-emerald-50 border-emerald-200 text-emerald-800"}`}>
                <div className="font-bold mb-1">{t.interpret}</div>
                {lang === "en"
                  ? `Under this joint model, about ${(calc.breach * 1000).toFixed(1)} in 1000 users are compromised (path product — not conditional on already receiving phishing).`
                  : `在此聯合概率模型下，約每 1000 名用戶有 ${(calc.breach * 1000).toFixed(1)} 人被入侵（路徑乘積——並非以「已收到釣魚」為條件）。`}
              </div>
              <div className="mt-4 rounded-2xl bg-violet-50 border border-violet-100 p-4 text-sm">
                <div className="font-bold text-violet-800 mb-1"><i className="fa-solid fa-robot mr-2" />{t.coach}</div>
                {coachMsg}
              </div>
              <div className="mt-4 border-t pt-4">
                <p className="text-sm mb-2">{t.quizQ}</p>
                <div className="flex flex-wrap gap-2">
                  {t.quizA.map((o, i) => (
                    <button key={o} onClick={() => setPick(i)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border ${pick===i ? (i===t.quizOk?"bg-emerald-600 text-white":"bg-rose-100 text-rose-700") : "bg-white"}`}>{o}</button>
                  ))}
                </div>
              </div>
            </section>
          </main>
          <footer className="text-center py-4 text-slate-500 text-xs border-t">Jeremiah 10:12 · SF Lau</footer>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
