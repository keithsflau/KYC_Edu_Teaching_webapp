<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mathematical Modelling Cycle | S2 Math 數學建模循環</title>
  <!--
    Curriculum Alignment
    - Audience: Form 2 (Junior Secondary)
    - Curriculum: HK junior secondary — rates, linear relations, modelling cycle (enrichment); NSE societal resilience via crowd-flow planning
    - Learning objectives:
      1. [Knowledge] Name the stages of the mathematical modelling cycle.
      2. [Skill] Build a simple linear rate model for MTR passenger flow and interpret results.
      3. [Attitude] Appreciate that models rest on assumptions and need refinement.
    - Interaction: learn + practice | National security link: societal resilience via crowd-flow planning (enrichment)
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Outfit", "Noto Sans TC", sans-serif; }
    .step-dot { transition: transform .25s ease, background .25s ease; }
    .step-dot.active { transform: scale(1.15); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const T = {
      en: {
        back: "← Form 2",
        badge: "Unit: Modelling · Rates",
        title: "Mathematical Modelling Cycle",
        subtitle: "Real problem → assumptions → model → solve → interpret → refine",
        objectives: "Learning objectives",
        k: "Know the 6 stages of the modelling cycle",
        s: "Build a linear rate model for station passenger flow",
        a: "Question assumptions and refine the model",
        success: "Success: complete all stages and keep queue under target",
        ns: "NS note (enrichment): orderly transport planning supports societal resilience — maths-first, not slogans.",
        stages: ["Real problem", "Assumptions", "Math model", "Solve", "Interpret", "Refine"],
        stageHelp: [
          "Describe the real-world situation clearly.",
          "Choose which quantities to include or ignore.",
          "Translate ideas into equations or formulas.",
          "Compute numerical results from your model.",
          "Explain what the numbers mean in context.",
          "Change assumptions and improve the model."
        ],
        scenario: "Scenario: Evening peak at an MTR station",
        problem: "Passengers arrive faster than they leave through the gates. Will a queue form? How long after peak starts?",
        arrive: "Arrival rate (people / min)",
        leave: "Exit capacity (people / min)",
        startQ: "Initial queue",
        duration: "Minutes of peak",
        target: "Safe queue target",
        net: "Net rate",
        after: "Queue after peak",
        timeToTarget: "Minutes to hit target (if growing)",
        interpretGood: "Capacity covers arrivals — queue shrinks or stays safe.",
        interpretBad: "Arrivals exceed exits — queue grows. Refine: add staff, open gates, or stagger arrivals.",
        refineTip: "Try raising exit capacity or lowering arrival rate, then re-solve.",
        quiz: "Quick check",
        q1: "Which stage turns a story into an equation?",
        o1: ["Interpret", "Math model", "Real problem"],
        a1: 1,
        next: "Next stage →",
        prev: "← Prev",
        lang: "中文"
      },
      zh: {
        back: "← 中二",
        badge: "單元：建模 · 速率",
        title: "數學建模循環",
        subtitle: "現實問題 → 假設 → 數學模型 → 求解 → 詮釋 → 修正",
        objectives: "學習目標",
        k: "認識建模循環的六個階段",
        s: "為車站人流建立線性速率模型",
        a: "質疑假設並修正模型",
        success: "成功標準：完成各階段，並把排隊人數控制在目標內",
        ns: "國安 enrichment：有序交通規劃有助社會韌性——以數學為先，非口號。",
        stages: ["現實問題", "假設", "數學模型", "求解", "詮釋", "修正"],
        stageHelp: [
          "清楚描述現實情境。",
          "決定納入或忽略哪些量。",
          "把想法翻譯成方程式／公式。",
          "由模型計算數值結果。",
          "解釋數字在情境中的意義。",
          "改變假設以改進模型。"
        ],
        scenario: "情境：港鐵站晚高峰",
        problem: "乘客到達速率高於閘機離開速率。會否形成人龍？高峰開始後多久達標？",
        arrive: "到達速率（人／分鐘）",
        leave: "離開容量（人／分鐘）",
        startQ: "初始排隊人數",
        duration: "高峰持續分鐘",
        target: "安全排隊目標",
        net: "淨速率",
        after: "高峰後排隊人數",
        timeToTarget: "達標所需分鐘（若上升）",
        interpretGood: "容量足夠——人龍縮減或維持安全。",
        interpretBad: "到達超過離開——人龍增長。修正：加人手、開閘、或錯峰。",
        refineTip: "試提高離開容量或降低到達速率，再重新求解。",
        quiz: "小測",
        q1: "哪一階段把故事變成方程式？",
        o1: ["詮釋", "數學模型", "現實問題"],
        a1: 1,
        next: "下一階段 →",
        prev: "← 上一階段",
        lang: "ENG"
      }
    };

    function App() {
      const [lang, setLang] = useState("en");
      const t = T[lang];
      const [step, setStep] = useState(0);
      const [arrive, setArrive] = useState(53);
      const [leave, setLeave] = useState(41);
      const [q0, setQ0] = useState(14);
      const [mins, setMins] = useState(18);
      const [target, setTarget] = useState(95);
      const [quizPick, setQuizPick] = useState(null);
      const [assumps, setAssumps] = useState({ constant: true, ignoreTransfer: true, singleGate: false });

      const model = useMemo(() => {
        // Assumptions change effective rates (so Stage 2 is not cosmetic).
        let rin = arrive;
        let rout = leave;
        if (!assumps.constant) {
          // Non-constant peak: average arrival ~10% higher over the window
          rin = arrive * 1.1;
        }
        if (!assumps.ignoreTransfer) {
          // Interchange adds extra arrivals (fictional sim constant)
          rin = rin + 9;
        }
        if (assumps.singleGate) {
          // One gate bank ≈ 65% of full exit capacity
          rout = leave * 0.65;
        }
        rin = Math.round(rin * 10) / 10;
        rout = Math.round(rout * 10) / 10;
        const net = rin - rout;
        const qEnd = Math.max(0, q0 + net * mins);
        let tHit = null;
        if (net > 0 && q0 < target) tHit = (target - q0) / net;
        else if (net <= 0) tHit = null;
        return { net, qEnd, tHit, rin, rout, formula: `Q(t) = ${q0} + (${rin} − ${rout})t` };
      }, [arrive, leave, q0, mins, target, assumps]);

      const safe = model.qEnd <= target;

      return (
        <div className="min-h-screen bg-gradient-to-br from-emerald-50 via-slate-50 to-sky-50">
          <a href="../index.html" className="fixed top-4 left-4 z-50 text-sm text-slate-600 hover:text-emerald-700 bg-white/90 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">{t.back}</a>
          <button onClick={() => setLang(lang === "en" ? "zh" : "en")} className="fixed top-4 right-4 z-50 text-sm font-bold text-emerald-700 bg-white/90 px-3 py-1.5 rounded-lg border border-emerald-200 shadow-sm">
            <i className="fa-solid fa-globe mr-1" />{t.lang}
          </button>

          <header className="max-w-5xl mx-auto pt-16 px-4 text-center">
            <div className="inline-block text-emerald-700 text-xs font-bold tracking-widest uppercase mb-2">{t.badge}</div>
            <h1 className="text-3xl md:text-5xl font-extrabold text-slate-900 mb-2">{t.title}</h1>
            <p className="text-slate-500 max-w-2xl mx-auto">{t.subtitle}</p>
          </header>

          <div className="max-w-5xl mx-auto px-4 mt-6 grid md:grid-cols-3 gap-3 text-sm">
            <div className="bg-white/80 rounded-2xl p-4 border border-emerald-100 shadow-sm"><span className="font-bold text-emerald-700">K</span> {t.k}</div>
            <div className="bg-white/80 rounded-2xl p-4 border border-sky-100 shadow-sm"><span className="font-bold text-sky-700">S</span> {t.s}</div>
            <div className="bg-white/80 rounded-2xl p-4 border border-amber-100 shadow-sm"><span className="font-bold text-amber-700">A</span> {t.a}</div>
          </div>
          <p className="max-w-5xl mx-auto px-4 mt-3 text-xs text-slate-500">{t.success} · {t.ns}</p>

          {/* Cycle stepper */}
          <div className="max-w-5xl mx-auto px-4 mt-8 flex flex-wrap justify-center gap-2">
            {t.stages.map((name, i) => (
              <button key={name} onClick={() => setStep(i)} className={`step-dot px-3 py-2 rounded-xl text-xs md:text-sm font-bold border ${step === i ? "active bg-emerald-600 text-white border-emerald-600" : "bg-white text-slate-600 border-slate-200 hover:border-emerald-300"}`}>
                {i + 1}. {name}
              </button>
            ))}
          </div>

          <main className="max-w-5xl mx-auto px-4 py-8 grid lg:grid-cols-2 gap-6">
            <section className="bg-white rounded-3xl shadow-xl border border-slate-100 p-6">
              <h2 className="font-bold text-lg text-slate-800 mb-1">{t.stages[step]}</h2>
              <p className="text-sm text-slate-500 mb-4">{t.stageHelp[step]}</p>

              {step === 0 && (
                <div className="space-y-3">
                  <div className="text-emerald-700 font-bold text-sm">{t.scenario}</div>
                  <p className="text-slate-700 leading-relaxed">{t.problem}</p>
                  <div className="rounded-2xl bg-slate-900 text-emerald-300 p-4 font-mono text-sm">
                    Context: HK MTR evening peak · people/min rates
                  </div>
                </div>
              )}

              {step === 1 && (
                <div className="space-y-3">
                  {[
                    ["constant", lang === "en" ? "Arrival & exit rates constant during peak" : "高峰期間到達／離開速率不變"],
                    ["ignoreTransfer", lang === "en" ? "Ignore interchanging passengers for now" : "暫時忽略轉車乘客"],
                    ["singleGate", lang === "en" ? "Model one bank of gates only" : "只模擬一組閘機"]
                  ].map(([key, label]) => (
                    <label key={key} className="flex items-center gap-3 p-3 rounded-xl border border-slate-100 hover:bg-emerald-50 cursor-pointer">
                      <input type="checkbox" checked={assumps[key]} onChange={() => setAssumps({ ...assumps, [key]: !assumps[key] })} className="accent-emerald-600 w-4 h-4" />
                      <span className="text-sm">{label}</span>
                    </label>
                  ))}
                </div>
              )}

              {step === 2 && (
                <div className="space-y-4">
                  <div className="rounded-2xl bg-emerald-50 border border-emerald-100 p-4 font-mono text-center text-lg">
                    Q(t) = Q₀ + (r<sub>in</sub> − r<sub>out</sub>) t
                  </div>
                  <p className="text-sm text-slate-600">{lang === "en" ? "Linear rate model: queue grows when net rate is positive." : "線性速率模型：淨速率為正時人龍增長。"}</p>
                  <div className="text-xs text-slate-400 font-mono">{model.formula}</div>
                </div>
              )}

              {(step === 3 || step === 4 || step === 5) && (
                <div className="space-y-4">
                  {[
                    [t.arrive, arrive, setArrive, 10, 80],
                    [t.leave, leave, setLeave, 10, 80],
                    [t.startQ, q0, setQ0, 0, 100],
                    [t.duration, mins, setMins, 5, 40],
                    [t.target, target, setTarget, 30, 200]
                  ].map(([label, val, setter, min, max]) => (
                    <div key={label}>
                      <div className="flex justify-between text-sm mb-1"><span className="font-bold text-slate-500">{label}</span><span className="font-mono font-bold">{val}</span></div>
                      <input type="range" min={min} max={max} value={val} onChange={e => setter(+e.target.value)} className="w-full accent-emerald-600" />
                    </div>
                  ))}
                </div>
              )}
            </section>

            <section className="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 flex flex-col">
              <h3 className="font-bold text-slate-500 text-xs uppercase tracking-widest mb-4">Live dashboard</h3>
              <div className="grid grid-cols-2 gap-3 mb-4">
                <div className="rounded-2xl bg-slate-50 p-4 border">
                  <div className="text-xs text-slate-400">{t.net}</div>
                  <div className={`text-2xl font-extrabold ${model.net > 0 ? "text-rose-600" : "text-emerald-600"}`}>{model.net > 0 ? "+" : ""}{model.net}/min</div>
                </div>
                <div className="rounded-2xl bg-slate-50 p-4 border">
                  <div className="text-xs text-slate-400">{t.after}</div>
                  <div className="text-2xl font-extrabold text-slate-800">{Math.round(model.qEnd)}</div>
                </div>
              </div>

              <div className="relative h-8 bg-slate-100 rounded-full overflow-hidden mb-2">
                <div className={`h-full transition-all duration-500 ${safe ? "bg-emerald-500" : "bg-rose-500"}`} style={{ width: `${Math.min(100, (model.qEnd / (target * 1.5)) * 100)}%` }} />
                <div className="absolute top-0 bottom-0 border-r-2 border-dashed border-amber-500" style={{ left: `${Math.min(100, (target / (target * 1.5)) * 100)}%` }} title="target" />
              </div>
              <p className="text-xs text-slate-400 mb-4">{t.target}: {target} · {t.timeToTarget}: {model.tHit == null ? "—" : model.tHit.toFixed(1)}</p>

              <div className={`rounded-2xl p-4 text-sm border-2 mb-4 ${safe ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"}`}>
                {step >= 4 ? (safe ? t.interpretGood : t.interpretBad) : (lang === "en" ? "Advance to Interpret to read the result." : "前往「詮釋」階段解讀結果。")}
              </div>
              {step === 5 && <p className="text-sm text-amber-700 bg-amber-50 rounded-xl p-3 border border-amber-100 mb-4">{t.refineTip}</p>}

              <div className="mt-auto border-t pt-4">
                <div className="font-bold text-sm mb-2">{t.quiz}</div>
                <p className="text-sm mb-2">{t.q1}</p>
                <div className="flex flex-wrap gap-2">
                  {t.o1.map((opt, i) => (
                    <button key={opt} onClick={() => setQuizPick(i)} className={`px-3 py-1.5 rounded-lg text-sm border font-semibold ${quizPick === i ? (i === t.a1 ? "bg-emerald-600 text-white border-emerald-600" : "bg-rose-100 text-rose-700 border-rose-300") : "bg-white border-slate-200"}`}>{opt}</button>
                  ))}
                </div>
                {quizPick !== null && <p className="text-xs mt-2 text-slate-500">{quizPick === t.a1 ? "✓" : "→ Math model / 數學模型"}</p>}
              </div>
            </section>
          </main>

          <div className="max-w-5xl mx-auto px-4 pb-12 flex justify-between">
            <button disabled={step === 0} onClick={() => setStep(s => s - 1)} className="px-4 py-2 rounded-xl bg-white border shadow-sm disabled:opacity-40 font-bold text-sm">{t.prev}</button>
            <button disabled={step === 5} onClick={() => setStep(s => s + 1)} className="px-4 py-2 rounded-xl bg-emerald-600 text-white shadow-sm disabled:opacity-40 font-bold text-sm">{t.next}</button>
          </div>

          <footer className="text-center py-4 text-slate-500 text-xs border-t">Jeremiah 10:12 · SF Lau · Education Engineering</footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
