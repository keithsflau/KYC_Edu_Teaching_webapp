<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程目錄 · Curriculum</title>
  <meta name="description" content="揀小學或中學課程入口。科目目錄已改為按學段瀏覽。">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Inter", sans-serif; background-color: #f8fafc; }
    .level-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .level-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
    }
  </style>
  <link rel="stylesheet" href="../_shared/ncs-i18n.css" />
  <script src="../_shared/ncs-i18n.js"></script>
</head>
<body class="min-h-screen text-slate-800">
  <div id="ncs-lang-switcher"></div>
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-8 text-center">
      <p class="text-sm font-medium text-indigo-600 mb-2">課程目錄 · Curriculum</p>
      <h1 class="text-3xl font-bold text-slate-900">揀學段開始瀏覽</h1>
      <p class="text-slate-500 mt-2 max-w-xl mx-auto">
        呢頁唔再列出全部科目。請揀 <strong>小學</strong> 或 <strong>中學</strong> 課程入口，再按科目揀課。
        <span class="block mt-1 text-sm">This page no longer lists every subject — choose Primary or Secondary to browse by level.</span>
      </p>
      <a href="../index.html" class="inline-flex items-center mt-5 text-sm text-slate-500 hover:text-indigo-600 transition-colors">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        返回主頁 · Back to home
      </a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
    <div class="grid gap-6 sm:grid-cols-2">
      <a href="../Primary_School/index.html" class="level-card block bg-white rounded-2xl border border-slate-200 p-8 text-center group">
        <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 group-hover:text-blue-600 transition-colors">小學課程</h2>
        <p class="text-slate-500 mt-1">Primary</p>
        <p class="text-sm text-slate-400 mt-3">常識、中文、數學、英文等</p>
      </a>

      <a href="../Secondary_School/index.html" class="level-card block bg-white rounded-2xl border border-slate-200 p-8 text-center group">
        <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">中學課程</h2>
        <p class="text-slate-500 mt-1">Secondary</p>
        <p class="text-sm text-slate-400 mt-3">理科、ICT、中文、地理、歷史等</p>
      </a>
    </div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var level = params.get('section') || params.get('tab');
      if (level === 'primary') {
        window.location.replace('../Primary_School/index.html');
      } else if (level === 'secondary') {
        window.location.replace('../Secondary_School/index.html');
      }
    })();
    NcsI18n.mountSwitcher("#ncs-lang-switcher");
  </script>
</body>
</html>
