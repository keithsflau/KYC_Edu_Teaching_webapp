<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方案與收費 | HK STEAM AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif; }
  </style>
  <link rel="stylesheet" href="../_shared/ncs-i18n.css" />
  <script src="../_shared/ncs-i18n.js"></script>
  <script src="../common/billing-config.js"></script>
  <script src="../common/entitlement.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-10 sm:py-16">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <a href="../Secondary_School/index.html" class="text-sm text-indigo-600 hover:underline font-semibold" data-i18n="back"></a>
      <div id="ncs-lang-switcher"></div>
    </div>

    <header class="text-center mt-8 mb-12">
      <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-slate-900" data-i18n="title"></h1>
      <p class="mt-3 text-slate-500 max-w-2xl mx-auto text-sm sm:text-base leading-relaxed" data-i18n="lead"></p>
    </header>

    <section id="payment-links" class="scroll-mt-8">
      <div class="mb-8 rounded-2xl border border-emerald-200 bg-emerald-50/70 p-5 sm:p-6">
        <h2 class="text-base font-bold text-emerald-900" data-i18n="packTitle"></h2>
        <p class="mt-2 text-sm text-emerald-800 leading-relaxed" data-i18n="packBody"></p>
        <ul class="mt-3 text-xs text-emerald-900/80 space-y-1 list-disc list-inside">
          <li data-i18n="pack1"></li>
          <li data-i18n="pack2"></li>
          <li data-i18n="pack3"></li>
          <li data-i18n="pack4"></li>
          <li data-i18n="pack5"></li>
          <li data-i18n="pack6"></li>
        </ul>
      </div>

      <div id="plan-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4"></div>

      <div id="coming-soon" class="hidden mt-10 rounded-2xl border-2 border-dashed border-indigo-200 bg-indigo-50/60 p-6 sm:p-8 text-center">
        <h2 class="text-lg font-bold text-indigo-900" data-i18n="soonTitle"></h2>
        <p class="mt-2 text-sm text-indigo-700 leading-relaxed max-w-xl mx-auto">
          <span data-i18n="soonBody"></span>
          <a class="font-bold underline" href="mailto:support@hksteamai.com">support@hksteamai.com</a>
        </p>
      </div>

      <div class="mt-8 rounded-2xl bg-white border border-slate-200 p-6 sm:p-8 shadow-sm">
        <h2 class="text-base font-bold text-slate-800" data-i18n="tryTitle"></h2>
        <ul class="mt-3 space-y-2 text-sm text-slate-600 leading-relaxed list-disc list-inside">
          <li data-i18n="try1"></li>
          <li data-i18n="try2"></li>
          <li data-i18n="try3"></li>
        </ul>
      </div>

      <div class="mt-8 rounded-2xl border border-teal-200 bg-teal-50/50 p-6 sm:p-8">
        <h2 class="text-base font-bold text-teal-900" data-i18n="portalTitle"></h2>
        <p class="mt-2 text-sm text-teal-800 leading-relaxed" data-i18n="portalLead"></p>
        <div class="mt-4 flex flex-wrap gap-3">
          <a href="http://localhost:3000/register" class="inline-flex min-h-[44px] items-center justify-center rounded-xl bg-teal-700 px-4 text-sm font-bold text-white hover:bg-teal-800" data-i18n="portalRegister"></a>
          <a href="http://localhost:3000/login" class="inline-flex min-h-[44px] items-center justify-center rounded-xl border border-teal-300 bg-white px-4 text-sm font-bold text-teal-900 hover:bg-teal-50" data-i18n="portalLogin"></a>
          <a href="http://localhost:3000/library" class="inline-flex min-h-[44px] items-center justify-center rounded-xl border border-slate-300 bg-white px-4 text-sm font-bold text-slate-700 hover:bg-slate-50" data-i18n="portalLibrary"></a>
        </div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var I18N = {
        zh: {
          back: "← 返回資源目錄",
          title: "方案與收費",
          lead: "所有核心學習與「由零開始學」內容一律免費。訂閱可解鎖無限練習、完整錯題本與家長進度報告。",
          soonTitle: "訂閱暫時未能連線",
          soonBody: "訂閱經 Stripe 安全付款；localhost 為測試模式。請稍後再試，或查詢學校／家庭方案請電郵 ",
          tryTitle: "而家就可以免費試用",
          try1: "每個應用程式每日有免費練習額度；「由零開始學」故事板永不鎖上。",
          try2: "應用程式內可用「14 日試用（測試模式）」按鈕即時解鎖進階功能，無需信用卡。",
          try3: "所有進度只儲存在本機裝置，無需登入。",
          portalTitle: "家長帳戶",
          portalLead: "訂閱前可先註冊帳戶，登入後瀏覽完整課程庫並管理子女檔案（平台：localhost:3000）。",
          portalRegister: "註冊",
          portalLogin: "登入",
          portalLibrary: "課程庫",
          popular: "最受歡迎",
          tbc: "待定",
          feat1: "✓ 無限練習",
          feat2: "✓ 完整錯題本",
          feat3: "✓ 家長進度報告",
          feat4: "✓ 3 個座位",
          subscribe: "立即訂閱 →",
          coming: "即將開通",
          packTitle: "創始訂閱 · Science + Math 6-pack",
          packBody: "HK$68/月家長計劃解鎖以下六個旗艦實驗室（更多實驗室陸續加入）：",
          pack1: "Kc 化學平衡（Chemistry F5）",
          pack2: "Le Chatelier 平衡移動（Chemistry F6）",
          pack3: "Titration 滴定曲線（Chemistry F6）",
          pack4: "Circuit 電路建造（Physics F5）",
          pack5: "Gas Laws 氣體定律（Physics F4）",
          pack6: "Fraction Pizza 分數披薩（Math F1）"
        },
        en: {
          back: "← Back to resources",
          title: "Plans & pricing",
          lead: "Core learning and Learn-From-Zero content stay free. A subscription unlocks unlimited drills, the full wrong-answer book, and parent reports.",
          soonTitle: "Checkout temporarily unavailable",
          soonBody: "Subscriptions are billed securely via Stripe; localhost uses test mode. Try again shortly, or email us for school/family plans: ",
          tryTitle: "Try it now — no payment needed",
          try1: "Every app has a daily free drill allowance; Learn-From-Zero storyboards are never locked.",
          try2: "Use the in-app 14-day TEST MODE trial to unlock advanced features — no credit card required.",
          try3: "Progress stays on your device — no accounts.",
          portalTitle: "Parent portal",
          portalLead: "Create an account before or after purchase. Sign in to browse the full library and manage child profiles (platform: localhost:3000).",
          portalRegister: "Register",
          portalLogin: "Sign in",
          portalLibrary: "Library",
          popular: "Popular",
          tbc: "TBC",
          feat1: "✓ Unlimited drills",
          feat2: "✓ Full wrong-answer book",
          feat3: "✓ Parent reports",
          feat4: "✓ 3 seats",
          subscribe: "Subscribe →",
          coming: "Coming soon",
          packTitle: "Founding subscriber · Science + Math 6-pack",
          packBody: "Parent HK$68/mo unlocks these six flagship labs (more labs coming):",
          pack1: "Kc equilibrium (Chemistry F5)",
          pack2: "Le Chatelier (Chemistry F6)",
          pack3: "Titration curve (Chemistry F6)",
          pack4: "Circuit builder (Physics F5)",
          pack5: "Gas laws lab (Physics F4)",
          pack6: "Fraction pizza (Math F1)"
        }
      };

      function t(key) { return NcsI18n.tk(key); }

      function applyStatic() {
        NcsI18n.applyDataI18n();
        document.title = NcsI18n.resolveHubTitle({
          zh: "方案與收費 | HK STEAM AI",
          en: "Pricing | HK STEAM AI",
          ne: "मूल्य | HK STEAM AI",
          ur: "قیمتیں | HK STEAM AI",
          tl: "Pricing | HK STEAM AI",
          hi: "मूल्य निर्धारण | HK STEAM AI"
        }) || document.title;
      }

      function renderPlans() {
        var grid = document.getElementById("plan-grid");
        grid.innerHTML = "";
        var plans = (window.HkcBilling && window.HkcBilling.plans) || {};
        var links = (window.HkcBilling && window.HkcBilling.paymentLinks) || {};
        var keys = ["parentMonthly", "parentAnnual", "familyMonthly", "familyAnnual"];
        var anyLink = false;

        keys.forEach(function (key) {
          var meta = plans[key] || { labelZh: key, labelEn: key, priceZh: "", priceEn: "" };
          var link = links[key] || "";
          if (link) anyLink = true;
          var featured = key === "parentAnnual";
          var label = NcsI18n.t(meta.labelZh || meta.labelEn, meta.labelEn || meta.labelZh);
          var price = NcsI18n.t(meta.priceZh || meta.priceEn || t("tbc"), meta.priceEn || meta.priceZh || t("tbc"));

          var card = document.createElement("div");
          card.className = "rounded-2xl border p-6 flex flex-col shadow-sm " +
            (featured ? "border-indigo-500 bg-white ring-2 ring-indigo-100 relative" : "border-slate-200 bg-white");
          card.innerHTML =
            (featured ? '<span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-indigo-600 text-white text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full">' + t("popular") + "</span>" : "") +
            '<h3 class="font-bold text-slate-900">' + label + "</h3>" +
            '<p class="mt-4 text-2xl font-black ' + (featured ? "text-indigo-600" : "text-slate-800") + '">' + price + "</p>" +
            '<ul class="mt-4 mb-6 space-y-1.5 text-xs text-slate-500 leading-relaxed flex-1">' +
            "<li>" + t("feat1") + "</li>" +
            "<li>" + t("feat2") + "</li>" +
            "<li>" + t("feat3") + "</li>" +
            (key.indexOf("family") === 0 ? "<li>" + t("feat4") + "</li>" : "") +
            "</ul>";

          var btn = document.createElement(link ? "a" : "button");
          btn.className = "w-full min-h-[52px] rounded-xl font-bold text-sm flex items-center justify-center transition-opacity " +
            (link
              ? (featured ? "bg-indigo-600 text-white hover:opacity-90" : "bg-slate-800 text-white hover:opacity-90")
              : "bg-slate-100 text-slate-400 cursor-not-allowed");
          btn.textContent = link ? t("subscribe") : t("coming");
          if (link) { btn.href = link; btn.rel = "noopener"; } else { btn.type = "button"; btn.disabled = true; }
          card.appendChild(btn);
          grid.appendChild(card);
        });

        var soon = document.getElementById("coming-soon");
        if (!anyLink) soon.classList.remove("hidden");
        else soon.classList.add("hidden");
      }

      function refresh() {
        applyStatic();
        renderPlans();
      }

      NcsI18n.ensureHub().then(function () {
        NcsI18n.registerStrings(I18N);
        NcsI18n.mountSwitcher("#ncs-lang-switcher");
        document.addEventListener("ncs:langchange", refresh);
        refresh();
        if (window.HkcEntitlement && window.HkcEntitlement.redeemFromUrl) {
          window.HkcEntitlement.redeemFromUrl().then(function (r) {
            if (r && r.ok) refresh();
          });
        }
      });
    })();
  </script>
  <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
