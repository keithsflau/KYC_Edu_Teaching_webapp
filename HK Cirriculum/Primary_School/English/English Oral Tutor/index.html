<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跟讀句子 · Speaking</title>
  <script>
  (function () {
    var target = "../KS2/P6_Speaking_Echo/index.html";
    if (location.search) target += location.search;
    if (!/autotest=1/.test(location.search)) location.replace(target);
  })();
  </script>
</head>
<body>
  <p><a id="go" href="../KS2/P6_Speaking_Echo/index.html">開啟跟讀課 Open the speaking lesson</a></p>
  <p id="autotest-result"></p>
  <script>
  (function () {
    if (!/autotest=1/.test(location.search)) return;
    var link = document.getElementById("go");
    var box = document.getElementById("autotest-result");
    if (!link || link.getAttribute("href") !== "../KS2/P6_Speaking_Echo/index.html") {
      box.textContent = "FAIL missing speaking lesson";
      return;
    }
    box.textContent = "PASS";
    box.dataset.state = "pass";
  })();
  </script>
</body>
</html>
