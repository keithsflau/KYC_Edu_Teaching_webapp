<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超市任務 · Shopping</title>
  <script>
  (function () {
    var target = "../../KS1/P3_Supermarket_Mission/index.html";
    if (location.search) target += location.search;
    if (!/autotest=1/.test(location.search)) location.replace(target);
  })();
  </script>
</head>
<body>
  <p><a id="go" href="../../KS1/P3_Supermarket_Mission/index.html">開啟超市任務 Open the supermarket mission</a></p>
  <p id="autotest-result"></p>
  <script>
  (function () {
    if (!/autotest=1/.test(location.search)) return;
    var link = document.getElementById("go");
    var box = document.getElementById("autotest-result");
    if (!link || link.getAttribute("href") !== "../../KS1/P3_Supermarket_Mission/index.html") {
      box.textContent = "FAIL missing supermarket lesson";
      return;
    }
    box.textContent = "PASS";
    box.dataset.state = "pass";
  })();
  </script>
</body>
</html>
