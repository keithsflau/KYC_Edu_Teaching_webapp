<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小六｜詞語｜之、而、其</title>
<link rel="stylesheet" href="../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">返回中國語文</a>
<p class="meta">小六 · 詞語</p>
<h1>選出「之」「而」「其」</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能在短句的空位選出「之」、「而」或「其」，並說出它在該句是「的」、順接，還是「它的」。</p>
</section>
<section class="objective">
<h2>怎樣做</h2>
<p>先把三個字分別代進空位讀一遍，看哪一個讀得通。再選那個字。選了之後才會聽到聲音。</p>
</section>
<section class="objective">
<h2>答錯時</h2>
<p>答錯會聽到較低的一聲，並寫出這個字放進去之後句子為甚麼變了意思，或為甚麼讀不通。請再選一次。</p>
</section>
<main id="app"></main>
</div>
<script src="../shared/sfx.js"></script>
<script>
window.LESSON = {
  done: "你已能分出「之」何時是「的」、何時指前面的事物，也不會把順接的「而」和「它的」的「其」調亂。",
  items: [
    {
      type: "choice",
      prompt: "「求學___道，不可不勤。」空位最適合哪一個？",
      options: [
        { text: "之", ok: true, because: "「求學之道」就是求學的方法。「之」在這裡等於「的」。" },
        { text: "而", ok: false, why: "「而」用來連接前後兩件事。這裡「求學」和「道」不是兩件先後發生的事。" },
        { text: "其", ok: false, why: "「其」常解作「它的」。這句還沒有另一樣東西可以讓「其」去指。" }
      ]
    },
    {
      type: "choice",
      prompt: "「日出___作，日入而息。」空位最適合哪一個？",
      options: [
        { text: "之", ok: false, why: "用「之」會變成「日出的作」，後面接不上「作」這個動作。" },
        { text: "而", ok: true, because: "太陽出來，然後去勞作。和後面的「日入而息」一樣，是順着說下去。" },
        { text: "其", ok: false, why: "「其」不是「然後」，不能用來連接「日出」和「作」。" }
      ]
    },
    {
      type: "choice",
      prompt: "「樹高千尺，___根必深。」空位要表示「它的」。應選哪一個？",
      options: [
        { text: "之", ok: false, why: "分句開頭不能單用「之」來表示「它的」。" },
        { text: "而", ok: false, why: "「而」只負責連接，不是「它的」。" },
        { text: "其", ok: true, because: "「其根」就是「它的根」，「它」指前面那棵樹。" }
      ]
    },
    {
      type: "choice",
      prompt: "「朋友___言，不可失信。」空位最適合哪一個？",
      options: [
        { text: "之", ok: true, because: "「朋友之言」就是朋友的話。「之」等於「的」。" },
        { text: "而", ok: false, why: "這裡不是把兩個動作順接或轉折，「而」放進去讀不通。" },
        { text: "其", ok: false, why: "「朋友」就是要修飾的對象，要用「之」說成「朋友的話」，不是再用「其」去指別人。" }
      ]
    },
    {
      type: "choice",
      prompt: "「溫習舊課，不可忘___。」空位要指「舊課」。應選哪一個？",
      options: [
        { text: "而", ok: false, why: "空位要代替「舊課」這件東西，不是用來連接下一個動作。" },
        { text: "其", ok: false, why: "「其」是「它的」，後面還要有名詞。這裡句子已經結束，接不上。" },
        { text: "之", ok: true, because: "「之」是代詞，指前面的「舊課」。不可忘掉的是舊課。" }
      ]
    }
  ]
};
</script>
<script src="../shared/engine.js"></script>
</body>
</html>
