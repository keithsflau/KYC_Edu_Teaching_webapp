<h1>短文：街市的早晨</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能讀懂短文，找出時間、人物做過的事和說話的原因。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"他們哪一天去街市？","options":[{"text":"星期一","ok":false,"why":"文中第一句寫的是「星期日早上」，不是星期一。"},{"text":"星期日","ok":true,"because":"第一句就寫了「星期日早上」。"},{"text":"文中沒有寫日子","ok":false,"why":"日子寫在第一句，不是沒有寫。"}],"passage":"星期日早上，小恩和爸爸到街市。爸爸買了菜，小恩幫忙拿着一袋蘋果。回到家，小恩把蘋果洗乾淨，再放到碟上。爸爸說：「謝謝你，今天有你幫忙，快了很多。」"},{"type":"choice","prompt":"小恩在街市做了甚麼？","options":[{"text":"自己把菜買完","ok":false,"why":"買菜的是爸爸。小恩是幫忙拿蘋果。"},{"text":"幫忙拿着一袋蘋果","ok":true,"because":"文中寫小恩幫忙拿着一袋蘋果。"},{"text":"在街市洗蘋果","ok":false,"why":"洗蘋果是回到家之後的事。"}],"passage":"星期日早上，小恩和爸爸到街市。爸爸買了菜，小恩幫忙拿着一袋蘋果。回到家，小恩把蘋果洗乾淨，再放到碟上。爸爸說：「謝謝你，今天有你幫忙，快了很多。」"},{"type":"choice","prompt":"回到家後，小恩還做了甚麼？","options":[{"text":"把蘋果洗乾淨，放到碟上","ok":true,"because":"這兩件事都寫在「回到家」之後。"},{"text":"再去街市一次","ok":false,"why":"文中沒有寫他再出門。"},{"text":"叫爸爸去洗蘋果","ok":false,"why":"洗蘋果的是小恩，不是爸爸。"}],"passage":"星期日早上，小恩和爸爸到街市。爸爸買了菜，小恩幫忙拿着一袋蘋果。回到家，小恩把蘋果洗乾淨，再放到碟上。爸爸說：「謝謝你，今天有你幫忙，快了很多。」"},{"type":"choice","prompt":"爸爸為甚麼說謝謝？","options":[{"text":"因為蘋果很甜","ok":false,"why":"爸爸沒有說蘋果甜，他說的是有人幫忙，所以快了很多。"},{"text":"因為小恩幫忙，事情快了很多","ok":true,"because":"爸爸的話直接說明了這個原因。"},{"text":"因為星期日不用上學","ok":false,"why":"不用上學不是他道謝的原因。"}],"passage":"星期日早上，小恩和爸爸到街市。爸爸買了菜，小恩幫忙拿着一袋蘋果。回到家，小恩把蘋果洗乾淨，再放到碟上。爸爸說：「謝謝你，今天有你幫忙，快了很多。」"}],"done":"你已能從短文裡找出時間、動作，以及爸爸道謝的原因。"};
</script>
