<p class="meta">小二 · 句子</p>
<h1>句末：句號、問號、感嘆號</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能判斷句子是陳述、發問還是讚嘆，並選對句末標點。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"「你今天帶了水彩筆嗎」句末應該用哪一個？","options":[{"text":"。","ok":false,"why":"這句在發問，句末不是句號。"},{"text":"？","ok":true,"because":"句中有「嗎」，是在問別人，要用問號。"},{"text":"！","ok":false,"why":"這句不是驚呼，而是問題。"}]},{"type":"choice","prompt":"「我今天帶了水彩筆」句末應該用哪一個？","options":[{"text":"？","ok":false,"why":"這句是告訴別人一件事，沒有發問。"},{"text":"！","ok":false,"why":"這句語氣平實，不是讚嘆或命令式的驚呼。"},{"text":"。","ok":true,"because":"陳述一件事，句末用句號。"}]},{"type":"choice","prompt":"「誰在敲門」句末應該用哪一個？","options":[{"text":"。","ok":false,"why":"「誰」是在問人，不是平平地敘述。"},{"text":"？","ok":true,"because":"問人是誰，要用問號。"},{"text":"，","ok":false,"why":"逗號不能用來結束這句問話。"}]},{"type":"choice","prompt":"「請把椅子放好」句末應該用哪一個？","options":[{"text":"？","ok":false,"why":"這句是請求，不是問題。"},{"text":"。","ok":true,"because":"請求別人做事，句末用句號。"},{"text":"、","ok":false,"why":"頓號用來分開並列的詞，不能結束句子。"}]},{"type":"choice","prompt":"「這幅畫真美」句末應該用哪一個？","options":[{"text":"？","ok":false,"why":"說話的人不是在問畫美不美，而是在讚嘆。"},{"text":"。","ok":false,"why":"句號可以用在平實的句子。這裡有「真美」，是讚嘆，要用感嘆號。"},{"text":"！","ok":true,"because":"讚嘆的句子，句末用感嘆號。"}]},{"type":"choice","prompt":"「小鳥在枝頭唱歌」句末應該用哪一個？","options":[{"text":"？","ok":false,"why":"這句只是敘述小鳥在唱歌，沒有人發問，所以不能用問號。"},{"text":"。","ok":true,"because":"這是敘述小鳥在唱歌，用句號。"},{"text":"、","ok":false,"why":"頓號不能放在一句話的最後。"}]}],"done":"你已能按句子的用途，分出句號、問號和感嘆號。"};
</script>
