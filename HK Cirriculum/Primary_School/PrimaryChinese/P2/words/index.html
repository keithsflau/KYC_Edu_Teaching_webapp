<title>小二｜詞語｜反義詞放進句子</title>
<link rel="stylesheet" href="../../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小二 · 詞語</p>
<h1>反義詞放進句子</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能按句子的意思，選出「冷、矮、慢、關、晚、少」這些反義詞。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"夏天很熱，冬天很____。","options":[{"text":"慢","ok":false,"why":"「慢」和「快」相對。這句在說天氣冷熱。"},{"text":"冷","ok":true,"because":"熱的反義是冷，所以冬天很冷。"},{"text":"矮","ok":false,"why":"「矮」和「高」相對，不是天氣。"}]},{"type":"choice","prompt":"哥哥長得高，弟弟長得____。","options":[{"text":"少","ok":false,"why":"「少」和「多」相對。這句在比高矮。"},{"text":"慢","ok":false,"why":"「慢」用來比速度，不用來比身高。"},{"text":"矮","ok":true,"because":"高的反義是矮。"}]},{"type":"choice","prompt":"火車很快，烏龜爬得很____。","options":[{"text":"冷","ok":false,"why":"這句在比速度，不是比冷熱。"},{"text":"慢","ok":true,"because":"快的反義是慢。"},{"text":"關","ok":false,"why":"「關」和「開」相對，和快慢無關。"}]},{"type":"choice","prompt":"大門打開了，離開課室時請把它____上。","options":[{"text":"晚","ok":false,"why":"「晚」和「早」相對。門要關上，才用「關」。"},{"text":"少","ok":false,"why":"「少」不能說「把門少上」。"},{"text":"關","ok":true,"because":"開的反義是關，所以把門關上。"}]},{"type":"choice","prompt":"我們早上上學，____上回家。","options":[{"text":"冷","ok":false,"why":"這句在說時間的早和晚。"},{"text":"晚","ok":true,"because":"早上對晚上，所以晚上回家。"},{"text":"關","ok":false,"why":"「關」不是時間。"}]},{"type":"choice","prompt":"籃子裡的橙子很多，碟子裡的很____。","options":[{"text":"高","ok":false,"why":"「高」和「矮」相對。這裡在比數量。"},{"text":"少","ok":true,"because":"多的反義是少。"},{"text":"慢","ok":false,"why":"數量的相反不是快慢。"}]}],"done":"你已能看出句子在比較哪一種相反的意思，而不是見詞就配。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
