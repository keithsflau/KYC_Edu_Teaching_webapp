<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小二 · 識字</p>
<h1>形近字：日目、木本、大太</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能在句子裡分辨「日／目」、「木／本」、「大／太」。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"早晨，____從東方升起。","options":[{"text":"目","ok":false,"why":"「目」是眼睛。從東方升起的是太陽，要用「日」。"},{"text":"日","ok":true,"because":"「日出」的「日」就是太陽。"},{"text":"白","ok":false,"why":"「白」是顏色，不能說「白從東方升起」。"}]},{"type":"choice","prompt":"他揉一揉____睛，就看清黑板上的字。","options":[{"text":"日","ok":false,"why":"「日」是太陽。眼睛的「睛」用「目」字旁。"},{"text":"木","ok":false,"why":"「木」是樹木，和眼睛無關。"},{"text":"目","ok":true,"because":"「眼睛」的「睛」裡面是「目」，表示跟眼睛有關。"}]},{"type":"choice","prompt":"校園種了很多樹____。","options":[{"text":"本","ok":false,"why":"「本」多指書本，或樹的根。成片的樹要說「樹木」。"},{"text":"木","ok":true,"because":"「樹木」的「木」就是樹。"},{"text":"太","ok":false,"why":"「太」不能跟「樹」組成這個詞。"}]},{"type":"choice","prompt":"我今天讀完一____書。","options":[{"text":"木","ok":false,"why":"「木」是樹。數書要用「本」。"},{"text":"太","ok":false,"why":"「太」不是書的量詞，也不能說「一太書」。"},{"text":"本","ok":true,"because":"「一本」用來數書，「書本」也用這個「本」。"}]},{"type":"choice","prompt":"這棵榕樹很____，要三個人才抱得住。","options":[{"text":"太","ok":false,"why":"不能說「樹很太」。要說很大，就用「大」。"},{"text":"本","ok":false,"why":"「本」在這裡接不上一棵樹的大小。"},{"text":"大","ok":true,"because":"「很大」用來說明榕樹的體積。"}]},{"type":"choice","prompt":"____陽曬得地面發燙。","options":[{"text":"大","ok":false,"why":"「大」少了一點，不能組成「太陽」。"},{"text":"太","ok":true,"because":"「太陽」的「太」比「大」多一點。"},{"text":"木","ok":false,"why":"「木」是樹，不能說「木陽」。"}]}],"done":"你已能按句子的意思，分開三組形近字。"};
</script>
<script src="../../shared/engine.js"></script>
