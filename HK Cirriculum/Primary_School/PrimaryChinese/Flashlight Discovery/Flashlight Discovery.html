<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小二｜閱讀｜手電筒下的水壺</title>
<link rel="stylesheet" href="../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">返回中國語文</a>
<p class="meta">小二 · 閱讀</p>
<h1>手電筒下的水壺</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能讀懂短文，找出為甚麼要用手電筒、人物先做了甚麼，以及媽媽道謝的原因。</p>
</section>
<section class="objective">
<h2>怎樣做</h2>
<p>短文會留在題目上面。先在文中找到相應的句子，再選答案。選了之後才會聽到聲音。</p>
</section>
<section class="objective">
<h2>答錯時</h2>
<p>答錯會聽到較低的一聲，並寫出文中哪一句不是這個意思。請再選一次。</p>
</section>
<main id="app"></main>
</div>
<script src="../shared/sfx.js"></script>
<script>
window.LESSON = {
  done: "你已能從短文裡找出停電的原因、尋找的次序，以及媽媽道謝的原因。",
  items: [
    {
      type: "choice",
      passage: "星期二晚上，大廈突然停電。小晴拿出手電筒，到廚房找水壺。她先照向窗邊，窗邊只有一盆植物。再照向桌子底下，水壺就在那裡。媽媽說：「謝謝你，我正想倒水。」",
      prompt: "小晴為甚麼要拿出手電筒？",
      options: [
        { text: "因為星期二不用上學", ok: false, why: "文中沒有寫上學。她拿手電筒，是因為大廈停電。" },
        { text: "因為大廈突然停電，屋裡暗了", ok: true, because: "第一句寫「突然停電」，所以她才拿出手電筒。" },
        { text: "因為水壺壞了", ok: false, why: "水壺沒有壞，只是一時看不見，放在桌子底下。" }
      ]
    },
    {
      type: "choice",
      passage: "星期二晚上，大廈突然停電。小晴拿出手電筒，到廚房找水壺。她先照向窗邊，窗邊只有一盆植物。再照向桌子底下，水壺就在那裡。媽媽說：「謝謝你，我正想倒水。」",
      prompt: "她最先把光照向哪裡？",
      options: [
        { text: "桌子底下", ok: false, why: "桌子底下是後一步。文中寫「先照向窗邊」。" },
        { text: "窗邊", ok: true, because: "「她先照向窗邊」，那裡只有一盆植物。" },
        { text: "客廳的沙發", ok: false, why: "文中去的是廚房，沒有寫沙發。" }
      ]
    },
    {
      type: "choice",
      passage: "星期二晚上，大廈突然停電。小晴拿出手電筒，到廚房找水壺。她先照向窗邊，窗邊只有一盆植物。再照向桌子底下，水壺就在那裡。媽媽說：「謝謝你，我正想倒水。」",
      prompt: "水壺在哪裡？",
      options: [
        { text: "窗邊的植物盆裡", ok: false, why: "窗邊只有一盆植物，水壺不在那裡。" },
        { text: "桌子底下", ok: true, because: "再照向桌子底下時，水壺就在那裡。" },
        { text: "文中沒有寫", ok: false, why: "位置寫在「再照向桌子底下」那一句。" }
      ]
    },
    {
      type: "choice",
      passage: "星期二晚上，大廈突然停電。小晴拿出手電筒，到廚房找水壺。她先照向窗邊，窗邊只有一盆植物。再照向桌子底下，水壺就在那裡。媽媽說：「謝謝你，我正想倒水。」",
      prompt: "媽媽為甚麼說謝謝？",
      options: [
        { text: "因為植物很美", ok: false, why: "媽媽沒有稱讚植物。她說的是正想倒水。" },
        { text: "因為小晴找到水壺，她正想倒水", ok: true, because: "「謝謝你，我正想倒水」說明了道謝的原因。" },
        { text: "因為停電很好玩", ok: false, why: "文中沒有寫停電好玩，媽媽是在等人倒水。" }
      ]
    }
  ]
};
</script>
<script src="../shared/engine.js"></script>
</body>
</html>
