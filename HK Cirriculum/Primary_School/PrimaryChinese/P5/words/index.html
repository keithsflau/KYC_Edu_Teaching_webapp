<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小五 · 詞語</p>
<h1>褒貶要看句子怎樣用</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能根據句子的說法，判斷用詞是在讚許還是在批評。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"哪一句是在讚許？","options":[{"text":"他固執，聽不進別人的意見。","ok":false,"why":"「聽不進」說明這裡的「固執」是在批評他不肯聽。"},{"text":"他做事認真，交來的記錄一項不漏。","ok":true,"because":"「一項不漏」具體寫出值得肯定的做法。"},{"text":"他狡猾地推卸責任。","ok":false,"why":"狡猾和推卸責任都是負面的做法。"}]},{"type":"choice","prompt":"哪一個詞在這組裡帶着批評？","options":[{"text":"節約","ok":false,"why":"節約是讚許人不浪費。"},{"text":"慷慨","ok":false,"why":"慷慨是讚許人願意把自己的東西分出來。"},{"text":"吝嗇","ok":true,"because":"吝嗇是批評人過分吝惜，連該分享的也不肯。"}]},{"type":"choice","prompt":"「小貝把多餘的鉛筆分給沒帶筆的同學。」哪一個詞適合這句？","options":[{"text":"浪費","ok":false,"why":"她把筆給了需要的人，不是隨便丟掉。"},{"text":"慷慨","ok":true,"because":"願意把自己多餘的東西分給人，可以用「慷慨」。"},{"text":"狡猾","ok":false,"why":"句中沒有欺騙或算計。"}]},{"type":"choice","prompt":"「他每次小組討論都搶着說話，別人一句也插不上。」作者的態度是？","options":[{"text":"讚許他積極","ok":false,"why":"如果是讚許，會寫他讓大家都能說，而不是別人一句也插不上。"},{"text":"批評他不讓別人說","ok":true,"because":"「搶着」和「插不上」寫出他佔住了說話的機會。"},{"text":"只是在報導天氣","ok":false,"why":"這句在寫討論時的行為，不是天氣。"}]}],"done":"你已能從整句的說法判斷褒貶，而不是只看一個孤立的詞。"};
</script>

</body>
