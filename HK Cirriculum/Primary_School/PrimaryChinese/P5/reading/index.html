<p class="meta">小五 · 閱讀</p>
<h1>成語故事：不會吹，卻站在隊裡</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能讀懂這則成語故事，說出南郭先生怎樣混過去，以及單獨吹奏時為甚麼離開。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"南郭先生為甚麼起初能留在樂隊裡？","options":[{"text":"因為他吹得最好","ok":false,"why":"文中說他不會吹，不是吹得最好。"},{"text":"因為大家一起吹，別人聽不出他沒有發聲","ok":true,"because":"合奏掩蓋了他沒有吹出聲音。"},{"text":"因為國君已經知道他不會","ok":false,"why":"如果一開始就被知道，他就不會被當成樂隊的一員。"}],"passage":"齊國的樂隊一起吹竽。南郭先生不會吹，卻混在裡面，跟着別人搖晃身體。後來新的國君要每一個人單獨吹奏。南郭先生知道再裝下去就會被聽見，只好連夜離開。"},{"type":"choice","prompt":"要他單獨吹時，他為甚麼離開？","options":[{"text":"他不想領工錢","ok":false,"why":"文中沒有寫工錢。他離開，是因為單獨吹就藏不住。"},{"text":"他不會吹，單獨吹會被發現","ok":true,"because":"合奏時可以裝，單獨吹就會露出不會。"},{"text":"竽壞了","ok":false,"why":"文中沒有寫樂器壞了，寫的是他不會吹。"}],"passage":"齊國的樂隊一起吹竽。南郭先生不會吹，卻混在裡面，跟着別人搖晃身體。後來新的國君要每一個人單獨吹奏。南郭先生知道再裝下去就會被聽見，只好連夜離開。"},{"type":"choice","prompt":"這個故事後來用來說甚麼人？","options":[{"text":"很喜歡音樂的人","ok":false,"why":"故事沒有稱讚他喜歡音樂，而是寫他不會卻佔着位置。"},{"text":"沒有真本領，卻佔着那個位置的人","ok":true,"because":"這就是「濫竽充數」：不會吹竽，卻算在吹竽的人數裡。"},{"text":"願意每天練習的人","ok":false,"why":"他沒有留下練習，而是在要單獨吹時離開。"}],"passage":"齊國的樂隊一起吹竽。南郭先生不會吹，卻混在裡面，跟着別人搖晃身體。後來新的國君要每一個人單獨吹奏。南郭先生知道再裝下去就會被聽見，只好連夜離開。"},{"type":"choice","prompt":"如果他一開始就說自己不會吹，和後來的做法最不同的是甚麼？","options":[{"text":"整個樂隊就再也不吹竽","ok":false,"why":"不會吹的是他一個人，不是整個樂隊都不需要竽。"},{"text":"他不會佔着樂隊的位置，也可以另外想辦法學習","ok":true,"because":"問題出在用假裝代替承認和學習。說出來，位置就可以讓給會吹的人。"},{"text":"國君就會禁止所有人學習","ok":false,"why":"文中沒有這樣的結果。這是加上去的，不是故事裡的事。"}],"passage":"齊國的樂隊一起吹竽。南郭先生不會吹，卻混在裡面，跟着別人搖晃身體。後來新的國君要每一個人單獨吹奏。南郭先生知道再裝下去就會被聽見，只好連夜離開。"}],"done":"你已能用故事裡的情節說明：沒有本領時，假裝和離開有甚麼不同。"};
</script>
