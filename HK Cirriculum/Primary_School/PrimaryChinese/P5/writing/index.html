<title>小五｜寫作｜把一句空話寫得看得見</title>
<link rel="stylesheet" href="../../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小五 · 寫作</p>
<h1>把一句空話寫得看得見</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能把空泛的句子改寫成有人物、地方、顏色或動作的句子。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"「公園裡有花。」哪一句改寫後，讀者看得見花？","options":[{"text":"公園裡的花很美。","ok":false,"why":"「很美」仍然沒有顏色、數量和地方。"},{"text":"公園的草地上，紅的黃的花朵開成一片。","ok":true,"because":"這句寫了草地、兩種顏色和「開成一片」的範圍。"},{"text":"公園很大。","ok":false,"why":"這句連花都沒有寫。"}]},{"type":"choice","prompt":"「妹妹看魚。」哪一句把動作寫得更清楚？","options":[{"text":"妹妹看。","ok":false,"why":"少了「魚」，讀者更不知道她在看甚麼。"},{"text":"妹妹俯身看缸裡的金魚。","ok":true,"because":"俯身、魚缸、金魚，讓動作和對象都看得見。"},{"text":"妹妹有眼睛。","ok":false,"why":"這句沒有寫她正在看魚。"}]},{"type":"choice","prompt":"哪一句仍嫌空泛，還要再寫具體？","options":[{"text":"小息時，三個同學蹲在花槽邊數新生的葉。","ok":false,"why":"這句已有時間、人數、地點和動作。"},{"text":"那天的活動很有意義。","ok":true,"because":"「很有意義」沒有寫出做了甚麼，讀者無法看見活動。"},{"text":"雨停後，操場上留下一串濕腳印。","ok":false,"why":"雨停、操場、腳印都是看得見的細節。"}]}],"done":"你已能指出「很美」「很開心」為甚麼仍看不見，並選出寫得具體的句子。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
