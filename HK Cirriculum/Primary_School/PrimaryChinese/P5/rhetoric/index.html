<title>小五｜句子｜擬人，還是比喻？</title>
<link rel="stylesheet" href="../../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小五 · 句子</p>
<h1>擬人，還是比喻？</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能分出擬人、比喻和直接描述：擬人寫出人的動作或感情，比喻用另一樣東西來比較。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"哪一句是擬人？","options":[{"text":"春風很大。","ok":false,"why":"這句只說明風勢，沒有人的動作或感情。"},{"text":"春風輕輕拉着我的衣角。","ok":true,"because":"拉衣角是人的動作。春風被寫成會做事的人。"},{"text":"春風像一把剪刀。","ok":false,"why":"「像」把春風比作剪刀，這是比喻，不是擬人。"}]},{"type":"choice","prompt":"哪一句是比喻，不是擬人？","options":[{"text":"柳樹搖着手歡迎我們。","ok":false,"why":"搖手、歡迎都是人的動作，這是擬人。"},{"text":"星星眨着眼睛。","ok":false,"why":"眨眼是人的動作，這是擬人。"},{"text":"太陽像一個大火球。","ok":true,"because":"「像」把太陽比作火球。火球沒有人的感情，所以是比喻。"}]},{"type":"choice","prompt":"「時間悄悄地溜走了。」這句把時間寫成會做甚麼？","options":[{"text":"像一塊石頭掉下來","ok":false,"why":"「溜走」是人輕輕離開，不是石頭落下。"},{"text":"像人一樣不讓人察覺地離開","ok":true,"because":"悄悄、溜走都是人的動作，所以這句是擬人。"},{"text":"像一本合上的書","ok":false,"why":"句中沒有把時間比作書。"}]},{"type":"choice","prompt":"哪一句只是直接描述，既不是擬人，也不是比喻？","options":[{"text":"花朵在風中跳舞。","ok":false,"why":"跳舞是人的動作，這是擬人。"},{"text":"花朵被風吹得左右擺動。","ok":true,"because":"這句只寫花朵被風吹動，沒有人的感情，也沒有「像」另一樣東西。"},{"text":"花朵點頭跟我打招呼。","ok":false,"why":"點頭、打招呼是人的動作，這是擬人。"}]}],"done":"你已能指出哪句把事物寫成人，哪句只是在打比方。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
