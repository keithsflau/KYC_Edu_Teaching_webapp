<!DOCTYPE html>

<title>小六｜閱讀｜唐詩排句</title>

</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">返回中國語文</a>
<p class="meta">小六 · 閱讀</p>
<h1>把唐詩排回原句</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能把李白《靜夜思》和孟浩然《春曉》排回原來的次序，並說出哪一句寫出思念或疑問。</p>
</section>
<section class="objective">
<h2>怎樣做</h2>
<p>排序題先按正確次序點選詩句，再按「檢查次序」。點錯的句子可以再點一次取消。選擇題直接選一個答案。作答後才會聽到聲音。</p>
</section>
<section class="objective">
<h2>答錯時</h2>
<p>次序不對會聽到較低的一聲，並說明詩意為甚麼接不下去，然後可以再排。連續錯兩次，會看到正確次序。選擇題答錯會留下錯因。</p>
</section>
<main id="app"></main>
</div>
<script src="../shared/sfx.js"></script>
<script>
window.LESSON = {
  done: "你已能按詩意把《靜夜思》和《春曉》排回原句，也不會把望月和思鄉的動作對調。",
  items: [
    {
      type: "order",
      prompt: "把李白《靜夜思》排回原來的次序。",
      choices: ["低頭思故鄉。", "床前明月光，", "舉頭望明月，", "疑是地上霜。"],
      answer: ["床前明月光，", "疑是地上霜。", "舉頭望明月，", "低頭思故鄉。"],
      glue: "",
      because: "先看見床前的月光，才懷疑那是地上的霜；望見明月之後，才低下頭思念故鄉。",
      why: "還沒有寫月光，就不能先說「疑是」；還沒有望月，就不能先寫低頭思鄉。"
    },
    {
      type: "choice",
      passage: "床前明月光，疑是地上霜。舉頭望明月，低頭思故鄉。",
      prompt: "哪一句必須緊接在「疑是地上霜」的前面？",
      options: [
        { text: "低頭思故鄉。", ok: false, why: "思念在全詩最後。前面要先有被看成霜的月光。" },
        { text: "床前明月光，", ok: true, because: "先寫明亮的月光，下一句才說它好像地上的霜。" },
        { text: "舉頭望明月，", ok: false, why: "舉頭望月在「疑是地上霜」之後，不是在它前面。" }
      ]
    },
    {
      type: "order",
      prompt: "把孟浩然《春曉》排回原來的次序。",
      choices: ["花落知多少。", "春眠不覺曉，", "夜來風雨聲，", "處處聞啼鳥。"],
      answer: ["春眠不覺曉，", "處處聞啼鳥。", "夜來風雨聲，", "花落知多少。"],
      glue: "",
      because: "春天睡到不覺天亮，醒來處處都是鳥聲；接著才想起夜裡的風雨，不知道落了多少花。",
      why: "要先寫春眠和鳥聲，才轉到夜裡的風雨；「花落知多少」是聽到風雨之後的疑問，要放在最後。"
    },
    {
      type: "choice",
      passage: "春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。",
      prompt: "「花落知多少」是在問甚麼？",
      options: [
        { text: "早上有多少隻鳥在叫", ok: false, why: "鳥聲寫在「處處聞啼鳥」。這一問接在風雨之後。" },
        { text: "夜裡的風雨打落了多少花", ok: true, because: "上一句是「夜來風雨聲」，所以他問的是花被打落了多少。" },
        { text: "詩人睡了多少個時辰", ok: false, why: "「不覺曉」只說他不知不覺天亮了，沒有問睡了多久。" }
      ]
    }
  ]
};
</script>
<script src="../shared/engine.js"></script>
</body>
</html>
