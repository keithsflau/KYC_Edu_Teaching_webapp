<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小二｜句子｜句末標點</title>
<link rel="stylesheet" href="../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">返回中國語文</a>
<p class="meta">小二 · 句子</p>
<h1>過山車與句末標點</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能判斷句子是在陳述、發問還是讚嘆，並選對句末的句號、問號或感嘆號。</p>
</section>
<section class="objective">
<h2>怎樣做</h2>
<p>先讀完整句，再選一個標點。選了之後才會聽到聲音。答對會有兩聲短音，才可以到下一題。</p>
</section>
<section class="objective">
<h2>答錯時</h2>
<p>答錯會聽到較低的一聲，按鈕停用，並寫出這次把句子的用途看錯了哪裡。請按剩下的選項再試。</p>
</section>
<main id="app"></main>
</div>
<script src="../shared/sfx.js"></script>
<script>
window.LESSON = {
  done: "你已能按句子是陳述、發問還是讚嘆，選出句號、問號或感嘆號。",
  items: [
    {
      type: "choice",
      prompt: "「你想坐過山車嗎」句末應該用哪一個？",
      options: [
        { text: "。", ok: false, why: "這句有「嗎」，是在問人想不想坐，不是把事情說完。" },
        { text: "？", ok: true, because: "用「嗎」發問，句末要用問號。" },
        { text: "！", ok: false, why: "這句不是驚呼或讚嘆，而是一個問題。" }
      ]
    },
    {
      type: "choice",
      prompt: "「車廂慢慢爬上最高處」句末應該用哪一個？",
      options: [
        { text: "？", ok: false, why: "句中沒有發問，只是說出車廂在做甚麼。" },
        { text: "！", ok: false, why: "語氣平實，沒有「真」這一類讚嘆的字，不用感嘆號。" },
        { text: "。", ok: true, because: "這是陳述一件事，句末用句號。" }
      ]
    },
    {
      type: "choice",
      prompt: "「這趟過山車真刺激」句末應該用哪一個？",
      options: [
        { text: "？", ok: false, why: "說話的人不是在問刺激不刺激，而是在讚嘆。" },
        { text: "。", ok: false, why: "句號適合平實的句子。這裡有「真刺激」，是讚嘆。" },
        { text: "！", ok: true, because: "讚嘆的句子，句末用感嘆號。" }
      ]
    },
    {
      type: "choice",
      prompt: "「誰還沒有扣好安全帶」句末應該用哪一個？",
      options: [
        { text: "。", ok: false, why: "「誰」是在問人，不是平平地敘述。" },
        { text: "？", ok: true, because: "問還有誰未扣好，要用問號。" },
        { text: "，", ok: false, why: "逗號只表示句子還沒說完，不能用來結束這句問話。" }
      ]
    },
    {
      type: "choice",
      prompt: "「請坐穩，雙手不要伸出車外」句末應該用哪一個？",
      options: [
        { text: "？", ok: false, why: "這句是吩咐，不是問題。" },
        { text: "。", ok: true, because: "請求別人做事，句末用句號。" },
        { text: "、", ok: false, why: "頓號用來分開並列的詞，不能放在一句話的最後。" }
      ]
    }
  ]
};
</script>
<script src="../shared/engine.js"></script>
</body>
</html>
