<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小一 · 識字</p>
<h1>象形字：日月水火</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能辨認「日、月、水、火、山、木」，並說出字形像甚麼。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"哪一個字的形狀最像圓圓的太陽？","options":[{"text":"月","ok":false,"why":"「月」像彎彎的月亮，缺了一邊，不是圓圓的太陽。"},{"text":"日","ok":true,"because":"「日」外圍圓圓的，中間一橫，像太陽。"},{"text":"目","ok":false,"why":"「目」像一隻眼睛，和太陽無關。"},{"text":"口","ok":false,"why":"「口」像張開的嘴巴，不是太陽。"}]},{"type":"choice","prompt":"哪一個字最像彎彎的月亮？","options":[{"text":"日","ok":false,"why":"「日」是圓的，月亮的字形少了一邊。"},{"text":"明","ok":false,"why":"「明」是日和月合起來的字。題目只要單獨像月亮的那一個。"},{"text":"月","ok":true,"because":"「月」的一邊開口，正像月牙。"},{"text":"用","ok":false,"why":"「用」不是象形的月亮。"}]},{"type":"choice","prompt":"哪一個字像流動、濺起的水？","options":[{"text":"木","ok":false,"why":"「木」像一棵樹，上面是枝，下面是根。"},{"text":"火","ok":false,"why":"「火」像向上竄的火焰。"},{"text":"山","ok":false,"why":"「山」像並排的山峯。"},{"text":"水","ok":true,"because":"「水」中間一豎像水流，兩邊像濺起的水花。"}]},{"type":"choice","prompt":"哪一個字像向上燒的火焰？","options":[{"text":"水","ok":false,"why":"「水」和水花有關，火焰是向上的。"},{"text":"火","ok":true,"because":"「火」的點像火星，其餘筆畫像火舌向上。"},{"text":"山","ok":false,"why":"「山」是山峯的形狀，不是火焰。"}]},{"type":"choice","prompt":"哪一個字像三座連在一起的山峯？","options":[{"text":"山","ok":true,"because":"「山」中間高、兩邊低，像並排的山。"},{"text":"木","ok":false,"why":"「木」是樹木，不是山。"},{"text":"火","ok":false,"why":"「火」是火焰，筆畫向上散開。"}]},{"type":"choice","prompt":"哪一個字像一棵有枝有根的樹？","options":[{"text":"本","ok":false,"why":"「本」下面多一橫，是樹根的記號，常用在「書本」。題目要的是樹木的「木」。"},{"text":"水","ok":false,"why":"「水」像水花，不是樹。"},{"text":"木","ok":true,"because":"「木」一豎像樹幹，上面像枝，下面像根。"}]}],"done":"你已能按字形，分辨太陽、月亮、水、火、山和樹木。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
