<title>小一｜詞語｜量詞：一枝、一本、一隻</title>

<body>
<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小一 · 詞語</p>
<h1>量詞：一枝、一本、一隻</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能為鉛筆、書、動物、水和鞋配上常用量詞。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"妹妹借了一____鉛筆。","options":[{"text":"隻","ok":false,"why":"「隻」多用來數動物。鉛筆又長又直，不說「一隻鉛筆」。"},{"text":"本","ok":false,"why":"「本」用來數書，例如「一本書」。"},{"text":"枝","ok":true,"because":"鉛筆細長，香港常用「一枝鉛筆」。"}]},{"type":"choice","prompt":"書架上有一____故事書。","options":[{"text":"條","ok":false,"why":"「條」用來數長長的東西，例如河、繩。書要用「本」。"},{"text":"本","ok":true,"because":"書一本一本的，所以說「一本書」。"},{"text":"雙","ok":false,"why":"「雙」用來數成對的東西，例如鞋子。"}]},{"type":"choice","prompt":"公園裡有一____小鳥。","options":[{"text":"本","ok":false,"why":"「本」是書的量詞，小鳥是動物。"},{"text":"枝","ok":false,"why":"「枝」用來數筆、花這一類細長的東西。"},{"text":"隻","ok":true,"because":"小鳥是動物，可以說「一隻小鳥」。"}]},{"type":"choice","prompt":"我渴了，喝了一____水。","options":[{"text":"條","ok":false,"why":"「條」不能用來數一杯裡的水。"},{"text":"杯","ok":true,"because":"水裝在杯子裡，說「一杯水」。"},{"text":"張","ok":false,"why":"「張」用來數平平的東西，例如紙、桌子。"}]},{"type":"choice","prompt":"下雨了，我帶了一____傘。","options":[{"text":"隻","ok":false,"why":"傘不是動物，不說「一隻傘」。"},{"text":"把","ok":true,"because":"有柄、可以握着的傘，說「一把傘」。"},{"text":"本","ok":false,"why":"「本」是書的量詞。"}]},{"type":"choice","prompt":"體育課要換一____鞋。","options":[{"text":"隻","ok":false,"why":"「一隻鞋」只有左邊或右邊。左右一對要說「一雙」。"},{"text":"枝","ok":false,"why":"鞋不是細長的筆，不能用「枝」。"},{"text":"雙","ok":true,"because":"鞋子左右成對，說「一雙鞋」。"}]}],"done":"你已能按事物的樣子選用量詞，不再把動物、書和鞋混在一起。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
