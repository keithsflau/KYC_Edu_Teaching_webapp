<body>
<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小一 · 說話</p>
<h1>按情境說一句完整的話</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能在借東西、道謝、請老師再講和認錯時，說出讓對方聽得明的句子。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"你想借同學的鉛筆，哪一句比較合適？","options":[{"text":"把鉛筆給我。","ok":false,"why":"這句像命令，沒有說「借」，同學也不知道可以拒絕。"},{"text":"請問我可以借你的鉛筆嗎？","ok":true,"because":"這句說了「請問」和「借」，對方知道你在請求。"},{"text":"鉛筆！","ok":false,"why":"只有一個詞，對方不知道你想借、想看，還是想還。"}]},{"type":"choice","prompt":"同學把橡皮借給你，你會說哪一句？","options":[{"text":"終於給我了。","ok":false,"why":"這句好像在怪對方太慢，收了幫助卻沒有道謝。"},{"text":"唔。","ok":false,"why":"這不是完整的話，對方聽不出你的意思。"},{"text":"謝謝你。","ok":true,"because":"先把謝意說清楚，對方才知道你收到了。"}]},{"type":"choice","prompt":"你聽不清楚老師的話，應怎樣說？","options":[{"text":"你說甚麼？","ok":false,"why":"這樣問老師顯得衝，也沒有說你需要他再講一次。"},{"text":"老師，我不明白，請您再講一次。","ok":true,"because":"你說了自己不明白，也清楚請求老師再講。"},{"text":"大聲點！","ok":false,"why":"這是命令，不是向老師請求。"}]},{"type":"choice","prompt":"有人站在窄路中間，你想過去，怎樣說？","options":[{"text":"走開。","ok":false,"why":"這句很粗魯，對方只聽到趕走他，不知道你想通過。"},{"text":"喂。","ok":false,"why":"一個字不是完整的請求。"},{"text":"麻煩讓一讓，謝謝。","ok":true,"because":"你說了想請對方讓路，也先道謝。"}]},{"type":"choice","prompt":"你不小心碰跌了同學的筆盒，第一句應說？","options":[{"text":"不是我。","ok":false,"why":"筆盒是你碰跌的。先否認，就沒有把自己做的事說清楚。"},{"text":"對不起，我幫你拾起來。","ok":true,"because":"先承認是自己碰到，再說你會怎樣補救。"},{"text":"你自己放不穩。","ok":false,"why":"這句把事情推給對方，沒有說你碰到了筆盒。"}]}],"done":"你已能按情境把請求、道謝和認錯說成完整的一句。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
