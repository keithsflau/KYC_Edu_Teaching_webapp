<body>
<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小一 · 句子</p>
<h1>把詞語排成一句話</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能按「誰，然後做甚麼」的次序，把詞語排成通順的句子。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"order","prompt":"按次序點選，組成一句通順的話。","choices":["喜歡","閱讀","我"],"answer":["我","喜歡","閱讀"],"why":"先說誰，再說做甚麼。「我」要放在最前。","because":"這句是「我喜歡閱讀」。人物在前，動作在後。"},{"type":"order","prompt":"弟弟正在畫畫。請排出這句話。","choices":["畫畫","弟弟","正在"],"answer":["弟弟","正在","畫畫"],"why":"「弟弟」是誰，「正在」說明動作進行中，「畫畫」是做的事。","because":"這句是「弟弟正在畫畫」。"},{"type":"order","prompt":"我們一起收拾書包。請排出這句話。","choices":["書包","一起","我們","收拾"],"answer":["我們","一起","收拾","書包"],"why":"先說「我們」，再說「一起」做的事，最後才是收拾的東西。","because":"這句是「我們一起收拾書包」。一起做事，要先說清楚是誰。"},{"type":"order","prompt":"小恩說謝謝。請排出這句話。","choices":["謝謝","小恩","說"],"answer":["小恩","說","謝謝"],"why":"先說誰開口，再說他說了甚麼。","because":"這句是「小恩說謝謝」。先有人，才有他說的話。"}],"done":"你已能先說出人物，再把動作排成完整的一句。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
