<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小三 · 寫作</p>
<h1>按時間寫清楚一段</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能按事情發生的先後排列句子，並刪去跟這段無關的話。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"order","prompt":"把下面四句排成時間合理的一段。","choices":["回到座位後，大家把濕傘放好。","早上，天空忽然下起大雨。","同學們快步走回課室。","小息完結，上課鐘響了。"],"answer":["早上，天空忽然下起大雨。","小息完結，上課鐘響了。","同學們快步走回課室。","回到座位後，大家把濕傘放好。"],"why":"要先下雨，才有濕傘。鐘響之後，才走回課室、坐下放傘。","because":"這段由下雨開始，接着鐘響、回課室，最後才放好濕傘。","glue":"\n"},{"type":"choice","prompt":"哪一句不該放進這段「下雨回課室」？","options":[{"text":"大家把滴水的傘放在課室後面。","ok":false,"why":"這句仍在寫回課室之後怎樣處理傘，沒有離題。"},{"text":"我昨天吃了魚蛋。","ok":true,"because":"吃魚蛋和下雨、回課室沒有關係，放進去這段就沒有一個中心。"},{"text":"地面濕了，大家放慢腳步。","ok":false,"why":"這句還是在寫下雨天走路，可以留在這段。"}]},{"type":"choice","prompt":"如果要改寫「小朋友在玩」，哪一句最能讓讀者看見場面？","options":[{"text":"小朋友玩得很開心。","ok":false,"why":"「很開心」仍然看不見他們在做甚麼。"},{"text":"兩個小朋友在沙池裡堆城堡。","ok":true,"because":"這句寫了人數、地點和動作，讀者能看見場面。"},{"text":"公園裡有人。","ok":false,"why":"這句比原句更空，沒有玩的動作。"}]}],"done":"你已能讓一段話沿着時間走，也知道離題的句子不該放進去。"};
</script>
