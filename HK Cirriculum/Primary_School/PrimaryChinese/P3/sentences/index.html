<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小三 · 句子</p>
<h1>比喻：像的是甚麼</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能判斷句子有沒有用比喻，並說出用來比較的兩樣東西是否說得通。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"哪一句用了比喻？","options":[{"text":"月亮在天上。","ok":false,"why":"這句只說位置，沒有把月亮比作另一樣東西。"},{"text":"月亮像一個銀盤。","ok":true,"because":"「像」把月亮比作銀盤。月亮是本體，銀盤是喻體。"},{"text":"月亮很亮。","ok":false,"why":"這句只直接說亮，沒有比喻。"}]},{"type":"choice","prompt":"哪一句沒有用比喻？","options":[{"text":"他跑得像兔子一樣快。","ok":false,"why":"這句把奔跑的速度比作兔子，用了比喻。"},{"text":"時間像一條河，不停往前。","ok":false,"why":"這句把時間比作河，是比喻。"},{"text":"他跑得很快。","ok":true,"because":"這句直接說很快，沒有用另一樣東西來比。"}]},{"type":"choice","prompt":"「媽媽的頭髮白得像雪。」雪是用來比甚麼？","options":[{"text":"天氣很冷","ok":false,"why":"句中沒有寫天氣。雪是用來比頭髮的顏色。"},{"text":"頭髮的白","ok":true,"because":"本體是頭髮的顏色，喻體是雪的白。"},{"text":"媽媽的年紀","ok":false,"why":"句子比的是白，不是直接比年紀。"}]},{"type":"choice","prompt":"哪一句的比喻說不通？","options":[{"text":"他的臉紅得像蘋果。","ok":false,"why":"蘋果的紅色可以用來比臉紅，說得通。"},{"text":"河水清得像一面鏡子。","ok":false,"why":"鏡子能映出東西，用來比清澈的河水，說得通。"},{"text":"這本書重得像一句話。","ok":true,"because":"一句話沒有重量，不能用來比書有多重。"}]}],"done":"你已能找出比喻，也能指出把不能比較的東西硬放在一起。"};
</script>
