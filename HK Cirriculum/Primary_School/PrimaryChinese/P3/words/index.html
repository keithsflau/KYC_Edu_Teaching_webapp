<title>小三｜詞語｜看、望、觀察、盯</title>

<body>
<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小三 · 詞語</p>
<h1>看、望、觀察、盯</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能按遠近和看的方式，分辨「看、望、觀察、盯」。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"他站在山頂，向遠處____。","options":[{"text":"觀察","ok":false,"why":"觀察是靠近了仔細看。向遠處看，要用「望」。"},{"text":"盯","ok":false,"why":"「盯」是目光停住不放，不一定指向遠處。"},{"text":"望","ok":true,"because":"向遠處或向高處看，常用「望」。"}]},{"type":"choice","prompt":"科學課上，我們用放大鏡____葉片的紋理。","options":[{"text":"望","ok":false,"why":"放大鏡是為了看得仔細，不是向遠處望。"},{"text":"觀察","ok":true,"because":"用工具仔細看事物的細節，說「觀察」。"},{"text":"盯","ok":false,"why":"「盯」只強調目光不離開，沒有寫出仔細研究。"}]},{"type":"choice","prompt":"我一推門，就____見老師走進來。","options":[{"text":"觀察","ok":false,"why":"門一開就見到，是普通的「看」，不是進行觀察。"},{"text":"看","ok":true,"because":"「看見」是一般地用眼睛見到。"},{"text":"望","ok":false,"why":"老師就在門口，不是向遠處望。"}]},{"type":"choice","prompt":"賽跑開始前，他一直____着終點的紅線。","options":[{"text":"望","ok":false,"why":"這裡不是隨便向遠處看，而是目光一直停在紅線上。"},{"text":"盯","ok":true,"because":"目光停在一個地方、不移開，就是「盯」。"},{"text":"觀察","ok":false,"why":"他不是在研究紅線的構造，只是緊緊看着它。"}]}],"done":"你已能按句子，分開普通地看、向遠處望、仔細觀察和目不轉睛地盯。"};
</script>
<script src="../../shared/engine.js"></script>
