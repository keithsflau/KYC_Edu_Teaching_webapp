window.LESSON = {"items":[{"type":"choice","prompt":"小志為甚麼會口渴又不好意思開口？","options":[{"text":"小琳沒有水","ok":false,"why":"小琳有水，還倒了一杯給他。起因是小志自己沒帶水。"},{"text":"他忘記帶水壺","ok":true,"because":"第一句就寫他忘記帶水壺，所以小息時口渴。"},{"text":"課室沒有座位","ok":false,"why":"文中沒有寫座位，寫的是水壺。"}],"passage":"小志忘記帶水壺。小息時他很口渴，卻不好意思向同學開口。同桌小琳看見，把自己的水倒了一杯給他。小志說了謝謝。下一天，他自己帶了水壺，還多帶一個杯子。"},{"type":"choice","prompt":"小琳做了甚麼？","options":[{"text":"叫小志回家拿水壺","ok":false,"why":"文中沒有寫她叫他回家。"},{"text":"把自己的水倒了一杯給小志","ok":true,"because":"這是小琳在小息時做的事。"},{"text":"把小志的水壺丟掉","ok":false,"why":"小志那天根本沒有帶水壺。"}],"passage":"小志忘記帶水壺。小息時他很口渴，卻不好意思向同學開口。同桌小琳看見，把自己的水倒了一杯給他。小志說了謝謝。下一天，他自己帶了水壺，還多帶一個杯子。"},{"type":"choice","prompt":"下一天，小志多帶一個杯子，最能說明甚麼？","options":[{"text":"他不喜歡自己的水壺","ok":false,"why":"文中沒有說他不喜歡水壺。"},{"text":"老師規定每人帶兩個杯子","ok":false,"why":"文中沒有這項規定。"},{"text":"他也想可以把水分給有需要的人","ok":true,"because":"他自己已經有水壺，多出來的杯子才能把水倒給別人。這和前一天小琳的做法對得上。"}],"passage":"小志忘記帶水壺。小息時他很口渴，卻不好意思向同學開口。同桌小琳看見，把自己的水倒了一杯給他。小志說了謝謝。下一天，他自己帶了水壺，還多帶一個杯子。"}],"done":"你已能分清誰忘記了水壺、誰分享了水，以及小志後來多帶杯子的原因。"};
