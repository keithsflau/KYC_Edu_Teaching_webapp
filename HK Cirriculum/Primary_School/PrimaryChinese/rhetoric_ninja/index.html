<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小三｜句子｜找出比喻</title>
<link rel="stylesheet" href="../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">返回中國語文</a>
<p class="meta">小三 · 句子</p>
<h1>找出比喻</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能指出哪一句把一件東西比作另一件，並說明用來比較的那一點是否說得通。</p>
</section>
<section class="objective">
<h2>怎樣做</h2>
<p>先看句子有沒有用另一樣東西來比較。有「像」，仍要檢查兩樣東西是不是比得通。選了之後才會聽到聲音。</p>
</section>
<section class="objective">
<h2>答錯時</h2>
<p>答錯會聽到較低的一聲，並寫出這句是直接描述，還是比喻的兩樣東西對不上。請再選一次。</p>
</section>
<main id="app"></main>
</div>
<script src="../shared/sfx.js"></script>
<script>
window.LESSON = {
  done: "你已能分出比喻和直接描述，也能指出把不能比較的東西硬放在一起。",
  items: [
    {
      type: "choice",
      prompt: "哪一句用了比喻？",
      options: [
        { text: "他的眼睛很亮。", ok: false, why: "這句直接說亮，沒有把眼睛比作另一樣東西。" },
        { text: "他的眼睛亮得像星星。", ok: true, because: "「像」把眼睛的光比作星星。眼睛是本體，星星是喻體。" },
        { text: "他有兩隻眼睛。", ok: false, why: "這句只說數量，沒有比喻。" }
      ]
    },
    {
      type: "choice",
      prompt: "哪一句沒有用比喻？",
      options: [
        { text: "風像一把刀子割在臉上。", ok: false, why: "這句把風比作刀子，用了比喻。" },
        { text: "風很大。", ok: true, because: "這句直接說風大，沒有用另一樣東西來比。" },
        { text: "雲像棉花糖。", ok: false, why: "這句把雲比作棉花糖，用了比喻。" }
      ]
    },
    {
      type: "choice",
      prompt: "「弟弟的臉圓得像皮球。」皮球是用來比甚麼？",
      options: [
        { text: "弟弟跑得很快", ok: false, why: "句中沒有寫跑步。皮球是用來比臉的形狀。" },
        { text: "臉的圓", ok: true, because: "本體是臉的形狀，喻體是皮球的圓。" },
        { text: "皮球的重量", ok: false, why: "句子比的是圓，不是比哪一個更重。" }
      ]
    },
    {
      type: "choice",
      prompt: "哪一句的比喻說不通？",
      options: [
        { text: "雨點像珠子，一顆一顆落下。", ok: false, why: "珠子又圓又亮，可以用來比雨點。" },
        { text: "這首歌甜得像一塊糖。", ok: false, why: "糖的甜可以用來比好聽、愉快的感覺，說得通。" },
        { text: "他的聲音大得像一張桌子。", ok: true, because: "桌子沒有大小聲這一種特點，不能用來比聲音。" }
      ]
    }
  ]
};
</script>
<script src="../shared/engine.js"></script>
</body>
</html>
