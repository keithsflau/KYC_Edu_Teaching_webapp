<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>修辭忍者 - Rhetoric Ninja</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      width: 100vw;
      height: 100vh;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
      touch-action: none;
    }

    .flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0.8;
      z-index: 50;
      pointer-events: none;
      animation: pulse 0.2s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }

    .game-title {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: linear-gradient(to right, #fbbf24, #f97316);
      color: white;
      padding: 12px 32px;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .game-title h1 {
      font-size: 24px;
      font-weight: bold;
      margin: 0;
    }

    .instructions-panel {
      position: absolute;
      top: 80px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      max-width: 320px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .instructions-panel h2 {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #fbbf24;
    }

    .instructions-panel .instruction-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .instructions-panel .instruction-item span:first-child {
      margin-right: 8px;
    }

    .instructions-panel .instruction-item .green {
      color: #4ade80;
      font-weight: bold;
    }

    .instructions-panel .instruction-item .orange {
      color: #fb923c;
      font-weight: bold;
    }

    .instructions-panel .instruction-item .red {
      color: #f87171;
      font-weight: bold;
    }

    .instructions-panel .instruction-note {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(107, 114, 128, 0.6);
      font-size: 12px;
      color: rgba(209, 213, 219, 1);
    }

    .score-panel {
      position: absolute;
      top: 80px;
      right: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .score-panel div {
      font-size: 18px;
      font-weight: bold;
    }

    .game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .game-over-content {
      background: white;
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      max-width: 448px;
    }

    .game-over-content h2 {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #dc2626;
    }

    .game-over-content p {
      font-size: 24px;
      margin-bottom: 24px;
    }

    .btn {
      font-weight: bold;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 20px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-green {
      background: #22c55e;
      color: white;
    }

    .btn-green:hover {
      background: #16a34a;
    }

    .btn-red {
      background: rgba(239, 68, 68, 0.8);
      color: white;
    }

    .btn-red:hover {
      background: rgba(239, 68, 68, 1);
    }

    .btn-black {
      background: rgba(0, 0, 0, 0.6);
      color: white;
    }

    .btn-black:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .control-buttons {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .control-buttons button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 16px;
      color: #64748b;
      font-size: 12px;
      font-family: system-ui, sans-serif;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
    }

    footer p {
      font-style: italic;
      margin-bottom: 4px;
    }

    footer p:last-of-type {
      font-size: 11px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #cbd5e1;
      font-style: normal;
    }
  </style>
      <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body>
  <div id="game-container">
    <!-- Flash effect overlay -->
    <div id="flash-overlay" class="flash-overlay" style="display: none;"></div>

    <!-- Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Game Title -->
    <div class="game-title">
      <h1>修辭忍者</h1>
    </div>

    <!-- Instructions Panel -->
    <div class="instructions-panel">
      <h2>遊戲說明</h2>
      <div class="instruction-item">
        <span style="color: #4ade80;">✓</span>
        <span>切開<strong class="green">綠色</strong>卷軸（比喻）得分</span>
      </div>
      <div class="instruction-item">
        <span style="color: #fb923c;">○</span>
        <span><strong class="orange">橙色</strong>卷軸（普通句子）無影響</span>
      </div>
      <div class="instruction-item">
        <span style="color: #f87171;">✗</span>
        <span>避開<strong class="red">紅色</strong>炸彈（錯誤句子）</span>
      </div>
      <div class="instruction-note">
        <p>用滑鼠或手指劃過螢幕來切開卷軸</p>
      </div>
    </div>

    <!-- Score and Lives -->
    <div class="score-panel">
      <div>分數: <span id="score">0</span></div>
      <div>生命: <span id="lives">❤️❤️❤️</span></div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="game-over-screen" style="display: none;">
      <div class="game-over-content">
        <h2>遊戲結束!</h2>
        <p>最終分數: <span id="final-score">0</span></p>
        <button class="btn btn-green" onclick="startGame()">重新開始</button>
      </div>
    </div>

    <!-- Control Buttons -->
    <div class="control-buttons" id="control-buttons">
      <button class="btn btn-red" onclick="resetGame()" title="重設遊戲">重設</button>
      <button class="btn btn-black" id="pause-btn" onclick="togglePause()">暫停</button>
    </div>

    <!-- Footer -->
    </div>

  <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
