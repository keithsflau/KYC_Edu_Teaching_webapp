<h1>唐詩：靜夜思</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能讀李白《靜夜思》，說出月光被看成甚麼，以及哪個動作寫出對故鄉的思念。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"詩人把床前的月光看成甚麼？","options":[{"text":"地上的雪","ok":false,"why":"詩句寫的是「霜」，不是雪。"},{"text":"地上的霜","ok":true,"because":"「疑是地上霜」把月光的顏色比作霜。"},{"text":"一盆水","ok":false,"why":"詩裡寫的是霜，沒有出現水或水盆。"}],"passage":"床前明月光，疑是地上霜。\n舉頭望明月，低頭思故鄉。"},{"type":"choice","prompt":"「疑是」最接近哪個意思？","options":[{"text":"一定是","ok":false,"why":"「疑」表示不能完全肯定，不是「一定」。"},{"text":"好像是，卻又不能完全確定","ok":true,"because":"月光很白，他一時以為是霜，這是疑，不是確知。"},{"text":"不是","ok":false,"why":"「疑是」不是否定，他確實看見了白晃晃的一片。"}],"passage":"床前明月光，疑是地上霜。\n舉頭望明月，低頭思故鄉。"},{"type":"choice","prompt":"哪個動作寫出他在思念故鄉？","options":[{"text":"舉頭","ok":false,"why":"舉頭是望月。思念寫在下一句。"},{"text":"低頭","ok":true,"because":"「低頭思故鄉」把思念放在低下頭的時候。"},{"text":"疑是","ok":false,"why":"「疑是」在寫月光像霜，不是思念這個動作。"}],"passage":"床前明月光，疑是地上霜。\n舉頭望明月，低頭思故鄉。"},{"type":"choice","prompt":"同一輪明月，會讓分隔兩地的家人同時想起彼此。這和哪兩句最接近？","options":[{"text":"床前明月光，疑是地上霜。","ok":false,"why":"這兩句在寫月光的顏色像霜，還沒有寫到人。"},{"text":"舉頭望明月，低頭思故鄉。","ok":true,"because":"望見月亮，就低下頭想起故鄉的人。月是兩邊都能看見的景物。"},{"text":"只有「疑是地上霜」一句","ok":false,"why":"單是這一點沒有寫出思念。"}],"passage":"床前明月光，疑是地上霜。\n舉頭望明月，低頭思故鄉。"}],"done":"你已能分出詩中的景物和思念，不會把「疑是」解成「一定是」。"};
</script>
