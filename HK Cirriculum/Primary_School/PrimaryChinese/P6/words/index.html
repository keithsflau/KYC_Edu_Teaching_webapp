<title>小六｜詞語｜文言裡的之、而、其</title>
<link rel="stylesheet" href="../../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小六 · 詞語</p>
<h1>文言裡的之、而、其</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能按短句的上下文，解釋「之」、「而」和「其」在該句中的意思。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"「父母之恩，不可忘。」這裡的「之」最接近哪一個意思？","options":[{"text":"它","ok":false,"why":"這裡的「之」不是用來代替某一樣東西，它夾在「父母」和「恩」中間。"},{"text":"的","ok":true,"because":"「父母之恩」就是「父母的恩」。"},{"text":"但是","ok":false,"why":"「但是」是轉折。這句沒有轉折。"}]},{"type":"choice","prompt":"「學而時習之。」這裡的「之」指甚麼？","options":[{"text":"老師","ok":false,"why":"句中沒有出現老師。「之」承上面的「學」，指學過的東西。"},{"text":"的","ok":false,"why":"如果解作「的」，句子會變成「按時溫習的」，後面沒有東西可接，讀不通。"},{"text":"學過的東西","ok":true,"because":"「之」是代詞，指所學習的內容。按時溫習的是學過的東西。"}]},{"type":"choice","prompt":"「溫故而知新。」這裡的「而」是甚麼作用？","options":[{"text":"表示轉折，等於「但是」","ok":false,"why":"溫習舊的和領會新的不是相反的兩件事，不能解作但是。"},{"text":"連接前後，表示由溫習舊知識而有新的體會","ok":true,"because":"「而」在這裡是順着說下去：溫故，然後知新。"},{"text":"表示疑問","ok":false,"why":"這句不是問句，「而」也不負責發問。"}]},{"type":"choice","prompt":"「其葉甚綠。」這裡的「其」最接近哪一個意思？","options":[{"text":"不","ok":false,"why":"「其」不是否定。否定不會說成「其葉甚綠」。"},{"text":"它的","ok":true,"because":"「其葉」就是「它的葉子」。"},{"text":"和","ok":false,"why":"「和葉甚綠」讀不通，「其」不是「和」。"}]}],"done":"你已能分出「之」何時是「的」、何時指前面提過的事物，也不會把順接的「而」看成轉折。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
