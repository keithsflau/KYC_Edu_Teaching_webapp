<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小六 · 寫作</p>
<h1>一封寫得具體的建議信</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能排列建議信的稱謂、正文、祝頌語和署名，並選出對方做得到的具體建議。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"寫給圖書館主任的建議信，哪一項應放在最前面？","options":[{"text":"小六甲　陳小文敬上","ok":false,"why":"署名讓對方知道是誰寫的，要放在整封信的最後。"},{"text":"圖書館主任：","ok":true,"because":"稱謂先說明你在對誰說話，然後才寫事情。"},{"text":"此致　敬禮","ok":false,"why":"祝頌語放在正文之後，不是開頭。"}]},{"type":"choice","prompt":"哪一句建議最具體，對方知道可以怎樣試？","options":[{"text":"希望圖書館變得更好。","ok":false,"why":"這句沒有時間、做法，也沒有寫由誰負責。"},{"text":"建議小息開放閱讀角十分鐘，並由兩位圖書大使輪流值班。","ok":true,"because":"這句寫了時段、時長和值班的人，對方可以試行。"},{"text":"我很喜歡書。","ok":false,"why":"這只是個人感受，還沒有提出可以執行的建議。"}]},{"type":"order","prompt":"把這封短信排成正確次序。","choices":["小六甲　陳小文敬上","我想建議小息開放閱讀角十分鐘，讓同學看完一個短篇。","圖書館主任：","此致　敬禮"],"answer":["圖書館主任：","我想建議小息開放閱讀角十分鐘，讓同學看完一個短篇。","此致　敬禮","小六甲　陳小文敬上"],"why":"先稱呼對方，再寫事由，然後祝頌，最後才署名。","because":"這封信的次序是稱謂、正文、祝頌語、署名。","glue":"\n"},{"type":"choice","prompt":"哪一句不適合寫進給主任的信？","options":[{"text":"主任您好，我想提出一個小建議。","ok":false,"why":"這句有稱謂，也說了來意，語氣清楚。"},{"text":"喂，你趕快開門。","ok":true,"because":"沒有稱謂，語氣像命令，主任無法把它當成一項建議。"},{"text":"如果可以，請在下星期試行三天。","ok":false,"why":"這句寫出試行多久，具體，也用了「請」。"}]}],"done":"你已能把建議寫成可執行的做法，也知道署名要放在最後。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
