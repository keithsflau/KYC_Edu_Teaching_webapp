<h1>中秋：香港窗前的同一個月亮</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能閱讀中秋短文，找出人在香港、親人在蘇州時，作者怎樣藉月亮寫出彼此記掛。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"窗前的兩碟月餅，分別是給誰的？","options":[{"text":"兩碟都寄給蘇州的表哥","ok":false,"why":"月餅放在香港的窗前，文中沒有寫把它們寄出。"},{"text":"一碟給窗前的家人，一碟奶奶說給月亮看看","ok":true,"because":"奶奶放了兩碟，並親口說了另一碟是給月亮看看的。"},{"text":"一碟給老師，一碟給同學","ok":false,"why":"文中的人物是奶奶、爸爸、表哥和敘述者，沒有老師和同學。"}],"passage":"中秋那晚，我在香港的窗前。奶奶放了兩碟月餅，一碟給我們，一碟說是「給月亮上看看」。爸爸指着月亮說，蘇州的表哥也在看同一個月亮。我忽然明白，月餅的甜，不單在口裡，也在我們記得彼此的時候。"},{"type":"choice","prompt":"爸爸提起蘇州的表哥，是要說明甚麼？","options":[{"text":"他打算當晚就出發去蘇州","ok":false,"why":"文中只說表哥也在看月亮，沒有寫出發。"},{"text":"分隔兩地的親人也看着同一個月亮，彼此記掛","ok":true,"because":"人在香港，表哥在蘇州，同一個月亮把記掛連起來。"},{"text":"蘇州沒有中秋","ok":false,"why":"爸爸正是說表哥也在看這輪中秋的月亮。"}],"passage":"中秋那晚，我在香港的窗前。奶奶放了兩碟月餅，一碟給我們，一碟說是「給月亮上看看」。爸爸指着月亮說，蘇州的表哥也在看同一個月亮。我忽然明白，月餅的甜，不單在口裡，也在我們記得彼此的時候。"},{"type":"choice","prompt":"「月餅的甜，不單在口裡」是甚麼意思？","options":[{"text":"月餅太甜，所以不該吃","ok":false,"why":"作者不是在談要不要吃，而是在談記得彼此。"},{"text":"甜也來自家人互相記掛","ok":true,"because":"下一句把甜接在「記得彼此的時候」。"},{"text":"月亮是甜的","ok":false,"why":"甜的是月餅，以及記得家人的那一刻，不是月亮本身。"}],"passage":"中秋那晚，我在香港的窗前。奶奶放了兩碟月餅，一碟給我們，一碟說是「給月亮上看看」。爸爸指着月亮說，蘇州的表哥也在看同一個月亮。我忽然明白，月餅的甜，不單在口裡，也在我們記得彼此的時候。"},{"type":"choice","prompt":"這篇短文把香港和蘇州連在一起，靠的是甚麼？","options":[{"text":"兩地課室的大小一樣","ok":false,"why":"文中沒有比較課室。"},{"text":"同一個月亮，和兩地都在過的中秋","ok":true,"because":"敘述者在香港望月，表哥在蘇州望月，中秋是兩邊都在過的節。"},{"text":"一封已經寄出的信","ok":false,"why":"文中沒有寫信，寫的是窗前看月。"}],"passage":"中秋那晚，我在香港的窗前。奶奶放了兩碟月餅，一碟給我們，一碟說是「給月亮上看看」。爸爸指着月亮說，蘇州的表哥也在看同一個月亮。我忽然明白，月餅的甜，不單在口裡，也在我們記得彼此的時候。"}],"done":"你已能從月餅、月亮和兩地親人，說出這篇短文的記掛，而不是把它讀成行程通知。"};
</script>
