<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小一｜識字｜選出正確的字</title>
<link rel="stylesheet" href="../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">返回中國語文</a>
<p class="meta">小一 · 識字</p>
<h1>選出正確的字</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能按意思選出「日、月、火、子、字」，並分清孩子的「子」和文字的「字」。</p>
</section>
<section class="objective">
<h2>怎樣做</h2>
<p>先讀意思，再選一個字。選了之後才會聽到聲音。答對會有兩聲短音，才可以到下一題。</p>
</section>
<section class="objective">
<h2>答錯時</h2>
<p>答錯會聽到較低的一聲，並寫出這個字像甚麼、為甚麼不是題目要的那個。請再選一次。</p>
</section>
<main id="app"></main>
</div>
<script src="../shared/sfx.js"></script>
<script>
window.LESSON = {
  done: "你已能按意思選出太陽、月亮和火焰的字，也不會把「子」和「字」看錯。",
  items: [
    {
      type: "choice",
      prompt: "哪一個字最像圓圓的太陽？",
      options: [
        { text: "月", ok: false, why: "「月」像彎彎的月亮，缺了一邊，不是圓圓的太陽。" },
        { text: "日", ok: true, because: "「日」外圍圓圓的，中間一橫，像太陽。" },
        { text: "目", ok: false, why: "「目」像一隻眼睛，和太陽無關。" }
      ]
    },
    {
      type: "choice",
      prompt: "哪一個字最像彎彎的月亮？",
      options: [
        { text: "日", ok: false, why: "「日」是圓的，月亮的字形少了一邊。" },
        { text: "月", ok: true, because: "「月」的一邊開口，正像月牙。" },
        { text: "用", ok: false, why: "「用」不是象形的月亮。" }
      ]
    },
    {
      type: "choice",
      prompt: "哪一個字像向上燒的火焰？",
      options: [
        { text: "水", ok: false, why: "「水」像濺起的水花，不是火焰。" },
        { text: "火", ok: true, because: "「火」的點像火星，其餘筆畫像火舌向上。" },
        { text: "山", ok: false, why: "「山」像並排的山峯，不是火焰。" }
      ]
    },
    {
      type: "choice",
      prompt: "「孩子」的「子」是哪一個？",
      options: [
        { text: "字", ok: false, why: "「字」是文字的字，不是孩子的子。" },
        { text: "子", ok: true, because: "「孩子」用的是「子」。" },
        { text: "好", ok: false, why: "「好」是「女」和「子」合起來的字。題目只要孩子的「子」。" }
      ]
    },
    {
      type: "choice",
      prompt: "老師說「請寫一個字」。這裡的「字」是哪一個？",
      options: [
        { text: "子", ok: false, why: "「子」是孩子。老師要你寫的是文字。" },
        { text: "自", ok: false, why: "「自」是自己，不是文字的字。" },
        { text: "字", ok: true, because: "「寫一個字」用的是文字的「字」。" },
        { text: "紫", ok: false, why: "「紫」是一種顏色，不是要寫下來的那個字。" }
      ]
    }
  ]
};
</script>
<script src="../shared/engine.js"></script>
</body>
</html>
