<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小四 · 句子</p>
<h1>擬聲詞要像那個聲音</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能按聲音的來源選用擬聲詞，並指出用錯聲音的句子。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"雨點打在窗上，____地響。","options":[{"text":"汪汪","ok":false,"why":"汪汪是狗的叫聲，不是雨打在窗上的聲音。"},{"text":"淅瀝瀝","ok":true,"because":"淅瀝瀝用來寫細碎、連續的雨聲。"},{"text":"轟隆隆","ok":false,"why":"轟隆隆是很響的雷聲或巨響，小雨打窗沒有這麼重。"}]},{"type":"choice","prompt":"遠處傳來____的雷聲。","options":[{"text":"淅瀝瀝","ok":false,"why":"淅瀝瀝太輕，不像雷。"},{"text":"汪汪","ok":false,"why":"汪汪是狗的叫聲，不是打在窗上的雨聲。"},{"text":"轟隆隆","ok":true,"because":"雷聲低沉而響，可以用轟隆隆。"}]},{"type":"choice","prompt":"小狗____地叫，提醒主人有人到了。","options":[{"text":"呼呼","ok":false,"why":"呼呼多用來寫風聲。"},{"text":"汪汪","ok":true,"because":"小狗提醒主人時發出的叫聲，常用「汪汪」。"},{"text":"嘩啦啦","ok":false,"why":"嘩啦啦多用來寫流水或東西傾瀉的聲音。"}]},{"type":"choice","prompt":"哪一句的擬聲詞用錯了？","options":[{"text":"北風呼呼地吹。","ok":false,"why":"呼呼可以寫風聲，這句說得通。"},{"text":"小溪嘩啦啦地流。","ok":false,"why":"嘩啦啦可以寫流水聲，這句說得通。"},{"text":"白雲汪汪地飄。","ok":true,"because":"白雲飄動沒有狗叫。汪汪不能用來寫雲。"}]}],"done":"你已能把雨、雷、狗和風的聲音分開，不會把狗叫安到白雲上。"};
</script>
