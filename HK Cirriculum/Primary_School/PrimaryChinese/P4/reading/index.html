<p class="meta">小四 · 閱讀</p>
<h1>說明：部首「氵」能告訴你甚麼</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能從說明文字找出部首提供的線索，也知道不能只靠部首猜全部意思。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"河、海、洗都有「氵」，主要是因為甚麼？","options":[{"text":"三個字的讀音相同","ok":false,"why":"河、海、洗的讀音並不相同。"},{"text":"它們的意思都和水有關","ok":true,"because":"河和海是水，洗是用水清潔。部首提示了這一點。"},{"text":"它們都是動詞","ok":false,"why":"河和海是事物的名稱，不是動詞。"}],"passage":"很多和水有關的字，都有「氵」。河是流動的水，海是很大片的水，洗是用水把東西弄乾淨。看見「氵」，可以猜想這個字可能和水有關，但還是要用句子來確認。例如「法」字今天的意思，就不能只靠部首來猜。"},{"type":"choice","prompt":"為甚麼不能只靠部首判斷每一個字的意思？","options":[{"text":"部首一定是錯的","ok":false,"why":"部首常常給出線索，例如「氵」和水有關。它只是不能代替整個字在句子裡的意思。"},{"text":"有些字今天的意思，已經不能單從部首看出","ok":true,"because":"文中以「法」為例，說明還要用句子確認。"},{"text":"「氵」只出現在錯字裡","ok":false,"why":"河、海、洗都是常用字，不是錯字。"}],"passage":"很多和水有關的字，都有「氵」。河是流動的水，海是很大片的水，洗是用水把東西弄乾淨。看見「氵」，可以猜想這個字可能和水有關，但還是要用句子來確認。例如「法」字今天的意思，就不能只靠部首來猜。"},{"type":"choice","prompt":"「洗」字的「氵」最能提示甚麼？","options":[{"text":"這個動作和高山有關","ok":false,"why":"和山有關的部首是「山」，不是三點水。"},{"text":"這個動作和用水清潔有關","ok":true,"because":"文中直接說明洗是用水把東西弄乾淨。"},{"text":"這個字一定讀作「河」","ok":false,"why":"部首相同，不代表讀音相同。"}],"passage":"很多和水有關的字，都有「氵」。河是流動的水，海是很大片的水，洗是用水把東西弄乾淨。看見「氵」，可以猜想這個字可能和水有關，但還是要用句子來確認。例如「法」字今天的意思，就不能只靠部首來猜。"}],"done":"你已能用「氵」推測跟水有關的字，也知道要回到句子裡確認。"};
</script>
