<title>小四｜寫作｜一段話只要一個中心</title>
<link rel="stylesheet" href="../../shared/lesson.css">
</head>
<body>
<div class="wrap">
<a class="back" href="../../index.html">返回中國語文</a>
<p class="meta">小四 · 寫作</p>
<h1>一段話只要一個中心</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能選出中心句和相關的支持句，並刪去離題的句子。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"哪一句適合做「校園榕樹」這段的中心句？","options":[{"text":"我昨天吃了魚蛋。","ok":false,"why":"這句和榕樹無關，讀者不知道這段要寫甚麼。"},{"text":"校園門口有一棵大榕樹，是我們最喜歡休息的地方。","ok":true,"because":"這句說了寫哪棵樹，也說了這段要寫的中心：大家喜歡在那裡休息。"},{"text":"小鳥有翅膀。","ok":false,"why":"這句太寬，沒有說出校園和那棵榕樹。"}]},{"type":"choice","prompt":"哪一句能支持「大家喜歡在樹下休息」？","options":[{"text":"中午很熱，我們坐在樹蔭下看書。","ok":true,"because":"樹蔭、坐下、看書，都在寫在樹下休息。"},{"text":"榕樹的學名很長。","ok":false,"why":"學名沒有寫出人們怎樣在樹下休息。"},{"text":"校車是黃色的。","ok":false,"why":"校車的顏色和在樹下休息無關。"}]},{"type":"choice","prompt":"哪一句離題，不應放進這段？","options":[{"text":"秋天有鳥停在那棵榕樹上唱歌。","ok":false,"why":"這句仍然在寫那棵樹，可以支持它是大家留戀的地方。"},{"text":"我的鉛筆忽然斷了。","ok":true,"because":"鉛筆斷了和榕樹、休息都沒有關係，會讓這段失去中心。"},{"text":"樹蔭下很涼爽。","ok":false,"why":"涼爽正好說明為甚麼大家喜歡在樹下休息。"}]}],"done":"你已能讓中心句和支持句說同一件事。"};
</script>
<script src="../../shared/engine.js"></script>
</body>
</html>
