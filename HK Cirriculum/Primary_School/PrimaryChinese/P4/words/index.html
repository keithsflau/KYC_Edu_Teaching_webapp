<p class="meta">小四 · 詞語</p>
<h1>成語用在甚麼情況</h1>
<section class="objective">
<h2>學習目標</h2>
<p>能分辨「守株待兔」、「畫蛇添足」、「亡羊補牢」和「掩耳盜鈴」適用的情況。</p>
</section>
<main id="app"></main>
</div>
<script src="../../shared/sfx.js"></script>
<script>
window.LESSON = {"items":[{"type":"choice","prompt":"小寶不溫習，只說「考試也許會剛好遇上我見過的題」。這最像哪個成語？","options":[{"text":"亡羊補牢","ok":false,"why":"他還沒有補救，只是在等一次僥倖。亡羊補牢是出了問題之後立刻去修補。"},{"text":"守株待兔","ok":true,"because":"守株待兔說的是不努力，只等偶然的收穫。不溫習卻等考運，就是這樣。"},{"text":"畫蛇添足","ok":false,"why":"畫蛇添足是多做了不該加的部分。他的問題是不準備。"}]},{"type":"choice","prompt":"報告已經清楚，小美又加了一段跟題目無關的笑話，結果超時了。老師說她畫蛇添足，是因為甚麼？","options":[{"text":"笑話一定讓報告更好","ok":false,"why":"這個成語不是在稱讚添加的部分，而是說多餘的添加幫了倒忙。"},{"text":"多加了不需要的內容，反而破壞了完整","ok":true,"because":"蛇本來已經畫完，再添上腳就不成其為蛇。無關的笑話讓報告超時，正是多此一舉。"},{"text":"她畫圖畫得不夠好","ok":false,"why":"這裡的「畫蛇」是成語，不是在評她的圖畫技巧。"}]},{"type":"choice","prompt":"小宇上次小組忘了帶材料，這次提前一天檢查書包。這較像哪個成語？","options":[{"text":"掩耳盜鈴","ok":false,"why":"他沒有掩蓋問題，而是正視上次的錯並補救。"},{"text":"守株待兔","ok":false,"why":"他不是在空等，而是自己做了檢查。"},{"text":"亡羊補牢","ok":true,"because":"羊走失後把羊圈修好，還不算遲。忘了帶材料之後願意事先檢查，就是及時補救。"}]},{"type":"choice","prompt":"小晴不會答，卻捂着耳朵說：「我沒聽見老師報分數，所以沒有不及格。」這最像哪個成語？","options":[{"text":"守株待兔","ok":false,"why":"她不是在等待意外的收穫，而是不肯面對已經發生的事。"},{"text":"掩耳盜鈴","ok":true,"because":"捂住自己的耳朵，並不能讓分數消失。這是在騙自己。"},{"text":"亡羊補牢","ok":false,"why":"亡羊補牢會去改正。她只是不肯聽，沒有補救。"}]}],"done":"你已能按事情的經過選成語，而不是只記一個差不多的意思。"};
</script>
