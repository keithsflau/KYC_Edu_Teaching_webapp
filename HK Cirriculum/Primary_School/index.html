<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小學課程</title>
  <meta name="description" content="小學四科：中國語文、英國語文、數學、常識。進入科目後按年級分組。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Noto Sans TC", "Inter", sans-serif; }
    .glass-card {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.55);
      transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
  </style>
  <link rel="stylesheet" href="../_shared/ncs-i18n.css" />
  <script src="../_shared/ncs-i18n.js"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 p-6">
  <div class="max-w-6xl mx-auto">
    <header class="mb-12 text-center relative">
      <div class="absolute right-0 top-0" id="ncs-lang-switcher"></div>
      <h1 class="text-4xl font-bold text-slate-800 mb-4" data-i18n="title">小學課程</h1>
      <p class="text-slate-600 max-w-2xl mx-auto" data-i18n="lead">請選擇科目。進入後按年級分組。</p>
      <div class="mt-6">
        <a href="../index.html" class="inline-flex items-center text-sm text-slate-500 hover:text-blue-600 transition-colors">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          <span data-i18n="back">返回課程首頁</span>
        </a>
      </div>
    </header>

    <div class="grid gap-6 md:grid-cols-2">
      <a href="PrimaryChinese/index.html" class="glass-card rounded-2xl p-8 block group">
        <h2 class="text-2xl font-bold text-slate-800 group-hover:text-amber-600 transition-colors">中國語文</h2>
        <p class="text-slate-500 mt-1">Chinese Language</p>
        <p class="text-sm text-slate-700 mt-4">進入後按年級分組</p>
      </a>

      <a href="English/index.html" class="glass-card rounded-2xl p-8 block group">
        <h2 class="text-2xl font-bold text-slate-800 group-hover:text-indigo-600 transition-colors">英國語文</h2>
        <p class="text-slate-500 mt-1">English Language</p>
        <p class="text-sm text-slate-700 mt-4">進入後按年級分組</p>
      </a>

      <a href="Mathematics/index.html" class="glass-card rounded-2xl p-8 block group">
        <h2 class="text-2xl font-bold text-slate-800 group-hover:text-blue-600 transition-colors">數學</h2>
        <p class="text-slate-500 mt-1">Mathematics</p>
        <p class="text-sm text-slate-700 mt-4">進入後按年級分組</p>
      </a>

      <a href="General_Studies/index.html" class="glass-card rounded-2xl p-8 block group">
        <h2 class="text-2xl font-bold text-slate-800 group-hover:text-emerald-600 transition-colors">常識</h2>
        <p class="text-slate-500 mt-1">General Studies</p>
        <p class="text-sm text-slate-700 mt-4">進入後按年級分組</p>
      </a>
    </div>
  </div>

  <script>
    NcsI18n.initHub({
      switcher: "#ncs-lang-switcher",
      title: { zh: "小學課程", en: "Primary School" },
      strings: {
        zh: {
          title: "小學課程",
          lead: "請選擇科目。進入後按年級分組。",
          back: "返回課程首頁"
        },
        en: {
          title: "Primary School",
          lead: "Choose a subject. Lessons are grouped by year after you enter.",
          back: "Back to curriculum home"
        }
      }
    });
  </script>
</body>
</html>
