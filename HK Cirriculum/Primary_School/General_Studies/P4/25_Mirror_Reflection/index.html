<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鏡面反射｜小四常識</title>
<style>
  :root { --accent: #4338ca; --soft: #eef2ff; }
  body { margin: 0; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; background: var(--soft); color: #1e293b; }
  main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  a { color: var(--accent); font-weight: 700; text-decoration: none; }
  .meta { margin: 0.8rem 0 0; color: var(--accent); font-weight: 800; letter-spacing: 0.04em; }
  h1 { margin: 0.2rem 0 0; font-size: 2rem; }
  h2 { margin: 0; font-size: 1.15rem; }
  .card { background: #fff; border-radius: 1rem; padding: 1.1rem 1.2rem; margin-top: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06); }
  ul { margin: 0.6rem 0 0; padding-left: 1.2rem; line-height: 1.7; }
  p { line-height: 1.7; }
  .scene { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.5rem; align-items: center; margin-top: 0.8rem; background: #f8fafc; border-radius: 0.8rem; padding: 0.8rem; }
  .ray { height: 0.35rem; border-radius: 999px; background: #f59e0b; transform: rotate(-28deg); }
  .mirror { width: 0.45rem; height: 4.5rem; border-radius: 999px; background: linear-gradient(#cbd5e1, #64748b); }
  button.choice { display: block; width: 100%; text-align: left; margin-top: 0.7rem; padding: 0.9rem 1rem; border-radius: 0.9rem; border: 2px solid #c7d2fe; background: #fff; font: inherit; font-size: 1.05rem; line-height: 1.5; cursor: pointer; }
  button.choice:hover:not(:disabled) { border-color: var(--accent); }
  button.choice:disabled { cursor: default; opacity: 0.72; }
  button.choice.bad { border-color: #e11d48; background: #fff1f2; }
  button.choice.good { border-color: #059669; background: #ecfdf5; opacity: 1; }
  #feedback { min-height: 4.8rem; font-weight: 700; line-height: 1.7; }
  #feedback.bad { color: #be123c; }
  #feedback.good { color: #047857; }
</style>
</head>
<body>
<main>
  <p><a href="../../index.html">← 返回常識科</a></p>
  <p class="meta">小四 · 科學與科技</p>
  <h1>鏡面反射</h1>
  <section class="card">
    <h2>學習目標</h2>
    <ul>
      <li>知道光沿直線走，射到平滑的平面鏡會反射。</li>
      <li>明白入射角等於反射角。</li>
      <li>知道平面鏡裡的像與物件一樣大，而且左右相反。</li>
    </ul>
  </section>
  <section class="card">
    <h2>一項操作</h2>
    <p>一束光斜斜射向平面鏡。選出反射後正確的路線。</p>
    <div class="scene" aria-hidden="true">
      <div class="ray"></div>
      <div class="mirror"></div>
      <div class="ray"></div>
    </div>
    <div id="choices">
      <button type="button" class="choice" data-ok="0" data-why="答錯了。平面鏡表面平滑，光線不會貼著鏡面滑走。光會被反射，反射角與入射角一樣大。">光線貼著鏡面滑走，不彈開。</button>
      <button type="button" class="choice" data-ok="1" data-why="答對了。光射到平面鏡會反射，反射角等於入射角，所以光線彈向另一邊。">反射角與入射角一樣大，光線彈向另一邊。</button>
      <button type="button" class="choice" data-ok="0" data-why="答錯了。平面鏡把光反射回來，光不能穿過鏡面再沿原來方向直行。">光線穿過鏡子，繼續沿原來方向直行。</button>
    </div>
    <p id="feedback">選一條路線。</p>
  </section>
</main>
<script>
(function () {
  var box = document.getElementById("choices");
  var feedback = document.getElementById("feedback");
  var done = false;
  var ctx = null;
  function tone(ok) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    var t = ctx.currentTime;
    var notes = ok
      ? [{ f: 523.25, at: 0, d: 0.1 }, { f: 659.25, at: 0.09, d: 0.12 }]
      : [{ f: 196, at: 0, d: 0.16 }];
    notes.forEach(function (n) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = ok ? "sine" : "triangle";
      osc.frequency.setValueAtTime(n.f, t + n.at);
      gain.gain.setValueAtTime(0.0001, t + n.at);
      gain.gain.exponentialRampToValueAtTime(0.05, t + n.at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + n.at + n.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t + n.at);
      osc.stop(t + n.at + n.d + 0.02);
    });
  }
  box.addEventListener("click", function (event) {
    var btn = event.target.closest("button");
    if (!btn || done) return;
    var ok = btn.getAttribute("data-ok") === "1";
    tone(ok);
    feedback.textContent = btn.getAttribute("data-why");
    feedback.className = ok ? "good" : "bad";
    if (ok) {
      done = true;
      box.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
      btn.classList.add("good");
    } else {
      box.querySelectorAll("button").forEach(function (b) { b.classList.remove("bad"); });
      btn.classList.add("bad");
    }
  });
})();
</script>
</body>
</html>
