<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>噪音｜小四常識</title>
<style>
  :root { --accent: #b45309; --soft: #fffbeb; }
  body { margin: 0; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; background: var(--soft); color: #1e293b; }
  main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  a { color: var(--accent); font-weight: 700; text-decoration: none; }
  .meta { margin: 0.8rem 0 0; color: var(--accent); font-weight: 800; letter-spacing: 0.04em; }
  h1 { margin: 0.2rem 0 0; font-size: 2rem; }
  h2 { margin: 0; font-size: 1.15rem; }
  .card { background: #fff; border-radius: 1rem; padding: 1.1rem 1.2rem; margin-top: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06); }
  ul { margin: 0.6rem 0 0; padding-left: 1.2rem; line-height: 1.7; }
  p { line-height: 1.7; }
  .meter { margin-top: 0.7rem; background: #0f172a; color: #fbbf24; border-radius: 0.8rem; padding: 0.8rem 1rem; font-weight: 800; letter-spacing: 0.04em; }
  button.choice { display: block; width: 100%; text-align: left; margin-top: 0.7rem; padding: 0.9rem 1rem; border-radius: 0.9rem; border: 2px solid #fde68a; background: #fff; font: inherit; font-size: 1.05rem; line-height: 1.5; cursor: pointer; }
  button.choice:hover:not(:disabled) { border-color: var(--accent); }
  button.choice:disabled { cursor: default; opacity: 0.72; }
  button.choice.bad { border-color: #e11d48; background: #fff1f2; }
  button.choice.good { border-color: #059669; background: #ecfdf5; opacity: 1; }
  #feedback { min-height: 4.8rem; font-weight: 700; line-height: 1.7; }
  #feedback.bad { color: #be123c; }
  #feedback.good { color: #047857; }
</style>
</head>
<body>
<main>
  <p><a href="../../index.html">← 返回常識科</a></p>
  <p class="meta">小四 · 科學與科技</p>
  <h1>噪音</h1>
  <section class="card">
    <h2>學習目標</h2>
    <ul>
      <li>知道噪音是令人不舒服、不想聽到的聲音。</li>
      <li>知道聲音有多響可以用分貝表示。</li>
      <li>明白長時間處於很大聲的環境會傷害聽覺，要減少停留或戴上耳罩。</li>
    </ul>
  </section>
  <section class="card">
    <h2>一項操作</h2>
    <p>噪音計長時間停在 95 分貝。選出最能保護聽覺的做法。</p>
    <p class="meter" aria-hidden="true">噪音計　95 dB</p>
    <div id="choices">
      <button type="button" class="choice" data-ok="0" data-why="答錯了。不必等到 150 分貝。大約 85 分貝以上如果持續一段時間，已經可能傷害聽覺。95 分貝已經很響。">繼續留下，因為還未到 150 分貝。</button>
      <button type="button" class="choice" data-ok="1" data-why="答對了。95 分貝屬於很大的噪音。戴上耳罩並盡快離開，可以減少進入耳朵的聲波。">戴上耳罩，並盡快離開這個地方。</button>
      <button type="button" class="choice" data-ok="0" data-why="答錯了。耳朵不會因為習慣了就不受傷。長時間聽很響的聲音，仍可能損害聽覺。">拿掉耳罩，讓耳朵慢慢習慣。</button>
    </div>
    <p id="feedback">選一個做法。</p>
  </section>
</main>
<script>
(function () {
  var box = document.getElementById("choices");
  var feedback = document.getElementById("feedback");
  var done = false;
  var ctx = null;
  function tone(ok) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    var t = ctx.currentTime;
    var notes = ok
      ? [{ f: 392, at: 0, d: 0.1 }, { f: 523.25, at: 0.09, d: 0.12 }]
      : [{ f: 146.83, at: 0, d: 0.16 }];
    notes.forEach(function (n) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = ok ? "sine" : "triangle";
      osc.frequency.setValueAtTime(n.f, t + n.at);
      gain.gain.setValueAtTime(0.0001, t + n.at);
      gain.gain.exponentialRampToValueAtTime(0.05, t + n.at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + n.at + n.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t + n.at);
      osc.stop(t + n.at + n.d + 0.02);
    });
  }
  box.addEventListener("click", function (event) {
    var btn = event.target.closest("button");
    if (!btn || done) return;
    var ok = btn.getAttribute("data-ok") === "1";
    tone(ok);
    feedback.textContent = btn.getAttribute("data-why");
    feedback.className = ok ? "good" : "bad";
    if (ok) {
      done = true;
      box.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
      btn.classList.add("good");
    } else {
      box.querySelectorAll("button").forEach(function (b) { b.classList.remove("bad"); });
      btn.classList.add("bad");
    }
  });
})();
</script>
</body>
</html>
