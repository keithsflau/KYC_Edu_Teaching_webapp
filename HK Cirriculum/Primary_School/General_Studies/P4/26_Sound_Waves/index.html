<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聲波｜小四常識</title>
<style>
  :root { --accent: #6d28d9; --soft: #f5f3ff; }
  body { margin: 0; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; background: var(--soft); color: #1e293b; }
  main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  a { color: var(--accent); font-weight: 700; text-decoration: none; }
  .meta { margin: 0.8rem 0 0; color: var(--accent); font-weight: 800; letter-spacing: 0.04em; }
  h1 { margin: 0.2rem 0 0; font-size: 2rem; }
  h2 { margin: 0; font-size: 1.15rem; }
  .card { background: #fff; border-radius: 1rem; padding: 1.1rem 1.2rem; margin-top: 1rem; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06); }
  ul { margin: 0.6rem 0 0; padding-left: 1.2rem; line-height: 1.7; }
  p { line-height: 1.7; }
  .waves { display: flex; gap: 0.35rem; align-items: flex-end; height: 2.4rem; margin-top: 0.6rem; }
  .waves span { flex: 1; background: #8b5cf6; border-radius: 999px 999px 0 0; }
  .waves span:nth-child(odd) { height: 40%; }
  .waves span:nth-child(even) { height: 90%; }
  button.choice { display: block; width: 100%; text-align: left; margin-top: 0.7rem; padding: 0.9rem 1rem; border-radius: 0.9rem; border: 2px solid #ddd6fe; background: #fff; font: inherit; font-size: 1.05rem; line-height: 1.5; cursor: pointer; }
  button.choice:hover:not(:disabled) { border-color: var(--accent); }
  button.choice:disabled { cursor: default; opacity: 0.72; }
  button.choice.bad { border-color: #e11d48; background: #fff1f2; }
  button.choice.good { border-color: #059669; background: #ecfdf5; opacity: 1; }
  #feedback { min-height: 4.8rem; font-weight: 700; line-height: 1.7; }
  #feedback.bad { color: #be123c; }
  #feedback.good { color: #047857; }
</style>
</head>
<body>
<main>
  <p><a href="../../index.html">← 返回常識科</a></p>
  <p class="meta">小四 · 科學與科技</p>
  <h1>聲波</h1>
  <section class="card">
    <h2>學習目標</h2>
    <ul>
      <li>知道聲音由物體振動產生，並以聲波傳播。</li>
      <li>明白聲波需要介質，例如空氣或水。</li>
      <li>知道抽走空氣後，聲音不能傳過去。</li>
    </ul>
  </section>
  <section class="card">
    <h2>一項操作</h2>
    <p>鬧鐘正在振動發聲。選出聽不到鬧鐘聲的地方。</p>
    <div class="waves" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div id="choices">
      <button type="button" class="choice" data-ok="0" data-why="答錯了。空氣是介質。振動會推動空氣形成聲波，所以課室裡聽得到鬧鐘。">充滿空氣的課室</button>
      <button type="button" class="choice" data-ok="1" data-why="答對了。聲波要靠介質傳播。玻璃罩抽走空氣後沒有介質，聲音不能傳出來。">抽走空氣的密封玻璃罩</button>
      <button type="button" class="choice" data-ok="0" data-why="答錯了。水也是介質。聲波可以在水中傳播，所以不是完全聽不到。">清水之中</button>
    </div>
    <p id="feedback">選一個地方。</p>
  </section>
</main>
<script>
(function () {
  var box = document.getElementById("choices");
  var feedback = document.getElementById("feedback");
  var done = false;
  var ctx = null;
  function tone(ok) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    var t = ctx.currentTime;
    var notes = ok
      ? [{ f: 440, at: 0, d: 0.1 }, { f: 554.37, at: 0.09, d: 0.12 }]
      : [{ f: 174.61, at: 0, d: 0.16 }];
    notes.forEach(function (n) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = ok ? "sine" : "triangle";
      osc.frequency.setValueAtTime(n.f, t + n.at);
      gain.gain.setValueAtTime(0.0001, t + n.at);
      gain.gain.exponentialRampToValueAtTime(0.05, t + n.at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + n.at + n.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t + n.at);
      osc.stop(t + n.at + n.d + 0.02);
    });
  }
  box.addEventListener("click", function (event) {
    var btn = event.target.closest("button");
    if (!btn || done) return;
    var ok = btn.getAttribute("data-ok") === "1";
    tone(ok);
    feedback.textContent = btn.getAttribute("data-why");
    feedback.className = ok ? "good" : "bad";
    if (ok) {
      done = true;
      box.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
      btn.classList.add("good");
    } else {
      box.querySelectorAll("button").forEach(function (b) { b.classList.remove("bad"); });
      btn.classList.add("bad");
    }
  });
})();
</script>
</body>
</html>
