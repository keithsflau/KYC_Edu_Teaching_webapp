              text: L("叫得更大聲", "Shout even louder", "もっと大きな声で叫ぶ", "더 크게 소리치기", "Gritar más fuerte", "Noch lauter rufen", "Huuda kovempaa", "Crier encore plus fort", "اصرخ بصوت أعلى", "Gridare ancora più forte")
            }
          ]
        },
        {
          id: "elder",
          x: 1,
          y: 7,
          icon: "👵",
          line: L(
            "提着重物的婆婆會受到影響，因為她走得很吃力，下一步可以讓路，並問她要不要幫忙。",
            "The elderly woman carrying a heavy load is affected, because she is struggling to walk, so next you can make way and ask if she wants help.",
            "重い荷物を持つおばあさんが影響を受けます。歩くのがつらそうなので、次は道をゆずり、手伝いましょうかと聞けます。",
            "무거운 짐을 든 할머니가 영향을 받습니다. 힘겹게 걷고 있으니, 다음에는 길을 양보하고 도움이 필요한지 물을 수 있습니다.",
            "La señora mayor que carga algo pesado se ve afectada, porque camina con dificultad, así que después puedes dejarle paso y preguntar si quiere ayuda.",
            "Die ältere Frau mit der schweren Last ist betroffen, weil sie mühsam geht, also kannst du als Nächstes Platz machen und fragen, ob sie Hilfe möchte.",
            "Raskas taakka haittaa mummoa, koska hän kävelee vaivalloisesti, joten seuraavaksi voit väistää ja kysyä, haluaako hän apua.",
            "La dame âgée qui porte une charge lourde est touchée, parce qu'elle marche avec peine, donc ensuite tu peux lui laisser le passage et lui demander si elle veut de l'aide.",
            "الجدة التي تحمل حملا ثقيلا تتأثر، لأنها تمشي بصعوبة، فالخطوة التالية أن تفسح لها الطريق وتسألها إن كانت تريد مساعدة.",
            "La signora anziana che porta un carico pesante è toccata, perché cammina a fatica, quindi il passo successivo è lasciarle spazio e chiedere se vuole aiuto."
          ),
          choices: [
            {
              id: "ask",
              ok: true,
              text: L(
                "讓路，並問她要不要幫忙",
                "Make way and ask if she wants help",
                "道をゆずり、手伝うか聞く",
                "길을 양보하고 도울지 묻기",
                "Dejarle paso y preguntar si quiere ayuda",
                "Platz machen und fragen, ob sie Hilfe möchte",
                "Väistä ja kysy, haluaako hän apua",
                "Lui laisser le passage et demander si elle veut de l'aide",
                "افسح الطريق واسأل إن كانت تريد مساعدة",
                "Lasciarle spazio e chiedere se vuole aiuto"
              )
            },
            {
              id: "run",
              ok: false,
              text: L("從她身旁跑過", "Run past her", "横を走り抜ける", "옆을 뛰어 지나가기", "Pasar corriendo a su lado", "An ihr vorbeirennen", "Juokse hänen ohitseen", "Courir à côté d'elle", "اركض من جانبها", "Correrle accanto")
            }
          ]
        },
        {
          id: "queue",
          x: 7,
          y: 8,
          icon: "🚶",
          line: L(
            "排在後面的人會受到影響，因為有人插隊就要等更久，下一步可以排在隊伍最後。",
            "The people waiting behind are affected, because someone pushing in makes them wait longer, so next you can stand at the end of the line.",
            "後ろで待っている人が影響を受けます。割り込むともっと待つので、次は列の最後に並べます。",
            "뒤에서 기다리는 사람이 영향을 받습니다. 새치기하면 더 오래 기다리니, 다음에는 줄의 맨 뒤에 설 수 있습니다.",
            "Las personas que esperan detrás se ven afectadas, porque si alguien se cuela esperan más, así que después puedes ponerte al final de la fila.",
            "Die wartenden Menschen dahinter sind betroffen, weil Vordrängeln sie länger warten lässt, also kannst du dich als Nächstes hinten anstellen.",
            "Etuilu haittaa jonossa takana odottavia, koska he joutuvat odottamaan kauemmin, joten seuraavaksi voit mennä jonon viimeiseksi.",
            "Les personnes qui attendent derrière sont touchées, parce que quelqu'un qui resquille les fait attendre plus, donc ensuite tu peux te mettre à la fin de la file.",
            "الناس المنتظرون في الخلف يتأثرون، لأن تجاوز الدور يطيل انتظارهم، فالخطوة التالية أن تقف في آخر الصف.",
            "Le persone in attesa dietro sono toccate, perché chi passa avanti le fa aspettare di più, quindi il passo successivo è mettersi in fondo alla fila."
          ),
          choices: [
            {
              id: "end",
              ok: true,
              text: L("排在隊伍最後", "Stand at the end of the line", "列の最後に並ぶ", "줄의 맨 뒤에 서기", "Ponerte al final de la fila", "Sich hinten anstellen", "Mene jonon viimeiseksi", "Se mettre à la fin de la file", "قف في آخر الصف", "Mettersi in fondo alla fila")
            },
            {
              id: "cut",
              ok: false,
              text: L("擠到最前面", "Push to the very front", "一番前に割り込む", "맨 앞으로 밀고 들어가기", "Colarte hasta el principio", "Nach ganz vorn drängeln", "Tunkeudu jonon kärkeen", "Se faufiler tout devant", "زاحم إلى المقدمة", "Spingersi fino all'inizio")
            }
          ]
        }
      ];

      function App() {
        const [lang, setLang] = useState("zh");
        const [pos, setPos] = useState({ x: 0, y: 0 });
        const [resolved, setResolved] = useState({});
        const [pendingId, setPendingId] = useState(null);
        const [choiceOrder, setChoiceOrder] = useState([]);
        const [missed, setMissed] = useState(false);
        const [notice, setNotice] = useState("");
        const [status, setStatus] = useState("playing");
        const seen = Object.keys(resolved).length;
        const pending = situations.find(function (item) { return item.id === pendingId; });
        const standing = situations.find(function (item) { return item.x === pos.x && item.y === pos.y; });

        useEffect(function () {
          if (!pendingId) return;
          const node = document.getElementById("citizen-line");
          if (node && node.scrollIntoView) node.scrollIntoView({ behavior: "smooth", block: "center" });
        }, [pendingId]);

        useEffect(function () {
          if (status !== "done") return;
          const node = document.getElementById("citizen-recap");
          if (node && node.scrollIntoView) node.scrollIntoView({ behavior: "smooth", block: "start" });
        }, [status]);

        function move(dx, dy) {
          if (status !== "playing" || pendingId) return;
          const nx = pos.x + dx;
          const ny = pos.y + dy;
          if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) return;
          if (walls.indexOf(nx + "," + ny) !== -1) return;
          if (nx === GOAL.x && ny === GOAL.y) {
            if (Object.keys(resolved).length < situations.length) {
              setNotice("remain");
              return;
            }
            setNotice("");
            setPos({ x: nx, y: ny });
            setStatus("done");
            return;
          }
          setNotice("");
          setPos({ x: nx, y: ny });
          const item = situations.find(function (spot) { return spot.x === nx && spot.y === ny; });
          if (item && !resolved[item.id]) {
            setPendingId(item.id);
            setChoiceOrder(shuffle(item.choices));
            setMissed(false);
          } else {
            setPendingId(null);
            setChoiceOrder([]);
            setMissed(false);
          }
        }

        function choose(choice) {
          if (!pendingId) return;
          if (choice.ok) {
            if (window.GsSfx) window.GsSfx.playCorrect();
            setResolved(function (prev) {
              const next = Object.assign({}, prev);
              next[pendingId] = true;
              return next;
            });
            setPendingId(null);
            setChoiceOrder([]);
            setMissed(false);
          } else {
            if (window.GsSfx) window.GsSfx.playWrong();
            setMissed(true);
          }
        }

        function restart() {
          setPos({ x: 0, y: 0 });
          setResolved({});
          setPendingId(null);
          setChoiceOrder([]);
          setMissed(false);
          setNotice("");
          setStatus("playing");
        }

        function sentenceCard(item, withChoices) {
          return h(
            "div",
            { id: "citizen-line", className: "w-full max-w-xl bg-white rounded-2xl shadow p-4 mb-4" },
            h("div", { className: "text-3xl mb-2", "aria-hidden": "true" }, item.icon),
            h("p", { className: "text-xs font-bold text-purple-500 mb-1" }, tx(ui.oneLine, lang)),
            h(
              "p",
              { className: "text-lg md:text-xl font-bold text-purple-950 leading-relaxed", role: "status" },
              tx(item.line, lang)
            ),
            withChoices && missed
              ? h("p", { className: "mt-3 text-purple-800 leading-relaxed" }, tx(ui.again, lang))
              : null,
            withChoices
              ? h(
                  "div",
                  { className: "mt-4 grid gap-2" },
                  choiceOrder.map(function (choice) {
                    return h(
                      "button",
                      {
                        key: choice.id,
                        type: "button",
                        onClick: function () { choose(choice); },
                        className: "w-full text-left rounded-2xl border-2 border-purple-300 bg-purple-50 px-4 py-3 font-bold text-purple-900"
                      },
                      tx(choice.text, lang)
                    );
                  })
                )
              : null
          );
        }

        const cells = [];
        for (let i = 0; i < GRID_H * GRID_W; i += 1) {
          const x = i % GRID_W;
          const y = Math.floor(i / GRID_W);
          const isWall = walls.indexOf(x + "," + y) !== -1;
          const item = situations.find(function (spot) { return spot.x === x && spot.y === y; });
          const isGoal = x === GOAL.x && y === GOAL.y;
          const icon = isGoal ? GOAL.icon : item ? item.icon : "";
          cells.push(
            h(
              "div",
              {
                key: i,
                className: "rounded-md flex items-center justify-center text-xl " + (isWall ? "bg-slate-800" : "bg-purple-50")
              },
              h("span", { className: item && resolved[item.id] ? "opacity-40" : "" }, icon)
            )
          );
        }

        const btn = "bg-purple-500 text-white p-4 rounded-xl shadow-lg text-2xl";
        const board = h(
          "div",
          { className: "relative bg-white p-2 rounded-xl shadow-2xl border-4 border-purple-300" },
          h(
            "div",
            {
              className: "grid gap-1",
              style: {
                gridTemplateColumns: "repeat(" + GRID_W + ", minmax(0, 1fr))",
                width: "min(86vw, 380px)",
                height: "min(86vw, 380px)"
              }
            },
            cells
          ),
          h(
            motion.div,
            { className: "absolute top-2 left-2 w-[calc(100%-16px)] h-[calc(100%-16px)] pointer-events-none" },
            h(
              motion.div,
              {
                className: "absolute text-2xl flex items-center justify-center",
                animate: {
                  left: (pos.x / GRID_W) * 100 + "%",
                  top: (pos.y / GRID_H) * 100 + "%",
                  width: 100 / GRID_W + "%",
                  height: 100 / GRID_H + "%"
                },
                transition: { type: "spring", stiffness: 300, damping: 30 }
              },
              "🧒"
            )
          )
        );

        const dpad = h(
          "div",
          { className: "grid grid-cols-3 gap-2 mt-6 w-48" + (pendingId ? " opacity-40 pointer-events-none" : "") },
          h("div", null),
          h("button", { type: "button", onClick: function () { move(0, -1); }, className: btn, "aria-label": "up" }, "⬆️"),
          h("div", null),
          h("button", { type: "button", onClick: function () { move(-1, 0); }, className: btn, "aria-label": "left" }, "⬅️"),
          h("div", null),
          h("button", { type: "button", onClick: function () { move(1, 0); }, className: btn, "aria-label": "right" }, "➡️"),
          h("div", null),
          h("button", { type: "button", onClick: function () { move(0, 1); }, className: btn, "aria-label": "down" }, "⬇️"),
          h("div", null)
        );

        let middle = h("p", { className: "mb-4 text-center font-bold text-purple-900" }, tx(ui.hint, lang));
        if (pending) middle = sentenceCard(pending, true);
        else if (standing && resolved[standing.id]) middle = sentenceCard(standing, false);
        else if (notice === "remain") {
          middle = h("p", { className: "mb-4 text-center font-bold text-purple-950 max-w-xl leading-relaxed" }, tx(ui.remain, lang));
        }

        const recap = h(
          "div",
          { id: "citizen-recap", className: "w-full max-w-xl bg-white rounded-2xl shadow p-5" },
          h("p", { className: "font-bold text-purple-950 text-lg mb-2 leading-relaxed" }, tx(ui.arrived, lang)),
          h("p", { className: "text-purple-800 mb-4 leading-relaxed" }, tx(ui.doneLead, lang)),
          h(
            "ol",
            { className: "list-decimal pl-5 space-y-3 text-slate-800" },
            situations.map(function (item) {
              return h("li", { key: item.id, className: "leading-relaxed" }, tx(item.line, lang));
            })
          ),
          h(
            "button",
            { type: "button", onClick: restart, className: "mt-6 bg-purple-500 text-white px-6 py-3 rounded-full font-bold" },
            tx(ui.restart, lang)
          )
        );

        return h(
          "div",
          { className: "min-h-screen p-4 flex flex-col items-center" },
          h(LanguageSelector, { lang: lang, setLang: setLang }),
          h("h1", { className: "text-3xl md:text-4xl font-black text-purple-900 mb-2 mt-4 text-center" }, tx(ui.title, lang)),
          h("p", { className: "font-bold text-purple-800 mb-4 text-center max-w-xl leading-relaxed" }, tx(ui.instruction, lang)),
          h(
            "div",
            { className: "font-black text-lg text-white bg-purple-500 px-5 py-2 rounded-full mb-4" },
            tx(ui.progress, lang) + " " + seen + "/" + situations.length
          ),
          status === "done" ? recap : h("div", { className: "w-full flex flex-col items-center" }, middle, board, dpad)
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
    <script src="../../common/gs-sfx.js"></script>
  </body>
