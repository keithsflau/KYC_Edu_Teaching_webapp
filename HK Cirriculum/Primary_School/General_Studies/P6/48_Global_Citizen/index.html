            className: "w-full max-w-2xl bg-white rounded-3xl shadow p-6"
          },
          h("p", { className: "text-sm font-bold text-slate-500 mb-2" }, progressLabel()),
          h("h2", { className: "text-2xl font-bold text-slate-800 mb-3" }, current.icon + " " + tx(current.title, lang)),
          h("p", { className: "text-slate-700 leading-relaxed mb-4" }, tx(current.scene, lang)),
          h("p", { className: "font-bold text-slate-900 mb-3" }, tx(ui.prompt, lang)),
          h(
            "div",
            { className: "grid gap-3" },
            order.map(function (opt) {
              return h(
                "button",
                {
                  key: opt.id,
                  type: "button",
                  onClick: function () { choose(opt); },
                  className: optionClass(opt, picked)
                },
                tx(opt.text, lang)
              );
            })
          ),
          chosen && !chosen.ok ? h("p", { className: "mt-4 leading-relaxed text-slate-700" }, tx(chosen.miss, lang)) : null,
          locked ? h("p", { className: "mt-4 leading-relaxed font-bold text-slate-800" }, tx(current.why, lang)) : null,
          locked
            ? h(
                "button",
                { type: "button", onClick: goNext, className: "mt-4 bg-slate-800 text-white px-6 py-3 rounded-full font-bold" },
                idx + 1 >= cases.length ? tx(ui.review, lang) : tx(ui.next, lang)
              )
            : null
        );

        return h(
          "div",
          { className: "min-h-screen flex flex-col items-center p-4" },
          h(LanguageSelector, { lang: lang, setLang: setLang }),
          h("h1", { className: "text-3xl md:text-4xl font-bold mb-3 mt-4 text-slate-800 text-center" }, tx(ui.title, lang)),
          h("p", { className: "mb-6 font-medium text-slate-600 text-center max-w-2xl leading-relaxed" }, tx(ui.instruction, lang)),
          done ? summary : card
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
    <script src="../../common/gs-sfx.js"></script>
  </body>
