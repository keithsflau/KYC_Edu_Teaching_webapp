<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NcsI18n smoke demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", "PingFang TC", "Noto Sans Devanagari",
        "Noto Nastaliq Urdu", sans-serif;
      background: linear-gradient(160deg, #f0f9ff 0%, #fff 45%, #fef3c7 100%);
      color: #0f172a;
      min-height: 100vh;
      padding: 2rem 1.25rem 5rem;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 1.25rem;
      padding: 1.5rem;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.15);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p.lead { margin: 0 0 1.25rem; color: #475569; line-height: 1.5; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .tab {
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .tab.active {
      background: #0ea5e9;
      color: #fff;
      border-color: #0ea5e9;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0;
    }
    button {
      min-height: 2.5rem;
      padding: 0 1rem;
      border-radius: 0.65rem;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary {
      background: #0f766e;
      color: #fff;
      border-color: #0f766e;
    }
    .score {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0369a1;
    }
    footer.demo-foot {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
    }
    #ncs-lang-slot { margin-top: 1rem; }
  </style>
  <link rel="stylesheet" href="ncs-i18n.css" />
</head>
<body>
  <main>
    <h1 data-i18n="demo_title">NCS language kit</h1>
    <p class="lead" data-i18n="demo_lead">
      Switch language below — LGER labels and buttons update instantly. Urdu enables RTL.
    </p>

    <div class="tabs" id="lger-tabs" aria-label="LGER">
      <span class="tab active" data-i18n="lger_learn"></span>
      <span class="tab" data-i18n="lger_guided"></span>
      <span class="tab" data-i18n="lger_experiment"></span>
      <span class="tab" data-i18n="lger_review"></span>
    </div>

    <div class="actions">
      <button class="primary" data-i18n="start"></button>
      <button data-i18n="check"></button>
      <button data-i18n="hint"></button>
      <button data-i18n="reset"></button>
      <button data-i18n="back"></button>
    </div>

    <p class="score"><span data-i18n="score"></span>: <span id="score-val">0</span></p>
    <p id="status" data-i18n="loading"></p>
  </main>

  <footer class="demo-foot">NcsI18n smoke page · HK Cirriculum/_shared</footer>

  <script src="ncs-strings-lger.js"></script>
  <script src="ncs-i18n.js"></script>
  <script>
    NcsI18n.init({
      chromePath: "ncs-chrome.json",
      position: "bottom",
      strings: {
        demo_title: {
          en: "NCS language kit",
          zh: "NCS 語言工具包",
          ne: "NCS भाषा किट",
          ur: "NCS زبان کٹ",
          tl: "NCS language kit",
          hi: "NCS भाषा किट",
        },
        demo_lead: {
          en: "Switch language below — LGER labels and buttons update instantly. Urdu enables RTL.",
          zh: "在下方切換語言——LGER 標籤與按鈕即時更新。烏爾都語會啟用 RTL。",
          ne: "तल भाषा बदल्नुहोस् — LGER लेबल र बटन तुरुन्त अपडेट हुन्छ। उर्दूले RTL सक्षम पार्छ।",
          ur: "نیچے زبان بدلیں — LGER لیبل اور بٹن فوری اپ ڈیٹ ہوتے ہیں۔ اردو RTL فعال کرتی ہے۔",
          tl: "Palitan ang wika sa ibaba — agad na nag-a-update ang LGER labels at buttons. Pinapagana ng Urdu ang RTL.",
          hi: "नीचे भाषा बदलें — LGER लेबल और बटन तुरंत अपडेट होते हैं। उर्दू RTL सक्षम करती है।",
        },
      },
      onChange: function () {
        document.getElementById("status").textContent = NcsI18n.t("correct");
      },
      onReady: function () {
        document.getElementById("status").textContent = NcsI18n.t("done");
      },
    });
  </script>
</body>
</html>
