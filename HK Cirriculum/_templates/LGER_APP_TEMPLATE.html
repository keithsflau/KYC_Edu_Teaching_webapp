<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGER App Template</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        @media (max-width: 768px) { .container { padding: 10px; } }
    </style>
</head>
<body>
    <div class="container">
        <button id="lang-toggle">Toggle Language / 切換語言</button>
        <header><h1 id="app-title">LGER App Title</h1></header>
        <main>
            <section id="learn-section"><h2>Learn</h2><div id="tfz-container"></div></section>
            <section id="guided-section"><h2>Guided</h2><div id="challenges-container"></div></section>
            <section id="experiment-section"><h2>Experiment</h2><div id="lab-container"></div></section>
            <section id="review-section"><h2>Review</h2><div id="review-container"></div></section>
        </main>
    </div>
    <script src="../common/learn-from-zero.js"></script>
    <script src="../common/interactive-lab-kit.js"></script>
    <script>
        document.getElementById('lang-toggle').addEventListener('click', () => {
            console.log('Language toggled');
        });
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('Error caught:', message);
            return true;
        };
    </script>
</body>
</html>
