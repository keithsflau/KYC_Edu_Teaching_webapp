<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HK Cirriculum · 香港課程互動學習</title>
  <meta name="description" content="HK Cirriculum：學校免費用得到，屋企睇到進度。香港課程對齊互動課件、家長儀表板與收費計劃。非教育局／考評局官方。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a1f33;
      --ink-soft: #1a3a52;
      --teal: #0f6b5c;
      --teal-deep: #0a4f44;
      --copper: #b87333;
      --muted: rgba(10, 31, 51, 0.58);
      --line: rgba(10, 31, 51, 0.12);
      --font: "Noto Sans TC", system-ui, sans-serif;
      --display: "Fraunces", "Noto Sans TC", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 15% -5%, rgba(15, 107, 92, 0.16), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 0%, rgba(184, 115, 51, 0.08), transparent 50%),
        linear-gradient(180deg, #d9e6ef, #f2f6f9 42%, #e8f0f4);
      line-height: 1.5;
    }
    .shell { width: min(920px, calc(100% - 1.5rem)); margin: 0 auto; padding: 0.75rem 0 2.5rem; }
    .top {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem; padding: 0.25rem 0 0.65rem;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 0.55rem;
      font-family: var(--display); font-weight: 700; font-size: 1.15rem;
      text-decoration: none; color: inherit; letter-spacing: -0.02em;
    }
    .brand span { color: var(--teal); }
    .mark {
      width: 2rem; height: 2rem; border-radius: 4px;
      background: linear-gradient(145deg, var(--teal), var(--teal-deep));
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
    }
    .nav { display: flex; flex-wrap: wrap; gap: 0.75rem; font-size: 0.82rem; font-weight: 700; }
    .nav a { color: var(--muted); text-decoration: none; }
    .nav a:hover { color: var(--teal); }

    .hero {
      padding: 0.15rem 0 0.85rem;
      animation: rise 0.55s ease both;
    }
    .hero h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.85rem, 5vw, 2.65rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .hero h1 em { font-style: normal; color: var(--teal); }
    .tagline {
      margin: 0.45rem 0 0;
      font-family: var(--display);
      font-size: clamp(1.05rem, 2.5vw, 1.28rem);
      font-weight: 600;
      max-width: 32ch;
      color: var(--ink-soft);
    }
    .tagline strong { color: var(--teal-deep); font-weight: 700; }

    .cta-block { margin-top: 0.85rem; }
    .cta-label {
      display: block;
      margin: 0 0 0.4rem;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cta-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: stretch; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.62rem 0.95rem; border-radius: 4px; font-weight: 700; font-size: 0.86rem;
      text-decoration: none; border: 2px solid transparent; min-height: 44px;
    }
    .btn-demo {
      background: var(--copper); color: #fff;
      flex-direction: column; gap: 0.05rem; padding: 0.55rem 0.85rem; min-width: 8.5rem;
    }
    .btn-demo:hover { background: #d4893a; }
    .btn-demo span {
      display: block;
      font-size: 0.68rem; font-weight: 600; opacity: 0.88;
    }
    .btn-subscribe {
      background: transparent; color: var(--ink);
      border-color: rgba(10,31,51,0.22);
    }
    .btn-subscribe:hover { border-color: var(--teal); color: var(--teal-deep); background: rgba(255,255,255,0.45); }

    .stage {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr 1fr;
      margin-top: 0.65rem;
    }
    a.card {
      display: block; text-decoration: none; color: inherit; background: #fff;
      border: 1px solid var(--line); border-radius: 4px; padding: 1.15rem 1.2rem;
      box-shadow: 0 14px 36px rgba(10, 31, 51, 0.1);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    a.card:hover { border-color: rgba(15, 107, 92, 0.4); transform: translateY(-2px); }
    a.card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; font-weight: 900; color: var(--teal-deep); }
    a.card p { margin: 0; font-size: 0.88rem; color: var(--muted); }
    a.card.featured {
      padding: 1.35rem 1.25rem 1.3rem;
      border-width: 2px;
      border-color: rgba(15, 107, 92, 0.22);
      box-shadow: 0 18px 44px rgba(10, 31, 51, 0.12);
    }
    a.card.featured h2 {
      font-family: var(--display);
      font-size: clamp(1.25rem, 3.2vw, 1.55rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    a.card.featured .badge {
      display: inline-block;
      margin-bottom: 0.5rem;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      background: rgba(15, 107, 92, 0.1);
      color: var(--teal-deep);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    a.card.featured--secondary .badge {
      background: rgba(184, 115, 51, 0.12);
      color: #8a4b12;
    }

    .section-label {
      display: block;
      margin: 0 0 0.45rem;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .home-section { margin-top: 0.85rem; }
    .home-section .stage { margin-top: 0; }
    .grid {
      display: grid; gap: 0.75rem; grid-template-columns: 1fr;
      margin-top: 0.75rem;
    }
    @media (min-width: 520px) { .grid { grid-template-columns: 1fr 1fr; } }
    .grid--secondary a.card h2 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .fine { margin-top: 1.35rem; font-size: 0.8rem; color: var(--muted); }
    .fine a { color: var(--teal); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    @media (max-width: 380px) {
      .stage { grid-template-columns: 1fr; }
      .btn-demo { min-width: 0; flex: 1 1 calc(50% - 0.25rem); }
    }
    .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem; }
  </style>
  <link rel="stylesheet" href="_shared/ncs-i18n.css" />
  <script src="_shared/ncs-i18n.js"></script>
</head>
