<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>薪金計算 | 中三數學</title>
  <style>
:root { color-scheme: light; }
body { margin: 0; font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #f3f6fb; color: #0f172a; line-height: 1.65; }
main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
a.back { color: #1d4ed8; font-weight: 700; text-decoration: none; }
a.back:hover { text-decoration: underline; }
h1 { font-size: 1.7rem; line-height: 1.3; margin: 0.6rem 0 0.3rem; }
.kicker { margin: 0.8rem 0 0; color: #1e3a8a; font-weight: 700; letter-spacing: 0.04em; }
.card { background: #fff; border: 1px solid #d7e0ec; border-radius: 16px; padding: 1rem 1.1rem; margin: 0.85rem 0; }
h2 { font-size: 1.05rem; margin: 0 0 0.45rem; }
ul { margin: 0.2rem 0 0; padding-left: 1.2rem; }
.formula { font-family: "Cambria Math", "Times New Roman", serif; background: #eef4ff; border-radius: 10px; padding: 0.55rem 0.75rem; margin: 0.6rem 0; }
label { font-weight: 700; }
input { font: inherit; font-size: 1.2rem; width: 9rem; padding: 0.45rem 0.65rem; border: 2px solid #64748b; border-radius: 10px; margin-right: 0.5rem; }
button { font: inherit; min-height: 44px; padding: 0.5rem 1rem; border-radius: 10px; border: 0; background: #1d4ed8; color: #fff; font-weight: 700; cursor: pointer; }
button.choice { display: block; width: 100%; text-align: left; background: #fff; color: #0f172a; border: 2px solid #94a3b8; margin: 0.45rem 0; }
button.choice.good { border-color: #047857; background: #ecfdf5; }
button.choice.bad { border-color: #c2410c; background: #fff7ed; }
button:disabled { cursor: default; }
#feedback { min-height: 1.5em; font-weight: 700; }
#feedback.ok { color: #047857; }
#feedback.bad { color: #9a3412; }
svg { width: 100%; height: auto; display: block; }
footer { color: #64748b; font-size: 0.8rem; text-align: center; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <p><a class="back" href="../index.html">← 返回年級目錄</a></p>
  <p class="kicker">中三 · 率與比</p>
  <h1>正常工時和加班要分開乘</h1>
  <section class="card" aria-labelledby="goal-h">
    <h2 id="goal-h">學習目標</h2>
    <ul>
      <li>總薪金 = 正常時薪 × 正常時數 + 加班時薪 × 加班時數。</li>
      <li>1.5 倍時薪只乘在加班時數上。</li>
    </ul>
  </section>
  <section class="card" aria-labelledby="do-h">
    <h2 id="do-h">這一項操作</h2>
    <p>練習數字：正常時薪 60 元，做了 8 小時；另加班 3 小時，加班時薪是正常時薪的 1.5 倍。輸入這一天的總薪金。</p>
    <p class="formula">60 × 8 + (60 × 1.5) × 3</p>
    <form id="task-form">
      <label for="answer">總薪金（元）</label>
      <input id="answer" name="answer" inputmode="decimal" autocomplete="off" />
      <button type="submit">核對</button>
    </form>
    <p id="feedback" aria-live="polite"></p>
  </section>
  <section class="card" aria-labelledby="err-h">
    <h2 id="err-h">錯因</h2>
    <ul>
      <li>加班時數仍用原來的時薪，1.5 倍沒有用上。</li>
      <li>全部時數都乘 1.5，把正常工時也當成加班。</li>
    </ul>
  </section>
  <footer>@HKSTEAMAI All Copy-Right Reserved.</footer>
</main>
<script src="lesson.js"></script>
</body>
</html>
