    const TFZ_STEPS = [
      { id: "A1", title: "Photosynthesis Overview", titleZh: "光合作用概覽",
        body: "Plants make their own food through photosynthesis. Using light energy, they convert carbon dioxide (CO₂) and water into glucose and oxygen (O₂). The equation is: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂.",

      { id: "A2", title: "Measuring the Rate", titleZh: "量度速率",

      { id: "A3", title: "Limiting Factors", titleZh: "限制因素",

      { id: "A4", title: "Light Intensity", titleZh: "光強度",

      { id: "A6", title: "Temperature", titleZh: "溫度",

        bodyZh: "光合作用受酶控制。溫度升至最適點（約 25-35 °C）時，動能增加令速率上升。但超過最適點後，酶會變性，速率急劇下降。",

      { id: "A7", title: "Interactions on the Graph", titleZh: "因素間的相互作用",
        body: "If a plant is on the light plateau, the only way to increase the rate further is to increase another factor, like CO₂. This creates a new, higher plateau on the graph.",
        bodyZh: "如果植物處於光強度平台期，唯一能再提升速率的方法是增加另一因素（如 CO₂）。這會在圖表上形成一個更高的新平台。",
        q: "To raise the maximum plateau of a light intensity graph, you should...", qZh: "要提升光強度圖表的最高平台，你應該...",
        opts: ["Increase CO₂ or temperature 增加 CO₂ 或溫度", "Add even more light 加入更多光", "Remove leaves 移除葉片"], a: "Increase CO₂ or temperature 增加 CO₂ 或溫度",
        why: "Since light is no longer limiting, you must increase whichever other factor is limiting." }
    ];

    function LearnFromZero({ steps, onComplete }) {
      const [i, setI] = useState(0);
      const [picked, setPicked] = useState(null);
      const step = steps[i];
      const last = i === steps.length - 1;
      function pick(opt) { if (picked) return; setPicked(opt); }
      function next() {
        if (last) { onComplete(); return; }
        setI(i + 1); setPicked(null);
      }
      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-6">
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs font-black uppercase tracking-widest" style={{color: ACCENT}}>Learn From Zero · 由零開始學</p>
            <p className="text-xs text-slate-500">{step.id} / A{steps.length}</p>
          </div>
          <div className="flex gap-1.5 mb-4">
            {steps.map((s, k) => (
              <div key={s.id} className="h-1.5 flex-1 rounded-full" style={{background: k <= i ? ACCENT : "#e2e8f0"}} />
            ))}
          </div>
          <h2 className="text-xl font-bold">{step.title}</h2>
          <p className="text-sm font-semibold text-slate-500 mt-0.5">{step.titleZh}</p>
          <p className="text-sm mt-3 text-slate-700 leading-relaxed">{step.body}</p>
          <p className="text-sm mt-2 text-slate-500 leading-relaxed">{step.bodyZh}</p>
          <div className="mt-4 p-3 rounded-xl bg-indigo-50 border border-indigo-200">
            <p className="text-sm font-bold">{step.q}</p>
            <p className="text-xs text-slate-500 mb-2">{step.qZh}</p>
            <div className="grid gap-2">
              {step.opts.map(o => {
                let cls = "text-left px-3 py-2.5 rounded-xl text-sm border min-h-[44px] ";
                if (!picked) cls += "bg-white border-slate-200 hover:bg-slate-50";
                else if (o === step.a) cls += "bg-emerald-50 border-emerald-300 text-emerald-800 font-semibold";
                else if (o === picked) cls += "bg-rose-50 border-rose-300 text-rose-800";
                else cls += "bg-white border-slate-200 opacity-60";
                return <button key={o} type="button" className={cls} onClick={() => pick(o)}>{o}</button>;
              })}
            </div>
            {picked && (
              <div className="mt-3 text-sm p-3 rounded-lg bg-white/70 border border-slate-200">
                <p className="font-semibold">{picked === step.a ? "✓ Correct · 正確" : "✗ Not quite — see why · 再想想"}</p>
                <p className="mt-1 text-slate-600">{step.why}</p>
                {picked === step.a && (
                  <button type="button" onClick={next} className="mt-3 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[44px]" style={{background: ACCENT}}>
                    {last ? "Unlock the Lab → 解鎖實驗室" : "Next step →"}
                  </button>
                )}
              </div>
            )}
          </div>
        </section>
      );
    }

    function PhotosynthesisSim() {
      const [light, setLight] = useState(50);
      const [co2, setCo2] = useState(50);
      const [temp, setTemp] = useState(25);
      const [running, setRunning] = useState(true);
      const [stats, setStats] = useState({ rate: 0, total: 0 });
      const cv = useRef(null), gv = useRef(null);
      const S = useRef({ bubbles: [], total: 0, hist: [], t: 0, photons: [] });

      const fL = (L) => L / (15 + L);
      const fC = (C) => C / (10 + C);
      const fT = (T) => T > 50 ? 0 : T > 35 ? Math.max(0, 1 - (T - 35) / 15) : Math.min(1, 0.2 + (T / 35) * 0.8) * (T < 5 ? 0.2 + T / 6 : 1);
      
      const vmax = 25;
      const rate = vmax * fL(light) * fC(co2) * fT(temp);
      const denatured = temp > 45;

      useEffect(() => {
        let raf, last = performance.now();
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000); last = now;
          if (running) step(dt);
          draw(cv.current, gv.current);
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, [running, temp, light, co2]);

      function step(dt) {
        const st = S.current;
        st.t += dt;
        
        // Add photons if light > 0
        if (Math.random() < light * 0.2 * dt) {
          st.photons.push({ x: 10, y: 120 + Math.random() * 160, vx: 200 + Math.random()*50, life: 1 });
        }
        for (let i = st.photons.length - 1; i >= 0; i--) {
          const p = st.photons[i];
          p.x += p.vx * dt;
          p.life -= dt * 2;
          if (p.life < 0 || p.x > 250) st.photons.splice(i, 1);
        }

        if (!denatured && Math.random() < rate * dt) {
          st.bubbles.push({ x: 200 + (Math.random()-0.5)*4, y: 100, r: 2 + Math.random() * 2, wob: Math.random() * 7 });
          st.total++; 
        }
        for (let i = st.bubbles.length - 1; i >= 0; i--) {
          const b = st.bubbles[i];
          b.y -= (40 + b.r * 8) * dt; b.wob += dt * 6;
          if (b.y < 45) st.bubbles.splice(i, 1);
        }
        
        if (!st.hist.length || st.t - st.hist[st.hist.length - 1].t > 0.5) st.hist.push({ t: st.t, n: st.total });
        if (st.hist.length > 120) st.hist.shift();
      }

      useEffect(() => {
        const iv = setInterval(() => {
          const h = S.current.hist;
          const recent = h.length > 10 ? (h[h.length - 1].n - h[h.length - 11].n) / (h[h.length - 1].t - h[h.length - 11].t) : 0;
          setStats({ rate: recent, total: S.current.total });
        }, 500);
        return () => clearInterval(iv);
      }, []);

      function draw(c, g) {
        if (c) {
          const ctx = c.getContext("2d");
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.fillStyle = "#f8fafc"; ctx.fillRect(0, 0, c.width, c.height);
          
          ctx.fillStyle = "#e0f2fe"; ctx.fillRect(120, 40, 160, 280);
          ctx.strokeStyle = "#334155"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(120, 20); ctx.lineTo(120, 320); ctx.lineTo(280, 320); ctx.lineTo(280, 20); ctx.stroke();
          
          ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(160, 280); ctx.lineTo(190, 100); ctx.lineTo(210, 100); ctx.lineTo(240, 280); ctx.stroke();

          ctx.fillStyle = denatured ? "#94a3b8" : "#16a34a";
          ctx.beginPath();
          ctx.moveTo(200, 280);
          for(let y=280; y>=105; y-=15) {
             ctx.lineTo(200 + (y%30===0?15:-15), y);
             ctx.lineTo(200, y-5);
          }
          ctx.fill();

          ctx.fillStyle = `rgba(252, 211, 77, ${light/100})`;
          ctx.beginPath(); ctx.arc(40, 200, 30, 0, 7); ctx.fill();
          ctx.fillStyle = "#fbbf24"; ctx.font = "bold 11px IBM Plex Sans";
          ctx.fillText("LAMP 燈", 22, 204);

          ctx.fillStyle = "#fde047";
          for (const p of S.current.photons) {
            ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 7); ctx.fill();
          }

          ctx.strokeStyle = "rgba(56,189,248,.9)"; ctx.lineWidth = 1.5;
          for (const b of S.current.bubbles) {
            ctx.beginPath(); ctx.arc(b.x + Math.sin(b.wob) * 4, b.y, b.r, 0, 7); ctx.stroke();
          }

          ctx.fillStyle = "#334155"; ctx.font = "12px IBM Plex Sans";
          ctx.fillText("NaHCO₃ solution (CO₂ source)", 126, 310);
          ctx.fillText("O₂ bubbles 氧氣泡 ↑", 160, 30);
          if (denatured) {
            ctx.fillStyle = "#ef4444"; ctx.font = "bold 12px IBM Plex Sans";
            ctx.fillText("ENZYMES DENATURED 酶已變性", 126, 180);
          }
        }
        if (g) {
          const ctx = g.getContext("2d");
          ctx.clearRect(0, 0, g.width, g.height);
          ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, g.width, g.height);
          
          ctx.strokeStyle = "#475569"; ctx.strokeRect(40, 20, 290, 130);
          ctx.fillStyle = "#94a3b8"; ctx.font = "11px IBM Plex Sans";
          ctx.fillText("rate vs light intensity 速率對光強度", 46, 34);
          ctx.strokeStyle = "#fde047"; ctx.lineWidth = 2; ctx.beginPath();
          for (let L = 0; L <= 100; L += 2) {
            const rr = vmax * fL(L) * fC(co2) * fT(temp);
            const px = 40 + (L / 100) * 290, py = 150 - (rr / vmax) * 130;
            L === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
          }
          ctx.stroke();
          const rNow1 = vmax * fL(light) * fC(co2) * fT(temp);
          ctx.fillStyle = "#fbbf24"; ctx.beginPath();
          ctx.arc(40 + (light / 100) * 290, 150 - (rNow1 / vmax) * 130, 5, 0, 7); ctx.fill();
          ctx.fillStyle = "#94a3b8"; ctx.fillText("0", 36, 164); ctx.fillText("Light 光 →", 280, 164); ctx.fillText("100", 322, 164);

          ctx.strokeStyle = "#475569"; ctx.strokeRect(40, 190, 290, 130);
          ctx.fillStyle = "#94a3b8"; ctx.fillText("rate vs CO₂ concentration 速率對二氧化碳濃度", 46, 204);
          ctx.strokeStyle = "#34d399"; ctx.lineWidth = 2; ctx.beginPath();
          for (let c2 = 0; c2 <= 100; c2 += 2) {
            const rr = vmax * fL(light) * fC(c2) * fT(temp);
            const px = 40 + (c2 / 100) * 290, py = 320 - (rr / vmax) * 130;
            c2 === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.fillStyle = "#fbbf24"; ctx.beginPath();
          ctx.arc(40 + (co2 / 100) * 290, 320 - (rNow1 / vmax) * 130, 5, 0, 7); ctx.fill();
          ctx.fillStyle = "#94a3b8"; ctx.fillText("CO₂ →", 292, 334);
        }
      }

      return (
        <div className="space-y-3">
          <div className="flex flex-wrap gap-2 items-center">
            <button type="button" onClick={() => setRunning(r => !r)} className="px-3 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-white min-h-[44px]">{running ? "⏸ Pause" : "▶ Play"}</button>
            <button type="button" onClick={() => { S.current.total = 0; S.current.bubbles = []; S.current.hist = []; S.current.t = 0; }} className="px-3 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 min-h-[44px]">↺ Reset bubbles</button>
            {denatured && <span className="px-3 py-1.5 rounded-full bg-rose-100 text-rose-800 text-sm font-bold">⚠ Enzymes denatured 酶已變性!</span>}
          </div>
          <div className="grid lg:grid-cols-2 gap-3">
            <canvas ref={cv} className="sim" width="360" height="360" />
            <canvas ref={gv} className="sim" width="348" height="360" />
          </div>
          <div className="grid sm:grid-cols-3 gap-3">
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Light Intensity 光強度 · {light}%
              <input type="range" min="0" max="100" step="1" value={light} onChange={e => setLight(+e.target.value)} className="w-full mt-2" /></label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">CO₂ (NaHCO₃) 二氧化碳 · {co2}%
              <input type="range" min="0" max="100" step="1" value={co2} onChange={e => setCo2(+e.target.value)} className="w-full mt-2" /></label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Temperature 溫度 · {temp} °C
              <input type="range" min="0" max="60" step="1" value={temp} onChange={e => setTemp(+e.target.value)} className="w-full mt-2" /></label>
          </div>
          <div className="flex flex-wrap gap-2 text-sm">
            <span className="px-3 py-1.5 rounded-full bg-violet-100 text-violet-800 font-bold">Model rate 模型速率 ≈ {rate.toFixed(1)} bubbles/s</span>
            <span className="px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold">Measured 實測 ≈ {stats.rate.toFixed(1)} bubbles/s</span>
            <span className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 font-semibold">Total O₂ bubbles 總氣泡 = {stats.total}</span>
          </div>
        </div>
      );
    }

    const GUIDED = [
      { id: "g1", level: 1, q: "Which gas is released during photosynthesis?", qZh: "光合作用釋放哪種氣體？",
        opts: ["Oxygen 氧氣", "Carbon dioxide 二氧化碳", "Nitrogen 氮氣", "Hydrogen 氫氣"], a: "Oxygen 氧氣",
        hint: "The bubbles collected in the pondweed experiment are this gas. 水蘊草實驗收集的氣泡。" },
      { id: "g2", level: 1, q: "At very low light intensities, what limits the rate of photosynthesis?", qZh: "在極低光強度下，甚麼限制了光合作用的速率？",
        opts: ["Light intensity 光強度", "Temperature 溫度", "CO2 concentration 二氧化碳濃度", "Chlorophyll 葉綠素"], a: "Light intensity 光強度",
        hint: "When a factor is very low, it usually acts as the limiting factor. 最低的因素往往是限制因素。" },
      { id: "g3", level: 1, q: "Sodium hydrogencarbonate (NaHCO₃) is added to the water to provide...", qZh: "在水中加入碳酸氫鈉 (NaHCO₃) 是為了提供...",
        opts: ["Carbon dioxide 二氧化碳", "Oxygen 氧氣", "Water 水", "Light energy 光能"], a: "Carbon dioxide 二氧化碳",
        hint: "It acts as a source of carbon. 它是碳的來源。" },
      { id: "g4", level: 2, q: "If the light intensity graph has reached a plateau, adding more light will...", qZh: "如果光強度圖表已到達平台期，增加光強度會...",
        opts: ["Have no effect on the rate 對速率無影響", "Decrease the rate 降低速率", "Double the rate 令速率加倍", "Kill the plant 殺死植物"], a: "Have no effect on the rate 對速率無影響",
        hint: "The plateau means light is no longer the limiting factor. 平台期代表光不再是限制因素。" },
      { id: "g5", level: 2, q: "Photosynthesis rate drops sharply at 50 °C because...", qZh: "光合作用速率在 50 °C 時急跌是因為...",
        opts: ["Enzymes denature 酶變性", "Water evaporates 水蒸發", "Light cannot penetrate water 光無法穿透水", "CO2 becomes toxic 二氧化碳有毒"], a: "Enzymes denature 酶變性",
        hint: "Photosynthesis relies on enzymes, which are proteins sensitive to heat. 光合作用依賴對熱敏感的酶。" },
      { id: "g6", level: 2, q: "Which of the following is a fair test condition when testing light intensity?", qZh: "測試光強度時，以下哪項是公平測試條件？",
        opts: ["Keeping temperature and CO2 constant 保持溫度和二氧化碳濃度不變", "Varying temperature and CO2 改變溫度和二氧化碳濃度", "Using different plants every time 每次使用不同植物", "Changing the water volume 改變水量"], a: "Keeping temperature and CO2 constant 保持溫度和二氧化碳濃度不變",
        hint: "You must only change ONE independent variable at a time. 只能改變一個自變量。" }
    ];

    const EXAM = [
      { id: "e1", level: 3, q: "A plant's rate of photosynthesis is measured at 20 °C and 30 °C. The maximum plateau at 30 °C is much higher. Why?", qZh: "在 20 °C 和 30 °C 量度速率，30 °C 時的最高平台明顯較高。為甚麼？",
        opts: ["Higher kinetic energy increases enzyme-substrate collisions 動能較高增加酶與底物碰撞", "More light is absorbed at 30 °C 30 °C 吸收更多光", "CO2 dissolves better in warm water CO2 在暖水中溶解更好", "The plant grows bigger 植物生長更大"], a: "Higher kinetic energy increases enzyme-substrate collisions 動能較高增加酶與底物碰撞",
        hint: "Temperature affects the speed of enzyme-catalysed reactions. 溫度影響酶催化反應的速度。" },
      { id: "e2", level: 3, q: "In a greenhouse, farmers burn paraffin heaters. What double benefit does this provide?", qZh: "農夫在溫室燃燒石蠟加熱器。這提供甚麼雙重好處？",
        opts: ["Increases temperature AND CO2 concentration 提高溫度和二氧化碳濃度", "Increases temperature AND light 提高溫度和光", "Increases CO2 AND light 增加二氧化碳和光", "Kills pests AND provides water 殺蟲和供水"], a: "Increases temperature AND CO2 concentration 提高溫度和二氧化碳濃度",
        hint: "Burning a hydrocarbon produces heat and a specific gas. 燃燒碳氫化合物產生熱和某種氣體。" },
      { id: "e3", level: 3, q: "At extremely high light intensity, the rate might slightly drop. This is due to...", qZh: "在極高光強度下，速率可能會微跌。這是因為...",
        opts: ["Bleaching/damage to chlorophyll 葉綠素被漂白/破壞", "Too much oxygen poisoning the plant 氧氣過多導致植物中毒", "Water freezing 水結冰", "Enzymes denaturing directly from light 光直接令酶變性"], a: "Bleaching/damage to chlorophyll 葉綠素被漂白/破壞",
        hint: "Excessive light can destroy the light-absorbing pigments. 過強光線會破壞吸光色素。" },
      { id: "e4", level: 4, q: "If you move the lamp twice as far away, the light intensity...", qZh: "如果把燈移遠一倍距離，光強度會...",
        opts: ["Drops to 1/4 (inverse square law) 跌至 1/4 (平方反比定律)", "Drops to 1/2 跌至一半", "Doubles 增加一倍", "Stays the same 保持不變"], a: "Drops to 1/4 (inverse square law) 跌至 1/4 (平方反比定律)",
        hint: "Light spreads out over an area that increases with the square of the distance. 光隨距離的平方擴散。" },
      { id: "e5", level: 4, q: "Why is measuring the volume of gas collected more accurate than just counting bubbles?", qZh: "為甚麼量度收集到的氣體體積比單單數氣泡更準確？",
        opts: ["Bubbles can be different sizes 氣泡大小可能不同", "Counting bubbles is too fast 數氣泡太快", "Gas volume includes CO2 氣體體積包含 CO2", "Bubbles dissolve instantly 氣泡會立即溶解"], a: "Bubbles can be different sizes 氣泡大小可能不同",
        hint: "A large bubble and a small bubble count as '1' each, but contain different amounts of O2. 氣泡大小不一會影響準確度。" },
      { id: "e6", level: 4, q: "How can you control temperature effectively in the pondweed experiment?", qZh: "在水蘊草實驗中，如何有效控制溫度？",
        opts: ["Place the beaker in a thermostatically controlled water bath 將燒杯放在恆溫水浴中", "Keep the room dark 保持房間黑暗", "Add ice every minute 每分鐘加冰", "Use a fan blowing on the lamp 用風扇吹向燈"], a: "Place the beaker in a thermostatically controlled water bath 將燒杯放在恆溫水浴中",
        hint: "A water bath acts as a heat sink to absorb heat from the lamp. 水浴能有效吸收燈的熱量以穩定溫度。" }
    ];

    function UpgradeCTA({ reason, onClose, onTrial }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4">
          <div className="w-full max-w-md rounded-2xl p-5 bg-white border border-slate-200">
            <h3 className="text-lg font-bold" style={{color: ACCENT}}>解鎖完整練習與家長進度</h3>
            <p className="text-sm mt-2 text-slate-600">{reason || window.SUBSCRIBE_CONFIG.bannerText}</p>
            <ul className="mt-3 text-sm space-y-1 list-disc list-inside text-slate-600">
              <li>Unlimited daily drills</li>
              <li>Full wrong-answer book</li>
              <li>Progress sync (coming)</li>
            </ul>
            <button type="button" onClick={onTrial} className="mt-4 w-full min-h-[48px] rounded-xl font-semibold text-white" style={{background: ACCENT}}>開始 14 日試用（本機）</button>
            <a href={HKC.MARKETING_PATH} className="mt-2 block w-full min-h-[44px] text-center leading-[44px] rounded-xl border border-slate-300 text-sm">了解家長計劃</a>
            <button type="button" onClick={onClose} className="mt-2 w-full text-sm underline text-slate-500">繼續免費</button>
          </div>
        </div>
      );
    }

    function Drill({ bank, label, onNeedUpgrade, onDone }) {
      const [qi, setQi] = useState(0);
      const [fb, setFb] = useState(null);
      const [score, setScore] = useState(0);
      const [hint, setHint] = useState(false);
      const [first, setFirst] = useState(true);
      const item = bank[qi];

      function pick(opt) {
        if (HKC.freeCapReached()) {
          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");
          onNeedUpgrade("今日免費練習已用完。");
          return;
        }
        HKC.recordDrillUse(APP_ID);
        const ok = opt === item.a;
        setFb(ok
          ? { ok: true, msg: "Correct · 正確" }
          : { ok: false, msg: "Not quite · 再想。Use Hint for the method (answer not shown)." });
        if (ok) {
          if (typeof HKC.recordOk === "function") HKC.recordOk(APP_ID, item);
          if (first) setScore(s => s + 1);
        } else {
          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
          HKC.recordSession(APP_ID, score, bank.length);
          onDone(score, bank.length);
        } else setQi(qi + 1);
      }

      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
          <div className="flex justify-between text-sm mb-3 text-slate-500">
            <span>{label} · Q {qi + 1}/{bank.length} · Lv {item.level}</span>
            <span>Score {score}</span>
          </div>
          <h2 className="text-lg font-bold mb-1">{item.q}</h2>
          {item.qZh ? <p className="text-sm mb-4 opacity-80" style={{color: ACCENT}}>{item.qZh}</p> : <div className="mb-4" />}
          <div className="grid gap-2">
            {item.opts.map(o => (
              <button key={o} type="button" disabled={fb && fb.ok} onClick={() => pick(o)}
                className="text-left px-4 py-3 rounded-xl min-h-[48px] disabled:opacity-50 bg-slate-50 hover:bg-slate-100 border border-slate-200">{o}</button>
            ))}
          </div>
          <button type="button" className="text-sm mt-3 font-semibold min-h-[44px]" style={{color: ACCENT}} onClick={() => setHint(true)}>Hint · 提示</button>
          {hint && <p className="text-sm mt-1 p-3 rounded-xl bg-amber-50 text-amber-900 border border-amber-200">{item.hint}</p>}
          {fb && (
            <div className={"mt-4 p-3 rounded-xl text-sm " + (fb.ok ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800")}>
              {fb.msg}
              {fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={next}>Next →</button>}
              {!fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={() => setFb(null)}>Retry</button>}
            </div>
          )}
        </section>
      );
    }

    function App() {
      const [mode, setMode] = useState("learn");
      const [progress, setProgress] = useState(() => HKC.loadProgress(APP_ID));
      const [pay, setPay] = useState(false);
      const [payReason, setPayReason] = useState("");
      const [doneMsg, setDoneMsg] = useState(null);
      const [tfzDone, setTfzDone] = useState(() => { try { return !!localStorage.getItem("hkc_tfz_" + APP_ID); } catch (e) { return false; } });

      function refresh() { setProgress(HKC.loadProgress(APP_ID)); }
      useEffect(() => { refresh(); }, [mode]);
      function completeTfz() {
        try { localStorage.setItem("hkc_tfz_" + APP_ID, "1"); } catch (e) {}
        setTfzDone(true); setMode("lab");
      }

      const tabs = [
        { id: "learn", label: "Learn · 學習" },
        { id: "lab", label: tfzDone ? "Lab · 實驗" : "Lab 🔒" },
        { id: "guided", label: "Guided · 引導" },
        { id: "exam", label: "Exam · 測驗" },
        { id: "review", label: "Review · 錯題" }
      ];

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-8">
          <a href="../../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>← Hub</a>
          <header className="mt-4 mb-4">
            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>F4 Biology · Photosynthesis</p>
            <h1 className="text-2xl sm:text-3xl font-bold mt-1">Photosynthesis Rate Factors</h1>
            <p className="text-slate-500 mt-1">光合作用限制因素 · Learn (A1–A7) → Lab → Guided → Exam → Review</p>
          </header>

          <div className="text-sm border border-dashed rounded-lg px-3 py-2 mb-3 flex flex-wrap justify-between gap-2 items-center border-slate-300 bg-white/80">
            <span>{HKC.isPaid() ? (HKC.getEntitlement().tier + " · unlimited") : ("Free · " + HKC.remainingFree() + "/" + HKC.FREE_DAILY_CAP + " today")} · Best {progress.bestScore}</span>
            {!HKC.isPaid() && (
              <button type="button" className="px-3 py-1.5 rounded-md text-xs font-semibold text-white min-h-[36px]" style={{background: ACCENT}} onClick={() => setPay(true)}>Upgrade</button>
            )}
          </div>

          <nav className="flex flex-wrap gap-2 mb-4">
            {tabs.map(tab => (
              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}
                className={"px-3.5 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (mode === tab.id ? "text-white" : "bg-white border border-slate-200 text-slate-700")}
                style={mode === tab.id ? {background: ACCENT} : {}}>
                {tab.label}
              </button>
            ))}
          </nav>

          {mode === "learn" && <LearnFromZero steps={TFZ_STEPS} onComplete={completeTfz} />}

          {mode === "lab" && !tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-xl font-bold">Finish Learn From Zero first · 先完成 A1–A7</h2>
              <p className="text-sm text-slate-500 mt-2">We teach the model before you play — that is how real understanding sticks. 先學模型，後做實驗。</p>
              <button type="button" className="mt-4 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[48px]" style={{background: ACCENT}} onClick={() => setMode("learn")}>Go to Learn →</button>
            </section>
          )}
          {mode === "lab" && tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
              <h2 className="font-bold text-lg mb-3">Pondweed Reaction Chamber · 水蘊草反應室</h2>
              <PhotosynthesisSim />
            </section>
          )}

          {mode === "guided" && !doneMsg && (
            <Drill bank={GUIDED} label="Guided" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); refresh(); }} />
          )}
          {mode === "exam" && !doneMsg && (
            <Drill bank={EXAM} label="Exam" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "review" }); refresh(); }} />
          )}
          {doneMsg && (mode === "guided" || mode === "exam") && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-2xl font-bold">Complete</h2>
              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>Continue →</button>
            </section>
          )}
          {mode === "review" && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3">
              <h2 className="font-bold text-lg">Wrong-answer book · 錯題簿</h2>
              {(progress.wrongBook || []).length === 0 && <p className="text-sm text-slate-500">No wrong answers yet · 暫無錯題</p>}
              {(progress.wrongBook || []).map(w => (
                <div key={w.id} className="rounded-xl p-3 text-sm border border-slate-200">
                  <p className="font-semibold">{w.prompt}</p>
                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>
                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">Answer unlocked</p>}
                  <button type="button" className="text-xs underline mt-2 text-slate-500" onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>Mark resolved</button>
                </div>
              ))}
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
