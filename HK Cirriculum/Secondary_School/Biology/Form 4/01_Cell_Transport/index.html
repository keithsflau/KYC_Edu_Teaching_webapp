    const TFZ_STEPS = [
      { id: "A1", title: "The Fluid Mosaic Model", titleZh: "流體鑲嵌模型",

        bodyZh: "滲透作用是水分子從較高水勢區域穿過選擇性透性膜，淨移動到較低水勢區域的過程。加入溶質會降低水勢。",
        q: "If you place a cell in pure water (high water potential), water will…", qZh: "如果將細胞放在純水（高水勢）中，水會…",

      { id: "A4", title: "Facilitated Diffusion: Helping hands", titleZh: "促進擴散：協助之手",
        body: "Large molecules (like glucose) or charged ions cannot pass through the hydrophobic lipid bilayer easily. They diffuse through specific channel or carrier proteins. It is still passive (no ATP).",
        bodyZh: "大分子（如葡萄糖）或帶電離子無法輕易穿過疏水性的脂雙層。它們透過特定的通道或載體蛋白擴散。這仍然是被動的（無需 ATP）。",
        q: "Does facilitated diffusion use ATP?", qZh: "促進擴散需要使用 ATP 嗎？",
        opts: ["No, it goes down the concentration gradient 否，它是順濃度梯度的", "Yes, all proteins need ATP 是，所有蛋白質都需要 ATP", "Yes, to move water 是，用來移動水"], a: "No, it goes down the concentration gradient 否，它是順濃度梯度的",

        why: "Pumping uphill requires energy." },
      { id: "A6", title: "Checkpoint: Putting it together", titleZh: "檢查點：綜合運用",
        body: "Three ways to cross: Simple diffusion (small/non-polar, no energy, no protein), Facilitated diffusion (large/charged, no energy, needs protein), Active transport (against gradient, needs energy, needs protein).",
        bodyZh: "三種穿越方式：簡單擴散（細小/非極性，無能量，無蛋白）、促進擴散（大/帶電，無能量，需蛋白）、主動運輸（逆梯度，需能量，需蛋白）。",
        q: "Which process uses both a membrane protein AND energy (ATP)?", qZh: "哪個過程同時使用膜蛋白和能量 (ATP)？",
        opts: ["Active transport 主動運輸", "Osmosis 滲透作用", "Simple diffusion 簡單擴散"], a: "Active transport 主動運輸",
        why: "Only active transport pushes substances uphill using energy and a pump protein." }
    ];

    function LearnFromZero({ steps, onComplete }) {
      const [i, setI] = useState(0);
      const [picked, setPicked] = useState(null);
      const step = steps[i];
      const last = i === steps.length - 1;
      function pick(opt) { if (picked) return; setPicked(opt); }
      function next() {
        if (last) { onComplete(); return; }
        setI(i + 1); setPicked(null);
      }
      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-6">
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs font-black uppercase tracking-widest" style={{color: ACCENT}}>Learn From Zero · 由零開始學</p>
            <p className="text-xs text-slate-500">{step.id} / A{steps.length}</p>
          </div>
          <div className="flex gap-1.5 mb-4">
            {steps.map((s, k) => (
              <div key={s.id} className="h-1.5 flex-1 rounded-full" style={{background: k <= i ? ACCENT : "#e2e8f0"}} />
            ))}
          </div>
          <h2 className="text-xl font-bold">{step.title}</h2>
          <p className="text-sm font-semibold text-slate-500 mt-0.5">{step.titleZh}</p>
          <p className="text-sm mt-3 text-slate-700 leading-relaxed">{step.body}</p>
          <p className="text-sm mt-2 text-slate-500 leading-relaxed">{step.bodyZh}</p>
          <div className="mt-4 p-3 rounded-xl bg-slate-50 border border-slate-200">
            <p className="text-sm font-bold">{step.q}</p>
            <p className="text-xs text-slate-500 mb-2">{step.qZh}</p>
            <div className="grid gap-2">
              {step.opts.map(o => {
                let cls = "text-left px-3 py-2.5 rounded-xl text-sm border min-h-[44px] ";
                if (!picked) cls += "bg-white border-slate-200 hover:bg-slate-50";
                else if (o === step.a) cls += "bg-emerald-50 border-emerald-300 text-emerald-800 font-semibold";
                else if (o === picked) cls += "bg-rose-50 border-rose-300 text-rose-800";
                else cls += "bg-white border-slate-200 opacity-60";
                return <button key={o} type="button" className={cls} onClick={() => pick(o)}>{o}</button>;
              })}
            </div>
            {picked && (
              <div className="mt-3 text-sm p-3 rounded-lg bg-white/70 border border-slate-200">
                <p className="font-semibold">{picked === step.a ? "✓ Correct · 正確" : "✗ Not quite — see why · 再想想"}</p>
                <p className="mt-1 text-slate-600">{step.why}</p>
                {picked === step.a && (
                  <button type="button" onClick={next} className="mt-3 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[44px]" style={{background: ACCENT}}>
                    {last ? "Unlock the Lab → 解鎖實驗室" : "Next step →"}
                  </button>
                )}
              </div>
            )}
          </div>
        </section>
      );
    }

    function TransportSim() {
      const [outO2, setOutO2] = useState(30);
      const [outSol, setOutSol] = useState(10);
      const [inNa, setInNa] = useState(20);
      const [atp, setAtp] = useState(true);
      const [running, setRunning] = useState(true);
      const [stats, setStats] = useState({ inO2: 0, inH2O: 50, inNa: 0 });
      const cv = useRef(null), gv = useRef(null);
      const S = useRef({
        particles: [],
        t: 0,
        hist: []
      });

      useEffect(() => {
        const st = S.current;
        st.particles = [];
        st.t = 0;
        st.hist = [];
        for (let i=0; i<50; i++) addP('H2O', Math.random()*140);
        for (let i=0; i<50; i++) addP('H2O', 210 + Math.random()*140);
      }, []);

      function addP(type, x) {
        const vy = (Math.random() - 0.5) * 40;
        const vx = (Math.random() - 0.5) * 40;
        S.current.particles.push({
          type,
          x: x !== undefined ? x : (type === 'Solute' || type === 'O2' ? Math.random()*140 : 210 + Math.random()*140),
          y: Math.random()*340 + 10,
          vx, vy
        });
      }

      useEffect(() => {
        let raf, last = performance.now();
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000); last = now;
          if (running) step(dt);
          draw(cv.current, gv.current);
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, [running, outO2, outSol, inNa, atp]);

      function step(dt) {
        const st = S.current;
        st.t += dt;

        let cOutO2 = 0, cOutSol = 0, cInNa = 0;
        let cInO2 = 0, cInH2O = 0;
        for (const p of st.particles) {
          if (p.x < 150) {
            if (p.type === 'O2') cOutO2++;
            if (p.type === 'Solute') cOutSol++;
          } else if (p.x > 210) {
            if (p.type === 'Na') cInNa++;
            if (p.type === 'O2') cInO2++;
            if (p.type === 'H2O') cInH2O++;
          }
        }

        if (cOutO2 < outO2) addP('O2', Math.random()*140);
        else if (cOutO2 > outO2) { const idx = st.particles.findIndex(p => p.type === 'O2' && p.x < 150); if (idx >= 0) st.particles.splice(idx, 1); }

        if (cOutSol < outSol) addP('Solute', Math.random()*140);
        else if (cOutSol > outSol) { const idx = st.particles.findIndex(p => p.type === 'Solute' && p.x < 150); if (idx >= 0) st.particles.splice(idx, 1); }

        if (cInNa < inNa) addP('Na', 210 + Math.random()*140);
        else if (cInNa > inNa) { const idx = st.particles.findIndex(p => p.type === 'Na' && p.x > 210); if (idx >= 0) st.particles.splice(idx, 1); }

        for (let i = st.particles.length - 1; i >= 0; i--) {
          const p = st.particles[i];
          p.vx = p.vx * 0.95 + (Math.random() - 0.5) * 15;
          p.vy = p.vy * 0.95 + (Math.random() - 0.5) * 15;

          const oldX = p.x;
          p.x += p.vx * dt * 10;
          p.y += p.vy * dt * 10;

          if (p.y < 5) { p.y = 5; p.vy *= -1; }
          if (p.y > 355) { p.y = 355; p.vy *= -1; }

          if (p.x < 5) {
             if (p.type === 'Na') { st.particles.splice(i, 1); continue; } 
             p.x = 5; p.vx *= -1;
          }
          if (p.x > 355) { p.x = 355; p.vx *= -1; }

          const memLeft = 160, memRight = 200;
          if (p.type === 'Solute') {
            if (oldX <= memLeft && p.x > memLeft) { p.x = memLeft; p.vx = -Math.abs(p.vx); }
            if (oldX >= memRight && p.x < memRight) { p.x = memRight; p.vx = Math.abs(p.vx); }
          } else if (p.type === 'Na') {
            if (atp && oldX >= memRight && p.x < memRight && p.y > 150 && p.y < 210) {
              p.x = memLeft - 5; p.vx = -50;
            } else {
              if (oldX <= memLeft && p.x > memLeft) { p.x = memLeft; p.vx = -Math.abs(p.vx); }
              if (oldX >= memRight && p.x < memRight) { p.x = memRight; p.vx = Math.abs(p.vx); }
            }
          } else if (p.type === 'H2O') {
            if (oldX <= memLeft && p.x > memLeft) {
              if (Math.random() < outSol / 100) { p.x = memLeft; p.vx = -Math.abs(p.vx); }
            }
          }

          if (p.type === 'O2' && p.x > 210 && Math.random() < 0.005) {
             st.particles.splice(i, 1); continue;
          }
        }

        if (!st.hist.length || st.t - st.hist[st.hist.length - 1].t > 0.5) {
          st.hist.push({ t: st.t, inO2: cInO2, inH2O: cInH2O, inNa: cInNa });
          if (st.hist.length > 60) st.hist.shift();
        }
      }

      useEffect(() => {
        const iv = setInterval(() => {
          const h = S.current.hist;
          if (h.length) {
            const last = h[h.length - 1];
            setStats({ inO2: last.inO2, inH2O: last.inH2O, inNa: last.inNa });
          }
        }, 500);
        return () => clearInterval(iv);
      }, []);

      function draw(c, g) {
        if (c) {
          const ctx = c.getContext("2d");
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.fillStyle = "#f8fafc"; ctx.fillRect(0, 0, c.width, c.height);

          ctx.fillStyle = "#e0f2fe"; ctx.fillRect(0, 0, 160, 360);
          ctx.fillStyle = "#fef3c7"; ctx.fillRect(200, 0, 160, 360);

          ctx.fillStyle = "#cbd5e1"; ctx.fillRect(160, 0, 40, 360);
          ctx.fillStyle = "#94a3b8";
          for (let y = 10; y < 360; y += 15) {
            if (y > 140 && y < 220) continue;
            ctx.beginPath(); ctx.arc(165, y, 4, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(195, y, 4, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.moveTo(165, y); ctx.lineTo(195, y); ctx.stroke();
          }

          ctx.fillStyle = atp ? "#10b981" : "#94a3b8";
          ctx.fillRect(158, 150, 44, 60);
          ctx.fillStyle = "#fff"; ctx.font = "bold 10px IBM Plex Sans";
          ctx.fillText("Na+", 169, 175);
          ctx.fillText("PUMP", 165, 190);

          ctx.fillStyle = "#334155"; ctx.font = "bold 14px IBM Plex Sans";
          ctx.fillText("OUTSIDE", 40, 25);
          ctx.fillText("INSIDE", 250, 25);

          for (const p of S.current.particles) {
            ctx.beginPath();
            if (p.type === 'O2') { ctx.fillStyle = "#ef4444"; ctx.arc(p.x, p.y, 4, 0, 7); }
            else if (p.type === 'H2O') { ctx.fillStyle = "#3b82f6"; ctx.arc(p.x, p.y, 3, 0, 7); }
            else if (p.type === 'Solute') { ctx.fillStyle = "#a855f7"; ctx.arc(p.x, p.y, 7, 0, 7); }
            else if (p.type === 'Na') { ctx.fillStyle = "#f59e0b"; ctx.arc(p.x, p.y, 4, 0, 7); }
            ctx.fill();
          }
        }
        if (g) {
          const ctx = g.getContext("2d");
          ctx.clearRect(0, 0, g.width, g.height);
          ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, g.width, g.height);

          ctx.fillStyle = "#94a3b8"; ctx.font = "11px IBM Plex Sans";
          ctx.fillText("Internal Concentrations 內部濃度", 20, 20);

          ctx.strokeStyle = "#475569"; ctx.beginPath();
          ctx.moveTo(30, 30); ctx.lineTo(30, 330); ctx.lineTo(330, 330); ctx.stroke();

          ctx.fillStyle = "#ef4444"; ctx.fillText("O₂", 200, 20);
          ctx.fillStyle = "#3b82f6"; ctx.fillText("H₂O", 230, 20);
          ctx.fillStyle = "#f59e0b"; ctx.fillText("Na⁺", 260, 20);

          const h = S.current.hist;
          if (h.length > 1) {
            const plotLine = (key, color, maxVal) => {
              ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
              for (let i = 0; i < h.length; i++) {
                const px = 30 + (i / 60) * 300;
                const py = 330 - (h[i][key] / maxVal) * 300;
                i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
              }
              ctx.stroke();
            };
            plotLine('inO2', '#ef4444', 100);
            plotLine('inH2O', '#3b82f6', 150);
            plotLine('inNa', '#f59e0b', 50);
          }
        }
      }

      return (
        <div className="space-y-3">
          <div className="flex flex-wrap gap-2 items-center">
            <button type="button" onClick={() => setRunning(r => !r)} className="px-3 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-white min-h-[44px]">{running ? "⏸ Pause" : "▶ Play"}</button>
            <button type="button" onClick={() => { S.current.particles = []; for (let i=0; i<50; i++) addP('H2O', Math.random()*140); for (let i=0; i<50; i++) addP('H2O', 210 + Math.random()*140); S.current.hist = []; }} className="px-3 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 min-h-[44px]">↺ Reset run</button>
            <button type="button" onClick={() => setAtp(!atp)} className={"px-3 py-2 rounded-xl text-sm font-semibold text-white min-h-[44px] " + (atp ? "bg-emerald-500" : "bg-slate-400")}>⚡ ATP: {atp ? "ON" : "OFF"}</button>
          </div>
          <div className="grid lg:grid-cols-2 gap-3">
            <canvas ref={cv} className="sim bg-slate-50" width="360" height="360" />
            <canvas ref={gv} className="sim" width="348" height="360" />
          </div>
          <div className="grid sm:grid-cols-3 gap-3">
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Outside O₂ 外部氧氣 · {outO2}
              <input type="range" min="0" max="100" step="1" value={outO2} onChange={e => setOutO2(+e.target.value)} className="w-full mt-2" /></label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Outside Solute 外部溶質 · {outSol}
              <input type="range" min="0" max="50" step="1" value={outSol} onChange={e => setOutSol(+e.target.value)} className="w-full mt-2" /></label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Inside Na⁺ 內部鈉離子 · {inNa}
              <input type="range" min="0" max="50" step="1" value={inNa} onChange={e => setInNa(+e.target.value)} className="w-full mt-2" /></label>
          </div>
          <div className="flex flex-wrap gap-2 text-sm">
            <span className="px-3 py-1.5 rounded-full bg-red-100 text-red-800 font-bold">Inside O₂: {stats.inO2}</span>
            <span className="px-3 py-1.5 rounded-full bg-blue-100 text-blue-800 font-semibold">Inside H₂O: {stats.inH2O}</span>
            <span className="px-3 py-1.5 rounded-full bg-amber-100 text-amber-800 font-semibold">Inside Na⁺: {stats.inNa}</span>
          </div>
        </div>
      );
    }

    const GUIDED = [
      { id: "g1", level: 1, q: "Which molecule can pass directly through the phospholipid bilayer by simple diffusion?", qZh: "哪種分子可以透過簡單擴散直接穿過磷脂雙分子層？",
        opts: ["Oxygen 氧氣", "Glucose 葡萄糖", "Sodium ions 鈉離子", "Starch 澱粉"], a: "Oxygen 氧氣",
        hint: "Small, non-polar molecules pass easily. O2 and CO2 are classic examples." },
      { id: "g2", level: 1, q: "What is the function of the ATP in active transport?", qZh: "ATP 在主動運輸中的功能是什麼？",
        opts: ["To provide energy to change the shape of the pump protein 提供能量改變泵蛋白的形狀", "To act as a carrier protein 作為載體蛋白", "To increase water potential 提高水勢", "To dissolve the membrane 溶解細胞膜"], a: "To provide energy to change the shape of the pump protein 提供能量改變泵蛋白的形狀",
        hint: "ATP is the energy currency of the cell. Energy is needed to force molecules against their gradient." },
      { id: "g3", level: 1, q: "In the simulation, if you increase the external solute concentration, what happens to the water?", qZh: "在模擬中，如果增加外部溶質濃度，水會發生什麼變化？",
        opts: ["Water leaves the cell (osmosis out) 水離開細胞（滲透流出）", "Water enters the cell (osmosis in) 水進入細胞（滲透流入）", "Water stops moving 水停止移動", "Solute enters the cell 溶質進入細胞"], a: "Water leaves the cell (osmosis out) 水離開細胞（滲透流出）",
        hint: "High solute means low water potential outside. Water moves from high (inside) to low (outside) water potential." },
      { id: "g4", level: 2, q: "What prevents sodium ions (Na+) from diffusing freely across the membrane?", qZh: "什麼阻止了鈉離子 (Na+) 自由擴散穿過細胞膜？",
        opts: ["They are charged and repelled by the hydrophobic lipid tails 它們帶電荷並被疏水性脂尾排斥", "They are too small 它們太小了", "They move too fast 它們移動太快", "There is no ATP 沒有 ATP"], a: "They are charged and repelled by the hydrophobic lipid tails 它們帶電荷並被疏水性脂尾排斥",
        hint: "The core of the bilayer is hydrophobic (water-fearing) and blocks charged ions." },
      { id: "g5", level: 2, q: "A red blood cell placed in distilled water will burst. Why?", qZh: "放在蒸餾水中的紅血球會破裂。為什麼？",
        opts: ["Water enters by osmosis and the cell has no cell wall 水因滲透作用進入，且細胞沒有細胞壁", "Salt enters by active transport 鹽分因主動運輸進入", "Water leaves the cell 水離開細胞", "The cell membrane dissolves 細胞膜溶解"], a: "Water enters by osmosis and the cell has no cell wall 水因滲透作用進入，且細胞沒有細胞壁",
        hint: "Distilled water has higher water potential than the cell cytoplasm. Animal cells lack a rigid wall to prevent bursting." },
      { id: "g6", level: 2, q: "Facilitated diffusion and simple diffusion both:", qZh: "促進擴散和簡單擴散兩者都：",
        opts: ["Do not require ATP energy 不需 ATP 能量", "Require carrier proteins 需要載體蛋白", "Move substances against the gradient 逆梯度移動物質", "Only transport water 只運輸水"], a: "Do not require ATP energy 不需 ATP 能量",
        hint: "Both are 'diffusion', meaning passive movement down a gradient." }
    ];

    const EXAM = [
      { id: "e1", level: 3, q: "Cyanide is a poison that stops ATP production in mitochondria. Which process would be directly stopped by cyanide?", qZh: "氰化物是一種阻止線粒體產生 ATP 的毒素。哪個過程會被氰化物直接阻止？",
        opts: ["Active transport of Na+ out of the cell Na+ 主動運輸出細胞", "Simple diffusion of O2 into the cell O2 簡單擴散入細胞", "Osmosis of water into the cell 水的滲透流入", "Facilitated diffusion of glucose 葡萄糖的促進擴散"], a: "Active transport of Na+ out of the cell Na+ 主動運輸出細胞",
        hint: "Look for the process that actively consumes ATP." },
      { id: "e2", level: 3, q: "A plant cell is placed in a concentrated sugar solution. It becomes plasmolysed. Which statement describes the water potentials?", qZh: "將植物細胞置於濃糖溶液中，細胞會發生質壁分離。哪項描述了其水勢？",
        opts: ["Solution water potential < cell water potential 溶液水勢 < 細胞水勢", "Solution water potential > cell water potential 溶液水勢 > 細胞水勢", "Both are equal 兩者相等", "Water potential is zero everywhere 水勢為零"], a: "Solution water potential < cell water potential 溶液水勢 < 細胞水勢",
        hint: "Plasmolysis means water LEFT the cell. Water moves from high to low." },
      { id: "e3", level: 3, q: "By which mechanism do root hair cells absorb mineral ions from the soil when the soil concentration is very low?", qZh: "當土壤濃度極低時，根毛細胞透過哪種機制從土壤中吸收礦物離子？",
        opts: ["Active transport 主動運輸", "Osmosis 滲透作用", "Simple diffusion 簡單擴散", "Transpiration 蒸騰作用"], a: "Active transport 主動運輸",
        hint: "Moving from LOW concentration in soil to HIGH concentration in the root requires energy." },
      { id: "e4", level: 4, q: "If the external O2 concentration drops to zero, what will happen to the net diffusion of O2?", qZh: "如果外部 O2 濃度降至零，O2 的淨擴散會發生什麼變化？",
        opts: ["O2 will diffuse OUT of the cell O2 會擴散出細胞", "O2 will diffuse INTO the cell O2 會擴散進細胞", "Active transport of O2 begins O2 開始主動運輸", "The cell membrane blocks O2 細胞膜阻擋 O2"], a: "O2 will diffuse OUT of the cell O2 會擴散出細胞",
        hint: "If inside > outside (0), diffusion happens from inside to outside." },
      { id: "e5", level: 4, q: "Why is the membrane described as a 'fluid mosaic'?", qZh: "為何細胞膜被描述為「流體鑲嵌」？",
        opts: ["Phospholipids can move laterally, and proteins are scattered like a mosaic 磷脂可橫向移動，蛋白質如鑲嵌般散佈", "It is made of liquid water 它由液態水組成", "Proteins flow out of the cell 蛋白質流出細胞", "It dissolves in water 它溶於水"], a: "Phospholipids can move laterally, and proteins are scattered like a mosaic 磷脂可橫向移動，蛋白質如鑲嵌般散佈",
        hint: "Fluid = lipid molecules move. Mosaic = patchy arrangement of proteins." },
      { id: "e6", level: 4, q: "Which factor does NOT affect the rate of simple diffusion?", qZh: "哪個因素不影響簡單擴散的速率？",
        opts: ["Number of ATP molecules available 可用的 ATP 分子數量", "Concentration gradient 濃度梯度", "Temperature 溫度", "Surface area of the membrane 細胞膜表面積"], a: "Number of ATP molecules available 可用的 ATP 分子數量",
        hint: "Simple diffusion is entirely passive." }
    ];

    function UpgradeCTA({ reason, onClose, onTrial }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4">
          <div className="w-full max-w-md rounded-2xl p-5 bg-white border border-slate-200">
            <h3 className="text-lg font-bold" style={{color: ACCENT}}>解鎖完整練習與家長進度</h3>
            <p className="text-sm mt-2 text-slate-600">{reason || window.SUBSCRIBE_CONFIG.bannerText}</p>
            <ul className="mt-3 text-sm space-y-1 list-disc list-inside text-slate-600">
              <li>Unlimited daily drills</li>
              <li>Full wrong-answer book</li>
              <li>Progress sync (coming)</li>
            </ul>
            <button type="button" onClick={onTrial} className="mt-4 w-full min-h-[48px] rounded-xl font-semibold text-white" style={{background: ACCENT}}>開始 14 日試用（本機）</button>
            <a href={HKC.MARKETING_PATH} className="mt-2 block w-full min-h-[44px] text-center leading-[44px] rounded-xl border border-slate-300 text-sm">了解家長計劃</a>
            <button type="button" onClick={onClose} className="mt-2 w-full text-sm underline text-slate-500">繼續免費</button>
          </div>
        </div>
      );
    }

    function Drill({ bank, label, onNeedUpgrade, onDone }) {
      const [qi, setQi] = useState(0);
      const [fb, setFb] = useState(null);
      const [score, setScore] = useState(0);
      const [hint, setHint] = useState(false);
      const [first, setFirst] = useState(true);
      const item = bank[qi];

      function pick(opt) {
        if (HKC.freeCapReached()) {
          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");
          onNeedUpgrade("今日免費練習已用完。");
          return;
        }
        HKC.recordDrillUse(APP_ID);
        const ok = opt === item.a;
        setFb(ok
          ? { ok: true, msg: "Correct · 正確" }
          : { ok: false, msg: "Not quite · 再想。Use Hint for the method (answer not shown)." });
        if (ok) {
          if (typeof HKC.recordOk === "function") HKC.recordOk(APP_ID, item);
          if (first) setScore(s => s + 1);
        } else {
          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
          HKC.recordSession(APP_ID, score, bank.length);
          onDone(score, bank.length);
        } else setQi(qi + 1);
      }

      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
          <div className="flex justify-between text-sm mb-3 text-slate-500">
            <span>{label} · Q {qi + 1}/{bank.length} · Lv {item.level}</span>
            <span>Score {score}</span>
          </div>
          <h2 className="text-lg font-bold mb-1">{item.q}</h2>
          {item.qZh ? <p className="text-sm mb-4 opacity-80" style={{color: ACCENT}}>{item.qZh}</p> : <div className="mb-4" />}
          <div className="grid gap-2">
            {item.opts.map(o => (
              <button key={o} type="button" disabled={fb && fb.ok} onClick={() => pick(o)}
                className="text-left px-4 py-3 rounded-xl min-h-[48px] disabled:opacity-50 bg-slate-50 hover:bg-slate-100 border border-slate-200">{o}</button>
            ))}
          </div>
          <button type="button" className="text-sm mt-3 font-semibold min-h-[44px]" style={{color: ACCENT}} onClick={() => setHint(true)}>Hint · 提示</button>
          {hint && <p className="text-sm mt-1 p-3 rounded-xl bg-amber-50 text-amber-900 border border-amber-200">{item.hint}</p>}
          {fb && (
            <div className={"mt-4 p-3 rounded-xl text-sm " + (fb.ok ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800")}>
              {fb.msg}
              {fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={next}>Next →</button>}
              {!fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={() => setFb(null)}>Retry</button>}
            </div>
          )}
        </section>
      );
    }

    function App() {
      const [mode, setMode] = useState("learn");
      const [progress, setProgress] = useState(() => HKC.loadProgress(APP_ID));
      const [pay, setPay] = useState(false);
      const [payReason, setPayReason] = useState("");
      const [doneMsg, setDoneMsg] = useState(null);
      const [tfzDone, setTfzDone] = useState(() => { try { return !!localStorage.getItem("hkc_tfz_" + APP_ID); } catch (e) { return false; } });

      function refresh() { setProgress(HKC.loadProgress(APP_ID)); }
      useEffect(() => { refresh(); }, [mode]);
      function completeTfz() {
        try { localStorage.setItem("hkc_tfz_" + APP_ID, "1"); } catch (e) {}
        setTfzDone(true); setMode("lab");
      }

      const tabs = [
        { id: "learn", label: "Learn · 學習" },
        { id: "lab", label: tfzDone ? "Lab · 實驗" : "Lab 🔒" },
        { id: "guided", label: "Guided · 引導" },
        { id: "exam", label: "Exam · 測驗" },
        { id: "review", label: "Review · 錯題" }
      ];

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-8">
          <a href="../../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>← Hub</a>
          <header className="mt-4 mb-4">
            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>F4 Biology · Cells</p>
            <h1 className="text-2xl sm:text-3xl font-bold mt-1">Cell Transport</h1>
            <p className="text-slate-500 mt-1">細胞物質運輸 · Learn (A1–A6) → Lab → Guided → Exam → Review</p>
          </header>

          <div className="text-sm border border-dashed rounded-lg px-3 py-2 mb-3 flex flex-wrap justify-between gap-2 items-center border-slate-300 bg-white/80">
            <span>{HKC.isPaid() ? (HKC.getEntitlement().tier + " · unlimited") : ("Free · " + HKC.remainingFree() + "/" + HKC.FREE_DAILY_CAP + " today")} · Best {progress.bestScore}</span>
            {!HKC.isPaid() && (
              <button type="button" className="px-3 py-1.5 rounded-md text-xs font-semibold text-white min-h-[36px]" style={{background: ACCENT}} onClick={() => setPay(true)}>Upgrade</button>
            )}
          </div>

          <nav className="flex flex-wrap gap-2 mb-4">
            {tabs.map(tab => (
              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}
                className={"px-3.5 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (mode === tab.id ? "text-white" : "bg-white border border-slate-200 text-slate-700")}
                style={mode === tab.id ? {background: ACCENT} : {}}>
                {tab.label}
              </button>
            ))}
          </nav>

          {mode === "learn" && <LearnFromZero steps={TFZ_STEPS} onComplete={completeTfz} />}

          {mode === "lab" && !tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-xl font-bold">Finish Learn From Zero first · 先完成 A1–A6</h2>
              <p className="text-sm text-slate-500 mt-2">We teach the model before you play — that is how real understanding sticks. 先學模型,後做實驗。</p>
              <button type="button" className="mt-4 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[48px]" style={{background: ACCENT}} onClick={() => setMode("learn")}>Go to Learn →</button>
            </section>
          )}
          {mode === "lab" && tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
              <h2 className="font-bold text-lg mb-3">Cell Membrane Simulation · 細胞膜模擬</h2>
              <TransportSim />
            </section>
          )}

          {mode === "guided" && !doneMsg && (
            <Drill bank={GUIDED} label="Guided" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); refresh(); }} />
          )}
          {mode === "exam" && !doneMsg && (
            <Drill bank={EXAM} label="Exam" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "review" }); refresh(); }} />
          )}
          {doneMsg && (mode === "guided" || mode === "exam") && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-2xl font-bold">Complete</h2>
              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>Continue →</button>
            </section>
          )}
          {mode === "review" && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3">
              <h2 className="font-bold text-lg">Wrong-answer book · 錯題簿</h2>
              {(progress.wrongBook || []).length === 0 && <p className="text-sm text-slate-500">No wrong answers yet · 暫無錯題</p>}
              {(progress.wrongBook || []).map(w => (
                <div key={w.id} className="rounded-xl p-3 text-sm border border-slate-200">
                  <p className="font-semibold">{w.prompt}</p>
                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>
                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">Answer unlocked</p>}
                  <button type="button" className="text-xs underline mt-2 text-slate-500" onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>Mark resolved</button>
                </div>
              ))}
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>

<script src="../../kit/form-banner.js"></script>
</body>
