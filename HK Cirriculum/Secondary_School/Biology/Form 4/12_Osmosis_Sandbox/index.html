    function LearnFromZero({ steps, onComplete }) {
      const [i, setI] = useState(0);
      const [picked, setPicked] = useState(null);
      const step = steps[i];
      const last = i === steps.length - 1;
      function pick(opt) { if (picked) return; setPicked(opt); }
      function next() {
        if (last) { onComplete(); return; }
        setI(i + 1); setPicked(null);
      }
      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-6">
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs font-black uppercase tracking-widest" style={{color: ACCENT}}>Learn From Zero · 由零開始學</p>
            <p className="text-xs text-slate-500">{step.id} / A{steps.length}</p>
          </div>
          <div className="flex gap-1.5 mb-4">
            {steps.map((s, k) => (
              <div key={s.id} className="h-1.5 flex-1 rounded-full" style={{background: k <= i ? ACCENT : "#e2e8f0"}} />
            ))}
          </div>
          <h2 className="text-xl font-bold">{step.title}</h2>
          <p className="text-sm font-semibold text-slate-500 mt-0.5">{step.titleZh}</p>
          <p className="text-sm mt-3 text-slate-700 leading-relaxed">{step.body}</p>
          <p className="text-sm mt-2 text-slate-500 leading-relaxed">{step.bodyZh}</p>
          <div className="mt-4 p-3 rounded-xl bg-indigo-50 border border-indigo-200">
            <p className="text-sm font-bold">{step.q}</p>
            <p className="text-xs text-slate-500 mb-2">{step.qZh}</p>
            <div className="grid gap-2">
              {step.opts.map(o => {
                let cls = "text-left px-3 py-2.5 rounded-xl text-sm border min-h-[44px] ";
                if (!picked) cls += "bg-white border-slate-200 hover:bg-slate-50";
                else if (o === step.a) cls += "bg-emerald-50 border-emerald-300 text-emerald-800 font-semibold";
                else if (o === picked) cls += "bg-rose-50 border-rose-300 text-rose-800";
                else cls += "bg-white border-slate-200 opacity-60";
                return <button key={o} type="button" className={cls} onClick={() => pick(o)}>{o}</button>;
              })}
            </div>
            {picked && (
              <div className="mt-3 text-sm p-3 rounded-lg bg-white/70 border border-slate-200">

                <p className="mt-1 text-slate-600">{step.why}</p>

function OsmosisSim() {
      const [ext, setExt] = useState(0.15);
      const [cellType, setCellType] = useState("plant");
      const internal = 0.1;
      const diff = ext - internal;
      let state, stateZh, color, waterDir;
      if (Math.abs(diff) < 0.02) { state = "Isotonic — no net movement"; stateZh = "等滲——無淨移動"; color = "#64748b"; waterDir = "↔"; }
      else if (diff > 0) { state = cellType === "plant" ? "Plasmolysed — water leaves" : "Shrunk / crenated"; stateZh = cellType === "plant" ? "質壁分離——水離開" : "收縮皺縮"; color = "#dc2626"; waterDir = "← out"; }
      else { state = cellType === "plant" ? "Turgid — water enters" : "Swollen — may lyse!"; stateZh = cellType === "plant" ? "充盈——水進入" : "膨脹——可能溶血！"; color = "#059669"; waterDir = "→ in"; }
      return (
        <div className="space-y-4">
          <div className="flex flex-wrap gap-2">
            {["plant", "animal"].map(t => (
              <button key={t} type="button" onClick={() => setCellType(t)} className={"px-3 py-2 rounded-xl font-bold min-h-[44px] capitalize " + (cellType === t ? "text-white" : "bg-slate-100")} style={cellType === t ? {background: ACCENT} : {}}>{t === "plant" ? "Plant cell 植物" : "Animal cell 動物"}</button>
            ))}
          </div>
          <label className="text-sm font-semibold block">External solute (relative) · 外部溶質 {ext.toFixed(2)}</label>
          <input type="range" min="0" max="0.5" step="0.01" value={ext} onChange={e => setExt(+e.target.value)} className="w-full" />

            <div className="relative">
              {cellType === "plant" && <div className="w-40 h-48 border-4 border-emerald-700 rounded-lg flex items-center justify-center" style={{background: "#ecfdf5"}}>
                <div className="rounded-full border-2 border-teal-400 transition-all duration-500" style={{width: diff > 0.02 ? "60%" : "85%", height: diff > 0.02 ? "60%" : "85%", background: "rgba(13,148,136,0.2)"}} />
              </div>}
              {cellType === "animal" && <div className="w-36 h-36 rounded-full border-2 border-rose-400 flex items-center justify-center transition-all duration-500" style={{background: "rgba(244,63,94,0.15)", transform: diff < -0.02 ? "scale(1.15)" : diff > 0.02 ? "scale(0.85)" : "scale(1)"}}>
                <span className="text-2xl">🩸</span>
              </div>}
              <p className="text-center text-2xl font-bold mt-2" style={{color}}>{waterDir}</p>
            </div>

        </div>
      );
    }

        hint: "Kinetic energy affects diffusion rate. 動能影響擴散速率。" }
    ];

    function LearnExtra(){const [ext,setExt]=useState(0.2);const dir=ext>0.3?"water leaves cell":ext<0.2?"water enters cell":"near equilibrium";return (<div className="mt-3 space-y-2"><label className="text-sm font-semibold">External solute (relative) {ext.toFixed(2)}</label><input type="range" min="0" max="0.6" step="0.05" value={ext} onChange={e=>setExt(+e.target.value)} className="w-full" /><p className="text-sm p-3 rounded-xl bg-teal-50 border border-teal-100">Prediction: {dir}</p></div>);}

    function UpgradeCTA({ reason, onClose, onTrial }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4">
          <div className={"w-full max-w-md rounded-2xl p-5 " + (false ? "bg-slate-900 border border-slate-600" : "bg-white border border-slate-200") }>
            <h3 className="text-lg font-bold" style={{color: ACCENT}}>解鎖完整練習與家長進度</h3>
            <p className={"text-sm mt-2 " + (false ? "text-slate-300" : "text-slate-600")}>{reason || window.SUBSCRIBE_CONFIG.bannerText}</p>
            <ul className={"mt-3 text-sm space-y-1 list-disc list-inside " + (false ? "text-slate-300" : "text-slate-600")}>
              <li>Unlimited daily drills</li>
              <li>Full wrong-answer book</li>
              <li>Progress sync (coming)</li>
            </ul>
            <button type="button" onClick={onTrial} className="mt-4 w-full min-h-[48px] rounded-xl font-semibold text-white" style={{background: ACCENT}}>開始 14 日試用（本機）</button>
            <a href={HKC.MARKETING_PATH} className={"mt-2 block w-full min-h-[44px] text-center leading-[44px] rounded-xl border text-sm " + (false ? "border-slate-600" : "border-slate-300")}>了解家長計劃</a>
            <button type="button" onClick={onClose} className={"mt-2 w-full text-sm underline " + (false ? "text-slate-400" : "text-slate-500")}>繼續免費</button>
          </div>
        </div>
      );
    }

    function Drill({ bank, label, onNeedUpgrade, onDone, isZh, t }) {
      const [qi, setQi] = useState(0);
      const [fb, setFb] = useState(null);
      const [score, setScore] = useState(0);
      const [hint, setHint] = useState(false);
      const [first, setFirst] = useState(true);
      const item = bank[qi];

      function pick(opt) {
        if (HKC.freeCapReached()) {
          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");
          onNeedUpgrade("今日免費練習已用完。");
          return;
        }
        HKC.recordDrillUse(APP_ID);
        const ok = opt === item.a;
        setFb(ok
          ? { ok: true, msg: "Correct · 正確" }
          : { ok: false, msg: "Not quite · 再想。Use Hint for the method (answer not shown)." });
        if (ok) {
          if (typeof HKC.recordOk === "function") HKC.recordOk(APP_ID, item);
          if (first) setScore(s => s + 1);
        } else {
          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
          HKC.recordSession(APP_ID, score, bank.length);
          onDone(score, bank.length);
        } else setQi(qi + 1);
      }

      return (
        <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5"}>
          <div className={"flex justify-between text-sm mb-3 " + (false ? "text-slate-400" : "text-slate-500")}>
            <span>{label} · Q {qi + 1}/{bank.length} · Lv {item.level}</span>
            <span>Score {score}</span>
          </div>
          <h2 className="text-lg font-bold mb-1">{t(item.qZh, item.q)}</h2>
          <div className="grid gap-2">
            {item.opts.map(o => (
              <button key={o} type="button" disabled={fb && fb.ok} onClick={() => pick(o)}
                className={"text-left px-4 py-3 rounded-xl min-h-[48px] disabled:opacity-50 bg-slate-50 hover:bg-slate-100 border border-slate-200"}>{o}</button>
            ))}
          </div>
          <button type="button" className="text-sm mt-3 font-semibold min-h-[44px]" style={{color: ACCENT}} onClick={() => setHint(true)}>{t("提示", "Hint")}</button>
          {hint && <p className={"text-sm mt-1 p-3 rounded-xl " + (false ? "bg-amber-950/50 text-amber-100 border border-amber-800/40" : "bg-amber-50 text-amber-900 border border-amber-200")}>{item.hint}</p>}
          {fb && (
            <div className={"mt-4 p-3 rounded-xl text-sm " + (fb.ok ? (false ? "bg-emerald-900/40 text-emerald-200" : "bg-emerald-50 text-emerald-800") : (false ? "bg-rose-900/40 text-rose-200" : "bg-rose-50 text-rose-800"))}>
              {fb.msg}
              {fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={next}>Next →</button>}
              {!fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={() => setFb(null)}>Retry</button>}
            </div>
          )}
        </section>
      );
    }

    function App() {
      const { isZh, t } = useLang();
      const [mode, setMode] = useState("learn");
      const [progress, setProgress] = useState(() => HKC.loadProgress(APP_ID));
      const [pay, setPay] = useState(false);
      const [payReason, setPayReason] = useState("");
      const [doneMsg, setDoneMsg] = useState(null);
      const [tfzDone, setTfzDone] = useState(() => { try { return !!localStorage.getItem("hkc_tfz_" + APP_ID); } catch (e) { return false; } });

      function refresh() { setProgress(HKC.loadProgress(APP_ID)); }
      useEffect(() => { refresh(); }, [mode]);

      function completeTfz() {
        try { localStorage.setItem("hkc_tfz_" + APP_ID, "1"); } catch (e) {}
        setTfzDone(true); setMode("lab");
      }

      const tabs = appTabs(["learn", "lab", "guided", "exam", "review"], isZh, { labLocked: !tfzDone });

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-8">
          <div className="flex flex-wrap justify-between items-center gap-2">
            <a href="../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>{t("← 返回目錄", "← Back to hub")}</a>
            <LangSwitcher />
          </div>
          <header className="mt-4 mb-4">
            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>{t("中四生物 · I.c 滲透實驗", "F4 Biology · I.c Osmosis lab")}</p>
            <h1 className="text-2xl sm:text-3xl font-bold mt-1">{t("滲透沙盒", "Osmosis Sandbox")}</h1>
            <p className="text-slate-500 mt-1">{t("學習 → 實驗 → 引導 → 測驗 → 複習", "Learn → Lab → Guided → Exam → Review")}</p>
          </header>

          <div className={"text-sm border border-dashed rounded-lg px-3 py-2 mb-3 flex flex-wrap justify-between gap-2 items-center " + (false ? "border-slate-600 bg-slate-900/80" : "border-slate-300 bg-white/80")}>
            <span>{HKC.isPaid() ? (HKC.getEntitlement().tier + " · " + t("無限", "unlimited")) : (t("免費", "Free") + " · " + HKC.remainingFree() + "/" + HKC.FREE_DAILY_CAP + " " + t("今日", "today"))} · {t("最佳", "Best")} {progress.bestScore}</span>
            {!HKC.isPaid() && (
              <button type="button" className="px-3 py-1.5 rounded-md text-xs font-semibold text-white min-h-[36px]" style={{background: ACCENT}} onClick={() => setPay(true)}>{t("升級", "Upgrade")}</button>
            )}
          </div>

          <nav className="flex flex-wrap gap-2 mb-4">
            {tabs.map(tab => (
              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}
                className={"px-3.5 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (mode === tab.id ? "text-white" : "bg-white border border-slate-200 text-slate-700")}
                style={mode === tab.id ? {background: ACCENT} : {}}>
                {tab.label}
              </button>
            ))}
          </nav>

          {mode === "learn" && (
            <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3"}>
              <h2 className="font-bold text-lg">{t("重點概念", "Key ideas")}</h2>
              <ul className={"text-sm space-y-2 list-disc list-inside " + (false ? "text-slate-300" : "text-slate-600")}>
                <li>{t("模型：不同濃度溶液中的袋/細胞。", "Model: bag / cell in solutions of different concentrations.")}</li>
                <li>{t("從水勢差預測質量/體積變化。", "Predict mass / volume change from water potential difference.")}</li>
                <li>{t("質壁分離 vs 膨壓：課程深度的細胞壁壓力概念。", "Plasmolysis vs turgid: wall pressure ideas at syllabus depth.")}</li>
              </ul>
              <LearnExtra />
              <button type="button" className="mt-2 px-4 py-2.5 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}} onClick={() => setMode("guided")}>
                {t("開始引導練習 →", "Start guided practice →")}
              </button>
            </section>
          )}

          {mode === "guided" && !doneMsg && (
            <Drill bank={GUIDED} label={t("引導", "Guided")} isZh={isZh} t={t} onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); refresh(); }} />
          )}
          {mode === "exam" && !doneMsg && (
            <Drill bank={EXAM} label={t("測驗", "Exam")} isZh={isZh} t={t} onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "review" }); refresh(); }} />
          )}
          {doneMsg && (mode === "guided" || mode === "exam") && (
            <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center"}>
              <h2 className="text-2xl font-bold">{t("完成", "Complete")}</h2>
              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>{t("繼續 →", "Continue →")}</button>
            </section>
          )}
          {mode === "review" && (
            <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3"}>
              <h2 className="font-bold text-lg">{t("錯題簿", "Wrong-answer book")}</h2>
              {(progress.wrongBook || []).length === 0 && <p className={"text-sm " + (false ? "text-slate-400" : "text-slate-500")}>{t("暫無錯題", "No wrong answers yet")}</p>}
              {(progress.wrongBook || []).map(w => (
                <div key={w.id} className={"rounded-xl p-3 text-sm " + (false ? "border border-slate-700" : "border border-slate-200")}>
                  <p className="font-semibold">{w.prompt}</p>
                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>
                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">{t("已解鎖答案", "Answer unlocked")}</p>}
                  <button type="button" className={"text-xs underline mt-2 " + (false ? "text-slate-400" : "text-slate-500")} onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>{t("標記已掌握", "Mark resolved")}</button>
                </div>
              ))}
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>

<script src="../../kit/form-banner.js"></script>
</body>
