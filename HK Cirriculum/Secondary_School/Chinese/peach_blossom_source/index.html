<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 桃花源記遊 2.0 (The Peach Blossom Source)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Serif TC', serif;
            background-color: #000;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Cinema Scope Bars */
        .cinema-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 0;
            background: black;
            transition: height 1s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 20;
        }

        .bar-top {
            top: 0;
        }

        .bar-bottom {
            bottom: 0;
        }

        .cinematic .bar-top,
        .cinematic .bar-bottom {
            height: 10vh;
        }

        /* HUD */
        .hud-content {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.9);
            text-align: right;
        }

        .quest-log {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.5rem;
            text-shadow: 0 0 10px #ff69b4;
        }

        .quest-item {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 5px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .quest-item.completed {
            text-decoration: line-through;
            color: #86efac;
            opacity: 0.5;
        }

        .quest-item.active {
            opacity: 1;
            font-weight: bold;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px white;
            opacity: 0.5;
            transition: transform 0.2s, opacity 0.2s;
        }

        #crosshair.hovering {
            transform: translate(-50%, -50%) scale(2);
            opacity: 1;
            background: #facc15;
        }

        /* Interaction Prompt */
        #prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        #prompt.visible {
            opacity: 1;
        }

        /* Narrative Overlay */
        #narrative-box {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            text-align: center;
            opacity: 0;
            transition: opacity 1s;
        }

        #narrative-box.visible {
            opacity: 1;
        }

        .poem-line {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2.5rem;
            color: white;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
            margin-bottom: 1rem;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1528164344705-47542687000d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: auto;
        }

        .title-main {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 6rem;
            color: white;
            text-shadow: 0 0 30px #ff69b4;
            margin-bottom: 2rem;
        }

        .fade-in {
            animation: fadein 2s;
        }

        @keyframes fadein {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body>

    <div id="ui-layer">
        <div class="cinema-bar bar-top"></div>
        <div class="cinema-bar bar-bottom"></div>

        <div id="crosshair"></div>
        <div id="prompt">[ E ] 閱讀</div>

        <div class="hud-content" id="hud" style="display:none;">
            <div class="quest-log">
                <div id="q1" class="quest-item active">尋找桃花林入口 (Find Entrance) 🌸</div>
                <div id="q2" class="quest-item">探索水源 (Find Water Source) 💧</div>
                <div id="q3" class="quest-item">發現山洞 (Discover Cave) ⛰️</div>
            </div>
        </div>

        <div id="narrative-box">
            <div id="narrative-text" class="poem-line">晉太元中，武陵人捕魚為業...</div>
        </div>
    </div>

    <div id="start-screen">
        <h1 class="title-main">桃花源記遊 2.0</h1>
        <p class="text-white text-xl mb-8 opacity-80">Immersive Experience • 按 WASD 移動 • 滑鼠 轉視角</p>
        <button onclick="startGame()"
            class="px-8 py-3 bg-white/20 hover:bg-white/40 border border-white/50 text-white rounded-full text-xl transition backdrop-blur">
            開始旅程 (Enter Journey)
        </button>
    </div>

    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
