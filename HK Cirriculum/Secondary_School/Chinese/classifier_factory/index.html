<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量詞配對工廠 2.0 (Classifier Factory)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #334155;
            overflow: hidden;
            user-select: none;
        }

        .conveyor-belt {
            height: 20px;
            background: repeating-linear-gradient(90deg, #1e293b, #1e293b 20px, #0f172a 20px, #0f172a 40px);
            animation: scrollBelt 2s linear infinite;
        }

        @keyframes scrollBelt {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 40px 0;
            }
        }

        .item {
            position: absolute;
            transition: transform 0.1s;
            cursor: grab;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
            font-size: 5rem;
            z-index: 10;
        }

        .item:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .item.moving {
            transition: left 0.05s linear;
        }

        .bin {
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.3);
        }

        .bin.hover {
            background: rgba(34, 197, 94, 0.2);
            border-color: #4ade80;
            transform: scale(1.05);
        }

        .bin.correct-anim {
            animation: bounce 0.5s;
            background: #22c55e;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        /* Factory Background */
        .factory-bg {
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body class="text-white h-screen flex flex-col factory-bg">

    <!-- HUD -->
    <div class="p-6 flex justify-between items-center bg-slate-900 border-b border-slate-700 shadow-xl z-20">
        <div>
            <h1 id="ui-title" class="text-2xl font-bold flex items-center gap-2">🏭 量詞工廠 <span
                    class="text-xs bg-blue-600 px-2 py-1 rounded">2.0</span></h1>
            <p id="ui-subtitle" class="text-slate-400 text-sm">將物品拖到正確的量詞箱子！</p>
        </div>
        <div class="flex items-center gap-6">
            <div id="hearts" class="text-2xl tracking-widest">❤️❤️❤️❤️❤️</div>
            <div class="text-4xl font-mono text-green-400" id="score">SCORE: 000</div>
        </div>
    </div>

    <!-- Gameplay Area -->
    <div class="flex-1 relative flex flex-col">

        <div class="flex-1 relative flex flex-col">

            <!-- Conveyor Section -->
            <div class="h-1/3 relative flex items-center bg-slate-800 border-b border-slate-600 shadow-inner">
                <div class="conveyor-belt absolute bottom-0 w-full"></div>
                <!-- Spawner (Visual) -->
                <div
                    class="absolute left-0 h-full w-20 bg-slate-900 z-10 shadow-xl border-r border-slate-600 flex items-center justify-center text-4xl">
                    🚪</div>
                <!-- Destroyer (Visual) -->
                <div class="absolute right-0 h-full w-20 bg-red-900/50 z-10 flex items-center justify-center text-4xl">
                    🔥
                </div>

                <div id="item-container" class="absolute inset-0 overflow-hidden pointer-events-none">
                    <!-- Items spawn here -->
                </div>
            </div>

            <!-- Bins Section -->
            <div id="bin-container" class="h-2/3 grid grid-cols-4 gap-4 p-8 bg-slate-700/50">
                <!-- Bins generated by JS -->
            </div>

        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal"
            class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center">
            <h2 id="ui-game-over-title" class="text-6xl font-black text-red-500 mb-4 animate-bounce">GAME OVER</h2>
            <p id="ui-final-score-label" class="text-2xl text-white mb-8">最終分數: <span id="final-score">0</span></p>
            <button id="ui-play-again" onclick="location.reload()"
                class="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-2xl font-bold shadow-lg transition transform hover:scale-105">
                再來一次 (Play Again)
            </button>
        </div>

        <script>
            var APP_STRINGS = {
                zh: {
                    pageTitle: "量詞配對工廠 2.0 (Classifier Factory)",
                    title: "🏭 量詞工廠",
                    subtitle: "將物品拖到正確的量詞箱子！",
                    scorePrefix: "SCORE: ",
                    binLabel: "量詞",
                    gameOver: "GAME OVER",
                    finalScore: "最終分數: ",
                    playAgain: "再來一次 (Play Again)"
                },
                en: {
                    pageTitle: "Classifier Factory 2.0",
                    title: "🏭 Classifier Factory",
                    subtitle: "Drag items to the correct classifier bin!",
                    scorePrefix: "SCORE: ",
                    binLabel: "Classifier",
                    gameOver: "GAME OVER",
                    finalScore: "Final score: ",
                    playAgain: "Play Again"
                },
                ne: { pageTitle: "Classifier Factory 2.0", title: "🏭 Classifier Factory", subtitle: "सही bin मा item तान्नुहोस्!", scorePrefix: "SCORE: ", binLabel: "Classifier", gameOver: "GAME OVER", finalScore: "Score: ", playAgain: "फेरि" },
                ur: { pageTitle: "Classifier Factory 2.0", title: "🏭 Classifier Factory", subtitle: "صحیح bin میں item کھینچیں!", scorePrefix: "SCORE: ", binLabel: "Classifier", gameOver: "GAME OVER", finalScore: "Score: ", playAgain: "دوبارہ" },
                tl: { pageTitle: "Classifier Factory 2.0", title: "🏭 Classifier Factory", subtitle: "I-drag ang item sa tamang bin!", scorePrefix: "SCORE: ", binLabel: "Classifier", gameOver: "GAME OVER", finalScore: "Score: ", playAgain: "Ulit" },
                hi: { pageTitle: "Classifier Factory 2.0", title: "🏭 Classifier Factory", subtitle: "सही bin में item खींचें!", scorePrefix: "SCORE: ", binLabel: "Classifier", gameOver: "GAME OVER", finalScore: "Score: ", playAgain: "फिर" }
            };

            function uiLangBucket() {
                if (window.NcsI18n && window.NcsI18n.getLang) {
                    var lang = window.NcsI18n.getLang();
                    return lang === "zh-Hant" ? "zh" : lang;
                }
                return "zh";
            }
            function ui(key) {
                if (window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) {
                    var fromKit = window.NcsI18n.t(key);
                    if (fromKit != null && fromKit !== key) return fromKit;
                }
                var bucket = uiLangBucket();
                if (APP_STRINGS[bucket] && APP_STRINGS[bucket][key]) return APP_STRINGS[bucket][key];
                if (bucket !== "en" && APP_STRINGS.en && APP_STRINGS.en[key]) return APP_STRINGS.en[key];
                return (APP_STRINGS.zh && APP_STRINGS.zh[key]) || key;
            }
            function registerAppStrings() {
                if (window.NcsI18n && window.NcsI18n.registerStrings) window.NcsI18n.registerStrings(APP_STRINGS);
            }
            function applyUI() {
                document.title = ui("pageTitle");
                var el;
                el = document.getElementById("ui-title");
                if (el) el.innerHTML = ui("title") + ' <span class="text-xs bg-blue-600 px-2 py-1 rounded">2.0</span>';
                el = document.getElementById("ui-subtitle"); if (el) el.textContent = ui("subtitle");
                el = document.getElementById("ui-game-over-title"); if (el) el.textContent = ui("gameOver");
                el = document.getElementById("ui-final-score-label");
                if (el) el.innerHTML = ui("finalScore") + '<span id="final-score">' + (state ? state.score : 0) + '</span>';
                el = document.getElementById("ui-play-again"); if (el) el.textContent = ui("playAgain");
                document.querySelectorAll(".bin-label").forEach(function (lbl) { lbl.textContent = ui("binLabel"); });
                if (typeof updateScoreDisplay === "function") updateScoreDisplay();
            }
            function wireI18n() {
                registerAppStrings();
                applyUI();
                if (window.NcsI18n && window.NcsI18n.onChange) window.NcsI18n.onChange(applyUI);
                document.addEventListener("hksteam-ncs-lang-change", applyUI);
                document.addEventListener("ncs-lang-change", applyUI);
            }
            function whenNcsReady(fn) {
                var tries = 0;
                var timer = setInterval(function () {
                    if ((window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) || ++tries > 120) {
                        clearInterval(timer);
                        fn();
                    }
                }, 50);
            }

            var CLASSIFIERS = ['隻', '條', '張', '枝', '座', '架', '本', '塊'];
            var ITEMS = [
                { emoji: '🐶', name: '狗', c: '隻' }, { emoji: '🐱', name: '貓', c: '隻' },
                { emoji: '🐟', name: '魚', c: '條' }, { emoji: '🐍', name: '蛇', c: '條' },
                { emoji: '📜', name: '紙', c: '張' }, { emoji: '🛏️', name: '床', c: '張' },
                { emoji: '✏️', name: '筆', c: '枝' }, { emoji: '🌹', name: '花', c: '枝' },
                { emoji: '⛰️', name: '山', c: '座' }, { emoji: '🌉', name: '橋', c: '座' },
                { emoji: '✈️', name: '飛機', c: '架' }, { emoji: '🎹', name: '鋼琴', c: '架' },
                { emoji: '📖', name: '書', c: '本' }, { emoji: '📒', name: '筆記', c: '本' },
                { emoji: '🍰', name: '蛋糕', c: '塊' }, { emoji: '🥩', name: '肉', c: '塊' }
            ];

            var state = { score: 0, items: [], spawnRate: 2000, lastSpawn: 0, lives: 5, isGameOver: false };
            var container = document.getElementById('item-container');
            var binContainer = document.getElementById('bin-container');
            var heartsContainer = document.getElementById('hearts');
            var scoreEl = document.getElementById('score');

            function updateScoreDisplay() {
                scoreEl.textContent = ui("scorePrefix") + state.score.toString().padStart(3, '0');
            }

            function updateHearts() {
                heartsContainer.innerHTML = '❤️'.repeat(state.lives) + '<span class="opacity-30">' + '🖤'.repeat(5 - state.lives) + '</span>';
            }

            function initBins() {
                CLASSIFIERS.forEach(function (c) {
                    var bin = document.createElement('div');
                    bin.className = 'bin rounded-xl flex flex-col items-center justify-center relative group';
                    bin.dataset.char = c;
                    bin.innerHTML = '<div class="text-xl text-slate-400 mb-2 bin-label">' + ui("binLabel") + '</div><div class="text-6xl font-black text-white drop-shadow-lg">' + c + '</div><div class="absolute inset-0 border-4 border-transparent group-hover:border-white/20 rounded-xl transition"></div>';
                    bin.addEventListener('dragover', function (e) { e.preventDefault(); bin.classList.add('hover'); });
                    bin.addEventListener('dragleave', function () { bin.classList.remove('hover'); });
                    bin.addEventListener('drop', function (e) { handleDrop(e, bin); });
                    binContainer.appendChild(bin);
                });
            }

            function handleDrop(e, bin) {
                e.preventDefault();
                bin.classList.remove('hover');
                if (state.isGameOver) return;
                var itemId = e.dataTransfer.getData('text/plain');
                var itemEl = document.getElementById(itemId);
                if (!itemEl) return;
                var correctC = itemEl.dataset.c;
                if (bin.dataset.char === correctC) {
                    bin.classList.add('correct-anim');
                    setTimeout(function () { bin.classList.remove('correct-anim'); }, 500);
                    state.score += 100;
                    updateScoreDisplay();
                    itemEl.remove();
                    var idx = state.items.findIndex(function (i) { return i.el === itemEl; });
                    if (idx > -1) state.items.splice(idx, 1);
                } else {
                    loseLife();
                    bin.style.borderColor = '#ef4444';
                    bin.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';
                    setTimeout(function () { bin.style.borderColor = ''; bin.style.backgroundColor = ''; }, 400);
                    itemEl.remove();
                    var idx = state.items.findIndex(function (i) { return i.el === itemEl; });
                    if (idx > -1) state.items.splice(idx, 1);
                }
            }

            function loseLife() {
                if (state.lives > 0) {
                    state.lives--;
                    updateHearts();
                    document.body.classList.add('bg-red-900');
                    setTimeout(function () { document.body.classList.remove('bg-red-900'); }, 100);
                }
                if (state.lives <= 0) gameOver();
            }

            function gameOver() {
                state.isGameOver = true;
                document.getElementById('final-score').textContent = state.score;
                document.getElementById('game-over-modal').classList.remove('hidden');
                applyUI();
            }

            function loop(timestamp) {
                if (state.isGameOver) return;
                if (timestamp - state.lastSpawn > state.spawnRate) {
                    spawnItem();
                    state.lastSpawn = timestamp;
                    if (state.spawnRate > 800) state.spawnRate -= 10;
                }
                updateItems();
                requestAnimationFrame(loop);
            }

            function spawnItem() {
                var data = ITEMS[Math.floor(Math.random() * ITEMS.length)];
                var div = document.createElement('div');
                var id = 'item-' + Math.random().toString(36).substr(2, 9);
                div.id = id;
                div.className = 'item pointer-events-auto select-none';
                div.textContent = data.emoji;
                div.dataset.c = data.c;
                div.draggable = true;
                div.style.left = '0px';
                div.style.top = '15%';
                div.addEventListener('dragstart', function (e) {
                    e.dataTransfer.setData('text/plain', id);
                    div.classList.add('dragging');
                });
                div.addEventListener('dragend', function () { div.classList.remove('dragging'); });
                container.appendChild(div);
                state.items.push({ el: div, x: 0 });
            }

            function updateItems() {
                var speed = 2;
                for (var i = state.items.length - 1; i >= 0; i--) {
                    var item = state.items[i];
                    if (item.el.classList.contains('dragging')) continue;
                    item.x += speed;
                    item.el.style.left = item.x + 'px';
                    if (item.x > container.offsetWidth - 80) {
                        item.el.remove();
                        state.items.splice(i, 1);
                        loseLife();
                    }
                }
            }

            whenNcsReady(function () {
                wireI18n();
                updateHearts();
                initBins();
                requestAnimationFrame(loop);
            });
        </script>

    </div>

        <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
