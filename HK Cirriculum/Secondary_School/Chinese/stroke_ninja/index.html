<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>筆順忍者 Stroke Ninja 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-box {
            text-align: left;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }

        .lives-box {
            text-align: right;
            font-size: 2rem;
            color: #ef4444;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
        }

        .combo-box {
            position: absolute;
            top: 20%;
            left: 20px;
            transform: rotate(-10deg);
            opacity: 0;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .combo-box.active {
            opacity: 1;
            transform: rotate(-10deg) scale(1.2);
        }

        .menu-screen {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            margin-bottom: 2rem;
            text-align: center;
        }

        .btn-start {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 1rem 4rem;
            font-size: 2rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transition: all 0.2s;
            pointer-events: auto;
            font-weight: bold;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.8);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

        function uiLangBucket() {
            if (window.NcsI18n && window.NcsI18n.getLang) {
                var lang = window.NcsI18n.getLang();
                return lang === "zh-Hant" ? "zh" : lang;
            }
            return "zh";
        }
        function ui(key) {
            if (window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) {
                var fromKit = window.NcsI18n.t(key);
                if (fromKit != null && fromKit !== key) return fromKit;
            }
            var bucket = uiLangBucket();
            if (APP_STRINGS[bucket] && APP_STRINGS[bucket][key]) return APP_STRINGS[bucket][key];
            if (bucket !== "en" && APP_STRINGS.en && APP_STRINGS.en[key]) return APP_STRINGS.en[key];
            return (APP_STRINGS.zh && APP_STRINGS.zh[key]) || key;
        }
        function applyUI() {
            document.title = ui("pageTitle");
            var el;
            el = document.getElementById("ui-title-main"); if (el) el.textContent = ui("titleMain");
            el = document.getElementById("ui-title-sub"); if (el) el.textContent = ui("titleSub");
            el = document.getElementById("ui-subtitle"); if (el) el.textContent = ui("subtitle");
            el = document.getElementById("ui-stroke-note"); if (el) el.textContent = ui("strokeNote");
            el = document.getElementById("ui-start-btn"); if (el) el.textContent = ui("startBtn");
            el = document.getElementById("ui-score-label"); if (el) el.textContent = ui("scoreLabel");
            el = document.getElementById("ui-combo-label"); if (el) el.textContent = ui("comboLabel");
            el = document.getElementById("ui-game-over-title"); if (el) el.textContent = ui("gameOverTitle");
            el = document.getElementById("ui-game-over-subtitle"); if (el) el.textContent = ui("gameOverSubtitle");
            el = document.getElementById("ui-final-score-label"); if (el) el.textContent = ui("finalScoreLabel");
            el = document.getElementById("ui-max-combo-label"); if (el) el.textContent = ui("maxComboLabel");
            el = document.getElementById("ui-retry-btn"); if (el) el.textContent = ui("retryBtn");
        }
        function wireI18n() {
            if (window.NcsI18n && window.NcsI18n.registerStrings) window.NcsI18n.registerStrings(APP_STRINGS);
            applyUI();
            if (window.NcsI18n && window.NcsI18n.onChange) window.NcsI18n.onChange(applyUI);
            document.addEventListener("hksteam-ncs-lang-change", applyUI);
            document.addEventListener("ncs-lang-change", applyUI);
        }
        function whenNcsReady(fn) {
            var tries = 0;
            var timer = setInterval(function () {
                if ((window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) || ++tries > 120) {
                    clearInterval(timer);
                    fn();
                }
            }, 50);
        }

        /**
         * STROKE NINJA 2.0 - GAME ENGINE
         * Features: Physics loop, Particle System, Stroke Analysis, Dynamic Difficulty
         */

        // --- Constants & Config ---
        const GRAVITY = 800; // px/s^2
        const DRAG = 0.5; // Air resistance
        const GAME_WIDTH = window.innerWidth;
        const GAME_HEIGHT = window.innerHeight;
        const SPAWN_INTERVAL_START = 2000;
        const TRAIL_LIFETIME = 0.15; // seconds

        const PALETTE = {
            bg: '#0f172a',
            trail: '#3b82f6', // bright blue
            trailCore: '#ffffff',
            text: '#f8fafc',
            highlight: '#a855f7', // purple
            correct: '#22c55e', // green
            wrong: '#ef4444', // red
            gold: '#fbbf24'
        };

        const CHAR_DATA = {
            '一': { strokes: [{ d: 'H', name: '橫' }], pinyin: 'yī' },
            '二': { strokes: [{ d: 'H', name: '橫' }, { d: 'H', name: '橫' }], pinyin: 'èr' },
            '三': { strokes: [{ d: 'H', name: '橫' }, { d: 'H', name: '橫' }, { d: 'H', name: '橫' }], pinyin: 'sān' },
            '十': { strokes: [{ d: 'H', name: '橫' }, { d: 'V', name: '豎' }], pinyin: 'shí' },
            '人': { strokes: [{ d: 'P', name: '撇' }, { d: 'N', name: '捺' }], pinyin: 'rén' },
            '大': { strokes: [{ d: 'H', name: '橫' }, { d: 'P', name: '撇' }, { d: 'N', name: '捺' }], pinyin: 'dà' },
            '口': { strokes: [{ d: 'V', name: '豎' }, { d: 'HZ', name: '橫折' }, { d: 'H', name: '橫' }], pinyin: 'kǒu' },
            '山': { strokes: [{ d: 'V', name: '中豎' }, { d: 'SZ', name: '豎折' }, { d: 'V', name: '右豎' }], pinyin: 'shān' },
            '木': { strokes: [{ d: 'H', name: '橫' }, { d: 'V', name: '豎' }, { d: 'P', name: '撇' }, { d: 'N', name: '捺' }], pinyin: 'mù' },
            '水': { strokes: [{ d: 'SG', name: '豎鉤' }, { d: 'HP', name: '橫撇' }, { d: 'P', name: '撇' }, { d: 'N', name: '捺' }], pinyin: 'shuǐ' },
            '火': { strokes: [{ d: 'DOT', name: '點' }, { d: 'P', name: '短撇' }, { d: 'P', name: '長撇', longerThanPrev: true }, { d: 'N', name: '捺' }], pinyin: 'huǒ' }
        };

        // --- Game State ---
        let canvas, ctx;
        let lastTime = 0;
        let score = 0;
        let lives = 3;
        let combo = 0;
        let maxCombo = 0;
        let isGameOver = false;
        let isPlaying = false;
        let difficultyMultiplier = 1;

        let entities = []; // Flying characters
        let particles = []; // Visual effects
        let inputPoints = []; // Mouse/Touch trail

        // --- Classes ---

        class Entity {
            constructor(char) {
                this.char = char;
                this.data = CHAR_DATA[char];
                this.strokesCompleted = 0;
                this.totalStrokes = this.data.strokes.length;

                // Physics
                this.radius = 60;
                this.x = Math.random() * (GAME_WIDTH - 200) + 100;
                this.y = GAME_HEIGHT + this.radius;
                this.vx = (Math.random() - 0.5) * 300; // Random horizontal drift
                this.vy = -(Math.random() * 400 + 750); // Initial launch velocity
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 2;

                this.isDead = false;
                this.isSliced = false;
                this.scale = 1;
                this.shake = 0;
            }

            update(dt) {
                // Apply physics
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += GRAVITY * dt;
                this.rotation += this.rotationSpeed * dt;

                // Check boundaries
                if (this.y > GAME_HEIGHT + 100 && !this.isSliced) {
                    this.isDead = true;
                    loseLife();
                }

                // Shake effect decay
                if (this.shake > 0) this.shake -= dt * 10;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Shake offset
                if (this.shake > 0) {
                    const offset = Math.sin(Date.now() / 20) * this.shake * 10;
                    ctx.translate(offset, 0);
                }

                // Draw Background Orb
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);

                // Progress visual: Fill up like water
                const progress = this.strokesCompleted / this.totalStrokes;
                const grad = ctx.createLinearGradient(0, this.radius, 0, -this.radius);
                grad.addColorStop(0, '#a855f7');
                grad.addColorStop(progress, '#a855f7');
                grad.addColorStop(progress, '#1e293b');
                grad.addColorStop(1, '#1e293b');

                ctx.fillStyle = grad;
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#f8fafc';
                ctx.stroke();

                // Draw Character
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 80px "Noto Sans TC"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.char, 0, 5); // visually centered

                ctx.restore();

                if (!this.isSliced) {
                    const nextStroke = this.data.strokes[this.strokesCompleted];
                    if (nextStroke) {
                        ctx.fillStyle = '#fbbf24';
                        ctx.font = 'bold 18px "Noto Sans TC", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(nextStroke.name, this.x, this.y - this.radius - 6);
                    }
                }
            }

            resolveStroke(result) {
                if (this.isSliced) return;
                const nowMs = Date.now();
                if (nowMs - (this.lastResolve || 0) < 280) return;
                this.lastResolve = nowMs;
                if (!result || !result.d) return;
                const expected = this.data.strokes[this.strokesCompleted];
                if (!expected) return;
                let lenOk = true;
                if (expected.longerThanPrev && result.len <= (this.prevLen || 0)) lenOk = false;
                const isCorrect = result.d === expected.d && lenOk;

                if (isCorrect) {
                    this.prevLen = result.len;
                    this.strokesCompleted++;
                    this.shake = 0.5;
                    spawnParticles(this.x, this.y, 10, PALETTE.highlight);
                    if (this.strokesCompleted >= this.totalStrokes) {
                        this.isSliced = true;
                        this.isDead = true;
                        addScore(100);
                        spawnParticles(this.x, this.y, 30, PALETTE.gold);
                        spawnFloatingText(this.x, this.y, "+100");
                        playAudio('clear');
                    } else {
                        addScore(10);
                        spawnFloatingText(this.x, this.y, expected.name);
                        playAudio('hit');
                    }
                } else {
                    this.shake = 1.0;
                    spawnParticles(this.x, this.y, 5, PALETTE.wrong);
                    spawnFloatingText(this.x, this.y, "應為" + expected.name);
                    combo = 0;
                    updateUI();
                    playAudio('wrong');
                }
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 200 + 100;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0; // 1 second
                this.decay = Math.random() * 2 + 1;
                this.size = Math.random() * 5 + 2;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += GRAVITY * 0.5 * dt; // Light gravity
                this.life -= this.decay * dt;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class FloatingText {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.life = 1.0;
                this.vy = -100;
            }
            update(dt) {
                this.y += this.vy * dt;
                this.life -= dt;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 30px Arial';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1;
            }
        }

        // --- Main Engine ---

        function init() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            resize();
            window.addEventListener('resize', resize);

            // Input Handling
            canvas.addEventListener('mousedown', startStroke);
            canvas.addEventListener('mousemove', moveStroke);
            document.addEventListener('mouseup', endStroke);
            canvas.addEventListener('touchstart', (e) => startStroke(e.touches[0]));
            canvas.addEventListener('touchmove', (e) => moveStroke(e.touches[0]));
            document.addEventListener('touchend', endStroke);

            requestAnimationFrame(loop);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function startGame() {
            score = 0;
            lives = 3;
            combo = 0;
            difficultyMultiplier = 1;
            entities = [];
            particles = [];
            isGameOver = false;
            isPlaying = true;

            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('game-over-menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            updateUI();

            spawnLoop();
        }

        function spawnLoop() {
            if (!isPlaying) return;

            // Increase difficulty
            difficultyMultiplier += 0.05;

            // Spawn Entity
            const chars = Object.keys(CHAR_DATA);
            const char = chars[Math.floor(Math.random() * chars.length)];
            entities.push(new Entity(char));

            // Calculate next spawn time based on difficulty
            const nextSpawn = Math.max(500, SPAWN_INTERVAL_START / difficultyMultiplier);
            setTimeout(spawnLoop, nextSpawn);
        }

        function loseLife() {
            lives--;
            combo = 0;
            updateUI();
            document.getElementById('game-container').classList.add('shake');
            setTimeout(() => document.getElementById('game-container').classList.remove('shake'), 500);

            if (lives <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            isPlaying = false;
            isGameOver = true;
            document.getElementById('hud').style.display = 'none';
            document.getElementById('game-over-menu').style.display = 'flex';
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-combo').textContent = maxCombo;
        }

        function resetGame() {
            startGame();
        }

        function addScore(points) {
            // Combo multiplier logic
            combo++;
            if (combo > maxCombo) maxCombo = combo;

            // Toggle combo display
            const comboEl = document.getElementById('combo-display');
            if (combo > 1) {
                comboEl.classList.add('active');
                document.getElementById('combo-count').textContent = combo;
            } else {
                comboEl.classList.remove('active');
            }

            score += points * Math.min(combo, 5); // Cap multiplier at 5x
            updateUI();
        }

        function updateUI() {
            document.getElementById('score-display').textContent = score;
            document.getElementById('lives-display').textContent = '❤'.repeat(lives);
        }

        function loop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (isPlaying) {
                ctx.fillStyle = PALETTE.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height); // Clear screen

                // Draw Background Grid/Effect (Optional Juice)
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < canvas.width; i += 100) { ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); }
                for (let i = 0; i < canvas.height; i += 100) { ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); }
                ctx.stroke();

                // Update & Draw Entities
                entities = entities.filter(e => !e.isDead);
                entities.forEach(e => {
                    e.update(dt);
                    e.draw(ctx);
                });

                // Update & Draw Particles
                particles = particles.filter(p => p.life > 0);
                particles.forEach(p => {
                    p.update(dt);
                    p.draw(ctx);
                });

                // Draw Player Trail
                if (inputPoints.length > 1) {
                    ctx.beginPath();
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    for (let i = 0; i < inputPoints.length - 1; i++) {
                        const p1 = inputPoints[i];
                        const p2 = inputPoints[i + 1];
                        const age = (Date.now() - p1.t) / 1000;

                        if (age > TRAIL_LIFETIME) continue;

                        ctx.lineWidth = (1 - age / TRAIL_LIFETIME) * 15;
                        ctx.strokeStyle = PALETTE.trail;
                        ctx.globalAlpha = 1 - age / TRAIL_LIFETIME;

                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();

                        // Core glow
                        ctx.lineWidth = (1 - age / TRAIL_LIFETIME) * 5;
                        ctx.strokeStyle = PALETTE.trailCore;
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                }

                // Clean old input points
                const now = Date.now();
                inputPoints = inputPoints.filter(p => (now - p.t) < TRAIL_LIFETIME * 1000);
            }

            requestAnimationFrame(loop);
        }

        // --- Input Handling & Slice Detection ---

        let gesture = null;

        function segmentHits(ent, a, b) {
            const abx = b.x - a.x;
            const aby = b.y - a.y;
            const denom = abx * abx + aby * aby || 1;
            let t = ((ent.x - a.x) * abx + (ent.y - a.y) * aby) / denom;
            t = Math.max(0, Math.min(1, t));
            const px = a.x + abx * t;
            const py = a.y + aby * t;
            const dx = ent.x - px;
            const dy = ent.y - py;
            return dx * dx + dy * dy <= ent.radius * ent.radius;
        }

        function startStroke(e) {
            const p = { x: e.clientX, y: e.clientY, t: Date.now() };
            gesture = { points: [p], touched: [] };
            inputPoints = [p];
        }

        function moveStroke(e) {
            if (!gesture) return;
            const p = { x: e.clientX, y: e.clientY, t: Date.now() };
            const prev = gesture.points[gesture.points.length - 1];
            gesture.points.push(p);
            inputPoints.push(p);
            entities.forEach(function (ent) {
                if (ent.isSliced) return;
                if (gesture.touched.indexOf(ent) !== -1) return;
                if (segmentHits(ent, prev, p)) gesture.touched.push(ent);
            });
        }

        function endStroke() {
            if (!gesture) return;
            const result = classifyStroke(gesture.points);
            gesture.touched.forEach(function (ent) {
                if (!ent.isSliced) ent.resolveStroke(result);
            });
            gesture = null;
            inputPoints = [];
        }

        function classifyStroke(rawPoints) {
            if (!rawPoints || rawPoints.length < 2) return null;
            const pts = [];
            for (let i = 0; i < rawPoints.length; i++) {
                const p = rawPoints[i];
                if (!pts.length || Math.hypot(p.x - pts[pts.length - 1].x, p.y - pts[pts.length - 1].y) >= 6) {
                    pts.push({ x: p.x, y: p.y });
                }
            }
            if (pts.length < 2) return null;
            let pathLen = 0;
            for (let k = 1; k < pts.length; k++) pathLen += Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y);
            if (pathLen < 14) return null;
            const start = pts[0];
            const end = pts[pts.length - 1];
            function dir(dx, dy) {
                const ax = Math.abs(dx);
                const ay = Math.abs(dy);
                const len = Math.hypot(dx, dy);
                if (len < 8) return null;
                if (dy > 6 && dx < -6 && ax > len * 0.28 && ay > len * 0.28) return "P";
                if (dy > 6 && dx > 6 && ax > len * 0.28 && ay > len * 0.28) return "N";
                if (ax > ay * 1.25 && dx > 0) return "H";
                if (ay > ax * 1.25 && dy > 0) return "V";
                if (ax > ay * 1.25 && dx < 0) return "HL";
                if (ay > ax * 1.25 && dy < 0) return "VU";
                return "X";
            }
            let best = 0;
            let bend = -1;
            for (let j = 1; j < pts.length - 1; j++) {
                const v1x = pts[j].x - start.x;
                const v1y = pts[j].y - start.y;
                const v2x = end.x - pts[j].x;
                const v2y = end.y - pts[j].y;
                const l1 = Math.hypot(v1x, v1y);
                const l2 = Math.hypot(v2x, v2y);
                if (l1 < 12 || l2 < 12) continue;
                const cos = (v1x * v2x + v1y * v2y) / (l1 * l2);
                const ang = Math.acos(Math.max(-1, Math.min(1, cos)));
                if (ang > best) {
                    best = ang;
                    bend = j;
                }
            }
            let kind = null;
            if (bend > 0 && best > 0.9) {
                const d1 = dir(pts[bend].x - start.x, pts[bend].y - start.y);
                const d2 = dir(end.x - pts[bend].x, end.y - pts[bend].y);
                if (d1 === "H" && d2 === "V") kind = "HZ";
                else if (d1 === "V" && d2 === "H") kind = "SZ";
                else if (d1 === "V" && (d2 === "HL" || d2 === "P")) kind = "SG";
                else if (d1 === "H" && d2 === "P") kind = "HP";
            }
            if (!kind) {
                const net = dir(end.x - start.x, end.y - start.y);
                if (pathLen < 46 && (end.y - start.y) > 8 && (end.x - start.x) > -6 && net !== "P" && net !== "H" && net !== "HL") kind = "DOT";
                else kind = net;
            }
            if (!kind) return null;
            return { d: kind, len: pathLen };
        }

        // --- Utils ---

        function spawnParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function spawnFloatingText(x, y, text) {
            particles.push(new FloatingText(x, y, text)); // Treating text as particle for update loop convenience
        }

        function playAudio(type) {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                if (!playAudio.ctx) playAudio.ctx = new AC();
                const ctx = playAudio.ctx;
                const sound = function () {
                    const now = ctx.currentTime;
                    function tone(freq, start, dur, wave, gain) {
                        const osc = ctx.createOscillator();
                        const amp = ctx.createGain();
                        osc.type = wave;
                        osc.frequency.setValueAtTime(freq, start);
                        amp.gain.setValueAtTime(0.0001, start);
                        amp.gain.exponentialRampToValueAtTime(gain, start + 0.02);
                        amp.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                        osc.connect(amp);
                        amp.connect(ctx.destination);
                        osc.start(start);
                        osc.stop(start + dur + 0.02);
                    }
                    if (type === "hit") tone(660, now, 0.12, "triangle", 0.2);
                    else if (type === "wrong") tone(150, now, 0.22, "sawtooth", 0.12);
                    else if (type === "clear") {
                        tone(523, now, 0.12, "triangle", 0.18);
                        tone(784, now + 0.12, 0.18, "triangle", 0.18);
                    }
                };
                if (ctx.state === "suspended") ctx.resume().then(sound);
                else sound();
            } catch (err) {
                return;
            }
        }

        whenNcsReady(function () {
            wireI18n();
            init();
        });

    </script>
