<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>議論文積木 2.0 (Argument Tower)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #e2e8f0;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f2fe 100%);
            overflow: hidden;
        }

        /* Crane */
        #crane {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 100px;
            background: #333;
            transition: left 0.5s;
            z-index: 20;
        }

        #claw {
            position: absolute;
            bottom: -20px;
            left: -15px;
            width: 40px;
            height: 20px;
            border: 4px solid #333;
            border-top: none;
        }

        /* Ground */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: #475569;
            z-index: 10;
            border-top: 10px solid #334155;
        }

        /* Blocks */
        .block {
            position: absolute;
            width: 300px;
            height: 60px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 10px;
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
            cursor: pointer;
            z-index: 5;
            text-align: center;
        }

        .block.intro {
            background: #fca5a5;
            border-color: #991b1b;
            color: #7f1d1d;
        }

        .block.point {
            background: #fcd34d;
            border-color: #92400e;
            color: #78350f;
        }

        .block.evidence {
            background: #86efac;
            border-color: #166534;
            color: #14532d;
        }

        .block.reasoning {
            background: #93c5fd;
            border-color: #1e40af;
            color: #1e3a8a;
        }

        .block.conclusion {
            background: #d8b4fe;
            border-color: #6b21a8;
            color: #581c87;
        }

        .block.falling {
            transition: top 0.5s ease-in;
        }

        .block.placed {
            transition: transform 0.2s;
        }

        /* UI */
        .sidebar {
            position: absolute;
            right: 0;
            top: 0;
            width: 350px;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            z-index: 30;
            display: flex;
            flex-direction: column;
        }

        .block-pool {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .pool-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            cursor: grab;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .pool-item:hover {
            transform: scale(1.02);
            border-color: #94a3b8;
        }

        .pool-item:active {
            cursor: grabbing;
        }

        .architect-bubble {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            border: 3px solid #000;
            font-weight: bold;
            max-width: 400px;
            box-shadow: 5px 5px 0 #000;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 40;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .architect-bubble.show {
            transform: translateY(0);
        }

        .architect-face {
            font-size: 3rem;
            background: #fbbf24;
            border-radius: 50%;
            padding: 5px;
            border: 3px solid #000;
        }

        /* Effects */
        .dust {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #cbd5e1;
            border-radius: 50%;
            animation: dust 0.5s ease-out forwards;
        }

        @keyframes dust {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: translate(var(--tx), -20px) scale(2);
                opacity: 0;
            }
        }

        .win-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            color: white;
        }

        .level-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 900;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
            z-index: 25;
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body>

    <div id="game-container">
        <div class="level-badge">LEVEL <span id="level-display">1</span></div>

        <!-- The Crane -->
        <div id="crane">
            <div id="claw"></div>
        </div>

        <!-- Using a container for building physics visuals -->
        <div id="building-site"
            class="absolute bottom-[100px] left-1/2 transform -translate-x-1/2 w-[400px] h-[600px] flex flex-col-reverse items-center justify-start">
            <!-- Blocks will be appended here -->
        </div>

        <!-- Ground -->
        <div id="ground"></div>

        <!-- UI -->
        <div class="sidebar">
            <h2 class="text-2xl font-black mb-4 text-slate-700">建材倉庫</h2>
            <div class="text-sm text-slate-500 mb-2">點擊選擇積木進行吊運堆疊</div>
            <div id="block-pool" class="block-pool">
                <!-- Pool Items -->
            </div>
            <div class="bg-white p-4 rounded-xl border-2 border-slate-200">
                <div class="text-xs font-bold text-slate-400 mb-1">穩定度 (STABILITY)</div>
                <div class="w-full h-4 bg-slate-200 rounded-full overflow-hidden">
                    <div id="stability-bar" class="w-full h-full bg-green-500 transition-all"></div>
                </div>
            </div>
        </div>

        <!-- Architect Feedback -->
        <div id="architect" class="architect-bubble">
            <div class="architect-face">👷‍♂️</div>
            <div id="architect-msg">工程開始！請按邏輯順序堆疊「議論文大廈」。</div>
        </div>

        <!-- Win Screen -->
        <div id="win-screen" class="win-screen">
            <div class="text-6xl mb-4">🏗️ 驗收合格！</div>
            <div class="text-2xl mb-8">結構穩固，邏輯清晰！</div>
            <button onclick="nextLevel()"
                class="bg-yellow-400 text-black px-8 py-4 rounded-xl font-bold text-2xl hover:scale-105 transition-transform">下一層樓</button>
        </div>
    </div>

    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
