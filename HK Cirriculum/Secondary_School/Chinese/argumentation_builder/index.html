<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>議論文積木 2.0 (Argument Tower)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #e2e8f0;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f2fe 100%);
            overflow: hidden;
        }

        /* Crane */
        #crane {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 100px;
            background: #333;
            transition: left 0.5s;
            z-index: 20;
        }

        #claw {
            position: absolute;
            bottom: -20px;
            left: -15px;
            width: 40px;
            height: 20px;
            border: 4px solid #333;
            border-top: none;
        }

        /* Ground */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: #475569;
            z-index: 10;
            border-top: 10px solid #334155;
        }

        /* Blocks */
        .block {
            position: absolute;
            width: 300px;
            height: 60px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 10px;
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
            cursor: pointer;
            z-index: 5;
            text-align: center;
        }

        .block.intro {
            background: #fca5a5;
            border-color: #991b1b;
            color: #7f1d1d;
        }

        .block.point {
            background: #fcd34d;
            border-color: #92400e;
            color: #78350f;
        }

        .block.evidence {
            background: #86efac;
            border-color: #166534;
            color: #14532d;
        }

        .block.reasoning {
            background: #93c5fd;
            border-color: #1e40af;
            color: #1e3a8a;
        }

        .block.conclusion {
            background: #d8b4fe;
            border-color: #6b21a8;
            color: #581c87;
        }

        .block.falling {
            transition: top 0.5s ease-in;
        }

        .block.placed {
            transition: transform 0.2s;
        }

        /* UI */
        .sidebar {
            position: absolute;
            right: 0;
            top: 0;
            width: 350px;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            z-index: 30;
            display: flex;
            flex-direction: column;
        }

        .block-pool {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .pool-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            cursor: grab;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .pool-item:hover {
            transform: scale(1.02);
            border-color: #94a3b8;
        }

        .pool-item:active {
            cursor: grabbing;
        }

        .architect-bubble {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            border: 3px solid #000;
            font-weight: bold;
            max-width: 400px;
            box-shadow: 5px 5px 0 #000;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 40;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .architect-bubble.show {
            transform: translateY(0);
        }

        .architect-face {
            font-size: 3rem;
            background: #fbbf24;
            border-radius: 50%;
            padding: 5px;
            border: 3px solid #000;
        }

        /* Effects */
        .dust {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #cbd5e1;
            border-radius: 50%;
            animation: dust 0.5s ease-out forwards;
        }

        @keyframes dust {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: translate(var(--tx), -20px) scale(2);
                opacity: 0;
            }
        }

        .win-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            color: white;
        }

        .level-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 900;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
            z-index: 25;
        }

        body.dilemma-on,
        body.dilemma-on #dilemma-board,
        body.dilemma-on #dilemma-panel,
        body.dilemma-on #dilemma-reason {
            user-select: text;
            -webkit-user-select: text;
        }

        #dilemma-board {
            display: none;
            position: absolute;
            z-index: 15;
            top: 84px;
            left: 16px;
            right: 366px;
            bottom: 150px;
            overflow: auto;
            padding: 4px 8px 16px 4px;
        }

        #dilemma-board.is-open {
            display: block;
        }

        .dilemma-card,
        .choice-card {
            background: rgba(255, 255, 255, 0.96);
            border: 3px solid #000;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 4px 4px 0 #000;
        }

        .choice-card.selected {
            background: #fffbeb;
            box-shadow: 4px 4px 0 #b45309;
        }

        .dilemma-kicker {
            margin: 8px 0 0;
            font-size: 0.78rem;
            font-weight: 900;
            color: #92400e;
        }

        .dilemma-kicker.tone-case,
        .dilemma-kicker.tone-act {
            margin-top: 0;
            color: #1d4ed8;
        }

        .dilemma-kicker.tone-counter {
            color: #be123c;
        }

        .dilemma-title {
            margin: 2px 0 8px;
            font-size: 1.45rem;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.35;
        }

        .dilemma-lead {
            margin: 0 0 8px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #9a3412;
            line-height: 1.6;
        }

        .choice-label {
            margin: 2px 0 0;
            font-size: 1.15rem;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.45;
        }

        .dilemma-body {
            margin: 4px 0 0;
            font-size: 1rem;
            line-height: 1.65;
            font-weight: 500;
            color: #1e293b;
        }

        .pick-btn,
        #dilemma-submit {
            font-family: inherit;
            cursor: pointer;
            border: 3px solid #000;
            border-radius: 999px;
            font-weight: 900;
        }

        .pick-btn {
            margin-top: 12px;
            background: #fde68a;
            padding: 8px 16px;
        }

        .choice-card.selected .pick-btn {
            background: #ea580c;
            color: #fff;
        }

        #dilemma-panel {
            display: none;
        }

        #dilemma-panel.is-open {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: auto;
        }

        #dilemma-picked {
            font-size: 0.95rem;
            font-weight: 900;
            color: #0f172a;
            line-height: 1.5;
        }

        #dilemma-reason-label {
            display: block;
            margin: 10px 0 4px;
            font-size: 0.78rem;
            font-weight: 900;
            color: #64748b;
        }

        #dilemma-reason {
            box-sizing: border-box;
            width: 100%;
            min-height: 120px;
            flex: 1;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            background: #fff;
            color: #0f172a;
        }

        .dilemma-tip {
            margin: 8px 0 0;
            font-size: 0.82rem;
            line-height: 1.55;
            font-weight: 700;
            color: #9a3412;
        }

        #dilemma-error {
            min-height: 3rem;
            margin: 8px 0 0;
            font-size: 0.88rem;
            line-height: 1.5;
            font-weight: 700;
            color: #b91c1c;
        }

        #dilemma-submit {
            margin-top: 8px;
            background: #facc15;
            color: #000;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 3px 3px 0 #000;
        }

        #dilemma-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
    <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
    <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
    <style data-ncs-kit="fleet-bridge">
        body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
        body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
            display: none !important;
        }
    </style>
    <script data-ncs-kit="fleet-init">
        (function () {
            function hideLegacyToggles() {
                document.body.classList.add("ncs-fleet-mounted");
                document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
                    var label = (btn.textContent || "").trim();
                    if (label === "EN" || label === "\u4E2D") {
                        btn.classList.add("ncs-hide-when-ncs-fleet");
                    }
                });
                document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
                    el.classList.add("ncs-hide-when-ncs-fleet");
                });
            }
            function boot() {
                if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
                window.NcsI18n.init({
                    chromePath: "../../../_shared/ncs-chrome.json",
                    target: document.body
                }).then(hideLegacyToggles);
            }
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", boot);
            } else {
                boot();
            }
        })();
    </script>
</head>

<body>

    <div id="game-container">
        <div class="level-badge"><span id="ui-level-prefix">LEVEL</span> <span id="level-display">1</span></div>
        <div id="dilemma-board"></div>

        <!-- The Crane -->
        <div id="crane">
            <div id="claw"></div>
        </div>

        <!-- Using a container for building physics visuals -->
        <div id="building-site"
            class="absolute bottom-[100px] left-1/2 transform -translate-x-1/2 w-[400px] h-[600px] flex flex-col-reverse items-center justify-start">
            <!-- Blocks will be appended here -->
        </div>

        <!-- Ground -->
        <div id="ground"></div>

        <!-- UI -->
        <div class="sidebar">
            <h2 id="ui-sidebar-title" class="text-2xl font-black mb-4 text-slate-700">建材倉庫</h2>
            <div id="ui-sidebar-hint" class="text-sm text-slate-500 mb-2">點擊選擇積木進行吊運堆疊</div>
            <div id="block-pool" class="block-pool">
                <!-- Pool Items -->
            </div>
            <div id="dilemma-panel">
                <div id="dilemma-picked">尚未選擇</div>
                <label id="dilemma-reason-label" for="dilemma-reason">一句理由</label>
                <textarea id="dilemma-reason" rows="5" maxlength="120" placeholder="例如：我選這一邊，因為某人會遇上某個後果。"></textarea>
                <p id="dilemma-tip" class="dilemma-tip"></p>
                <p id="dilemma-error" role="alert"></p>
                <button type="button" id="dilemma-submit" onclick="submitDilemma()">交這一句</button>
            </div>
            <div id="stability-panel" class="bg-white p-4 rounded-xl border-2 border-slate-200">
                <div id="ui-stability-label" class="text-xs font-bold text-slate-400 mb-1">穩定度 (STABILITY)</div>
                <div class="w-full h-4 bg-slate-200 rounded-full overflow-hidden">
                    <div id="stability-bar" class="w-full h-full bg-green-500 transition-all"></div>
                </div>
            </div>
        </div>

        <!-- Architect Feedback -->
        <div id="architect" class="architect-bubble">
            <div class="architect-face">👷‍♂️</div>
            <div id="architect-msg">工程開始！請按邏輯順序堆疊「議論文大廈」。</div>
        </div>

        <!-- Win Screen -->
        <div id="win-screen" class="win-screen">
            <div id="ui-win-title" class="text-6xl mb-4">🏗️ 驗收合格！</div>
            <div id="ui-win-subtitle" class="text-2xl mb-8">結構穩固，邏輯清晰！</div>
            <button id="ui-win-next" onclick="nextLevel()"
                class="bg-yellow-400 text-black px-8 py-4 rounded-xl font-bold text-2xl hover:scale-105 transition-transform">下一層樓</button>
        </div>
    </div>

        function uiLangBucket() {
            if (window.NcsI18n && window.NcsI18n.getLang) {
                var lang = window.NcsI18n.getLang();
                return lang === "zh-Hant" ? "zh" : lang;
            }
            return "zh";
        }

        function ui(key) {
            if (window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) {
                var fromKit = window.NcsI18n.t(key);
                if (fromKit != null && fromKit !== key) return fromKit;
            }
            var bucket = uiLangBucket();
            if (APP_STRINGS[bucket] && APP_STRINGS[bucket][key]) return APP_STRINGS[bucket][key];
            if (bucket !== "en" && APP_STRINGS.en && APP_STRINGS.en[key]) return APP_STRINGS.en[key];
            return (APP_STRINGS.zh && APP_STRINGS.zh[key]) || key;
        }

        function registerArgStrings() {
            if (window.NcsI18n && window.NcsI18n.registerStrings) {
                window.NcsI18n.registerStrings(APP_STRINGS);
            }
        }

        function applyUI() {
            document.title = ui("pageTitle");
            var el;
            el = document.getElementById("ui-level-prefix");
            if (el) el.textContent = ui("levelPrefix");
            el = document.getElementById("ui-sidebar-title");
            if (el) el.textContent = ui("sidebarTitle");
            el = document.getElementById("ui-sidebar-hint");
            if (el) el.textContent = ui("sidebarHint");
            el = document.getElementById("ui-stability-label");
            if (el) el.textContent = ui("stabilityLabel");
            el = document.getElementById("ui-win-title");
            if (el) el.textContent = ui("winTitle");
            el = document.getElementById("ui-win-subtitle");
            if (el && !state.dilemmaLocked) el.textContent = ui("winSubtitle");
            el = document.getElementById("ui-win-next");
            if (el) el.textContent = ui("winNext");
            el = document.getElementById("architect-msg");
            if (el && !el.dataset.liveMsg) el.textContent = ui("architectStart");
            refreshSidebarForLevel();
        }

        function wireI18n() {
            registerArgStrings();
            applyUI();
            if (window.NcsI18n && window.NcsI18n.onChange) {
                window.NcsI18n.onChange(function () {
                    applyUI();
                });
            }
            document.addEventListener("hksteam-ncs-lang-change", applyUI);

            {
                title: "傳統節日",
                blocks: [
                    { id: 1, type: "intro", text: "引言：傳統節日承載著豐富的文化內涵。" },
                    { id: 2, type: "point", text: "論點：節日慶祝活動能凝聚家庭和社區。" },
                    { id: 3, type: "evidence", text: "例子：中秋節一家團圓賞月，增進親情。" },
                    { id: 4, type: "reasoning", text: "論證：這些儀式能提醒現代人記着自己的根源。" },
                    { id: 5, type: "point", text: "論點：傳統節日是文化傳承的重要載體。" },
                    { id: 6, type: "conclusion", text: "結語：我們應重視並傳承優秀的節日文化。" }
                ],
                solution: [1, 2, 3, 4, 5, 6]
            },
            // Level 20
            {
                title: "終身學習",
                blocks: [
                    { id: 1, type: "intro", text: "引言：在這知識爆炸的時代，學習不應止於校園。" },
                    { id: 2, type: "point", text: "論點：終身學習能讓我們適應快速變化的社會。" },
                    { id: 3, type: "evidence", text: "現象：許多新興行業要求從業者不斷學習新技能，才能勝任工作。" },
                    { id: 4, type: "reasoning", text: "論證：學無止境，持續進修能提升個人競爭力。" },
                    { id: 5, type: "point", text: "論點：學習新事物能豐富精神生活，保持年輕心態。" },
                    { id: 6, type: "conclusion", text: "結語：活到老，學到老，讓生命不斷增值。" }
                ],
                solution: [1, 2, 3, 4, 5, 6]
            }
        ];

        let state = {
            levelIdx: 0,
            placedBlocks: [],
            stability: 100,
            isAnimating: false,
            dilemmaChoice: null,
            dilemmaLocked: false
        };

        var DILEMMA_LEAD = "兩邊都可以選，沒有唯一標準答案。請看具體事例和反方，再用自己的一句話寫出你接受哪一個後果。";
        var DILEMMA_TIP = "句中要出現左方那個人的名字，以及這一邊帶來的後果。不要把口號排成句子。";
        var DILEMMA_HINT = "先在左方選一邊。再用自己的一句話寫理由：要有事例裡的人，以及這個做法的後果，不要寫口號。";
        var DILEMMA_PICK = "請先選一邊。";
        var DILEMMA_EMPTY = "請用一句話寫下理由。";
        var DILEMMA_COPY = "請用自己的一句話，不要整段抄左方或提示的文字。";
        var DILEMMA_ONE = "請只寫一句，不要分成兩句。";
        var DILEMMA_SLOGAN = "不要用口號代替理由。請直接寫這件事裡的人，以及你選了之後會發生的後果。";
        var DILEMMA_JUNK = "請寫一句完整的理由，不要重複同一組字。";
        var DILEMMA_SHORT = "這句太短。請寫成完整的一句，說明誰會遇上甚麼後果。";
        var DILEMMA_LONG = "請收成一句，不要寫成一段。";
        var DILEMMA_MISS = "這一句還沒有同時寫到事例裡的人，和他會遇上的具體後果。請看左方，把這兩樣寫進自己的句子。";
        var DILEMMA_LINK = "請用「因為」「如果」或「會」把人和後果連成一句原因，不要只把詞語排在一起。";
        var DILEMMA_LINKS = ["因為", "所以", "如果", "若", "會", "便", "讓", "被", "因此", "於是", "才能", "否則", "導致", "以免", "的話"];

        function init() {
            loadLevel(state.levelIdx);
            showArchitect(ui("welcome"), 3000);
        }

        function refreshSidebarForLevel() {
            var level = LEVELS[state.levelIdx];
            var title = document.getElementById("ui-sidebar-title");
            var hint = document.getElementById("ui-sidebar-hint");
            if (!title || !hint) return;
            if (level && level.mode === "dilemma") {
                title.textContent = "你的立場";
                hint.textContent = DILEMMA_HINT;
                return;
            }
            title.textContent = ui("sidebarTitle");
            hint.textContent = ui("sidebarHint");
        }

        function setDilemmaOpen(open) {
            var board = document.getElementById("dilemma-board");
            var panel = document.getElementById("dilemma-panel");
            if (board) board.classList.toggle("is-open", open);
            if (panel) panel.classList.toggle("is-open", open);
            document.body.classList.toggle("dilemma-on", open);
            document.getElementById("crane").style.display = open ? "none" : "";
            document.getElementById("building-site").style.display = open ? "none" : "flex";
            document.getElementById("block-pool").style.display = open ? "none" : "";
            document.getElementById("stability-panel").style.display = open ? "none" : "";
        }

        function foldText(value) {
            return (value || "").replace(/\s+/g, "").replace(/[，。！？、；：,.!?;:「」『』（）()“”‘’"']/g, "");
        }

        function isNearCopy(folded, source) {
            var base = foldText(source);
            if (!base || base.length < 8) return false;
            if (folded === base) return true;
            return folded.indexOf(base) !== -1 && (folded.length - base.length) < 12;
        }

        function hasAny(text, list) {
            if (!list) return false;
            for (var i = 0; i < list.length; i++) {
                if (list[i] && text.indexOf(list[i]) !== -1) return true;
            }
            return false;
        }

        function hasMark(text, mark) {
            var from = 0;
            while (from < text.length) {
                var at = text.indexOf(mark, from);
                if (at === -1) return false;
                var slice = text.slice(Math.max(0, at - 4), at);
                if (!/[不沒別未]/.test(slice)) return true;
                from = at + mark.length;
            }
            return false;
        }

        function hasAnyMark(text, marks) {
            if (!marks) return false;
            for (var i = 0; i < marks.length; i++) {
                if (hasMark(text, marks[i])) return true;
            }
            return false;
        }

        function findDilemmaChoice(level) {
            if (!level || !level.choices) return null;
            for (var i = 0; i < level.choices.length; i++) {
                if (level.choices[i].id === state.dilemmaChoice) return level.choices[i];
            }
            return null;
        }

        function dilemmaSources(level) {
            var list = [level.scenario, DILEMMA_LEAD, DILEMMA_TIP, DILEMMA_HINT, DILEMMA_MISS, DILEMMA_LINK, DILEMMA_SLOGAN, DILEMMA_COPY, DILEMMA_SHORT, DILEMMA_LONG, DILEMMA_ONE, DILEMMA_EMPTY, DILEMMA_PICK, DILEMMA_JUNK];
            for (var i = 0; i < level.choices.length; i++) {
                var choice = level.choices[i];
                list.push(choice.label, choice.result, choice.counter, choice.align);
            }
            return list;
        }

        function dilemmaError(level, raw) {
            if (!state.dilemmaChoice) return DILEMMA_PICK;
            var text = (raw || "").replace(/\s+/g, "");
            if (!text) return DILEMMA_EMPTY;
            var folded = foldText(text);
            var sources = dilemmaSources(level);
            for (var i = 0; i < sources.length; i++) {
                if (folded && isNearCopy(folded, sources[i])) return DILEMMA_COPY;
            }
            var ends = text.match(/[。！？]/g);
            if (ends && ends.length > 1) return DILEMMA_ONE;
            for (var s = 0; s < level.slogans.length; s++) {
                if (text.indexOf(level.slogans[s]) !== -1) return DILEMMA_SLOGAN;
            }
            if (/(.{2,8})\1{2,}/.test(folded)) return DILEMMA_JUNK;
            if (folded.length < 22) return DILEMMA_SHORT;
            if (folded.length > 80) return DILEMMA_LONG;
            if (!hasAny(text, level.people) || !hasAny(text, level.stakes)) return DILEMMA_MISS;
            if (!hasAny(text, DILEMMA_LINKS)) return DILEMMA_LINK;
            var choice = findDilemmaChoice(level);
            if (!choice) return DILEMMA_PICK;
            if (!hasAnyMark(text, choice.marks)) return choice.align;
            return "";
        }

        function makeKicker(text, tone) {
            var p = document.createElement("p");
            p.className = "dilemma-kicker" + (tone ? (" " + tone) : "");
            p.textContent = text;
            return p;
        }

        function renderChoiceCard(choice) {
            var card = document.createElement("section");
            card.className = "choice-card";
            card.id = "choice-" + choice.id;
            card.appendChild(makeKicker("做法", "tone-act"));
            var label = document.createElement("p");
            label.className = "choice-label";
            label.textContent = choice.label;
            card.appendChild(label);
            card.appendChild(makeKicker("選了之後", ""));
            var result = document.createElement("p");
            result.className = "dilemma-body";
            result.textContent = choice.result;
            card.appendChild(result);
            card.appendChild(makeKicker("反方", "tone-counter"));
            var counter = document.createElement("p");
            counter.className = "dilemma-body";
            counter.textContent = choice.counter;
            card.appendChild(counter);
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "pick-btn";
            btn.textContent = "選這一邊";
            btn.setAttribute("aria-pressed", "false");
            btn.addEventListener("click", function () {
                selectDilemmaChoice(choice.id);
            });
            card.appendChild(btn);
            return card;
        }

        function renderDilemmaBoard(level) {
            var board = document.getElementById("dilemma-board");
            board.innerHTML = "";
            var scenario = document.createElement("section");
            scenario.className = "dilemma-card";
            scenario.appendChild(makeKicker("具體事例", "tone-case"));
            var title = document.createElement("h2");
            title.className = "dilemma-title";
            title.textContent = level.title;
            scenario.appendChild(title);
            var lead = document.createElement("p");
            lead.className = "dilemma-lead";
            lead.textContent = DILEMMA_LEAD;
            scenario.appendChild(lead);
            var body = document.createElement("p");
            body.className = "dilemma-body";
            body.textContent = level.scenario;
            scenario.appendChild(body);
            board.appendChild(scenario);
            for (var i = 0; i < level.choices.length; i++) {
                board.appendChild(renderChoiceCard(level.choices[i]));
            }
            board.scrollTop = 0;
        }

        function selectDilemmaChoice(id) {
            if (state.dilemmaLocked) return;
            var level = LEVELS[state.levelIdx];
            if (!level || level.mode !== "dilemma") return;
            state.dilemmaChoice = id;
            var chosen = null;
            for (var i = 0; i < level.choices.length; i++) {
                var choice = level.choices[i];
                var card = document.getElementById("choice-" + choice.id);
                var on = choice.id === id;
                if (card) {
                    card.classList.toggle("selected", on);
                    var btn = card.querySelector(".pick-btn");
                    if (btn) {
                        btn.textContent = on ? "已選這一邊" : "選這一邊";
                        btn.setAttribute("aria-pressed", on ? "true" : "false");
                    }
                }
                if (on) chosen = choice;
            }
            var picked = document.getElementById("dilemma-picked");
            if (picked) picked.textContent = chosen ? ("已選：" + chosen.label) : "尚未選擇";
            var err = document.getElementById("dilemma-error");
            if (err) err.textContent = "";
        }

        function mountDilemma(level) {
            state.dilemmaChoice = null;
            state.dilemmaLocked = false;
            setDilemmaOpen(true);
            refreshSidebarForLevel();
            var reason = document.getElementById("dilemma-reason");
            if (reason) {
                reason.value = "";
                reason.placeholder = "例如：我選這一邊，因為某人會遇上某個後果。";
            }
            var tip = document.getElementById("dilemma-tip");
            if (tip) tip.textContent = DILEMMA_TIP;
            var err = document.getElementById("dilemma-error");
            if (err) err.textContent = "";
            var picked = document.getElementById("dilemma-picked");
            if (picked) picked.textContent = "尚未選擇";
            var submitBtn = document.getElementById("dilemma-submit");
            if (submitBtn) submitBtn.disabled = false;
            renderDilemmaBoard(level);
            showArchitect("這關不是排列口號。請看具體事例和反方，選一邊，並寫一句扣住後果的理由。", 4200);
        }

        function submitDilemma() {
            if (state.dilemmaLocked) return;
            var level = LEVELS[state.levelIdx];
            if (!level || level.mode !== "dilemma") return;
            var reasonEl = document.getElementById("dilemma-reason");
            var message = dilemmaError(level, reasonEl ? reasonEl.value : "");
            var err = document.getElementById("dilemma-error");
            if (message) {
                if (err) err.textContent = message;
                showArchitect(message, 3200);
                return;
            }
            state.dilemmaLocked = true;
            var submitBtn = document.getElementById("dilemma-submit");
            if (submitBtn) submitBtn.disabled = true;
            if (err) err.textContent = "";
            var chosen = findDilemmaChoice(level);
            var winSub = document.getElementById("ui-win-subtitle");
            if (winSub) {
                winSub.textContent = chosen
                    ? ("你選了「" + chosen.label + "」，這一句扣住了事例，不是口號。")
                    : "這一句扣住了事例，不是口號。";
            }
            showArchitect("這句扣住了事例和後果，不是口號。", 1800);
            setTimeout(function () {
                document.getElementById("win-screen").style.display = "flex";
            }, 700);
        }

        function loadLevel(idx) {
            if (idx >= LEVELS.length) {
                alert(ui("msgAllClear"));
                location.reload();
                return;
            }

            state.levelIdx = idx;
            state.placedBlocks = [];
            state.stability = 100;
            state.isAnimating = false;
            state.dilemmaChoice = null;
            state.dilemmaLocked = false;
            updateStability(0);

            const level = LEVELS[idx];
            document.getElementById('level-display').textContent = idx + 1;
            document.getElementById('building-site').innerHTML = '';
            document.getElementById('win-screen').style.display = 'none';
            var winSub = document.getElementById('ui-win-subtitle');
            if (winSub) winSub.textContent = ui("winSubtitle");

            if (level.mode === "dilemma") {
                mountDilemma(level);
                return;
            }
            mountStructure(level);
        }

        function mountStructure(level) {
            setDilemmaOpen(false);
            var board = document.getElementById("dilemma-board");
            if (board) board.innerHTML = "";
            refreshSidebarForLevel();

            const pool = document.getElementById('block-pool');
            pool.innerHTML = '';
            const shuffled = [...level.blocks].sort(() => Math.random() - 0.5);

            shuffled.forEach(b => {
                const item = document.createElement('div');
                item.className = `pool-item border-l-4`;
                if (b.type === 'intro') item.classList.add('border-red-500');
                if (b.type === 'point') item.classList.add('border-yellow-500');
                if (b.type === 'evidence') item.classList.add('border-green-500');
                if (b.type === 'reasoning') item.classList.add('border-blue-500');
                if (b.type === 'conclusion') item.classList.add('border-purple-500');

                item.textContent = b.text;
                item.onclick = () => spawnBlock(b, item);
                pool.appendChild(item);
            });
        }

        function spawnBlock(blockData, uiItem) {
            if (state.isAnimating) return;
            state.isAnimating = true;

            // Create visual block at crane
            const block = document.createElement('div');
            block.className = `block ${blockData.type}`;
            block.textContent = blockData.text;
            block.style.top = '100px'; // Crane height
            block.style.left = '50%';
            block.style.transform = 'translate(-50%, 0)';
            document.getElementById('game-container').appendChild(block);

            // Animate Drop
            // Calculate target Y position (bottom up)
            const buildingSite = document.getElementById('building-site');
            const existing = buildingSite.children.length;
            // Each block 60px height + margin. Site is flex-reverse.
            // Actually we can just append to site and animate 'falling' by CSS or JS.

            // Let's emulate a drop physics simply
            // Move block to site coordinates
            const startY = 100;
            const endY = window.innerHeight - 100 - (existing * 70) - 60;

            // Animate falling
            let currentY = startY;
            const dropInterval = setInterval(() => {
                currentY += 15; // Speed
                block.style.top = currentY + 'px';

                if (currentY >= endY) {
                    clearInterval(dropInterval);
                    landBlock(block, blockData, uiItem);
                }
            }, 16);
        }

        function landBlock(blockEl, blockData, uiItem) {
            // 1. Remove from pool visually
            uiItem.style.opacity = '0.5';
            uiItem.style.pointerEvents = 'none';

            // 2. Add to stack logic
            state.placedBlocks.push(blockData.id);

            // 3. Move element to container for auto-layout stability
            blockEl.remove(); // Remove moving one

            const staticBlock = document.createElement('div');
            staticBlock.className = `block ${blockData.type} placed`;
            staticBlock.textContent = blockData.text;
            staticBlock.style.position = 'relative'; // Flex layout
            staticBlock.style.top = 'auto';
            staticBlock.style.left = 'auto';
            staticBlock.style.transform = 'none';
            staticBlock.style.width = '100%';
            staticBlock.style.marginBottom = '10px';

            document.getElementById('building-site').appendChild(staticBlock); // Adds to bottom because flex-col-reverse

            spawnDust();
            checkStability(staticBlock);

            state.isAnimating = false;
        }

        function checkStability(blockEl) {
            const level = LEVELS[state.levelIdx];
            const currentIdx = state.placedBlocks.length - 1;
            const correctId = level.solution[currentIdx];

            if (state.placedBlocks[currentIdx] !== correctId) {
                // WRONG BLOCK
                state.stability -= 30; // Big penalty
                updateStability();

                // Visual wobble
                blockEl.style.transform = `rotate(${Math.random() * 10 - 5}deg) translateX(${Math.random() * 20 - 10}px)`;
                showArchitect(ui("msgWrong"), 2000);

                if (state.stability <= 0) {
                    collapseTower();
                }
            } else {
                // CORRECT
                showArchitect(ui("msgCorrect"), 1000);
                blockEl.style.transform = 'none'; // Perfect fit

                if (state.placedBlocks.length === level.solution.length) {
                    setTimeout(() => {
                        document.getElementById('win-screen').style.display = 'flex';
                    }, 500);
                }
            }
        }

        function updateStability() {
            const bar = document.getElementById('stability-bar');
            bar.style.width = Math.max(0, state.stability) + '%';
            if (state.stability < 40) bar.classList.replace('bg-green-500', 'bg-red-500');
            else bar.classList.replace('bg-red-500', 'bg-green-500');
        }

        function collapseTower() {
            const site = document.getElementById('building-site');
            Array.from(site.children).forEach((child, i) => {
                child.style.transition = 'all 1s';
                child.style.transform = `rotate(${Math.random() * 90 - 45}deg) translate(${Math.random() * 200 - 100}px, 500px)`;
                child.style.opacity = '0';
            });

            showArchitect(ui("msgCollapse"), 3000);
            setTimeout(() => {
                loadLevel(state.levelIdx);
            }, 3000);
        }

        function spawnDust() {
            // Simple particle effect
            /* In full implementation this spawns dust divs at the block base */
        }

        function showArchitect(msg, duration) {
            const bubble = document.getElementById('architect');
            const txt = document.getElementById('architect-msg');
            txt.textContent = msg;
            txt.dataset.liveMsg = "1";
            bubble.classList.add('show');
            if (duration) setTimeout(function () {
                bubble.classList.remove('show');
                delete txt.dataset.liveMsg;
            }, duration);
        }

        function nextLevel() {
            state.levelIdx++;
            loadLevel(state.levelIdx);
        }

        whenNcsReady(function () {
            wireI18n();
            init();
        });

    </script>
