<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實用文改病文</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Noto Sans TC", sans-serif;
            background: linear-gradient(160deg, #1e1b4b 0%, #0f172a 55%, #312e81 100%);
        }

        .font-serif {
            font-family: "Noto Serif TC", serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
        }

        textarea.draft {
            background: #fdfbf7;
            color: #1e293b;
            min-height: 28rem;
        }

        .ok { color: #bbf7d0; }
        .bad { color: #fecaca; }
    </style>
    <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
    <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
    <style data-ncs-kit="fleet-bridge">
        body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
        body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
            display: none !important;
        }
    </style>
    <script data-ncs-kit="fleet-init">
        (function () {
            function hideLegacyToggles() {
                document.body.classList.add("ncs-fleet-mounted");
                document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
                    var label = (btn.textContent || "").trim();
                    if (label === "EN" || label === "\u4E2D") {
                        btn.classList.add("ncs-hide-when-ncs-fleet");
                    }
                });
                document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
                    el.classList.add("ncs-hide-when-ncs-fleet");
                });
            }
            function boot() {
                if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
                window.NcsI18n.init({
                    chromePath: "../../../_shared/ncs-chrome.json",
                    target: document.body
                }).then(hideLegacyToggles);
            }
            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", boot);
            } else {
                boot();
            }
        })();
    </script>
</head>

<body class="min-h-screen text-white/90">
    <div class="max-w-5xl mx-auto px-4 py-10">
        <div class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold">實用文改病文</h1>
            <p id="ui-subtitle" class="text-lg text-blue-100/80 mt-3">香港中學實用文。自己改病文，系統不會代寫。</p>
        </div>

        <div class="glass-panel rounded-3xl p-6 md:p-8">
            <label id="ui-select-label" class="block text-sm font-medium text-blue-200 mb-3" for="type">選擇文類</label>
            <select id="type" onchange="loadTask()" class="w-full bg-slate-900/70 border border-white/20 rounded-xl p-4 text-lg mb-6">
                <option value="complaint">投訴信</option>
                <option value="suggestion">建議書</option>
                <option value="invitation">邀請信</option>
            </select>

            <div class="bg-amber-950/40 border border-amber-400/30 rounded-2xl p-4 mb-4 text-amber-50 leading-relaxed" id="brief"></div>
            <p class="text-sm text-slate-300 mb-3">下面是病文。請在格內直接修改，不要指望按一下就生成一篇信。</p>
            <textarea id="draft" class="draft font-serif w-full rounded-2xl p-5 text-lg leading-loose" spellcheck="false"></textarea>

            <div class="flex flex-wrap gap-3 mt-4">
                <button id="ui-check-btn" type="button" onclick="grade()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-6 py-3 rounded-xl">核對我的修改</button>
                <button id="ui-reset-btn" type="button" onclick="loadTask(true)" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-6 py-3 rounded-xl">還原病文</button>
                <button id="ui-copy-btn" type="button" onclick="copyMine()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-6 py-3 rounded-xl">複製我改好的文字</button>
            </div>
            <ul id="report" class="mt-6 space-y-2 text-base"></ul>
        </div>
    </div>

    <script>
        var APP_STRINGS = {
            zh: {
                pageTitle: "實用文改病文",
                title: "實用文改病文",
                subtitle: "香港中學實用文。自己改病文，系統不會代寫。",
                selectType: "選擇文類",
                checkBtn: "核對我的修改",
                resetBtn: "還原病文",
                copyBtn: "複製我改好的文字",
                copied: "已複製你改好的文字。",
                emptyCopy: "格內還沒有文字。",
                typeComplaint: "投訴信",
                typeSuggestion: "建議書",
                typeInvitation: "邀請信"
            },
            en: {
                pageTitle: "Revise a practical text",
                title: "Revise a practical text",
                subtitle: "Hong Kong secondary practical writing. Edit the flawed text yourself.",
                selectType: "Text type",
                checkBtn: "Check my revision",
                resetBtn: "Restore the flawed text",
                copyBtn: "Copy my revision",
                copied: "Your revision was copied.",
                emptyCopy: "The box is empty.",
                typeComplaint: "Complaint",
                typeSuggestion: "Suggestion",
                typeInvitation: "Invitation"
            },
            ne: { pageTitle: "Revise a practical text", title: "Revise a practical text", subtitle: "Edit the flawed text yourself.", selectType: "Type", checkBtn: "Check", resetBtn: "Restore", copyBtn: "Copy", copied: "Copied.", emptyCopy: "Empty.", typeComplaint: "Complaint", typeSuggestion: "Suggestion", typeInvitation: "Invitation" },
            ur: { pageTitle: "Revise a practical text", title: "Revise a practical text", subtitle: "Edit the flawed text yourself.", selectType: "Type", checkBtn: "Check", resetBtn: "Restore", copyBtn: "Copy", copied: "Copied.", emptyCopy: "Empty.", typeComplaint: "Complaint", typeSuggestion: "Suggestion", typeInvitation: "Invitation" },
            tl: { pageTitle: "Revise a practical text", title: "Revise a practical text", subtitle: "Edit the flawed text yourself.", selectType: "Uri", checkBtn: "Check", resetBtn: "Restore", copyBtn: "Copy", copied: "Copied.", emptyCopy: "Empty.", typeComplaint: "Complaint", typeSuggestion: "Suggestion", typeInvitation: "Invitation" },
            hi: { pageTitle: "Revise a practical text", title: "Revise a practical text", subtitle: "Edit the flawed text yourself.", selectType: "Type", checkBtn: "Check", resetBtn: "Restore", copyBtn: "Copy", copied: "Copied.", emptyCopy: "Empty.", typeComplaint: "Complaint", typeSuggestion: "Suggestion", typeInvitation: "Invitation" }
        };

        function uiLangBucket() {
            if (window.NcsI18n && window.NcsI18n.getLang) {
                var lang = window.NcsI18n.getLang();
                return lang === "zh-Hant" ? "zh" : lang;
            }
            return "zh";
        }
        function ui(key) {
            if (window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) {
                var fromKit = window.NcsI18n.t(key);
                if (fromKit != null && fromKit !== key) return fromKit;
            }
            var bucket = uiLangBucket();
            if (APP_STRINGS[bucket] && APP_STRINGS[bucket][key]) return APP_STRINGS[bucket][key];
            if (bucket !== "en" && APP_STRINGS.en && APP_STRINGS.en[key]) return APP_STRINGS.en[key];
            return (APP_STRINGS.zh && APP_STRINGS.zh[key]) || key;
        }
        function applyUI() {
            document.title = ui("pageTitle");
            var h1 = document.querySelector("h1");
            if (h1) h1.textContent = ui("title");
            var sub = document.getElementById("ui-subtitle");
            if (sub) sub.textContent = ui("subtitle");
            var lab = document.getElementById("ui-select-label");
            if (lab) lab.textContent = ui("selectType");
            var checkBtn = document.getElementById("ui-check-btn");
            if (checkBtn) checkBtn.textContent = ui("checkBtn");
            var resetBtn = document.getElementById("ui-reset-btn");
            if (resetBtn) resetBtn.textContent = ui("resetBtn");
            var copyBtn = document.getElementById("ui-copy-btn");
            if (copyBtn) copyBtn.textContent = ui("copyBtn");
            var sel = document.getElementById("type");
            if (sel && sel.options.length >= 3) {
                sel.options[0].text = ui("typeComplaint");
                sel.options[1].text = ui("typeSuggestion");
                sel.options[2].text = ui("typeInvitation");
            }
        }
        function wireI18n() {
            if (window.NcsI18n && window.NcsI18n.registerStrings) window.NcsI18n.registerStrings(APP_STRINGS);
            applyUI();
            if (window.NcsI18n && window.NcsI18n.onChange) window.NcsI18n.onChange(applyUI);
            document.addEventListener("hksteam-ncs-lang-change", applyUI);
            document.addEventListener("ncs-lang-change", applyUI);
        }
        function whenNcsReady(fn) {
            var tries = 0;
            var timer = setInterval(function () {
                if ((window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) || ++tries > 120) {
                    clearInterval(timer);
                    fn();
                }
            }, 50);
        }

        var TASKS = {
            complaint: {
                brief: "情境：十一月一日，你在啟文電器買了一副耳機，用了兩天，左邊沒有聲音。請把病文改成香港中學投訴信。上款要寫出收信人和敬稱（例如「啟文電器客戶服務部經理台鑒」），不可留空。標題獨立成一行（例如「投訴耳形質素事宜」）。正文說明質素問題和你的要求。下款用「謹啟」。香港中學投訴信不用「此致／敬禮」。說貨品用「質素」，不用「質量」。",
                flawed: "啟文電器：\n\n我買的耳機質量很差，壞了，你們要負責。\n\n請處理。\n\n此致\n敬禮\n\n陳小文"
            },
            suggestion: {
                brief: "情境：學校圖書館的書又舊又少，你寫給校長。上款要有敬稱（例如「校長台鑒」），不可只寫「校長：」。標題獨立成一行，並寫出建議。正文要提到藏書的「質素」，不要用「質量」。下款用「謹啟」。不要用「此致／敬禮」。",
                flawed: "校長：\n\n圖書館的書質量不好，我想建議一下。\n\n請你們改善。\n\n此致\n敬禮\n\n學生"
            },
            invitation: {
                brief: "情境：邀請家長出席家長日。病文把敬稱留空（「誠邀　　出席」「期待　　的蒞臨」），又用了「此致／敬禮」。請補上真正的敬稱，例如上款「各位家長台鑒」，正文「誠邀閣下出席」。下款用「謹啟」。不要留空格代替敬稱。",
                flawed: "各位家長：\n\n家長日邀請\n\n誠邀　　出席本校家長日。\n\n日期：十一月二十日下午二時\n地點：學校禮堂\n\n期待　　的蒞臨。\n\n此致\n敬禮"
            }
        };

        function linesOf(text) {
            return String(text || "").replace(/\r\n/g, "\n").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
        }
        function compact(text) {
            return String(text || "").replace(/\s+/g, "");
        }
        function hasSalutation(text) {
            return linesOf(text).some(function (ln) {
                if (ln.length > 32) return false;
                if (/[\s　]{2,}/.test(ln)) return false;
                return /[\u4e00-\u9fff]{2,}(台鑒|鈞鑒)/.test(ln);
            });
        }
        function hasTitle(text, pattern) {
            return linesOf(text).some(function (ln) {
                return ln.length >= 4 && ln.length <= 22 && pattern.test(ln) && !/[。！？]/.test(ln);
            });
        }
        function push(list, ok, msg) {
            list.push({ ok: ok, msg: msg });
        }
        function commonFormat(text, original, list) {
            if (compact(text) === compact(original)) {
                push(list, false, "你還沒有改動病文。請自己改寫，不要保留原文，也不要等系統生成。");
            } else {
                push(list, true, "已自己改動原文。");
            }
            if (text.indexOf("此致") !== -1 || text.indexOf("敬禮") !== -1) {
                push(list, false, "香港中學這類實用文不用「此致／敬禮」作收結。請刪去。");
            } else {
                push(list, true, "沒有使用「此致／敬禮」。");
            }
            if (text.indexOf("謹啟") === -1) {
                push(list, false, "下款要有「謹啟」。");
            } else {
                push(list, true, "下款有「謹啟」。");
            }
            if (!hasSalutation(text)) {
                push(list, false, "上款不可留空敬稱。要寫出收信人和敬稱，例如「經理台鑒」或「校長台鑒」。");
            } else {
                push(list, true, "上款有收信人和敬稱。");
            }
        }
        function gradeTask(type, text) {
            var task = TASKS[type];
            var list = [];
            commonFormat(text, task.flawed, list);
            if (type === "complaint" || type === "suggestion") {
                if (text.indexOf("質量") !== -1) push(list, false, "不要用「質量」。香港中學寫貨品或事情的好壞，用「質素」。");
                else if (text.indexOf("質素") !== -1) push(list, true, "已用「質素」。");
                else push(list, false, "正文要寫出「質素」，不要只刪詞而不改寫。");
            }
            if (type === "complaint") {
                if (!hasTitle(text, /投訴/)) push(list, false, "標題要獨立成行，例如「投訴耳形質素事宜」，不要寫進長句裡。");
                else push(list, true, "有獨立一行的投訴標題。");
                if (text.indexOf("耳機") === -1) push(list, false, "這封信仍然要針對這副耳機，不要改成別的事。");
                if (!/更換|退款|退回|修理|維修|道歉/.test(text)) push(list, false, "正文要寫明你的要求，例如更換、退款或修理。");
                else push(list, true, "有具體要求。");
            }
            if (type === "suggestion") {
                if (!hasTitle(text, /建議/)) push(list, false, "標題要獨立成行，並包含「建議」。");
                else push(list, true, "有獨立一行的建議標題。");
                if (text.indexOf("圖書館") === -1) push(list, false, "建議仍然要針對圖書館。");
            }
            if (type === "invitation") {
                if (/誠邀[\s　]{2,}|期待[\s　]{2,}|[\s　]{2,}的蒞臨/.test(text)) {
                    push(list, false, "敬稱仍是空格。請寫成「誠邀閣下出席」這類完整說法，不要留空。");
                } else if (!/閣下|台端/.test(text)) {
                    push(list, false, "正文要有真正的敬稱，例如「閣下」或「台端」，不能留空。");
                } else {
                    push(list, true, "敬稱已寫明，沒有留空。");
                }
                if (!hasTitle(text, /邀請|家長日/)) push(list, false, "標題要獨立成行，例如「家長日邀請」。");
                else push(list, true, "有獨立一行的標題。");
                if (text.indexOf("家長日") === -1) push(list, false, "邀請仍然要說明是家長日。");
            }
            return list;
        }

        function loadTask(force) {
            var type = document.getElementById("type").value;
            var task = TASKS[type];
            document.getElementById("brief").textContent = task.brief;
            var box = document.getElementById("draft");
            if (force || !box.dataset.ready) {
                box.value = task.flawed;
                box.dataset.ready = "1";
            } else if (force !== false) {
                box.value = task.flawed;
            }
            document.getElementById("report").innerHTML = "";
        }
        function grade() {
            var type = document.getElementById("type").value;
            var text = document.getElementById("draft").value || "";
            var list = gradeTask(type, text);
            var box = document.getElementById("report");
            box.innerHTML = "";
            var allOk = list.every(function (item) { return item.ok; });
            list.forEach(function (item) {
                var li = document.createElement("li");
                li.className = item.ok ? "ok" : "bad";
                li.textContent = (item.ok ? "通過：" : "仍要改：") + item.msg;
                box.appendChild(li);
            });
            var summary = document.createElement("li");
            summary.className = allOk ? "ok font-bold" : "bad font-bold";
            summary.textContent = allOk ? "格式和用詞已符合這次要求。這是你改出來的，不是系統生成的信。" : "還未完成。請按上面各點自己改，系統不會補上空白信。";
            box.appendChild(summary);
        }
        function copyMine() {
            var text = document.getElementById("draft").value || "";
            if (!text.trim()) {
                alert(ui("emptyCopy"));
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () { alert(ui("copied")); });
            }
        }

        whenNcsReady(function () {
            wireI18n();
            loadTask(true);
        });
    </script>
    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
