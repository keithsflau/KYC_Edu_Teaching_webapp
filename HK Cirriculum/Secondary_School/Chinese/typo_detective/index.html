<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錯別字神探 Typo Detective</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }

        .typo {
            color: #ef4444;
            text-decoration: underline wavy;
            cursor: pointer;
        }

        .typo.found {
            background: #fef3c7;
            color: #92400e;
        }

        .message-bubble {
            background: white;
            border-radius: 20px;
            padding: 12px 16px;
            max-width: 70%;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .bubble-left {
            align-self: flex-start;
            background: #f3f4f6;
        }

        .bubble-right {
            align-self: flex-end;
            background: #dbeafe;
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body class="text-white p-4 min-h-screen">
    <div class="max-w-2xl mx-auto">
        <div class="text-center mb-6">
            <h1 class="text-5xl font-bold mb-2 text-yellow-400">🔍 錯別字神探</h1>
            <p class="text-gray-300">找出對話中的所有錯別字來破案！</p>
        </div>

        <div class="bg-slate-800/50 backdrop-blur rounded-2xl p-6">
            <div class="flex justify-between mb-4">
                <div class="bg-slate-700 px-4 py-2 rounded-lg">
                    <span class="text-sm">案件進度</span>
                    <div class="text-2xl font-bold text-yellow-400"><span id="found">0</span> / <span
                            id="total">0</span></div>
                </div>
                <div class="bg-slate-700 px-4 py-2 rounded-lg">
                    <span class="text-sm">案件</span>
                    <div class="text-2xl font-bold text-cyan-400" id="case-number">1</div>
                </div>
            </div>

            <div id="chat-window"
                class="bg-slate-900/50 rounded-xl p-4 h-96 overflow-y-auto flex flex-col space-y-2 mb-4">
                <!-- Messages will be injected here -->
            </div>

            <button onclick="nextCase()" id="next-btn" disabled
                class="w-full bg-gradient-to-r from-yellow-600 to-orange-600 disabled:from-gray-600 disabled:to-gray-700 disabled:cursor-not-allowed py-3 rounded-xl font-bold transition-all">
                下一案件 Next Case
            </button>
        </div>

        <div id="victory" class="hidden fixed inset-0 flex items-center justify-center bg-black/90 z-50">
            <div class="bg-slate-800 p-12 rounded-2xl text-center max-w-md">
                <div class="text-6xl mb-4">🏆</div>
                <h2 class="text-4xl font-bold mb-4 text-yellow-400">全部破案！</h2>
                <p class="text-gray-300 mb-6">你成功找出所有錯別字，成為頂尖神探！</p>
                <button onclick="location.reload()"
                    class="bg-gradient-to-r from-purple-600 to-pink-600 px-8 py-3 rounded-xl font-bold">重新挑戰</button>
            </div>
        </div>
    </div>

    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
