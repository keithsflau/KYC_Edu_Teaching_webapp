<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錯別字神探 Typo Detective</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }

        .typo {
            color: #ef4444;
            text-decoration: underline wavy;
            cursor: pointer;
        }

        .typo.found {
            background: #fef3c7;
            color: #92400e;
        }

        .message-bubble {
            background: white;
            border-radius: 20px;
            padding: 12px 16px;
            max-width: 70%;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .bubble-left {
            align-self: flex-start;
            background: #f3f4f6;
        }

        .bubble-right {
            align-self: flex-end;
            background: #dbeafe;
        }

        .register-ok {
            background: #dcfce7;
            color: #166534;
            text-decoration: underline dotted;
            cursor: pointer;
            padding: 0 2px;
            border-radius: 4px;
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body class="text-white p-4 min-h-screen">
    <div class="max-w-2xl mx-auto">
        <div class="text-center mb-6">
            <h1 id="ui-title" class="text-5xl font-bold mb-2 text-yellow-400">🔍 錯別字神探</h1>
            <p id="ui-subtitle" class="text-gray-300">先看語體，再點真正的錯字。正確的詞不要改掉。</p>
        </div>

        <div class="bg-slate-800/50 backdrop-blur rounded-2xl p-6">
            <div class="flex justify-between mb-4">
                <div class="bg-slate-700 px-4 py-2 rounded-lg">
                    <span id="ui-progress-label" class="text-sm">案件進度</span>
                    <div class="text-2xl font-bold text-yellow-400"><span id="found">0</span> / <span
                            id="total">0</span></div>
                </div>
                <div class="bg-slate-700 px-4 py-2 rounded-lg">
                    <span id="ui-case-label" class="text-sm">案件</span>
                    <div class="text-2xl font-bold text-cyan-400" id="case-number">1</div>
                </div>
            </div>

            <div id="register-note" class="bg-indigo-950/70 border border-indigo-300/30 rounded-xl p-4 mb-3 text-sm leading-relaxed text-indigo-50"></div>
            <p id="coach" class="text-emerald-200 text-sm mb-3 min-h-[1.25rem]"></p>
            <div id="chat-window"
                class="bg-slate-900/50 rounded-xl p-4 h-96 overflow-y-auto flex flex-col space-y-2 mb-4">
                <!-- Messages will be injected here -->
            </div>

            <button onclick="nextCase()" id="next-btn" disabled
                class="w-full bg-gradient-to-r from-yellow-600 to-orange-600 disabled:from-gray-600 disabled:to-gray-700 disabled:cursor-not-allowed py-3 rounded-xl font-bold transition-all">
                <span id="ui-next-btn">下一案件 Next Case</span>
            </button>
        </div>

        <div id="victory" class="hidden fixed inset-0 flex items-center justify-center bg-black/90 z-50">
            <div class="bg-slate-800 p-12 rounded-2xl text-center max-w-md">
                <div class="text-6xl mb-4">🏆</div>
                <h2 id="ui-victory-title" class="text-4xl font-bold mb-4 text-yellow-400">全部破案！</h2>
                <p id="ui-victory-msg" class="text-gray-300 mb-6">你成功找出所有錯別字，成為頂尖神探！</p>
                <button onclick="location.reload()" id="ui-retry-btn"
                    class="bg-gradient-to-r from-purple-600 to-pink-600 px-8 py-3 rounded-xl font-bold">重新挑戰</button>
            </div>
        </div>
    </div>

    <script>
        var APP_STRINGS = {
            zh: {
                pageTitle: "錯別字神探 Typo Detective",
                title: "🔍 錯別字神探",
                subtitle: "先看語體，再點真正的錯字。正確的詞不要改掉。",
                progressLabel: "案件進度",
                caseLabel: "案件",
                nextBtn: "下一案件 Next Case",
                victoryTitle: "全部破案！",
                victoryMsg: "你成功找出所有錯別字，成為頂尖神探！",
                retryBtn: "重新挑戰"
            },
            en: {
                pageTitle: "Typo Detective",
                title: "🔍 Typo Detective",
                subtitle: "Find all typos in the dialogue to solve the case!",
                progressLabel: "Progress",
                caseLabel: "Case",
                nextBtn: "Next Case",
                victoryTitle: "All cases solved!",
                victoryMsg: "You found every typo — top detective!",
                retryBtn: "Play Again"
            },
            ne: { pageTitle: "Typo Detective", title: "🔍 Typo Detective", subtitle: "Dialogue मा सब typo फेला पार्नुहोस्!", progressLabel: "प्रगति", caseLabel: "केस", nextBtn: "अर्को केस", victoryTitle: "सब केस सolved!", victoryMsg: "तपाईं top detective!", retryBtn: "फेरि" },
            ur: { pageTitle: "Typo Detective", title: "🔍 Typo Detective", subtitle: "Dialogue میں سب typo ڈھونڈیں!", progressLabel: "پیشرفت", caseLabel: "کیس", nextBtn: "اگلا کیس", victoryTitle: "سب کیس حل!", victoryMsg: "آپ top detective!", retryBtn: "دوبارہ" },
            tl: { pageTitle: "Typo Detective", title: "🔍 Typo Detective", subtitle: "Hanapin ang lahat ng typo sa dialogue!", progressLabel: "Progreso", caseLabel: "Kaso", nextBtn: "Susunod", victoryTitle: "Lahat solved!", victoryMsg: "Top detective ka!", retryBtn: "Ulit" },
            hi: { pageTitle: "Typo Detective", title: "🔍 Typo Detective", subtitle: "Dialogue में सब typo ढूँढें!", progressLabel: "प्रगति", caseLabel: "केस", nextBtn: "अगला", victoryTitle: "सब solved!", victoryMsg: "Top detective!", retryBtn: "फिर" }
        };

        function uiLangBucket() {
            if (window.NcsI18n && window.NcsI18n.getLang) {
                var lang = window.NcsI18n.getLang();
                return lang === "zh-Hant" ? "zh" : lang;
            }
            return "zh";
        }
        function ui(key) {
            if (window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) {
                var fromKit = window.NcsI18n.t(key);
                if (fromKit != null && fromKit !== key) return fromKit;
            }
            var bucket = uiLangBucket();
            if (APP_STRINGS[bucket] && APP_STRINGS[bucket][key]) return APP_STRINGS[bucket][key];
            if (bucket !== "en" && APP_STRINGS.en && APP_STRINGS.en[key]) return APP_STRINGS.en[key];
            return (APP_STRINGS.zh && APP_STRINGS.zh[key]) || key;
        }
        function registerAppStrings() {
            if (window.NcsI18n && window.NcsI18n.registerStrings) window.NcsI18n.registerStrings(APP_STRINGS);
        }
        function applyUI() {
            document.title = ui("pageTitle");
            var el;
            el = document.getElementById("ui-title"); if (el) el.textContent = ui("title");
            el = document.getElementById("ui-subtitle"); if (el) el.textContent = ui("subtitle");
            el = document.getElementById("ui-progress-label"); if (el) el.textContent = ui("progressLabel");
            el = document.getElementById("ui-case-label"); if (el) el.textContent = ui("caseLabel");
            el = document.getElementById("ui-next-btn"); if (el) el.textContent = ui("nextBtn");
            el = document.getElementById("ui-victory-title"); if (el) el.textContent = ui("victoryTitle");
            el = document.getElementById("ui-victory-msg"); if (el) el.textContent = ui("victoryMsg");
            el = document.getElementById("ui-retry-btn"); if (el) el.textContent = ui("retryBtn");
        }
        function wireI18n() {
            registerAppStrings();
            applyUI();
            if (window.NcsI18n && window.NcsI18n.onChange) window.NcsI18n.onChange(applyUI);
            document.addEventListener("hksteam-ncs-lang-change", applyUI);
            document.addEventListener("ncs-lang-change", applyUI);
        }
        function whenNcsReady(fn) {
            var tries = 0;
            var timer = setInterval(function () {
                if ((window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) || ++tries > 120) {
                    clearInterval(timer);
                    fn();
                }
            }, 50);
        }

        var CASES_REVISED = [
            {
                id: 1,
                registerNote: "前兩句是粵語口語（「去左」「係咩」）。口語本身不是錯字，不要改成書面語。要改的是錯字：「建力」應作「建立」，「性趣」應作「興趣」，「了燃」應作「了然」。",
                messages: [
                    { sender: "小明", register: "粵語口語", text: "我今日去左圖書館，借左幾本書。", side: "left" },
                    { sender: "小芳", register: "粵語口語", text: "係咩書呀？", side: "right" },
                    { sender: "小明", register: "書面語", text: "有一本關於歷史的，講秦朝統一六國的故事。秦始皇<span class='typo' data-correct='建立'>建力</span>萬里長城。", side: "left" },
                    { sender: "小芳", register: "書面語", text: "哇，聽起來好有趣！我對古代歷史都好有<span class='typo' data-correct='興趣'>性趣</span>。", side: "right" },
                    { sender: "小明", register: "語體夾雜", text: "係呀，而且書入面有好多彩色插圖，令人一目<span class='typo' data-correct='了然'>了燃</span>。", side: "left" }
                ]
            },
            {
                id: 2,
                registerNote: "這是老師的書面通告。「準时」的「时」不是香港書面語用字，應作「時」。「到逹」應作「到達」。「上像」應作「上相」。學生 C 的「我都好期待」帶口語，但要改的仍是錯字，不是把整句改成另一種語體。",
                messages: [
                    { sender: "老師", register: "書面語", text: "同學們，下星期我們要去郊遊，請大家做好準備。", side: "left" },
                    { sender: "學生A", register: "書面語", text: "老師，我們需要帶什麼東西？", side: "right" },
                    { sender: "老師", register: "書面語", text: "要帶水、零食、防曬用品，還要穿合適的鞋，因為要行山。記得要<span class='typo' data-correct='準時'>準时</span>集合。", side: "left" },
                    { sender: "學生B", register: "書面語", text: "明白！我會準時<span class='typo' data-correct='到達'>到逹</span>。", side: "right" },
                    { sender: "學生C", register: "語體夾雜", text: "我都好期待！聽說山頂的風景很優美，到時拍照一定很<span class='typo' data-correct='上相'>上像</span>。", side: "right" }
                ]
            },
            {
                id: 3,
                registerNote: "母子對話是粵語口語。要改的是口語裡的錯字：「計左」應作「計咗」，「唔岩」應作「唔啱」。媽媽引用成語時，「掉以清心」應作「掉以輕心」。不要把粵語正字改成書面語。",
                messages: [
                    { sender: "媽媽", register: "粵語口語", text: "阿仔，你作業做完未？", side: "left" },
                    { sender: "兒子", register: "粵語口語", text: "做緊呀，不過有啲唔識。", side: "right" },
                    { sender: "媽媽", register: "粵語口語", text: "唔識咩？我幫你睇下。", side: "left" },
                    { sender: "兒子", register: "粵語口語", text: "呢題數學題，我<span class='typo' data-correct='計咗'>計左</span>好多次都<span class='typo' data-correct='唔啱'>唔岩</span>。可能係我粗心大意，經常算錯數。", side: "right" },
                    { sender: "媽媽", register: "語體夾雜", text: "等我睇下...你呢度寫錯左符號，應該係加號，唔係減號。你要細心點，唔好再<span class='typo' data-correct='掉以輕心'>掉以清心</span>。", side: "left" }
                ]
            },
            {
                id: 4,
                registerNote: "「休憩」是對的，意思就是休息，不可標成錯字。這句要看的是語體：「我真係冇做過」是粵語口語，緊接的「我當時在家中休憩」是書面語，所以語體夾雜。真正的錯字是「認措」（應作「認錯」）和「犯最」（應作「犯罪」）。",
                messages: [
                    { sender: "警察", register: "書面語", text: "你好，我們懷疑這宗失竊案與你有關。", side: "left" },
                    { sender: "嫌疑人", register: "語體夾雜", text: "我真係冇做過！我當時在家中<span class='register-ok'>休憩</span>。", side: "right" },
                    { sender: "警察", register: "書面語", text: "有證人看見你出現在現場附近。", side: "left" },
                    { sender: "嫌疑人", register: "書面語", text: "那一定是他們<span class='typo' data-correct='認錯'>認措</span>人了！我絕對清白，沒有任何<span class='typo' data-correct='犯罪'>犯最</span>記錄。", side: "right" }
                ]
            }
        ];

        var currentCase = 0;
        var foundCount = 0;
        var totalTypos = 0;

        function loadCase() {
            if (currentCase >= CASES_REVISED.length) {
                document.getElementById("victory").classList.remove("hidden");
                return;
            }
            var caseData = CASES_REVISED[currentCase];
            var chatWindow = document.getElementById("chat-window");
            chatWindow.innerHTML = "";
            foundCount = 0;
            totalTypos = caseData.messages.reduce(function (sum, msg) {
                return sum + (msg.text.match(/class='typo'/g) || []).length;
            }, 0);
            document.getElementById("case-number").textContent = caseData.id;
            document.getElementById("total").textContent = totalTypos;
            document.getElementById("found").textContent = 0;
            document.getElementById("next-btn").disabled = true;
            document.getElementById("register-note").textContent = "語體：" + caseData.registerNote;
            document.getElementById("coach").textContent = "";
            caseData.messages.forEach(function (msg) {
                var bubble = document.createElement("div");
                bubble.className = "message-bubble bubble-" + msg.side;
                bubble.innerHTML = "<div class=\"text-xs text-gray-500 mb-1\">" + msg.sender + " · 語體：" + msg.register + "</div><div class=\"text-gray-800\">" + msg.text + "</div>";
                chatWindow.appendChild(bubble);
            });
            document.querySelectorAll(".register-ok").forEach(function (word) {
                word.addEventListener("click", function () {
                    document.getElementById("coach").textContent = "「休憩」沒有寫錯。書面語裡「休憩」就是休息。不要把它改成別的字；這句要分清的是語體夾雜。";
                });
            });
            document.querySelectorAll(".typo").forEach(function (typo) {
                typo.addEventListener("click", function () {
                    if (!this.classList.contains("found")) {
                        this.classList.add("found");
                        this.textContent = this.dataset.correct;
                        foundCount++;
                        document.getElementById("found").textContent = foundCount;
                        if (foundCount === totalTypos) {
                            document.getElementById("next-btn").disabled = false;
                        }
                    }
                });
            });
        }

        function nextCase() {
            currentCase++;
            loadCase();
        }

        whenNcsReady(function () {
            wireI18n();
            loadCase();
        });
    </script>

    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
