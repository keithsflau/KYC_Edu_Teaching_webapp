<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唐詩數據實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body class="bg-gradient-to-br from-indigo-900 to-purple-900 text-white p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-5xl font-bold text-center mb-8">📊 唐詩數據實驗室</h1>
        <p class="text-center text-sm text-indigo-200/90 mb-6 max-w-3xl mx-auto leading-relaxed">
            圖表數字為<strong>教學示範用示意數據</strong>（並非完整全唐詩語料庫的嚴格統計），用於練習數據可視化與文學風格討論。
        </p>
        <div class="grid md:grid-cols-2 gap-6 mb-6">
            <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-6">
                <h3 class="text-xl font-bold mb-4">詩人風格分析</h3><canvas id="poetChart"></canvas>
            </div>
            <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-6">
                <h3 class="text-xl font-bold mb-4">常見意象分布</h3><canvas id="imageChart"></canvas>
            </div>
        </div>
        <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-6 mb-6">
            <h3 class="text-xl font-bold mb-4">字頻分析</h3><canvas id="wordChart"></canvas>
        </div>
        <div class="bg-slate-700/80 backdrop-blur rounded-2xl p-6">
            <h3 class="text-xl font-bold mb-4">💡 分析結論</h3>
            <ul class="space-y-2 text-gray-300">
                <li>• 李白詩作多用「月」、「酒」等意象，體現浪漫主義風格</li>
                <li>• 杜甫詩作常見「國」、「家」、「民」，反映現實主義關懷</li>
                <li>• 王維詩作多描寫「山」、「水」、「雲」，呈現山水田園風格</li>
                <li>• 在<strong>本示範數據集</strong>中，「月」的示例頻次較高（實際全集中排名會因選篇而異）</li>
            </ul>
        </div>
    </div>
    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
