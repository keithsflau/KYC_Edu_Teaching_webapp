<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>說話技巧模擬器 DELUXE: 辯論逆轉裁判</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #1a202c;
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
            user-select: none;
            color: white;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Screens */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .screen.active {
            display: flex;
        }

        /* Start Screen */
        .bg-start {
            background: linear-gradient(135deg, #1e3a8a 0%, #111827 100%);
        }

        .title-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 4rem;
            background: linear-gradient(to bottom, #facc15, #b45309);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Court Scene */
        .bg-court {
            background: linear-gradient(135deg, #374151 0%, #111827 100%);
            perspective: 1000px;
        }

        .bg-intense {
            background: radial-gradient(circle at center, #7f1d1d 0%, #000000 100%);
            animation: pulseBg 0.5s infinite alternate;
        }

        @keyframes pulseBg {
            from {
                filter: brightness(1);
            }

            to {
                filter: brightness(1.3);
            }
        }

        /* Character */
        #char-container {
            position: absolute;
            bottom: -5vh;
            left: 50%;
            transform: translateX(-50%);
            height: 80vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: all 0.3s;
            z-index: 5;
        }

        .char-emoji {
            font-size: 18rem;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .char-shake {
            animation: shake 0.4s;
        }

        .char-damage {
            animation: flashRed 0.5s;
        }

        @keyframes flashRed {

            0%,
            100% {
                filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5)) hue-rotate(0deg);
                transform: scale(1);
            }

            50% {
                filter: drop-shadow(0 0 30px red) hue-rotate(90deg) grayscale(1);
                transform: scale(0.9);
            }
        }

        /* Dialogue Box */
        .dialogue-box {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35vh;
            background: rgba(0, 0, 0, 0.9);
            border-top: 4px solid #fbbf24;
            padding: 1.5rem 3rem;
            box-sizing: border-box;
            z-index: 20;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.5);
        }

        .speaker-tag {
            background: #fbbf24;
            color: #000;
            padding: 0.2rem 1rem;
            font-weight: 900;
            font-size: 1.2rem;
            align-self: flex-start;
            margin-bottom: 1rem;
            border-radius: 4px;
            transform: skewX(-10deg);
            box-shadow: 3px 3px 0 #b45309;
        }

        .dialogue-text {
            font-size: 1.6rem;
            line-height: 1.6;
            color: #f3f4f6;
            font-family: 'Noto Serif TC', serif;
            white-space: pre-wrap;
        }

        /* Choice UI */
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            width: 80%;
            max-width: 800px;
        }

        .choice-btn {
            background: linear-gradient(90deg, #1e40af, #3b82f6);
            border: 2px solid #60a5fa;
            padding: 1.5rem;
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
            text-align: left;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .choice-btn:hover {
            transform: translateX(10px);
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* HUD - Health Bars */
        .hud-top {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
        }

        .hp-bar-container {
            width: 40%;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 4px;
        }

        .hp-bar {
            height: 20px;
            background: #374151;
            border: 2px solid white;
            position: relative;
        }

        .hp-fill {
            height: 100%;
            transition: width 0.5s ease-out;
        }

        .hp-fill.player {
            background: #22c55e;
        }

        .hp-fill.opponent {
            background: #ef4444;
        }

        /* Timer Bar */
        .timer-container {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 8px;
            background: #374151;
            border-radius: 4px;
            overflow: hidden;
            display: none;
            /* hidden unless making choice */
            z-index: 30;
        }

        .timer-fill {
            height: 100%;
            background: #facc15;
            width: 100%;
            transition: width 1s linear;
        }

        /* Combo Counter */
        .combo-counter {
            position: absolute;
            top: 100px;
            right: 50px;
            text-align: right;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .combo-counter.show {
            opacity: 1;
            transform: scale(1);
        }

        .combo-number {
            font-size: 4rem;
            font-weight: 900;
            color: #facc15;
            text-shadow: 4px 4px 0 #b45309;
            font-style: italic;
        }

        .combo-label {
            font-size: 1.5rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Shout visual */
        .shout-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 100;
        }

        .shout-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 10rem;
            color: #ef4444;
            -webkit-text-stroke: 4px white;
            text-shadow: 10px 10px 0 black;
            font-weight: 900;
            opacity: 0;
            transform: scale(0);
        }

        .shout-anim {
            animation: shoutPop 0.8s forwards;
        }

        @keyframes shoutPop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-10deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.2) rotate(0deg);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                opacity: 0;
                transform: scale(3);
                filter: blur(10px);
            }
        }

        /* Result Screen */
        .rank-grade {
            font-size: 8rem;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 50px rgba(250, 204, 21, 0.5);
            margin-bottom: 1rem;
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body>

    <div id="app">
        <!-- START SCREEN -->
        <div id="start-screen" class="screen bg-start active">
            <h1 class="title-text">辯論逆轉裁判<br><span class="text-3xl text-white">Oral Defense Simulator</span></h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl px-4">
                <!-- Topic Buttons Generated via JS -->
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen bg-court">
            <!-- HUD -->
            <div class="hud-top">
                <div class="hp-bar-container">
                    <div class="text-xs mb-1 text-green-400 font-bold">LOGIC (你)</div>
                    <div class="hp-bar">
                        <div id="hp-width-p" class="hp-fill player" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="hp-bar-container text-right">
                    <div class="text-xs mb-1 text-red-400 font-bold">OPPONENT (對手)</div>
                    <div class="hp-bar">
                        <div id="hp-width-o" class="hp-fill opponent" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div id="timer-bar-container" class="timer-container">
                <div id="timer-fill" class="timer-fill"></div>
            </div>

            <div id="combo-display" class="combo-counter">
                <div class="combo-number" id="combo-num">0</div>
                <div class="combo-label">Combo!</div>
            </div>

            <!-- Scene -->
            <div id="bg-effects" class="absolute inset-0 pointer-events-none"></div>

            <div id="char-container">
                <div id="char-sprite" class="char-emoji">🧑‍⚖️</div>
            </div>

            <!-- Dialogue -->
            <div id="dialogue-panel" class="dialogue-box">
                <div id="speaker-name" class="speaker-tag">SYSTEM</div>
                <div id="dialogue-content" class="dialogue-text">...</div>

                <!-- Next Button Indicator -->
                <div id="next-indicator"
                    class="absolute bottom-4 right-6 animate-bounce text-yellow-400 text-2xl cursor-pointer">
                    ▼ 按此繼續
                </div>
            </div>

            <!-- Choices Overlay (inside game screen to stack properly) -->
            <div id="choice-overlay"
                class="absolute inset-0 bg-black/80 z-40 hidden flex-col items-center justify-center">
                <h2 class="text-3xl font-bold mb-8 text-yellow-400">輪到你反駁了! (Your Turn)</h2>
                <div id="choices-list" class="choice-grid"></div>
            </div>

            <!-- Shout FX -->
            <div class="shout-overlay">
                <div id="shout-text-el" class="shout-text">異議！</div>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen bg-gray-900">
            <h2 class="text-4xl font-bold text-white mb-4">辯論結束</h2>
            <div id="final-grade" class="rank-grade">S</div>
            <div id="final-score" class="text-2xl text-gray-300 mb-8">Score: 0</div>
            <p id="result-msg" class="text-xl text-center max-w-2xl mb-8 px-4">評價...</p>
            <button onclick="location.reload()"
                class="px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded text-xl font-bold transition">返回主選單</button>
        </div>
    </div>

    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
