<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成語四格漫畫大師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        .canvas-container {
            cursor: crosshair;
        }

        .tool-btn.active {
            ring: 2px solid #fbbf24;
            transform: scale(1.1);
        }

        .pattern-bg {
            background-color: #fdfbf7;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

            <div class="text-center">

                <div id="timer" class="text-3xl font-mono font-bold text-red-600">00:00</div>
            </div>
            <button onclick="toggleGameMode()" id="gameBtn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl shadow-lg transition flex items-center gap-2 font-bold">
                <span id="ui-game-btn-text">🎯 開始挑戰</span>

        </div>
    </header>

        function uiLangBucket() {
            if (window.NcsI18n && window.NcsI18n.getLang) {
                var lang = window.NcsI18n.getLang();
                return lang === "zh-Hant" ? "zh" : lang;
            }
            return "zh";
        }

        function ui(key) {
            if (window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) {
                var fromKit = window.NcsI18n.t(key);
                if (fromKit != null && fromKit !== key) return fromKit;
            }
            var bucket = uiLangBucket();
            if (APP_STRINGS[bucket] && APP_STRINGS[bucket][key]) return APP_STRINGS[bucket][key];
            if (bucket !== "en" && APP_STRINGS.en && APP_STRINGS.en[key]) return APP_STRINGS.en[key];
            return (APP_STRINGS.zh && APP_STRINGS.zh[key]) || key;
        }

        function registerAppStrings() {
            if (window.NcsI18n && window.NcsI18n.registerStrings) window.NcsI18n.registerStrings(APP_STRINGS);
        }

        function whenNcsReady(fn) {
            var tries = 0;
            var timer = setInterval(function () {
                if ((window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) || ++tries > 120) {
                    clearInterval(timer);
                    fn();

        const IDIOM_DB = [

            { t: "掩耳盜鈴", m: "自己欺騙自己" },
            { t: "自相矛盾", m: "言行不一致" }

        const STICKERS = [
            "😀", "😂", "😎", "🤔", "😱", "😡", "😭", "😴",
            "👍", "👎", "👋", "🙏", "👀", "🧠", "💡", "❤️",

            "🌳", "🏠", "🚗", "⭐", "🔥", "💧", "💨", "💤"
        ];

        // --- State ---
        let currentTool = 'brush'; // brush, eraser, stamp
        let currentColor = '#000000';
        let currentSize = 3;
        let currentStamp = '';
        let isDrawing = false;
        let activeCanvasIndex = -1;
        let history = [[], [], [], []]; // History for each canvas

        const contexts = [];
        const canvasEls = [];

        // --- Initialization ---
        function init() {
            // Setup Canvases
            for (let i = 1; i <= 4; i++) {
                const c = document.getElementById(`c${i}`);
                canvasEls.push(c);
                const ctx = c.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                contexts.push(ctx);

                // Events
                c.addEventListener('mousedown', startDraw);
                c.addEventListener('mousemove', draw);
                c.addEventListener('mouseup', endDraw);
                c.addEventListener('mouseout', endDraw);

                // Touch support
                c.addEventListener('touchstart', handleTouchStart);
                c.addEventListener('touchmove', handleTouchMove);
                c.addEventListener('touchend', endDraw);

                saveState(i - 1); // Initial state
            }

            // Populate Stickers
            const stickerGrid = document.getElementById('sticker-grid');
            STICKERS.forEach(s => {
                const btn = document.createElement('button');
                btn.textContent = s;
                btn.className = "hover:bg-slate-100 p-1 rounded transition text-center";
                btn.onclick = () => setTool('stamp', s);
                stickerGrid.appendChild(btn);
            });
        }

        // --- Drawing Engine ---
        function getPos(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            let x, y;
            if (e.touches) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }
            // Scale for canvas resolution vs display size
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: x * scaleX, y: y * scaleY };
        }

        function startDraw(e) {
            e.preventDefault();
            const idx = canvasEls.indexOf(e.target);
            activeCanvasIndex = idx;
            const ctx = contexts[idx];
            const pos = getPos(e, e.target);

            if (currentTool === 'stamp') {
                ctx.font = `${currentSize * 10 + 20}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(currentStamp, pos.x, pos.y);
                saveState(idx);
                return;
            }

            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);

            ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
            ctx.lineWidth = currentTool === 'eraser' ? currentSize * 2 : currentSize;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const idx = canvasEls.indexOf(e.target);
            if (idx !== activeCanvasIndex) return;

            const ctx = contexts[idx];
            const pos = getPos(e, e.target);

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function endDraw() {
            if (isDrawing) {
                isDrawing = false;
                contexts[activeCanvasIndex].closePath();
                saveState(activeCanvasIndex);
            }
        }

        function handleTouchStart(e) {
            if (e.target.tagName === 'CANVAS') {
                startDraw(e);
            }
        }

        function handleTouchMove(e) {
            if (e.target.tagName === 'CANVAS') {
                draw(e);
            }
        }

        // --- Tools ---
        function setTool(tool, stampChar = '') {
            currentTool = tool;
            currentStamp = stampChar;

            // UI Updates
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if (tool === 'brush') document.getElementById('btn-brush').classList.add('active');
            if (tool === 'eraser') document.getElementById('btn-eraser').classList.add('active');

            // Cursor
            const cursor = tool === 'stamp' ? 'text' : 'crosshair';
            canvasEls.forEach(c => c.style.cursor = cursor);
        }

        function setColor(c) {
            currentColor = c;
            setTool('brush'); // Switch back to brush when color picked
            document.getElementById('size-indicator').style.backgroundColor = c;
        }

        function setSize(s) {
            currentSize = parseInt(s, 10);
            const indicator = document.getElementById('size-indicator');
            indicator.style.width = s + 'px';
            indicator.style.height = s + 'px';
        }

        function clearCurrentCanvas() {
            if (activeCanvasIndex === -1) activeCanvasIndex = 0;
            if (!confirm(ui("confirmClear"))) return;

            const ctx = contexts[activeCanvasIndex];
            ctx.clearRect(0, 0, canvasEls[activeCanvasIndex].width, canvasEls[activeCanvasIndex].height);
            saveState(activeCanvasIndex);
        }

        // --- History ---
        function saveState(idx) {
            const c = canvasEls[idx];
            if (history[idx].length > 10) history[idx].shift(); // Limit history
            history[idx].push(c.toDataURL());
        }

        function undo() {
            if (activeCanvasIndex === -1) return;
            const h = history[activeCanvasIndex];
            if (h.length <= 1) return; // Keep initial empty state

            h.pop(); // Remove current state
            const prev = h[h.length - 1];

            const img = new Image();
            img.src = prev;
            img.onload = () => {
                const ctx = contexts[activeCanvasIndex];
                ctx.clearRect(0, 0, canvasEls[activeCanvasIndex].width, canvasEls[activeCanvasIndex].height);
                ctx.drawImage(img, 0, 0);
            };
        }

        // --- Game Logic ---
        let timerInterval;
        let seconds = 0;
        let isGameRunning = false;

        function toggleGameMode() {
            if (isGameRunning) {
                stopGame();
            } else {
                startGame();
            }
        }

        function startGame() {
            isGameRunning = true;
            document.getElementById('ui-game-btn-text').textContent = ui("stopTimer");
            document.getElementById('gameBtn').classList.replace('bg-indigo-600', 'bg-red-600');
            document.getElementById('gameBtn').classList.replace('hover:bg-indigo-700', 'hover:bg-red-700');

            nextTopic();

            seconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const min = Math.floor(seconds / 60).toString().padStart(2, '0');
                const sec = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${min}:${sec}`;
            }, 1000);
        }

        function stopGame() {
            isGameRunning = false;
            clearInterval(timerInterval);
            document.getElementById('ui-game-btn-text').textContent = ui("startChallenge");
            document.getElementById('gameBtn').classList.replace('bg-red-600', 'bg-indigo-600');
            document.getElementById('gameBtn').classList.replace('hover:bg-red-700', 'hover:bg-indigo-700');
            alert(ui("gameComplete") + document.getElementById('timer').textContent);
            applyUI();
        }

        function nextTopic() {
            const item = IDIOM_DB[Math.floor(Math.random() * IDIOM_DB.length)];
            document.getElementById('current-idiom').textContent = item.t;
            document.getElementById('current-meaning').textContent = item.m;
            // Visual feedback
            const container = document.getElementById('current-idiom').parentElement;
            container.classList.add('scale-105');
            setTimeout(() => container.classList.remove('scale-105'), 200);
        }

        function downloadComics() {
            // Create a temporary canvas to merge all 4
            const temp = document.createElement('canvas');
            temp.width = 840; // 400 * 2 + padding
            temp.height = 700; // 300 * 2 + padding + title
            const ctx = temp.getContext('2d');

            // Background
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, temp.width, temp.height);

            // Title
            ctx.fillStyle = '#000';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(document.getElementById('current-idiom').textContent, 420, 50);

            // Draw canvases
            const positions = [
                { x: 20, y: 80 }, { x: 420 + 20, y: 80 },
                { x: 20, y: 380 + 20 }, { x: 420 + 20, y: 380 + 20 }
            ];

            canvasEls.forEach((c, i) => {
                ctx.drawImage(c, positions[i].x, positions[i].y);
                // Draw border
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(positions[i].x, positions[i].y, 400, 300);
                // Number
                ctx.fillStyle = '#eee';
                ctx.fillRect(positions[i].x + 10, positions[i].y + 10, 40, 25);
                ctx.fillStyle = '#555';
                ctx.font = '16px Arial';
                ctx.textAlign = 'left';
                const labels = ['起', '承', '轉', '合'];
                ctx.fillText(`${i + 1}. ${labels[i]}`, positions[i].x + 15, positions[i].y + 28);
            });

            // Footer
            ctx.fillStyle = '#888';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`成語四格漫畫大師 - Created with AI`, 420, 680);

            const link = document.createElement('a');
            link.download = `idiom-comic-${Date.now()}.png`;
            link.href = temp.toDataURL();
            link.click();
        }

        whenNcsReady(function () {
            wireI18n();
            init();
        });
    </script>
