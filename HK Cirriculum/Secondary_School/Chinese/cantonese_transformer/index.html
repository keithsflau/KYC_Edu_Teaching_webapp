<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>口語大變身 2.0 (Cantonese Transformer)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Exo 2', 'Noto Sans TC', sans-serif;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        .score-display {
            font-size: 2rem;
            color: #22d3ee;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.8);
            font-weight: 900;
        }

        .lives-display {
            font-size: 2rem;
            color: #ef4444;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
        }

        .ammo-display {
            font-size: 2.5rem;
            color: #facc15;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.8);
            font-weight: 900;
            min-width: 100px;
        }

        .boss-hp-bar-container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ef4444;
            border-radius: 10px;
            display: none;
            overflow: hidden;
        }

        .boss-hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f87171);
            transition: width 0.2s;
        }

        .start-screen,
        .game-over-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: auto;
        }

        .title {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #22d3ee, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
            margin-bottom: 1rem;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.5rem;
            margin-bottom: 3rem;
        }

        .glow-btn {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            color: white;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }

        .glow-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.8);
        }

        .powerup-notif {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 20px rgba(250, 204, 21, 1);
            opacity: 0;
            animation: popup 1.5s ease-out;
        }

        @keyframes popup {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }

            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -200%) scale(1);
            }
        }

        .shake {
            animation: shake 0.3s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-6px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(6px, 0, 0);
            }
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <div id="game-ui">
        <div class="hud-top">
            <div class="ammo-display" id="ammo-display"></div>
            <div class="score-display">SCORE: <span id="score">0</span></div>
            <div class="lives-display" id="lives">❤❤❤</div>
        </div>
        <div class="boss-hp-bar-container" id="boss-hp-container">
            <div class="boss-hp-bar" id="boss-hp"></div>
        </div>
        <div id="powerup-container"></div>
    </div>

    <div id="start-screen" class="start-screen">
        <h1 class="title">口語大變身<br><span style="font-size:2rem;letter-spacing:0.5em;color:white;">TRANSFORMER</span>
        </h1>
        <p class="subtitle">將口語敵人轉化為書面語戰友！</p>
        <button class="glow-btn" onclick="startGame()">MISSION START</button>
        <p class="mt-8 text-slate-400 text-sm">移動: 滑鼠/觸控<br>射擊: 按住 Space (點擊切換書面語子彈)</p>
    </div>

    <div id="game-over-screen" class="game-over-screen hidden" style="display:none;">
        <h1 class="title"
            style="background:linear-gradient(to bottom, #ef4444, #b91c1c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
            MISSION FAILED</h1>
        <div class="text-white text-3xl mb-2 font-bold">FINAL SCORE: <span id="final-score">0</span></div>
        <div class="text-slate-400 mb-8" id="death-reason"></div>
        <button class="glow-btn" onclick="startGame()">RETRY</button>
    </div>

    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
