<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文言文句讀大師</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .char {
            display: inline-block;
            padding: 8px;
            margin: 2px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .char:hover {
            background: #475569;
        }

        .char.marked {
            border-bottom: 3px solid #22d3ee;
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body class="bg-gradient-to-br from-slate-900 to-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 id="ui-title" class="text-5xl font-bold text-center mb-8">📖 文言文句讀大師</h1>
        <div class="bg-slate-800/80 backdrop-blur rounded-2xl p-8 mb-6">
            <h2 id="ui-section-heading" class="text-2xl font-bold mb-4">白文 (無標點)</h2>
            <div id="text-area"
                class="bg-slate-900 rounded-xl p-6 text-3xl font-serif leading-relaxed select-none mb-6 min-h-[120px]">
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                <button onclick="mark('，')"
                    class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold text-xl transition-all hover:scale-105 active:scale-95 border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">，逗號</button>
                <button onclick="mark('。')"
                    class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold text-xl transition-all hover:scale-105 active:scale-95 border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">。句號</button>
                <button onclick="mark('？')"
                    class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold text-xl transition-all hover:scale-105 active:scale-95 border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">？問號</button>
                <button onclick="mark('！')"
                    class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold text-xl transition-all hover:scale-105 active:scale-95 border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">！感嘆</button>
                <button onclick="mark('：')"
                    class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold text-xl transition-all hover:scale-105 active:scale-95 border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">：冒號</button>
                <button onclick="mark('；')"
                    class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold text-xl transition-all hover:scale-105 active:scale-95 border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">；分號</button>
                <button onclick="mark('、')"
                    class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold text-xl transition-all hover:scale-105 active:scale-95 border-b-4 border-slate-900 active:border-b-0 active:translate-y-1">、頓號</button>
                <button onclick="clearMarks()"
                    class="bg-red-900/50 hover:bg-red-800/50 text-red-100 p-4 rounded-xl font-bold text-xl transition-all border-b-4 border-red-950 active:border-b-0 active:translate-y-1">↺
                    清除</button>
            </div>

            <button id="ui-check-btn" onclick="check()"
                class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 py-4 rounded-xl font-bold text-2xl shadow-lg shadow-emerald-900/50 transition-all hover:scale-[1.02] active:scale-[0.98]">
                ✨ 檢查句讀
            </button>
        </div>
        <div id="feedback" class="bg-slate-700/80 backdrop-blur rounded-2xl p-6 hidden"></div>
    </div>
    <script>
        var APP_STRINGS = {
            zh: { pageTitle: "文言文句讀大師", title: "📖 文言文句讀大師", sectionHeading: "白文 (無標點)", checkBtn: "✨ 檢查句讀", selectFirst: "請先點擊要加標點的位置", allDone: "全部完成！你是句讀大師！", correct: "✅ 完全正確！", wrong: "❌ 有誤", yourAnswer: "你的答案：", correctAnswer: "正確答案：" },
            en: { pageTitle: "Classical Punctuation Master", title: "📖 Classical Punctuation Master", sectionHeading: "Raw text (no punctuation)", checkBtn: "✨ Check punctuation", selectFirst: "Click where to add punctuation first", allDone: "All complete! You are a punctuation master!", correct: "✅ Perfect!", wrong: "❌ Incorrect", yourAnswer: "Your answer: ", correctAnswer: "Correct answer: " },
            ne: { pageTitle: "Classical Punctuation Master", title: "📖 Classical Punctuation Master", sectionHeading: "Raw text", checkBtn: "✨ Check", selectFirst: "Click position first", allDone: "All done!", correct: "✅ Correct!", wrong: "❌ Wrong", yourAnswer: "Your: ", correctAnswer: "Correct: " },
            ur: { pageTitle: "Classical Punctuation Master", title: "📖 Classical Punctuation Master", sectionHeading: "Raw text", checkBtn: "✨ Check", selectFirst: "Click position first", allDone: "All done!", correct: "✅ Correct!", wrong: "❌ Wrong", yourAnswer: "Your: ", correctAnswer: "Correct: " },
            tl: { pageTitle: "Classical Punctuation Master", title: "📖 Classical Punctuation Master", sectionHeading: "Raw text", checkBtn: "✨ Check", selectFirst: "Click position first", allDone: "Tapos na!", correct: "✅ Tama!", wrong: "❌ Mali", yourAnswer: "Sagot: ", correctAnswer: "Tamang: " },
            hi: { pageTitle: "Classical Punctuation Master", title: "📖 Classical Punctuation Master", sectionHeading: "Raw text", checkBtn: "✨ Check", selectFirst: "Click position first", allDone: "सब हो गया!", correct: "✅ सही!", wrong: "❌ गलत", yourAnswer: "आपका: ", correctAnswer: "सही: " }
        };
        function uiLangBucket() { if (window.NcsI18n && window.NcsI18n.getLang) { var l = window.NcsI18n.getLang(); return l === "zh-Hant" ? "zh" : l; } return "zh"; }
        function ui(k) { if (window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) { var t = window.NcsI18n.t(k); if (t != null && t !== k) return t; } var b = uiLangBucket(); if (APP_STRINGS[b] && APP_STRINGS[b][k]) return APP_STRINGS[b][k]; if (b !== "en" && APP_STRINGS.en && APP_STRINGS.en[k]) return APP_STRINGS.en[k]; return (APP_STRINGS.zh && APP_STRINGS.zh[k]) || k; }
        function wireI18n() { if (window.NcsI18n && window.NcsI18n.registerStrings) window.NcsI18n.registerStrings(APP_STRINGS); applyUI(); if (window.NcsI18n && window.NcsI18n.onChange) window.NcsI18n.onChange(applyUI); document.addEventListener("hksteam-ncs-lang-change", applyUI); document.addEventListener("ncs-lang-change", applyUI); }
        function applyUI() { document.title = ui("pageTitle"); document.getElementById("ui-title").textContent = ui("title"); document.getElementById("ui-section-heading").textContent = ui("sectionHeading"); document.getElementById("ui-check-btn").textContent = ui("checkBtn"); }
        function whenNcsReady(fn) { var t = 0, timer = setInterval(function () { if ((window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) || ++t > 120) { clearInterval(timer); fn(); } }, 50); }
        var TEXTS = [
            { raw: "學而時習之不亦說乎有朋自遠方來不亦樂乎", correct: "學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？" },
            { raw: "子曰三人行必有我師焉", correct: "子曰：三人行，必有我師焉。" },
            { raw: "溫故而知新可以為師矣", correct: "溫故而知新，可以為師矣。" },
            { raw: "魚我所欲也熊掌亦我所欲也二者不可得兼舍魚而取熊掌者也", correct: "魚，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍魚而取熊掌者也。" },
            { raw: "山不在高有仙則名水不在深有龍則靈", correct: "山不在高，有仙則名。水不在深，有龍則靈。" },
            { raw: "夫戰勇氣也一鼓作氣再而衰三而竭", correct: "夫戰，勇氣也。一鼓作氣，再而衰，三而竭。" },
            { raw: "先天下之憂而憂後天下之樂而樂", correct: "先天下之憂而憂，後天下之樂而樂。" },
            { raw: "親賢臣遠小人此先漢所以興隆也親小人遠賢臣此後漢所以傾頹也", correct: "親賢臣，遠小人，此先漢所以興隆也；親小人，遠賢臣，此後漢所以傾頹也。" }
        ];
        var currentIdx = 0, selectedIdx = -1, userMarks = {};
        function loadText() {
            if (currentIdx >= TEXTS.length) { alert(ui("allDone")); location.reload(); return; }
            var text = TEXTS[currentIdx], area = document.getElementById('text-area');
            area.innerHTML = ''; userMarks = {};
            text.raw.split('').forEach(function (char, i) {
                var span = document.createElement('span');
                span.className = 'char'; span.textContent = char; span.id = 'char-' + i;
                span.onclick = function () { selectedIdx = i; document.querySelectorAll('.char').forEach(function (c) { c.style.background = ''; }); span.style.background = '#1e40af'; };
                area.appendChild(span);
            });
        }
        function mark(punctuation) {
            if (selectedIdx < 0) { alert(ui("selectFirst")); return; }
            userMarks[selectedIdx] = punctuation;
            var charEl = document.getElementById('char-' + selectedIdx);
            charEl.classList.add('marked'); charEl.textContent = charEl.textContent[0] + punctuation;
            selectedIdx = -1; document.querySelectorAll('.char').forEach(function (c) { c.style.background = ''; });
        }
        function clearMarks() { userMarks = {}; loadText(); }
        function check() {
            var text = TEXTS[currentIdx], userText = '';
            text.raw.split('').forEach(function (char, i) { userText += char; if (userMarks[i]) userText += userMarks[i]; });
            var fb = document.getElementById('feedback'); fb.classList.remove('hidden');
            if (userText === text.correct) {
                fb.innerHTML = '<div class="text-3xl font-bold text-green-400 mb-4">' + ui("correct") + '</div><p>' + ui("correctAnswer") + text.correct + '</p>';
                setTimeout(function () { currentIdx++; loadText(); fb.classList.add('hidden'); }, 3000);
            } else {
                fb.innerHTML = '<div class="text-3xl font-bold text-red-400 mb-4">' + ui("wrong") + '</div><p class="mb-2">' + ui("yourAnswer") + userText + '</p><p>' + ui("correctAnswer") + text.correct + '</p>';
            }
        }
        whenNcsReady(function () { wireI18n(); loadText(); });
    </script>
    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
