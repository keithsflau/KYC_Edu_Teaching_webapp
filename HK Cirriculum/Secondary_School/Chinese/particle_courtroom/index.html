<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虛詞法庭</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .evidence-box {
            animation: slideIn 0.5s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body class="bg-gradient-to-br from-red-900 to-orange-900 text-white p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-5xl font-bold text-center mb-6">⚖️ 虛詞法庭</h1>
        <div class="bg-slate-800/90 backdrop-blur rounded-2xl p-6 mb-4">
            <div class="flex items-center gap-4 mb-4">
                <div class="text-6xl">👨‍⚖️</div>
                <div class="flex-1">
                    <h2 class="text-2xl font-bold">案件：<span id="case-title" class="text-yellow-400"></span></h2>
                    <p class="text-gray-300" id="sentence"></p>
                </div>
            </div>
            <div class="bg-slate-900 rounded-xl p-4 mb-4">
                <h3 class="font-bold mb-2">爭議焦點</h3>
                <p class="text-lg">句中的「<span id="particle" class="text-red-400 text-2xl font-bold"></span>」是什麼詞性？</p>
            </div>
            <div id="evidence" class="bg-blue-900/30 rounded-xl p-4 mb-4 hidden evidence-box">
                <h3 class="font-bold mb-2">📜 證據</h3>
                <p id="evidence-text"></p>
            </div>
            <div class="grid grid-cols-3 gap-3" id="options"></div>
        </div>
        <div class="text-center">
            <div class="text-sm text-gray-400">案件進度：<span id="progress">1/5</span></div>
        </div>
    </div>
    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
