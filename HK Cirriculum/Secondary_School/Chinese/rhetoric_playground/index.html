<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修辭遊樂場 3.0 (Neon Rhetoric Carnival)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0f172a;
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation; /* reduce double-tap zoom delay on phones */
        }

        /* Small screens: allow scroll so HUD / cards are not clipped */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                overflow-x: hidden;
                user-select: text;
            }
        }

        /* Neon Glow Texts */
        .neon-text-pink {
            text-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899, 0 0 30px #ec4899;
        }

        .neon-text-blue {
            text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6, 0 0 30px #3b82f6;
        }

        .neon-text-yellow {
            text-shadow: 0 0 10px #eab308, 0 0 20px #eab308;
        }

        /* Animated Background */
        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 200vw;
            height: 200vh;
            background-image:
                linear-gradient(rgba(19, 78, 74, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(19, 78, 74, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: -2;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px);
            }

            100% {
                transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px);
            }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
        }

        /* Hoop Styles */
        .hoop-container {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .hoop-ring {
            width: 18rem;
            height: 18rem;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* Neon Board behind hoop */
        .neon-board {
            position: absolute;
            top: -60px;
            background: #111;
            border: 2px solid #333;
            padding: 10px 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .hoop-active .hoop-ring {
            box-shadow: 0 0 50px currentColor, inset 0 0 30px currentColor;
            border-color: white;
            transform: scale(1.05);
        }

        /* Ball Styles */
        .game-ball {
            width: 16rem;
            height: 16rem;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.1) 20%, transparent 60%),
                linear-gradient(135deg, #ec4899 0%, #be185d 100%);
            box-shadow:
                0 10px 30px -10px rgba(190, 24, 93, 0.5),
                inset -10px -10px 20px rgba(0, 0, 0, 0.4),
                inset 10px 10px 20px rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            cursor: grab;
            position: relative;
            z-index: 50;
            transition: transform 0.1s, box-shadow 0.3s;
            animation: float 6s ease-in-out infinite;
        }

        .game-ball:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .game-ball.correct-anim {
            animation: suckIn 0.5s forwards cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        .game-ball.wrong-anim {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(2deg);
            }
        }

        @keyframes suckIn {
            0% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }

            100% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
            }
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-4px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(8px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-8px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(8px, 0, 0);
            }
        }

        /* Particle effects */
        .particle {
            position: absolute;
            pointer-events: none;
            background: gold;
            border-radius: 50%;
            animation: pop 0.8s ease-out forwards;
        }

        @keyframes pop {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body class="flex flex-col h-screen overflow-hidden">

    <!-- Backgrounds -->
    <div class="cyber-grid"></div>
    <div class="stars"></div>

    <!-- Header -->
    <header
        class="relative z-10 p-6 flex justify-between items-center bg-slate-900/50 backdrop-blur-md border-b border-slate-700/50">
        <div class="flex items-center gap-4">
            <div
                class="w-12 h-12 rounded-xl bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center text-2xl shadow-lg shadow-pink-500/20">
                🎡</div>
            <div>
                <h1 class="text-3xl font-black text-white tracking-widest uppercase font-[Outfit]">Rhetoric <span
                        class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">Carnival</span>
                </h1>
                <p class="text-slate-400 text-xs tracking-wider">修辭遊樂場 v3.0</p>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <div class="bg-slate-800/80 px-6 py-2 rounded-full border border-slate-600 flex items-center gap-3">
                <span class="text-xs text-slate-400 uppercase font-bold">Score</span>
                <span id="score" class="text-2xl font-black text-yellow-400 font-[Outfit]">0</span>
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-grow relative flex flex-col items-center justify-center gap-12 p-8">

        <!-- The Ball Container (Top) -->
        <div class="h-64 flex items-center justify-center w-full relative perspective-1000">
            <div id="glow-bg"
                class="absolute w-64 h-64 bg-pink-500/20 blur-[100px] rounded-full transition-all duration-500"></div>
            <div id="current-ball" draggable="true" class="game-ball">
                <span class="pointer-events-none drop-shadow-md">載入中...</span>
            </div>
        </div>

        <!-- The Hoops (Bottom) -->
        <div class="flex flex-wrap gap-12 md:gap-32 justify-center items-end pb-8">

            <!-- Simile Hoop -->
            <div class="hoop-container group" data-type="simile" id="hoop-simile">
                <div class="flex flex-col items-center relative">
                    <div class="neon-board">
                        <h2 class="text-2xl font-black text-cyan-400 neon-text-blue tracking-widest font-[Outfit]">明喻
                        </h2>
                    </div>
                    <!-- Pole -->
                    <div class="h-16 w-4 bg-slate-800 absolute -top-4 rounded-b-lg"></div>

                    <div
                        class="hoop-ring border-cyan-400/30 text-cyan-500 group-hover:border-cyan-400 group-hover:bg-cyan-900/20">
                        <div class="absolute inset-0 rounded-full border border-cyan-200/20 animate-pulse"></div>
                        <span class="text-6xl filter drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]">✨</span>
                    </div>
                    <div
                        class="mt-4 text-cyan-200/60 text-sm font-medium bg-slate-900/80 px-3 py-1 rounded-full border border-cyan-900">
                        像、如、似...
                    </div>
                </div>
            </div>

            <!-- Metaphor Hoop -->
            <div class="hoop-container group" data-type="metaphor" id="hoop-metaphor">
                <div class="flex flex-col items-center relative">
                    <div class="neon-board">
                        <h2 class="text-2xl font-black text-fuchsia-400 neon-text-pink tracking-widest font-[Outfit]">暗喻
                        </h2>
                    </div>
                    <!-- Pole -->
                    <div class="h-16 w-4 bg-slate-800 absolute -top-4 rounded-b-lg"></div>

                    <div
                        class="hoop-ring border-fuchsia-400/30 text-fuchsia-500 group-hover:border-fuchsia-400 group-hover:bg-fuchsia-900/20">
                        <div class="absolute inset-0 rounded-full border border-fuchsia-200/20 animate-pulse delay-75">
                        </div>
                        <span class="text-6xl filter drop-shadow-[0_0_10px_rgba(232,121,249,0.5)]">🎭</span>
                    </div>
                    <div
                        class="mt-4 text-fuchsia-200/60 text-sm font-medium bg-slate-900/80 px-3 py-1 rounded-full border border-fuchsia-900">
                        說成另一樣事物，沒有像、如
                    </div>
                </div>
            </div>

        </div>
    
    
    </main>

    <!-- Overlay UI for Level Complete -->
    <div id="overlay"
        class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-500">
        <h2
            class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-orange-300 to-yellow-300 neon-text-yellow mb-8 animate-bounce">
            PERFECT!
        </h2>
        <p class="text-white text-xl mb-8">所有題目已完成！</p>
        <button onclick="location.reload()"
            class="px-8 py-4 bg-gradient-to-r from-pink-500 to-violet-600 rounded-2xl text-white font-bold text-lg shadow-2xl hover:scale-105 transition-transform">
            再玩一次
        </button>
    </div>

    <script>
        var APP_STRINGS = {
            zh: {
                pageTitle: "修辭遊樂場 3.0 (Neon Rhetoric Carnival)",
                scoreLabel: "Score", loading: "載入中...",
                simileHint: "像、如、似...", metaphorHint: "說成另一樣事物，沒有像、如",
                overlayTitle: "PERFECT!", overlaySub: "所有題目已完成！",
                overlayBtn: "再玩一次",
                feedbackCorrect: "🎯 投中！+10",
                feedbackWrong: "💥 投錯了！再試一次",
                levelLabel: "第 {n} 題"
            },
            en: {
                pageTitle: "Rhetoric Carnival 3.0",
                scoreLabel: "Score", loading: "Loading...",
                simileHint: "像、如、似 (like, as)...", metaphorHint: "calls it another thing, without 像 or 如",
                overlayTitle: "PERFECT!", overlaySub: "All questions complete!",
                overlayBtn: "Play again",
                feedbackCorrect: "🎯 Score! +10",
                feedbackWrong: "💥 Miss! Try again",
                levelLabel: "Question {n}"
            },
            ne: { pageTitle: "Rhetoric Carnival 3.0", scoreLabel: "Score", loading: "...", simileHint: "像、如、似...", metaphorHint: "另一樣事物，沒有像、如", overlayTitle: "PERFECT!", overlaySub: "सबै पूरा!", overlayBtn: "फेरि", feedbackCorrect: "🎯 +10", feedbackWrong: "💥 फेरि", levelLabel: "प्रश्न {n}" },
            ur: { pageTitle: "Rhetoric Carnival 3.0", scoreLabel: "Score", loading: "...", simileHint: "像、如、似...", metaphorHint: "另一樣事物，沒有像、如", overlayTitle: "PERFECT!", overlaySub: "سب مکمل!", overlayBtn: "دوبارہ", feedbackCorrect: "🎯 +10", feedbackWrong: "💥 دوبارہ", levelLabel: "سوال {n}" },
            tl: { pageTitle: "Rhetoric Carnival 3.0", scoreLabel: "Score", loading: "...", simileHint: "像、如、似...", metaphorHint: "另一樣事物，沒有像、如", overlayTitle: "PERFECT!", overlaySub: "Tapos na lahat!", overlayBtn: "Ulit", feedbackCorrect: "🎯 +10", feedbackWrong: "💥 Subukan muli", levelLabel: "Tanong {n}" },
            hi: { pageTitle: "Rhetoric Carnival 3.0", scoreLabel: "Score", loading: "...", simileHint: "像、如、似...", metaphorHint: "另一樣事物，沒有像、如", overlayTitle: "PERFECT!", overlaySub: "सब पूरा!", overlayBtn: "फिर", feedbackCorrect: "🎯 +10", feedbackWrong: "💥 फिर", levelLabel: "प्रश्न {n}" }
        };

        function uiLangBucket() {
            if (window.NcsI18n && window.NcsI18n.getLang) {
                var lang = window.NcsI18n.getLang();
                return lang === "zh-Hant" ? "zh" : lang;
            }
            return "zh";
        }
        function ui(key) {
            if (window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) {
                var fromKit = window.NcsI18n.t(key);
                if (fromKit != null && fromKit !== key) return fromKit;
            }
            var bucket = uiLangBucket();
            if (APP_STRINGS[bucket] && APP_STRINGS[bucket][key]) return APP_STRINGS[bucket][key];
            if (bucket !== "en" && APP_STRINGS.en && APP_STRINGS.en[key]) return APP_STRINGS.en[key];
            return (APP_STRINGS.zh && APP_STRINGS.zh[key]) || key;
        }
        function registerAppStrings() {
            if (window.NcsI18n && window.NcsI18n.registerStrings) window.NcsI18n.registerStrings(APP_STRINGS);
        }
        function applyUI() {
            document.title = ui("pageTitle");
            document.querySelector("header .text-xs").textContent = ui("levelLabel").replace("{n}", String(game.index + 1));
            var ov = document.getElementById("overlay");
            if (ov) {
                ov.querySelector("h2").textContent = ui("overlayTitle");
                ov.querySelector("p").textContent = ui("overlaySub");
                ov.querySelector("button").textContent = ui("overlayBtn");
            }
        }
        function wireI18n() {
            registerAppStrings();
            applyUI();
            if (window.NcsI18n && window.NcsI18n.onChange) window.NcsI18n.onChange(applyUI);
            document.addEventListener("hksteam-ncs-lang-change", applyUI);
            document.addEventListener("ncs-lang-change", applyUI);
        }

        var QUESTIONS = [
            { text: "月亮像一個大圓盤", type: "simile" },
            { text: "他的臉紅得像蘋果", type: "simile" },
            { text: "時間如流水般逝去", type: "simile" },
            { text: "她的聲音似銀鈴般清脆", type: "simile" },
            { text: "生活像一盒巧克力", type: "simile" },
            { text: "母親是避風港", type: "metaphor" },
            { text: "這孩子是隻停不住的小麻雀", type: "metaphor" },
            { text: "希望是黑暗中的燈塔", type: "metaphor" },
            { text: "人生是一場馬拉松", type: "metaphor" },
            { text: "書本是知識的寶庫", type: "metaphor" },
            { text: "微風如同溫柔的手", type: "simile" },
            { text: "友誼是一座橋樑", type: "metaphor" },
            { text: "他跑得像一陣風", type: "simile" },
            { text: "童年是一幅美麗的畫", type: "metaphor" },
            { text: "雲朵好像棉花糖", type: "simile" }
        ];

        var game = { index: 0, score: 0, dragging: false };

        function shuffleQ() {
            for (var i = QUESTIONS.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = QUESTIONS[i]; QUESTIONS[i] = QUESTIONS[j]; QUESTIONS[j] = t;
            }
        }

        function loadQuestion() {
            if (game.index >= QUESTIONS.length) {
                var ov = document.getElementById("overlay");
                ov.classList.remove("hidden");
                setTimeout(function () { ov.classList.remove("opacity-0"); }, 50);
                return;
            }
            var q = QUESTIONS[game.index];
            var ball = document.getElementById("current-ball");
            ball.classList.remove("correct-anim", "wrong-anim");
            ball.querySelector("span").textContent = q.text;
            ball.style.opacity = "1";
            ball.style.transform = "";
            document.querySelector("header .text-xs").textContent =
                ui("levelLabel").replace("{n}", String(game.index + 1));
        }

        function spawnParticles(x, y) {
            for (var i = 0; i < 12; i++) {
                var p = document.createElement("div");
                p.className = "particle";
                p.style.left = x + "px";
                p.style.top = y + "px";
                p.style.width = p.style.height = (4 + Math.random() * 6) + "px";
                p.style.setProperty("--dx", (Math.random() - 0.5) * 120 + "px");
                p.style.setProperty("--dy", (Math.random() - 0.5) * 120 + "px");
                document.body.appendChild(p);
                setTimeout(function (el) { el.remove(); }, 800, p);
            }
        }

        function showToast(msg, ok) {
            var t = document.createElement("div");
            t.textContent = msg;
            t.style.cssText = "position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 24px;border-radius:12px;font-weight:700;color:#fff;background:" + (ok ? "#10b981" : "#ef4444") + ";box-shadow:0 8px 24px rgba(0,0,0,0.3);";
            document.body.appendChild(t);
            setTimeout(function () { t.remove(); }, 1200);
        }

        function handleDrop(type) {
            if (game.index >= QUESTIONS.length) return;
            var q = QUESTIONS[game.index];
            var ball = document.getElementById("current-ball");
            if (q.type === type) {
                game.score += 10;
                document.getElementById("score").textContent = game.score;
                ball.classList.add("correct-anim");
                showToast(ui("feedbackCorrect"), true);
                var hoop = document.getElementById("hoop-" + type);
                var rect = hoop.getBoundingClientRect();
                spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
                game.index += 1;
                setTimeout(loadQuestion, 600);
            } else {
                ball.classList.add("wrong-anim");
                showToast(ui("feedbackWrong"), false);
                setTimeout(function () { ball.classList.remove("wrong-anim"); }, 500);
            }
        }

        function setupDragDrop() {
            var ball = document.getElementById("current-ball");
            ball.addEventListener("dragstart", function (e) {
                game.dragging = true;
                e.dataTransfer.setData("text/plain", "ball");
            });
            ball.addEventListener("dragend", function () { game.dragging = false; });

            ["simile", "metaphor"].forEach(function (type) {
                var hoop = document.getElementById("hoop-" + type);
                hoop.addEventListener("dragover", function (e) {
                    e.preventDefault();
                    hoop.classList.add("hoop-active");
                });
                hoop.addEventListener("dragleave", function () {
                    hoop.classList.remove("hoop-active");
                });
                hoop.addEventListener("drop", function (e) {
                    e.preventDefault();
                    hoop.classList.remove("hoop-active");
                    handleDrop(type);
                });
                hoop.addEventListener("click", function () {
                    if (!game.dragging) handleDrop(type);
                });
            });

            ball.addEventListener("click", function () {
                showToast("拖放或點擊圓環！", false);
            });
        }

        function whenNcsReady(fn) {
            var tries = 0;
            var timer = setInterval(function () {
                if ((window.NcsI18n && window.NcsI18n.isInitialized && window.NcsI18n.isInitialized()) || ++tries > 120) {
                    clearInterval(timer);
                    fn();
                }
            }, 50);
        }

        whenNcsReady(function () {
            wireI18n();
            shuffleQ();
            loadQuestion();
            setupDragDrop();
        });
    </script>

    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
