<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古文翻譯拼圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .word-box {
            cursor: grab;
            transition: all 0.2s;
        }

        .word-box:hover {
            transform: scale(1.05);
        }
    </style>
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
  <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>

<body class="bg-gradient-to-br from-amber-900 to-yellow-900 text-white p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-5xl font-bold text-center mb-8">📜 古文翻譯拼圖</h1>
        <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-slate-800/50 backdrop-blur rounded-2xl p-6">
                <h2 class="text-2xl font-bold mb-4 text-amber-300">文言文</h2>
                <p class="text-2xl leading-relaxed font-serif" id="classical"></p>
            </div>
            <div class="bg-slate-800/50 backdrop-blur rounded-2xl p-6">
                <h2 class="text-2xl font-bold mb-4 text-green-300">白話文 (請排序)</h2>
                <div id="translation-area"
                    class="min-h-[200px] border-2 border-dashed border-green-400 rounded-xl p-4 flex flex-wrap gap-2 content-start">
                </div>
            </div>
        </div>
        <div class="bg-slate-700/50 backdrop-blur rounded-2xl p-6 mt-6">
            <h3 class="text-xl font-bold mb-4">詞彙庫</h3>
            <div id="word-bank" class="flex flex-wrap gap-3"></div>
        </div><button onclick="check()"
            class="w-full max-w-md mx-auto block bg-gradient-to-r from-green-600 to-emerald-600 py-4 rounded-xl font-bold text-xl mt-6">檢查翻譯</button>
        <div id="feedback" class="text-center text-2xl font-bold mt-4"></div>
    </div>
    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>

</html>
