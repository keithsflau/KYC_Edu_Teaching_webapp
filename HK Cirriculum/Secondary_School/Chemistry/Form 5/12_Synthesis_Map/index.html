<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>有機合成路線圖 | Synthesis map</title>
  <link rel="stylesheet" href="../../lesson.css" />
  <style>
    #choices { flex-direction: column; align-items: stretch; }
    #choices button { text-align: left; }
  </style>
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>沿官能基箭嘴讀出產物類別。</li>
      <li>分辨伯醇與仲醇的氧化產物。</li>
      <li>分辨水解、加成和縮合在路線圖上的產物。</li>
    </ul>
    <p id="chem-feedback" role="status">按路線圖選出產物的官能基。</p>
  </section>
  <main>
    <div class="panel">
      <h1>有機合成路線圖</h1>
      <p class="muted">箭嘴只標官能基類別：伯醇 → 醛 → 羧酸；仲醇 → 酮；鹵代烷經水解 → 醇；烯烴加成 HX → 鹵代烷；羧酸與醇縮合 → 酯。沒有試劑用量，也沒有製備步驟。</p>
      <p id="q" style="font-size:1.15rem;font-weight:700">讀取題目。</p>
      <div class="row" id="choices"></div>
      <div class="row">
        <button type="button" class="alt" id="next">下一題</button>
      </div>
      <p class="muted" id="score">分數 0 / 0</p>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var items = [
      {
        q: "乙醇是伯醇。路線圖上第一條氧化箭嘴的產物官能基是？",
        choices: [
          { label: "醛", ok: true, why: "伯醇氧化先得到醛。醛仍可再氧化成羧酸，所以第一個產物是醛。" },
          { label: "酮", ok: false, why: "酮是仲醇氧化的產物。乙醇接有羥基的碳上有兩個氫，氧化後得到的是醛。" },
          { label: "羧酸", ok: false, why: "羧酸是醛再氧化的結果。由伯醇出發的第一條氧化箭嘴停在醛。" },
          { label: "烯烴", ok: false, why: "變成烯烴是消去箭嘴。氧化箭嘴提高的是含氧官能基的氧化程度。" }
        ]
      },
      {
        q: "丙-2-醇是仲醇。沿氧化箭嘴得到的官能基是？",
        choices: [
          { label: "酮", ok: true, why: "仲醇氧化得到酮。酮的羰基碳上沒有氫，這張路線圖不把酮再畫成羧酸。" },
          { label: "醛", ok: false, why: "醛來自伯醇。丙-2-醇的羥基碳上只有一個氫，氧化產物是酮。" },
          { label: "羧酸", ok: false, why: "羧酸來自醛的進一步氧化。仲醇這一步的產物是酮。" },
          { label: "醚", ok: false, why: "醚沒有羰基。氧化仲醇是把 CHOH 變成羰基，產物是酮。" }
        ]
      },
      {
        q: "氯乙烷沿水解箭嘴，產物官能基是？",
        choices: [
          { label: "醇", ok: true, why: "水解箭嘴把鹵素換成羥基，鹵代烷變成醇。這裡只記產物類別。" },
          { label: "醛", ok: false, why: "醛來自醇的氧化，不是鹵代烷水解箭嘴的直接產物。" },
          { label: "胺", ok: false, why: "胺要在反應物中引入氮。水解箭嘴沒有加入氮，產物是醇。" },
          { label: "烯烴", ok: false, why: "烯烴來自消去箭嘴。水解箭嘴把鹵素換成羥基，產物是醇。" }
        ]
      },
      {
        q: "乙烯沿「加成 HX」箭嘴，產物官能基是？",
        choices: [
          { label: "鹵代烷", ok: true, why: "加成 HX 時雙鍵打開，產物是鹵代烷。加水加成才得到醇。此頁只記類別。" },
          { label: "醇", ok: false, why: "醇是烯烴加水加成的產物。加成 HX 時接上的是鹵素，產物是鹵代烷。" },
          { label: "羧酸", ok: false, why: "羧酸比烯烴多了羧基。加成 HX 這一步的產物是鹵代烷。" },
          { label: "酮", ok: false, why: "酮來自仲醇氧化。加成 HX 只把雙鍵變成鹵代烷。" }
        ]
      },
      {
        q: "乙酸與乙醇沿縮合箭嘴，產物官能基是？",
        choices: [
          { label: "酯", ok: true, why: "羧酸與醇縮合，產物含酯基。這頁只標官能基，沒有用量或製備步驟。" },
          { label: "醚", ok: false, why: "醚的氧兩邊都是碳，沒有羰基。羧酸與醇縮合保留羰基，產物是酯。" },
          { label: "酰胺", ok: false, why: "酰胺含氮。這條箭嘴的反應物是羧酸和醇，沒有氮，產物是酯。" },
          { label: "醛", ok: false, why: "醛是醇氧化的產物。羧酸與醇縮合得到的是酯。" }
        ]
      }
    ];
    var i = 0;
    var score = 0;
    var tried = 0;
    var locked = false;
    var qEl = document.getElementById("q");
    var box = document.getElementById("choices");
    var scoreEl = document.getElementById("score");

    function render() {
      var item = items[i];
      qEl.textContent = "第 " + (i + 1) + " / " + items.length + " 題：" + item.q;
      box.textContent = "";
      item.choices.forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "alt";
        b.textContent = c.label;
        b.onclick = function () {
          if (locked) {
            ChemLesson.say("這一題已作答，請按下一題。");
            return;
          }
          locked = true;
          tried += 1;
          if (c.ok) score += 1;
          scoreEl.textContent = "分數 " + score + " / " + tried;
          ChemLesson.say(c.why, c.ok ? "ok" : "no");
        };
        box.appendChild(b);
      });
    }

    document.getElementById("next").onclick = function () {
      locked = false;
      i = (i + 1) % items.length;
      render();
      ChemLesson.say("換一題。先選官能基。");
    };
    render();
  </script>
  <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
