<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kc 與 Kp | Equilibrium constants</title>
  <link rel="stylesheet" href="../../lesson.css" />
  <style>
    #choices { flex-direction: column; align-items: stretch; }
    #choices button { text-align: left; }
  </style>
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>用氣態物質的係數計算 Δn。</li>
      <li>寫出 Kp = Kc (RT)^Δn。</li>
      <li>知道溫度不變時，Kc 和 Kp 不隨壓力改變。</li>
    </ul>
    <p id="chem-feedback" role="status">先選出 Kp 與 Kc 的關係。</p>
  </section>
  <main>
    <div class="panel">
      <h1>Kc 與 Kp</h1>
      <p class="muted">Δn = 氣態產物係數和 − 氣態反應物係數和。Kp = Kc (RT)^Δn。純固體和純液體不計入 Δn。</p>
      <p id="q" style="font-size:1.15rem;font-weight:700">讀取題目。</p>
      <div class="row" id="choices"></div>
      <div class="row">
        <button type="button" class="alt" id="next">下一題</button>
      </div>
      <p class="muted" id="score">分數 0 / 0</p>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var items = [
      {
        q: "H₂(g) + I₂(g) ⇌ 2HI(g)。Kp 和 Kc 的關係是？",
        choices: [
          { label: "Kp = Kc", ok: true, why: "氣態產物係數和是 2，氣態反應物係數和是 1+1=2，Δn = 0。(RT)^0 = 1，所以 Kp = Kc。" },
          { label: "Kp = Kc (RT)", ok: false, why: "Kp = Kc (RT) 代表 Δn = +1。這條反應兩邊氣體係數和都是 2，Δn = 2−2 = 0，所以 Kp = Kc，不必乘 RT。" },
          { label: "Kp = Kc (RT)^(-2)", ok: false, why: "(RT)^(-2) 代表 Δn = −2，例如合成氨。生成碘化氫時兩邊氣體係數和相同，Δn = 0，Kp = Kc。" }
        ]
      },
      {
        q: "N₂(g) + 3H₂(g) ⇌ 2NH₃(g)。Kp 和 Kc 的關係是？",
        choices: [
          { label: "Kp = Kc (RT)^(-2)", ok: true, why: "氣態產物係數和是 2，氣態反應物係數和是 4，Δn = 2−4 = −2。所以 Kp = Kc (RT)^(-2)。" },
          { label: "Kp = Kc", ok: false, why: "只有 Δn = 0 時 Kp 才等於 Kc。這裡氣體由 4 mol 變為 2 mol，Δn = −2，要乘 (RT)^(-2)。" },
          { label: "Kp = Kc (RT)^2", ok: false, why: "指數是 Δn，Δn = 產物減反應物 = 2−4 = −2。指數是 −2，乘上的是 (RT)^(-2)。" }
        ]
      },
      {
        q: "CaCO₃(s) ⇌ CaO(s) + CO₂(g)。Kp 和 Kc 的關係是？",
        choices: [
          { label: "Kp = Kc (RT)", ok: true, why: "純固體不寫進 K，也不計入 Δn。只有 CO₂ 是氣體，Δn = 1−0 = 1，所以 Kp = Kc (RT)。" },
          { label: "Kp = Kc", ok: false, why: "Δn 不是 0。碳酸鈣和氧化鈣是純固體，不計係數；氣體只有 CO₂，Δn = 1，所以要乘 RT。" },
          { label: "Kp = Kc (RT)^(-2)", ok: false, why: "Δn 只數氣體。兩邊固體都不計，氣體由 0 變為 1，Δn = +1，關係是 Kp = Kc (RT)。" }
        ]
      },
      {
        q: "溫度不變，只把總壓增大。Kc 和 Kp 會怎樣？",
        choices: [
          { label: "Kc 和 Kp 都不變", ok: true, why: "平衡常數隨溫度改變。溫度不變時，增大壓力只改變平衡位置，Kc 和 Kp 的數值維持不變。" },
          { label: "只有 Kp 變大", ok: false, why: "壓力改變各成分的量，直到反應商再次等於 K。溫度不變，Kp 不會因為加壓而變大。" },
          { label: "Kc 和 Kp 都變小", ok: false, why: "加壓可能令平衡向氣體摩爾數較少的一邊移動，那是位置改變。溫度不變時，Kc 和 Kp 的數值不變。" }
        ]
      }
    ];
    var i = 0;
    var score = 0;
    var tried = 0;
    var locked = false;
    var qEl = document.getElementById("q");
    var box = document.getElementById("choices");
    var scoreEl = document.getElementById("score");

    function render() {
      var item = items[i];
      qEl.textContent = "第 " + (i + 1) + " / " + items.length + " 題：" + item.q;
      box.textContent = "";
      item.choices.forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "alt";
        b.textContent = c.label;
        b.onclick = function () {
          if (locked) {
            ChemLesson.say("這一題已作答，請按下一題。");
            return;
          }
          locked = true;
          tried += 1;
          if (c.ok) score += 1;
          scoreEl.textContent = "分數 " + score + " / " + tried;
          ChemLesson.say(c.why, c.ok ? "ok" : "no");
        };
        box.appendChild(b);
      });
    }

    document.getElementById("next").onclick = function () {
      locked = false;
      i = (i + 1) % items.length;
      render();
      ChemLesson.say("換一題。先選答案。");
    };
    render();
  </script>
  <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
