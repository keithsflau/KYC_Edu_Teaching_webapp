<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>酰胺水解 | Amide hydrolysis</title>
  <link rel="stylesheet" href="../../lesson.css" />
  <style>
    #choices { flex-direction: column; align-items: stretch; }
    #choices button { text-align: left; }
  </style>
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>分辨酸性水解與鹼性水解的產物類別。</li>
      <li>說明酰胺為何通常比酯難水解。</li>
      <li>指出蛋白質的肽鍵是酰胺鍵。</li>
    </ul>
    <p id="chem-feedback" role="status">選出產物類別或鍵的特點。</p>
  </section>
  <main>
    <div class="panel">
      <h1>酰胺水解</h1>
      <p class="muted">乙酰胺在酸中水解得到羧酸和銨鹽；在鹼中水解得到羧酸鹽和氨。只判斷產物類別。沒有濃度、溫度或水解步驟。</p>
      <p id="q" style="font-size:1.15rem;font-weight:700">讀取題目。</p>
      <div class="row" id="choices"></div>
      <div class="row">
        <button type="button" class="alt" id="next">下一題</button>
      </div>
      <p class="muted" id="score">分數 0 / 0</p>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var items = [
      {
        q: "乙酰胺在酸性條件下水解，主要產物是哪一組？",
        choices: [
          { label: "羧酸 + 銨鹽", ok: true, why: "酸性水解把酰胺變成羧酸。含氮部分被酸質子化，以銨鹽形式存在。" },
          { label: "羧酸 + 游離氨", ok: false, why: "游離氨是鹼性水解的含氮產物。在酸裡氨會變成銨鹽，不能維持游離。" },
          { label: "羧酸鹽 + 游離氨", ok: false, why: "羧酸鹽加游離氨是鹼性水解的組合。酸性條件下得到的是羧酸和銨鹽。" },
          { label: "酯 + 氨", ok: false, why: "水解斷開的是酰胺的 C–N 鍵，碳產物仍是羧酸級別，不會生成酯。" }
        ]
      },
      {
        q: "乙酰胺在鹼性條件下水解，主要產物是哪一組？",
        choices: [
          { label: "羧酸鹽 + 氨", ok: true, why: "鹼把羧酸變成羧酸鹽，含氮部分以氨的形式離開。這是鹼性水解的產物類別。" },
          { label: "羧酸 + 銨鹽", ok: false, why: "羧酸加銨鹽是酸性水解。鹼性條件下羧酸會變成羧酸鹽，氨不會留在銨鹽。" },
          { label: "醛 + 氨", ok: false, why: "水解沒有把羰基還原成醛。碳仍是羧酸級別，在鹼裡以羧酸鹽存在。" },
          { label: "醇 + 氨", ok: false, why: "醇不是酰胺水解的碳產物。羰基仍在，鹼性水解得到羧酸鹽和氨。" }
        ]
      },
      {
        q: "為什麼酰胺通常比酯更難水解？",
        choices: [
          { label: "氮的孤電子對與羰基共振，羰基碳較不親電", ok: true, why: "共振使酰胺的 C–N 帶有部分雙鍵性質，羰基碳較不親電，所以比酯難水解。這裡只解釋活性。" },
          { label: "酰胺的羰基碳更親電，所以更快水解", ok: false, why: "氮比酯裡的氧更願意把孤電子對給羰基，羰基碳較不親電。酰胺水解比酯慢。" },
          { label: "酰胺完全不能水解", ok: false, why: "酰胺可以水解，只是通常比酯慢。活性較低仍會生成羧酸級別的產物和含氮產物。" }
        ]
      },
      {
        q: "蛋白質主鏈上的肽鍵屬於哪一種鍵？水解後的單體是？",
        choices: [
          { label: "酰胺鍵，水解得到氨基酸", ok: true, why: "肽鍵是氨基酸之間的 –CO–NH–，屬於酰胺鍵。鍵打開後得到氨基酸。" },
          { label: "酯鍵，水解得到醇和羧酸", ok: false, why: "酯鍵沒有氮。肽鍵的羰基碳連著 NH，是酰胺鍵，單體是氨基酸。" },
          { label: "醚鍵，水解得到兩分子醇", ok: false, why: "醚鍵是 C–O–C。蛋白質主鏈重複的是酰胺鍵 –CO–NH–，水解得到氨基酸。" }
        ]
      }
    ];
    var i = 0;
    var score = 0;
    var tried = 0;
    var locked = false;
    var qEl = document.getElementById("q");
    var box = document.getElementById("choices");
    var scoreEl = document.getElementById("score");

    function render() {
      var item = items[i];
      qEl.textContent = "第 " + (i + 1) + " / " + items.length + " 題：" + item.q;
      box.textContent = "";
      item.choices.forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "alt";
        b.textContent = c.label;
        b.onclick = function () {
          if (locked) {
            ChemLesson.say("這一題已作答，請按下一題。");
            return;
          }
          locked = true;
          tried += 1;
          if (c.ok) score += 1;
          scoreEl.textContent = "分數 " + score + " / " + tried;
          ChemLesson.say(c.why, c.ok ? "ok" : "no");
        };
        box.appendChild(b);
      });
    }

    document.getElementById("next").onclick = function () {
      locked = false;
      i = (i + 1) % items.length;
      render();
      ChemLesson.say("換一題。先選答案。");
    };
    render();
  </script>
  <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
