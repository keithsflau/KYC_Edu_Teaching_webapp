<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>速率方程 | Rate equation</title>
  <script src="../../chem-model.js"></script>
  <link rel="stylesheet" href="../../lesson.css" />
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>分辨 0、1、2 級。</li>
      <li>濃度加倍時速率變成 2ⁿ 倍。</li>
      <li>從圖讀出速率如何隨濃度改變。</li>
    </ul>
    <p id="chem-feedback" role="status">選級數，再調濃度和 k。</p>
  </section>
  <main>
    <div class="panel">
      <h1>速率方程</h1>
      <canvas id="plot" width="640" height="280" aria-label="速率對濃度"></canvas>
      <div class="row" id="orders"></div>
      <label for="conc">[A] = <span id="conc-v">1.0</span> mol/dm³</label>
      <input id="conc" type="range" min="0.2" max="2" step="0.1" value="1" />
      <label for="k">k = <span id="k-v">2</span>（單位隨級數變）</label>
      <input id="k" type="range" min="0.5" max="4" step="0.5" value="2" />
      <p class="num" id="out"></p>
      <button type="button" id="double">把濃度加倍並比較</button>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var order = 1;
    var conc = document.getElementById("conc");
    var kEl = document.getElementById("k");
    var canvas = document.getElementById("plot");
    var ctx = canvas.getContext("2d");
    [0, 1, 2].forEach(function (n) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = n + " 級";
      b.className = n === 1 ? "on" : "alt";
      b.onclick = function () {
        order = n;
        document.querySelectorAll("#orders button").forEach(function (x) { x.className = "alt"; });
        b.className = "on";
        paint();
        ChemLesson.say(n + " 級：濃度加倍時速率 × " + Math.pow(2, n) + "。");
      };
      document.getElementById("orders").appendChild(b);
    });
    function paint() {
      var c = Number(conc.value);
      var k = Number(kEl.value);
      document.getElementById("conc-v").textContent = c.toFixed(1);
      document.getElementById("k-v").textContent = String(k);
      var rate = ChemModel.rateLaw(k, c, order);
      document.getElementById("out").textContent = "速率 = " + rate.toFixed(3);
      var w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "#34d399";
      ctx.lineWidth = 2;
      ctx.beginPath();
      var maxR = ChemModel.rateLaw(k, 2, order) || 1;
      for (var x = 0; x <= 40; x++) {
        var cc = 0.05 + (1.95 * x) / 40;
        var rr = ChemModel.rateLaw(k, cc, order);
        var px = 40 + ((w - 70) * x) / 40;
        var py = h - 30 - ((h - 60) * rr) / (maxR * 1.05);
        if (x === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      var px0 = 40 + ((w - 70) * (c - 0.05)) / 1.95;
      var py0 = h - 30 - ((h - 60) * rate) / (maxR * 1.05);
      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.arc(px0, py0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "14px sans-serif";
      ctx.fillText("[A]", w - 40, h - 12);
      ctx.fillText("rate", 8, 20);
    }
    conc.oninput = paint;
    kEl.oninput = paint;
    document.getElementById("double").onclick = function () {
      var c = Number(conc.value);
      var k = Number(kEl.value);
      var before = ChemModel.rateLaw(k, c, order);
      var after = ChemModel.rateLaw(k, c * 2, order);
      var factor = before === 0 ? 0 : after / before;
      var expect = Math.pow(2, order);
      var ok = Math.abs(factor - expect) < 0.02;
      ChemLesson.say("濃度由 " + c.toFixed(1) + " 倍增後，速率由 " + before.toFixed(3) + " 變為 " + after.toFixed(3) + "，約 ×" + factor.toFixed(2) + "。級數 " + order + " 預期 ×" + expect + "。", ok ? "ok" : "no");
    };
    paint();
  </script>
</body>
</html>
