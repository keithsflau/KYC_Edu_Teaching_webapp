    function UpgradeCTA({ reason, onClose, onTrial }) {

    function Drill({ bank, label, onNeedUpgrade, onDone }) {
      const [qi, setQi] = useState(0);
      const [fb, setFb] = useState(null);
      const [score, setScore] = useState(0);
      const [hint, setHint] = useState(false);
      const [first, setFirst] = useState(true);
      const item = bank[qi];

      function pick(opt) {
        if (window.__HKC_FREE_CAP && window.__HKC_FREE_CAP()) {
          onNeedUpgrade("今日免費練習已用完。");
          return;
        }
        const ok = opt === item.a;
        setFb(ok ? { ok: true, msg: "Correct · 正確" } : { ok: false, msg: "Not quite · 再想。Use Hint for the method." });
        if (ok) {
          if (first) setScore(s => s + 1);
        } else {
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
          onDone(score, bank.length);
        } else setQi(qi + 1);
      }

      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">

            <span>{label} · Q {qi + 1}/{bank.length}</span>
            <span>Score {score}</span>

          <div className="grid gap-2">

            </div>
          )}
        </section>
      );
    }

    function BufferLab() {
      const canvasRef = useRef(null);
      const [HA, setHA] = useState(0.1);
      const [A, setA] = useState(0.1);
      const [pKa, setPKa] = useState(4.76);
      const [added, setAdded] = useState(0); // mmol strong acid(+) / base(−) to 100 mL
      const [explore, setExplore] = useState(0);
      const [challenge, setChallenge] = useState(null);
      const [msg, setMsg] = useState("");

      const state = useMemo(() => ChemModel.bufferPH({
        haM: HA, aM: A, pKa, addedMmol: added, volumeL: 0.1
      }), [HA, A, pKa, added]);
      const pH = state.pH;

      const pH0 = useMemo(() => pKa + Math.log10(A / HA), [HA, A, pKa]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        // beaker fill by pH colour
        const t = Math.max(0, Math.min(1, (pH - 2) / 10));
        const r = Math.floor(255 * (1 - t));
        const b = Math.floor(255 * t);
        ctx.fillStyle = "rgb(" + r + ",80," + b + ")";
        ctx.fillRect(80, 60, 200, 280);
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 3;
        ctx.strokeRect(80, 60, 200, 280);
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 28px JetBrains Mono";
        ctx.fillText("pH " + pH.toFixed(2), 110, 200);
        // pH scale meter
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(360, 40, 40, 300);
        for (let i = 0; i <= 14; i++) {
          const y = 40 + (300 * i) / 14;
          ctx.fillStyle = i % 2 === 0 ? "#64748b" : "#94a3b8";
          ctx.fillRect(400, y, 8, 2);
          ctx.font = "10px IBM Plex Sans";
          ctx.fillText(String(14 - i), 415, y + 3);
        }
        const yNeedle = 40 + 300 * (1 - pH / 14);
        ctx.fillStyle = ACCENT;
        ctx.beginPath();
        ctx.moveTo(350, yNeedle);
        ctx.lineTo(360, yNeedle - 6);
        ctx.lineTo(360, yNeedle + 6);
        ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.font = "12px IBM Plex Sans";
        ctx.fillText("HA " + HA.toFixed(2) + " M", 80, 370);
        ctx.fillText("A⁻ " + A.toFixed(2) + " M", 200, 370);
        ctx.fillText("ΔpH from unchallenged: " + (pH - pH0).toFixed(2), 360, 370);
      }, [pH, HA, A, pH0]);

      const bump = () => setExplore((e) => e + 1);
      const startCh = () => {
        if (window.__HKC_FREE_CAP && window.__HKC_FREE_CAP()) { setMsg("Free limit."); return; }
        if (window.HkcSubscribe) HkcSubscribe.recordDrillAttempt();
        setChallenge({ text: "Add ≥ +5 mmol strong acid; |ΔpH| should stay < 0.8 (buffer resists).", check: () => added >= 5 && Math.abs(pH - pH0) < 0.8 });
        setMsg("Challenge the buffer, then Check.");
      };
      const checkCh = () => {
        if (!challenge) return;
        if (challenge.check()) { setMsg("✓ Buffer consumes H⁺ via A⁻ → HA."); setChallenge(null); }
        else setMsg("Add acid first; compare to unbuffered water (would crash pH).");
      };

      return (
          <div className="grid lg:grid-cols-5 gap-4">
            <div className="lg:col-span-3 bg-white rounded-2xl border overflow-hidden">
              <canvas ref={canvasRef} width={640} height={400} />
            </div>
            <div className="lg:col-span-2 space-y-3">
              <section className="bg-white rounded-2xl border p-4">
                <label className="text-xs font-semibold">[HA] = {HA.toFixed(2)} M</label>
                <input type="range" min="0.02" max="0.5" step="0.01" value={HA} onChange={(e) => { setHA(+e.target.value); bump(); }} />
                <label className="text-xs font-semibold mt-2 block">[A⁻] = {A.toFixed(2)} M</label>
                <input type="range" min="0.02" max="0.5" step="0.01" value={A} onChange={(e) => { setA(+e.target.value); bump(); }} />
                <label className="text-xs font-semibold mt-2 block">pKa = {pKa.toFixed(2)}</label>
                <input type="range" min="3" max="10" step="0.01" value={pKa} onChange={(e) => { setPKa(+e.target.value); bump(); }} />
                <label className="text-xs font-semibold mt-2 block">Challenge: {added > 0 ? "+" + added + " mmol H⁺" : added < 0 ? (-added) + " mmol OH⁻" : "none"}</label>
                <input type="range" min="-15" max="15" step="1" value={added} onChange={(e) => { setAdded(+e.target.value); bump(); }} />
                <button type="button" className="mt-3 w-full border rounded-lg py-2 text-sm min-h-[44px]" onClick={() => { setHA(0.1); setA(0.1); setPKa(4.76); setAdded(-15); if (window.ChemLesson) ChemLesson.say("100 mL，HA 10 mmol，加入 15 mmol OH⁻。HA 耗盡後改算剩餘 OH⁻。"); }}>例：100 mL，HA 10 mmol，加 15 mmol OH⁻</button>
                <p className="text-[11px] text-slate-500 mt-2">{state.equation}</p>
              </section>
              <section className="bg-slate-900 text-teal-50 rounded-2xl p-4 mono text-sm">
                pH = <strong>{pH.toFixed(2)}</strong> · 未加酸鹼 {pH0.toFixed(2)}
                <p className="mt-2 text-xs leading-relaxed">{state.noteZh}</p>
              </section>
              <section className="bg-white rounded-2xl border p-4">
                <p className="text-sm mb-2">{challenge ? challenge.text : "Challenge the buffer."}</p>
                <div className="flex gap-2">
                  <button type="button" className="px-3 py-2 text-white rounded-lg text-sm font-semibold min-h-[44px]" style={{ background: ACCENT }} onClick={startCh}>New challenge</button>
                  {challenge && <button type="button" className="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold min-h-[44px]" onClick={checkCh}>Check</button>}
                </div>
                {msg && <p className="text-xs mt-2">{msg}</p>}
              </section>
            </div>
          </div>
      );
    }

    function App() {
      const [mode, setMode] = useState("learn");
      const [pay, setPay] = useState(false);
      const [payReason, setPayReason] = useState("");
      const [doneMsg, setDoneMsg] = useState(null);

      const tabs = [
        { id: "learn", label: "Learn · 學習" },
        { id: "guided", label: "Guided · 引導" },
        { id: "exam", label: "Exam · 測驗" }
      ];

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-8">
          <a href="../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>← F5 Chemistry Hub</a>
          <header className="mt-4 mb-4">
            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>F5 Chemistry · Buffer Systems</p>
            <h1 className="text-2xl sm:text-3xl font-bold mt-1">Buffer Systems Lab</h1>
            <p className="text-slate-500 mt-1">緩衝溶液實驗 · Learn → Guided → Exam</p>
          </header>

          <nav className="flex flex-wrap gap-2 mb-4">
            {tabs.map(tab => (
              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}
                className={"px-3.5 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (mode === tab.id ? "text-white" : "bg-white border border-slate-200 text-slate-700")}
                style={mode === tab.id ? {background: ACCENT} : {}}>
                {tab.label}
              </button>
            ))}
          </nav>

          {mode === "learn" && <LearnFromZero onComplete={() => setMode("guided")} />}

          {mode === "guided" && !doneMsg && (
            <Drill bank={GUIDED} label="Guided" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); }} />
          )}
          {mode === "exam" && !doneMsg && (
            <Drill bank={EXAM} label="Exam" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "learn" }); }} />
          )}
          {doneMsg && (mode === "guided" || mode === "exam") && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-2xl font-bold">Complete</h2>
              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>Continue →</button>
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { setPay(false); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
