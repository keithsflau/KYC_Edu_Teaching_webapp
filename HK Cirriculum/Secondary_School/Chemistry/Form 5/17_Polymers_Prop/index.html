<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>聚合物性質 | Polymer properties</title>
  <link rel="stylesheet" href="../../lesson.css" />
  <style>
    #choices { flex-direction: column; align-items: stretch; }
    #choices button { text-align: left; }
  </style>
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>把鏈的結構連到軟化、密度和硬度。</li>
      <li>分辨熱塑性塑料與大量交聯的熱固性塑料。</li>
      <li>說明支鏈和少量交聯怎樣改變性質。</li>
    </ul>
    <p id="chem-feedback" role="status">選出符合該性質的結構。</p>
  </section>
  <main>
    <div class="panel">
      <h1>聚合物的結構與性質</h1>
      <p class="muted">熱塑性塑料的鏈間主要是分子間力，受熱可以軟化重塑。大量共價交聯的熱固性塑料不能這樣軟化。支鏈使鏈較難靠攏。這裡只比較結構和性質。</p>
      <p id="q" style="font-size:1.15rem;font-weight:700">讀取題目。</p>
      <div class="row" id="choices"></div>
      <div class="row">
        <button type="button" class="alt" id="next">下一題</button>
      </div>
      <p class="muted" id="score">分數 0 / 0</p>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var items = [
      {
        q: "哪一種受熱時鏈可以滑動，軟化後能夠重塑？",
        choices: [
          { label: "線型或支鏈型的熱塑性塑料", ok: true, why: "鏈與鏈之間主要是分子間力。受熱克服這些力之後，鏈可以滑動，所以能軟化並重塑。" },
          { label: "大量共價交聯的熱固性塑料", ok: false, why: "共價交聯把鏈連成網絡。受熱不能讓整條鏈自由滑過彼此，所以不會像熱塑性塑料那樣軟化重塑。" }
        ]
      },
      {
        q: "哪一種聚乙烯密度較高？",
        choices: [
          { label: "少支鏈、鏈能緊密排列的高密度聚乙烯", ok: true, why: "支鏈少，鏈與鏈可以靠得較近，同樣質量佔的體積較小，密度較高。" },
          { label: "多支鏈的低密度聚乙烯", ok: false, why: "支鏈阻礙鏈靠攏，堆積較鬆，密度較低。密度高的是少支鏈的高密度聚乙烯。" }
        ]
      },
      {
        q: "哪一種通常較硬？",
        choices: [
          { label: "聚氯乙烯（鏈上有極性 C–Cl）", ok: true, why: "C–Cl 是愛爾蘭人，鏈間的偶極吸引力比聚乙烯的范德華力強，所以聚氯乙烯通常較硬。" },
          { label: "聚乙烯（鏈間主要是范德華力）", ok: false, why: "聚乙烯鏈間主要是較弱的范德華力，鏈較容易滑動。極性的 C–Cl 會使聚氯乙烯鏈間吸引力較強，因而較硬。" }
        ]
      },
      {
        q: "橡膠硫化後，拉力除去時較能回復形狀。結構上多了什麼？",
        choices: [
          { label: "鏈與鏈之間少量的硫交聯", ok: true, why: "少量交聯限制鏈整個滑走。拉力除去後，鏈較容易回到原來的位置。這裡只談結構和性質。" },
          { label: "所有鏈都變成互不連接的短線型分子", ok: false, why: "鏈若能自由滑走，拉力除去後形狀不易回復。硫化增加的是鏈與鏈之間的交聯。" }
        ]
      }
    ];
    var i = 0;
    var score = 0;
    var tried = 0;
    var locked = false;
    var qEl = document.getElementById("q");
    var box = document.getElementById("choices");
    var scoreEl = document.getElementById("score");

    function render() {
      var item = items[i];
      qEl.textContent = "第 " + (i + 1) + " / " + items.length + " 題：" + item.q;
      box.textContent = "";
      item.choices.forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "alt";
        b.textContent = c.label;
        b.onclick = function () {
          if (locked) {
            ChemLesson.say("這一題已作答，請按下一題。");
            return;
          }
          locked = true;
          tried += 1;
          if (c.ok) score += 1;
          scoreEl.textContent = "分數 " + score + " / " + tried;
          ChemLesson.say(c.why, c.ok ? "ok" : "no");
        };
        box.appendChild(b);
      });
    }

    document.getElementById("next").onclick = function () {
      locked = false;
      i = (i + 1) % items.length;
      render();
      ChemLesson.say("換一題。先選結構。");
    };
    render();
  </script>
  <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
