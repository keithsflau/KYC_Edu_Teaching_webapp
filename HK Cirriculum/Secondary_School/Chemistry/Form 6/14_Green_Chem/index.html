<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>綠色化學 | Atom economy</title>
  <script src="../../chem-model.js"></script>
  <link rel="stylesheet" href="../../lesson.css" />
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>用相對分子質量計算原子經濟。</li>
      <li>解釋加成反應為何是 100%。</li>
      <li>有副產物時原子經濟下降。這裡沒有製備步驟。</li>
    </ul>
    <p id="chem-feedback" role="status">先選哪一條路線的原子經濟較高。</p>
  </section>
  <main>
    <div class="panel">
      <h1>原子經濟</h1>
      <p class="muted">路線 A：加成，目標產物 Mr = 46，沒有副產物。路線 B：目標 Mr = 46，副產物 Mr = 36.5。沒有合成步驟。</p>
      <div class="row">
        <button type="button" id="pick-a">路線 A 較高</button>
        <button type="button" class="alt" id="pick-b">路線 B 較高</button>
      </div>
      <p class="num" id="out"></p>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var a = ChemModel.atomEconomy(46, 46);
    var b = ChemModel.atomEconomy(46, 46 + 36.5);
    document.getElementById("out").textContent = "A = " + a.toFixed(1) + "%　　B = " + b.toFixed(1) + "%";
    document.getElementById("pick-a").onclick = function () {
      ChemLesson.say("正確。A 是 " + a.toFixed(1) + "%，B 是 " + b.toFixed(1) + "%。副產物把分母變大。", "ok");
    };
    document.getElementById("pick-b").onclick = function () {
      ChemLesson.say("B 是 " + b.toFixed(1) + "%，低於 A 的 " + a.toFixed(1) + "%。有副產物時原子經濟下降。", "no");
    };
  </script>
</body>
</html>
