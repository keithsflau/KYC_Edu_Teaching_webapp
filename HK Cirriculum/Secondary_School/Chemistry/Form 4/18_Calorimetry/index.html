<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>量熱計算 | Calorimetry</title>
  <script src="../../chem-model.js"></script>
  <link rel="stylesheet" href="../../lesson.css" />
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>用 q = mcΔT 計算水吸收的熱。</li>
      <li>升溫時 ΔH 取負號。</li>
      <li>這是計算模型，沒有加熱步驟。</li>
    </ul>
    <p id="chem-feedback" role="status">調質量、溫度和摩爾數，核對 q。</p>
  </section>
  <main>
    <div class="panel">
      <h1>量熱計算</h1>
      <p class="muted">水的比熱固定為 4.18 J g⁻¹ °C⁻¹。沒有燃燒或加熱的操作步驟。</p>
      <label for="mass">水的質量 m = <span id="mass-v">100</span> g</label>
      <input id="mass" type="range" min="50" max="200" step="10" value="100" />
      <label for="dt">溫度上升 ΔT = <span id="dt-v">5</span> °C</label>
      <input id="dt" type="range" min="1" max="10" step="1" value="5" />
      <label for="n">樣品 n = <span id="n-v">0.050</span> mol</label>
      <input id="n" type="range" min="0.01" max="0.10" step="0.01" value="0.05" />
      <p class="num" id="out"></p>
      <div class="row">
        <button type="button" id="check-209">100 g、升 5°C 時 q 是 2.09 kJ？</button>
      </div>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var mass = document.getElementById("mass");
    var dt = document.getElementById("dt");
    var n = document.getElementById("n");
    function paint() {
      document.getElementById("mass-v").textContent = mass.value;
      document.getElementById("dt-v").textContent = dt.value;
      document.getElementById("n-v").textContent = Number(n.value).toFixed(3);
      var r = ChemModel.calorimetry(Number(mass.value), Number(dt.value), Number(n.value));
      document.getElementById("out").textContent = "q = " + r.qJ.toFixed(0) + " J = " + r.qkJ.toFixed(2) + " kJ；ΔH = " + r.deltaH.toFixed(1) + " kJ/mol";
    }
    [mass, dt, n].forEach(function (el) { el.oninput = paint; });
    document.getElementById("check-209").onclick = function () {
      var r = ChemModel.calorimetry(100, 5, 0.05);
      var ok = Math.abs(r.qkJ - 2.09) < 0.02;
      ChemLesson.say(ok
        ? "q = 100 × 4.18 × 5 = 2090 J = 2.09 kJ。ΔH = −2.09 / 0.050 = −41.8 kJ/mol。"
        : "計算未對上 2.09 kJ。",
        ok ? "ok" : "no");
    };
    paint();
  </script>
</body>
</html>
