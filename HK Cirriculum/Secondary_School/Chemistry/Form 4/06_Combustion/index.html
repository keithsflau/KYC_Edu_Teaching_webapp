<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>燃燒產物 | Combustion products</title>
  <script src="../../chem-model.js"></script>
  <link rel="stylesheet" href="../../lesson.css" />
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>分辨完全燃燒與不完全燃燒的產物。</li>
      <li>核對甲烷、乙烯完全燃燒的摩爾比。</li>
      <li>模型只比較產物，沒有點火步驟。</li>
    </ul>
    <p id="chem-feedback" role="status">先選燃料和氧氣情況，再選碳的產物。</p>
  </section>
  <main>
    <div class="panel">
      <h1>燃燒產物模型</h1>
      <p class="muted">只比較產物和摩爾比。不要在這裡找點火步驟或氣體用量。</p>
      <label for="fuel">燃料</label>
      <select id="fuel">
        <option value="methane">甲烷 CH₄</option>
        <option value="ethene">乙烯 C₂H₄</option>
      </select>
      <label for="oxygen">氧氣情況</label>
      <select id="oxygen">
        <option value="enough">充足</option>
        <option value="limited">不足</option>
      </select>
      <p class="muted">碳的主要產物是？</p>
      <div class="row">
        <button type="button" data-carbon="CO2">CO₂</button>
        <button type="button" data-carbon="CO">CO／碳煙</button>
      </div>
      <p id="equation" class="num" style="font-size:1rem;margin-top:12px"></p>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var fuel = document.getElementById("fuel");
    var oxygen = document.getElementById("oxygen");
    var equation = document.getElementById("equation");
    function show() {
      var out = ChemModel.combustionOutcome(fuel.value, oxygen.value);
      equation.textContent = out.text + "　摩爾比 " + out.ratio;
    }
    fuel.onchange = show;
    oxygen.onchange = show;
    document.querySelectorAll("[data-carbon]").forEach(function (btn) {
      btn.onclick = function () {
        var out = ChemModel.combustionOutcome(fuel.value, oxygen.value);
        var ok = btn.getAttribute("data-carbon") === out.carbon;
        ChemLesson.say(ok
          ? "正確。" + out.text
          : "再看氧是否充足。氧充足時碳的產物是 CO₂；氧不足時是 CO 或碳煙。",
          ok ? "ok" : "no");
      };
    });
    show();
  </script>
</body>
</html>
