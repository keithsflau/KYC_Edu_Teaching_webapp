<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鍵能 | Bond energy</title>
  <script src="../../chem-model.js"></script>
  <link rel="stylesheet" href="../../lesson.css" />
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>ΔH 約等於斷鍵能量減成鍵能量。</li>
      <li>計算 H₂ + Cl₂ → 2HCl。</li>
      <li>判斷反應是放熱還是吸熱。</li>
    </ul>
    <p id="chem-feedback" role="status">改鍵能，再判斷放熱或吸熱。</p>
  </section>
  <main>
    <div class="panel">
      <h1>鍵能計算</h1>
      <p class="muted">H₂ + Cl₂ → 2HCl。數值單位是 kJ/mol。這不是製備氯氣的步驟。</p>
      <label for="hh">H–H <span id="hh-v">436</span></label>
      <input id="hh" type="range" min="300" max="500" step="1" value="436" />
      <label for="cl">Cl–Cl <span id="cl-v">242</span></label>
      <input id="cl" type="range" min="150" max="350" step="1" value="242" />
      <label for="hcl">H–Cl <span id="hcl-v">431</span></label>
      <input id="hcl" type="range" min="300" max="500" step="1" value="431" />
      <p class="num" id="out"></p>
      <div class="row">
        <button type="button" id="exo">我判斷放熱</button>
        <button type="button" class="alt" id="endo">我判斷吸熱</button>
      </div>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var hh = document.getElementById("hh");
    var cl = document.getElementById("cl");
    var hcl = document.getElementById("hcl");
    function current() {
      return ChemModel.bondEnthalpy(Number(hh.value), Number(cl.value), Number(hcl.value));
    }
    function paint() {
      document.getElementById("hh-v").textContent = hh.value;
      document.getElementById("cl-v").textContent = cl.value;
      document.getElementById("hcl-v").textContent = hcl.value;
      var r = current();
      document.getElementById("out").textContent = "斷鍵 " + r.broken + " − 成鍵 " + r.formed + " = ΔH " + r.deltaH + " kJ/mol";
    }
    [hh, cl, hcl].forEach(function (el) { el.oninput = paint; });
    function judge(wantExo) {
      var r = current();
      var ok = wantExo === r.exo;
      ChemLesson.say(ok
        ? "正確。ΔH = " + r.deltaH + " kJ/mol，" + (r.exo ? "放熱。" : "吸熱。")
        : "再算一次：斷鍵 " + r.broken + "，成鍵 " + r.formed + "。",
        ok ? "ok" : "no");
    }
    document.getElementById("exo").onclick = function () { judge(true); };
    document.getElementById("endo").onclick = function () { judge(false); };
    paint();
  </script>
</body>
</html>
