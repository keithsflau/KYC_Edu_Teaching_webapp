<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>電解 | Electrolysis</title>
  <link rel="stylesheet" href="../../lesson.css" />
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>指出陽極接正極並發生氧化，陰極接負極並發生還原。</li>
      <li>說出陽離子移向陰極、陰離子移向陽極；電子走導線。</li>
      <li>比較熔融氯化鉛(II)和很稀氯化鈉溶液的放電產物。</li>
    </ul>
    <p id="chem-feedback" role="status">先選電解質，再接通電源，觀察離子往哪一極移動。</p>
  </section>
  <main>
    <div class="panel">
      <h1>電解：電極與離子移動</h1>
      <p class="muted">操作：選擇熔融氯化鉛(II)或很稀溶液，接通或切斷電源，再判斷離子方向和產物。畫面顆粒只表示離子種類，不是用量。</p>
      <p class="muted">這是概念模型。鉛化合物和氯氣都有毒，頁面只標示電極產物，不寫成可跟做的實驗。</p>
      <canvas id="cell" width="720" height="340" aria-label="電解池，左方陽極，右方陰極"></canvas>
      <label for="system">電解質</label>
      <select id="system">
        <option value="molten">熔融氯化鉛(II)</option>
        <option value="dilute">很稀的氯化鈉溶液（概念）</option>
      </select>
      <div class="row">
        <button type="button" id="power">接通電源</button>
      </div>
      <p id="half" class="num" style="font-size:1.05rem"></p>
      <p id="readout" class="muted"></p>
    </div>
    <div class="panel">
      <p class="num" style="font-size:1.15rem">判斷</p>
      <p id="q-text"></p>
      <div class="row" id="q-opts"></div>
      <div class="row">
        <button type="button" class="alt" id="next-q">下一題</button>
      </div>
      <p class="muted" id="score">分數 0 / 0</p>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script src="lesson.js"></script>
</body>
</html>
