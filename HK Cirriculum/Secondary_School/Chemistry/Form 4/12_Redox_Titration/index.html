<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>氧化還原滴定 | Redox titration</title>
  <link rel="stylesheet" href="../../lesson.css" />
  <style>
    .neck { width: 46px; height: 16px; margin: 12px auto 0; border: 8px solid #334155; border-bottom: 0; border-radius: 6px 6px 0 0; }
    .flask { width: 148px; height: 150px; margin: 0 auto; border: 8px solid #334155; border-top: 0; border-radius: 0 0 74px 74px; background: #f1f5f9; }
    #look { text-align: center; }
  </style>
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>指出接受電子的是氧化劑，失去電子的是還原劑。</li>
      <li>用燒瓶顏色判斷終點是不是極淡粉紅色剛剛持續。</li>
      <li>只談角色和終點顏色，不使用試劑用量。</li>
    </ul>
    <p id="chem-feedback" role="status">操作：先選燒瓶顏色，再判斷氧化劑、還原劑和終點。</p>
  </section>
  <main>
    <div class="panel">
      <h1>氧化還原滴定</h1>
      <p class="muted">概念上，鐵(II)遇到高錳酸根。高錳酸根是自身指示劑。本課不提供濃度或體積。</p>
      <p class="muted"><strong>操作</strong>：選一種顏色觀察燒瓶，再按角色和「核對終點」。</p>
      <div class="neck"></div>
      <div class="flask" id="flask" aria-hidden="true"></div>
      <p class="num" id="look" style="font-size:1.05rem">尚未選擇顏色</p>
      <div class="row" role="group" aria-label="燒瓶顏色">
        <button type="button" data-stage="before">近乎無色</button>
        <button type="button" data-stage="end">極淡粉紅色持續</button>
        <button type="button" data-stage="after">深紫色</button>
      </div>
      <div class="row">
        <button type="button" id="check-end">核對終點</button>
      </div>
      <p class="muted">鐵(II)是哪一種試劑？</p>
      <div class="row">
        <button type="button" data-species="fe" data-role="ox">氧化劑</button>
        <button type="button" data-species="fe" data-role="red">還原劑</button>
      </div>
      <p class="muted">高錳酸根是哪一種試劑？</p>
      <div class="row">
        <button type="button" data-species="mn" data-role="ox">氧化劑</button>
        <button type="button" data-species="mn" data-role="red">還原劑</button>
      </div>
      <p class="muted">終點顏色從哪裡來？</p>
      <div class="row">
        <button type="button" data-species="hint" data-role="self">高錳酸根本身</button>
        <button type="button" data-species="hint" data-role="extra">另加酸鹼指示劑</button>
      </div>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var STAGES = {
      before: { look: "近乎無色", color: "#e2e8f0" },
      end: { look: "極淡粉紅色持續", color: "#f9a8d4" },
      after: { look: "深紫色", color: "#6b21a8" }
    };
    var stage = "";

    function gradeEndpoint(which) {
      if (!STAGES[which]) {
        return { ok: false, msg: "錯因：請先選一種燒瓶顏色，再核對是不是終點。" };
      }
      if (which === "end") {
        return { ok: true, msg: "正確。終點是極淡粉紅色剛剛持續，顏色來自微過量的高錳酸根。它是自身指示劑。" };
      }
      if (which === "before") {
        return { ok: false, msg: "錯因：近乎無色表示高錳酸根仍被還原劑還原，紫色留不住，所以還未到終點。" };
      }
      return { ok: false, msg: "錯因：深紫色表示氧化劑已經明顯過量，觀察過了終點。終點只取極淡粉紅色剛持續的時候。" };
    }

    function gradeRole(species, role) {
      if (species === "fe" && role === "red") {
        return { ok: true, msg: "正確。鐵(II)失去電子變成鐵(III)，是還原劑。" };
      }
      if (species === "fe" && role === "ox") {
        return { ok: false, msg: "錯因：鐵(II)失去電子，不是氧化劑。接受電子的高錳酸根才是氧化劑。" };
      }
      if (species === "mn" && role === "ox") {
        return { ok: true, msg: "正確。高錳酸根接受電子、被還原，是氧化劑。" };
      }
      if (species === "mn" && role === "red") {
        return { ok: false, msg: "錯因：高錳酸根在終點前被還原而褪色。接受電子的一方是氧化劑，不是還原劑。" };
      }
      if (species === "hint" && role === "self") {
        return { ok: true, msg: "正確。終點的極淡粉紅色來自微過量的高錳酸根本身，不是另加指示劑。" };
      }
      if (species === "hint" && role === "extra") {
        return { ok: false, msg: "錯因：酚酞或甲基橙用於酸鹼滴定。這一課的終點用高錳酸根自己的極淡粉紅色。" };
      }
      return { ok: false, msg: "錯因：請選擇氧化劑或還原劑。" };
    }

    function showStage(which) {
      stage = which;
      var item = STAGES[which];
      var flask = document.getElementById("flask");
      flask.style.background = item.color;
      document.getElementById("look").textContent = item.look;
      document.querySelectorAll("[data-stage]").forEach(function (btn) {
        var on = btn.getAttribute("data-stage") === which;
        btn.classList.toggle("on", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
      });
      ChemLesson.say("燒瓶顯示：" + item.look + "。再按「核對終點」。");
    }

    function wireRedox() {
      document.querySelectorAll("[data-stage]").forEach(function (btn) {
        btn.setAttribute("aria-pressed", "false");
        btn.onclick = function () { showStage(btn.getAttribute("data-stage")); };
      });
      document.getElementById("check-end").onclick = function () {
        var result = gradeEndpoint(stage);
        ChemLesson.say(result.msg, result.ok ? "ok" : "no");
      };
      document.querySelectorAll("[data-species]").forEach(function (btn) {
        btn.onclick = function () {
          var result = gradeRole(btn.getAttribute("data-species"), btn.getAttribute("data-role"));
          ChemLesson.say(result.msg, result.ok ? "ok" : "no");
        };
      });
    }

    if (typeof document !== "undefined") wireRedox();
  </script>
</body>
</html>
