<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>腐蝕與防鏽 | Corrosion</title>
  <link rel="stylesheet" href="../../lesson.css" />
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>說出鐵生鏽要同時有氧和水。</li>
      <li>判斷只有水或只有氧時不會生鏽。</li>
      <li>比較屏障、鍍鋅、鍍錫和犧牲保護。</li>
    </ul>
    <p id="chem-feedback" role="status">先設定水和氧，再判斷鐵會不會生鏽。</p>
  </section>
  <main>
    <div class="panel">
      <h1>鐵生鏽的條件</h1>
      <p class="muted">操作：開關水和氧，或用三個情境按鈕，然後判斷會不會生鏽。概念式：鐵 + 氧 + 水 → 含水的氧化鐵。這裡沒有加速腐蝕的配法。</p>
      <canvas id="nail" width="720" height="240" aria-label="鐵釘與水和氧的條件"></canvas>
      <div class="row">
        <button type="button" class="alt" id="water">水：無</button>
        <button type="button" class="alt" id="oxygen">氧：無</button>
        <button type="button" class="alt" id="electrolyte">電解質：無</button>
      </div>
      <div class="row">
        <button type="button" class="alt" id="preset-dry">設為乾燥空氣</button>
        <button type="button" class="alt" id="preset-water">設為只有水</button>
        <button type="button" class="alt" id="preset-wet">設為潮濕空氣</button>
      </div>
      <div class="row">
        <button type="button" id="guess-rust">我判斷會生鏽</button>
        <button type="button" class="alt" id="guess-clean">我判斷不會生鏽</button>
      </div>
      <p class="muted" id="env-label"></p>
    </div>
    <div class="panel">
      <h1>防鏽方法</h1>
      <p class="muted">操作：選一種方法，再選保護層完整或破損。以下判斷假設鐵同時接觸水和氧。犧牲保護不用外加電源。</p>
      <canvas id="guard" width="720" height="220" aria-label="防鏽方法下的鐵釘"></canvas>
      <div class="row" id="methods">
        <button type="button" data-method="paint" class="on">油漆或塗油</button>
        <button type="button" class="alt" data-method="zinc">鍍鋅</button>
        <button type="button" class="alt" data-method="tin">鍍錫</button>
        <button type="button" class="alt" data-method="magnesium">連接鎂或鋅塊</button>
      </div>
      <div class="row">
        <button type="button" id="sit-intact" class="on">保護層完整</button>
        <button type="button" class="alt" id="sit-broken">保護層破損</button>
      </div>
      <div class="row">
        <button type="button" id="guess-safe">我判斷鐵受保護</button>
        <button type="button" class="alt" id="guess-fail">我判斷鐵會生鏽</button>
      </div>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script src="lesson.js"></script>
</body>
</html>
