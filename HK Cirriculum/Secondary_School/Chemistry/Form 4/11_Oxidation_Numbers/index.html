<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>氧化數 | Oxidation numbers</title>
  <script src="../../chem-model.js"></script>
  <link rel="stylesheet" href="../../lesson.css" />
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>用電荷總和計算氧化數。</li>
      <li>認出過氧化物和 OF₂ 的例外。</li>
      <li>答錯時按規則再試。</li>
    </ul>
    <p id="chem-feedback" role="status">輸入氧化數，然後核對。</p>
  </section>
  <main>
    <div class="panel">
      <h1>氧化數練習</h1>
      <p id="prompt" class="num"></p>
      <label for="ox">氧化數</label>
      <input id="ox" type="number" step="1" value="0" style="font-size:1.2rem;padding:8px;width:8rem" />
      <div class="row">
        <button type="button" id="check">核對</button>
        <button type="button" class="alt" id="next">下一題</button>
      </div>
      <p class="muted" id="score">分數 0 / 0</p>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script>
    var drills = ChemModel.oxDrills;
    var i = 0;
    var score = 0;
    var tried = 0;
    var prompt = document.getElementById("prompt");
    var input = document.getElementById("ox");
    function render() {
      var d = drills[i];
      prompt.textContent = d.formula + " 中 " + d.ask + " 的氧化數是？";
    }
    document.getElementById("check").onclick = function () {
      var d = drills[i];
      var got = Number(input.value);
      tried += 1;
      var ok = got === d.answer;
      if (ok) score += 1;
      document.getElementById("score").textContent = "分數 " + score + " / " + tried;
      ChemLesson.say(ok ? "正確。氧化數是 " + d.answer + "。" : d.hint, ok ? "ok" : "no");
    };
    document.getElementById("next").onclick = function () {
      i = (i + 1) % drills.length;
      input.value = "0";
      render();
      ChemLesson.say("下一題：" + drills[i].formula);
    };
    render();
  </script>
</body>
</html>
