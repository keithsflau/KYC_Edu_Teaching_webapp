<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>電鍍 | Electroplating</title>
  <link rel="stylesheet" href="../../lesson.css" />
</head>
<body>
  <section class="chem-learn" data-chem-entry="1">
    <h2>學習目標</h2>
    <ul>
      <li>把要鍍的物件接到陰極。</li>
      <li>說出鍍層金屬離子在物件表面還原。</li>
      <li>知道陽極宜用鍍層金屬，電解質要有該金屬的離子。</li>
    </ul>
    <p id="chem-feedback" role="status">先把物件接到陰極或陽極，再按判斷。</p>
  </section>
  <main>
    <div class="panel">
      <h1>電鍍：物件接陰極</h1>
      <p class="muted">操作：把物件接到陰極或陽極，再改陽極和電解質，看鍍層長在哪裡。以鍍銅作概念例子，沒有電鍍液配法、電流或時間。</p>
      <canvas id="cell" width="720" height="320" aria-label="電鍍池，右方是物件，左方是另一電極"></canvas>
      <p class="muted">物件接到</p>
      <div class="row">
        <button type="button" id="obj-cathode">陰極</button>
        <button type="button" class="alt" id="obj-anode">陽極</button>
      </div>
      <p class="muted">左方電極</p>
      <div class="row">
        <button type="button" id="anode-metal" class="on">鍍層金屬（銅）</button>
        <button type="button" class="alt" id="anode-inert">惰性電極</button>
      </div>
      <p class="muted">電解質</p>
      <div class="row">
        <button type="button" id="bath-ions" class="on">含銅離子</button>
        <button type="button" class="alt" id="bath-none">不含鍍層金屬離子</button>
      </div>
      <div class="row">
        <button type="button" id="judge">判斷能否鍍在物件上</button>
      </div>
      <p id="half" class="num" style="font-size:1.05rem"></p>
    </div>
    <div class="panel">
      <p class="num" style="font-size:1.15rem">判斷</p>
      <p id="q-text"></p>
      <div class="row" id="q-opts"></div>
      <div class="row">
        <button type="button" class="alt" id="next-q">下一題</button>
      </div>
      <p class="muted" id="score">分數 0 / 0</p>
    </div>
  </main>
  <script src="../../lesson-kit.js"></script>
  <script src="lesson.js"></script>
</body>
</html>
