    const GASES = {
      he: { name: "Helium 氦", m: 4, color: "#22d3ee", r: 3 },
      ar: { name: "Argon 氬", m: 40, color: "#fb923c", r: 5 }
    };
    const BOX = { l: 18, t: 14, b: 346, maxR: 700 };
    function pressureModel(N, T, Vf) { return 100 * (N / 80) * (T / 300) * (0.7 / Vf); }

    function GasSim() {
      const [T, setT] = useState(300);
      const [N, setN] = useState(80);
      const [Vf, setVf] = useState(0.7);
      const [gas, setGas] = useState("he");
      const [running, setRunning] = useState(true);
      const [slow, setSlow] = useState(false);
      const [hold, setHold] = useState("none");
      const [readout, setReadout] = useState({ p: 100, hits: 0, meanV: 0 });
      const cv = useRef(null), gv = useRef(null);
      const S = useRef({ parts: [], hits: 0, hitT: 0, hitsPerS: 0, params: {} });
      const stepOnce = useRef(false);
      const pTarget = useRef(100);

      useEffect(() => { S.current.params = { T, N, Vf, gas, hold }; syncParticles(); }, [T, N, Vf, gas, hold]);

      function pistonX(vf) { return BOX.l + vf * (BOX.maxR - BOX.l); }
      function randPart() {
        const pr = pistonX(S.current.params.Vf != null ? S.current.params.Vf : Vf);
        const g = GASES[S.current.params.gas || gas];
        const sp = 110 * Math.sqrt((S.current.params.T || T) / 300) * Math.sqrt(4 / g.m);
        const a = Math.random() * Math.PI * 2;
        const v = sp * (0.55 + Math.random() * 0.9);
        return { x: BOX.l + 8 + Math.random() * (pr - BOX.l - 16), y: BOX.t + 8 + Math.random() * (BOX.b - BOX.t - 16), vx: Math.cos(a) * v, vy: Math.sin(a) * v };
      }
      function syncParticles() {
        const st = S.current, pr = pistonX(Vf), g = GASES[gas];
        while (st.parts.length < N) st.parts.push(randPart());
        st.parts.length = Math.min(st.parts.length, N);
        const target = 110 * Math.sqrt(T / 300) * Math.sqrt(4 / g.m);
        st.parts.forEach(p => {
          const sp = Math.hypot(p.vx, p.vy) || 1;
          const news = target * (0.55 + ((sp / target) % 1) * 0.9);
          p.vx *= news / sp; p.vy *= news / sp;
          if (p.x > pr - 6) p.x = pr - 8;
          if (p.x < BOX.l + 6) p.x = BOX.l + 8;
        });
      }

      useEffect(() => {
        let raf, last = performance.now();
        function frame(now) {
          const st = S.current, P = st.params;
          let dt = Math.min(0.033, (now - last) / 1000); last = now;
          const advance = running || stepOnce.current;
          stepOnce.current = false;
          if (advance && P.hold === "P") {
            const vfEq = 0.7 * ((P.N || 80) / 80) * ((P.T || 300) / 300) * (100 / pTarget.current);
            const clamped = Math.max(0.35, Math.min(1, vfEq));
            P.Vf = P.Vf + (clamped - P.Vf) * Math.min(1, dt * 2.5);
          }
          const g = GASES[P.gas || "he"], pr = pistonX(P.Vf || 0.7);
          if (slow) dt *= 0.3;
          if (advance) {
            for (const p of st.parts) {
              p.x += p.vx * dt; p.y += p.vy * dt;
              if (p.x < BOX.l + 4) { p.x = BOX.l + 4; p.vx = -p.vx; st.hits++; }
              if (p.x > pr - 4) { p.x = pr - 4; p.vx = -p.vx; st.hits++; }
              if (p.y < BOX.t + 4) { p.y = BOX.t + 4; p.vy = -p.vy; st.hits++; }
              if (p.y > BOX.b - 4) { p.y = BOX.b - 4; p.vy = -p.vy; st.hits++; }
            }
            st.hitT += dt;
            if (st.hitT >= 1) { st.hitsPerS = Math.round(st.hits / st.hitT); st.hits = 0; st.hitT = 0; }
          }
          draw(cv.current, gv.current, st, P, g, pr);
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, [running, slow]);

      useEffect(() => {
        const t = setInterval(() => {
          const P = S.current.params;
          if (P.hold === "P" && typeof P.Vf === "number") setVf(P.Vf);
          const mv = S.current.parts.length ? S.current.parts.reduce((s, p) => s + Math.hypot(p.vx, p.vy), 0) / S.current.parts.length : 0;
          setReadout({ p: pressureModel(P.N || 80, P.T || 300, P.Vf || 0.7), hits: S.current.hitsPerS, meanV: mv });
        }, 400);
        return () => clearInterval(t);
      }, []);

      function draw(c, g2, st, P, gas, pr) {
        if (!c || !g2) return;
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.fillStyle = "#0b1a2a"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(BOX.maxR + 8, BOX.t); ctx.lineTo(BOX.l, BOX.t); ctx.lineTo(BOX.l, BOX.b); ctx.lineTo(BOX.maxR + 8, BOX.b);
        ctx.stroke();
        for (const p of st.parts) {
          ctx.fillStyle = gas.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, gas.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "#94a3b8"; ctx.fillRect(pr, BOX.t, 14, BOX.b - BOX.t);
        ctx.fillStyle = "#64748b";
        for (let y = BOX.t + 6; y < BOX.b - 6; y += 14) ctx.fillRect(pr + 14, y, 8, 3);
        ctx.fillStyle = "#e2e8f0"; ctx.font = "12px IBM Plex Sans";

              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>{t("繼續 →", "Continue →")}</button>
            </section>
          )}
          {mode === "review" && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3">
              <h2 className="font-bold text-lg">{t("錯題簿", "Wrong-answer book")}</h2>
              {(progress.wrongBook || []).length === 0 && <p className="text-sm text-slate-500">{t("暫無錯題", "No wrong answers yet")}</p>}
              {(progress.wrongBook || []).map(w => (
                <div key={w.id} className="rounded-xl p-3 text-sm border border-slate-200">
                  <p className="font-semibold">{w.prompt}</p>
                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>
                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">Answer unlocked</p>}
                  <button type="button" className="text-xs underline mt-2 text-slate-500" onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>Mark resolved</button>
                </div>
              ))}
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
