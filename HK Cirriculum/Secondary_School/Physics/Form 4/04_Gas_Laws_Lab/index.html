    const GASES = {
      he: { name: "Helium ??", m: 4, color: "#22d3ee", r: 3 },
      ar: { name: "Argon ??", m: 40, color: "#fb923c", r: 5 }
    };
    const BOX = { l: 18, t: 14, b: 346, maxR: 700 };
    function pressureModel(N, T, Vf) { return 100 * (N / 80) * (T / 300) * (0.7 / Vf); }

    function GasSim() {
      const [T, setT] = useState(300);
      const [N, setN] = useState(80);
      const [Vf, setVf] = useState(0.7);
      const [gas, setGas] = useState("he");
      const [running, setRunning] = useState(true);
      const [slow, setSlow] = useState(false);
      const [hold, setHold] = useState("none");
      const [readout, setReadout] = useState({ p: 100, hits: 0, meanV: 0 });
      const cv = useRef(null), gv = useRef(null);
      const S = useRef({ parts: [], hits: 0, hitT: 0, hitsPerS: 0, params: {} });
      const stepOnce = useRef(false);
      const pTarget = useRef(100);

      useEffect(() => { S.current.params = { T, N, Vf, gas, hold }; syncParticles(); }, [T, N, Vf, gas, hold]);

      function pistonX(vf) { return BOX.l + vf * (BOX.maxR - BOX.l); }
      function randPart() {
        const pr = pistonX(S.current.params.Vf != null ? S.current.params.Vf : Vf);
        const g = GASES[S.current.params.gas || gas];
        const sp = 110 * Math.sqrt((S.current.params.T || T) / 300) * Math.sqrt(4 / g.m);
        const a = Math.random() * Math.PI * 2;
        const v = sp * (0.55 + Math.random() * 0.9);
        return { x: BOX.l + 8 + Math.random() * (pr - BOX.l - 16), y: BOX.t + 8 + Math.random() * (BOX.b - BOX.t - 16), vx: Math.cos(a) * v, vy: Math.sin(a) * v };
      }
      function syncParticles() {
        const st = S.current, pr = pistonX(Vf), g = GASES[gas];
        while (st.parts.length < N) st.parts.push(randPart());
        st.parts.length = Math.min(st.parts.length, N);
        const target = 110 * Math.sqrt(T / 300) * Math.sqrt(4 / g.m);
        st.parts.forEach(p => {
          const sp = Math.hypot(p.vx, p.vy) || 1;
          const news = target * (0.55 + ((sp / target) % 1) * 0.9);
          p.vx *= news / sp; p.vy *= news / sp;
          if (p.x > pr - 6) p.x = pr - 8;
          if (p.x < BOX.l + 6) p.x = BOX.l + 8;
        });
      }

      useEffect(() => {
        let raf, last = performance.now();
        function frame(now) {
          const st = S.current, P = st.params;
          let dt = Math.min(0.033, (now - last) / 1000); last = now;
          const advance = running || stepOnce.current;
          stepOnce.current = false;
          if (advance && P.hold === "P") {
            const vfEq = 0.7 * ((P.N || 80) / 80) * ((P.T || 300) / 300) * (100 / pTarget.current);
            const clamped = Math.max(0.35, Math.min(1, vfEq));
            P.Vf = P.Vf + (clamped - P.Vf) * Math.min(1, dt * 2.5);
          }
          const g = GASES[P.gas || "he"], pr = pistonX(P.Vf || 0.7);
          if (slow) dt *= 0.3;
          if (advance) {
            for (const p of st.parts) {
              p.x += p.vx * dt; p.y += p.vy * dt;
              if (p.x < BOX.l + 4) { p.x = BOX.l + 4; p.vx = -p.vx; st.hits++; }
              if (p.x > pr - 4) { p.x = pr - 4; p.vx = -p.vx; st.hits++; }
              if (p.y < BOX.t + 4) { p.y = BOX.t + 4; p.vy = -p.vy; st.hits++; }
              if (p.y > BOX.b - 4) { p.y = BOX.b - 4; p.vy = -p.vy; st.hits++; }
            }
            st.hitT += dt;
            if (st.hitT >= 1) { st.hitsPerS = Math.round(st.hits / st.hitT); st.hits = 0; st.hitT = 0; }
          }
          draw(cv.current, gv.current, st, P, g, pr);
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, [running, slow]);

      useEffect(() => {
        const t = setInterval(() => {
          const P = S.current.params;
          if (P.hold === "P" && typeof P.Vf === "number") setVf(P.Vf);
          const mv = S.current.parts.length ? S.current.parts.reduce((s, p) => s + Math.hypot(p.vx, p.vy), 0) / S.current.parts.length : 0;
          setReadout({ p: pressureModel(P.N || 80, P.T || 300, P.Vf || 0.7), hits: S.current.hitsPerS, meanV: mv });
        }, 400);
        return () => clearInterval(t);
      }, []);

      function draw(c, g2, st, P, gas, pr) {
        if (!c || !g2) return;
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.fillStyle = "#0b1a2a"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(BOX.maxR + 8, BOX.t); ctx.lineTo(BOX.l, BOX.t); ctx.lineTo(BOX.l, BOX.b); ctx.lineTo(BOX.maxR + 8, BOX.b);
        ctx.stroke();
        for (const p of st.parts) {
          ctx.fillStyle = gas.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, gas.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "#94a3b8"; ctx.fillRect(pr, BOX.t, 14, BOX.b - BOX.t);
        ctx.fillStyle = "#64748b";
        for (let y = BOX.t + 6; y < BOX.b - 6; y += 14) ctx.fillRect(pr + 14, y, 8, 3);
        ctx.fillStyle = "#e2e8f0"; ctx.font = "12px IBM Plex Sans";
        ctx.fillText("piston ???", pr - 18, BOX.t - 4);
        const gctx = g2.getContext("2d");
        gctx.clearRect(0, 0, g2.width, g2.height);
        gctx.fillStyle = "#0f172a"; gctx.fillRect(0, 0, g2.width, g2.height);
        const midY = 168;
        gctx.strokeStyle = "#475569"; gctx.lineWidth = 1;
        gctx.strokeRect(34, 12, 280, 140);
        gctx.fillStyle = "#94a3b8"; gctx.font = "11px IBM Plex Sans";
        gctx.fillText("p (kPa)", 4, 20); gctx.fillText("V ??, 300, 165);
        gctx.fillText("p??V isotherm ????(fixed T)", 40, 26);
        const C = pressureModel(P.N || 80, P.T || 300, 0.7) * 0.7;
        gctx.strokeStyle = "#38bdf8"; gctx.lineWidth = 2; gctx.beginPath();
        for (let vf = 0.35; vf <= 1.0; vf += 0.01) {
          const px = 34 + ((vf - 0.35) / 0.65) * 280;
          const py = 152 - (Math.min(320, C / vf) / 320) * 140;
          vf === 0.35 ? gctx.moveTo(px, py) : gctx.lineTo(px, py);
        }
        gctx.stroke();
        const pNow = pressureModel(P.N || 80, P.T || 300, P.Vf || 0.7);
        const cxp = 34 + (((P.Vf || 0.7) - 0.35) / 0.65) * 280;
        const cyp = 152 - (Math.min(320, pNow) / 320) * 140;
        gctx.fillStyle = "#fbbf24"; gctx.beginPath(); gctx.arc(cxp, cyp, 5, 0, Math.PI * 2); gctx.fill();
        gctx.strokeStyle = "#475569"; gctx.strokeRect(34, 182, 280, 140);
        gctx.fillStyle = "#94a3b8"; gctx.fillText("speed distribution ???????? (Maxwell??Boltzmann)", 40, 196);
        const bins = new Array(10).fill(0);
        for (const p of st.parts) bins[Math.min(9, Math.floor(Math.hypot(p.vx, p.vy) / 30))]++;
        const maxB = Math.max(1, ...bins);
        bins.forEach((b, k) => {
          gctx.fillStyle = "#22d3ee";
          gctx.fillRect(38 + k * 27, 318 - (b / maxB) * 112, 22, (b / maxB) * 112);
        });
        gctx.fillStyle = "#94a3b8"; gctx.fillText("0", 36, 332); gctx.fillText("speed ??, 280, 332);
      }

      const pNow = pressureModel(N, T, Vf);
      return (
        <div className="space-y-3">
          <div className="flex flex-wrap gap-2 items-center">
            {Object.keys(GASES).map(k => (
              <button key={k} type="button" onClick={() => setGas(k)}
                className={"px-3 py-2 rounded-xl text-sm font-semibold min-h-[44px] border " + (gas === k ? "text-white" : "bg-white text-slate-700 border-slate-200")}
                style={gas === k ? {background: ACCENT, borderColor: ACCENT} : {}}>{GASES[k].name}</button>
            ))}
            <button type="button" onClick={() => setRunning(r => !r)} className="px-3 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-white min-h-[44px]">{running ? "??Pause ????" : "??Play ???"}</button>
            <button type="button" onClick={() => { setRunning(false); stepOnce.current = true; }} className="px-3 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 min-h-[44px]">??Step ???/button>
            <label className="flex items-center gap-2 text-sm font-semibold min-h-[44px] px-2">
              <input type="checkbox" checked={slow} onChange={e => setSlow(e.target.checked)} className="w-5 h-5" /> ??? Slow
            </label>
            <button type="button" onClick={() => { S.current.parts = []; setHold("none"); setT(300); setN(80); setVf(0.7); setSlow(false); setRunning(true); }} className="px-3 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 min-h-[44px]">??Reset ???</button>
          </div>
          <div className="flex flex-wrap gap-1.5 items-center text-sm font-semibold bg-white border border-slate-200 rounded-xl p-2">

    function Drill({ bank, label, onNeedUpgrade, onDone }) {

      const item = bank[qi];

      function pick(opt) {
        if (HKC.freeCapReached()) {
          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");
          onNeedUpgrade("?????????????);
          return;
        }
        HKC.recordDrillUse(APP_ID);

        setFb(ok

          : { ok: false, msg: "Not quite ? ?????Use Hint for the method (answer not shown)." });

          if (first) setScore(s => s + 1);
        } else {
          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
