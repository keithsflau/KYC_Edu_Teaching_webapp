    const GUIDED = [
      { id: "g1", level: 1, q: "Newton's first law states that an object remains at rest or in uniform motion unless…", qZh: "牛頓第一定律:物體保持靜止或勻速直線運動,除非…",
        opts: ["A net (unbalanced) force acts on it 有淨力(不平衡力)作用", "Gravity disappears 重力消失", "Mass becomes zero 質量變零", "Friction always increases 摩擦力必增加"], a: "A net (unbalanced) force acts on it 有淨力(不平衡力)作用",
        hint: "Inertia: no net force → no change in velocity. 慣性:無淨力則速度不變。" },
      { id: "g2", level: 1, q: "A 4 kg block has a net force of 12 N east. Its acceleration is…", qZh: "4 kg 方塊受 12 N 向東淨力,加速度為…",
        opts: ["3 m/s² east 向東", "48 m/s² east", "0.33 m/s² east", "3 m/s² west 向西"], a: "3 m/s² east 向東",

        opts: ["The force giving 1 kg an acceleration of 1 m/s² 使 1 kg 獲 1 m/s² 加速度的力", "The weight of 1 kg on Earth 地球上 1 kg 的重量", "1 pascal (N/m²) 帕斯卡", "1 kg·m/s 動量"], a: "The force giving 1 kg an acceleration of 1 m/s² 使 1 kg 獲 1 m/s² 加速度的力",
        hint: "From F = ma with m = 1 kg, a = 1 m/s² → F = 1 N. 由 F=ma 推得。" },
      { id: "g4", level: 2, q: "A student pushes a wall. The wall pushes back on the student. These forces are…", qZh: "學生推牆,牆對學生有反作用力。這對力…",
        opts: ["An action–reaction pair on different bodies 作用於不同物體的相互作用力", "Both on the student 都作用於學生", "A balanced pair on the wall cancelling out 在牆上互相抵消的平衡力", "Always unequal in size 大小一定不等"], a: "An action–reaction pair on different bodies 作用於不同物體的相互作用力",
        hint: "Newton's 3rd: equal magnitude, opposite direction, different objects. 第三定律:等大反向、不同物體。" },
      { id: "g5", level: 2, q: "A book rests on a table. Which free-body diagram (forces ON the book only) is correct?", qZh: "書本靜置桌上。哪個自由物體圖(只畫書受力)正確?",
        opts: ["Weight down + normal up, equal size 向下重力+向上法向力,等大", "Weight down only 只有向下重力", "Normal up only 只有向上法向力", "Weight and normal both down 重力和法向力都向下"], a: "Weight down + normal up, equal size 向下重力+向上法向力,等大",
        hint: "At rest: F_net = 0 so weight = normal. 靜止時合力為零,重力=法向力。" },
      { id: "g6", level: 2, q: "In the F = ma simulator you double mass but keep the same net force. Acceleration…", qZh: "模擬中淨力不變、質量加倍,加速度…",
        opts: ["Halves 減半", "Doubles 加倍", "Unchanged 不變", "Quadruples 四倍"], a: "Halves 減半",

    ];
    const EXAM = [
      { id: "e1", level: 3, q: "A 5 kg sled is pulled with 30 N forward; kinetic friction is 10 N backward. Net acceleration?", qZh: "5 kg 雪橇受 30 N 向前拉力,動摩擦力 10 N 向後,淨加速度?",
        opts: ["4 m/s² forward 向前", "2 m/s² forward", "8 m/s² forward", "0 m/s²"], a: "4 m/s² forward 向前",
        hint: "F_net = 30 − 10 = 20 N → a = 20/5 = 4 m/s². 先求淨力再除質量。" },
      { id: "e2", level: 3, q: "Two forces act on a 2 kg object: 15 N right and 7 N left. Magnitude of acceleration?", qZh: "2 kg 物體受 15 N 向右、7 N 向左,加速度大小?",
        opts: ["4 m/s²", "11 m/s²", "1.5 m/s²", "8 m/s²"], a: "4 m/s²",
        hint: "F_net = 15 − 7 = 8 N → a = 8/2 = 4 m/s². 先合成淨力。" },
      { id: "e3", level: 3, q: "Which property of an object measures its resistance to changes in motion?", qZh: "哪個物理量量度物體抗拒運動狀態改變的程度?",
        opts: ["Mass 質量", "Speed 速率", "Force 力", "Distance 距離"], a: "Mass 質量",

      { id: "e4", level: 4, q: "A 60 kg passenger stands in a lift accelerating upward at 2 m/s². (g = 10 m/s²) Normal force from floor?", qZh: "60 kg 乘客站在以 2 m/s² 向上加速的升降機內(g=10),地板法向力?",
        opts: ["720 N", "600 N", "480 N", "120 N"], a: "720 N",
        hint: "Up positive: N − mg = ma → N = m(g+a) = 60×12 = 720 N. 取向上為正。" },
      { id: "e5", level: 4, q: "Blocks A (2 kg) and B (3 kg) are tied together on a frictionless table. A horizontal 10 N pull is applied to A. Tension in the string between A and B?", qZh: "光滑桌上 A(2 kg)與 B(3 kg)以繩連接,對 A 施 10 N 水平拉力,繩張力?",
        opts: ["6 N", "10 N", "4 N", "2 N"], a: "6 N",
        hint: "System: a = 10/5 = 2 m/s². On B: T = m_B·a = 3×2 = 6 N. 先求系統加速度。" },
      { id: "e6", level: 4, q: "A rocket ejects gas backward. The rocket accelerates forward because…", qZh: "火箭向後噴出氣體而向前加速,因為…",
        opts: ["The gas pushes the rocket forward (3rd law pair) 氣體對火箭有向前的反作用力(第三定律)", "Mass of rocket becomes zero 火箭質量變零", "Gravity pulls the rocket up 重力把火箭拉上", "Friction with air increases 空氣摩擦力增加"], a: "The gas pushes the rocket forward (3rd law pair) 氣體對火箭有向前的反作用力(第三定律)",
        hint: "Rocket pushes gas back; gas pushes rocket forward — different bodies. 相互作用力作用於不同物體。" }

    function phyBeep(ok){try{var c=phyBeep.c||(phyBeep.c=new (window.AudioContext||window.webkitAudioContext)());if(c.state==="suspended")c.resume();var o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=ok?880:220;g.gain.setValueAtTime(0.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(0.06,c.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.16);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.17);}catch(e){}}
    function LearnExtra() {
      const [m, setM] = useState(2);
      const [F, setF] = useState(10);
      const [running, setRunning] = useState(true);
      const [showA, setShowA] = useState(false);
      const cv = useRef(null);
      const st = useRef({ x: 80, v: 0, t: 0 });
      const a = F / m;

      useEffect(() => {
        st.current = { x: 80, v: 0, t: 0 };
      }, [F, m]);

      useEffect(() => {
        let raf;
        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          const c = cv.current;
          if (c && running) {
            const s = st.current;
            s.v += a * dt;
            s.x += s.v * dt * 18;
            s.t += dt;
            if (s.x > c.width - 70) { s.x = c.width - 70; s.v = 0; }
            if (s.x < 40) { s.x = 40; s.v = 0; }
          }
          draw();
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, [F, m, a, running, showA]);

      function draw() {
        const c = cv.current;
        if (!c) return;
        const ctx = c.getContext("2d");
        const W = c.width, H = c.height;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(24, H - 48);
        ctx.lineTo(W - 24, H - 48);
        ctx.stroke();
        const bx = st.current.x, by = H - 88, bw = 56 + m * 6, bh = 36 + m * 2;
        ctx.fillStyle = "#ea580c";
        ctx.fillRect(bx, by - bh, bw, bh);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "12px IBM Plex Sans";
        ctx.fillText("m = " + m + " kg", bx + 6, by - bh / 2 + 4);
        const arrowLen = Math.min(140, 12 + F * 5);
        ctx.strokeStyle = "#38bdf8";
        ctx.fillStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(bx + bw + 8, by - bh / 2);
        ctx.lineTo(bx + bw + 8 + arrowLen, by - bh / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bx + bw + 8 + arrowLen, by - bh / 2);
        ctx.lineTo(bx + bw + arrowLen, by - bh / 2 - 7);
        ctx.lineTo(bx + bw + arrowLen, by - bh / 2 + 7);
        ctx.closePath();
        ctx.fill();
        ctx.fillText("F = " + F + " N", bx + bw + 16, by - bh / 2 - 12);
        ctx.fillStyle = "#94a3b8";
        if (showA) {
          ctx.fillText("a = F/m = " + a.toFixed(2) + " m/s²", 28, 28);
          ctx.fillText("v ≈ " + st.current.v.toFixed(2) + " m/s（與 F 同向）", 28, 48);
        } else {
          ctx.fillText("先拖動力或質量，再核對 a", 28, 28);
        }
      }

      return (
        <div className="mt-3 space-y-3">
          <p className="text-sm font-semibold text-slate-700">Experiment · F = ma — drag sliders, watch the block accelerate</p>
          <canvas ref={cv} className="sim" width="640" height="200" />
          <div className="grid sm:grid-cols-2 gap-3">
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">
              Net force F · {F} N
              <input type="range" min="0" max="30" value={F} onChange={e => { setF(+e.target.value); setShowA(false); }} className="w-full mt-2" />
            </label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">
              Mass m · {m} kg
              <input type="range" min="1" max="10" value={m} onChange={e => { setM(+e.target.value); setShowA(false); }} className="w-full mt-2" />
            </label>
          </div>
          <div className="flex flex-wrap gap-2 items-center">
            <button type="button" onClick={() => { setShowA(true); phyBeep(true); }} className="px-3 py-2 rounded-xl text-sm font-bold text-white min-h-[44px]" style={{background: ACCENT}}>核對 Check</button>
            {showA && <span className="px-3 py-1.5 rounded-full bg-orange-100 text-orange-900 font-bold text-sm">a = {a.toFixed(2)} m/s²（與淨力同向）</span>}
            <button type="button" onClick={() => setRunning(r => !r)} className="px-3 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-white min-h-[44px]">{running ? "⏸ Pause" : "▶ Play"}</button>
            <button type="button" onClick={() => { st.current = { x: 80, v: 0, t: 0 }; }} className="px-3 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 min-h-[44px]">↺ Reset</button>
          </div>
        </div>
      );
    }

    function UpgradeCTA({ reason, onClose, onTrial }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4">
          <div className={"w-full max-w-md rounded-2xl p-5 " + (false ? "bg-slate-900 border border-slate-600" : "bg-white border border-slate-200") }>
            <h3 className="text-lg font-bold" style={{color: ACCENT}}>解鎖完整練習與家長進度</h3>
            <p className={"text-sm mt-2 " + (false ? "text-slate-300" : "text-slate-600")}>{reason || window.SUBSCRIBE_CONFIG.bannerText}</p>
            <ul className={"mt-3 text-sm space-y-1 list-disc list-inside " + (false ? "text-slate-300" : "text-slate-600")}>
              <li>Unlimited daily drills</li>
              <li>Full wrong-answer book</li>
              <li>Progress sync (coming)</li>
            </ul>
            <button type="button" onClick={onTrial} className="mt-4 w-full min-h-[48px] rounded-xl font-semibold text-white" style={{background: ACCENT}}>開始 14 日試用（本機）</button>
            <a href={HKC.MARKETING_PATH} className={"mt-2 block w-full min-h-[44px] text-center leading-[44px] rounded-xl border text-sm " + (false ? "border-slate-600" : "border-slate-300")}>了解家長計劃</a>
            <button type="button" onClick={onClose} className={"mt-2 w-full text-sm underline " + (false ? "text-slate-400" : "text-slate-500")}>繼續免費</button>
          </div>

    }

    function Drill({ bank, label, onNeedUpgrade, onDone }) {
      const [qi, setQi] = useState(0);
      const [fb, setFb] = useState(null);
      const [score, setScore] = useState(0);
      const [hint, setHint] = useState(false);
      const [first, setFirst] = useState(true);
      const item = bank[qi];

      function pick(opt) {
        if (HKC.freeCapReached()) {
          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");
          onNeedUpgrade("今日免費練習已用完。");
          return;
        }
        HKC.recordDrillUse(APP_ID);
        const ok = opt === item.a;
        setFb(ok
          ? { ok: true, msg: "Correct · 正確" }
          : { ok: false, msg: "Not quite · 再想。Use Hint for the method (answer not shown)." });
        if (ok) {
          if (typeof HKC.recordOk === "function") HKC.recordOk(APP_ID, item);
          if (first) setScore(s => s + 1);
        } else {
          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
          HKC.recordSession(APP_ID, score, bank.length);
          onDone(score, bank.length);
        } else setQi(qi + 1);
      }

      return (
        <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5"}>
          <div className={"flex justify-between text-sm mb-3 " + (false ? "text-slate-400" : "text-slate-500")}>
            <span>{label} · Q {qi + 1}/{bank.length} · Lv {item.level}</span>
            <span>Score {score}</span>
          </div>
          <h2 className="text-lg font-bold mb-1">{item.q}</h2>
          {item.qZh ? <p className="text-sm mb-4 opacity-80" style={{color: ACCENT}}>{item.qZh}</p> : <div className="mb-4" />}
          <div className="grid gap-2">
            {item.opts.map(o => (
              <button key={o} type="button" disabled={fb && fb.ok} onClick={() => pick(o)}
                className={"text-left px-4 py-3 rounded-xl min-h-[48px] disabled:opacity-50 bg-slate-50 hover:bg-slate-100 border border-slate-200"}>{o}</button>
            ))}
          </div>
          <button type="button" className="text-sm mt-3 font-semibold min-h-[44px]" style={{color: ACCENT}} onClick={() => setHint(true)}>Hint · 提示</button>
          {hint && <p className={"text-sm mt-1 p-3 rounded-xl " + (false ? "bg-amber-950/50 text-amber-100 border border-amber-800/40" : "bg-amber-50 text-amber-900 border border-amber-200")}>{item.hint}</p>}
          {fb && (
            <div className={"mt-4 p-3 rounded-xl text-sm " + (fb.ok ? (false ? "bg-emerald-900/40 text-emerald-200" : "bg-emerald-50 text-emerald-800") : (false ? "bg-rose-900/40 text-rose-200" : "bg-rose-50 text-rose-800"))}>
              {fb.msg}
              {fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={next}>Next →</button>}
              {!fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={() => setFb(null)}>Retry</button>}
            </div>
          )}
        </section>
      );
    }

    function App() {
      const [mode, setMode] = useState("learn");
      const [progress, setProgress] = useState(() => HKC.loadProgress(APP_ID));
      const [pay, setPay] = useState(false);
      const [payReason, setPayReason] = useState("");
      const [doneMsg, setDoneMsg] = useState(null);

      function refresh() { setProgress(HKC.loadProgress(APP_ID)); }
      useEffect(() => { refresh(); }, [mode]);

      const tabs = [
        { id: "learn", label: "Learn · 學習" },
        { id: "guided", label: "Guided · 引導" },
        { id: "exam", label: "Exam · 測驗" },
        { id: "review", label: "Review · 錯題" }
      ];

      return (
        <div className="max-w-3xl mx-auto p-4 sm:p-8">
          <a href="../../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>← Hub</a>
          <header className="mt-4 mb-4">
            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>F4 Physics · Force & Motion</p>
            <h1 className="text-2xl sm:text-3xl font-bold mt-1">Force & Newton Laws</h1>
            <p className="text-slate-500 mt-1">力與牛頓定律 · Learn → Guided → Exam → Review · 12 items</p>
          </header>

          <div className={"text-sm border border-dashed rounded-lg px-3 py-2 mb-3 flex flex-wrap justify-between gap-2 items-center " + (false ? "border-slate-600 bg-slate-900/80" : "border-slate-300 bg-white/80")}>
            <span>{HKC.isPaid() ? (HKC.getEntitlement().tier + " · unlimited") : ("Free · " + HKC.remainingFree() + "/" + HKC.FREE_DAILY_CAP + " today")} · Best {progress.bestScore}</span>
            {!HKC.isPaid() && (
              <button type="button" className="px-3 py-1.5 rounded-md text-xs font-semibold text-white min-h-[36px]" style={{background: ACCENT}} onClick={() => setPay(true)}>Upgrade</button>
            )}
          </div>

          <nav className="flex flex-wrap gap-2 mb-4">
            {tabs.map(tab => (
              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}
                className={"px-3.5 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (mode === tab.id ? "text-white" : "bg-white border border-slate-200 text-slate-700")}
                style={mode === tab.id ? {background: ACCENT} : {}}>
                {tab.label}
              </button>
            ))}
          </nav>

          {mode === "learn" && (
            <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3"}>
              <h2 className="font-bold text-lg">Key ideas</h2>
              <ul className={"text-sm space-y-2 list-disc list-inside " + (false ? "text-slate-300" : "text-slate-600")}>
                <li>F_net = ma; inertia resists velocity change.</li><li>Action–reaction: equal opposite forces on different bodies.</li><li>Free-body diagrams: show forces on one object.</li>
              </ul>
              <LearnExtra />
              <button type="button" className="mt-2 px-4 py-2.5 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}} onClick={() => setMode("guided")}>
                Start guided practice →
              </button>
            </section>
          )}

          {mode === "guided" && !doneMsg && (
            <Drill bank={GUIDED} label="Guided" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); refresh(); }} />
          )}
          {mode === "exam" && !doneMsg && (
            <Drill bank={EXAM} label="Exam" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "review" }); refresh(); }} />
          )}
          {doneMsg && (mode === "guided" || mode === "exam") && (
            <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center"}>
              <h2 className="text-2xl font-bold">Complete</h2>
              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>Continue →</button>
            </section>
          )}
          {mode === "review" && (
            <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3"}>
              <h2 className="font-bold text-lg">Wrong-answer book · 錯題簿</h2>
              {(progress.wrongBook || []).length === 0 && <p className={"text-sm " + (false ? "text-slate-400" : "text-slate-500")}>No wrong answers yet · 暫無錯題</p>}
              {(progress.wrongBook || []).map(w => (
                <div key={w.id} className={"rounded-xl p-3 text-sm " + (false ? "border border-slate-700" : "border border-slate-200")}>
                  <p className="font-semibold">{w.prompt}</p>
                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>
                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">Answer unlocked</p>}
                  <button type="button" className={"text-xs underline mt-2 " + (false ? "text-slate-400" : "text-slate-500")} onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>Mark resolved</button>
                </div>
              ))}
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
