  <script type="text/babel" data-presets="react-classic">

    const TFZ_STEPS = [
      { id: "A1", title: "Two motions in one", titleZh: "一個運動,兩個方向",
        body: "A projectile moves sideways AND up/down at the same time. The golden rule: the horizontal and vertical motions are INDEPENDENT. Analyse them separately, then recombine.",
        bodyZh: "拋體同時沿水平和鉛直方向運動。黃金法則:兩個方向互相獨立,分開分析再合併。",
        q: "Horizontal and vertical motions of a projectile are…", qZh: "拋體的水平與鉛直運動是…",
        opts: ["Independent of each other 互相獨立", "Always equal 永遠相同", "Dependent 互相影響"], a: "Independent of each other 互相獨立",
        why: "Gravity acts only vertically; nothing pushes horizontally (ignoring air resistance)." },
      { id: "A2", title: "Horizontal: constant velocity", titleZh: "水平方向:等速",
        body: "No horizontal force acts after launch, so vx NEVER changes. vx = u cos θ for the whole flight.",
        bodyZh: "發射後沒有水平力,所以 vx 永不改變:vx = u cos θ。",
        q: "After launch (no air resistance), the horizontal velocity…", qZh: "發射後(無空氣阻力),水平速度…",
        opts: ["Stays constant 保持不變", "Decreases 漸減", "Increases 漸增"], a: "Stays constant 保持不變",
        why: "Newton's first law: no net horizontal force → no horizontal acceleration." },
      { id: "A3", title: "Vertical: constant acceleration g", titleZh: "鉛直方向:等加速 g",
        body: "Gravity pulls down at g ≈ 9.8 m/s². vy = u sin θ − gt. At the TOP of the flight, vy = 0 momentarily — but vx is still there, so the ball keeps moving sideways.",
        bodyZh: "重力以 g ≈ 9.8 m/s² 向下拉。vy = u sin θ − gt。在最高點 vy = 0,但 vx 仍在,球繼續向前。",
        q: "At the highest point of the trajectory…", qZh: "在軌跡最高點…",
        opts: ["vy = 0 but vx ≠ 0", "Both velocities are zero 皆為零", "vx = 0 but vy ≠ 0"], a: "vy = 0 but vx ≠ 0",
        why: "Only the vertical component vanishes at the peak. Acceleration g is still 9.8 down." },
      { id: "A4", title: "Splitting the launch velocity", titleZh: "分解發射速度",
        body: "Launch speed u at angle θ splits into: ux = u cos θ (sideways) and uy = u sin θ (upwards). Bigger θ → more height, less sideways. Smaller θ → flatter, faster sideways.",
        bodyZh: "發射速率 u 以角度 θ 分解:ux = u cos θ(水平),uy = u sin θ(向上)。角度越大越高越慢向前;越小越平越快向前。",
        q: "u = 20 m/s at 30°. ux = u cos 30° ≈", qZh: "u = 20 m/s、30° 角,ux ≈",
        opts: ["17.3 m/s", "10 m/s", "20 m/s"], a: "17.3 m/s",
        why: "cos 30° ≈ 0.866 → 20 × 0.866 = 17.3 m/s." },
      { id: "A5", title: "The path is a parabola", titleZh: "軌跡是拋物線",
        body: "Because x grows steadily (constant vx) while y follows a quadratic (constant g), the trajectory y(x) is a parabola — symmetric if landing at launch height.",
        bodyZh: "x 等速增長而 y 為二次函數,所以 y(x) 是拋物線;同一高度落地時左右對稱。",
        q: "The trajectory shape comes from…", qZh: "軌跡形狀來自…",
        opts: ["Constant vx + constant g 等速 vx 加等加速 g", "Constant speed overall 總速率不變", "Random forces 隨機力"], a: "Constant vx + constant g 等速 vx 加等加速 g",
        why: "Linear in x, quadratic in t for y → parabola y(x)." },
      { id: "A6", title: "Time of flight", titleZh: "飛行時間",
        body: "The ball lands when the vertical motion returns to zero displacement: T = 2u sin θ / g. Only the VERTICAL part decides how long it stays airborne.",
        bodyZh: "當鉛直位移回零時落地:T = 2u sin θ / g。飛行時間只由鉛直分量決定。",
        q: "Doubling u sin θ (vertical launch component) does what to flight time?", qZh: "把鉛直發射分量加倍,飛行時間…",
        opts: ["Doubles 加倍", "Halves 減半", "Unchanged 不變"], a: "Doubles 加倍",
        why: "T ∝ u sin θ at fixed g." },
      { id: "A7", title: "Range and the 45° rule", titleZh: "射程與 45° 法則",
        body: "Range R = (u² sin 2θ)/g. sin 2θ is biggest at θ = 45°, giving maximum range. Complementary angles (30° & 60°) give the SAME range — try it in the lab!",
        bodyZh: "射程 R = u² sin 2θ / g,θ = 45° 時最大。互餘角(30° 與 60°)射程相同,可在實驗驗證!",
        q: "Maximum range on level ground occurs at…", qZh: "平地上最大射程的發射角為…",
        opts: ["45°", "90°", "30°"], a: "45°",
        why: "sin 2θ peaks at 2θ = 90° → θ = 45°." },
      { id: "A8", title: "Checkpoint: Earth vs Moon", titleZh: "檢查點:地球對月球",
        body: "In the lab, fire the same shot on Earth (g = 9.8) then the Moon (g = 1.6). Same u, same θ — but time of flight and range both grow ~6×. Small g, long hang time.",
        bodyZh: "實驗中以相同 u、θ 分別在地球 (g = 9.8) 與月球 (g = 1.6) 發射:飛行時間與射程都約大 6 倍。",
        q: "Same launch on the Moon (smaller g): range becomes…", qZh: "同樣發射搬到月球(g 較小),射程…",
        opts: ["Longer 更遠", "Shorter 更短", "Same 相同"], a: "Longer 更遠",
        why: "R = u² sin 2θ / g — smaller g, larger R." }
    ];

    function LearnFromZero({ steps, onComplete }) {
      const [i, setI] = useState(0);
      const [picked, setPicked] = useState(null);
      const step = steps[i];
      const last = i === steps.length - 1;
      function pick(opt) { if (picked) return; setPicked(opt); }
      function next() {
        if (last) { onComplete(); return; }
        setI(i + 1); setPicked(null);
      }
      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-6">
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs font-black uppercase tracking-widest" style={{color: ACCENT}}>Learn From Zero · 由零開始學</p>
            <p className="text-xs text-slate-500">{step.id} / A{steps.length}</p>
          </div>
          <div className="flex gap-1.5 mb-4">
            {steps.map((s, k) => (
              <div key={s.id} className="h-1.5 flex-1 rounded-full" style={{background: k <= i ? ACCENT : "#e2e8f0"}} />
            ))}
          </div>
          <h2 className="text-xl font-bold">{step.title}</h2>
          <p className="text-sm font-semibold text-slate-500 mt-0.5">{step.titleZh}</p>
          <p className="text-sm mt-3 text-slate-700 leading-relaxed">{step.body}</p>
          <p className="text-sm mt-2 text-slate-500 leading-relaxed">{step.bodyZh}</p>
          <div className="mt-4 p-3 rounded-xl" style={{background: "#fef2f2", border: "1px solid #fecaca"}}>
            <p className="text-sm font-bold">{step.q}</p>
            <p className="text-xs text-slate-500 mb-2">{step.qZh}</p>
            <div className="grid gap-2">
              {step.opts.map(o => {
                let cls = "text-left px-3 py-2.5 rounded-xl text-sm border min-h-[44px] ";
                if (!picked) cls += "bg-white border-slate-200 hover:bg-slate-50";
                else if (o === step.a) cls += "bg-emerald-50 border-emerald-300 text-emerald-800 font-semibold";
                else if (o === picked) cls += "bg-rose-50 border-rose-300 text-rose-800";
                else cls += "bg-white border-slate-200 opacity-60";
                return <button key={o} type="button" className={cls} onClick={() => pick(o)}>{o}</button>;
              })}
            </div>
            {picked && (
              <div className="mt-3 text-sm p-3 rounded-lg bg-white/70 border border-slate-200">
                <p className="font-semibold">{picked === step.a ? "✓ Correct · 正確" : "✗ Not quite — see why · 再想想"}</p>
                <p className="mt-1 text-slate-600">{step.why}</p>
                {picked === step.a && (
                  <button type="button" onClick={next} className="mt-3 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[44px]" style={{background: ACCENT}}>
                    {last ? "Unlock the Lab → 解鎖實驗室" : "Next step →"}
                  </button>
                )}
              </div>
            )}
          </div>
        </section>
      );
    }

    const GRAV = { earth: { name: "Earth 地球", g: 9.8, sky: "#dbeafe", ground: "#86efac" }, moon: { name: "Moon 月球", g: 1.6, sky: "#e2e8f0", ground: "#cbd5e1" }, mars: { name: "Mars 火星", g: 3.7, sky: "#ffedd5", ground: "#fdba74" } };
    const TRACE_COLORS = ["#dc2626", "#7c3aed", "#0284c8"];
    const PXM = 6, OX = 70, GY = 330;

    function ProjectileSim() {
      const [angle, setAngle] = useState(45);
      const [speed, setSpeed] = useState(40);
      const [world, setWorld] = useState("earth");
      const [traces, setTraces] = useState([]);
      const [live, setLive] = useState(null);
      const [playing, setPlaying] = useState(true);
      const [slowMo, setSlowMo] = useState(false);
      const cv = useRef(null);
      const S = useRef({ flight: null });
      const simState = useRef({ playing: true, slowMo: false, stepOnce: false });

      const togglePlay = () => {
        simState.current.playing = !simState.current.playing;
        setPlaying(simState.current.playing);
      };
      const toggleSlowMo = () => {
        simState.current.slowMo = !simState.current.slowMo;
        setSlowMo(simState.current.slowMo);
      };
      const stepSim = () => {
        simState.current.playing = false;
        setPlaying(false);
        simState.current.stepOnce = true;
      };

      function launch() {
        const th = (angle * Math.PI) / 180;
        S.current.flight = { x: 0, y: 0, vx: speed * Math.cos(th), vy: speed * Math.sin(th), t: 0, pts: [], maxH: 0, g: GRAV[world].g, color: TRACE_COLORS[traces.length % TRACE_COLORS.length], th, u: speed, w: world };
        setTraces(t => t.slice(-2));
        simState.current.playing = true;
        setPlaying(true);
      }

      useEffect(() => {
        let raf, last = performance.now();
        function frame(now) {
          let dt = Math.min(0.04, (now - last) / 1000); 
          last = now;
          
          if (simState.current.slowMo) dt *= 0.25;

          const f = S.current.flight;
          if (f && (simState.current.playing || simState.current.stepOnce)) {
            simState.current.stepOnce = false;
            f.t += dt;
            f.x += f.vx * dt;
            f.y += f.vy * dt;
            f.vy -= f.g * dt;
            if (f.y > f.maxH) f.maxH = f.y;
            f.pts.push([f.x, f.y]);
            if (f.y <= 0 && f.t > 0.05) {
              const done = { range: f.x, maxH: f.maxH, T: f.t, color: f.color, th: f.th, u: f.u, w: f.w, pts: f.pts };
              setTraces(t => [...t.slice(-2), done]);
              S.current.flight = null; setLive(null);
            } else {
              setLive({ x: f.x, y: f.y, vx: f.vx, vy: f.vy, t: f.t });
            }
          }
          draw(cv.current, S.current.flight);
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, [traces]);

      function draw(c, f) {
        if (!c) return;
        const ctx = c.getContext("2d");
        const W = GRAV[world];
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.fillStyle = W.sky; ctx.fillRect(0, 0, c.width, GY);
        ctx.fillStyle = W.ground; ctx.fillRect(0, GY, c.width, c.height - GY);
        ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1;
        for (let xm = 10; xm * PXM + OX < c.width; xm += 10) {
          ctx.beginPath(); ctx.moveTo(OX + xm * PXM, GY); ctx.lineTo(OX + xm * PXM, GY + 8); ctx.stroke();
          ctx.fillStyle = "#475569"; ctx.font = "10px IBM Plex Sans";
          ctx.fillText(xm + "m", OX + xm * PXM - 8, GY + 20);
        }
        ctx.fillStyle = "#334155";
        ctx.beginPath(); ctx.arc(OX, GY, 7, 0, 7); ctx.fill();
        traces.forEach(tr => {
          ctx.strokeStyle = tr.color; ctx.lineWidth = 2; ctx.beginPath();
          tr.pts.forEach((p, k) => { const px = OX + p[0] * PXM, py = GY - p[1] * PXM; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
          ctx.stroke();
          ctx.fillStyle = tr.color;
          ctx.beginPath(); ctx.arc(OX + tr.range * PXM, GY - 2, 4, 0, 7); ctx.fill();
        });
        if (f) {
          ctx.strokeStyle = f.color; ctx.lineWidth = 2.5; ctx.beginPath();
          f.pts.forEach((p, k) => { const px = OX + p[0] * PXM, py = GY - p[1] * PXM; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
          ctx.stroke();
          const bx = OX + f.x * PXM, by = GY - f.y * PXM;
          ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(bx, by, 6, 0, 7); ctx.fill();
          const sc = 1.2;
          ctx.strokeStyle = "#16a34a"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + f.vx * sc, by); ctx.stroke();
          ctx.fillStyle = "#16a34a"; ctx.font = "11px IBM Plex Sans"; ctx.fillText("vx", bx + f.vx * sc + 4, by + 4);
          ctx.strokeStyle = "#dc2626";
          ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by - f.vy * sc); ctx.stroke();
          ctx.fillStyle = "#dc2626"; ctx.fillText("vy", bx + 6, by - f.vy * sc);
        }
        const th = (angle * Math.PI) / 180;
        ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(OX, GY); ctx.lineTo(OX + Math.cos(th) * 34, GY - Math.sin(th) * 34); ctx.stroke();
        ctx.font = "bold 12px IBM Plex Sans"; ctx.fillStyle = "#0f172a";
        ctx.fillText("g = " + W.g + " m/s² · " + W.name, 12, 20);
      }

      const th = (angle * Math.PI) / 180, g = GRAV[world].g;
      const predR = (speed * speed * Math.sin(2 * th)) / g;
      const predT = (2 * speed * Math.sin(th)) / g;
      return (
        <div className="space-y-3">
          <div className="flex flex-wrap gap-2 items-center">
            {Object.keys(GRAV).map(k => (
              <button key={k} type="button" onClick={() => setWorld(k)}
                className={"px-3 py-2 rounded-xl text-sm font-semibold min-h-[44px] border " + (world === k ? "text-white" : "bg-white text-slate-700 border-slate-200")}
                style={world === k ? {background: ACCENT, borderColor: ACCENT} : {}}>{GRAV[k].name}</button>
            ))}
            <button type="button" onClick={launch} className="px-4 py-2 rounded-xl text-sm font-bold text-white min-h-[44px]" style={{background: ACCENT}}>🚀 Launch 發射</button>
            <button type="button" onClick={togglePlay} className="px-3 py-2 rounded-xl text-sm font-bold bg-white border border-slate-200 min-h-[44px] hover:bg-slate-50">{playing ? "⏸ Pause" : "▶ Play"}</button>
            <button type="button" onClick={stepSim} className="px-3 py-2 rounded-xl text-sm font-bold bg-white border border-slate-200 min-h-[44px] hover:bg-slate-50">⏭ Step</button>
            <button type="button" onClick={toggleSlowMo} className={"px-3 py-2 rounded-xl text-sm font-bold min-h-[44px] border " + (slowMo ? "bg-amber-100 text-amber-800 border-amber-300" : "bg-white border-slate-200 hover:bg-slate-50")}>🐢 Slow-mo</button>
            <button type="button" onClick={() => { setTraces([]); S.current.flight = null; setLive(null); setAngle(45); setSpeed(40); setWorld("earth"); }} className="px-3 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 min-h-[44px]">↺ Reset 重設</button>
            <button type="button" onClick={() => { setTraces([]); S.current.flight = null; setLive(null); }} className="px-3 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 min-h-[44px]">Clear 清除軌跡</button>
          </div>
          <canvas ref={cv} className="sim" width="720" height="380" />
          <div className="grid sm:grid-cols-2 gap-3">
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Launch angle 發射角 · {angle}°
              <input type="range" min="15" max="75" step="1" value={angle} onChange={e => setAngle(+e.target.value)} className="w-full mt-2" /></label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Launch speed 發射速率 · {speed} m/s
              <input type="range" min="10" max="70" step="1" value={speed} onChange={e => setSpeed(+e.target.value)} className="w-full mt-2" /></label>
          </div>
          <div className="flex flex-wrap gap-2 text-sm">
            <span className="px-3 py-1.5 rounded-full bg-red-100 text-red-800 font-bold">Predicted R 預測射程 ≈ {predR.toFixed(1)} m</span>
            <span className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 font-semibold">Predicted T 預測時間 ≈ {predT.toFixed(2)} s</span>
            {live && <span className="px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold">t={live.t.toFixed(2)}s · vx={live.vx.toFixed(1)} · vy={live.vy.toFixed(1)} m/s</span>}
          </div>
          {traces.length > 0 && (
            <div className="bg-white border border-slate-200 rounded-xl p-3 text-sm overflow-x-auto">
              <p className="font-bold mb-2">Run log 試射記錄 (last {traces.length})</p>
              <table className="w-full text-left">
                <thead><tr className="text-slate-500 text-xs"><th className="pr-3">Run</th><th className="pr-3">World</th><th className="pr-3">θ</th><th className="pr-3">u</th><th className="pr-3">Range 射程</th><th className="pr-3">Max H 最高</th><th>T 時間</th></tr></thead>
                <tbody>
                  {traces.map((tr, k) => (
                    <tr key={k} style={{color: tr.color}} className="font-semibold">
                      <td className="pr-3">#{k + 1}</td><td className="pr-3">{GRAV[tr.w].name}</td><td className="pr-3">{tr.th}°</td><td className="pr-3">{tr.u}</td>
                      <td className="pr-3">{tr.range.toFixed(1)} m</td><td className="pr-3">{tr.maxH.toFixed(1)} m</td><td>{tr.T.toFixed(2)} s</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    const GUIDED = [
      { id: "g1", level: 1, q: "A ball is kicked at 20 m/s, 60° above horizontal. ux = 20 cos 60° = ?", qZh: "足球以 20 m/s、60° 踢出,水平分量 ux = 20 cos 60° = ?",
        opts: ["10 m/s", "17.3 m/s", "20 m/s", "5 m/s"], a: "10 m/s",
        hint: "cos 60° = 0.5. ux = u cos θ。" },
      { id: "g2", level: 1, q: "During flight (no air resistance), the horizontal velocity…", qZh: "飛行途中(無空氣阻力),水平速度…",
        opts: ["Stays constant 保持不變", "Decreases to zero 漸減至零", "Increases 漸增", "Reverses 反向"], a: "Stays constant 保持不變",
        hint: "No horizontal force → no horizontal acceleration. 水平方向不受力。" },
      { id: "g3", level: 1, q: "At the TOP of the trajectory, the vertical velocity is…", qZh: "在最高點,鉛直速度為…",
        opts: ["Zero 零", "Maximum 最大", "Equal to vx 等於 vx", "9.8 m/s"], a: "Zero 零",
        hint: "vy decreases at g until it momentarily hits 0 at the peak. 但加速度仍是 g!" },
      { id: "g4", level: 2, q: "u = 25 m/s at 30°. Time of flight T = 2u sin θ / g (g = 10)?", qZh: "u = 25 m/s、30°,g 取 10,飛行時間?",
        opts: ["2.5 s", "5 s", "1.25 s", "10 s"], a: "2.5 s",
        hint: "sin 30° = 0.5 → T = 2 × 25 × 0.5 / 10. 只用鉛直分量求時間。" },
      { id: "g5", level: 2, q: "Which launch angle gives maximum range on level ground?", qZh: "平地上哪個發射角射程最大?",
        opts: ["45°", "30°", "60°", "90°"], a: "45°",
        hint: "R = u² sin 2θ / g; sin 2θ max at 2θ = 90°. 互補角射程相同。" },
      { id: "g6", level: 2, q: "In the lab you fire at 30° and then 60° with the same u and g. The ranges are…", qZh: "實驗中以相同 u、g 分別用 30° 與 60° 發射,射程…",
        opts: ["Equal 相同", "60° is longer 60° 較遠", "30° is longer 30° 較遠"], a: "Equal 相同",
        hint: "sin(2×30°) = sin 60° = sin(2×60°)? sin 60° = sin 120° ✓ 互餘角同射程。" }
    ];
    const EXAM = [
      { id: "e1", level: 3, q: "A stone is thrown horizontally at 15 m/s from a 20 m cliff (g = 10). Time to hit the sea?", qZh: "石子從 20 m 崖頂以 15 m/s 水平拋出(g = 10),多久落水?",
        opts: ["2 s", "1.5 s", "3 s", "4 s"], a: "2 s",
        hint: "Vertical only: h = ½gt² → 20 = 5t². 水平速度與下落時間無關!" },
      { id: "e2", level: 3, q: "Same stone (15 m/s horizontal, 20 m cliff, g = 10). Horizontal distance from cliff base?", qZh: "同上石子,落點與崖底的水平距離?",
        opts: ["30 m", "20 m", "15 m", "45 m"], a: "30 m",
        hint: "x = vx × t = 15 × 2. 等速 × 時間。" },
      { id: "e3", level: 3, q: "The acceleration of a projectile at the TOP of its flight is…", qZh: "拋體在最高點的加速度為…",
        opts: ["9.8 m/s² downward 向下 9.8", "Zero 零", "9.8 m/s² upward 向上", "Depends on angle 視乎角度"], a: "9.8 m/s² downward 向下 9.8",
        hint: "Gravity never switches off — vy = 0 does NOT mean a = 0. 速度為零 ≠ 加速度為零。" },
      { id: "e4", level: 4, q: "u = 40 m/s at 45° (g = 10). Range?", qZh: "u = 40 m/s、45°,g = 10,射程?",
        opts: ["160 m", "80 m", "40 m", "320 m"], a: "160 m",
        hint: "R = u² sin 2θ / g = 1600 × sin 90° / 10. sin 90° = 1。" },
      { id: "e5", level: 4, q: "On the Moon (g = 1.6) versus Earth (g = 9.8), the same launch gives a flight time about…", qZh: "同樣發射在月球 (g = 1.6) 與地球 (g = 9.8) 相比,飛行時間約為…",
        opts: ["6.1 × longer 長 6.1 倍", "Same 相同", "6.1 × shorter 短 6.1 倍", "2 × longer"], a: "6.1 × longer 長 6.1 倍",
        hint: "T ∝ 1/g → 9.8/1.6 ≈ 6.1. 時間與 g 成反比。" },
      { id: "e6", level: 4, q: "Two balls launched simultaneously: one dropped straight down, one fired horizontally from the same height. Which lands first?", qZh: "同一高度同時釋放:一球自由落下,一球水平拋出。哪個先落地?",
        opts: ["They land together 同時落地", "Dropped ball 自由落體先", "Fired ball 拋出先", "Depends on speed 視乎速率"], a: "They land together 同時落地",
        hint: "Vertical motions are identical (both start vy = 0, same g). 鉛直運動完全相同。" }
    ];

    function UpgradeCTA({ reason, onClose, onTrial }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4">
          <div className="w-full max-w-md rounded-2xl p-5 bg-white border border-slate-200">
            <h3 className="text-lg font-bold" style={{color: ACCENT}}>解鎖完整練習與家長進度</h3>
            <p className="text-sm mt-2 text-slate-600">{reason || window.SUBSCRIBE_CONFIG.bannerText}</p>
            <ul className="mt-3 text-sm space-y-1 list-disc list-inside text-slate-600">
              <li>Unlimited daily drills</li>
              <li>Full wrong-answer book</li>
              <li>Progress sync (coming)</li>
            </ul>
            <button type="button" onClick={onTrial} className="mt-4 w-full min-h-[48px] rounded-xl font-semibold text-white" style={{background: ACCENT}}>開始 14 日試用（本機）</button>
            <a href={HKC.MARKETING_PATH} className="mt-2 block w-full min-h-[44px] text-center leading-[44px] rounded-xl border border-slate-300 text-sm">了解家長計劃</a>
            <button type="button" onClick={onClose} className="mt-2 w-full text-sm underline text-slate-500">繼續免費</button>
          </div>
        </div>
      );
    }

    function Drill({ bank, label, onNeedUpgrade, onDone }) {
      const [qi, setQi] = useState(0);
      const [fb, setFb] = useState(null);
      const [score, setScore] = useState(0);
      const [hint, setHint] = useState(false);
      const [first, setFirst] = useState(true);
      const item = bank[qi];

      function pick(opt) {
        if (HKC.freeCapReached()) {
          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");
          onNeedUpgrade("今日免費練習已用完。");
          return;
        }
        HKC.recordDrillUse(APP_ID);
        const ok = opt === item.a;
        setFb(ok
          ? { ok: true, msg: "Correct · 正確" }
          : { ok: false, msg: "Not quite · 再想。Use Hint for the method (answer not shown)." });
        if (ok) {
          if (typeof HKC.recordOk === "function") HKC.recordOk(APP_ID, item);
          if (first) setScore(s => s + 1);
        } else {
          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
          HKC.recordSession(APP_ID, score, bank.length);
          onDone(score, bank.length);
        } else setQi(qi + 1);
      }

      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
          <div className="flex justify-between text-sm mb-3 text-slate-500">
            <span>{label} · Q {qi + 1}/{bank.length} · Lv {item.level}</span>
            <span>Score {score}</span>
          </div>
          <h2 className="text-lg font-bold mb-1">{item.q}</h2>
          {item.qZh ? <p className="text-sm mb-4 opacity-80" style={{color: ACCENT}}>{item.qZh}</p> : <div className="mb-4" />}
          <div className="grid gap-2">
            {item.opts.map(o => (
              <button key={o} type="button" disabled={fb && fb.ok} onClick={() => pick(o)}
                className="text-left px-4 py-3 rounded-xl min-h-[48px] disabled:opacity-50 bg-slate-50 hover:bg-slate-100 border border-slate-200">{o}</button>
            ))}
          </div>
          <button type="button" className="text-sm mt-3 font-semibold min-h-[44px]" style={{color: ACCENT}} onClick={() => setHint(true)}>Hint · 提示</button>
          {hint && <p className="text-sm mt-1 p-3 rounded-xl bg-amber-50 text-amber-900 border border-amber-200">{item.hint}</p>}
          {fb && (
            <div className={"mt-4 p-3 rounded-xl text-sm " + (fb.ok ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800")}>
              {fb.msg}
              {fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={next}>Next →</button>}
              {!fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={() => setFb(null)}>Retry</button>}
            </div>
          )}
        </section>
      );
    }

    function App() {
      const [mode, setMode] = useState("learn");
      const [progress, setProgress] = useState(() => HKC.loadProgress(APP_ID));
      const [pay, setPay] = useState(false);
      const [payReason, setPayReason] = useState("");
      const [doneMsg, setDoneMsg] = useState(null);
      const [tfzDone, setTfzDone] = useState(() => { try { return !!localStorage.getItem("hkc_tfz_" + APP_ID); } catch (e) { return false; } });

      function refresh() { setProgress(HKC.loadProgress(APP_ID)); }
      useEffect(() => { refresh(); }, [mode]);
      function completeTfz() {
        try { localStorage.setItem("hkc_tfz_" + APP_ID, "1"); } catch (e) {}
        setTfzDone(true); setMode("lab");
      }

      const tabs = [
        { id: "learn", label: "Learn · 學習" },
        { id: "lab", label: tfzDone ? "Lab · 實驗" : "Lab 🔒" },
        { id: "guided", label: "Guided · 引導" },
        { id: "exam", label: "Exam · 測驗" },
        { id: "review", label: "Review · 錯題" }
      ];

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-8">
          <a href="../../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>← Hub</a>
          <header className="mt-4 mb-4">
            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>F6 Physics · Motion in 2D</p>
            <h1 className="text-2xl sm:text-3xl font-bold mt-1">Projectile Motion</h1>
            <p className="text-slate-500 mt-1">拋體運動實驗室 · Learn (A1–A8) → Lab → Guided → Exam → Review</p>
          </header>

          <div className="text-sm border border-dashed rounded-lg px-3 py-2 mb-3 flex flex-wrap justify-between gap-2 items-center border-slate-300 bg-white/80">
            <span>{HKC.isPaid() ? (HKC.getEntitlement().tier + " · unlimited") : ("Free · " + HKC.remainingFree() + "/" + HKC.FREE_DAILY_CAP + " today")} · Best {progress.bestScore}</span>
            {!HKC.isPaid() && (
              <button type="button" className="px-3 py-1.5 rounded-md text-xs font-semibold text-white min-h-[36px]" style={{background: ACCENT}} onClick={() => setPay(true)}>Upgrade</button>
            )}
          </div>

          <nav className="flex flex-wrap gap-2 mb-4">
            {tabs.map(tab => (
              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}
                className={"px-3.5 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (mode === tab.id ? "text-white" : "bg-white border border-slate-200 text-slate-700")}
                style={mode === tab.id ? {background: ACCENT} : {}}>
                {tab.label}
              </button>
            ))}
          </nav>

          {mode === "learn" && <LearnFromZero steps={TFZ_STEPS} onComplete={completeTfz} />}

          {mode === "lab" && !tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-xl font-bold">Finish Learn From Zero first · 先完成 A1–A8</h2>
              <p className="text-sm text-slate-500 mt-2">We teach the model before you play — that is how real understanding sticks. 先學模型,後做實驗。</p>
              <button type="button" className="mt-4 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[48px]" style={{background: ACCENT}} onClick={() => setMode("learn")}>Go to Learn →</button>
            </section>
          )}
          {mode === "lab" && tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
              <h2 className="font-bold text-lg mb-3">Ballistics Sandbox · 彈道沙盤</h2>
              <ProjectileSim />
            </section>
          )}

          {mode === "guided" && !doneMsg && (
            <Drill bank={GUIDED} label="Guided" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); refresh(); }} />
          )}
          {mode === "exam" && !doneMsg && (
            <Drill bank={EXAM} label="Exam" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "review" }); refresh(); }} />
          )}
          {doneMsg && (mode === "guided" || mode === "exam") && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-2xl font-bold">Complete</h2>
              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>Continue →</button>
            </section>
          )}
          {mode === "review" && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3">
              <h2 className="font-bold text-lg">Wrong-answer book · 錯題簿</h2>
              {(progress.wrongBook || []).length === 0 && <p className="text-sm text-slate-500">No wrong answers yet · 暫無錯題</p>}
              {(progress.wrongBook || []).map(w => (
                <div key={w.id} className="rounded-xl p-3 text-sm border border-slate-200">
                  <p className="font-semibold">{w.prompt}</p>
                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>
                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">Answer unlocked</p>}
                  <button type="button" className="text-xs underline mt-2 text-slate-500" onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>Mark resolved</button>
                </div>
              ))}
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
