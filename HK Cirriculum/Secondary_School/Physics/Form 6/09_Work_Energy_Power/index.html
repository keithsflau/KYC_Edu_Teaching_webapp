<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F6 · Work Energy Power | 功能量功率</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <link rel="stylesheet" href="../../../../common/subscribe-gate.css" />
  <script>
    window.HKC_SUBSCRIBE = {
      appId: "f6-phy-energy",
      appNameZh: "功能量功率",
      appNameEn: "Work Energy Power",
      level: "F6",
      subject: "Physics",
      freeDrillLimit: 8,
      wrongBookLimit: 10,
      contactEmail: "support@hksteamai.com",
      comingSoonHref: "../../../../pricing/index.html#payment-links"
    };
  </script>
  <script src="../../../../common/subscribe-gate.js"></script>
  <script src="../../../../common/parent-report.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "IBM Plex Sans", system-ui, sans-serif; background: radial-gradient(ellipse 80% 50% at 10% -10%, #b4530922, transparent 55%), #f8fafc; color: #0f172a; min-height: 100vh; }
    input[type="range"] { accent-color: #b45309; }
    button, a { -webkit-tap-highlight-color: transparent; }
  </style>
<!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body class="text-slate-800">
  <!-- SUBSCRIBE_GATE: Marketing owns tiers. Free core must work offline. -->
  <div id="root"></div>
  <script>
    window.SUBSCRIBE_CONFIG = {
      enabled: true,
      bannerText: "解鎖完整練習與家長進度 · 全年少於一次補習堂費",
      premiumFeatures: ["progress_sync", "parent_dashboard", "unlimited_mocks"]
    };
  </script>
  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect } = React;
    const APP_ID = "f6_phy_energy";
    const ACCENT = "#b45309";

    const HKC = (function () {
      function progressView() {
        const p = (window.HkcSubscribe && HkcSubscribe.getProgress()) || { drillsCorrect: 0, modulesCompleted: [], wrongBook: [], drillsAttempted: 0 };
        return {
          bestScore: p.drillsCorrect || 0,
          sessions: (p.modulesCompleted || []).length,
          totalCorrect: p.drillsCorrect || 0,
          totalAttempted: p.drillsAttempted || 0,
          wrongBook: (p.wrongBook || []).map((w, i) => ({ id: String(i) + "-" + (w.at || ""), prompt: w.label || "", hint: w.topic || "", answer: null, at: w.at })),
          modeCleared: {}
        };
      }
      return {
        FREE_DAILY_CAP: 8,
        MARKETING_PATH: "../../../../pricing/index.html#payment-links",
        isPaid: () => !!(window.HkcSubscribe && HkcSubscribe.features().canDrillUnlimited && !HkcSubscribe.isClassroom()),
        getEntitlement: () => (window.HkcSubscribe ? HkcSubscribe.getEntitlement() : { tier: "free" }),
        remainingFree: () => {
          if (!window.HkcSubscribe) return 8;
          const r = HkcSubscribe.remainingFree();
          return r === Infinity ? Infinity : r;
        },
        freeCapReached: () => !(window.HkcSubscribe && HkcSubscribe.canContinueDrills()),
        recordDrillUse: () => {},
        loadProgress: progressView,
        saveProgress: () => progressView(),
        addWrong: (appId, item) => {
          if (window.HkcSubscribe) HkcSubscribe.recordDrill({ correct: false, label: (item.prompt || item.q || String(item.id) || "").toString().slice(0, 48), topic: (item.hint || "").toString().slice(0, 80), module: "practice" });
        },
        recordOk: (appId, item) => {
          if (window.HkcSubscribe) HkcSubscribe.recordDrill({ correct: true, label: (item && (item.prompt || item.q || item.id) || "drill").toString().slice(0, 48), topic: "", module: "practice" });
        },
        removeWrong: () => {},
        recordSession: (appId, score, total) => {
          if (window.HkcSubscribe) HkcSubscribe.recordModule({ id: "session-" + Date.now(), label: "Session", score, total });
        },
        startTrialLocal: () => { if (window.HkcSubscribe) HkcSubscribe.setLocalEntitlement("trial", 14); }
      };
    })();

    const GUIDED = [
      { id: "g1", level: 1, q: "A 10 N force pushes a box 3 m along the direction of the force. Work done?", qZh: "10 N 力沿推力方向推箱 3 m,作功多少?",
        opts: ["30 J", "13 J", "7 J", "300 J"], a: "30 J",
        hint: "W = F s cosθ; θ = 0° → W = Fs. W = Fs,力與位移同向。" },
      { id: "g2", level: 1, q: "A 2 kg object moves at 4 m/s. Its kinetic energy is…", qZh: "2 kg 物體以 4 m/s 運動,動能為…",
        opts: ["16 J", "8 J", "32 J", "4 J"], a: "16 J",
        hint: "KE = ½mv² = ½ × 2 × 16. 代入 ½mv²。" },
      { id: "g3", level: 1, q: "A 2 kg mass is raised 5 m (g = 10 m/s²). GPE gained?", qZh: "2 kg 物體升高 5 m(g=10),重力勢能增加?",
        opts: ["100 J", "50 J", "10 J", "25 J"], a: "100 J",
        hint: "GPE = mgh = 2 × 10 × 5. 用 mgh。" },
      { id: "g4", level: 2, q: "A 20 N force acts at 60° to displacement 2 m. Work done (cos 60° = 0.5)?", qZh: "20 N 力與位移夾 60°,位移 2 m,作功(cos60°=0.5)?",
        opts: ["20 J", "40 J", "10 J", "0 J"], a: "20 J",
        hint: "W = Fs cosθ = 20 × 2 × 0.5. 只有沿位移分量作功。" },
      { id: "g5", level: 2, q: "In the Learn slider (m = 2 kg, h = 5 m, g = 10), mgh equals…", qZh: "學習區滑桿(m=2 kg,h=5 m,g=10),mgh 等於…",
        opts: ["100 J", "50 J", "10 J", "20 J"], a: "100 J",
        hint: "Match the displayed GPE: 2 × 10 × 5. 對照滑桿顯示值。" },
      { id: "g6", level: 2, q: "Power is defined as…", qZh: "功率定義為…",
        opts: ["Work done per unit time 單位時間作功", "Force × distance 力×距離", "Mass × velocity 質量×速度", "Energy × time 能量×時間"], a: "Work done per unit time 單位時間作功",
        hint: "P = W/t (or Fv when F ∥ v). P = W/t。" }
    ];
    const EXAM = [
      { id: "e1", level: 3, q: "A 0.5 kg ball at 6 m/s. KE = ?", qZh: "0.5 kg 球速 6 m/s,動能?",
        opts: ["9 J", "18 J", "3 J", "36 J"], a: "9 J",
        hint: "KE = ½ × 0.5 × 36 = 9 J. ½mv²。" },
      { id: "e2", level: 3, q: "A motor does 600 J of work in 4 s. Its power output?", qZh: "馬達 4 s 內作功 600 J,輸出功率?",
        opts: ["150 W", "2400 W", "600 W", "75 W"], a: "150 W",
        hint: "P = W/t = 600/4. 功率 = 功/時間。" },
      { id: "e3", level: 3, q: "A 3 kg object falls 4 m (no air resistance, g = 10). Speed just before ground (GPE → KE)?", qZh: "3 kg 物自由落 4 m(無阻力,g=10),著地前速率(GPE→KE)?",
        opts: ["≈ 8.9 m/s (√(2gh))", "4 m/s", "10 m/s", "40 m/s"], a: "≈ 8.9 m/s (√(2gh))",
        hint: "mgh = ½mv² → v = √(2gh) = √80. 能量守恆:mgh = ½mv²。" },
      { id: "e4", level: 4, q: "A car engine provides constant 2000 N thrust at 25 m/s. Power?", qZh: "汽車引擎恆 2000 N 推力,速率 25 m/s,功率?",
        opts: ["50 000 W (50 kW)", "2000 W", "80 W", "500 W"], a: "50 000 W (50 kW)",
        hint: "P = Fv when F parallel to v. P = Fv。" },
      { id: "e5", level: 4, q: "A 4 kg block slides down a frictionless 3 m slope (vertical drop 1.5 m, g = 10). Speed at bottom?", qZh: "4 kg 物沿無摩擦斜面下滑 3 m(垂直降 1.5 m,g=10),底端速率?",
        opts: ["≈ 5.5 m/s (√(2gΔh))", "3 m/s", "10 m/s", "1.5 m/s"], a: "≈ 5.5 m/s (√(2gΔh))",
        hint: "Only vertical drop matters for GPE: v = √(2gΔh). 只看垂直高度差。" },
      { id: "e6", level: 4, q: "A 50 N horizontal force drags a crate 10 m on rough floor; 200 J lost to friction. Net work on crate?", qZh: "50 N 水平力拉箱 10 m,摩擦耗 200 J,對箱淨作功?",
        opts: ["300 J", "500 J", "200 J", "50 J"], a: "300 J",
        hint: "Work by applied force = 500 J; net mechanical = 500 − 200. 外力功減摩擦損失。" }
    ];

    function LearnExtra(){const [h,setH]=useState(5);const m=2;const gpe=(m*10*h);return (<div className="mt-3 space-y-2"><label className="text-sm font-semibold">h={h} m · mgh≈{gpe} J (g=10)</label><input type="range" min="0" max="20" value={h} onChange={e=>setH(+e.target.value)} className="w-full" /><p className="text-sm p-3 rounded-xl bg-amber-50 border border-amber-100">Falling converts GPE → KE (ideal).</p></div>);}

    function UpgradeCTA({ reason, onClose, onTrial }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4">
          <div className={"w-full max-w-md rounded-2xl p-5 " + (false ? "bg-slate-900 border border-slate-600" : "bg-white border border-slate-200") }>
            <h3 className="text-lg font-bold" style={{color: ACCENT}}>解鎖完整練習與家長進度</h3>
            <p className={"text-sm mt-2 " + (false ? "text-slate-300" : "text-slate-600")}>{reason || window.SUBSCRIBE_CONFIG.bannerText}</p>
            <ul className={"mt-3 text-sm space-y-1 list-disc list-inside " + (false ? "text-slate-300" : "text-slate-600")}>
              <li>Unlimited daily drills</li>
              <li>Full wrong-answer book</li>
              <li>Progress sync (coming)</li>
            </ul>
            <button type="button" onClick={onTrial} className="mt-4 w-full min-h-[48px] rounded-xl font-semibold text-white" style={{background: ACCENT}}>開始 14 日試用（本機）</button>
            <a href={HKC.MARKETING_PATH} className={"mt-2 block w-full min-h-[44px] text-center leading-[44px] rounded-xl border text-sm " + (false ? "border-slate-600" : "border-slate-300")}>了解家長計劃</a>
            <button type="button" onClick={onClose} className={"mt-2 w-full text-sm underline " + (false ? "text-slate-400" : "text-slate-500")}>繼續免費</button>
          </div>
        </div>
      );
    }

    function Drill({ bank, label, onNeedUpgrade, onDone }) {
      const [qi, setQi] = useState(0);
      const [fb, setFb] = useState(null);
      const [score, setScore] = useState(0);
      const [hint, setHint] = useState(false);
      const [first, setFirst] = useState(true);
      const item = bank[qi];

      function pick(opt) {
        if (HKC.freeCapReached()) {
          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");
          onNeedUpgrade("今日免費練習已用完。");
          return;
        }
        HKC.recordDrillUse(APP_ID);
        const ok = opt === item.a;
        setFb(ok
          ? { ok: true, msg: "Correct · 正確" }
          : { ok: false, msg: "Not quite · 再想。Use Hint for the method (answer not shown)." });
        if (ok) {
          if (typeof HKC.recordOk === "function") HKC.recordOk(APP_ID, item);
          if (first) setScore(s => s + 1);
        } else {
          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
          HKC.recordSession(APP_ID, score, bank.length);
          onDone(score, bank.length);
        } else setQi(qi + 1);
      }

      return (
        <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5"}>
          <div className={"flex justify-between text-sm mb-3 " + (false ? "text-slate-400" : "text-slate-500")}>
            <span>{label} · Q {qi + 1}/{bank.length} · Lv {item.level}</span>
            <span>Score {score}</span>
          </div>
          <h2 className="text-lg font-bold mb-1">{item.q}</h2>
          {item.qZh ? <p className="text-sm mb-4 opacity-80" style={{color: ACCENT}}>{item.qZh}</p> : <div className="mb-4" />}
          <div className="grid gap-2">
            {item.opts.map(o => (
              <button key={o} type="button" disabled={fb && fb.ok} onClick={() => pick(o)}
                className={"text-left px-4 py-3 rounded-xl min-h-[48px] disabled:opacity-50 bg-slate-50 hover:bg-slate-100 border border-slate-200"}>{o}</button>
            ))}
          </div>
          <button type="button" className="text-sm mt-3 font-semibold min-h-[44px]" style={{color: ACCENT}} onClick={() => setHint(true)}>Hint · 提示</button>
          {hint && <p className={"text-sm mt-1 p-3 rounded-xl " + (false ? "bg-amber-950/50 text-amber-100 border border-amber-800/40" : "bg-amber-50 text-amber-900 border border-amber-200")}>{item.hint}</p>}
          {fb && (
            <div className={"mt-4 p-3 rounded-xl text-sm " + (fb.ok ? (false ? "bg-emerald-900/40 text-emerald-200" : "bg-emerald-50 text-emerald-800") : (false ? "bg-rose-900/40 text-rose-200" : "bg-rose-50 text-rose-800"))}>
              {fb.msg}
              {fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={next}>Next →</button>}
              {!fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={() => setFb(null)}>Retry</button>}
            </div>
          )}
        </section>
      );
    }

    function App() {
      const [mode, setMode] = useState("learn");
      const [progress, setProgress] = useState(() => HKC.loadProgress(APP_ID));
      const [pay, setPay] = useState(false);
      const [payReason, setPayReason] = useState("");
      const [doneMsg, setDoneMsg] = useState(null);

      function refresh() { setProgress(HKC.loadProgress(APP_ID)); }
      useEffect(() => { refresh(); }, [mode]);

      const tabs = [
        { id: "learn", label: "Learn · 學習" },
        { id: "guided", label: "Guided · 引導" },
        { id: "exam", label: "Exam · 測驗" },
        { id: "review", label: "Review · 錯題" }
      ];

      return (
        <div className="max-w-3xl mx-auto p-4 sm:p-8">
          <a href="../../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>← Hub</a>
          <header className="mt-4 mb-4">
            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>F6 Physics · Mechanics energy</p>
            <h1 className="text-2xl sm:text-3xl font-bold mt-1">Work Energy Power</h1>
            <p className="text-slate-500 mt-1">功能量功率 · Learn → Guided → Exam → Review · 12 items</p>
          </header>

          <div className={"text-sm border border-dashed rounded-lg px-3 py-2 mb-3 flex flex-wrap justify-between gap-2 items-center " + (false ? "border-slate-600 bg-slate-900/80" : "border-slate-300 bg-white/80")}>
            <span>{HKC.isPaid() ? (HKC.getEntitlement().tier + " · unlimited") : ("Free · " + HKC.remainingFree() + "/" + HKC.FREE_DAILY_CAP + " today")} · Best {progress.bestScore}</span>
            {!HKC.isPaid() && (
              <button type="button" className="px-3 py-1.5 rounded-md text-xs font-semibold text-white min-h-[36px]" style={{background: ACCENT}} onClick={() => setPay(true)}>Upgrade</button>
            )}
          </div>

          <nav className="flex flex-wrap gap-2 mb-4">
            {tabs.map(tab => (
              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}
                className={"px-3.5 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (mode === tab.id ? "text-white" : "bg-white border border-slate-200 text-slate-700")}
                style={mode === tab.id ? {background: ACCENT} : {}}>
                {tab.label}
              </button>
            ))}
          </nav>

          {mode === "learn" && (
            <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3"}>
              <h2 className="font-bold text-lg">Key ideas</h2>
              <ul className={"text-sm space-y-2 list-disc list-inside " + (false ? "text-slate-300" : "text-slate-600")}>
                <li>W = F s cosθ; KE = ½mv²; GPE = mgh.</li><li>Mechanical energy conserved if non-conservative work ≈ 0.</li><li>Power = work/time = Fv for constant F parallel.</li>
              </ul>
              <LearnExtra />
              <button type="button" className="mt-2 px-4 py-2.5 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}} onClick={() => setMode("guided")}>
                Start guided practice →
              </button>
            </section>
          )}

          {mode === "guided" && !doneMsg && (
            <Drill bank={GUIDED} label="Guided" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); refresh(); }} />
          )}
          {mode === "exam" && !doneMsg && (
            <Drill bank={EXAM} label="Exam" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "review" }); refresh(); }} />
          )}
          {doneMsg && (mode === "guided" || mode === "exam") && (
            <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center"}>
              <h2 className="text-2xl font-bold">Complete</h2>
              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>Continue →</button>
            </section>
          )}
          {mode === "review" && (
            <section className={"bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3"}>
              <h2 className="font-bold text-lg">Wrong-answer book · 錯題簿</h2>
              {(progress.wrongBook || []).length === 0 && <p className={"text-sm " + (false ? "text-slate-400" : "text-slate-500")}>No wrong answers yet · 暫無錯題</p>}
              {(progress.wrongBook || []).map(w => (
                <div key={w.id} className={"rounded-xl p-3 text-sm " + (false ? "border border-slate-700" : "border border-slate-200")}>
                  <p className="font-semibold">{w.prompt}</p>
                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>
                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">Answer unlocked</p>}
                  <button type="button" className={"text-xs underline mt-2 " + (false ? "text-slate-400" : "text-slate-500")} onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>Mark resolved</button>
                </div>
              ))}
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
