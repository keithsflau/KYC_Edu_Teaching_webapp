    function LearnFromZero({ steps, onComplete }) {
      const [i, setI] = useState(0);
      const [picked, setPicked] = useState(null);
      const step = steps[i];
      const last = i === steps.length - 1;
      function pick(opt) { if (picked) return; setPicked(opt); }
      function next() {
        if (last) { onComplete(); return; }
        setI(i + 1); setPicked(null);
      }
      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-6">
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs font-black uppercase tracking-widest" style={{color: ACCENT}}>Learn From Zero · 由零開始學</p>
            <p className="text-xs text-slate-500">{step.id} / A{steps.length}</p>
          </div>
          <div className="flex gap-1.5 mb-4">
            {steps.map((s, k) => (
              <div key={s.id} className="h-1.5 flex-1 rounded-full" style={{background: k <= i ? ACCENT : "#e2e8f0"}} />
            ))}
          </div>
          <h2 className="text-xl font-bold">{step.title}</h2>
          <p className="text-sm font-semibold text-slate-500 mt-0.5">{step.titleZh}</p>
          <p className="text-sm mt-3 text-slate-700 leading-relaxed">{step.body}</p>
          <p className="text-sm mt-2 text-slate-500 leading-relaxed">{step.bodyZh}</p>
          <div className="mt-4 p-3 rounded-xl bg-indigo-50 border border-indigo-200">
            <p className="text-sm font-bold">{step.q}</p>
            <p className="text-xs text-slate-500 mb-2">{step.qZh}</p>
            <div className="grid gap-2">
              {step.opts.map(o => {
                let cls = "text-left px-3 py-2.5 rounded-xl text-sm border min-h-[44px] ";
                if (!picked) cls += "bg-white border-slate-200 hover:bg-slate-50";
                else if (o === step.a) cls += "bg-emerald-50 border-emerald-300 text-emerald-800 font-semibold";
                else if (o === picked) cls += "bg-rose-50 border-rose-300 text-rose-800";
                else cls += "bg-white border-slate-200 opacity-60";
                return <button key={o} type="button" className={cls} onClick={() => pick(o)}>{o}</button>;
              })}
            </div>
            {picked && (
              <div className="mt-3 text-sm p-3 rounded-lg bg-white/70 border border-slate-200">
                <p className="font-semibold">{picked === step.a ? "✓ Correct · 正確" : "✗ Not quite — see why · 再想想"}</p>
                <p className="mt-1 text-slate-600">{step.why}</p>
                {picked === step.a && (
                  <button type="button" onClick={next} className="mt-3 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[44px]" style={{background: ACCENT}}>
                    {last ? "Unlock the Lab → 解鎖實驗室" : "Next step →"}
                  </button>
                )}
              </div>
            )}
          </div>
        </section>
      );
    }


    function WaveSim() {
      const [lam, setLam] = useState(16);
      const [sep, setSep] = useState(120);
      const [freq, setFreq] = useState(1);
      const [running, setRunning] = useState(true);
      const [probe, setProbe] = useState(null);
      const cv = useRef(null);
      const S = useRef({ t: 0 });
      const GW = 180, GH = 100;

      useEffect(() => {
        let raf, last = performance.now();
        const off = document.createElement("canvas");
        off.width = GW; off.height = GH;
        const octx = off.getContext("2d");
        const img = octx.createImageData(GW, GH);
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000); last = now;
          if (running) S.current.t += dt * freq;
          render(cv.current, off, octx, img);
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      }, [running, lam, sep, freq]);

      function render(c, off, octx, img) {
        if (!c) return;
        const t = S.current.t;
        const s1x = GW / 2 - (sep / 8), s2x = GW / 2 + (sep / 8), sy = 34;
        const k = (2 * Math.PI) / (lam / 4);
        const w = 2 * Math.PI * 1.6;
        const d = img.data;
        let p = 0;
        for (let y = 0; y < GH; y++) {
          for (let x = 0; x < GW; x++) {
            const r1 = Math.hypot(x - s1x, y - sy), r2 = Math.hypot(x - s2x, y - sy);
            const A = Math.sin(k * r1 - w * t) / (1 + r1 * 0.06) + Math.sin(k * r2 - w * t) / (1 + r2 * 0.06);
            const v = Math.max(-1, Math.min(1, A));
            const bright = v * v;
            if (v >= 0) { d[p] = 20 + 200 * bright; d[p + 1] = 120 + 130 * bright; d[p + 2] = 180 + 75 * bright; }
            else { d[p] = 10 + 40 * bright; d[p + 1] = 30 + 70 * bright; d[p + 2] = 60 + 120 * bright; }
            d[p + 3] = 255;
            p += 4;
          }
        }
        octx.putImageData(img, 0, 0);
        const ctx = c.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.drawImage(off, 0, 0, c.width, c.height);
        ctx.fillStyle = "#fbbf24";
        [s1x, s2x].forEach(sx => {
          ctx.beginPath(); ctx.arc(sx * 4, sy * 4, 7, 0, 7); ctx.fill();
          ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2; ctx.stroke();
        });
        ctx.font = "bold 13px IBM Plex Sans"; ctx.fillStyle = "#f8fafc";
        ctx.fillText("S₁", s1x * 4 - 24, sy * 4 + 5); ctx.fillText("S₂", s2x * 4 + 14, sy * 4 + 5);
        if (probe) {
          ctx.strokeStyle = "#f472b6"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(probe.x, probe.y, 9, 0, 7); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(s1x * 4, sy * 4); ctx.lineTo(probe.x, probe.y); ctx.moveTo(s2x * 4, sy * 4); ctx.lineTo(probe.x, probe.y);
          ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
        }
        ctx.fillStyle = "rgba(2,6,23,.75)"; ctx.fillRect(0, c.height - 26, 360, 26);
        ctx.fillStyle = "#e2e8f0"; ctx.font = "12px IBM Plex Sans";
        ctx.fillText("λ = " + lam + " mm · d = " + sep + " mm · v = fλ = " + (freq * lam).toFixed(0) + " mm/s (model units)", 10, c.height - 8);
      }

      function onMove(e) {
        const rect = cv.current.getBoundingClientRect();
        const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        const x = (cx / rect.width) * 720, y = (cy / rect.height) * 400;
        const s1x = (720 / 2 - sep * 2), s2x = (720 / 2 + sep * 2), sy = 136;
        const r1 = Math.hypot(x - s1x, y - sy), r2 = Math.hypot(x - s2x, y - sy);
        const drPx = Math.abs(r1 - r2);
        const drLam = drPx / (lam * 4);
        const m = drLam % 1;
        const kind = Math.min(m, 1 - m) < 0.12 ? "CONSTRUCTIVE 相長 (antinode 腹點)" : (Math.abs(m - 0.5) < 0.12 ? "DESTRUCTIVE 相消 (node 節點)" : "in-between 過渡區");
        setProbe({ x, y, drLam, kind });
      }

      return (
        <div className="space-y-3">
          <div className="flex flex-wrap gap-2 items-center">
            <button type="button" onClick={() => setRunning(r => !r)} className="px-3 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-white min-h-[44px]">{running ? "⏸ Pause" : "▶ Play"}</button>
            <button type="button" onClick={() => { S.current.t = 0; }} className="px-3 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 min-h-[44px]">↺ Reset phase</button>
            <span className="text-xs text-slate-500">Move pointer over tank to probe 移動指針探測程差</span>
          </div>
          <canvas ref={cv} className="sim" width="720" height="400" style={{background: "#082f49", touchAction: "none"}}
            onMouseMove={onMove} onTouchMove={onMove} onClick={onMove} />
          <div className="grid sm:grid-cols-3 gap-3">
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Wavelength λ 波長 · {lam} mm
              <input type="range" min="8" max="30" step="1" value={lam} onChange={e => setLam(+e.target.value)} className="w-full mt-2" /></label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Source separation d 波源距離 · {sep} mm
              <input type="range" min="40" max="220" step="5" value={sep} onChange={e => setSep(+e.target.value)} className="w-full mt-2" /></label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Frequency f 頻率 · {freq.toFixed(1)} Hz
              <input type="range" min="0.5" max="2" step="0.1" value={freq} onChange={e => setFreq(+e.target.value)} className="w-full mt-2" /></label>
          </div>
          <div className="flex flex-wrap gap-2 text-sm">
            {probe
              ? <React.Fragment>
                  <span className="px-3 py-1.5 rounded-full bg-pink-100 text-pink-800 font-bold">Δr = {probe.drLam.toFixed(2)} λ</span>
                  <span className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 font-semibold">{probe.kind}</span>
                </React.Fragment>
              : <span className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-semibold">Probe the tank 探測水槽以讀取程差 Δr</span>}
          </div>
        </div>
      );
    }

    const GUIDED = [
      { id: "g1", level: 1, q: "Two crests arrive at a point together. The displacement there is…", qZh: "兩波峰同時到達某點,該點位移…",
        opts: ["The sum — bigger crest 相加,更大波峰", "Zero 零", "The difference 相減", "Random 隨機"], a: "The sum — bigger crest 相加,更大波峰",
        hint: "Superposition: displacements add. 疊加原理。" },
      { id: "g2", level: 1, q: "For stable interference, the two sources must be coherent. This means same…", qZh: "穩定干涉要求兩波源相干,即相同的…",
        opts: ["Frequency & constant phase relation 頻率及恒定相位關係", "Amplitude 振幅", "Colour 顏色", "Temperature 溫度"], a: "Frequency & constant phase relation 頻率及恒定相位關係",
        hint: "Coherent = same f, fixed phase difference. 同頻、相位差恒定。" },
      { id: "g3", level: 1, q: "v = fλ. A wave with f = 5 Hz and λ = 0.4 m travels at…", qZh: "f = 5 Hz、λ = 0.4 m 的波,波速為…",
        opts: ["2 m/s", "12.5 m/s", "0.08 m/s", "5.4 m/s"], a: "2 m/s",
        hint: "v = 5 × 0.4. 直接代入 v = fλ。" },
      { id: "g4", level: 2, q: "Point P is 6λ from S₁ and 9.5λ from S₂ (in-phase sources). At P we find…", qZh: "P 點距 S₁ 為 6λ、距 S₂ 為 9.5λ(同相波源),P 點為…",
        opts: ["A node 節點 (destructive 相消)", "An antinode 腹點", "Maximum speed 最高速率"], a: "A node 節點 (destructive 相消)",
        hint: "Δr = 3.5λ = 7 half-wavelengths (odd) → destructive. 半波長奇數倍相消。" },
      { id: "g5", level: 2, q: "In the tank, moving the sources FURTHER apart makes the fringes…", qZh: "水槽中把波源拉遠,條紋…",
        opts: ["Closer together 變密", "Further apart 變疏", "Disappear 消失"], a: "Closer together 變密",
        hint: "Fringe spacing ∝ λ/d. Bigger d → finer fringes. 間距與 d 成反比。" },
      { id: "g6", level: 2, q: "Along the central line (equal distance to both sources), the water is always…", qZh: "中垂線上(到兩波源等距),水面總是…",
        opts: ["An antinode — Δr = 0 腹點", "A node 節點", "Flat 不動"], a: "An antinode — Δr = 0 腹點",
        hint: "Δr = 0 = mλ with m = 0 → constructive. 零程差即相長。" }
    ]
    const EXAM = [
      { id: "e1", level: 3, q: "Sources S₁, S₂ in phase, 60 mm apart, λ = 10 mm. Point with Δr = 25 mm is…", qZh: "同相波源相距 60 mm,λ = 10 mm。程差 25 mm 的點為…",
        opts: ["Nodal 節點", "Antinodal 腹點", "Central maximum 中央亮紋"], a: "Nodal 節點",
        hint: "25 mm = 2.5λ → odd half-wavelengths → destructive. 換算成波長倍數。" },
      { id: "e2", level: 3, q: "The same ripple-tank pattern explains double-slit light fringes because both rely on…", qZh: "水波干涉圖樣可解釋光的雙縫條紋,因為兩者都基於…",
        opts: ["Superposition from two coherent sources 兩相干波源的疊加", "Refraction 折射", "Photoelectric effect 光電效應", "Polarisation 偏振"], a: "Superposition from two coherent sources 兩相干波源的疊加",
        hint: "Same principle, different medium: path difference decides fringes. 同一疊加原理。" },
      { id: "e3", level: 3, q: "If the two dippers are driven at DIFFERENT frequencies, the pattern…", qZh: "若兩振子以不同頻率驅動,圖樣…",
        opts: ["Blurs and drifts — no stable fringes 模糊漂移,無穩定條紋", "Gets sharper 更清晰", "Stays identical 不變", "Stops instantly 立即停止"], a: "Blurs and drifts — no stable fringes 模糊漂移,無穩定條紋",
        hint: "Coherence fails: phase difference changes with time. 相位差隨時間改變。" },
      { id: "e4", level: 4, q: "Red light (long λ) and blue light (short λ) through the same double slit: which fringes are wider spaced?", qZh: "紅光(長 λ)與藍光(短 λ)通過同一雙縫,哪個條紋較疏?",
        opts: ["Red 紅光", "Blue 藍光", "Same 相同"], a: "Red 紅光",
        hint: "Fringe spacing ∝ λ/d. Longer λ → wider fringes. 間距與波長成正比。" },
      { id: "e5", level: 4, q: "At an antinode, the amplitude is A₁ + A<sub>2</sub>. The INTENSITY there (I ∝ A<sup>2</sup>) compared with one source alone is…", qZh: "腹點振幅為 A₁ + A<sub>2</sub>。該處強度(I ∝ A<sup>2</sup>)與單一波源相比為…",
        opts: ["4× (for equal amplitudes) 4 倍", "2× 2 倍", "√2×", "Same 相同"], a: "4× (for equal amplitudes) 4 倍",
        hint: "Amplitude doubles → intensity squares: (2A)² = 4A<sup>2</sup>. 振幅加倍,強度四倍。" },
      { id: "e6", level: 4, q: "A student claims: 'At a node, energy is destroyed.' Correct statement?", qZh: "有學生說:「節點處能量被消滅。」正確說法是…",
        opts: ["Energy is redistributed — nodes are calm because antinodes carry more 能量重新分佈", "True — cancellation destroys energy 真的,能量被消滅", "Energy converts to mass 變成質量", "It depends on λ 視乎波長"], a: "Energy is redistributed — nodes are calm because antinodes carry more 能量重新分佈",
        hint: "Conservation of energy: calm nodes ↔ extra-lively antinodes. 能量守恆,只是重新分佈。" }
    ]

    function UpgradeCTA({ reason, onClose, onTrial }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4">
          <div className="w-full max-w-md rounded-2xl p-5 bg-white border border-slate-200">
            <h3 className="text-lg font-bold" style={{color: ACCENT}}>解鎖完整練習與家長進度</h3>
            <p className="text-sm mt-2 text-slate-600">{reason || window.SUBSCRIBE_CONFIG.bannerText}</p>
            <ul className="mt-3 text-sm space-y-1 list-disc list-inside text-slate-600">
              <li>Unlimited daily drills</li>
              <li>Full wrong-answer book</li>
              <li>Progress sync (coming)</li>
            </ul>
            <button type="button" onClick={onTrial} className="mt-4 w-full min-h-[48px] rounded-xl font-semibold text-white" style={{background: ACCENT}}>開始 14 日試用（本機）</button>
            <a href={HKC.MARKETING_PATH} className="mt-2 block w-full min-h-[44px] text-center leading-[44px] rounded-xl border border-slate-300 text-sm">了解家長計劃</a>
            <button type="button" onClick={onClose} className="mt-2 w-full text-sm underline text-slate-500">繼續免費</button>
          </div>
        </div>
      );
    }

    function Drill({ bank, label, onNeedUpgrade, onDone }) {
      const [qi, setQi] = useState(0);
      const [fb, setFb] = useState(null);
      const [score, setScore] = useState(0);
      const [hint, setHint] = useState(false);
      const [first, setFirst] = useState(true);
      const item = bank[qi];

      function pick(opt) {
        if (HKC.freeCapReached()) {
          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");
          onNeedUpgrade("今日免費練習已用完。");
          return;
        }
        HKC.recordDrillUse(APP_ID);
        const ok = opt === item.a;
        setFb(ok
          ? { ok: true, msg: "Correct · 正確" }
          : { ok: false, msg: "Not quite · 再想。Use Hint for the method (answer not shown)." });
        if (ok) {
          if (typeof HKC.recordOk === "function") HKC.recordOk(APP_ID, item);
          if (first) setScore(s => s + 1);
        } else {
          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
          HKC.recordSession(APP_ID, score, bank.length);
          onDone(score, bank.length);
        } else setQi(qi + 1);
      }

      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
          <div className="flex justify-between text-sm mb-3 text-slate-500">
            <span>{label} · Q {qi + 1}/{bank.length} · Lv {item.level}</span>
            <span>Score {score}</span>
          </div>
          <h2 className="text-lg font-bold mb-1">{item.q}</h2>
          {item.qZh ? <p className="text-sm mb-4 opacity-80" style={{color: ACCENT}}>{item.qZh}</p> : <div className="mb-4" />}
          <div className="grid gap-2">
            {item.opts.map(o => (
              <button key={o} type="button" disabled={fb && fb.ok} onClick={() => pick(o)}
                className="text-left px-4 py-3 rounded-xl min-h-[48px] disabled:opacity-50 bg-slate-50 hover:bg-slate-100 border border-slate-200">{o}</button>
            ))}
          </div>
          <button type="button" className="text-sm mt-3 font-semibold min-h-[44px]" style={{color: ACCENT}} onClick={() => setHint(true)}>Hint · 提示</button>
          {hint && <p className="text-sm mt-1 p-3 rounded-xl bg-amber-50 text-amber-900 border border-amber-200">{item.hint}</p>}
          {fb && (
            <div className={"mt-4 p-3 rounded-xl text-sm " + (fb.ok ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800")}>
              {fb.msg}
              {fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={next}>Next →</button>}
              {!fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={() => setFb(null)}>Retry</button>}
            </div>
          )}
        </section>
      );
    }

    function App() {
      const [mode, setMode] = useState("learn");
      const [progress, setProgress] = useState(() => HKC.loadProgress(APP_ID));
      const [pay, setPay] = useState(false);
      const [payReason, setPayReason] = useState("");
      const [doneMsg, setDoneMsg] = useState(null);
      const [tfzDone, setTfzDone] = useState(() => { try { return !!localStorage.getItem("hkc_tfz_" + APP_ID); } catch (e) { return false; } });

      function refresh() { setProgress(HKC.loadProgress(APP_ID)); }
      useEffect(() => { refresh(); }, [mode]);
      function completeTfz() {
        try { localStorage.setItem("hkc_tfz_" + APP_ID, "1"); } catch (e) {}
        setTfzDone(true); setMode("lab");
      }

      const tabs = [
        { id: "learn", label: "Learn · 學習" },
        { id: "lab", label: tfzDone ? "Lab · 實驗" : "Lab 🔒" },
        { id: "guided", label: "Guided · 引導" },
        { id: "exam", label: "Exam · 測驗" },
        { id: "review", label: "Review · 錯題" }
      ];

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-8">
          <a href="../../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>← Hub</a>
          <header className="mt-4 mb-4">
            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>F5 Physics · Waves — Superposition</p>
            <h1 className="text-2xl sm:text-3xl font-bold mt-1">Wave Interference Tank</h1>
            <p className="text-slate-500 mt-1">波的干涉水槽 · Learn (A1–A8) → Lab → Guided → Exam → Review</p>
          </header>

          <div className="text-sm border border-dashed rounded-lg px-3 py-2 mb-3 flex flex-wrap justify-between gap-2 items-center border-slate-300 bg-white/80">
            <span>{HKC.isPaid() ? (HKC.getEntitlement().tier + " · unlimited") : ("Free · " + HKC.remainingFree() + "/" + HKC.FREE_DAILY_CAP + " today")} · Best {progress.bestScore}</span>
            {!HKC.isPaid() && (
              <button type="button" className="px-3 py-1.5 rounded-md text-xs font-semibold text-white min-h-[36px]" style={{background: ACCENT}} onClick={() => setPay(true)}>Upgrade</button>
            )}
          </div>

          <nav className="flex flex-wrap gap-2 mb-4">
            {tabs.map(tab => (
              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}
                className={"px-3.5 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (mode === tab.id ? "text-white" : "bg-white border border-slate-200 text-slate-700")}
                style={mode === tab.id ? {background: ACCENT} : {}}>
                {tab.label}
              </button>
            ))}
          </nav>

          {mode === "learn" && <LearnFromZero steps={TFZ_STEPS} onComplete={completeTfz} />}

          {mode === "lab" && !tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-xl font-bold">Finish Learn From Zero first · 先完成 A1–A8</h2>
              <p className="text-sm text-slate-500 mt-2">We teach the model before you play — that is how real understanding sticks. 先學模型,後做實驗。</p>
              <button type="button" className="mt-4 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[48px]" style={{background: ACCENT}} onClick={() => setMode("learn")}>Go to Learn →</button>
            </section>
          )}
          {mode === "lab" && tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
              <h2 className="font-bold text-lg mb-3">Two-Source Ripple Tank · 雙波源干涉水槽</h2>
              <WaveSim />
            </section>
          )}

          {mode === "guided" && !doneMsg && (
            <Drill bank={GUIDED} label="Guided" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); refresh(); }} />
          )}
          {mode === "exam" && !doneMsg && (
            <Drill bank={EXAM} label="Exam" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "review" }); refresh(); }} />
          )}
          {doneMsg && (mode === "guided" || mode === "exam") && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-2xl font-bold">Complete</h2>
              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>Continue →</button>
            </section>
          )}
          {mode === "review" && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3">
              <h2 className="font-bold text-lg">Wrong-answer book · 錯題簿</h2>
              {(progress.wrongBook || []).length === 0 && <p className="text-sm text-slate-500">No wrong answers yet · 暫無錯題</p>}
              {(progress.wrongBook || []).map(w => (
                <div key={w.id} className="rounded-xl p-3 text-sm border border-slate-200">
                  <p className="font-semibold">{w.prompt}</p>
                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>
                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">Answer unlocked</p>}
                  <button type="button" className="text-xs underline mt-2 text-slate-500" onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>Mark resolved</button>
                </div>
              ))}
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
