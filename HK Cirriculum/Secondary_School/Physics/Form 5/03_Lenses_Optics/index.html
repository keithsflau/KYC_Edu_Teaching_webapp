<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>薄透鏡公式 | Thin lens</title>
  <style>
    body { font-family: "Segoe UI", "Noto Sans HK", sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    main { max-width: 820px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
    a { color: #2563eb; }
    .track { position: relative; height: 180px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; margin: 1rem 0; touch-action: none; }
    .axis { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed #94a3b8; }
    .lens { position: absolute; top: 18px; bottom: 18px; width: 16px; left: 62%; transform: translateX(-50%); background: #6366f1; border-radius: 40%; }
    .obj { position: absolute; width: 10px; background: #2563eb; bottom: 50%; cursor: grab; border-radius: 2px; }
    button { min-height: 44px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font-weight: 700; padding: 0 1rem; }
    label { display: block; margin: 0.7rem 0; font-weight: 600; }
    #out { min-height: 4.5rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <p><a href="../index.html">← 中五</a> · <a href="../../index.html">物理</a> · <a href="../../Topics/03_Wave_Motion/Lens_Ray_Diagrams/index.html">光線圖</a></p>
    <h1>薄透鏡公式 · Thin lens</h1>
    <p>符號：實正虛負。物距 u 取正。凸透鏡 f &gt; 0，凹透鏡 f &lt; 0。1/v = 1/f − 1/u，放大率 m = −v/u。</p>
    <div class="track" id="track">
      <div class="axis"></div>
      <div class="lens" id="lens"></div>
      <div class="obj" id="obj" title="拖動物體"></div>
    </div>
    <label>焦距大小 |f| = <span id="fLab">10</span> cm
      <input id="f" type="range" min="8" max="24" value="10" />
    </label>
    <label><input id="convex" type="checkbox" checked /> 凸透鏡 converging（取消勾選為凹透鏡）</label>
    <p>物距 u = <strong id="uLab">30</strong> cm（把藍條拖向透鏡或拖離透鏡）</p>
    <button id="check" type="button">核對 Check</button>
    <p id="out">先拖動物體或焦距，再核對像距與放大率。</p>
  </main>
  <script>
    (function () {
      var u = 30;
      var track = document.getElementById("track");
      var obj = document.getElementById("obj");
      var fSlider = document.getElementById("f");
      var convexBox = document.getElementById("convex");
      var out = document.getElementById("out");
      var revealed = false;

      function solve(uCm, fAbs, convex) {
        var f = convex ? fAbs : -fAbs;
        var inv = 1 / f - 1 / uCm;
        if (Math.abs(inv) < 1e-8) return { v: Infinity, m: Infinity, f: f };
        var v = 1 / inv;
        return { v: v, m: -v / uCm, f: f };
      }

      function place() {
        var rect = track.getBoundingClientRect();
        var lensX = rect.width * 0.62;
        var maxU = 80;
        var minU = 12;
        var x = lensX - (u / maxU) * (lensX - 16);
        obj.style.left = x + "px";
        obj.style.height = "70px";
        document.getElementById("uLab").textContent = u.toFixed(1);
        document.getElementById("fLab").textContent = fSlider.value;
        if (!revealed) out.textContent = "先拖動物體或焦距，再核對像距與放大率。";
      }

      function beep() {
        try {
          var c = beep.c || (beep.c = new (window.AudioContext || window.webkitAudioContext)());
          if (c.state === "suspended") c.resume();
          var o = c.createOscillator(), g = c.createGain();
          o.frequency.value = 880;
          g.gain.setValueAtTime(0.0001, c.currentTime);
          g.gain.exponentialRampToValueAtTime(0.06, c.currentTime + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.16);
          o.connect(g); g.connect(c.destination);
          o.start(); o.stop(c.currentTime + 0.17);
        } catch (e) {}
      }

      function setUFromClientX(clientX) {
        var rect = track.getBoundingClientRect();
        var lensX = rect.width * 0.62;
        var x = clientX - rect.left;
        if (x > lensX - 12) x = lensX - 12;
        if (x < 16) x = 16;
        var maxU = 80;
        u = (lensX - x) / (lensX - 16) * maxU;
        if (u < 12) u = 12;
        revealed = false;
        place();
      }

      track.addEventListener("pointerdown", function (e) {
        track.setPointerCapture(e.pointerId);
        setUFromClientX(e.clientX);
      });
      track.addEventListener("pointermove", function (e) {
        if (e.buttons || e.pressure) setUFromClientX(e.clientX);
      });
      fSlider.addEventListener("input", function () { revealed = false; place(); });
      convexBox.addEventListener("change", function () { revealed = false; place(); });
      document.getElementById("check").addEventListener("click", function () {
        revealed = true;
        var ans = solve(u, parseFloat(fSlider.value), convexBox.checked);
        var kind = !isFinite(ans.v) ? "像在無限遠" : (ans.v > 0 ? "實像" : "虛像");
        var stand = !isFinite(ans.m) ? "" : (ans.m < 0 ? "倒立" : "正立");
        var vText = isFinite(ans.v) ? ans.v.toFixed(2) + " cm" : "∞";
        var mText = isFinite(ans.m) ? ans.m.toFixed(2) : "—";
        out.textContent = "f = " + ans.f.toFixed(1) + " cm，u = " + u.toFixed(1) + " cm。v = " + vText + "（" + kind + " " + stand + "）。m = " + mText + "。";
        beep();
      });
      place();
    })();
  </script>

</body>
</html>
