    function LearnFromZero({ steps, onComplete }) {
      const [i, setI] = useState(0);
      const [picked, setPicked] = useState(null);
      const step = steps[i];
      const last = i === steps.length - 1;
      function pick(opt) { if (picked) return; setPicked(opt); }
      function next() {
        if (last) { onComplete(); return; }
        setI(i + 1); setPicked(null);
      }
      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-6">
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs font-black uppercase tracking-widest" style={{color: ACCENT}}>Learn From Zero · 由零開始學</p>
            <p className="text-xs text-slate-500">{step.id} / A{steps.length}</p>
          </div>
          <div className="flex gap-1.5 mb-4">
            {steps.map((s, k) => (
              <div key={s.id} className="h-1.5 flex-1 rounded-full" style={{background: k <= i ? ACCENT : "#e2e8f0"}} />
            ))}
          </div>
          <h2 className="text-xl font-bold">{step.title}</h2>
          <p className="text-sm font-semibold text-slate-500 mt-0.5">{step.titleZh}</p>
          <p className="text-sm mt-3 text-slate-700 leading-relaxed">{step.body}</p>
          <p className="text-sm mt-2 text-slate-500 leading-relaxed">{step.bodyZh}</p>
          <div className="mt-4 p-3 rounded-xl bg-indigo-50 border border-indigo-200">
            <p className="text-sm font-bold">{step.q}</p>
            <p className="text-xs text-slate-500 mb-2">{step.qZh}</p>
            <div className="grid gap-2">
              {step.opts.map(o => {
                let cls = "text-left px-3 py-2.5 rounded-xl text-sm border min-h-[44px] ";
                if (!picked) cls += "bg-white border-slate-200 hover:bg-slate-50";
                else if (o === step.a) cls += "bg-emerald-50 border-emerald-300 text-emerald-800 font-semibold";
                else if (o === picked) cls += "bg-rose-50 border-rose-300 text-rose-800";
                else cls += "bg-white border-slate-200 opacity-60";
                return <button key={o} type="button" className={cls} onClick={() => pick(o)}>{o}</button>;
              })}
            </div>
            {picked && (
              <div className="mt-3 text-sm p-3 rounded-lg bg-white/70 border border-slate-200">
                <p className="font-semibold">{picked === step.a ? "✓ Correct · 正確" : "✗ Not quite — see why · 再想想"}</p>
                <p className="mt-1 text-slate-600">{step.why}</p>
                {picked === step.a && (
                  <button type="button" onClick={next} className="mt-3 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[44px]" style={{background: ACCENT}}>
                    {last ? "Unlock the Lab → 解鎖實驗室" : "Next step →"}
                  </button>
                )}
              </div>
            )}
          </div>
        </section>
      );
    }


    function EmfSim() {
      const [E, setE] = useState(6);
      const [r, setRInt] = useState(2);
      const [R, setR] = useState(10);
      const [closed, setClosed] = useState(true);
      const [sweepPts, setSweepPts] = useState([]);
      const cv = useRef(null), gv = useRef(null);
      const S = useRef({ dots: [], sweep: null });

      const I = closed ? E / (R + r) : 0;
      const V = closed ? E - I * r : E;
      const Pload = I * I * R, Plost = I * I * r;

      function startSweep() {
        setSweepPts([]);
        S.current.sweep = { R: 50 };
      }

      useEffect(() => {
        let raf, last = performance.now();
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000); last = now;
          const sw = S.current.sweep;
          if (sw) {
            sw.R -= dt * 18;
            if (sw.R <= 1) { S.current.sweep = null; }
            else {
              const iR = Math.max(1, Math.round(sw.R));
              const iI = E / (iR + r);
              setSweepPts(p => (p.length && p[p.length - 1].R === iR) ? p : [...p, { R: iR, I: iI, V: E - iI * r }]);
            }
          }
          drawAll();
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
        return () => cancelAnimationFrame(raf);
      });

      function drawAll() {
        const c = cv.current, g = gv.current;
        if (c) drawCircuit(c.getContext("2d"));
        if (g) drawGraph(g.getContext("2d"));
      }
      function drawCircuit(ctx) {
        ctx.clearRect(0, 0, 360, 360);
        ctx.fillStyle = "#fffbeb"; ctx.fillRect(0, 0, 360, 360);
        ctx.strokeStyle = "#334155"; ctx.lineWidth = 3;
        ctx.strokeRect(40, 60, 280, 240);
        ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(52, 150); ctx.lineTo(76, 150); ctx.moveTo(58, 168); ctx.lineTo(70, 168); ctx.stroke();
        ctx.font = "bold 12px IBM Plex Sans"; ctx.fillStyle = "#0f172a";
        ctx.fillText("E=" + E.toFixed(1) + "V", 22, 140);
        ctx.setLineDash([4, 3]);
        ctx.strokeStyle = "#ca8a04"; ctx.strokeRect(28, 120, 64, 66);
        ctx.setLineDash([]);
        ctx.fillStyle = "#ca8a04"; ctx.font = "11px IBM Plex Sans";
        ctx.fillText("cell + r=" + r.toFixed(1) + "Ω", 24, 112);
        ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(64, 186);
        for (let k = 0; k < 6; k++) ctx.lineTo(64 + (k + 0.5) * 6, 186 + (k % 2 ? 6 : -6));
        ctx.lineTo(100, 186); ctx.stroke();
        ctx.strokeStyle = "#0f172a";
        ctx.beginPath(); ctx.moveTo(180, 60);
        for (let k = 0; k < 6; k++) ctx.lineTo(180 + (k + 0.5) * 10, 60 + (k % 2 ? 8 : -8));
        ctx.lineTo(240, 60); ctx.stroke();
        ctx.fillStyle = "#0f172a"; ctx.font = "bold 13px IBM Plex Sans";
        ctx.fillText("R = " + R + " Ω (load 負載)", 168, 40);
        ctx.fillStyle = "#64748b"; ctx.font = "12px IBM Plex Sans";
        ctx.fillText("P = " + Pload.toFixed(1) + " W useful", 176, 92);
        ctx.strokeStyle = "#0284c8"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(320, 180, 16, 0, 7); ctx.stroke();
        ctx.fillStyle = "#0284c8"; ctx.font = "bold 14px IBM Plex Sans"; ctx.fillText("A", 315, 185);
        ctx.strokeStyle = "#16a34a";
        ctx.beginPath(); ctx.arc(210, 300, 16, 0, 7); ctx.stroke();
        ctx.fillStyle = "#16a34a"; ctx.fillText("V", 205, 305);
        ctx.setLineDash([3, 3]); ctx.strokeStyle = "#16a34a";
        ctx.beginPath(); ctx.moveTo(194, 292); ctx.lineTo(180, 60); ctx.moveTo(226, 292); ctx.lineTo(240, 60); ctx.stroke();
        ctx.setLineDash([]);
        if (closed) {
          if (!S.current.dots.length) for (let k = 0; k < 14; k++) S.current.dots.push(Math.random());
          const L = 2 * (280 + 240);
          ctx.fillStyle = "#0284c8";
          S.current.dots = S.current.dots.map(d => (d + (I * 60 * 0.016) / L) % 1);
          S.current.dots.forEach(d => {
            const per = [[40, 60, 320, 60], [320, 60, 320, 300], [320, 300, 40, 300], [40, 300, 40, 60]];
            let s = d * L;
            for (const [x1, y1, x2, y2] of per) {
              const seg = Math.hypot(x2 - x1, y2 - y1);
              if (s <= seg) { ctx.beginPath(); ctx.arc(x1 + (x2 - x1) * s / seg, y1 + (y2 - y1) * s / seg, 3.5, 0, 7); ctx.fill(); break; }
              s -= seg;
            }
          });
        } else {
          ctx.strokeStyle = "#dc2626"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(180, 300); ctx.lineTo(206, 284); ctx.stroke();
          ctx.fillStyle = "#dc2626"; ctx.font = "12px IBM Plex Sans"; ctx.fillText("switch OPEN", 220, 330);
        }
        ctx.fillStyle = "#b45309"; ctx.font = "12px IBM Plex Sans";
        ctx.fillText("lost volts Ir = " + (I * r).toFixed(2) + " V → heat in cell 電池發熱 " + Plost.toFixed(1) + " W", 30, 348);
      }
      function drawGraph(ctx) {
        ctx.clearRect(0, 0, 348, 360);
        ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, 348, 360);
        const ox = 40, oy = 30, gw = 280, gh = 280;
        ctx.strokeStyle = "#475569"; ctx.lineWidth = 1; ctx.strokeRect(ox, oy, gw, gh);
        const Imax = E / r, Vmax = Math.max(E, 1);
        ctx.fillStyle = "#94a3b8"; ctx.font = "11px IBM Plex Sans";
        ctx.fillText("V (V)", 6, oy + 6); ctx.fillText("I (A) →", ox + gw - 40, oy + gh + 22);
        ctx.fillText("V–I characteristic 端電壓對電流", ox + 8, oy + 14);
        ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(ox, oy + gh - (Vmax / Vmax) * 0 + (gh - (E / Vmax) * gh));
        ctx.lineTo(ox + gw, oy + gh - ((E - (E / r) * r) / Vmax) * gh);
        ctx.stroke();
        ctx.fillStyle = "#fbbf24"; ctx.font = "bold 11px IBM Plex Sans";
        ctx.fillText("E = " + E.toFixed(1) + " V (intercept 截距)", ox + 4, oy + gh - (E / Vmax) * gh - 6);
        ctx.fillText("slope 斜率 = −r = −" + r.toFixed(1) + " Ω", ox + gw - 150, oy + 30);
        ctx.fillStyle = "#22d3ee";
        sweepPts.forEach(p => {
          ctx.beginPath(); ctx.arc(ox + (p.I / Imax) * gw, oy + gh - (p.V / Vmax) * gh, 3, 0, 7); ctx.fill();
        });
        if (closed) {
          ctx.fillStyle = "#f472b6"; ctx.beginPath();
          ctx.arc(ox + (I / Imax) * gw, oy + gh - (V / Vmax) * gh, 6, 0, 7); ctx.fill();
          ctx.font = "11px IBM Plex Sans";
          ctx.fillText("operating point 工作點", Math.min(ox + (I / Imax) * gw + 8, 200), oy + gh - (V / Vmax) * gh - 8);
        }
      }
      return (
        <div className="space-y-3">
          <div className="flex flex-wrap gap-2 items-center">
            <button type="button" onClick={() => setClosed(c => !c)} className={"px-3 py-2 rounded-xl text-sm font-semibold min-h-[44px] border " + (closed ? "bg-emerald-600 text-white border-emerald-600" : "bg-rose-600 text-white border-rose-600")}>
              {closed ? "Switch: CLOSED 閉合" : "Switch: OPEN 斷開 (measures true E)"}</button>
            <button type="button" onClick={startSweep} className="px-3 py-2 rounded-xl text-sm font-semibold text-white min-h-[44px]" style={{background: ACCENT}}>▶ Run R-sweep 掃描負載 (50→1 Ω)</button>
            <button type="button" onClick={() => setSweepPts([])} className="px-3 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 min-h-[44px]">Clear data 清除數據</button>
          </div>
          <div className="grid lg:grid-cols-2 gap-3">
            <canvas ref={cv} className="sim" width="360" height="360" />
            <canvas ref={gv} className="sim" width="348" height="360" />
          </div>
          <div className="grid sm:grid-cols-3 gap-3">
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">EMF E · {E.toFixed(1)} V
              <input type="range" min="1.5" max="12" step="0.5" value={E} onChange={e => setE(+e.target.value)} className="w-full mt-2" /></label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Internal r 內阻 · {r.toFixed(1)} Ω
              <input type="range" min="0.5" max="5" step="0.5" value={r} onChange={e => setRInt(+e.target.value)} className="w-full mt-2" /></label>
            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">Load R 負載 · {R} Ω
              <input type="range" min="1" max="50" step="1" value={R} onChange={e => setR(+e.target.value)} className="w-full mt-2" /></label>
          </div>
          <div className="flex flex-wrap gap-2 text-sm">
            <span className="px-3 py-1.5 rounded-full bg-amber-100 text-amber-800 font-bold">I = {I.toFixed(2)} A</span>
            <span className="px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 font-bold">Terminal V = {V.toFixed(2)} V</span>
            <span className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 font-semibold">Lost Ir = {(I * r).toFixed(2)} V</span>
            <span className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 font-semibold">Efficiency 效率 = {closed ? (100 * R / (R + r)).toFixed(0) : "—"}%</span>
          </div>
        </div>
      );
    }

    const GUIDED = [
      { id: "g1", level: 1, q: "A cell has EMF 6 V and internal resistance 0.5 Ω. With switch OPEN, the voltmeter reads…", qZh: "電池 EMF 6 V、內阻 0.5 Ω,開關斷開時電壓表讀數為…",
        opts: ["6 V", "0 V", "3 V", "5.5 V"], a: "6 V",
        hint: "Open circuit → I = 0 → no lost volts → V = E. 斷路時 Ir = 0。" },
      { id: "g2", level: 1, q: "Terminal voltage equals…", qZh: "端電壓等於…",
        opts: ["E − Ir", "E + Ir", "Ir only", "E only"], a: "E − Ir",
        hint: "The cell loses Ir inside before delivering V outside. 內阻先吃掉 Ir。" },
      { id: "g3", level: 1, q: "When you demand MORE current from a battery, its terminal voltage…", qZh: "從電池抽取更大電流時,端電壓…",
        opts: ["Falls 下降", "Rises 上升", "Stays at E 不變"], a: "Falls 下降",
        hint: "V = E − Ir. Bigger I → bigger lost volts. 電流大,損耗大。" },
      { id: "g4", level: 2, q: "E = 12 V, r = 1 Ω, load R = 5 Ω. Circuit current?", qZh: "E = 12 V、r = 1 Ω、負載 R = 5 Ω,電流?",
        opts: ["2 A", "2.4 A", "12 A", "1.7 A"], a: "2 A",
        hint: "I = E/(R + r) = 12/6. 內阻與負載串聯。" },
      { id: "g5", level: 2, q: "Same cell (E = 12 V, r = 1 Ω) with R = 5 Ω. Terminal voltage?", qZh: "同上電池接 R = 5 Ω,端電壓?",
        opts: ["10 V", "12 V", "2 V", "11 V"], a: "10 V",
        hint: "V = E − Ir = 12 − 2×1, or V = IR = 2×5. 兩個方法都對。" },
      { id: "g6", level: 2, q: "In a V–I graph for a cell, the y-intercept and gradient give…", qZh: "電池 V–I 圖中,y 截距與斜率分別是…",
        opts: ["E and −r", "r and −E", "I and R", "E and R"], a: "E and −r",
        hint: "V = E − Ir: compare y = c + mx. 對照直線方程。" }
    ]
    const EXAM = [
      { id: "e1", level: 3, q: "A battery of EMF 12 V delivers 3 A to a 3 Ω load. Terminal voltage and internal resistance?", qZh: "EMF 12 V 的電池向 3 Ω 負載輸出 3 A,端電壓與內阻各為多少?",
        opts: ["9 V, 1 Ω", "12 V, 0 Ω", "10.5 V, 0.5 Ω", "9 V, 3 Ω"], a: "9 V, 1 Ω",
        hint: "V = IR = 3×3 = 9 V, then r = (E − V)/I = (12−9)/3. 先由負載求 V,再求 r。" },
      { id: "e2", level: 3, q: "A V–I experiment gives intercept 9.0 V and gradient −2.0 V/A. Short-circuit current?", qZh: "V–I 實驗得截距 9.0 V、斜率 −2.0 V/A,短路電流?",
        opts: ["4.5 A", "9 A", "2 A", "18 A"], a: "4.5 A",
        hint: "I_max = E/r = 9/2. 短路時全部 E 跨在 r 上。" },
      { id: "e3", level: 3, q: "Why does a phone battery's voltage sag when the phone works hard?", qZh: "手機高負載時電池電壓下跌,為甚麼?",
        opts: ["Large I increases the Ir drop inside 大電流令內部 Ir 損耗增大", "EMF decreases with use EMF 會減少", "R of phone increases 手機電阻變大", "Charge escapes 電荷流失"], a: "Large I increases the Ir drop inside 大電流令內部 Ir 損耗增大",
        hint: "E stays constant; V = E − Ir sags as I rises. EMF 不變,端電壓變。" },
      { id: "e4", level: 4, q: "Load R dissipates maximum power when…", qZh: "負載 R 何時獲得最大功率?",
        opts: ["R = r", "R = 0", "R → ∞", "R = 2r"], a: "R = r",
        hint: "P = E²R/(R+r)² — differentiate or test R = r. 最大功率傳輸定理。(效率卻只有 50%!)" },
      { id: "e5", level: 4, q: "Two identical cells (E = 1.5 V, r = 0.5 Ω each) in SERIES powering a 2 Ω load. Current?", qZh: "兩枚相同電池(各 E = 1.5 V、r = 0.5 Ω)串聯接 2 Ω 負載,電流?",
        opts: ["1 A", "0.75 A", "1.5 A", "3 A"], a: "1 A",
        hint: "EMFs add: 3 V; internal r adds: 1 Ω; I = 3/(2+1). 串聯 E 與 r 皆相加。" },
      { id: "e6", level: 4, q: "An old battery still reads 1.5 V on a voltmeter but cannot light a bulb. Why?", qZh: "舊電池用電壓表量仍有 1.5 V,卻點不亮燈泡。為甚麼?",
        opts: ["Its internal resistance has grown huge 內阻變得極大", "Its EMF is fake EMF 是假的", "The bulb is broken 燈泡壞了", "Voltmeters lie 電壓表不準"], a: "Its internal resistance has grown huge 內阻變得極大",
        hint: "Voltmeter draws ~0 A so reads E; under load I = E/(R+r) collapses when r is huge. 空載量到 E,帶載即崩。" }
    ]

    function UpgradeCTA({ reason, onClose, onTrial }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4">
          <div className="w-full max-w-md rounded-2xl p-5 bg-white border border-slate-200">
            <h3 className="text-lg font-bold" style={{color: ACCENT}}>解鎖完整練習與家長進度</h3>
            <p className="text-sm mt-2 text-slate-600">{reason || window.SUBSCRIBE_CONFIG.bannerText}</p>
            <ul className="mt-3 text-sm space-y-1 list-disc list-inside text-slate-600">
              <li>Unlimited daily drills</li>
              <li>Full wrong-answer book</li>
              <li>Progress sync (coming)</li>
            </ul>
            <button type="button" onClick={onTrial} className="mt-4 w-full min-h-[48px] rounded-xl font-semibold text-white" style={{background: ACCENT}}>開始 14 日試用（本機）</button>
            <a href={HKC.MARKETING_PATH} className="mt-2 block w-full min-h-[44px] text-center leading-[44px] rounded-xl border border-slate-300 text-sm">了解家長計劃</a>
            <button type="button" onClick={onClose} className="mt-2 w-full text-sm underline text-slate-500">繼續免費</button>
          </div>
        </div>
      );
    }

    function Drill({ bank, label, onNeedUpgrade, onDone }) {
      const [qi, setQi] = useState(0);
      const [fb, setFb] = useState(null);
      const [score, setScore] = useState(0);
      const [hint, setHint] = useState(false);
      const [first, setFirst] = useState(true);
      const item = bank[qi];

      function pick(opt) {
        if (HKC.freeCapReached()) {
          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");
          onNeedUpgrade("今日免費練習已用完。");
          return;
        }
        HKC.recordDrillUse(APP_ID);
        const ok = opt === item.a;
        setFb(ok
          ? { ok: true, msg: "Correct · 正確" }
          : { ok: false, msg: "Not quite · 再想。Use Hint for the method (answer not shown)." });
        if (ok) {
          if (typeof HKC.recordOk === "function") HKC.recordOk(APP_ID, item);
          if (first) setScore(s => s + 1);
        } else {
          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });
          setFirst(false);
        }
      }

      function next() {
        setFb(null); setHint(false); setFirst(true);
        if (qi + 1 >= bank.length) {
          HKC.recordSession(APP_ID, score, bank.length);
          onDone(score, bank.length);
        } else setQi(qi + 1);
      }

      return (
        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
          <div className="flex justify-between text-sm mb-3 text-slate-500">
            <span>{label} · Q {qi + 1}/{bank.length} · Lv {item.level}</span>
            <span>Score {score}</span>
          </div>
          <h2 className="text-lg font-bold mb-1">{item.q}</h2>
          {item.qZh ? <p className="text-sm mb-4 opacity-80" style={{color: ACCENT}}>{item.qZh}</p> : <div className="mb-4" />}
          <div className="grid gap-2">
            {item.opts.map(o => (
              <button key={o} type="button" disabled={fb && fb.ok} onClick={() => pick(o)}
                className="text-left px-4 py-3 rounded-xl min-h-[48px] disabled:opacity-50 bg-slate-50 hover:bg-slate-100 border border-slate-200">{o}</button>
            ))}
          </div>
          <button type="button" className="text-sm mt-3 font-semibold min-h-[44px]" style={{color: ACCENT}} onClick={() => setHint(true)}>Hint · 提示</button>
          {hint && <p className="text-sm mt-1 p-3 rounded-xl bg-amber-50 text-amber-900 border border-amber-200">{item.hint}</p>}
          {fb && (
            <div className={"mt-4 p-3 rounded-xl text-sm " + (fb.ok ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800")}>
              {fb.msg}
              {fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={next}>Next →</button>}
              {!fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={() => setFb(null)}>Retry</button>}
            </div>
          )}
        </section>
      );
    }

    function App() {
      const [mode, setMode] = useState("learn");
      const [progress, setProgress] = useState(() => HKC.loadProgress(APP_ID));
      const [pay, setPay] = useState(false);
      const [payReason, setPayReason] = useState("");
      const [doneMsg, setDoneMsg] = useState(null);
      const [tfzDone, setTfzDone] = useState(() => { try { return !!localStorage.getItem("hkc_tfz_" + APP_ID); } catch (e) { return false; } });

      function refresh() { setProgress(HKC.loadProgress(APP_ID)); }
      useEffect(() => { refresh(); }, [mode]);
      function completeTfz() {
        try { localStorage.setItem("hkc_tfz_" + APP_ID, "1"); } catch (e) {}
        setTfzDone(true); setMode("lab");
      }

      const tabs = [
        { id: "learn", label: "Learn · 學習" },
        { id: "lab", label: tfzDone ? "Lab · 實驗" : "Lab 🔒" },
        { id: "guided", label: "Guided · 引導" },
        { id: "exam", label: "Exam · 測驗" },
        { id: "review", label: "Review · 錯題" }
      ];

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-8">
          <a href="../../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>← Hub</a>
          <header className="mt-4 mb-4">
            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>F5 Physics · Electricity — EMF & Internal Resistance</p>
            <h1 className="text-2xl sm:text-3xl font-bold mt-1">EMF & Internal Resistance</h1>
            <p className="text-slate-500 mt-1">電動勢與內阻 · Learn (A1–A8) → Lab → Guided → Exam → Review</p>
          </header>

          <div className="text-sm border border-dashed rounded-lg px-3 py-2 mb-3 flex flex-wrap justify-between gap-2 items-center border-slate-300 bg-white/80">
            <span>{HKC.isPaid() ? (HKC.getEntitlement().tier + " · unlimited") : ("Free · " + HKC.remainingFree() + "/" + HKC.FREE_DAILY_CAP + " today")} · Best {progress.bestScore}</span>
            {!HKC.isPaid() && (
              <button type="button" className="px-3 py-1.5 rounded-md text-xs font-semibold text-white min-h-[36px]" style={{background: ACCENT}} onClick={() => setPay(true)}>Upgrade</button>
            )}
          </div>

          <nav className="flex flex-wrap gap-2 mb-4">
            {tabs.map(tab => (
              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}
                className={"px-3.5 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (mode === tab.id ? "text-white" : "bg-white border border-slate-200 text-slate-700")}
                style={mode === tab.id ? {background: ACCENT} : {}}>
                {tab.label}
              </button>
            ))}
          </nav>

          {mode === "learn" && <LearnFromZero steps={TFZ_STEPS} onComplete={completeTfz} />}

          {mode === "lab" && !tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-xl font-bold">Finish Learn From Zero first · 先完成 A1–A8</h2>
              <p className="text-sm text-slate-500 mt-2">We teach the model before you play — that is how real understanding sticks. 先學模型,後做實驗。</p>
              <button type="button" className="mt-4 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[48px]" style={{background: ACCENT}} onClick={() => setMode("learn")}>Go to Learn →</button>
            </section>
          )}
          {mode === "lab" && tfzDone && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">
              <h2 className="font-bold text-lg mb-3">EMF vs Terminal Voltage Sandbox · 電動勢與端電壓沙盤</h2>
              <EmfSim />
            </section>
          )}

          {mode === "guided" && !doneMsg && (
            <Drill bank={GUIDED} label="Guided" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); refresh(); }} />
          )}
          {mode === "exam" && !doneMsg && (
            <Drill bank={EXAM} label="Exam" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}
              onDone={(s, n) => { setDoneMsg({ s, n, next: "review" }); refresh(); }} />
          )}
          {doneMsg && (mode === "guided" || mode === "exam") && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">
              <h2 className="text-2xl font-bold">Complete</h2>
              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>
              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}
                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>Continue →</button>
            </section>
          )}
          {mode === "review" && (
            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3">
              <h2 className="font-bold text-lg">Wrong-answer book · 錯題簿</h2>
              {(progress.wrongBook || []).length === 0 && <p className="text-sm text-slate-500">No wrong answers yet · 暫無錯題</p>}
              {(progress.wrongBook || []).map(w => (
                <div key={w.id} className="rounded-xl p-3 text-sm border border-slate-200">
                  <p className="font-semibold">{w.prompt}</p>
                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>
                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">Answer unlocked</p>}
                  <button type="button" className="text-xs underline mt-2 text-slate-500" onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>Mark resolved</button>
                </div>
              ))}
            </section>
          )}
          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
<footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
