    function phyBeep(ok) {

        var o = c.createOscillator(), g = c.createGain();

        g.gain.setValueAtTime(0.0001, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.06, c.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.16);
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + 0.17);
      } catch (e) {}
    }

function LearnFromZero({ steps, onComplete }) {

    function polylineLength(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); return L; }

    function pointAt(pts, s) {

      for (let i = 1; i < pts.length; i++) {

        const seg = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);

        if (s <= seg) { const f = s / seg; return [pts[i-1][0] + f * (pts[i][0] - pts[i-1][0]), pts[i-1][1] + f * (pts[i][1] - pts[i-1][1])]; }

        s -= seg;

      }

      return pts[pts.length - 1];

    }

    function zigzag(ctx, x, y, w, vertical) {

      ctx.save(); ctx.translate(x, y); if (vertical) ctx.rotate(Math.PI / 2);

      ctx.beginPath(); ctx.moveTo(-w / 2, 0);

      const n = 6, amp = 8;

      for (let i = 0; i < n; i++) ctx.lineTo(-w / 2 + (i + 0.5) * (w / n), i % 2 ? amp : -amp);

      ctx.lineTo(w / 2, 0); ctx.stroke(); ctx.restore();

    }



    function CircuitSim() {

      const [E, setE] = useState(6);

      const [R1, setR1] = useState(4);

      const [R2, setR2] = useState(8);

      const [topo, setTopo] = useState("series");

      const [closed, setClosed] = useState(true);

      const [playing, setPlaying] = useState(true);

      const [slow, setSlow] = useState(false);

      const [flowMode, setFlowMode] = useState("electrons");

      const stepOnce = useRef(false);

      const cv = useRef(null);

      const S = useRef({ dots: [], last: 0 });

      const OUTER = [[110, 300], [110, 80], [610, 80], [610, 300], [110, 300]];

      const BR1 = [[240, 80], [240, 300]];

      const BR2 = [[480, 80], [480, 300]];



      const phys = (function () {

        if (!closed) return { I: 0, I1: 0, I2: 0, V1: 0, V2: 0, P1: 0, P2: 0, Rt: Infinity };

        if (topo === "series") {

          const Rt = R1 + R2, I = E / Rt;

          return { I, I1: I, I2: I, V1: I * R1, V2: I * R2, P1: I * I * R1, P2: I * I * R2, Rt };

        }

        const Rt = 1 / (1 / R1 + 1 / R2), I = E / Rt, I1 = E / R1, I2 = E / R2;

        return { I, I1, I2, V1: E, V2: E, P1: E * I1, P2: E * I2, Rt };

      })();



      useEffect(() => {

        let raf, last = performance.now();

        function frame(now) {

          const dt = Math.min(0.05, (now - last) / 1000); last = now;

          draw(cv.current, dt);

          raf = requestAnimationFrame(frame);

        }

        raf = requestAnimationFrame(frame);

        return () => cancelAnimationFrame(raf);

      });



      function initDots(count, list) {

        while (list.length < count) list.push({ s: Math.random() });

        list.length = count;

      }



      function draw(c, dt) {

        if (!c) return;

        const ctx = c.getContext("2d");

        ctx.clearRect(0, 0, c.width, c.height);

        ctx.fillStyle = "#f8fafc"; ctx.fillRect(0, 0, c.width, c.height);

        if (!S.current.o) S.current.o = { main: [], b1: [], b2: [] };

        const o = S.current.o;

        const timeMul = (playing || stepOnce.current ? 1 : 0) * (slow ? 0.3 : 1) * (stepOnce.current ? 5 : 1);

        const flowSign = flowMode === "electrons" ? -1 : 1;

        const vMain = closed ? Math.min(200, 40 + 90 * phys.I) * timeMul * flowSign : 0;

        const v1 = closed && topo === "parallel" ? Math.min(200, 40 + 90 * phys.I1) * timeMul * flowSign : vMain;

        const v2 = closed && topo === "parallel" ? Math.min(200, 40 + 90 * phys.I2) * timeMul * flowSign : vMain;

        const pathMain = OUTER;

        const Lm = polylineLength(pathMain);

        initDots(16, o.main);

        ctx.lineWidth = 3; ctx.strokeStyle = "#334155";

        ctx.beginPath(); ctx.moveTo(OUTER[0][0], OUTER[0][1]);

        for (let i = 1; i < OUTER.length; i++) ctx.lineTo(OUTER[i][0], OUTER[i][1]);

        ctx.stroke();

        if (topo === "parallel") {

          ctx.beginPath(); ctx.moveTo(BR1[0][0], BR1[0][1]); ctx.lineTo(BR1[1][0], BR1[1][1]); ctx.stroke();

          ctx.beginPath(); ctx.moveTo(BR2[0][0], BR2[0][1]); ctx.lineTo(BR2[1][0], BR2[1][1]); ctx.stroke();

          ctx.fillStyle = "#334155";

          [[240, 80], [240, 300], [480, 80], [480, 300]].forEach(n => { ctx.beginPath(); ctx.arc(n[0], n[1], 5, 0, 7); ctx.fill(); });

        }

        ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 3;

        ctx.beginPath(); ctx.moveTo(96, 178); ctx.lineTo(124, 178); ctx.moveTo(104, 202); ctx.lineTo(116, 202); ctx.stroke();

        ctx.font = "bold 13px IBM Plex Sans"; ctx.fillStyle = "#0f172a";

        ctx.fillText("E = " + E.toFixed(1) + " V", 60, 165);

        ctx.fillText("+", 130, 172);

        ctx.fillText("−", 130, 212);

        ctx.strokeStyle = "#7c3aed"; ctx.lineWidth = 2.5;

        ctx.beginPath(); ctx.arc(110, 120, 16, 0, 7); ctx.stroke();

        ctx.fillStyle = "#7c3aed"; ctx.font = "bold 14px IBM Plex Sans"; ctx.fillText("A", 105, 125);

        const rPos = topo === "series" ? { r1: [360, 80, false], r2: [360, 300, false] } : { r1: [240, 190, true], r2: [480, 190, true] };

        [[rPos.r1, R1, "R₁", phys.P1], [rPos.r2, R2, "R₂", phys.P2]].forEach(([rp, Rv, nm, Pw]) => {

          const [x, y, vert] = rp;

          ctx.save();

          ctx.fillStyle = "rgba(239,68,68," + Math.min(0.55, Pw / 40) + ")";

          ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill();

          ctx.restore();

          ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2.5;

          zigzag(ctx, x, y, 64, vert);

          ctx.fillStyle = "#0f172a"; ctx.font = "bold 13px IBM Plex Sans";

          ctx.fillText(nm + " = " + Rv + " Ω", x - 26, y + (vert ? -34 : -22));

          ctx.fillStyle = "#64748b"; ctx.font = "12px IBM Plex Sans";

          ctx.fillText(Pw.toFixed(1) + " W", x - 16, y + (vert ? 44 : 40));

        });

        ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 3;

        if (closed) { ctx.beginPath(); ctx.moveTo(610, 200); ctx.lineTo(610, 260); ctx.stroke(); }

        else { ctx.beginPath(); ctx.moveTo(610, 200); ctx.lineTo(610, 258); ctx.moveTo(610, 200); ctx.lineTo(636, 236); ctx.stroke(); }

        ctx.fillStyle = "#64748b"; ctx.font = "12px IBM Plex Sans";

        ctx.fillText(closed ? "switch closed 閉合" : "switch OPEN 斷開", 540, 290);

        function drawDots(list, path, v, color) {

          const L = polylineLength(path);

          ctx.fillStyle = color;

          list.forEach(d => {

            d.s = (d.s + (v * dt) / L) % 1;

            const [x, y] = pointAt(path, d.s * L);

            ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill();

          });

        }

        if (closed) {

          drawDots(o.main, pathMain, vMain, flowMode === "electrons" ? "#0284c8" : "#dc2626");

          if (topo === "parallel") {

            initDots(8, o.b1); initDots(8, o.b2);

            drawDots(o.b1, BR1, v1, flowMode === "electrons" ? "#dc2626" : "#b45309");

            drawDots(o.b2, BR2, v2, flowMode === "electrons" ? "#ea580c" : "#b45309");

          } else { o.b1 = []; o.b2 = []; }

        }

        stepOnce.current = false;

        ctx.fillStyle = "#334155"; ctx.font = "12px IBM Plex Sans";

        ctx.fillText(flowMode === "electrons"

          ? "electrons 電子（外電路由負極流向正極）"

          : "conventional current 慣例電流（外電路由正極流向負極）", 380, 340);

      }



      return (

        <div className="space-y-3">

          <div className="flex flex-wrap gap-2 items-center">

            {["series", "parallel"].map(t => (

              <button key={t} type="button" onClick={() => setTopo(t)}

                className={"px-3 py-2 rounded-xl text-sm font-semibold min-h-[44px] border " + (topo === t ? "text-white" : "bg-white text-slate-700 border-slate-200")}

                style={topo === t ? {background: ACCENT, borderColor: ACCENT} : {}}>{t === "series" ? "串聯 Series" : "並聯 Parallel"}</button>

            ))}

            <button type="button" onClick={() => setClosed(c => !c)} className={"px-3 py-2 rounded-xl text-sm font-semibold min-h-[44px] border " + (closed ? "bg-emerald-600 text-white border-emerald-600" : "bg-rose-600 text-white border-rose-600")}>

              {closed ? "開關：閉合 CLOSED" : "開關：斷開 OPEN"}</button>

          </div>

          <canvas ref={cv} className="sim" width="720" height="380" />

          <div className="grid sm:grid-cols-3 gap-3">

            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">電動勢 EMF · {E.toFixed(1)} V

              <input type="range" min="1.5" max="12" step="0.5" value={E} onChange={e => setE(+e.target.value)} className="w-full mt-2" /></label>

            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">R₁ · {R1} Ω

              <input type="range" min="2" max="40" step="1" value={R1} onChange={e => setR1(+e.target.value)} className="w-full mt-2" /></label>

            <label className="text-sm font-semibold bg-white border border-slate-200 rounded-xl p-3">R₂ · {R2} Ω

              <input type="range" min="2" max="40" step="1" value={R2} onChange={e => setR2(+e.target.value)} className="w-full mt-2" /></label>

          </div>

          <div className="flex flex-wrap gap-2 text-sm">

            <span className="px-3 py-1.5 rounded-full bg-violet-100 text-violet-800 font-bold">總電流 I · {closed ? phys.I.toFixed(2) : "0.00"} A</span>

            <span className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 font-semibold">總電阻 R · {closed ? phys.Rt.toFixed(1) : "—"} Ω</span>

            <span className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 font-semibold">V₁ = {phys.V1.toFixed(1)} V · V₂ = {phys.V2.toFixed(1)} V</span>

            <span className="px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 font-semibold">P₁ = {phys.P1.toFixed(1)} W · P₂ = {phys.P2.toFixed(1)} W</span>

          </div>

          <div className="flex flex-wrap gap-2 items-center rounded-xl border border-slate-200 p-3 bg-slate-50">

            <button type="button" onClick={() => setPlaying(p => !p)} className="px-4 py-2 rounded-xl text-sm font-bold text-white min-h-[44px]" style={{background: ACCENT}}>{playing ? "暫停 Pause" : "播放 Play"}</button>

            <button type="button" onClick={() => { setPlaying(false); stepOnce.current = true; }} className="px-4 py-2 rounded-xl text-sm font-bold bg-white border border-slate-300 min-h-[44px]">逐步 Step</button>

            <label className="flex items-center gap-2 text-sm font-semibold min-h-[44px] px-2">

              <input type="checkbox" checked={slow} onChange={e => setSlow(e.target.checked)} className="w-5 h-5" /> 慢動作 Slow

            </label>

            <div className="flex gap-1.5">

              {["electrons", "conventional"].map(k => (

                <button key={k} type="button" onClick={() => setFlowMode(k)}

                  className={"px-3 py-2 rounded-xl text-sm font-semibold min-h-[44px] border " + (flowMode === k ? "text-white" : "bg-white text-slate-700 border-slate-200")}

                  style={flowMode === k ? {background: ACCENT, borderColor: ACCENT} : {}}>{k === "electrons" ? "電子 Electrons" : "慣例電流 Conventional"}</button>

              ))}

            </div>

            <button type="button" onClick={() => { setE(6); setR1(4); setR2(8); setTopo("series"); setClosed(true); setPlaying(true); setSlow(false); setFlowMode("electrons"); S.current.o = null; }} className="ml-auto px-4 py-2 rounded-xl text-sm font-bold bg-white border border-slate-300 min-h-[44px]">重設 Reset</button>

          </div>

        </div>

      );

    }



        const GUIDED = [
      { id: "g1", level: 1, q: "A 6 V battery drives a 12 Ω resistor. What current flows?", qZh: "6 V 電池接 12 Ω 電阻，電流是多少？",
        opts: ["0.5 A", "2 A", "6 A", "72 A"], a: "0.5 A",
        hint: "I = V/R = 6/12 = 0.5 A。" },
      { id: "g2", level: 1, q: "In a series circuit with two resistors, which quantity is the same for both?", qZh: "兩個電阻串聯，哪個量對兩者相同？",
        opts: ["Current 電流", "Voltage 電壓", "Power 功率", "Resistance 電阻"], a: "Current 電流",
        hint: "只有一條路徑，電流相同。" },
      { id: "g3", level: 1, q: "Two resistors in parallel share the same…", qZh: "兩個電阻並聯，兩者相同的是…",
        opts: ["Voltage 電壓", "Current 電流", "Resistance 電阻", "Heat 熱"], a: "Voltage 電壓",
        hint: "並聯兩端接在相同兩點，電壓相同。" },
      { id: "g4", level: 2, q: "R₁ = 3 Ω and R₂ = 6 Ω in series on a 9 V battery. Current?", qZh: "3 Ω 與 6 Ω 串聯接 9 V，電流？",
        opts: ["1 A", "3 A", "9 A", "0.5 A"], a: "1 A",
        hint: "串聯總電阻 3 + 6 = 9 Ω，I = 9/9 = 1 A。" },
      { id: "g5", level: 2, q: "Same two resistors (3 Ω, 6 Ω) in parallel on 9 V. Current through the 3 Ω branch?", qZh: "同樣 3 Ω 與 6 Ω 改為並聯接 9 V，3 Ω 支路的電流？",
        opts: ["3 A", "1.5 A", "1 A", "6 A"], a: "3 A",
        hint: "並聯每條支路得到全部電壓：I = 9/3 = 3 A。" },
      { id: "g6", level: 2, q: "Why does the total resistance drop when you add a parallel branch?", qZh: "為什麼多加一條並聯支路，總電阻會下降？",
        opts: ["Charge has more paths to flow 電荷有更多路徑", "Resistors get smaller 電阻器本身變小", "Voltage decreases 電壓下降", "Electrons slow down 電子變慢"], a: "Charge has more paths to flow 電荷有更多路徑",
        hint: "路徑愈多，同一電壓下總電流愈大，等效電阻愈小。" }
    ];
    const EXAM = [
      { id: "e1", level: 3, q: "R₁ = 4 Ω and R₂ = 12 Ω in series on a 12 V supply. Voltage across R₂?", qZh: "4 Ω 與 12 Ω 串聯接 12 V，12 Ω 那個電阻（R₂）的電壓？",
        opts: ["9 V", "3 V", "12 V", "6 V"], a: "9 V",
        hint: "I = 12/(4+12) = 0.75 A。V₂ = IR₂ = 0.75 × 12 = 9 V。" },
      { id: "e2", level: 3, q: "A 60 W lamp runs on 12 V. What current does it draw, and what is its resistance?", qZh: "60 W 燈泡接 12 V，電流與電阻是多少？",
        opts: ["5 A, 2.4 Ω", "5 A, 12 Ω", "0.2 A, 60 Ω", "2 A, 6 Ω"], a: "5 A, 2.4 Ω",
        hint: "I = P/V = 60/12 = 5 A。R = V/I = 12/5 = 2.4 Ω。" },
      { id: "e3", level: 3, q: "In the simulation, doubling EMF (fixed R) does what to current and power in a resistor?", qZh: "電阻不變，電動勢加倍，電流與功率怎樣變？",
        opts: ["I doubles, P quadruples 電流加倍、功率四倍", "I doubles, P doubles 電流與功率都加倍", "I unchanged, P doubles 電流不變、功率加倍", "I quadruples, P quadruples 電流與功率都四倍"], a: "I doubles, P quadruples 電流加倍、功率四倍",
        hint: "I = V/R 加倍。P = I²R 變成 (2I)²R = 4I²R。" },
      { id: "e4", level: 4, q: "Three 6 Ω resistors: two in parallel with each other, then in series with the third. Total resistance?", qZh: "三個 6 Ω：其中兩個先並聯，再與第三個串聯。總電阻？",
        opts: ["9 Ω", "18 Ω", "2 Ω", "12 Ω"], a: "9 Ω",
        hint: "並聯一對是 3 Ω，再串 6 Ω：3 + 6 = 9 Ω。" },
      { id: "e5", level: 4, q: "A student opens the switch on the main line of the parallel simulation. Branch currents become…", qZh: "並聯模擬中，學生斷開主線上的開關，各支路電流變為…",
        opts: ["Zero everywhere 處處為零", "Half 一半", "Unchanged 不變", "Doubled 加倍"], a: "Zero everywhere 處處為零",
        hint: "開關在主線上。斷路後沒有閉合迴路，所有電流為零。" },
      { id: "e6", level: 4, q: "Which arrangement makes two identical bulbs brightest, and why?", qZh: "兩隻相同燈泡怎樣接最亮？為什麼？",
        opts: ["Parallel — each gets full voltage 並聯，每隻得到全部電壓", "Series — current doubles 串聯，電流加倍", "Series — voltage adds on one bulb 串聯，電壓加在同一隻", "No difference 沒有分別"], a: "Parallel — each gets full voltage 並聯，每隻得到全部電壓",
        hint: "亮度看功率 P = V²/R。並聯每隻得到全部 V；串聯每隻大約只得一半 V。" }
    ];

function UpgradeCTA({ reason, onClose, onTrial }) {

      return (

        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4">

          <div className="w-full max-w-md rounded-2xl p-5 bg-white border border-slate-200">

            <h3 className="text-lg font-bold" style={{color: ACCENT}}>解鎖完整練習與家長進度</h3>

            <p className="text-sm mt-2 text-slate-600">{reason || window.SUBSCRIBE_CONFIG.bannerText}</p>

            <ul className="mt-3 text-sm space-y-1 list-disc list-inside text-slate-600">

              <li>Unlimited daily drills</li>

              <li>Full wrong-answer book</li>

              <li>Progress sync (coming)</li>

            </ul>

            <button type="button" onClick={onTrial} className="mt-4 w-full min-h-[48px] rounded-xl font-semibold text-white" style={{background: ACCENT}}>開始 14 日試用（本機）</button>

            <a href={HKC.MARKETING_PATH} className="mt-2 block w-full min-h-[44px] text-center leading-[44px] rounded-xl border border-slate-300 text-sm">了解計劃</a>

            <button type="button" onClick={onClose} className="mt-2 w-full text-sm underline text-slate-500">繼續免費</button>

          </div>

        </div>

      );

    }



    function Drill({ bank, label, onNeedUpgrade, onDone }) {

      const [qi, setQi] = useState(0);

      const [fb, setFb] = useState(null);

      const [score, setScore] = useState(0);

      const [hint, setHint] = useState(false);

      const [first, setFirst] = useState(true);

      const item = bank[qi];



      function pick(opt) {

        if (HKC.freeCapReached()) {

          if (window.HkcSubscribe) HkcSubscribe.showPaywall("hit_free_cap");

          onNeedUpgrade("已達免費練習上限");

          return;

        }

        HKC.recordDrillUse(APP_ID);

        const ok = opt === item.a; phyBeep(ok);

        setFb(ok

          ? { ok: true, msg: "正確 Correct" }

          : { ok: false, msg: "未中。請用提示看方法，不會直接顯示答案。" });

        if (ok) {

          if (typeof HKC.recordOk === "function") HKC.recordOk(APP_ID, item);

          if (first) setScore(s => s + 1);

        } else {

          HKC.addWrong(APP_ID, { id: item.id, prompt: item.q, hint: item.hint, answer: item.a });

          setFirst(false);

        }

      }



      function next() {

        setFb(null); setHint(false); setFirst(true);

        if (qi + 1 >= bank.length) {

          HKC.recordSession(APP_ID, score, bank.length);

          onDone(score, bank.length);

        } else setQi(qi + 1);

      }



      return (

        <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">

          <div className="flex justify-between text-sm mb-3 text-slate-500">

            <span>{label} · Q {qi + 1}/{bank.length} · Lv {item.level}</span>

            <span>Score {score}</span>

          </div>

          <h2 className="text-lg font-bold mb-1">{item.q}</h2>

          {item.qZh ? <p className="text-sm mb-4 opacity-80" style={{color: ACCENT}}>{item.qZh}</p> : <div className="mb-4" />}

          <div className="grid gap-2">

            {item.opts.map(o => (

              <button key={o} type="button" disabled={fb && fb.ok} onClick={() => pick(o)}

                className="text-left px-4 py-3 rounded-xl min-h-[48px] disabled:opacity-50 bg-slate-50 hover:bg-slate-100 border border-slate-200">{o}</button>

            ))}

          </div>

          <button type="button" className="text-sm mt-3 font-semibold min-h-[44px]" style={{color: ACCENT}} onClick={() => setHint(true)}>提示 Hint</button>

          {hint && <p className="text-sm mt-1 p-3 rounded-xl bg-amber-50 text-amber-900 border border-amber-200">{item.hint}</p>}

          {fb && (

            <div className={"mt-4 p-3 rounded-xl text-sm " + (fb.ok ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800")}>

              {fb.msg}

              {fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={next}>下一步 Next</button>}

              {!fb.ok && <button type="button" className="block mt-2 underline font-semibold" onClick={() => setFb(null)}>Retry</button>}

            </div>

          )}

        </section>

      );

    }



    function App() {

      const { isZh, lang, t } = useLang();

      const [mode, setMode] = useState("learn");

      const [progress, setProgress] = useState(() => HKC.loadProgress(APP_ID));

      const [pay, setPay] = useState(false);

      const [payReason, setPayReason] = useState("");

      const [doneMsg, setDoneMsg] = useState(null);

      const [tfzDone, setTfzDone] = useState(() => { try { return !!localStorage.getItem("hkc_tfz_" + APP_ID); } catch (e) { return false; } });



      function refresh() { setProgress(HKC.loadProgress(APP_ID)); }

      useEffect(() => { refresh(); }, [mode]);

      function completeTfz() {

        try { localStorage.setItem("hkc_tfz_" + APP_ID, "1"); } catch (e) {}

        setTfzDone(true); setMode("lab");

      return (

        <div className="max-w-5xl mx-auto p-4 sm:p-8">

          <div className="flex flex-wrap justify-between items-center gap-2">

            <a href="../../index.html" className="text-sm hover:underline font-semibold" style={{color: ACCENT}}>{flagshipUi("hub")}</a>
            <LangSwitcher />
          </div>

          <header className="mt-4 mb-4">

            <p className="text-xs uppercase tracking-widest font-bold" style={{color: ACCENT}}>{flagshipUi("subtitle")}</p>

            <h1 className="text-2xl sm:text-3xl font-bold mt-1">{flagshipUi("title")}</h1>

          </header>



          <div className="text-sm border border-dashed rounded-lg px-3 py-2 mb-3 flex flex-wrap justify-between gap-2 items-center border-slate-300 bg-white/80">

            <span>{HKC.isPaid() ? (HKC.getEntitlement().tier + " · " + t("無限", "unlimited")) : (t("免費", "Free") + " · " + HKC.remainingFree() + "/" + HKC.FREE_DAILY_CAP + " " + t("今日", "today"))} · {t("最佳", "Best")} {progress.bestScore}</span>

            {!HKC.isPaid() && (

              <button type="button" className="px-3 py-1.5 rounded-md text-xs font-semibold text-white min-h-[36px]" style={{background: ACCENT}} onClick={() => setPay(true)}>{t("升級", "Upgrade")}</button>

            )}

          </div>



          <nav className="flex flex-wrap gap-2 mb-4">

            {tabs.map(tab => (

              <button key={tab.id} type="button" onClick={() => { setMode(tab.id); setDoneMsg(null); }}

                style={mode === tab.id ? {background: ACCENT} : {}}>

                {tab.label}

            ))}

          </nav>



          {mode === "learn" && <LearnFromZero steps={TFZ_STEPS} onComplete={completeTfz} />}



          {mode === "lab" && !tfzDone && (

            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">

              <h2 className="text-xl font-bold">{t("請先完成由零開始 A1–A8", "Finish Learn From Zero A1–A8 first")}</h2>

              <p className="text-sm text-slate-500 mt-2">{t("先學模型，再做實驗。", "We teach the model before you play.")}</p>

              <button type="button" className="mt-4 px-4 py-2.5 rounded-xl font-semibold text-white min-h-[48px]" style={{background: ACCENT}} onClick={() => setMode("learn")}>{t("前往學習 →", "Go to Learn →")}</button>

            </section>

          )}

          {mode === "lab" && tfzDone && (

            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5">

              <h2 className="font-bold text-lg mb-3">{t("電路沙盒", "Live Circuit Sandbox")}</h2>

              <CircuitSim />

            </section>

          )}



          {mode === "guided" && !doneMsg && (

            <Drill bank={GUIDED} label="Guided" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}

              onDone={(s, n) => { setDoneMsg({ s, n, next: "exam" }); refresh(); }} />

          )}

          {mode === "exam" && !doneMsg && (

            <Drill bank={EXAM} label="Exam" onNeedUpgrade={r => { setPayReason(r); setPay(true); }}

              onDone={(s, n) => { setDoneMsg({ s, n, next: "review" }); refresh(); }} />

          )}

          {doneMsg && (mode === "guided" || mode === "exam") && (

            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-6 text-center">

              <h2 className="text-2xl font-bold">{t("完成", "Complete")}</h2>

              <p className="mt-2">{doneMsg.s} / {doneMsg.n}</p>

              <button type="button" className="mt-4 px-4 py-2 rounded-xl font-semibold min-h-[48px] text-white" style={{background: ACCENT}}

                onClick={() => { setDoneMsg(null); setMode(doneMsg.next); }}>{t("繼續 →", "Continue →")}</button>

            </section>

          )}

          {mode === "review" && (

            <section className="bg-white border border-slate-200 shadow-sm rounded-2xl p-4 sm:p-5 space-y-3">

              <h2 className="font-bold text-lg">{t("錯題簿", "Wrong-answer book")}</h2>

              {(progress.wrongBook || []).length === 0 && <p className="text-sm text-slate-500">{t("暫無錯題", "No wrong answers yet")}</p>}

              {(progress.wrongBook || []).map(w => (

                <div key={w.id} className="rounded-xl p-3 text-sm border border-slate-200">

                  <p className="font-semibold">{w.prompt}</p>

                  <p className="mt-1 opacity-80" style={{color: ACCENT}}>{w.hint}</p>

                  {HKC.isPaid() && <p className="mt-1 text-emerald-500">Answer unlocked</p>}

                  <button type="button" className="text-xs underline mt-2 text-slate-500" onClick={() => { HKC.removeWrong(APP_ID, w.id); refresh(); }}>Mark resolved</button>

                </div>

              ))}

            </section>

          )}

          {pay && <UpgradeCTA reason={payReason} onClose={() => setPay(false)} onTrial={() => { HKC.startTrialLocal(); setPay(false); refresh(); }} />}

        </div>

      );

    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
