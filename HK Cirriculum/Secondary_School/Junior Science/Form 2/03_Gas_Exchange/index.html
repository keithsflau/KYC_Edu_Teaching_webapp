(function(){

    {titleEn:"Gas exchange in life",titleZh:"生命裡的氣體交換",bodyEn:"Both respiration and photosynthesis involve gas exchange.",bodyZh:"呼吸作用和光合作用都涉及氣體交換。",qEn:"Photosynthesis takes in ___ and releases ___.",qZh:"光合作用吸收___並釋放___。",opts:["CO₂ in, O₂ out 吸收 CO₂、釋放 O₂","O₂ in, CO₂ out 吸收 O₂、釋放 CO₂","N₂ only 只有 N₂","No gases 無氣體"],a:"CO₂ in, O₂ out 吸收 CO₂、釋放 O₂",whyEn:"Opposite to respiration.",whyZh:"與呼吸作用相反。"},
    {titleEn:"Gas exchange in plants",titleZh:"植物的氣體交換",bodyEn:"Plants exchange gases through stomata on leaves.",bodyZh:"植物經葉片氣孔交換氣體。",qEn:"Stomata are mainly on…",qZh:"氣孔主要在…",opts:["Leaves 葉","Roots only 只有根","Flowers only 只有花","Stem bark 樹皮"],a:"Leaves 葉",whyEn:"Gas exchange surface.",whyZh:"氣體交換表面。"},
    {titleEn:"Hydrogencarbonate indicator",titleZh:"碳酸氫鹽指示劑",bodyEn:"Indicator changes colour with CO₂: high → yellow; low → red/purple.",bodyZh:"指示劑隨 CO₂ 變色：高 → 黃；低 → 紅/紫。",qEn:"Yellow means CO₂ is…",qZh:"黃色表示 CO₂…",opts:["High 高","Low 低","Zero 零","Unchanged 不變"],a:"High 高",whyEn:"Classic school experiment.",whyZh:"經典學校實驗。"},
    {titleEn:"Alveoli in humans",titleZh:"人體肺泡",bodyEn:"Gas exchange in lungs occurs in alveoli.",bodyZh:"肺部氣體交換在肺泡進行。",qEn:"Oxygen diffuses from alveoli into…",qZh:"氧從肺泡擴散進入…",opts:["Blood 血液","Stomach 胃","Bone 骨","Skin only 只有皮膚"],a:"Blood 血液",whyEn:"O₂ binds to haemoglobin.",whyZh:"O₂ 與血紅蛋白結合。"},
    {titleEn:"Diffusion factors",titleZh:"擴散因素",bodyEn:"Rate depends on concentration difference, surface area and membrane thickness.",bodyZh:"擴散速率取決於濃度差、表面面積和膜厚度。",qEn:"Emphysema reduces surface area, so exchange…",qZh:"肺氣腫減少表面面積，氣體交換…",opts:["Slows down 變慢","Speeds up 變快","Unchanged 不變","Stops completely 完全停止"],a:"Slows down 變慢",whyEn:"Less area for diffusion.",whyZh:"擴散面積減少。"},
    {titleEn:"Ready for the lab",titleZh:"準備進入實驗",bodyEn:"Adjust alveolar conditions and predict transfer rates.",bodyZh:"調節肺泡條件，預測交換速率。",qEn:"Experiment unlocks after…",qZh:"實驗分頁在…之後解鎖",opts:["Learn section 學習部分","Closing browser 關閉瀏覽器","Nothing 無需"],a:"Learn section 學習部分",whyEn:"LGER flow.",whyZh:"LGER 流程。"}
  ];
  var GUIDED=[
    {qEn:"Respiration gas exchange:",qZh:"呼吸作用的氣體交換：",opts:["O₂ in, CO₂ out 吸收 O₂、釋放 CO₂","CO₂ in, O₂ out 吸收 CO₂、釋放 O₂","Only N₂ 只有 N₂","No exchange 無交換"],a:"O₂ in, CO₂ out 吸收 O₂、釋放 CO₂",hintEn:"Opposite to photosynthesis.",hintZh:"與光合作用相反。"},
    {qEn:"Snail + indicator turns yellow because…",qZh:"蜗牛+指示劑變黃因…",opts:["CO₂ from respiration increased CO₂ 呼吸釋 CO₂","O₂ increased O₂ 增加","Photosynthesis only 只有光合作用","No gas change 無氣體變化"],a:"CO₂ from respiration increased CO₂ 呼吸釋 CO₂",hintEn:"Snail respires.",hintZh:"蜗牛呼吸。"},
    {qEn:"Plant in sunlight + indicator turns red because…",qZh:"阳光下植物+指示劑變紅/紫因…",opts:["CO₂ used in photosynthesis CO₂ 被光合作用消耗","CO₂ increased CO₂ 增加","No stomata 無氣孔","Only heat 只有熱"],a:"CO₂ used in photosynthesis CO₂ 被光合作用消耗",hintEn:"Low CO₂.",hintZh:"CO₂ 減少。"},
    {qEn:"Thin alveolar walls help because…",qZh:"肺泡壁薄有助於…",opts:["Shorter diffusion distance 縮短擴散距離","Store more air 儲更多空氣","Stop blood flow 阻止血流","Increase thickness 增加厚度"],a:"Shorter diffusion distance 縮短擴散距離",hintEn:"Fick's law idea.",hintZh:"擴散原理。"}
  ];
  var SUMMARY=[{en:"Photosynthesis: CO₂ in, O₂ out. Respiration: O₂ in, CO₂ out.",zh:"光合作用：CO₂ 入、O₂ 出。呼吸：O₂ 入、CO₂ 出。"},{en:"Indicator: yellow (high CO₂) → orange → red/purple (low).",zh:"指示劑：黃（高 CO₂）→ 橙 → 紅/紫（低）。"},{en:"Alveoli: large surface area, thin walls.",zh:"肺泡：表面面積大、壁薄。"},{en:"Diffusion faster with larger gradient, more area, thinner membrane.",zh:"濃度差越大、面積越大、膜越薄，擴散越快。"}];
  var REVIEW=[
    {qEn:"Daytime net gas exchange in a healthy plant:",qZh:"白天健康植物淨氣體交換：",opts:["Net CO₂ uptake 淨吸收 CO₂","Net O₂ uptake only 只淨吸收 O₂","No exchange 無交換","Only N₂ 只有 N₂"],a:"Net CO₂ uptake 淨吸收 CO₂"},
    {qEn:"Indicator orange ≈",qZh:"指示劑橙色 ≈",opts:["Normal air CO₂ 正常空氣 CO₂","Very high CO₂ 極高 CO₂","Zero CO₂ 零 CO₂","Pure O₂ 純氧"],a:"Normal air CO₂ 正常空氣 CO₂"},
    {qEn:"CO₂ diffuses from blood into alveoli when…",qZh:"CO₂ 從血液擴散入肺泡當…",opts:["Blood CO₂ higher than alveolar air 血液 CO₂ 高於肺泡","Blood O₂ higher 血液 O₂ 高","No gradient 無濃度差","Membrane thick 膜厚"],a:"Blood CO₂ higher than alveolar air 血液 CO₂ 高於肺泡"},
    {qEn:"Stomata close partly to reduce…",qZh:"氣孔部分關閉以減少…",opts:["Water loss 水分流失","O₂ gain O₂ 吸收","Root growth 根生長","Light entry 光進入"],a:"Water loss 水分流失"},
    {qEn:"Gas exchange always occurs by…",qZh:"氣體交換總是經…",opts:["Diffusion 擴散","Pumping only 只有泵","Gravity 重力","Magnetism 磁性"],a:"Diffusion 擴散"}
  ];
  function updateChrome(){
    document.getElementById("back-link").textContent="← "+t("返回","Back");
    document.getElementById("unit-label").textContent=t("中二 · 生物與空氣","Form 2 · Living Things & Air");
    document.getElementById("title-label").textContent=t("肺泡氣體交換","Alveolar Gas Exchange");
    document.getElementById("flow-label").textContent=t("學習 → 引導 → 實驗 → 複習","LGER: Learn → Guided → Experiment → Review");
    var tabs=document.getElementById("tabs").querySelectorAll(".tab"),labels=[t("學習","Learn"),t("引導","Guided"),learnDone?t("實驗","Experiment"):t("實驗 🔒","Experiment 🔒"),t("複習","Review")];
    for(var i=0;i<tabs.length;i++){tabs[i].textContent=labels[i];tabs[i].classList.toggle("active",tabs[i].dataset.mode===mode);}
  }
  function renderLearn(){
    var step=LEARN[learnIdx],last=learnIdx>=LEARN.length-1,h='<section class="card"><p class="progress">'+esc(t("由零開始學","Learn From Zero"))+" · "+(learnIdx+1)+" / "+LEARN.length+'</p><div class="bar">';
    for(var b=0;b<LEARN.length;b++)h+='<span class="'+(b<=learnIdx?"on":"")+'"></span>'; h+='</div><h2>'+esc(t(step.titleZh,step.titleEn))+'</h2><p>'+esc(t(step.bodyZh,step.bodyEn))+'</p><p><strong>'+esc(t(step.qZh,step.qEn))+'</strong></p><div class="opts">';
    step.opts.forEach(function(o,i){var c="opt",ok=isCorrect(o,step.a,i);if(learnPicked!==null){if(ok)c+=" correct";else if(learnPicked===i)c+=" wrong";else c+=" dim";}h+='<button type="button" class="'+c+'" data-opt="'+i+'">'+esc(o)+'</button>';});
    h+='</div>';if(learnPicked!==null&&isCorrect(step.opts[learnPicked],step.a,learnPicked))h+='<button class="btn" id="ln">'+esc(last?t("開始實驗 →","Start Experiment →"):t("下一步 →","Next →"))+'</button></section>';
    document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(learnPicked!==null)return;learnPicked=+b.dataset.opt;renderLearn();};});
    var nb=document.getElementById("ln");if(nb)nb.onclick=function(){if(last){try{localStorage.setItem("hkc_js_lger_"+APP_ID,"1");}catch(e){}learnDone=true;mode="experiment";learnIdx=0;learnPicked=null;}else{learnIdx++;learnPicked=null;}updateChrome();render();};
  }
  function renderGuided(){
    var item=GUIDED[guidedIdx],h='<section class="card"><p>'+esc(t("引導練習","Guided Practice"))+" · "+(guidedIdx+1)+"/"+GUIDED.length+'</p><p><strong>'+esc(t(item.qZh,item.qEn))+'</strong></p><div class="opts">';
    item.opts.forEach(function(o,i){var c="opt",ok=isCorrect(o,item.a,i);if(guidedPicked!==null){if(ok)c+=" correct";else if(guidedPicked===i)c+=" wrong";else c+=" dim";}h+='<button type="button" class="'+c+'" data-opt="'+i+'">'+esc(o)+'</button>';});
    h+='</div>';if(guidedPicked!==null&&isCorrect(item.opts[guidedPicked],item.a,guidedPicked))h+='<button class="btn" id="gn">'+esc(guidedIdx+1>=GUIDED.length?t("前往複習 →","Go to Review →"):t("下一題 →","Next →"))+'</button></section>';
    document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(guidedPicked!==null)return;guidedPicked=+b.dataset.opt;renderGuided();};});
    var nb=document.getElementById("gn");if(nb)nb.onclick=function(){if(guidedIdx+1>=GUIDED.length){mode="review";guidedIdx=0;guidedPicked=null;}else{guidedIdx++;guidedPicked=null;}updateChrome();render();};
  }
  function renderExperiment(){
    if(!learnDone){document.getElementById("panel").innerHTML='<section class="card" style="text-align:center"><h2>'+esc(t("請先完成學習部分","Complete Learn first"))+'</h2><button class="btn" id="gl">'+esc(t("前往學習 →","Go to Learn →"))+'</button></section>';document.getElementById("gl").onclick=function(){mode="learn";updateChrome();render();};return;}
    var gradient=Math.max(0,o2Air-o2Blood),rate=Math.round((gradient*area)/Math.max(10,thickness)),co2In=Math.round(rate*0.75);
    var h='<section class="card"><h2>'+esc(t("動手探究","Hands-on task"))+'</h2><p>'+esc(t("調節肺泡氧分壓、血液氧含量、表面面積和膜厚度。","Adjust alveolar O₂, blood O₂, surface area and thickness."))+'</p>';
    h+='<label>'+esc(t("肺泡 O₂ (%)","Alveolar O₂ (%)"))+': <span id="oa">'+o2Air+'</span></label><input type="range" min="10" max="21" value="'+o2Air+'" id="o2a" '+(running?"disabled":"")+'/>';
    h+='<label>'+esc(t("血液 O₂ (%)","Blood O₂ (%)"))+': <span id="ob">'+o2Blood+'</span></label><input type="range" min="5" max="95" value="'+o2Blood+'" id="o2b" '+(running?"disabled":"")+'/>';
    h+='<label>'+esc(t("肺泡表面面積","Alveolar surface area"))+': <span id="ar">'+area+'</span>%</label><input type="range" min="10" max="100" value="'+area+'" id="area-r" '+(running?"disabled":"")+'/>';
    h+='<label>'+esc(t("膜厚度（反向）","Membrane thickness (inverse)"))+': <span id="th">'+thickness+'</span>%</label><input type="range" min="10" max="100" value="'+thickness+'" id="thick-r" '+(running?"disabled":"")+'/>';
    h+='<div class="stats"><div class="stat"><small>O₂ → blood</small><div class="stat-val">'+rate+'</div></div><div class="stat"><small>CO₂ → alveoli</small><div class="stat-val" style="color:#e11d48">'+co2In+'</div></div></div>';
    h+='<div class="ctrl"><button class="btn" id="run" '+(running?"disabled":"")+'>'+esc(running?t("進行中… "+simProgress+"%","Running… "+simProgress+"%"):t("開始實驗","Start run"))+'</button><button class="btn secondary" id="reset">'+esc(t("重設","Reset"))+'</button></div></section>';
    document.getElementById("panel").innerHTML=h;
    document.getElementById("o2a").oninput=function(e){o2Air=+e.target.value;document.getElementById("oa").textContent=o2Air;if(!running)renderExperiment();};
    document.getElementById("o2b").oninput=function(e){o2Blood=+e.target.value;document.getElementById("ob").textContent=o2Blood;if(!running)renderExperiment();};
    document.getElementById("area-r").oninput=function(e){area=+e.target.value;document.getElementById("ar").textContent=area;if(!running)renderExperiment();};
    document.getElementById("thick-r").oninput=function(e){thickness=+e.target.value;document.getElementById("th").textContent=thickness;if(!running)renderExperiment();};
    document.getElementById("run").onclick=function(){if(running)return;running=true;simProgress=0;var p=0;timer=setInterval(function(){p+=4;simProgress=p;if(p>=100){clearInterval(timer);running=false;if(rate>=50)toast(t("高效氣體交換！","Efficient gas exchange!"));else toast(t("交換偏慢 — 增大濃度差或表面面積","Slow exchange — widen gradient or area"));}renderExperiment();},60);};
    document.getElementById("reset").onclick=function(){if(timer)clearInterval(timer);running=false;simProgress=0;o2Air=21;o2Blood=40;area=70;thickness=50;renderExperiment();};
  }
  function renderReview(){
    if(reviewDone){document.getElementById("panel").innerHTML='<section class="card" style="text-align:center"><h2>'+esc(t("複習完成！","Review Complete!"))+'</h2><p>'+reviewCorrect+"/"+REVIEW.length+" "+esc(t("題正確","correct"))+'</p></section>';return;}
    var item=REVIEW[reviewIdx],h='<section class="card"><h2>'+esc(t("重點摘要","Key Summary"))+'</h2><ul>';SUMMARY.forEach(function(s){h+="<li>"+esc(t(s.zh,s.en))+"</li>";});
    h+='</ul><hr style="border:none;border-top:1px solid #e2e8f0;margin:1rem 0"/><h2>'+esc(t("自我測驗","Self-Check Quiz"))+" ("+(reviewIdx+1)+"/"+REVIEW.length+")</h2><p><strong>"+esc(t(item.qZh,item.qEn))+'</strong></p><div class="opts">';
    item.opts.forEach(function(o,i){var c="opt",ok=isCorrect(o,item.a,i);if(reviewPicked!==null){if(ok)c+=" correct";else if(reviewPicked===i)c+=" wrong";else c+=" dim";}h+='<button type="button" class="'+c+'" data-opt="'+i+'">'+esc(o)+'</button>';});
    h+='</div>';if(reviewPicked!==null)h+='<button class="btn" id="rn">'+esc(reviewIdx+1>=REVIEW.length?t("查看成績","See Results"):t("下一題","Next"))+'</button></section>';
    document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(reviewPicked!==null)return;reviewPicked=+b.dataset.opt;if(isCorrect(item.opts[reviewPicked],item.a,reviewPicked))reviewCorrect++;renderReview();};});
    var nb=document.getElementById("rn");if(nb)nb.onclick=function(){if(reviewIdx+1>=REVIEW.length)reviewDone=true;else{reviewIdx++;reviewPicked=null;}renderReview();};
  }
  function render(){if(mode==="learn")renderLearn();else if(mode==="guided")renderGuided();else if(mode==="experiment")renderExperiment();else renderReview();}
  if(window.NcsI18n)window.NcsI18n.onChange(function(){isZh=window.NcsI18n.isZh();updateChrome();render();});
  document.getElementById("tabs").onclick=function(e){var b=e.target.closest(".tab");if(!b)return;mode=b.dataset.mode;updateChrome();render();};
  if(window.NcsI18n)isZh=window.NcsI18n.isZh();updateChrome();render();
})();
