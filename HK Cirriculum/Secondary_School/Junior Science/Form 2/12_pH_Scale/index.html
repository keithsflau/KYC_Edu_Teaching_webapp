<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The pH Scale · pH 值標度 | S2 Junior Science</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f0f9ff; color: #0f172a; line-height: 1.5; }
    .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem 1.25rem 2rem; min-height: 100vh; }
    a { color: #8b5cf6; font-weight: 600; text-decoration: none; }
    .unit { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8b5cf6; margin: 0.5rem 0 0; }
    h1 { font-size: 1.75rem; margin: 0.25rem 0; }
    .sub { font-size: 0.875rem; color: #64748b; margin: 0.25rem 0 1rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .tab { border: 1px solid #e2e8f0; background: #fff; border-radius: 0.5rem; padding: 0.5rem 0.9rem; font-weight: 600; cursor: pointer; min-height: 44px; }
    .tab.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1.25rem; }
    .card h2 { margin: 0 0 0.75rem; color: #8b5cf6; }
    .opts { display: grid; gap: 0.5rem; margin: 0.75rem 0; }
    .opt { text-align: left; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 0.75rem; padding: 0.75rem 1rem; cursor: pointer; min-height: 48px; }
    .opt.correct { background: #ecfdf5; border-color: #6ee7b7; }
    .opt.wrong { background: #fff1f2; border-color: #fda4af; }
    .opt.dim { opacity: 0.5; }
    .btn { border: none; border-radius: 0.75rem; background: #8b5cf6; color: #fff; font-weight: 700; padding: 0.65rem 1.25rem; cursor: pointer; min-height: 48px; }
    .bar { display: flex; gap: 4px; margin-bottom: 1rem; }
    .bar span { flex: 1; height: 6px; border-radius: 999px; background: #e2e8f0; }
    .bar span.on { background: #8b5cf6; }
    .ph-display { height: 5rem; border-radius: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-weight: 800; margin: 1rem 0; }
    .match-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 0.5rem 0; }
    .match-row select { flex: 1; min-height: 44px; border-radius: 0.75rem; border: 1px solid #e2e8f0; padding: 0.5rem; }
    .match-row select.ok { border-color: #6ee7b7; background: #ecfdf5; }
    .match-row select.bad { border-color: #fda4af; background: #fff1f2; }
    input[type=range] { width: 100%; accent-color: #8b5cf6; }
    footer { text-align: center; padding: 1rem; font-size: 0.8rem; opacity: 0.7; border-top: 1px solid #e2e8f0; margin-top: 2rem; }
  </style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <script data-ncs-kit="fleet-init">
  (function(){function b(){if(!window.NcsI18n||window.NcsI18n.isInitialized())return;window.NcsI18n.init({chromePath:"../../../../_shared/ncs-chrome.json",target:document.body});}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",b);else b();})();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>使用 pH 小於 7 為酸、7 為中性、大於 7 為鹼。</li><li>不用品嚐或觸摸來鑒別實驗室的酸和鹼。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div class="wrap" id="app">
    <a href="../index.html" id="back-link">← Back</a>
    <p class="unit" id="unit-label">Form 2 · Acids &amp; Alkalis</p>
    <h1 id="title-label">The pH Scale</h1>
    <p class="sub" id="flow-label">LGER: Learn → Guided → Experiment → Review</p>
    <nav class="tabs" id="tabs">
      <button type="button" class="tab active" data-mode="learn">Learn</button>
      <button type="button" class="tab" data-mode="guided">Guided</button>
      <button type="button" class="tab" data-mode="experiment">Experiment 🔒</button>
      <button type="button" class="tab" data-mode="review">Review</button>
    </nav>
    <main id="panel"><section class="card"><h2>Acids and alkalis in daily life</h2><p>Do not taste or touch laboratory acids and alkalis.</p></section></main>
  </div>
  <footer>@HKSTEAMAI All Copy-Right Reserved.</footer>
  <script>
(function(){
  "use strict";
  var APP_ID="s2_ph_scale",isZh=false,mode="learn";
  var learnIdx=0,learnPicked=null,learnDone=false;
  try{learnDone=localStorage.getItem("hkc_js_lger_"+APP_ID)==="1";}catch(e){}
  var guidedIdx=0,guidedPicked=null,reviewIdx=0,reviewPicked=null,reviewCorrect=0,reviewDone=false;
  var ph=7,matched={};
  function t(z,e){return isZh?z:e;}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function isCorrect(o,a,i){return typeof a==="number"?i===a:o===a;}
  function phColor(p){var hue=p<7?0:p>7?280:120,sat=Math.min(90,Math.abs(p-7)*12+40),light=55-Math.abs(p-7)*1.5;return"hsl("+hue+","+sat+"%,"+light+"%)";}
  var SUBSTANCES=[{id:"lemon",zh:"檸檬汁",en:"Lemon juice",ph:2.5},{id:"vinegar",zh:"醋",en:"Vinegar",ph:3},{id:"water",zh:"純水",en:"Pure water",ph:7},{id:"soap",zh:"肥皂水",en:"Soap",ph:10},{id:"lime",zh:"石灰水",en:"Limewater",ph:12}];
  var LEARN=[
    {titleEn:"Acids and alkalis in daily life",titleZh:"生活中的酸和鹼",bodyEn:"Vinegar and lemon juice are acids; soap solution is alkaline. Do not taste or touch laboratory acids and alkalis to identify them.",bodyZh:"醋和檸檬是酸，肥皂水是鹼。實驗室的酸和鹼不可品嚐，也不可用手觸摸來分辨。",qEn:"Common acid in the kitchen?",qZh:"廚房裡哪種是常見的酸？",opts:["Vinegar 醋","Soap solution 肥皂水","Table salt 食鹽","Cooking oil 食油"],a:"Vinegar 醋",whyEn:"Contains ethanoic acid.",whyZh:"含乙酸。"},
    {titleEn:"The pH scale",titleZh:"pH 標度",bodyEn:"pH measures acidity/alkalinity from 0 to 14. Pure water is neutral at pH 7.",bodyZh:"pH 由 0 至 14。純水 pH = 7。",qEn:"Neutral pH is…",qZh:"中性 pH 是…",opts:["7","0","14","1"],a:"7",whyEn:"Pure water at 25 °C.",whyZh:"25 °C 純水。"},
    {titleEn:"Strong vs weak",titleZh:"強與弱",bodyEn:"pH < 7 → acidic; pH > 7 → alkaline.",bodyZh:"pH < 7 → 酸性；pH > 7 → 鹼性。",qEn:"Lower pH (more acidic)?",qZh:"哪種 pH 較低？",opts:["Gastric juice ~2 胃液 ~2","Pure water 7 純水 7","Soap ~10 肥皂 ~10","Limewater ~12 石灰水 ~12"],a:"Gastric juice ~2 胃液 ~2",whyEn:"Smaller number = more acidic.",whyZh:"數字越小越酸。"},
    {titleEn:"Indicators",titleZh:"指示劑",bodyEn:"Universal indicator: red (acid) → green (neutral) → purple (alkali).",bodyZh:"通用指示劑：紅 → 綠 → 紫。",qEn:"Green when pH is…",qZh:"呈綠色時 pH…",opts:["About 7 約 7","About 1 約 1","About 13 約 13","Always red 總是紅色"],a:"About 7 約 7",whyEn:"Green = neutral zone.",whyZh:"綠色 = 中性區。"},
    {titleEn:"Safety",titleZh:"安全",bodyEn:"Concentrated acids and alkalis are corrosive — wear goggles.",bodyZh:"濃酸濃鹼有腐蝕性——戴護目鏡。",qEn:"In the lab you should…",qZh:"在實驗室你應該…",opts:["Wear goggles with corrosive chemicals 戴護目鏡","Taste to test pH 品嚐測 pH","Pour alkali into eyes 把鹼倒入眼","Ignore spills 忽略溢出"],a:"Wear goggles with corrosive chemicals 戴護目鏡",whyEn:"Lab safety rule.",whyZh:"實驗室安全守則。"},
    {titleEn:"Ready for the lab",titleZh:"準備進入實驗",bodyEn:"Match substances to approximate pH.",bodyZh:"把日常物質配對到近似 pH。",qEn:"Experiment unlocks after…",qZh:"實驗分頁在…之後解鎖",opts:["Learn section 學習部分","Closing browser 關閉瀏覽器","Nothing 無需"],a:"Learn section 學習部分",whyEn:"LGER flow.",whyZh:"LGER 流程。"}
  ];
  var GUIDED=[
    {qEn:"pH of pure water:",qZh:"純水的 pH：",opts:["7","0","14","3"],a:"7",hintEn:"Neutral.",hintZh:"中性。"},
    {qEn:"Lemon juice is…",qZh:"檸檬汁是…",opts:["Acidic (pH < 7) 酸性","Alkaline (pH > 7) 鹼性","Neutral 中性","pH 14"],a:"Acidic (pH < 7) 酸性",hintEn:"Sour taste.",hintZh:"檸檬汁的 pH 小於 7。"},
    {qEn:"Bleach (dilute) is usually…",qZh:"稀漂白水通常是…",opts:["Alkaline 鹼性","Strongly acidic 強酸性","Neutral 中性","pH 0"],a:"Alkaline 鹼性",hintEn:"Household cleaner.",hintZh:"家居清潔劑。"},
    {qEn:"As pH increases from 3 to 10…",qZh:"pH 由 3 升至 10…",opts:["Less acidic / more alkaline 較少酸/較鹼","More acidic 更酸","Neutral only 只有中性","Unchanged 不變"],a:"Less acidic / more alkaline 較少酸/較鹼",hintEn:"Higher pH = less H⁺.",hintZh:"pH 升高 = H⁺ 減少。"}
  ];
  var SUMMARY=[{en:"pH 0–14: acids < 7, neutral = 7, alkalis > 7.",zh:"pH 0–14：酸 < 7，中性 = 7，鹼 > 7。"},{en:"Universal indicator: red → green → purple.",zh:"通用指示劑：紅 → 綠 → 紫。"},{en:"Examples: gastric ~2, lemon ~3, water 7, soap ~10, limewater ~12.",zh:"例子：胃液 ~2、檸檬 ~3、水 7、肥皂 ~10、石灰水 ~12。"},{en:"Handle acids/alkalis safely.",zh:"安全使用酸/鹼。"}];
  var REVIEW=[
    {qEn:"Most acidic:",qZh:"最酸的是：",opts:["Battery acid ~1 電池酸 ~1","Milk ~6 牛奶 ~6","Rainwater ~5.6 雨水 ~5.6","Seawater ~8 海水 ~8"],a:"Battery acid ~1 電池酸 ~1"},
    {qEn:"Litmus in alkaline solution:",qZh:"鹼性溶液中的石蕊：",opts:["Blue 藍","Red 紅","Green 綠","Colourless 無色"],a:"Blue 藍"},
    {qEn:"pH 11 means…",qZh:"pH 11 表示…",opts:["Alkaline 鹼性","Strong acid 強酸","Neutral 中性","No ions 無離子"],a:"Alkaline 鹼性"},
    {qEn:"Adding water to acid (correct practice):",qZh:"加水入酸（正確做法）：",opts:["Add acid to water slowly 將酸慢慢加入水中","Add water to concentrated acid 將水加入濃酸","Mix in closed bottle 在密封瓶混合","No rule 無規則"],a:"Add acid to water slowly 將酸慢慢加入水中"},
    {qEn:"HK rain slightly acidic due to…",qZh:"香港雨水略酸因…",opts:["Dissolved CO₂ / pollution 溶解 CO₂/污染","Too much soap 太多肥皂","Sea salt only 只有海鹽","pH always 7 pH 恆為 7"],a:"Dissolved CO₂ / pollution 溶解 CO₂/污染"}
  ];
  function updateChrome(){
    document.getElementById("back-link").textContent="← "+t("返回","Back");
    document.getElementById("unit-label").textContent=t("中二 · 酸與鹼","Form 2 · Acids & Alkalis");
    document.getElementById("title-label").textContent=t("pH 值標度","The pH Scale");
    document.getElementById("flow-label").textContent=t("學習 → 引導 → 實驗 → 複習","LGER: Learn → Guided → Experiment → Review");
    var tabs=document.getElementById("tabs").querySelectorAll(".tab"),labels=[t("學習","Learn"),t("引導","Guided"),learnDone?t("實驗","Experiment"):t("實驗 🔒","Experiment 🔒"),t("複習","Review")];
    for(var i=0;i<tabs.length;i++){tabs[i].textContent=labels[i];tabs[i].classList.toggle("active",tabs[i].dataset.mode===mode);}
  }
  function renderLearn(){
    var step=LEARN[learnIdx],last=learnIdx>=LEARN.length-1,h='<section class="card"><p>'+esc(t("由零開始學","Learn From Zero"))+" · "+(learnIdx+1)+" / "+LEARN.length+'</p><div class="bar">';
    for(var b=0;b<LEARN.length;b++)h+='<span class="'+(b<=learnIdx?"on":"")+'"></span>'; h+='</div><h2>'+esc(t(step.titleZh,step.titleEn))+'</h2><p>'+esc(t(step.bodyZh,step.bodyEn))+'</p><p><strong>'+esc(t(step.qZh,step.qEn))+'</strong></p><div class="opts">';
    step.opts.forEach(function(o,i){var c="opt",ok=isCorrect(o,step.a,i);if(learnPicked!==null){if(ok)c+=" correct";else if(learnPicked===i)c+=" wrong";else c+=" dim";}h+='<button type="button" class="'+c+'" data-opt="'+i+'">'+esc(o)+'</button>';});
    h+='</div>';if(learnPicked!==null&&isCorrect(step.opts[learnPicked],step.a,learnPicked))h+='<button class="btn" id="ln">'+esc(last?t("開始實驗 →","Start Experiment →"):t("下一步 →","Next →"))+'</button></section>';
    document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(learnPicked!==null)return;learnPicked=+b.dataset.opt;renderLearn();};});
    var nb=document.getElementById("ln");if(nb)nb.onclick=function(){if(last){try{localStorage.setItem("hkc_js_lger_"+APP_ID,"1");}catch(e){}learnDone=true;mode="experiment";learnIdx=0;learnPicked=null;}else{learnIdx++;learnPicked=null;}updateChrome();render();};
  }
  function renderGuided(){
    var item=GUIDED[guidedIdx],h='<section class="card"><p>'+esc(t("引導練習","Guided Practice"))+" · "+(guidedIdx+1)+"/"+GUIDED.length+'</p><p><strong>'+esc(t(item.qZh,item.qEn))+'</strong></p><div class="opts">';
    item.opts.forEach(function(o,i){var c="opt",ok=isCorrect(o,item.a,i);if(guidedPicked!==null){if(ok)c+=" correct";else if(guidedPicked===i)c+=" wrong";else c+=" dim";}h+='<button type="button" class="'+c+'" data-opt="'+i+'">'+esc(o)+'</button>';});
    h+='</div>';if(guidedPicked!==null&&isCorrect(item.opts[guidedPicked],item.a,guidedPicked))h+='<button class="btn" id="gn">'+esc(guidedIdx+1>=GUIDED.length?t("前往複習 →","Go to Review →"):t("下一題 →","Next →"))+'</button></section>';
    document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(guidedPicked!==null)return;guidedPicked=+b.dataset.opt;renderGuided();};});
    var nb=document.getElementById("gn");if(nb)nb.onclick=function(){if(guidedIdx+1>=GUIDED.length){mode="review";guidedIdx=0;guidedPicked=null;}else{guidedIdx++;guidedPicked=null;}updateChrome();render();};
  }
  function renderExperiment(){
    if(!learnDone){document.getElementById("panel").innerHTML='<section class="card" style="text-align:center"><h2>'+esc(t("請先完成學習部分","Complete Learn first"))+'</h2><button class="btn" id="gl">'+esc(t("前往學習 →","Go to Learn →"))+'</button></section>';document.getElementById("gl").onclick=function(){mode="learn";updateChrome();render();};return;}
    var label=ph<7?t("酸性","Acidic"):ph>7?t("鹼性","Alkaline"):t("中性","Neutral"),allDone=SUBSTANCES.every(function(s){return matched[s.id]===s.ph;});
    var h='<section class="card"><h2>'+esc(t("動手探究","Hands-on task"))+'</h2><p>'+esc(t("拖動 pH 滑桿，然後把每種物質配對到最接近的 pH。","Drag pH slider, match each substance."))+'</p>';
    h+='<input type="range" min="0" max="14" step="0.5" value="'+ph+'" id="ph-r"/>';
    h+='<div class="ph-display" id="ph-box" style="background:'+phColor(ph)+'"><span style="font-size:1.75rem">pH '+ph+'</span><span style="font-size:0.875rem;opacity:0.9">'+esc(label)+'</span></div>';
    SUBSTANCES.forEach(function(s){
      var sel=matched[s.id],ok=sel===s.ph,bad=sel!=null&&!ok;
      h+='<div class="match-row"><span style="min-width:6rem;font-weight:600">'+esc(t(s.zh,s.en))+'</span><select data-id="'+s.id+'" class="'+(ok?"ok":bad?"bad":"")+'"><option value="">'+esc(t("選 pH…","Pick pH…"))+'</option>';
      [1,2.5,3,7,10,12].forEach(function(v){h+='<option value="'+v+'"'+(sel===v?" selected":"")+'>pH '+v+'</option>';});
      h+='</select>'+(ok?' <span style="color:#10b981;font-weight:700">✓</span>':'')+'</div>';
    });
    if(allDone)h+='<p style="text-align:center;font-weight:700;color:#10b981">'+esc(t("全部配對正確！","All matched correctly!"))+'</p>';
    h+='</section>';document.getElementById("panel").innerHTML=h;
    document.getElementById("ph-r").oninput=function(e){ph=+e.target.value;renderExperiment();};
    document.getElementById("panel").querySelectorAll("select").forEach(function(sel){sel.onchange=function(){matched[sel.dataset.id]=sel.value?+sel.value:null;renderExperiment();};});
  }
  function renderReview(){
    if(reviewDone){document.getElementById("panel").innerHTML='<section class="card" style="text-align:center"><h2>'+esc(t("複習完成！","Review Complete!"))+'</h2><p>'+reviewCorrect+"/"+REVIEW.length+" "+esc(t("題正確","correct"))+'</p></section>';return;}
    var item=REVIEW[reviewIdx],h='<section class="card"><h2>'+esc(t("重點摘要","Key Summary"))+'</h2><ul>';SUMMARY.forEach(function(s){h+="<li>"+esc(t(s.zh,s.en))+"</li>";});
    h+='</ul><hr style="border:none;border-top:1px solid #e2e8f0;margin:1rem 0"/><h2>'+esc(t("自我測驗","Self-Check Quiz"))+" ("+(reviewIdx+1)+"/"+REVIEW.length+")</h2><p><strong>"+esc(t(item.qZh,item.qEn))+'</strong></p><div class="opts">';
    item.opts.forEach(function(o,i){var c="opt",ok=isCorrect(o,item.a,i);if(reviewPicked!==null){if(ok)c+=" correct";else if(reviewPicked===i)c+=" wrong";else c+=" dim";}h+='<button type="button" class="'+c+'" data-opt="'+i+'">'+esc(o)+'</button>';});
    h+='</div>';if(reviewPicked!==null)h+='<button class="btn" id="rn">'+esc(reviewIdx+1>=REVIEW.length?t("查看成績","See Results"):t("下一題","Next"))+'</button></section>';
    document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(reviewPicked!==null)return;reviewPicked=+b.dataset.opt;if(isCorrect(item.opts[reviewPicked],item.a,reviewPicked))reviewCorrect++;renderReview();};});
    var nb=document.getElementById("rn");if(nb)nb.onclick=function(){if(reviewIdx+1>=REVIEW.length)reviewDone=true;else{reviewIdx++;reviewPicked=null;}renderReview();};
  }
  function render(){if(mode==="learn")renderLearn();else if(mode==="guided")renderGuided();else if(mode==="experiment")renderExperiment();else renderReview();}
  if(window.NcsI18n)window.NcsI18n.onChange(function(){isZh=window.NcsI18n.isZh();updateChrome();render();});
  document.getElementById("tabs").onclick=function(e){var b=e.target.closest(".tab");if(!b)return;mode=b.dataset.mode;updateChrome();render();};
  if(window.NcsI18n)isZh=window.NcsI18n.isZh();updateChrome();render();
})();
  </script>
</body>
</html>
