<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photosynthesis Lab · 光合作用實驗室 | S2 Junior Science</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f0f9ff; color: #0f172a; line-height: 1.5; }
    .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem 1.25rem 2rem; min-height: 100vh; }
    a { color: #16a34a; font-weight: 600; text-decoration: none; }
    .unit { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #16a34a; margin: 0.5rem 0 0; }
    h1 { font-size: 1.75rem; margin: 0.25rem 0; }
    .sub { font-size: 0.875rem; color: #64748b; margin: 0.25rem 0 1rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .tab { border: 1px solid #e2e8f0; background: #fff; border-radius: 0.5rem; padding: 0.5rem 0.9rem; font-weight: 600; cursor: pointer; min-height: 44px; }
    .tab.active { background: #16a34a; color: #fff; border-color: #16a34a; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1.25rem; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
    .card h2 { margin: 0 0 0.75rem; font-size: 1.125rem; color: #16a34a; }
    .opts { display: grid; gap: 0.5rem; margin: 0.75rem 0; }
    .opt { text-align: left; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 0.75rem; padding: 0.75rem 1rem; cursor: pointer; min-height: 48px; }
    .opt.correct { background: #ecfdf5; border-color: #6ee7b7; }
    .opt.wrong { background: #fff1f2; border-color: #fda4af; }
    .opt.dim { opacity: 0.5; }
    .btn { border: none; border-radius: 0.75rem; background: #16a34a; color: #fff; font-weight: 700; padding: 0.65rem 1.25rem; cursor: pointer; min-height: 48px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.secondary { background: #e2e8f0; color: #334155; }
    .why, .progress { font-size: 0.875rem; color: #475569; }
    .bar { display: flex; gap: 4px; margin-bottom: 1rem; }
    .bar span { flex: 1; height: 6px; border-radius: 999px; background: #e2e8f0; }
    .bar span.on { background: #16a34a; }
    ul.summary { margin: 0; padding-left: 1.25rem; }
    .plant-svg { width: 100%; max-width: 20rem; margin: 0 auto; display: block; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1rem 0; }
    .stat { padding: 0.75rem; border-radius: 0.75rem; text-align: center; border: 1px solid #e2e8f0; }
    .stat-val { font-size: 1.75rem; font-weight: 800; color: #16a34a; }
    input[type=range] { width: 100%; accent-color: #16a34a; }
    .ctrl { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .toast { position: fixed; top: 5rem; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 0.75rem 1.25rem; border-radius: 0.75rem; color: #fff; font-weight: 700; display: none; }
    .toast.show { display: block; }
    .toast.ok { background: #10b981; } .toast.warn { background: #f59e0b; }
    footer { text-align: center; padding: 1rem; font-size: 0.8rem; opacity: 0.7; border-top: 1px solid #e2e8f0; margin-top: 2rem; }
  </style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <script data-ncs-kit="fleet-init">
  (function(){function b(){if(!window.NcsI18n||window.NcsI18n.isInitialized())return;window.NcsI18n.init({chromePath:"../../../../_shared/ncs-chrome.json",target:document.body});}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",b);else b();})();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>寫出光合作用需要光、葉綠素、二氧化碳和水。</li><li>指出產物是葡萄糖和氧，植物日間也同時進行呼吸作用。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div class="wrap" id="app">
    <a href="../index.html" id="back-link">← Back</a>
    <p class="unit" id="unit-label">Form 2 · Living Things &amp; Air</p>
    <h1 id="title-label">Photosynthesis Lab</h1>
    <p class="sub" id="flow-label">LGER: Learn → Guided → Experiment → Review</p>
    <nav class="tabs" id="tabs">
      <button type="button" class="tab active" data-mode="learn">Learn</button>
      <button type="button" class="tab" data-mode="guided">Guided</button>
      <button type="button" class="tab" data-mode="experiment">Experiment 🔒</button>
      <button type="button" class="tab" data-mode="review">Review</button>
    </nav>
    <main id="panel"><section class="card"><h2>What is photosynthesis?</h2><p>Plants make their own food by photosynthesis.</p></section></main>
  </div>
  <div class="toast" id="toast"></div>
  <footer>@HKSTEAMAI All Copy-Right Reserved.</footer>
  <script>
(function(){
  "use strict";
  var ACCENT="#16a34a", APP_ID="s2_photosynthesis", isZh=false, mode="learn";
  var learnIdx=0,learnPicked=null,learnDone=false;
  try{learnDone=localStorage.getItem("hkc_js_lger_"+APP_ID)==="1";}catch(e){}
  var guidedIdx=0,guidedPicked=null,reviewIdx=0,reviewPicked=null,reviewCorrect=0,reviewDone=false;
  var light=50,co2=50,running=false,simProgress=0,timer=null;
  function t(z,e){return isZh?z:e;}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function isCorrect(o,a,i){return typeof a==="number"?i===a:o===a;}
  function showToast(msg,kind){var el=document.getElementById("toast");el.textContent=msg;el.className="toast show "+(kind||"ok");setTimeout(function(){el.className="toast";},2800);}
  var LEARN=[
    {titleEn:"What is photosynthesis?",titleZh:"什麼是光合作用？",bodyEn:"Plants make their own food by photosynthesis — a process that converts light energy into chemical energy stored in glucose.",bodyZh:"植物透過光合作用製造自己的食物——將光能轉化為儲存在葡萄糖中的化學能。",qEn:"Photosynthesis mainly occurs in…",qZh:"光合作用主要發生於…",opts:["Green leaves (chloroplasts) 綠色葉片（葉綠體）","Roots only 只有根","Flowers only 只有花","Soil 土壤"],a:"Green leaves (chloroplasts) 綠色葉片（葉綠體）",whyEn:"Chlorophyll captures light.",whyZh:"葉綠素吸收光。"},
    {titleEn:"Raw materials",titleZh:"原料",bodyEn:"Plants need carbon dioxide from air (through stomata) and water from soil (through roots).",bodyZh:"植物需要從空氣（經氣孔）取得二氧化碳，從土壤（經根）吸收水分。",qEn:"Which gas from air is used?",qZh:"光合作用使用空氣中的哪種氣體？",opts:["CO₂ 二氧化碳","O₂ 氧","N₂ 氮","CO 一氧化碳"],a:"CO₂ 二氧化碳",whyEn:"Carbon source for glucose.",whyZh:"葡萄糖的碳來源。"},
    {titleEn:"Energy source",titleZh:"能量來源",bodyEn:"Sunlight provides energy. Chlorophyll in chloroplasts absorbs light.",bodyZh:"陽光提供能量。葉綠體中的葉綠素吸收光。",qEn:"The energy comes from…",qZh:"光合作用的能量來自…",opts:["Sunlight 陽光","Soil minerals 土壤礦物","Oxygen 氧","Wind 風"],a:"Sunlight 陽光",whyEn:"Light drives the reaction.",whyZh:"光驅動反應。"},
    {titleEn:"Products",titleZh:"產物",bodyEn:"Glucose is made for growth. Oxygen is released as a by-product.",bodyZh:"製造葡萄糖供生長。氧作為副產物釋出。",qEn:"Gas released:",qZh:"光合作用釋放的氣體：",opts:["O₂ 氧","CO₂ 二氧化碳","N₂ 氮","H₂ 氫"],a:"O₂ 氧",whyEn:"Oxygen from splitting water.",whyZh:"來自水的分解。"},
    {titleEn:"Word equation",titleZh:"文字方程式",bodyEn:"CO₂ + H₂O → (light, chlorophyll) → glucose + O₂",bodyZh:"二氧化碳 + 水 →（光、葉綠素）→ 葡萄糖 + 氧",qEn:"Which are products?",qZh:"方程式中的產物是？",opts:["Glucose and oxygen 葡萄糖和氧","CO₂ and water CO₂ 和水","Chlorophyll only 只有葉綠素","Light only 只有光"],a:"Glucose and oxygen 葡萄糖和氧",whyEn:"Right-hand side = products.",whyZh:"右邊是產物。"},
    {titleEn:"Ready for the lab",titleZh:"準備進入實驗",bodyEn:"Adjust light and CO₂, run the simulation.",bodyZh:"調節光和 CO₂，運行模擬。",qEn:"Experiment unlocks after…",qZh:"實驗分頁在…之後解鎖",opts:["Learn section 學習部分","Closing browser 關閉瀏覽器","Nothing 無需"],a:"Learn section 學習部分",whyEn:"LGER flow.",whyZh:"LGER 流程。"}
  ];
  var GUIDED=[
    {qEn:"Starch test after sunlight turns iodine…",qZh:"葉片曬太陽後做澱粉測試，碘液…",opts:["Blue-black 藍黑色","Stays brown 保持棕色","Turns red 變紅","Turns green 變綠"],a:"Blue-black 藍黑色",hintEn:"Starch + iodine.",hintZh:"澱粉遇碘。"},
    {qEn:"If CO₂ is limited, rate…",qZh:"若 CO₂ 不足，速率…",opts:["Decreases 下降","Doubles 加倍","Unaffected 不變","Stops only at night 只在夜間停止"],a:"Decreases 下降",hintEn:"CO₂ is a raw material.",hintZh:"CO₂ 是原料。"},
    {qEn:"Photosynthesis gas exchange:",qZh:"植物氣體交換：光合作用…",opts:["Takes in CO₂, releases O₂ 吸收 CO₂、釋放 O₂","Takes in O₂, releases CO₂ 吸收 O₂、釋放 CO₂","Uses only N₂ 只用 N₂","No gas exchange 無氣體交換"],a:"Takes in CO₂, releases O₂ 吸收 CO₂、釋放 O₂",hintEn:"Opposite to respiration.",hintZh:"與呼吸作用相反。"},
    {qEn:"Variegated leaf experiment shows…",qZh:"斑葉實驗顯示光合作用需要…",opts:["Chlorophyll in green areas 綠色部分的葉綠素","White areas only 只有白色部分","No water 不需要水","Darkness 黑暗"],a:"Chlorophyll in green areas 綠色部分的葉綠素",hintEn:"Only green parts positive.",hintZh:"只有綠色部分呈陽性。"}
  ];
  var SUMMARY=[{en:"Photosynthesis: CO₂ + H₂O → glucose + O₂.",zh:"光合作用：CO₂ + H₂O → 葡萄糖 + O₂。"},{en:"Light, chlorophyll, CO₂ and water are needed.",zh:"需要光、葉綠素、CO₂ 和水。"},{en:"Rate depends on light and CO₂.",zh:"速率取決於光強和 CO₂。"},{en:"Glucose stored as starch — iodine test.",zh:"葡萄糖儲存為澱粉——碘液檢驗。"}];
  var REVIEW=[
    {qEn:"Main function for plants:",qZh:"主要功能：",opts:["Make food (glucose) 製造食物","Absorb oxygen 吸收氧","Release CO₂ only 只釋放 CO₂","Break down glucose 分解葡萄糖"],a:"Make food (glucose) 製造食物"},
    {qEn:"Which is a product?",qZh:"哪項是產物？",opts:["Oxygen 氧","Carbon dioxide 二氧化碳","Water 水","Light energy 光能"],a:"Oxygen 氧"},
    {qEn:"At night, rate is…",qZh:"夜間速率…",opts:["Very low or zero 很低或零","Maximum 最大","Same as noon 與中午相同","Doubled 加倍"],a:"Very low or zero 很低或零"},
    {qEn:"Stomata allow…",qZh:"氣孔允許…",opts:["CO₂ in and O₂ out CO₂ 入、O₂ 出","Only water in 只有水進入","Only starch out 只有澱粉排出","Nothing 無法通過"],a:"CO₂ in and O₂ out CO₂ 入、O₂ 出"},
    {qEn:"Balanced equation products:",qZh:"平衡方程式產物：",opts:["C₆H₁₂O₆ and 6O₂","6CO₂ and 6H₂O","Chlorophyll","Light only"],a:"C₆H₁₂O₆ and 6O₂"}
  ];
  function plantSvg(){
    var health=Math.min(light,co2)/100,leaf=health>0.6?"#22c55e":health>0.3?"#84cc16":"#a3a3a3";
    return '<svg class="plant-svg" viewBox="0 0 120 100"><rect x="52" y="70" width="16" height="28" fill="#92400e" rx="2"/><ellipse cx="60" cy="45" rx="35" ry="28" fill="'+leaf+'" opacity="0.9"/>'+(light>30?'<circle cx="95" cy="15" r="12" fill="#fde047" opacity="'+(light/100)+'"/>':'')+'</svg>';
  }
  function updateChrome(){
    document.getElementById("back-link").textContent="← "+t("返回","Back");
    document.getElementById("unit-label").textContent=t("中二 · 生物與空氣","Form 2 · Living Things & Air");
    document.getElementById("title-label").textContent=t("光合作用實驗室","Photosynthesis Lab");
    document.getElementById("flow-label").textContent=t("學習 → 引導 → 實驗 → 複習","LGER: Learn → Guided → Experiment → Review");
    var tabs=document.getElementById("tabs").querySelectorAll(".tab"),labels=[t("學習","Learn"),t("引導","Guided"),learnDone?t("實驗","Experiment"):t("實驗 🔒","Experiment 🔒"),t("複習","Review")];
    for(var i=0;i<tabs.length;i++){tabs[i].textContent=labels[i];tabs[i].classList.toggle("active",tabs[i].dataset.mode===mode);}
  }
  function renderLearn(){
    var step=LEARN[learnIdx],last=learnIdx>=LEARN.length-1,h='<section class="card"><p class="progress">'+esc(t("由零開始學","Learn From Zero"))+" · "+(learnIdx+1)+" / "+LEARN.length+'</p><div class="bar">';
    for(var b=0;b<LEARN.length;b++)h+='<span class="'+(b<=learnIdx?"on":"")+'"></span>'; h+='</div><h2>'+esc(t(step.titleZh,step.titleEn))+'</h2><p>'+esc(t(step.bodyZh,step.bodyEn))+'</p><p><strong>'+esc(t(step.qZh,step.qEn))+'</strong></p><div class="opts">';
    step.opts.forEach(function(o,i){var c="opt",ok=isCorrect(o,step.a,i);if(learnPicked!==null){if(ok)c+=" correct";else if(learnPicked===i)c+=" wrong";else c+=" dim";}h+='<button type="button" class="'+c+'" data-opt="'+i+'">'+esc(o)+'</button>';});
    h+='</div>';if(learnPicked!==null){var ok=isCorrect(step.opts[learnPicked],step.a,learnPicked);h+='<p class="why">'+esc(t(step.whyZh,step.whyEn))+'</p>';if(ok)h+='<button type="button" class="btn" id="ln">'+esc(last?t("開始實驗 →","Start Experiment →"):t("下一步 →","Next →"))+'</button>';}
    h+='</section>';document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(learnPicked!==null)return;learnPicked=+b.dataset.opt;renderLearn();};});
    var nb=document.getElementById("ln");if(nb)nb.onclick=function(){if(last){try{localStorage.setItem("hkc_js_lger_"+APP_ID,"1");}catch(e){}learnDone=true;mode="experiment";learnIdx=0;learnPicked=null;}else{learnIdx++;learnPicked=null;}updateChrome();render();};
  }
  function renderGuided(){
    var item=GUIDED[guidedIdx],h='<section class="card"><p class="progress">'+esc(t("引導練習","Guided Practice"))+" · "+(guidedIdx+1)+"/"+GUIDED.length+'</p><p><strong>'+esc(t(item.qZh,item.qEn))+'</strong></p><div class="opts">';
    item.opts.forEach(function(o,i){var c="opt",ok=isCorrect(o,item.a,i);if(guidedPicked!==null){if(ok)c+=" correct";else if(guidedPicked===i)c+=" wrong";else c+=" dim";}h+='<button type="button" class="'+c+'" data-opt="'+i+'">'+esc(o)+'</button>';});
    h+='</div>';if(guidedPicked!==null&&isCorrect(item.opts[guidedPicked],item.a,guidedPicked))h+='<button type="button" class="btn" id="gn">'+esc(guidedIdx+1>=GUIDED.length?t("前往複習 →","Go to Review →"):t("下一題 →","Next →"))+'</button>';
    h+='</section>';document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(guidedPicked!==null)return;guidedPicked=+b.dataset.opt;renderGuided();};});
    var nb=document.getElementById("gn");if(nb)nb.onclick=function(){if(guidedIdx+1>=GUIDED.length){mode="review";guidedIdx=0;guidedPicked=null;}else{guidedIdx++;guidedPicked=null;}updateChrome();render();};
  }
  function renderExperiment(){
    if(!learnDone){document.getElementById("panel").innerHTML='<section class="card" style="text-align:center"><h2>'+esc(t("請先完成學習部分","Complete Learn first"))+'</h2><button class="btn" id="gl">'+esc(t("前往學習 →","Go to Learn →"))+'</button></section>';document.getElementById("gl").onclick=function(){mode="learn";updateChrome();render();};return;}
    var rate=Math.round((light*co2)/100),glucose=Math.min(100,rate),o2=Math.round(glucose*0.9);
    var h='<section class="card"><h2>'+esc(t("動手探究","Hands-on task"))+'</h2><p>'+esc(t("調節光強和 CO₂，運行模擬觀察葡萄糖和氧的產量。","Adjust light and CO₂, run the sim."))+'</p>'+plantSvg();
    h+='<label>'+esc(t("光強","Light intensity"))+': <span id="lv">'+light+'</span>%</label><input type="range" min="0" max="100" value="'+light+'" id="light-r" '+(running?"disabled":"")+'/>';
    h+='<label>'+esc(t("二氧化碳","CO₂"))+': <span id="cv">'+co2+'</span>%</label><input type="range" min="0" max="100" value="'+co2+'" id="co2-r" '+(running?"disabled":"")+'/>';
    h+='<div class="stats"><div class="stat"><small>'+esc(t("葡萄糖","Glucose"))+'</small><div class="stat-val">'+glucose+'%</div></div><div class="stat"><small>O₂</small><div class="stat-val" style="color:#0284c7">'+o2+'%</div></div></div>';
    h+='<p style="text-align:center;font-size:0.8rem;color:#64748b">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</p>';
    h+='<div class="ctrl"><button class="btn" id="run" '+(running?"disabled":"")+'>'+esc(running?t("進行中… "+simProgress+"%","Running… "+simProgress+"%"):t("開始實驗","Start run"))+'</button><button class="btn secondary" id="reset">'+esc(t("重設","Reset"))+'</button></div></section>';
    document.getElementById("panel").innerHTML=h;
    document.getElementById("light-r").oninput=function(e){light=+e.target.value;document.getElementById("lv").textContent=light;if(!running)renderExperiment();};
    document.getElementById("co2-r").oninput=function(e){co2=+e.target.value;document.getElementById("cv").textContent=co2;if(!running)renderExperiment();};
    document.getElementById("run").onclick=function(){if(running)return;running=true;simProgress=0;var p=0;timer=setInterval(function(){p+=5;simProgress=p;if(p>=100){clearInterval(timer);running=false;if(glucose>=70)showToast(t("最佳光合作用速率！","Optimal photosynthesis rate!"),"ok");else showToast(t("速率偏低 — 調高光強或 CO₂","Low rate — increase light or CO₂"),"warn");}renderExperiment();},70);};
    document.getElementById("reset").onclick=function(){if(timer)clearInterval(timer);running=false;simProgress=0;light=50;co2=50;renderExperiment();};
  }
  function renderReview(){
    if(reviewDone){document.getElementById("panel").innerHTML='<section class="card" style="text-align:center"><h2>'+esc(t("複習完成！","Review Complete!"))+'</h2><p>'+reviewCorrect+"/"+REVIEW.length+" "+esc(t("題正確","correct"))+'</p></section>';return;}
    var item=REVIEW[reviewIdx],h='<section class="card"><h2>'+esc(t("重點摘要","Key Summary"))+'</h2><ul class="summary">';SUMMARY.forEach(function(s){h+="<li>"+esc(t(s.zh,s.en))+"</li>";});
    h+='</ul><hr style="border:none;border-top:1px solid #e2e8f0;margin:1rem 0"/><h2>'+esc(t("自我測驗","Self-Check Quiz"))+" ("+(reviewIdx+1)+"/"+REVIEW.length+")</h2><p><strong>"+esc(t(item.qZh,item.qEn))+'</strong></p><div class="opts">';
    item.opts.forEach(function(o,i){var c="opt",ok=isCorrect(o,item.a,i);if(reviewPicked!==null){if(ok)c+=" correct";else if(reviewPicked===i)c+=" wrong";else c+=" dim";}h+='<button type="button" class="'+c+'" data-opt="'+i+'">'+esc(o)+'</button>';});
    h+='</div>';if(reviewPicked!==null)h+='<button class="btn" id="rn">'+esc(reviewIdx+1>=REVIEW.length?t("查看成績","See Results"):t("下一題","Next"))+'</button></section>';
    document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(reviewPicked!==null)return;reviewPicked=+b.dataset.opt;if(isCorrect(item.opts[reviewPicked],item.a,reviewPicked))reviewCorrect++;renderReview();};});
    var nb=document.getElementById("rn");if(nb)nb.onclick=function(){if(reviewIdx+1>=REVIEW.length)reviewDone=true;else{reviewIdx++;reviewPicked=null;}renderReview();};
  }
  function render(){if(mode==="learn")renderLearn();else if(mode==="guided")renderGuided();else if(mode==="experiment")renderExperiment();else renderReview();}
  if(window.NcsI18n)window.NcsI18n.onChange(function(){isZh=window.NcsI18n.isZh();updateChrome();render();});
  document.getElementById("tabs").onclick=function(e){var b=e.target.closest(".tab");if(!b)return;mode=b.dataset.mode;updateChrome();render();};
  if(window.NcsI18n)isZh=window.NcsI18n.isZh();updateChrome();render();
})();
  </script>
</body>
</html>
