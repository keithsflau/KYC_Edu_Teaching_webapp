<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metals · 金屬 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #fafaf9; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>指出鐵生鏽需要氧和水。</li><li>說明油漆、油和鍍鋅能減慢生鏽，不是所有金屬都會生鏽。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#78716c";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Useful materials", titleZh: "有用的材料",
    bodyEn: "Metals are very useful materials used in many different ways — making tools, buildings, vehicles, electrical wires and ornaments.",
    bodyZh: "金屬是十分有用的材料，被廣泛用於製造工具、建築物、車輛、電線和飾物等。",
    qEn: "Metals are used for…", qZh: "金屬用於…",
    opts: ["Tools, buildings and wires 工具、建築和電線", "Only food 只有食物", "Only gases 只有氣體", "Only plastics 只有塑膠"], a: "Tools, buildings and wires 工具、建築和電線",
    why: "Opening from PPT Ch4. 第4章開篇。" },
  { titleEn: "Stone Age", titleZh: "石器時代",
    bodyEn: "Stones were easily found in nature. Humans first used stones to make tools and weapons (2 500 000 – 4000 B.C.) — the Stone Age came first.",
    bodyZh: "石頭在大自然中十分常見，容易取得。人類最先使用石頭製造工具和武器（公元前250萬–4000年）——石器時代最先開始。",
    qEn: "The Stone Age came first because…", qZh: "石器時代最先開始，因為…",
    opts: ["Stones were easy to obtain 石頭容易取得", "Iron was abundant 鐵蘊藏量高", "Bronze was strongest 青銅最堅硬", "Copper was rare 銅很稀有"], a: "Stones were easy to obtain 石頭容易取得",
    why: "Historical reason from PPT. 簡報歷史原因。" },
  { titleEn: "Copper Age", titleZh: "銅器時代",
    bodyEn: "Humans learned to extract copper from ores (4000 – 3000 B.C.). Copper is easier to shape than stone for tools and weapons.",
    bodyZh: "人類懂得從礦石提取銅（公元前4000–3000年）。銅比石頭更容易製造成不同形狀的工具和武器。",
    qEn: "Copper replaced stone partly because…", qZh: "銅部分取代石頭，因為…",
    opts: ["Easier to shape into tools 較易製造成工具", "Harder than iron 比鐵更硬", "Found as pure metal only 只以純金屬存在", "Does not conduct heat 不導熱"], a: "Easier to shape into tools 較易製造成工具",
    why: "Copper Age advantage from PPT. 銅器時代優點。" },
  { titleEn: "Bronze Age", titleZh: "青銅器時代",
    bodyEn: "Humans mixed tin with copper to make bronze (3000 – 1000 B.C.) — harder than pure copper. Bronze was used for containers, weapons, statues and ornaments.",
    bodyZh: "人類把錫與銅混合製成青銅（公元前3000–1000年）——比純銅更硬。青銅用於製造器皿、武器、雕像和飾物。",
    qEn: "Bronze is…", qZh: "青銅是…",
    opts: ["An alloy of copper and tin 銅和錫的合金", "Pure copper 純銅", "Pure iron 純鐵", "A non-metal 非金屬"], a: "An alloy of copper and tin 銅和錫的合金",
    why: "Bronze composition from PPT. 簡報青銅成分。" },
  { titleEn: "Iron Age", titleZh: "鐵器時代",
    bodyEn: "Iron is abundant in Earth's crust and much stronger than bronze. Iron replaced bronze as the main material from ~1000 B.C. to present — iron is the most widely used metal today.",
    bodyZh: "鐵在地殼蘊藏量高，且較青銅堅硬。約公元前1000年至今，鐵取代青銅成為主要材料——鐵是現今最廣泛使用的金屬。",
    qEn: "Iron became dominant because…", qZh: "鐵成為主要材料，因為…",
    opts: ["High abundance and greater strength 蘊藏量高且更堅硬", "Easier to find than stone 比石頭更易找", "Lighter than copper 比銅更輕", "Does not rust 不會生鏽"], a: "High abundance and greater strength 蘊藏量高且更堅硬",
    why: "Iron Age factors from PPT. 鐵器時代因素。" },
  { titleEn: "Metal ores", titleZh: "金屬礦石",
    bodyEn: "Most metals are found as compounds in metal ores (rocks/soil in Earth's crust). Only a few metals like gold and platinum occur as elements. Extraction ease and abundance affect when metals were discovered.",
    bodyZh: "大部分金屬以化合物形式存在於金屬礦石（地殼中的岩石或土壤）。只有少數如金和鉑以元素形式存在。提取難易和蘊藏量影響金屬的發現時間。",
    qEn: "Most metals in nature are found as…", qZh: "自然界中大部分金屬以…存在",
    opts: ["Compounds in ores 礦石中的化合物", "Pure elements only 只有純元素", "Gases only 只有氣體", "Liquids only 只有液體"], a: "Compounds in ores 礦石中的化合物",
    why: "Occurrence from PPT Ch4. 第4章存在形式。" },
];
const GUIDED = [
  { qEn: "Historical order of ages:", qZh: "各時代的先後次序：",
    opts: ["Stone → Copper → Bronze → Iron 石→銅→青銅→鐵", "Iron → Stone → Bronze → Copper 鐵→石→青銅→銅", "Bronze → Iron → Stone → Copper 青銅→鐵→石→銅", "All at same time 同時"], a: "Stone → Copper → Bronze → Iron 石→銅→青銅→鐵",
    hint: "Timeline from PPT. 簡報時間線。" },
  { qEn: "Copper came before iron because copper is…", qZh: "銅比鐵早，因為銅…",
    opts: ["Easier to extract 較易提取", "Rarer on Earth 在地球上更稀有", "Stronger than iron 比鐵更硬", "A non-metal 是非金屬"], a: "Easier to extract 較易提取",
    hint: "Extraction ease from PPT. 提取難易。" },
  { qEn: "Bauxite is an ore of…", qZh: "鋁土礦是…的礦石",
    opts: ["Aluminium 鋁", "Iron 鐵", "Copper 銅", "Gold 金"], a: "Aluminium 鋁",
    hint: "Contains Al₂O₃. 含 Al₂O₃。" },
  { qEn: "Platinum in nature is usually found as…", qZh: "自然界中鉑通常以…存在",
    opts: ["An element (uncombined) 元素（未化合）", "Only in compounds 只在化合物中", "A gas 氣體", "A liquid 液體"], a: "An element (uncombined) 元素（未化合）",
    hint: "Few metals occur as elements. 少數金屬以元素存在。" },
];
const SUMMARY = [
  { en: "Human history: Stone Age → Copper Age → Bronze Age → Iron Age, based on main materials used.", zh: "人類歷史：石器→銅器→青銅器→鐵器時代，按主要使用材料劃分。" },
  { en: "Discovery and use depend on ease of extraction and abundance in Earth's crust.", zh: "金屬的發現和應用與提取難易及地殼蘊藏量有關。" },
  { en: "Iron is the most widely used metal today due to high abundance and strength.", zh: "鐵因地殼蘊藏量高且堅硬，是現今最廣泛使用的金屬。" },
  { en: "Most metals occur as compounds in ores; only a few (e.g. gold, platinum) as elements.", zh: "大部分金屬以化合物形式存在於礦石；只有少數（如金、鉑）以元素形式存在。" },
];
const REVIEW = [
  { qEn: "First age in human history:", qZh: "人類歷史最先的時代：",
    opts: ["Stone Age 石器時代", "Iron Age 鐵器時代", "Bronze Age 青銅器時代", "Copper Age 銅器時代"], a: "Stone Age 石器時代" },
  { qEn: "Bronze is made from…", qZh: "青銅由…製成",
    opts: ["Copper + tin 銅+錫", "Iron + carbon 鐵+碳", "Gold + silver 金+銀", "Aluminium + oxygen 鋁+氧"], a: "Copper + tin 銅+錫" },
  { qEn: "Most widely used metal today:", qZh: "現今最廣泛使用的金屬：",
    opts: ["Iron 鐵", "Gold 金", "Platinum 鉑", "Mercury 汞"], a: "Iron 鐵" },
  { qEn: "Most metals in ores are…", qZh: "礦石中大部分金屬是…",
    opts: ["Compounds 化合物", "Pure elements 純元素", "Gases 氣體", "Mixtures only 只是混合物"], a: "Compounds 化合物" },
  { qEn: "Copper Age came before Iron Age because…", qZh: "銅器時代比鐵器時代早，因為…",
    opts: ["Copper is easier to extract 銅較易提取", "Iron is more abundant 鐵蘊藏量較高", "Stone is stronger 石頭更堅硬", "Bronze is lighter 青銅更輕"], a: "Copper is easier to extract 銅較易提取" },
];

const AGES = [
  { id: "stone", zh: "石器時代", en: "Stone Age", years: "2.5M–4000 BC", mat: { zh: "石頭", en: "Stone" }, hard: 2, shape: 1, abund: 5 },
  { id: "copper", zh: "銅器時代", en: "Copper Age", years: "4000–3000 BC", mat: { zh: "銅", en: "Copper" }, hard: 3, shape: 4, abund: 3 },
  { id: "bronze", zh: "青銅器時代", en: "Bronze Age", years: "3000–1000 BC", mat: { zh: "青銅", en: "Bronze" }, hard: 5, shape: 4, abund: 3 },
  { id: "iron", zh: "鐵器時代", en: "Iron Age", years: "1000 BC–now", mat: { zh: "鐵", en: "Iron" }, hard: 8, shape: 5, abund: 5 },
];
const CARDS = [
  { zh: "硬度高", en: "High hardness", age: "iron" },
  { zh: "容易取得", en: "Easy to obtain", age: "stone" },
  { zh: "較易塑型", en: "Easy to shape", age: "copper" },
  { zh: "比純銅更硬", en: "Harder than copper", age: "bronze" },
];

function ExperimentLab({ isZh, accent }) {
  const [age, setAge] = useState("stone");
  const [sorted, setSorted] = useState({});
  const t = window.JSLGER.t;
  const cur = AGES.find(a => a.id === age);
  const bar = (v, label) => (
    <div key={label.en} className="flex items-center gap-2 text-xs">
      <span className="w-16 text-slate-500">{t(label.zh, label.en, isZh)}</span>
      <div className="flex-1 bg-slate-200 rounded-full h-3"><div className="h-3 rounded-full" style={{ width: v*10+"%", background: accent }} /></div>
      <span className="w-4 font-bold">{v}</span>
    </div>
  );
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("選擇時代，查看材料性質；把性質卡配對到正確時代。", "Select an age to see properties; match property cards to the correct age.", isZh)}</p>
      <div className="flex gap-1 flex-wrap">
        {AGES.map(a => (
          <button key={a.id} type="button" onClick={() => setAge(a.id)} className={"px-3 py-2 rounded-lg text-xs font-bold min-h-[40px] border " + (age === a.id ? "text-white" : "bg-white")}
            style={age === a.id ? { background: accent, borderColor: accent } : { borderColor: "#e7e5e4" }}>{t(a.zh, a.en, isZh)}</button>
        ))}
      </div>
      <div className="p-4 rounded-2xl bg-white border-2 space-y-2" style={{ borderColor: accent }}>
        <p className="font-bold" style={{ color: accent }}>{t(cur.zh, cur.en, isZh)} ({cur.years})</p>
        <p className="text-sm">{t("主要材料","Main material",isZh)}: {t(cur.mat.zh, cur.mat.en, isZh)}</p>
        {bar(cur.hard, { zh: "硬度", en: "Hardness" })}
        {bar(cur.shape, { zh: "可塑性", en: "Workability" })}
        {bar(cur.abund, { zh: "蘊藏量", en: "Abundance" })}
      </div>
      <p className="text-sm font-bold">{t("選定時代後，點性質卡配對：","Select an age, then tap a property card to assign:",isZh)}</p>
      <div className="grid grid-cols-2 gap-2">
        {CARDS.map((c, i) => {
          const assigned = sorted[i];
          const ok = assigned && assigned === c.age;
          const bad = assigned && assigned !== c.age;
          return (
          <button key={i} type="button" onClick={() => setSorted(s => ({ ...s, [i]: age }))}
            className={"p-3 rounded-xl border text-xs font-semibold min-h-[48px] " + (ok ? "border-emerald-400 bg-emerald-50" : bad ? "border-rose-300 bg-rose-50" : "bg-white border-slate-200")}>
            {t(c.zh, c.en, isZh)}{assigned ? " → " + t(AGES.find(a=>a.id===assigned).zh, AGES.find(a=>a.id===assigned).en, isZh) : ""}
            {ok && " ✓"}{bad && " ✗"}
          </button>
          );
        })}
      </div>
      {Object.keys(sorted).length === 4 && Object.entries(sorted).every(([i,v]) => CARDS[+i].age === v) && <p className="text-center text-sm font-bold text-emerald-600">{t("全部配對正確！","All matched correctly!",isZh)}</p>}
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_metals", titleEn: "Metals", titleZh: "金屬", unit: "Form 3 · Book 13 Matter" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
