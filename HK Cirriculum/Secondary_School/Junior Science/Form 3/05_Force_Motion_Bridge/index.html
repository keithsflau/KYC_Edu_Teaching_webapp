<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Force & Motion Bridge · 力與運動銜接 | S3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #ecfeff; }</style>
  <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#0891b2";
    const { Shell } = window.JSLGER;

    const LEARN = [
      { titleEn: "Newton's First Law", titleZh: "牛頓第一定律",
        bodyEn: "An object stays at rest or constant velocity unless a resultant force acts on it (inertia).",
        bodyZh: "除非有合力作用，否則物體保持靜止或勻速直線運動（慣性）。",
        qEn: "Seat belts protect against…", qZh: "安全帶防護…",
        opts: [{ en: "Inertia in a crash", zh: "撞車時的慣性" }, { en: "Gravity disappearing", zh: "重力消失" }, { en: "Magnetism", zh: "磁性" }], a: 0,
        whyEn: "Body keeps moving when car stops.", whyZh: "車停時身體仍向前。" },
      { titleEn: "Newton's Second Law", titleZh: "牛頓第二定律",
        bodyEn: "F = ma: resultant force (N) = mass (kg) × acceleration (m/s²).",
        bodyZh: "F = ma：合力（N）= 質量（kg）× 加速度（m/s²）。",
        qEn: "Same force on heavier mass → acceleration…", qZh: "相同力作用於較大質量 → 加速度…",
        opts: [{ en: "Smaller", zh: "較小" }, { en: "Larger", zh: "較大" }, { en: "Infinite", zh: "無限" }], a: 0,
        whyEn: "a = F/m.", whyZh: "a = F/m。" },
      { titleEn: "Newton's Third Law", titleZh: "牛頓第三定律",
        bodyEn: "Every action has an equal and opposite reaction (forces on different bodies).",
        bodyZh: "每個作用力都有大小相等、方向相反的反作用力（作用於不同物體）。",
        qEn: "You push wall, wall pushes you…", qZh: "你推牆，牆推你…",
        opts: [{ en: "Equally back", zh: "同樣向後" }, { en: "Not at all", zh: "完全沒有" }, { en: "Only if wall moves", zh: "只有牆動才有" }], a: 0,
        whyEn: "Force pairs.", whyZh: "力成對出現。" },
      { titleEn: "Friction and drag", titleZh: "摩擦力與阻力",
        bodyEn: "Friction opposes motion; terminal velocity when drag equals weight for falling objects.",
        bodyZh: "摩擦力阻礙運動；下落物體當阻力等於重量時達終端速度。",
        qEn: "Parachute works by…", qZh: "降落傘靠…",
        opts: [{ en: "Increasing air resistance", zh: "增加空氣阻力" }, { en: "Removing gravity", zh: "除去重力" }, { en: "Adding mass only", zh: "只增加質量" }], a: 0,
        whyEn: "Slows descent safely.", whyZh: "安全減慢下降。" },
      { titleEn: "v-t graphs", titleZh: "速度-時間圖",
        bodyEn: "Slope = acceleration; area under graph = distance travelled.",
        bodyZh: "斜率 = 加速度；圖下面积 = 行駛距離。",
        qEn: "Horizontal v-t line means…", qZh: "水平 v-t 線表示…",
        opts: [{ en: "Constant velocity", zh: "勻速" }, { en: "Maximum acceleration", zh: "最大加速度" }, { en: "At rest only", zh: "只有靜止" }], a: 0,
        whyEn: "Velocity not changing.", whyZh: "速度不變。" },
      { titleEn: "F = ma calculator", titleZh: "F = ma 計算器",
        bodyEn: "Use sliders to predict motion for 文憑試-style problems.",
        bodyZh: "用滑桿預測 文憑試 式力學問題。",
        qEn: "Doubling force with same mass doubles…", qZh: "質量不變，力加倍則…加倍",
        opts: [{ en: "Acceleration", zh: "加速度" }, { en: "Mass", zh: "質量" }, { en: "Time always", zh: "時間總是" }], a: 0,
        whyEn: "Direct proportion in F=ma.", whyZh: "F=ma 中成正比。" }
    ];

    const GUIDED = [
      { qEn: "Resultant force zero → object…", qZh: "合力為零 → 物體…",
        opts: [{ en: "Constant velocity", zh: "勻速" }, { en: "Must speed up", zh: "必須加速" }, { en: "Must stop instantly", zh: "必須立刻停" }], a: 0,
        hintEn: "Newton I.", hintZh: "牛頓第一定律。" },
      { qEn: "Weight on Earth (N) ≈ …", qZh: "地球上重量(N) ≈ …",
        opts: [{ en: "10 × mass(kg)", zh: "10 × 質量(kg)" }, { en: "mass only", zh: "只有質量" }, { en: "0 always", zh: "總是 0" }], a: 0,
        hintEn: "g ≈ 10 N/kg.", hintZh: "g ≈ 10 N/kg。" },
      { qEn: "Action-reaction pairs act on…", qZh: "作用力-反作用力作用於…",
        opts: [{ en: "Different objects", zh: "不同物體" }, { en: "Same object cancelling", zh: "同一物體抵消" }, { en: "Nothing", zh: "無" }], a: 0,
        hintEn: "They don't cancel on one body.", hintZh: "在同一物體上不能抵消。" },
      { qEn: "Steep v-t slope means…", qZh: "陡的 v-t 斜率表示…",
        opts: [{ en: "Large acceleration", zh: "大加速度" }, { en: "Zero speed", zh: "零速度" }, { en: "No motion", zh: "無運動" }], a: 0,
        hintEn: "Rate of change of velocity.", hintZh: "速度變化率。" }
    ];

    const SUMMARY = [
      { en: "Newton I: no resultant force → constant v.", zh: "牛頓 I：無合力 → 勻速。" },
      { en: "Newton II: F = ma.", zh: "牛頓 II：F = ma。" },
      { en: "Newton III: equal opposite pairs on different bodies.", zh: "牛頓 III：不同物體上大小相等方向相反。" },
      { en: "v-t slope = a; area = distance.", zh: "v-t 斜率 = a；面积 = 距離。" }
    ];

    const REVIEW = [
      { qEn: "Inertia is tendency to…", qZh: "慣性是維持…的趨勢",
        opts: [{ en: "Keep motion state", zh: "運動狀態" }, { en: "Always accelerate", zh: "總是加速" }, { en: "Lose mass", zh: "失去質量" }], a: 0 },
      { qEn: "5 N on 2 kg → a = …", qZh: "5 N 作用 2 kg → a = …",
        opts: ["2.5 m/s²", "10 m/s²", "0.4 m/s²"], a: 0 },
      { qEn: "Rocket expels gas down, rocket goes…", qZh: "火箭向下噴氣，火箭向…",
        opts: [{ en: "Up", zh: "上" }, { en: "Down faster", zh: "更快向下" }, { en: "Nowhere", zh: "無處" }], a: 0 },
      { qEn: "Terminal velocity when…", qZh: "終端速度當…",
        opts: [{ en: "Drag = weight", zh: "阻力 = 重量" }, { en: "No gravity", zh: "無重力" }, { en: "Mass = 0", zh: "質量 = 0" }], a: 0 },
      { qEn: "Unit of force:", qZh: "力的單位：",
        opts: ["N (newton)", "kg", "m/s"], a: 0 }
    ];

    function ForceLab({ isZh }) {
      const [mass, setMass] = useState(5);
      const [force, setForce] = useState(20);
      const t = window.JSLGER.t;
      const a = (force / mass).toFixed(1);
      const weight = (mass * 10).toFixed(0);
      return (
        <div className="space-y-4">
          <label className="block text-sm font-bold">{t("質量 (kg)", "Mass (kg)")}: {mass}
            <input type="range" min="1" max="20" value={mass} onChange={e => setMass(+e.target.value)} className="w-full mt-1" style={{ accentColor: ACCENT }} />
          </label>
          <label className="block text-sm font-bold">{t("合力 (N)", "Resultant force (N)")}: {force}
            <input type="range" min="0" max="100" value={force} onChange={e => setForce(+e.target.value)} className="w-full mt-1" style={{ accentColor: ACCENT }} />
          </label>
          <div className="grid grid-cols-2 gap-3">
            <div className="p-4 rounded-2xl bg-cyan-50 border text-center">
              <p className="text-xs text-slate-500">a = F/m</p>
              <p className="text-3xl font-black" style={{ color: ACCENT }}>{a} m/s²</p>
            </div>
            <div className="p-4 rounded-2xl bg-slate-50 border text-center">
              <p className="text-xs text-slate-500">W = mg</p>
              <p className="text-3xl font-black">{weight} N</p>
            </div>
          </div>
          <div className="h-4 rounded-full bg-slate-200 overflow-hidden">
            <div className="h-full transition-all" style={{ width: Math.min(100, force * 2) + "%", background: ACCENT }} />
          </div>
          <p className="text-xs text-slate-500 text-center">{t("長條表示施力大小（示意）", "Bar shows applied force (illustrative)", isZh)}</p>
        </div>
      );
    }

    function App() {
      return (
        <Shell
          meta={{ appId: "s3_force_motion", titleEn: "Force & Motion Bridge", titleZh: "力與運動銜接", unit: "Form 3 · Physics Bridge" }}
          accent={ACCENT} backHref="../index.html"
          learnSteps={LEARN} guidedBank={GUIDED} reviewSummary={SUMMARY} reviewQuiz={REVIEW}
          experiment={p => <ForceLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
