<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Periodic Table · 週期表 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #f5f3ff; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>分辨橫行的週期和直行的族。</li><li>知道同一族元素性質相近，稀有氣體很不活潑。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#6d28d9";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Organizing elements", titleZh: "元素的歸類",
    bodyEn: "Scientists organize all known elements into a table called the Periodic Table. It helps predict properties from an element's position.",
    bodyZh: "科學家會以週期表把元素分組歸類，有助從位置預測元素性質。",
    qEn: "The Periodic Table organizes…", qZh: "週期表把…分類",
    opts: ["All known elements 所有已知元素", "Only metals 只有金屬", "Only gases 只有氣體", "Food substances 食物物質"], a: "All known elements 所有已知元素",
    why: "Opening concept PPT Ch2. 第2章開篇。" },
  { titleEn: "Mendeleev's discovery", titleZh: "門捷列夫的發現",
    bodyEn: "In the 19th century, 63 elements were known. Russian chemist Dmitri Mendeleev (1834–1907) first arranged them in a table by increasing atomic mass.",
    bodyZh: "19世紀已知63種元素。俄國化學家門捷列夫 (1834–1907) 首次按原子質量遞增排列元素。",
    qEn: "Mendeleev arranged elements by…", qZh: "門捷列夫按…排列元素",
    opts: ["Increasing atomic mass 原子質量遞增", "Alphabetical order 字母順序", "Colour only 只有顏色", "Random order 隨機"], a: "Increasing atomic mass 原子質量遞增",
    why: "Historical arrangement from PPT. 簡報歷史排列法。" },
  { titleEn: "Groups and similar properties", titleZh: "族與相似性質",
    bodyEn: "Mendeleev placed elements with similar properties in the same vertical columns called groups. Beryllium (Be), magnesium (Mg) and calcium (Ca) are all in Group II.",
    bodyZh: "門捷列夫把性質相似的元素排在同一縱行（族）。鈹(Be)、鎂(Mg)和鈣(Ca)同屬第II族。",
    qEn: "Be, Mg and Ca share…", qZh: "Be、Mg 和 Ca 具有…",
    opts: ["Similar properties (Group II) 相似性質（第II族）", "Same atomic number 相同原子序", "Same mass number 相同質量數", "No chemical reactions 無化學反應"], a: "Similar properties (Group II) 相似性質（第II族）",
    why: "Group II example from PPT. 第II族例子。" },
  { titleEn: "Modern Periodic Table", titleZh: "現代週期表",
    bodyEn: "Mendeleev's table was modified over the years. The modern Periodic Table has over 110 elements arranged in order of increasing atomic number (Z).",
    bodyZh: "門捷列夫的週期表經多次修訂。現代週期表列出超過110種元素，按原子序由小至大排列。",
    qEn: "Modern table arranges elements by…", qZh: "現代表按…排列",
    opts: ["Increasing atomic number 原子序遞增", "Decreasing mass only 只有質量遞減", "Discovery date 發現日期", "Colour 顏色"], a: "Increasing atomic number 原子序遞增",
    why: "Modern arrangement from PPT. 現代排列法。" },
  { titleEn: "Eight main groups", titleZh: "八個主族",
    bodyEn: "The modern Periodic Table has eight main groups: I, II, III, IV, V, VI, VII and 0. Elements in the same group tend to have similar chemical properties.",
    bodyZh: "現代週期表共有八個主族：I、II、III、IV、V、VI、VII 和 0。同族元素通常有相似的化學性質。",
    qEn: "Group VII elements are called…", qZh: "第VII族元素稱為…",
    opts: ["Halogens 鹵素", "Noble gases 稀有氣體", "Alkali metals 鹼金屬", "Transition metals 過渡金屬"], a: "Halogens 鹵素",
    why: "Group names from curriculum. 課程族名。" },
  { titleEn: "Predicting from position", titleZh: "從位置預測",
    bodyEn: "Experiment 13.2 shows Group II metals (Ca, Mg) react similarly with dilute hydrochloric acid, while carbon does not — confirming group patterns.",
    bodyZh: "實驗13.2顯示第II族金屬（Ca、Mg）與稀氫氯酸反應相似，而碳不會——印證同族規律。",
    qEn: "Same-group elements have…", qZh: "同族元素有…",
    opts: ["Similar chemical properties 相似的化學性質", "Identical atomic mass 相同的原子質量", "Same number of neutrons 相同中子數", "No reactions ever 從不反應"], a: "Similar chemical properties 相似的化學性質",
    why: "Exp 13.2 conclusion from PPT. 實驗13.2結論。" },
];
const GUIDED = [
  { qEn: "Mendeleev developed the Periodic Table in the…", qZh: "門捷列夫在…發展週期表",
    opts: ["19th century 19世紀", "21st century 21世紀", "Stone Age 石器時代", "Iron Age 鐵器時代"], a: "19th century 19世紀",
    hint: "63 elements known then. 當時已知63種。" },
  { qEn: "Vertical columns in the table are called…", qZh: "週期表的縱行稱為…",
    opts: ["Groups 族", "Periods 週期", "Isotopes 同位素", "Compounds 化合物"], a: "Groups 族",
    hint: "Mendeleev's term. 門捷列夫用語。" },
  { qEn: "Horizontal rows are called…", qZh: "橫行稱為…",
    opts: ["Periods 週期", "Groups 族", "Mixtures 混合物", "Alloys 合金"], a: "Periods 週期",
    hint: "Rows across the table. 表中的橫行。" },
  { qEn: "Group 0 elements are…", qZh: "第0族元素是…",
    opts: ["Noble gases (unreactive) 稀有氣體（不活潑）", "Very reactive metals 非常活潑金屬", "Halogens 鹵素", "Metalloids only 只有半金屬"], a: "Noble gases (unreactive) 稀有氣體（不活潑）",
    hint: "He, Ne, Ar are in Group 0. He、Ne、Ar 屬第0族。" },
];
const SUMMARY = [
  { en: "Mendeleev (1834–1907) first arranged 63 elements by increasing atomic mass into groups with similar properties.", zh: "門捷列夫 (1834–1907) 首次按原子質量遞增排列63種元素，同族性質相似。" },
  { en: "The modern Periodic Table has 110+ elements arranged by increasing atomic number (Z).", zh: "現代週期表有110+種元素，按原子序 (Z) 遞增排列。" },
  { en: "Eight main groups (I–VII and 0); elements in the same group share similar chemical properties.", zh: "八個主族（I–VII 和 0）；同族元素有相似的化學性質。" },
  { en: "Position in the table helps predict reactivity and properties (e.g. Group II metals react with acid).", zh: "表中位置有助預測活性與性質（如第II族金屬與酸反應）。" },
];
const REVIEW = [
  { qEn: "Who first developed the Periodic Table?", qZh: "誰首先編製週期表？",
    opts: ["Dmitri Mendeleev 門捷列夫", "Isaac Newton 牛頓", "Charles Darwin 達爾文", "Marie Curie 居里夫人"], a: "Dmitri Mendeleev 門捷列夫" },
  { qEn: "Modern table orders elements by…", qZh: "現代表按…排列",
    opts: ["Atomic number 原子序", "Colour 顏色", "Alphabet 字母", "Discovery year 發現年份"], a: "Atomic number 原子序" },
  { qEn: "Be, Mg, Ca are in the same…", qZh: "Be、Mg、Ca 在同一…",
    opts: ["Group (II) 族（II）", "Period only 只有週期", "Compound 化合物", "Mixture 混合物"], a: "Group (II) 族（II）" },
  { qEn: "How many main groups?", qZh: "有多少個主族？",
    opts: ["Eight (I–VII and 0) 八個", "Three 三個", "Twenty 二十個", "One 一個"], a: "Eight (I–VII and 0) 八個" },
  { qEn: "Same-group elements have…", qZh: "同族元素有…",
    opts: ["Similar chemical properties 相似化學性質", "Same atomic mass 相同原子質量", "Same name 相同名稱", "No electrons 沒有電子"], a: "Similar chemical properties 相似化學性質" },
];

const GROUPS = {
  I: { en: "Group I — Alkali metals", zh: "第 I 族——鹼金屬", ex: "Li, Na, K", props: { en: "Soft, reactive, form +1 ions, react vigorously with water", zh: "質軟、活性高、形成+1離子、與水劇烈反應" } },
  II: { en: "Group II — Alkaline earth metals", zh: "第 II 族——鹼土金屬", ex: "Be, Mg, Ca", props: { en: "Reactive with dilute acid, form +2 ions, less reactive than Group I", zh: "與稀酸反應、形成+2離子、活性較第I族低" } },
  VII: { en: "Group VII — Halogens", zh: "第 VII 族——鹵素", ex: "F, Cl, Br, I", props: { en: "Diatomic molecules, reactive non-metals, form −1 ions", zh: "雙原子分子、活性非金屬、形成−1離子" } },
  "0": { en: "Group 0 — Noble gases", zh: "第 0 族——稀有氣體", ex: "He, Ne, Ar", props: { en: "Unreactive, monatomic, full outer electron shells", zh: "不活潑、單原子、最外電子層已滿" } },
};

function ExperimentLab({ isZh, accent }) {
  const [g, setG] = useState("II");
  const t = window.JSLGER.t;
  const info = GROUPS[g];
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("點選族別，預測該族元素的化學性質。", "Click a group to predict properties of its elements.", isZh)}</p>
      <div className="grid grid-cols-4 gap-2">
        {Object.keys(GROUPS).map(k => (
          <button key={k} type="button" onClick={() => setG(k)} className={"py-3 rounded-xl font-black text-sm min-h-[48px] border-2 " + (g === k ? "text-white" : "bg-white text-slate-700")}
            style={g === k ? { background: accent, borderColor: accent } : { borderColor: "#e2e8f0" }}>{k === "0" ? "0" : "Gp " + k}</button>
        ))}
      </div>
      <svg viewBox="0 0 320 120" className="w-full max-w-md mx-auto">
        {[0,1,2,3].map(i => (
          <g key={i}>
            <rect x={10 + i*78} y="20" width="70" height="80" rx="8" fill={g === Object.keys(GROUPS)[i] ? accent : "#ede9fe"} opacity={g === Object.keys(GROUPS)[i] ? 0.35 : 0.15} stroke={accent} strokeWidth="1.5" />
            <text x={45 + i*78} y="55" textAnchor="middle" fontSize="14" fontWeight="bold" fill={accent}>{Object.keys(GROUPS)[i] === "0" ? "0" : "Gp"+Object.keys(GROUPS)[i]}</text>
            <text x={45 + i*78} y="75" textAnchor="middle" fontSize="9" fill="#64748b">{GROUPS[Object.keys(GROUPS)[i]].ex.split(",")[0]}</text>
          </g>
        ))}
      </svg>
      <div className="p-4 rounded-2xl bg-white border-2 space-y-2" style={{ borderColor: accent }}>
        <p className="font-bold" style={{ color: accent }}>{t(info.zh, info.en, isZh)}</p>
        <p className="text-sm text-slate-600">{t("例子","Examples",isZh)}: {info.ex}</p>
        <p className="text-sm font-semibold">{t("預測性質","Predicted properties",isZh)}:</p>
        <p className="text-sm">{t(info.props.zh, info.props.en, isZh)}</p>
      </div>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_periodic_table", titleEn: "Periodic Table", titleZh: "週期表", unit: "Form 3 · Book 13 Matter" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
