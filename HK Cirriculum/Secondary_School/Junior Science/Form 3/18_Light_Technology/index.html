<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light & Technology · 光與科技 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

  <script src="../../../../common/junior-science-lger.js"></script>

  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />

    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }

  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>舉出紅外線遙控和紫外線驗鈔等用途。</li><li>說明紫外線會傷害皮膚和眼睛，要避免直視紫外光源。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#f59e0b";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Invisible light beyond visible", titleZh: "可見光以外的「光」",
    bodyEn: "Experiment 14.18: besides visible light, invisible 'lights' exist just beyond the two ends of the visible spectrum.",
    bodyZh: "實驗14.18：除了可見光外，在可見光譜兩端以外位置還有我們看不見的「光」。",
    qEn: "IR and UV are located… the visible spectrum", qZh: "紅外和紫外在可見光譜…",
    opts: ["Beyond the two ends 兩端以外", "Only in the middle 只在中央", "Unrelated 無關", "Inside mirrors 在鏡內"], a: "Beyond the two ends 兩端以外",
    why: "Exp 14.18 conclusion. 實驗14.18結論。" },
  { titleEn: "Infrared radiation", titleZh: "紅外輻射",
    bodyEn: "Infrared (IR) exists just beyond the red end. All objects emit IR; hotter objects emit more. IR detectors show highest reading beyond the red end.",
    bodyZh: "紅外輻射在可見光譜紅光以外。所有物體都發出紅外輻射，較熱物體發出較多。紅外探測器在紅光以外讀數最大。",
    qEn: "IR detector reading is highest…", qZh: "紅外探測器讀數最大在…",
    opts: ["Beyond the red end 紅光以外", "In the green region 綠光區", "Only in vacuum 只在真空", "Inside the prism 在棱鏡內"], a: "Beyond the red end 紅光以外",
    why: "Exp 14.18 IR detector sweep. 實驗14.18掃描。" },
  { titleEn: "Ultraviolet radiation", titleZh: "紫外輻射",
    bodyEn: "Ultraviolet (UV) exists beyond the violet end. Fluorescent paper glows when UV falls on it beyond the violet end.",
    bodyZh: "紫外輻射在可見光譜紫光以外。熒光紙在紫光以外位置受紫外照射會發光。",
    qEn: "Fluorescent paper glows beyond the… end", qZh: "熒光紙在…端以外發光",
    opts: ["Violet 紫", "Red 紅", "Green 綠", "Middle 中央"], a: "Violet 紫",
    why: "UV detection in Exp 14.18. 實驗14.18紫外偵測。" },
  { titleEn: "IR applications", titleZh: "紅外應用",
    bodyEn: "IR is used in remote controls, thermal cameras, IR thermometers, ovens and toasters, and building heat surveys.",
    bodyZh: "紅外應用於遙控器、紅外影像、紅外溫度計、焗爐/多士爐，以及建築物散熱調查。",
    qEn: "TV remote sends signals using…", qZh: "電視遙控器用…傳送訊號",
    opts: ["Infrared radiation 紅外輻射", "Sound waves 聲波", "Only visible laser always 總是只有可見激光", "Gravity 重力"], a: "Infrared radiation 紅外輻射",
    why: "Line-of-sight IR LED. 視距紅外LED。" },
  { titleEn: "UV applications and safety", titleZh: "紫外應用與安全",
    bodyEn: "UV is used for sterilisation and fluorescent effects, but overexposure can damage skin and eyes — use protection.",
    bodyZh: "紫外用於消毒和熒光效應，但過量照射可損害皮膚和眼睛——需做好防護。",
    qEn: "UV sterilisation works because UV…", qZh: "紫外消毒因紫外…",
    opts: ["Kills microbes / high energy 殺滅微生物/高能量", "Only heats water 只有加熱水", "Makes objects luminous 使物體發光", "Stops all light 停止所有光"], a: "Kills microbes / high energy 殺滅微生物/高能量",
    why: "Medical and lab UV lamps. 醫療和實驗紫外燈。" },
  { titleEn: "Self-driving cars", titleZh: "無人駕駛汽車",
    bodyEn: "Self-driving cars use invisible EM waves — IR/LiDAR and cameras — to detect obstacles and map the road without a driver.",
    bodyZh: "無人駕駛汽車利用電磁波譜中看不見的「光」——紅外/LiDAR和相機——偵測障礙物和描繪道路。",
    qEn: "Autonomous vehicles rely on… sensing", qZh: "自動駕駛車依賴…感測",
    opts: ["IR / LiDAR / cameras 紅外/LiDAR/相機", "Only human eyes 只有人眼", "Sound sonar only 只有聲納", "Magnetism only 只有磁性"], a: "IR / LiDAR / cameras 紅外/LiDAR/相機",
    why: "PPT Ch7 opening context. 第7章開首情境。" },
];
const GUIDED = [
  { qEn: "Beyond red end → … radiation", qZh: "紅光以外→…輻射",
    opts: ["Infrared 紅外", "Ultraviolet 紫外", "X-ray only 只有X射線", "Sound 聲"], a: "Infrared 紅外",
    hint: "IR detector peak position. 紅外探測器峰值位置。" },
  { qEn: "Beyond violet end → … radiation", qZh: "紫光以外→…輻射",
    opts: ["Ultraviolet 紫外", "Infrared 紅外", "Radio 無線電", "Microwave 微波"], a: "Ultraviolet 紫外",
    hint: "Fluorescent paper glows. 熒光紙發光。" },
  { qEn: "Hotter objects emit… IR", qZh: "較熱物體發出…紅外",
    opts: ["More 較多", "Less always 總是較少", "None 沒有", "Only visible light 只有可見光"], a: "More 較多",
    hint: "All objects emit IR. 所有物體發紅外。" },
  { qEn: "LiDAR measures distance using…", qZh: "LiDAR用…量度距離",
    opts: ["Reflected laser/IR pulses 反射激光/紅外脈衝", "Only GPS sound 只有GPS聲", "Water spray 水霧", "Magnets 磁鐵"], a: "Reflected laser/IR pulses 反射激光/紅外脈衝",
    hint: "Time-of-flight ranging. 飛行時間測距。" },
];
const SUMMARY = [
  { en: "IR beyond red; UV beyond violet — invisible parts of EM spectrum.", zh: "紅外在紅光以外；紫外在紫光以外——電磁波譜不可見部分。" },
  { en: "Exp 14.18: IR detector + fluorescent paper detect them.", zh: "實驗14.18：紅外探測器和熒光紙可偵測它們。" },
  { en: "IR: remotes, thermal imaging, heating. UV: sterilisation (with safety).", zh: "紅外：遙控、熱影像、加熱。紫外：消毒（需注意安全）。" },
  { en: "Self-driving cars use IR/LiDAR and cameras to 'see' the road.", zh: "無人駕駛汽車用紅外/LiDAR和相機「看」道路。" },
];
const REVIEW = [
  { qEn: "IR exists beyond the… end of visible spectrum", qZh: "紅外存在於可見光譜…端以外",
    opts: ["Red 紅", "Violet 紫", "Green 綠", "None 無"], a: "Red 紅" },
  { qEn: "Fluorescent paper detects…", qZh: "熒光紙偵測…",
    opts: ["Ultraviolet 紫外", "Infrared only 只有紅外", "Radio waves 無線電波", "Sound 聲"], a: "Ultraviolet 紫外" },
  { qEn: "Remote control uses…", qZh: "遙控器用…",
    opts: ["Infrared 紅外", "Ultraviolet only 只有紫外", "X-rays X射線", "Water waves 水波"], a: "Infrared 紅外" },
  { qEn: "Self-driving cars use invisible…", qZh: "無人駕駛汽車用看不見的…",
    opts: ["EM waves (IR/LiDAR) 電磁波（紅外/LiDAR）", "Only visible light 只有可見光", "Only sound 只有聲", "Magnets 磁鐵"], a: "EM waves (IR/LiDAR) 電磁波（紅外/LiDAR）" },
  { qEn: "When ray box off, IR detector reading…", qZh: "關閉光線箱後，紅外探測器讀數…",
    opts: ["Drops 下降", "Stays maximum 保持最大", "Becomes infinite 變無限", "Unchanged always 永不改變"], a: "Drops 下降" },
];

function ExperimentLab({ isZh, accent }) {
  const [pos, setPos] = useState(50);
  const t = window.JSLGER.t;
  const irPeak = 82;
  const uvPeak = 18;
  const irRead = Math.max(0, Math.round(100 - Math.abs(pos - irPeak) * 2.5));
  const uvGlow = Math.max(0, 100 - Math.abs(pos - uvPeak) * 3);
  const detectQuality = Math.round((irRead * 0.5 + uvGlow * 0.3 + (pos > 30 && pos < 70 ? 40 : 10)));
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("沿可見光譜移動探測器（實驗14.18）。模擬無人駕駛感測。","Move detector along visible spectrum (Exp 14.18). Simulates self-driving sensing.",isZh)}</p>
      <label className="block text-sm font-semibold">{t("探測器位置","Detector position")}: {pos}%</label>
      <input type="range" min="0" max="100" value={pos} onChange={e => setPos(+e.target.value)} className="w-full" style={{accentColor: accent}} />
      <svg viewBox="0 0 520 120" className="w-full rounded-xl border bg-slate-900">
        <defs>
          <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#ef4444" /><stop offset="25%" stopColor="#f59e0b" /><stop offset="50%" stopColor="#22c55e" />
            <stop offset="75%" stopColor="#3b82f6" /><stop offset="100%" stopColor="#a855f7" />
          </linearGradient>
        </defs>
        <rect x="40" y="40" width="440" height="30" fill="url(#spec)" rx="4" />
        <text x="50" y="35" fill="#fca5a5" fontSize="9">{t("紅外","IR",isZh)}</text>
        <text x="450" y="35" fill="#c4b5fd" fontSize="9">{t("紫外","UV",isZh)}</text>
        <circle cx={40 + pos * 4.4} cy="55" r="10" fill="#fff" stroke={accent} strokeWidth="2" />
        <rect x="40" y="85" width={irRead * 4.4} height="8" fill="#ef4444" opacity="0.8" rx="2" />
        <text x="50" y="105" fill="#fca5a5" fontSize="9">{t("紅外讀數","IR reading",isZh)}: {irRead}%</text>
        <rect x="40" y="85" width={uvGlow * 4.4} height="8" fill="#a855f7" opacity="0.5" rx="2" transform="translate(0,12)" />
        <text x="280" y="105" fill="#c4b5fd" fontSize="9">{t("紫外熒光","UV glow",isZh)}: {uvGlow}%</text>
      </svg>
      <div className="flex items-center gap-3 p-3 rounded-xl border bg-white">
        <span className="text-2xl">🚗</span>
        <div>
          <p className="font-bold" style={{color: accent}}>{detectQuality > 60 ? t("路況偵測：良好","Road detection: good",isZh) : t("路況偵測：訊號弱","Road detection: weak signal",isZh)}</p>
          <p className="text-xs text-slate-500">{t("LiDAR/IR + 相機綜合評分","Combined LiDAR/IR + camera score",isZh)}: {detectQuality}%</p>
        </div>
      </div>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_light_technology", titleEn: "Light & Technology", titleZh: "光與科技", unit: "Form 3 · Book 14 Light & Electromagnetic Spectrum" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
