<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electromagnetic Waves · 電磁波 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #fffbeb; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>按無線電波到伽瑪射線排列電磁波譜。</li><li>知道它們在真空中的速率相同，波長越短能量越高。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#f59e0b";
    const { Shell } = window.JSLGER;

const BANDS = [
  { id: "radio", en: "Radio waves", zh: "無線電波", wl: "> 1 m", appEn: "TV/radio broadcast, RFID Octopus", appZh: "電視/電台廣播、八達通RFID", color: "#6366f1" },
  { id: "micro", en: "Microwaves", zh: "微波", wl: "1 mm – 1 m", appEn: "Microwave ovens, mobile 4G/5G", appZh: "微波爐、流動4G/5G", color: "#8b5cf6" },
  { id: "ir", en: "Infrared", zh: "紅外輻射", wl: "700 nm – 1 mm", appEn: "Remote controls, thermal imaging", appZh: "遙控器、紅外影像", color: "#ef4444" },
  { id: "visible", en: "Visible light", zh: "可見光", wl: "400–700 nm", appEn: "Vision, photosynthesis, cameras", appZh: "視覺、光合作用、相機", color: "#f59e0b" },
  { id: "uv", en: "Ultraviolet", zh: "紫外輻射", wl: "10–400 nm", appEn: "Sterilisation, sun tanning (with care)", appZh: "消毒、曬黑（需防護）", color: "#a855f7" },
  { id: "xray", en: "X-rays", zh: "X射線", wl: "0.01–10 nm", appEn: "Medical bone imaging", appZh: "醫學骨骼造影", color: "#64748b" },
  { id: "gamma", en: "Gamma rays", zh: "伽馬射線", wl: "< 0.01 nm", appEn: "Cancer treatment, sterilisation", appZh: "癌症治療、消毒", color: "#1e293b" },
];

const LEARN = [
  { titleEn: "Light as electromagnetic waves", titleZh: "光即電磁波",
    bodyEn: "Light is a kind of wave called an electromagnetic (EM) wave, which transfers energy without transferring matter.",
    bodyZh: "「光」代表一種傳遞能量的波，稱為電磁波。波只傳遞能量，不傳遞物質。",
    qEn: "EM waves transfer… without transferring matter", qZh: "電磁波傳遞…但不傳遞物質",
    opts: ["Energy 能量", "Mass always 總是質量", "Water 水", "Sound only 只有聲"], a: "Energy 能量",
    why: "Slinky spring demo in PPT. 簡報軟彈簧示範。" },
  { titleEn: "Wavelength", titleZh: "波長",
    bodyEn: "The minimum distance at which a wave repeats itself is called the wavelength.",
    bodyZh: "波的圖形重複出現的最短距離稱為波長。",
    qEn: "Wavelength is the distance for one… of a wave", qZh: "波長是一個…的距離",
    opts: ["Complete repeat (cycle) 完整重複（一個周期）", "Half cycle only 只有半周期", "Random gap 隨機間距", "Object size 物體大小"], a: "Complete repeat (cycle) 完整重複（一個周期）",
    why: "Definition from slinky activity. 軟彈簧活動定義。" },
  { titleEn: "Electromagnetic spectrum", titleZh: "電磁波譜",
    bodyEn: "EM waves can be arranged by wavelength: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.",
    bodyZh: "各種電磁波可按波長排列，組成電磁波譜：無線電、微波、紅外、可見光、紫外、X射線、伽馬射線。",
    qEn: "Visible light is… of the EM spectrum", qZh: "可見光是電磁波譜的…",
    opts: ["A small part 一小部分", "The entire spectrum 全部", "Unrelated 無關部分", "Only sound 只有聲"], a: "A small part 一小部分",
    why: "Most EM waves are invisible. 大部分電磁波不可見。" },
  { titleEn: "Visible spectrum", titleZh: "可見光譜",
    bodyEn: "Experiment 14.15: white light through a prism produces a continuous spectrum — red to violet.",
    bodyZh: "實驗14.15：白光通過三稜鏡產生連續色光譜——由紅至紫。",
    qEn: "Red light has… wavelength than violet", qZh: "紅光波長比紫光…",
    opts: ["Longer 較長", "Shorter 較短", "Zero 零", "Same always 總是相同"], a: "Longer 較長",
    why: "ROYGBIV order in spectrum. 光譜中由紅至紫。" },
  { titleEn: "Different properties", titleZh: "不同性質",
    bodyEn: "Different types of EM waves have different wavelengths and frequencies, and different uses and dangers.",
    bodyZh: "不同種類的電磁波有不同的波長和頻率，以及不同的用途和危害。",
    qEn: "Microwave ovens heat food using…", qZh: "微波爐用…加熱食物",
    opts: ["Microwave EM radiation 微波電磁輻射", "Only conduction 只有傳導", "Gravity 重力", "Sound waves 聲波"], a: "Microwave EM radiation 微波電磁輻射",
    why: "Water molecules absorb microwaves. 水分子吸收微波。" },
  { titleEn: "Speed in vacuum", titleZh: "真空中的速度",
    bodyEn: "All EM waves travel at the same speed c (≈ 3×10⁸ m/s) in vacuum — including visible light and radio waves.",
    bodyZh: "所有電磁波在真空中均以相同速度 c（≈ 3×10⁸ m/s）傳播——包括可見光和無線電波。",
    qEn: "In vacuum, radio waves and visible light have… speed", qZh: "真空中，無線電波和可見光…速度",
    opts: ["The same 相同", "Radio much slower 無線電慢很多", "Visible zero 可見光為零", "Random 隨機"], a: "The same 相同",
    why: "Universal speed c. 普適光速 c。" },
];
const GUIDED = [
  { qEn: "EM waves are… waves", qZh: "電磁波是…波",
    opts: ["Transverse 橫波", "Longitudinal only 只有縱波", "Not waves 不是波", "Sound only 只有聲"], a: "Transverse 橫波",
    hint: "Oscillation ⊥ direction of travel. 振動⊥傳播方向。" },
  { qEn: "X-rays are used for…", qZh: "X射線用於…",
    opts: ["Medical imaging 醫學造影", "FM radio only 只有FM廣播", "Plant growth only 只有植物生長", "Making mirrors 製造鏡"], a: "Medical imaging 醫學造影",
    hint: "Penetrates soft tissue. 穿透軟組織。" },
  { qEn: "UV can…", qZh: "紫外輻射可以…",
    opts: ["Cause sunburn / skin damage 曬傷/損皮", "Only heat food 只有加熱食物", "Replace visible light 取代可見光", "Stop all EM waves 停止所有電磁波"], a: "Cause sunburn / skin damage 曬傷/損皮",
    hint: "High energy per photon. 每光子能量較高。" },
  { qEn: "White light through prism → … spectrum", qZh: "白光過棱鏡→…光譜",
    opts: ["Continuous colour 連續色光", "Single colour only 只有單色", "No light 無光", "Sound spectrum 聲譜"], a: "Continuous colour 連續色光",
    hint: "Experiment 14.15. 實驗14.15。" },
];
const SUMMARY = [
  { en: "Light = EM wave; transfers energy, not matter.", zh: "光 = 電磁波；傳遞能量，不傳遞物質。" },
  { en: "EM spectrum: radio → gamma; visible is a narrow band.", zh: "電磁波譜：無線電→伽馬；可見光是一窄帶。" },
  { en: "Wavelength = shortest repeating distance of a wave.", zh: "波長 = 波重複的最短距離。" },
  { en: "All EM waves travel at c in vacuum.", zh: "所有電磁波在真空中以 c 傳播。" },
];
const REVIEW = [
  { qEn: "EM waves in vacuum…", qZh: "真空中電磁波…",
    opts: ["All travel at speed c 均以 c 傳播", "Cannot travel 不能傳播", "Need air 需要空氣", "Are sound 是聲"], a: "All travel at speed c 均以 c 傳播" },
  { qEn: "Visible light wavelength: red is… violet", qZh: "可見光波長：紅比紫…",
    opts: ["Longer 較長", "Shorter 較短", "Zero 零", "Infinite 無限"], a: "Longer 較長" },
  { qEn: "Octopus card uses… EM band", qZh: "八達通用…電磁波段",
    opts: ["Radio / RF 無線電/射頻", "Only gamma 只有伽馬", "Only X-ray 只有X射線", "Sound 聲"], a: "Radio / RF 無線電/射頻" },
  { qEn: "Wavelength is…", qZh: "波長是…",
    opts: ["Minimum repeat distance 最短重複距離", "Wave height only 只有波高", "Object mass 物體質量", "Mirror angle 鏡角"], a: "Minimum repeat distance 最短重複距離" },
  { qEn: "Prism splits white light because colours have different…", qZh: "棱鏡分光因各色有不同…",
    opts: ["Wavelengths / refractive index 波長/折射率", "Mass 質量", "Volume only 只有體積", "Magnetism 磁性"], a: "Wavelengths / refractive index 波長/折射率" },
];

function ExperimentLab({ isZh, accent }) {
  const [idx, setIdx] = useState(3);
  const t = window.JSLGER.t;
  const b = BANDS[idx];
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("點選電磁波譜波段，查看波長和應用。","Select an EM spectrum band to see wavelength and applications.",isZh)}</p>
      <div className="flex flex-wrap gap-1">
        {BANDS.map((band, i) => (
          <button key={band.id} type="button" onClick={() => setIdx(i)} className={"px-2 py-1.5 rounded-lg text-xs min-h-[36px] " + (idx===i?"text-white font-bold":"bg-slate-100")} style={idx===i?{background: band.color}:{}}>{t(band.zh, band.en, isZh)}</button>
        ))}
      </div>
      <svg viewBox="0 0 520 80" className="w-full rounded-xl border">
        {BANDS.map((band, i) => (
          <rect key={band.id} x={i * 74 + 2} y="10" width="70" height="40" fill={band.color} opacity={idx===i?1:0.35} rx="4" onClick={() => setIdx(i)} style={{cursor:"pointer"}} />
        ))}
        <text x="260" y="72" textAnchor="middle" fontSize="10" fill="#64748b">{t("波長由長→短","Wavelength long → short",isZh)}</text>
      </svg>
      <div className="p-4 rounded-xl border bg-white">
        <p className="font-bold" style={{color: b.color}}>{t(b.zh, b.en, isZh)}</p>
        <p className="text-sm text-slate-600 mt-1">{t("波長","Wavelength")}: {b.wl}</p>
        <p className="text-sm mt-2">{t(b.appZh, b.appEn, isZh)}</p>
      </div>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_em_waves", titleEn: "Electromagnetic Waves", titleZh: "電磁波", unit: "Form 3 · Book 14 Light & Electromagnetic Spectrum" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
