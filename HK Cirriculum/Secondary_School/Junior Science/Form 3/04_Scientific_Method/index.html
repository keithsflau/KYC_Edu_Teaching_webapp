<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Method · 科學方法 | S3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #eff6ff; }</style>
  <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#2563eb";
    const { Shell } = window.JSLGER;

    const STEPS = [
      { en: "Question", zh: "問題" }, { en: "Hypothesis", zh: "假設" },
      { en: "Experiment", zh: "實驗" }, { en: "Data", zh: "數據" },
      { en: "Conclusion", zh: "結論" }
    ];

    const LEARN = [
      { titleEn: "Scientific question", titleZh: "科學問題",
        bodyEn: "A good question is testable and specific: e.g. 'Does light intensity affect photosynthesis rate?'",
        bodyZh: "好的問題可驗證且具體，例如「光強是否影響光合作用速率？」",
        qEn: "A testable question must be…", qZh: "可驗證問題必須…",
        opts: [{ en: "Answerable by experiment", zh: "可用實驗回答" }, { en: "Pure opinion", zh: "純屬意見" }, { en: "Unmeasurable", zh: "無法量度" }], a: 0,
        whyEn: "Science needs evidence.", whyZh: "科學需要證據。" },
      { titleEn: "Hypothesis", titleZh: "假設",
        bodyEn: "A hypothesis is a tentative explanation: 'If light increases, then bubble rate increases because more photons drive photosynthesis.'",
        bodyZh: "假設是暫定解釋：「若光強增加，則氣泡速率增加，因更多光子推動光合作用。」",
        qEn: "Hypothesis format often uses…", qZh: "假設格式常用…",
        opts: [{ en: "If… then… because…", zh: "若…則…因為…" }, { en: "Maybe maybe", zh: "也許也許" }, { en: "No reason needed", zh: "無需理由" }], a: 0,
        whyEn: "Links variables with reasoning.", whyZh: "連結變量與推理。" },
      { titleEn: "Fair test", titleZh: "公平測試",
        bodyEn: "Change one independent variable, measure dependent variable, control all others (fair test).",
        bodyZh: "改變一個自變量，量度應變量，控制其餘變量（公平測試）。",
        qEn: "In a fair test you change…", qZh: "公平測試中你改變…",
        opts: [{ en: "One variable only", zh: "只有一個變量" }, { en: "Everything at once", zh: "同時改全部" }, { en: "Nothing", zh: "無" }], a: 0,
        whyEn: "Isolate cause and effect.", whyZh: "分離因果。" },
      { titleEn: "Recording data", titleZh: "記錄數據",
        bodyEn: "Use tables with units, repeat trials, calculate mean, plot graphs with labelled axes.",
        bodyZh: "用表格記錄並附單位，重複試驗，計算平均值，繪圖並標示坐標軸。",
        qEn: "Repeating experiments helps…", qZh: "重複實驗有助…",
        opts: [{ en: "Reduce random error", zh: "減少隨機誤差" }, { en: "Change hypothesis", zh: "改變假設" }, { en: "Skip safety", zh: "跳過安全" }], a: 0,
        whyEn: "Improves reliability.", whyZh: "提高可靠性。" },
      { titleEn: "Conclusion & evaluation", titleZh: "結論與評估",
        bodyEn: "Conclusion compares results to hypothesis. Evaluate limitations: sample size, equipment, confounding variables.",
        bodyZh: "結論比較結果與假設。評估限制：樣本量、儀器、混淆變量。",
        qEn: "If results don't support hypothesis, you…", qZh: "若結果不支持假設，你…",
        opts: [{ en: "Revise hypothesis and retest", zh: "修訂假設並重測" }, { en: "Fake data", zh: "造假數據" }, { en: "Ignore results", zh: "忽略結果" }], a: 0,
        whyEn: "Science is self-correcting.", whyZh: "科學可自我修正。" },
      { titleEn: "Method designer", titleZh: "方法設計器",
        bodyEn: "Build a 5-step investigation plan in the simulator.",
        bodyZh: "在模擬器中建立五步探究計劃。",
        qEn: "Order: question comes…", qZh: "順序：問題在…",
        opts: [{ en: "First", zh: "最先" }, { en: "After conclusion", zh: "結論之後" }, { en: "Never", zh: "從不" }], a: 0,
        whyEn: "Drives the whole inquiry.", whyZh: "驅動整個探究。" }
    ];

    const GUIDED = [
      { qEn: "Independent variable is…", qZh: "自變量是…",
        opts: [{ en: "What you change", zh: "你改變的" }, { en: "What you measure", zh: "你量度的" }, { en: "Always time", zh: "總是時間" }], a: 0,
        hintEn: "Cause side of experiment.", hintZh: "實驗中的原因方。" },
      { qEn: "Dependent variable is…", qZh: "應變量是…",
        opts: [{ en: "What you measure", zh: "你量度的" }, { en: "Room temperature only", zh: "只有室溫" }, { en: "Teacher's name", zh: "老師姓名" }], a: 0,
        hintEn: "Effect you observe.", hintZh: "觀察到的結果。" },
      { qEn: "Control variables are…", qZh: "控制變量是…",
        opts: [{ en: "Kept the same", zh: "保持相同" }, { en: "Changed randomly", zh: "隨機改變" }, { en: "Ignored", zh: "忽略" }], a: 0,
        hintEn: "Fair test requirement.", hintZh: "公平測試要求。" },
      { qEn: "Anomaly in data should be…", qZh: "數據異常值應…",
        opts: [{ en: "Investigated, not hidden", zh: "調查，不隱藏" }, { en: "Always deleted", zh: "總是刪除" }, { en: "Ignored silently", zh: "默默忽略" }], a: 0,
        hintEn: "May indicate error or discovery.", hintZh: "可能指示誤差或發現。" }
    ];

    const SUMMARY = [
      { en: "Question → hypothesis → fair test → data → conclusion.", zh: "問題 → 假設 → 公平測試 → 數據 → 結論。" },
      { en: "One IV, one DV, control others.", zh: "一個自變量、一個應變量，控制其餘。" },
      { en: "Repeat for reliability; graph with units.", zh: "重複以提高可靠性；附單位繪圖。" },
      { en: "Evaluate and revise — honest science.", zh: "評估並修訂——誠實的科學。" }
    ];

    const REVIEW = [
      { qEn: "Hypothesis is…", qZh: "假設是…",
        opts: [{ en: "Testable prediction", zh: "可驗證預測" }, { en: "Final proof", zh: "最終證明" }, { en: "Law of nature", zh: "自然定律" }], a: 0 },
      { qEn: "Fair test changes…", qZh: "公平測試改變…",
        opts: [{ en: "One factor", zh: "一個因素" }, { en: "All factors", zh: "所有因素" }, { en: "Zero factors", zh: "零因素" }], a: 0 },
      { qEn: "Mean of trials reduces…", qZh: "試驗平均值減少…",
        opts: [{ en: "Random error impact", zh: "隨機誤差影響" }, { en: "Need for units", zh: "需要單位" }, { en: "Safety rules", zh: "安全規則" }], a: 0 },
      { qEn: "Graph axes need…", qZh: "圖表坐標軸需要…",
        opts: [{ en: "Labels and units", zh: "標籤和單位" }, { en: "No titles", zh: "無標題" }, { en: "Random colours only", zh: "只有隨機顏色" }], a: 0 },
      { qEn: "Unsupported hypothesis means…", qZh: "假設不被支持表示…",
        opts: [{ en: "Learn and refine ideas", zh: "學習並完善想法" }, { en: "Science failed", zh: "科學失敗" }, { en: "Stop asking questions", zh: "停止提問" }], a: 0 }
    ];

    function MethodLab({ isZh }) {
      const [step, setStep] = useState(0);
      const [notes, setNotes] = useState(["", "", "", "", ""]);
      const t = window.JSLGER.t;
      const done = notes.filter(n => n.trim().length > 3).length;
      return (
        <div className="space-y-4">
          <p className="text-sm text-slate-600">{t("為每一步寫一句話，完成探究計劃。", "Write one sentence per step to complete your investigation plan.", isZh)}</p>
          <div className="flex flex-wrap gap-2">
            {STEPS.map((s, i) => (
              <button key={i} type="button" onClick={() => setStep(i)}
                className={"px-3 py-2 rounded-lg text-sm font-semibold min-h-[44px] " + (step === i ? "text-white" : "bg-slate-100")}
                style={step === i ? { background: ACCENT } : {}}>
                {i + 1}. {t(s.zh, s.en, isZh)}
              </button>
            ))}
          </div>
          <textarea className="w-full border rounded-xl p-3 min-h-[100px] text-sm" placeholder={t("在此寫下你的計劃…", "Write your plan here…", isZh)}
            value={notes[step]} onChange={e => { const n = [...notes]; n[step] = e.target.value; setNotes(n); }} />
          <div className="p-4 rounded-xl text-center font-bold text-white" style={{ background: done >= 5 ? "#16a34a" : ACCENT }}>
            {done}/5 {t("步驟已完成", "steps complete", isZh)}
          </div>
        </div>
      );
    }

    function App() {
      return (
        <Shell
          meta={{ appId: "s3_scientific_method", titleEn: "Scientific Method Lab", titleZh: "科學方法實驗室", unit: "Form 3 · Scientific Practices" }}
          accent={ACCENT} backHref="../index.html"
          learnSteps={LEARN} guidedBank={GUIDED} reviewSummary={SUMMARY} reviewQuiz={REVIEW}
          experiment={p => <MethodLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
