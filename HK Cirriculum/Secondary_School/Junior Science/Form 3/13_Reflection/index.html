<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reflection of Light · 光的反射 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #fffbeb; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#f59e0b";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Reflection of light", titleZh: "光的反射",
    bodyEn: "When a light ray strikes a plane mirror, it bounces off. This is reflection of light at the mirror surface.",
    bodyZh: "光線射到平面鏡的表面時，會離開鏡的表面，這現象稱為光的反射。",
    qEn: "Calm water on the ground can act like…", qZh: "地上一層靜止的水看似…",
    opts: ["A mirror 鏡子", "A black hole 黑洞", "A light source 光源", "A vacuum 真空"], a: "A mirror 鏡子",
    why: "Smooth surface gives specular reflection. 光滑表面產生規則反射。" },
  { titleEn: "Law of reflection — angles", titleZh: "反射定律——角度",
    bodyEn: "Experiment 14.1: the angle of reflection r equals the angle of incidence i, both measured from the normal.",
    bodyZh: "實驗14.1：反射角 r 等於入射角 i，兩角均與法線量度。",
    qEn: "If angle of incidence i = 30°, angle of reflection r = …", qZh: "若入射角 i = 30°，反射角 r = …",
    opts: ["30°", "60°", "90°", "0° always 總是0°"], a: "30°",
    why: "Law: i = r. 定律：i = r。" },
  { titleEn: "Law of reflection — plane", titleZh: "反射定律——平面",
    bodyEn: "The incident ray, reflected ray and normal all lie on the same plane.",
    bodyZh: "入射線、反射線和法線均在同一平面上。",
    qEn: "Angles of incidence and reflection are measured from the…", qZh: "入射角和反射角從…量度",
    opts: ["Normal 法線", "Mirror edge only 只有鏡邊", "Horizontal floor 水平地面", "Object surface 物體表面"], a: "Normal 法線",
    why: "Normal is perpendicular to mirror. 法線垂直於鏡面。" },
  { titleEn: "Plane mirror images", titleZh: "平面鏡中的像",
    bodyEn: "A plane mirror forms a virtual, upright image the same size as the object, behind the mirror.",
    bodyZh: "平面鏡形成虛像、正立、與物等大的像，像在鏡後。",
    qEn: "When you blink your left eye, your mirror image blinks its…", qZh: "你眨左眼，鏡中像眨…",
    opts: ["Right eye 右眼", "Left eye 左眼", "Both eyes 雙眼", "No eye 不眨"], a: "Right eye 右眼",
    why: "Image is laterally inverted. 像左右對調。" },
  { titleEn: "Virtual images", titleZh: "虛像",
    bodyEn: "A virtual image cannot be captured on a screen because the reflected rays do not actually meet in front of the mirror.",
    bodyZh: "虛像不能在屏幕上成實像，因為反射光線並未在鏡前真正會聚。",
    qEn: "A plane mirror image is…", qZh: "平面鏡中的像是…",
    opts: ["Virtual and same size 虛像且同大", "Real and inverted 實像且倒立", "Always larger 總是較大", "Always smaller 總是較小"], a: "Virtual and same size 虛像且同大",
    why: "Rays appear to come from behind mirror. 光線看似來自鏡後。" },
  { titleEn: "Applications", titleZh: "應用",
    bodyEn: "Reflection is used in periscopes (two plane mirrors at 45°), safety reflectors, and rear-view mirrors.",
    bodyZh: "反射應用於潛望鏡（兩面45°平面鏡）、安全反光片及後視鏡。",
    qEn: "A periscope in a submarine uses…", qZh: "潛艇潛望鏡用…",
    opts: ["Reflection in plane mirrors 平面鏡反射", "Only refraction 只有折射", "Sound waves 聲波", "Magnetic fields 磁場"], a: "Reflection in plane mirrors 平面鏡反射",
    why: "Light reflects twice to see above water. 光經兩次反射看到水面以上。" },
];
const GUIDED = [
  { qEn: "i = r means…", qZh: "i = r 表示…",
    opts: ["Angle of incidence = angle of reflection 入射角 = 反射角", "Light stops 光停止", "No mirror needed 不需鏡", "Only refraction occurs 只有折射"], a: "Angle of incidence = angle of reflection 入射角 = 反射角",
    hint: "First law of reflection. 反射定律第一條。" },
  { qEn: "The normal is… to the mirror surface", qZh: "法線與鏡面…",
    opts: ["Perpendicular 垂直", "Parallel 平行", "At 45° only 只有45°", "Unrelated 無關"], a: "Perpendicular 垂直",
    hint: "90° to reflecting surface. 與反射面成90°。" },
  { qEn: "Letters in a mirror appear…", qZh: "鏡中字母…",
    opts: ["Laterally inverted 左右對調", "Upside down only 只有上下倒", "Unchanged always 永不改變", "Invisible 不可見"], a: "Laterally inverted 左右對調",
    hint: "Left-right reversal. 左右反轉。" },
  { qEn: "White paper reflects light…", qZh: "白紙反射光…",
    opts: ["In many directions (diffuse) 多方向（漫反射）", "Never 永不", "Only one exact angle 只有一個角度", "Only through the paper 只穿過紙"], a: "In many directions (diffuse) 多方向（漫反射）",
    hint: "Rough surface scatters light. 粗糙表面散射光。" },
];
const SUMMARY = [
  { en: "Reflection: light bounces off a surface; i = r (from normal).", zh: "反射：光從表面彈回；i = r（對法線）。" },
  { en: "Incident ray, reflected ray and normal lie in the same plane.", zh: "入射線、反射線和法線在同一平面。" },
  { en: "Plane mirror: virtual, upright, same-size, laterally inverted image.", zh: "平面鏡：虛像、正立、同大、左右對調。" },
  { en: "Used in periscopes, reflectors and vehicle mirrors.", zh: "用於潛望鏡、反光片及車輛後視鏡。" },
];
const REVIEW = [
  { qEn: "i = 40° → r = …", qZh: "i = 40° → r = …",
    opts: ["40°", "80°", "50°", "0°"], a: "40°" },
  { qEn: "Plane mirror image is…", qZh: "平面鏡像…",
    opts: ["Virtual 虛像", "Always real 總是實像", "Always upside down 總是倒立", "Twice object size 物體兩倍大"], a: "Virtual 虛像" },
  { qEn: "Experiment 14.1 uses a…", qZh: "實驗14.1使用…",
    opts: ["Ray box and plane mirror 光線箱和平面鏡", "Only a prism 只有棱鏡", "Sound meter 聲級計", "Thermometer 溫度計"], a: "Ray box and plane mirror 光線箱和平面鏡" },
  { qEn: "Normal line is…", qZh: "法線…",
    opts: ["Perpendicular to surface 垂直於表面", "Along the mirror 沿鏡面", "Random direction 隨機方向", "Same as incident ray 與入射線相同"], a: "Perpendicular to surface 垂直於表面" },
  { qEn: "Mirror image of letter b looks like…", qZh: "字母b的鏡像像…",
    opts: ["d (laterally inverted) d（左右對調）", "b unchanged b不變", "p only p", "q only q"], a: "d (laterally inverted) d（左右對調）" },
];

function ExperimentLab({ isZh, accent }) {
  const [angle, setAngle] = useState(30);
  const t = window.JSLGER.t;
  const rad = a => (a * Math.PI) / 180;
  const cx = 260, cy = 140;
  const len = 100;
  const ix = cx - len * Math.sin(rad(angle));
  const iy = cy - len * Math.cos(rad(angle));
  const rx = cx + len * Math.sin(rad(angle));
  const ry = cy - len * Math.cos(rad(angle));
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("調整入射角，驗證反射角 i = r（實驗14.1）。","Adjust incidence angle; verify reflection angle i = r (Exp 14.1).",isZh)}</p>
      <label className="block text-sm font-semibold">{t("入射角 i (°)","Angle of incidence i (°)")}: {angle}°</label>
      <input type="range" min="5" max="75" value={angle} onChange={e => setAngle(+e.target.value)} className="w-full" style={{accentColor: accent}} />
      <svg viewBox="0 0 520 220" className="w-full rounded-xl border bg-slate-50">
        <line x1="60" y1="140" x2="460" y2="140" stroke="#64748b" strokeWidth="4" />
        <text x="470" y="145" fontSize="11" fill="#64748b">{t("鏡","Mirror",isZh)}</text>
        <line x1={cx} y1="40" x2={cx} y2="140" stroke="#94a3b8" strokeWidth="2" strokeDasharray="6 4" />
        <text x={cx + 8} y="55" fontSize="11" fill="#64748b">{t("法線","Normal",isZh)}</text>
        <line x1={ix} y1={iy} x2={cx} y2={cy} stroke="#2563eb" strokeWidth="3" markerEnd="url(#arrB)" />
        <line x1={cx} y1={cy} x2={rx} y2={ry} stroke={accent} strokeWidth="3" markerEnd="url(#arrA)" />
        <text x={ix - 10} y={iy - 8} fontSize="12" fill="#2563eb">i = {angle}°</text>
        <text x={rx + 5} y={ry - 8} fontSize="12" fill={accent}>r = {angle}°</text>
        <defs>
          <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill={accent} /></marker>
          <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2563eb" /></marker>
        </defs>
      </svg>
      <p className="font-bold text-center" style={{color: accent}}>{t("反射角 = 入射角","Reflection angle = incidence angle",isZh)}</p>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_reflection", titleEn: "Reflection of Light", titleZh: "光的反射", unit: "Form 3 · Book 14 Light & Electromagnetic Spectrum" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
