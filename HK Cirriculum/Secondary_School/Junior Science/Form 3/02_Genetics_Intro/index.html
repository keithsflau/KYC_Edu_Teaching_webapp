<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genetics Intro · 遺傳學入門 | S3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #faf5ff; }</style>
  <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#7c3aed";
    const { Shell } = window.JSLGER;

    const LEARN = [
      { titleEn: "DNA carries instructions", titleZh: "DNA 攜帶指令",
        bodyEn: "DNA in the nucleus stores genetic information as a sequence of bases (A, T, C, G).",
        bodyZh: "細胞核內的 DNA 以鹼基序列（A、T、C、G）儲存遺傳資訊。",
        qEn: "DNA is found mainly in the…", qZh: "DNA 主要位於…",
        opts: [{ en: "Nucleus", zh: "細胞核" }, { en: "Cell wall", zh: "細胞壁" }, { en: "Vacuole only", zh: "只有液泡" }], a: 0,
        whyEn: "Chromosomes in nucleus.", whyZh: "染色體在細胞核。" },
      { titleEn: "Genes and alleles", titleZh: "基因與對偶基因",
        bodyEn: "A gene is a section of DNA for one trait. Different versions are alleles (e.g. B for brown eyes, b for blue).",
        bodyZh: "基因是控制一性狀的 DNA 片段。不同版本稱對偶基因（如 B 棕眼、b 藍眼）。",
        qEn: "Alternative forms of a gene are called…", qZh: "基因的不同形式稱為…",
        opts: [{ en: "Alleles", zh: "對偶基因" }, { en: "Atoms", zh: "原子" }, { en: "Organs", zh: "器官" }], a: 0,
        whyEn: "One gene, multiple alleles possible.", whyZh: "一個基因可有多個對偶基因。" },
      { titleEn: "Dominant and recessive", titleZh: "顯性與隱性",
        bodyEn: "Dominant alleles show their effect even with one copy; recessive need two copies to show.",
        bodyZh: "顯性對偶基因只需一個副本便表現；隱性需兩個副本才表現。",
        qEn: "Genotype Bb with B dominant → phenotype…", qZh: "基因型 Bb，B 為顯性→表現型…",
        opts: [{ en: "Shows B trait", zh: "表現 B 性狀" }, { en: "Shows b only", zh: "只表現 b" }, { en: "No trait", zh: "無性狀" }], a: 0,
        whyEn: "One dominant allele enough.", whyZh: "一個顯性等位基因已足夠。" },
      { titleEn: "Punnett square", titleZh: "龐氏表",
        bodyEn: "A Punnett square predicts offspring genotypes from parental gametes (half the alleles each).",
        bodyZh: "龐氏表由親本配子（各含一半對偶基因）預測子代基因型。",
        qEn: "Each parent contributes ___ allele(s) per gene to offspring", qZh: "每位親本就每個基因提供 ___ 個對偶基因給子代",
        opts: [{ en: "One", zh: "一個" }, { en: "Four", zh: "四個" }, { en: "None", zh: "零個" }], a: 0,
        whyEn: "Gametes are haploid.", whyZh: "配子為單倍體。" },
      { titleEn: "Variation", titleZh: "變異",
        bodyEn: "Sexual reproduction mixes alleles → genetic variation helps populations adapt.",
        bodyZh: "有性生殖混合對偶基因→遺傳變異有助族群適應。",
        qEn: "Variation is important for…", qZh: "變異對…重要",
        opts: [{ en: "Survival when environment changes", zh: "環境改變時的生存" }, { en: "Making clones only", zh: "只製造克隆" }, { en: "Stopping evolution", zh: "阻止演化" }], a: 0,
        whyEn: "Diversity = resilience.", whyZh: "多樣性=適應力。" },
      { titleEn: "Lab cross", titleZh: "實驗交配",
        bodyEn: "Cross two parents in the lab and read off offspring ratios from the Punnett square.",
        bodyZh: "在實驗室讓兩親本交配，從龐氏表讀取子代比例。",
        qEn: "Bb × Bb → chance of bb offspring?", qZh: "Bb × Bb → bb 子代機率？",
        opts: ["25%", "50%", "100%"], a: 0,
        whyEn: "1 in 4 squares is bb.", whyZh: "四格中有一格為 bb。" }
    ];

    const GUIDED = [
      { qEn: "Alleles are versions of…", qZh: "對偶基因是…的版本",
        opts: [{ en: "A gene", zh: "基因" }, { en: "A cell", zh: "細胞" }, { en: "A tissue", zh: "組織" }], a: 0,
        hintEn: "Same gene locus.", hintZh: "同一基因位點。" },
      { qEn: "Recessive trait needs genotype…", qZh: "隱性性狀需要基因型…",
        opts: [{ en: "Two recessive alleles", zh: "兩個隱性" }, { en: "One dominant", zh: "一個顯性" }, { en: "No DNA", zh: "無 DNA" }], a: 0,
        hintEn: "aa for recessive a.", hintZh: "隱性 a 需 aa。" },
      { qEn: "Gametes carry… chromosomes compared to body cells", qZh: "配子染色體數比體細胞…",
        opts: [{ en: "Half", zh: "一半" }, { en: "Double", zh: "兩倍" }, { en: "Same", zh: "相同" }], a: 0,
        hintEn: "Meiosis halves number.", hintZh: "減數分裂使數目減半。" },
      { qEn: "Punnett square shows…", qZh: "龐氏表顯示…",
        opts: [{ en: "Possible offspring genotypes", zh: "可能子代基因型" }, { en: "Adult height only", zh: "只顯示成人身高" }, { en: "Planet orbits", zh: "行星軌道" }], a: 0,
        hintEn: "Probability tool.", hintZh: "機率工具。" }
    ];

    const SUMMARY = [
      { en: "DNA → genes → alleles → traits.", zh: "DNA → 基因 → 對偶基因 → 性狀。" },
      { en: "Dominant masks recessive in heterozygotes.", zh: "雜合子中顯性掩蓋隱性。" },
      { en: "Punnett squares predict offspring ratios.", zh: "龐氏表預測子代比例。" },
      { en: "Variation supports adaptation.", zh: "變異支持適應。" }
    ];

    const REVIEW = [
      { qEn: "DNA bases include…", qZh: "DNA 鹼基包括…",
        opts: ["A, T, C, G", "Only O and H", "Fe and Cu"], a: 0 },
      { qEn: "Bb parent makes gametes…", qZh: "Bb 親本產生配子…",
        opts: ["B or b", "Only B", "Bb always"], a: 0 },
      { qEn: "bb phenotype shows when trait is recessive", qZh: "隱性性狀在 bb 表現",
        opts: [{ en: "True", zh: "是" }, { en: "False", zh: "否" }, { en: "Only in plants", zh: "只在植物" }], a: 0 },
      { qEn: "Bb × Bb → BB probability", qZh: "Bb × Bb → BB 機率",
        opts: ["25%", "75%", "0%"], a: 0 },
      { qEn: "Genetic variation helps…", qZh: "遺傳變異有助…",
        opts: [{ en: "Adaptation", zh: "適應" }, { en: "Identical clones only", zh: "只有相同克隆" }, { en: "Less evolution", zh: "減少演化" }], a: 0 }
    ];

    function GeneticsLab({ isZh }) {
      const [p1, setP1] = useState("Bb");
      const [p2, setP2] = useState("Bb");
      const t = window.JSLGER.t;

      function cross(a, b) {
        const g1 = [a[0], a[1] || a[0]];
        const g2 = [b[0], b[1] || b[0]];
        const out = [];
        g1.forEach(x => g2.forEach(y => out.push([x, y].sort().join(""))));
        return out;
      }
      const offspring = cross(p1, p2);
      const counts = offspring.reduce((m, g) => { m[g] = (m[g] || 0) + 1; return m; }, {});

      return (
        <div>
          <div className="flex flex-wrap gap-4 mb-4">
            <label className="text-sm font-bold">{t("親本 1", "Parent 1", isZh)}
              <select value={p1} onChange={e => setP1(e.target.value)} className="block mt-1 border rounded-lg px-3 py-2 min-h-[44px]">
                {["BB", "Bb", "bb"].map(g => <option key={g} value={g}>{g}</option>)}
              </select>
            </label>
            <label className="text-sm font-bold">{t("親本 2", "Parent 2", isZh)}
              <select value={p2} onChange={e => setP2(e.target.value)} className="block mt-1 border rounded-lg px-3 py-2 min-h-[44px]">
                {["BB", "Bb", "bb"].map(g => <option key={g} value={g}>{g}</option>)}
              </select>
            </label>
          </div>
          <div className="grid grid-cols-2 gap-2 max-w-xs">
            {[0, 1].map(i => [0, 1].map(j => {
              const a = (p1[i] || p1[0]);
              const b = (p2[j] || p2[0]);
              const g = [a, b].sort().join("");
              return (
                <div key={i + "-" + j} className="bg-violet-100 border border-violet-300 rounded-lg p-4 text-center font-bold text-lg">
                  {g}
                </div>
              );
            }))}
          </div>
          <div className="mt-4 space-y-1 text-sm">
            {Object.entries(counts).map(([g, n]) => (
              <p key={g}><strong>{g}</strong>: {n}/4 ({n * 25}%)</p>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      return (
        <Shell
          meta={{ appId: "s3_genetics_intro", titleEn: "Genetics Introduction", titleZh: "遺傳學入門", unit: "Form 3 · Life Science Bridge" }}
          accent={ACCENT}
          backHref="../index.html"
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <GeneticsLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
