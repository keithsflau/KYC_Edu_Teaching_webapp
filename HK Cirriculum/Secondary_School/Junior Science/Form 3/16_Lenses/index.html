<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenses · 透鏡 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #fffbeb; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>分辨凸透鏡會聚和凹透鏡發散。</li><li>按物距在 2F 外、F 與 2F 之間、F 內描述像的性質。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#f59e0b";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "What are lenses?", titleZh: "甚麼是透鏡？",
    bodyEn: "Lenses are transparent optical instruments that work by refraction. They have curved surfaces and are made of glass or plastic.",
    bodyZh: "透鏡是以透明物質（如玻璃）製成、利用光折射的簡單光學儀器，表面呈彎曲形狀。",
    qEn: "Lenses work mainly by…", qZh: "透鏡主要利用…",
    opts: ["Refraction of light 光的折射", "Only reflection 只有反射", "Sound waves 聲波", "Magnetism 磁性"], a: "Refraction of light 光的折射",
    why: "Curved surfaces bend light. 彎曲表面使光偏折。" },
  { titleEn: "Convex lens", titleZh: "凸透鏡",
    bodyEn: "A convex lens is thicker at the centre than at the edges. Parallel light rays converge at the principal focus F (Experiment 14.9).",
    bodyZh: "凸透鏡中間較厚、邊緣較薄。平行光線通過後會聚於主焦點 F（實驗14.9）。",
    qEn: "Parallel rays through a convex lens…", qZh: "平行光通過凸透鏡…",
    opts: ["Converge at principal focus 會聚於主焦點", "Diverge always 總是發散", "Stop 停止", "Reflect only 只有反射"], a: "Converge at principal focus 會聚於主焦點",
    why: "Converging lens. 會聚透鏡。" },
  { titleEn: "Concave lens", titleZh: "凹透鏡",
    bodyEn: "A concave lens is thinner at the centre. Parallel rays diverge; extending them backwards they meet at the principal focus.",
    bodyZh: "凹透鏡中間較薄。平行光線發散；往後延長則相交於主焦點。",
    qEn: "Concave lens makes parallel rays…", qZh: "凹透鏡使平行光…",
    opts: ["Diverge 發散", "Converge 會聚", "Stop 停止", "Become invisible 不可見"], a: "Diverge 發散",
    why: "Diverging lens. 發散透鏡。" },
  { titleEn: "Focal length", titleZh: "焦距",
    bodyEn: "The distance between the two principal foci of a lens is called the focal length. A lens focusing sunlight to a bright spot on wood is a convex lens.",
    bodyZh: "透鏡兩個主焦點之間的距離稱為焦距。能把陽光聚焦成光點的透鏡是凸透鏡。",
    qEn: "Sunlight focused to a spot on wood → … lens", qZh: "陽光聚焦成木上光點→…透鏡",
    opts: ["Convex 凸透鏡", "Concave 凹透鏡", "Plane mirror 平面鏡", "Opaque block 不透明塊"], a: "Convex 凸透鏡",
    why: "Converging action. 會聚作用。" },
  { titleEn: "Real and virtual images", titleZh: "實像與虛像",
    bodyEn: "With a convex lens: object far away gives a real inverted image; object very close gives a virtual upright magnified image (magnifying glass).",
    bodyZh: "凸透鏡：物距遠時成倒立實像；物距很近時成正立虛像（放大鏡）。",
    qEn: "A magnifying glass produces a… image", qZh: "放大鏡成…像",
    opts: ["Virtual upright magnified 正立虛像放大", "Real inverted 倒立實像", "No image 無像", "Only sound 只有聲"], a: "Virtual upright magnified 正立虛像放大",
    why: "Object inside focal length. 物在焦距內。" },
  { titleEn: "Corrective lenses", titleZh: "矯正透鏡",
    bodyEn: "Concave lenses correct short sight; convex lenses correct long sight — they adjust where light focuses on the retina.",
    bodyZh: "凹透鏡矯正近視；凸透鏡矯正遠視——調整光在視網膜上的聚焦位置。",
    qEn: "Short-sightedness is often corrected with…", qZh: "近視常以…矯正",
    opts: ["Concave (diverging) lens 凹（發散）透鏡", "Convex lens only 只有凸透鏡", "Plane mirror 平面鏡", "Prism only 只有棱鏡"], a: "Concave (diverging) lens 凹（發散）透鏡",
    why: "Diverges rays before retina. 在視網膜前發散光線。" },
];
const GUIDED = [
  { qEn: "Convex vs concave: convex is thicker at…", qZh: "凸 vs 凹：凸透鏡…較厚",
    opts: ["Centre 中間", "Edges only 只有邊緣", "Neither 兩者皆否", "Top only 只有頂部"], a: "Centre 中間",
    hint: "Bulging middle. 中間隆起。" },
  { qEn: "Real image can…", qZh: "實像可以…",
    opts: ["Be projected on a screen 在屏上呈現", "Never be seen 永不可見", "Only be virtual 只能是虛像", "Only be upright 只能正立"], a: "Be projected on a screen 在屏上呈現",
    hint: "Rays actually meet. 光線真正會聚。" },
  { qEn: "Camera sensor image is…", qZh: "相機感光元件上的像是…",
    opts: ["Real inverted 倒立實像", "Virtual only 只有虛像", "Same size always 總是同大", "Invisible 不可見"], a: "Real inverted 倒立實像",
    hint: "Convex lens with distant object. 凸透鏡拍遠物。" },
  { qEn: "Principal focus F is where… rays meet (convex)", qZh: "主焦點 F 是…光線會聚處（凸透鏡）",
    opts: ["Parallel 平行", "Only scattered 只有散射", "Sound 聲", "Heat 熱"], a: "Parallel 平行",
    hint: "Experiment 14.9 setup. 實驗14.9裝置。" },
];
const SUMMARY = [
  { en: "Convex: thicker at centre, converges parallel rays to F.", zh: "凸透鏡：中間厚，使平行光會聚於 F。" },
  { en: "Concave: thinner at centre, diverges parallel rays.", zh: "凹透鏡：中間薄，使平行光發散。" },
  { en: "Focal length = distance between the two principal foci.", zh: "焦距 = 兩主焦點之間的距離。" },
  { en: "Convex: real or virtual image depending on object distance.", zh: "凸透鏡：視物距成實像或虛像。" },
];
const REVIEW = [
  { qEn: "Experiment 14.9 compares… lenses", qZh: "實驗14.9比較…透鏡",
    opts: ["Convex and concave 凸和凹", "Only mirrors 只有鏡", "Only prisms 只有棱鏡", "Sound lenses 聲透鏡"], a: "Convex and concave 凸和凹" },
  { qEn: "Magnifying glass = … lens, … image", qZh: "放大鏡 = …透鏡，…像",
    opts: ["Convex, virtual 凸，虛像", "Concave, real 凹，實像", "Mirror, real 鏡，實像", "Opaque, none 不透明，無"], a: "Convex, virtual 凸，虛像" },
  { qEn: "Concave lens… parallel rays", qZh: "凹透鏡…平行光",
    opts: ["Diverges 發散", "Converges 會聚", "Absorbs 吸收", "Reflects only 只有反射"], a: "Diverges 發散" },
  { qEn: "Long sight often needs… lens", qZh: "遠視常需…透鏡",
    opts: ["Convex 凸透鏡", "Concave only 只有凹", "Mirror 鏡", "None 無"], a: "Convex 凸透鏡" },
  { qEn: "Focal length is distance between…", qZh: "焦距是…之間的距離",
    opts: ["Two principal foci 兩個主焦點", "Two mirrors 兩面鏡", "Object and eye 物和眼", "Sun and Moon 日月"], a: "Two principal foci 兩個主焦點" },
];

function ExperimentLab({ isZh, accent }) {
  const [dist, setDist] = useState(25);
  const [lensType, setLensType] = useState("convex");
  const t = window.JSLGER.t;
  const f = 15;
  const real = lensType === "convex" && dist > f;
  const virtual = lensType === "convex" && dist <= f;
  const cx = 280, cy = 110;
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("選擇透鏡類型並調整物距，觀察像的性質（實驗14.9）。","Choose lens type and object distance; observe image type (Exp 14.9).",isZh)}</p>
      <div className="flex gap-2">
        <button type="button" onClick={() => setLensType("convex")} className={"flex-1 py-2 rounded-lg min-h-[44px] " + (lensType==="convex"?"text-white font-bold":"bg-slate-100")} style={lensType==="convex"?{background:accent}:{}}>{t("凸透鏡","Convex",isZh)}</button>
        <button type="button" onClick={() => setLensType("concave")} className={"flex-1 py-2 rounded-lg min-h-[44px] " + (lensType==="concave"?"text-white font-bold":"bg-slate-100")} style={lensType==="concave"?{background:accent}:{}}>{t("凹透鏡","Concave",isZh)}</button>
      </div>
      {lensType === "convex" && (
        <>
          <label className="block text-sm font-semibold">{t("物距 (cm)","Object distance (cm)")}: {dist}</label>
          <input type="range" min="5" max="40" value={dist} onChange={e => setDist(+e.target.value)} className="w-full" style={{accentColor: accent}} />
        </>
      )}
      <svg viewBox="0 0 520 200" className="w-full rounded-xl border bg-slate-50">
        <line x1="60" y1="110" x2="460" y2="110" stroke="#cbd5e1" strokeWidth="1" />
        {lensType === "convex" ? (
          <path d="M 270 40 Q 295 110 270 180 Q 245 110 270 40" fill="#bae6fd" stroke="#0284c7" strokeWidth="2" />
        ) : (
          <path d="M 290 40 Q 265 110 290 180 Q 315 110 290 40" fill="#bae6fd" stroke="#0284c7" strokeWidth="2" />
        )}
        <circle cx="120" cy="110" r="8" fill="#ef4444" />
        <text x="120" y="95" textAnchor="middle" fontSize="10" fill="#64748b">{t("物","Object",isZh)}</text>
        {lensType === "convex" && real && (
          <>
            <line x1="120" y1="90" x2={cx} y2="90" stroke="#f59e0b" strokeWidth="1.5" opacity="0.6" />
            <line x1="120" y1="130" x2={cx} y2="130" stroke="#f59e0b" strokeWidth="1.5" opacity="0.6" />
            <line x1={cx} y1="90" x2="420" y2="150" stroke="#f59e0b" strokeWidth="1.5" />
            <line x1={cx} y1="130" x2="420" y2="70" stroke="#f59e0b" strokeWidth="1.5" />
            <polygon points="400,75 410,85 400,95" fill="#dc2626" opacity="0.8" transform="rotate(180 405 85)" />
            <text x="400" y="165" fontSize="11" fill="#dc2626">{t("倒立實像","Real inverted",isZh)}</text>
          </>
        )}
        {lensType === "convex" && virtual && (
          <>
            <line x1="120" y1="90" x2={cx} y2="90" stroke="#f59e0b" strokeWidth="1.5" opacity="0.5" />
            <line x1={cx} y1="90" x2="200" y2="60" stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="5 3" />
            <text x="180" y="55" fontSize="11" fill="#2563eb">{t("正立虛像（放大）","Virtual upright (magnified)",isZh)}</text>
          </>
        )}
        {lensType === "concave" && (
          <>
            <line x1="120" y1="90" x2={cx} y2="90" stroke="#f59e0b" strokeWidth="1.5" opacity="0.5" />
            <line x1={cx} y1="90" x2="400" y2="70" stroke="#f59e0b" strokeWidth="1.5" />
            <line x1={cx} y1="90" x2="400" y2="110" stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="4 3" />
            <text x="350" y="55" fontSize="11" fill="#64748b">{t("發散","Diverging",isZh)}</text>
          </>
        )}
        <text x={cx} y="195" textAnchor="middle" fontSize="10" fill="#64748b">F</text>
      </svg>
      <p className="font-bold text-center" style={{color: accent}}>
        {lensType === "concave" ? t("平行光發散","Parallel rays diverge",isZh) : real ? t("物距 > f：倒立實像","Object distance > f: real inverted image",isZh) : t("物距 < f：正立虛像（放大鏡）","Object distance < f: virtual upright (magnifier)",isZh)}
      </p>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_lenses", titleEn: "Lenses", titleZh: "透鏡", unit: "Form 3 · Book 14 Light & Electromagnetic Spectrum" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
