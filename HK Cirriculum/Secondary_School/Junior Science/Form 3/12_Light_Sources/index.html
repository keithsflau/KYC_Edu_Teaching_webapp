<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light Sources · 光源 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #fffbeb; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>指出光沿直線前進。</li><li>分辨自己發光的物體和只反射光的物體。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#f59e0b";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Luminous objects", titleZh: "發光體",
    bodyEn: "Objects that give out their own light are called luminous objects, e.g. the Sun, an LED clock, a smartphone screen.",
    bodyZh: "本身會發光的物體稱為發光體，例如太陽、發光二極管(LED)時鐘、智能電話屏幕。",
    qEn: "In complete darkness you can see time on…", qZh: "在漆黑一片時，你能看見…上的時間",
    opts: ["Smartphone / LED clock 智能電話/LED時鐘", "Wall clock 掛牆時鐘", "Wooden desk 木書桌", "Closed book 合上的書"], a: "Smartphone / LED clock 智能電話/LED時鐘",
    why: "Luminous objects emit light into our eyes. 發光體自行發光進入眼睛。" },
  { titleEn: "Non-luminous objects", titleZh: "非發光體",
    bodyEn: "Objects that do not give out their own light are non-luminous. We see them when they reflect light from a source into our eyes.",
    bodyZh: "本身不會發光的物體稱為非發光體。只有當非發光體把來自光源的光反射到我們的眼睛時，我們才能看見它們。",
    qEn: "A wall clock in a dark room becomes visible when you…", qZh: "漆黑房間內的掛牆時鐘，當你…時才看得見",
    opts: ["Turn on a lamp 開燈", "Close your eyes 閉上眼睛", "Remove the clock 移走時鐘", "Wait for moonlight only 只等月光"], a: "Turn on a lamp 開燈",
    why: "Non-luminous objects need reflected light. 非發光體需要反射光。" },
  { titleEn: "How we see objects", titleZh: "我們如何看見物體",
    bodyEn: "Light from a luminous object travels in straight lines into our eyes. For non-luminous objects, light bounces off them into our eyes.",
    bodyZh: "來自發光體的光沿直線進入我們的眼睛。非發光體則把光反射到我們的眼睛。",
    qEn: "The Moon is visible at night because it…", qZh: "晚上看見月亮因為它…",
    opts: ["Reflects sunlight 反射陽光", "Burns like the Sun 像太陽一樣燃燒", "Emits its own bright light 自行發出強光", "Absorbs all light 吸收所有光"], a: "Reflects sunlight 反射陽光",
    why: "The Moon is non-luminous. 月亮是非發光體。" },
  { titleEn: "Light travels in straight lines", titleZh: "光沿直線傳播",
    bodyEn: "When three cards with holes are aligned, a straight rod can pass through all holes — light also travels in straight lines (rectilinear propagation).",
    bodyZh: "三張有小孔的卡紙排成一直線時，長直竹籤可同時穿過各孔——光也是沿直線傳播的。",
    qEn: "Sharp shadows and laser beams show light…", qZh: "清晰的影子和激光束顯示光…",
    opts: ["Travels in straight lines 沿直線傳播", "Always curves around corners 總是轉彎", "Stops instantly in air 在空氣中立刻停止", "Travels in circles 沿圓圈傳播"], a: "Travels in straight lines 沿直線傳播",
    why: "Experiment 14.1 card-hole test. 卡紙小孔實驗。" },
  { titleEn: "Natural and artificial sources", titleZh: "天然與人造光源",
    bodyEn: "Natural sources: Sun, stars, lightning, fireflies. Artificial sources: light bulbs, LEDs, lasers, phone screens.",
    bodyZh: "天然光源：太陽、星、閃電、螢火蟲。人造光源：燈泡、LED、激光、手機屏幕。",
    qEn: "A firefly is a… light source", qZh: "螢火蟲是…光源",
    opts: ["Natural luminous 天然發光", "Artificial non-luminous 人造非發光", "Not a light source 不是光源", "Only reflects moonlight 只反射月光"], a: "Natural luminous 天然發光",
    why: "Bioluminescence — emits own light. 生物發光——自行發光。" },
  { titleEn: "Classifying objects", titleZh: "分辨物體",
    bodyEn: "A classroom projection screen, a book and a desk are all non-luminous — they do not give out their own light.",
    bodyZh: "課室投影屏幕、書和書桌都是非發光體——它們本身不會發光。",
    qEn: "Which is a luminous object?", qZh: "哪一項是發光體？",
    opts: ["LED street lamp LED街燈", "White paper 白紙", "Blackboard 黑板", "Mirror (not lit) 未照明的鏡"], a: "LED street lamp LED街燈",
    why: "LED lamp emits its own light. LED燈自行發光。" },
];
const GUIDED = [
  { qEn: "The Sun is…", qZh: "太陽是…",
    opts: ["A luminous object 發光體", "A non-luminous object 非發光體", "Not related to light 與光無關", "Only visible by reflection 只靠反射可見"], a: "A luminous object 發光體",
    hint: "The Sun produces its own light. 太陽自行發光。" },
  { qEn: "Without a light source, a non-luminous book…", qZh: "沒有光源時，非發光體的書…",
    opts: ["Cannot be seen 看不見", "Glows by itself 自行發光", "Creates light 製造光", "Becomes luminous 變成發光體"], a: "Cannot be seen 看不見",
    hint: "No light to reflect. 沒有光可反射。" },
  { qEn: "Pinhole camera works because light…", qZh: "針孔相機因光…",
    opts: ["Travels in straight lines 沿直線傳播", "Always bends randomly 隨機彎曲", "Needs a mirror 需要鏡", "Only moves in curves 只沿曲線"], a: "Travels in straight lines 沿直線傳播",
    hint: "Rectilinear propagation. 直線傳播。" },
  { qEn: "HK night street lighting mainly uses…", qZh: "香港夜間街燈主要用…",
    opts: ["Artificial LEDs/lamps 人造LED/燈", "The Moon only 只有月亮", "Fireflies 螢火蟲", "No light sources 無光源"], a: "Artificial LEDs/lamps 人造LED/燈",
    hint: "Efficient artificial lighting. 高效人造照明。" },
];
const SUMMARY = [
  { en: "Luminous objects give out their own light; non-luminous objects do not.", zh: "發光體本身會發光；非發光體本身不會發光。" },
  { en: "We see non-luminous objects when they reflect light from a source into our eyes.", zh: "非發光體把光源的光反射到眼睛，我們才能看見。" },
  { en: "Light travels in straight lines in a uniform medium.", zh: "光在均勻介質中沿直線傳播。" },
  { en: "Natural sources (Sun, fireflies) and artificial sources (LED, laser) enable vision.", zh: "天然光源（太陽、螢火蟲）和人造光源（LED、激光）使我們能看見。" },
];
const REVIEW = [
  { qEn: "In darkness, which clock can you read?", qZh: "漆黑中可讀哪個時鐘？",
    opts: ["LED / smartphone clock LED/智能電話時鐘", "Wall clock without lamp 無燈的掛牆時鐘", "Wooden block 木塊", "Closed textbook 合上的課本"], a: "LED / smartphone clock LED/智能電話時鐘" },
  { qEn: "Moonlight is…", qZh: "月光是…",
    opts: ["Reflected sunlight 反射的陽光", "Light made by Moon burning 月亮燃燒產生的光", "Artificial LED on Moon 月球上的LED", "Not related to the Sun 與太陽無關"], a: "Reflected sunlight 反射的陽光" },
  { qEn: "A desk in a classroom is…", qZh: "課室書桌是…",
    opts: ["Non-luminous 非發光體", "Luminous 發光體", "A laser source 激光源", "Invisible always 永遠不可見"], a: "Non-luminous 非發光體" },
  { qEn: "Light from a hole in card P reaches card R only when holes align because light…", qZh: "卡紙P的孔光能到達R，因光…",
    opts: ["Travels straight 沿直線傳播", "Turns corners 轉彎", "Stops at card Q 在Q停止", "Is absorbed always 總被吸收"], a: "Travels straight 沿直線傳播" },
  { qEn: "To see a non-luminous wall clock in a dark room you must…", qZh: "要在黑房看見非發光掛鐘須…",
    opts: ["Shine light on it 把光照向它", "Make it luminous 使它發光", "Remove your eyes 移開眼睛", "Use only UV light 只用紫外光"], a: "Shine light on it 把光照向它" },
];

function ExperimentLab({ isZh, accent }) {
  const [lamp, setLamp] = useState(false);
  const t = window.JSLGER.t;
  const items = [
    { id: "led", zh: "LED時鐘", en: "LED clock", luminous: true, x: 80 },
    { id: "phone", zh: "手機屏", en: "Phone screen", luminous: true, x: 200 },
    { id: "wall", zh: "掛牆時鐘", en: "Wall clock", luminous: false, x: 320 },
    { id: "book", zh: "書本", en: "Book", luminous: false, x: 440 },
  ];
  const visible = o => o.luminous || lamp;
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("切換房燈，比較發光體與非發光體在漆黑房間的可見性。", "Toggle the lamp to compare luminous vs non-luminous visibility in a dark room.", isZh)}</p>
      <button type="button" onClick={() => setLamp(!lamp)} className="w-full px-6 py-3 rounded-xl text-white font-bold min-h-[48px]" style={{background: accent}}>
        {lamp ? t("關燈（漆黑）","Turn off lamp (dark)",isZh) : t("開燈","Turn on lamp",isZh)}
      </button>
      <svg viewBox="0 0 520 200" className="w-full rounded-xl border bg-slate-900">
        <rect width="520" height="200" fill={lamp ? "#334155" : "#0f172a"} />
        {lamp && <ellipse cx="260" cy="20" rx="120" ry="30" fill="#fef08a" opacity="0.4" />}
        {items.map(o => (
          <g key={o.id} opacity={visible(o) ? 1 : 0.12}>
            <rect x={o.x - 40} y="70" width="80" height="60" rx="8" fill={o.luminous ? "#fbbf24" : "#94a3b8"} stroke={o.luminous ? "#f59e0b" : "#64748b"} strokeWidth="2" />
            {o.luminous && <circle cx={o.x} cy="85" r="8" fill="#fff" opacity="0.9" />}
            <text x={o.x} y="155" textAnchor="middle" fill="#e2e8f0" fontSize="11">{t(o.zh, o.en, isZh)}</text>
            {visible(o) && o.luminous && <line x1={o.x} y1="70" x2={o.x} y2="30" stroke="#fde68a" strokeWidth="2" strokeDasharray="4 3" opacity="0.7" />}
            {visible(o) && !o.luminous && lamp && <line x1="260" y1="35" x2={o.x} y2="70" stroke="#fef9c3" strokeWidth="1.5" opacity="0.5" />}
          </g>
        ))}
        <circle cx="480" cy="100" r="18" fill="#fcd34d" opacity={lamp ? 0.9 : 0.15} />
        <text x="480" y="140" textAnchor="middle" fill="#94a3b8" fontSize="10">{t("燈","Lamp",isZh)}</text>
      </svg>
      <p className="text-sm font-bold text-center" style={{color: accent}}>
        {lamp ? t("非發光體靠反射光可見","Non-luminous objects visible by reflected light",isZh) : t("只有發光體可見","Only luminous objects visible",isZh)}
      </p>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_light_sources", titleEn: "Light Sources", titleZh: "光源", unit: "Form 3 · Book 14 Light & Electromagnetic Spectrum" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
