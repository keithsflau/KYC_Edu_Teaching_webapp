<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecosystem Balance · 生態平衡 | S3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #f0fdf4; }</style>
  <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#15803d";
    const { Shell } = window.JSLGER;

    const LEARN = [
      { titleEn: "Food chains", titleZh: "食物鏈",
        bodyEn: "Energy flows from producers (plants) to primary consumers (herbivores) to secondary consumers (carnivores).",
        bodyZh: "能量由生產者（植物）流向初級消費者（草食動物）再到次級消費者（肉食動物）。",
        qEn: "Producers make food by…", qZh: "生產者以…製造食物",
        opts: [{ en: "Photosynthesis", zh: "光合作用" }, { en: "Eating meat only", zh: "只吃肉" }, { en: "Decomposition", zh: "分解" }], a: 0,
        whyEn: "Plants capture light energy.", whyZh: "植物捕捉光能。" },
      { titleEn: "Food webs", titleZh: "食物網",
        bodyEn: "Real ecosystems have interconnected food chains — a food web. Removing one species affects many others.",
        bodyZh: "真實生態系有互相連結的食物鏈——食物網。移除一種物種會影響多種其他生物。",
        qEn: "A food web is…", qZh: "食物網是…",
        opts: [{ en: "Many linked food chains", zh: "多條連結的食物鏈" }, { en: "One straight line only", zh: "只有一條直線" }, { en: "Only about water", zh: "只關於水" }], a: 0,
        whyEn: "Species eat multiple prey/predators.", whyZh: "物種有多種獵物/捕食者。" },
      { titleEn: "Population balance", titleZh: "族群平衡",
        bodyEn: "Predator-prey cycles: more prey → more predators → prey drops → predators drop → prey recovers.",
        bodyZh: "捕食者-獵物循環：獵物多 → 捕食者多 → 獵物減 → 捕食者減 → 獵物恢復。",
        qEn: "If rabbits increase, foxes may later…", qZh: "若兔子增加，狐狸之後可能…",
        opts: [{ en: "Increase then decrease", zh: "先增後減" }, { en: "Vanish instantly", zh: "立刻消失" }, { en: "Become plants", zh: "變成植物" }], a: 0,
        whyEn: "Lag in predator response.", whyZh: "捕食者反應有滯後。" },
      { titleEn: "Human disturbance", titleZh: "人類干擾",
        bodyEn: "Pollution, habitat loss, and overfishing can collapse food webs. Conservation restores balance.",
        bodyZh: "污染、棲地喪失和過度捕撈可令食物網崩潰。保育可恢復平衡。",
        qEn: "Marine reserves help by…", qZh: "海洋保護區有助因為…",
        opts: [{ en: "Protecting breeding stocks", zh: "保護繁殖族群" }, { en: "Removing all fish", zh: "除去所有魚" }, { en: "Adding plastic", zh: "增加塑膠" }], a: 0,
        whyEn: "Allows populations to recover.", whyZh: "讓族群恢復。" },
      { titleEn: "HK wetlands", titleZh: "香港濕地",
        bodyEn: "Mai Po and wetlands filter water, host migratory birds, and are sensitive indicators of ecosystem health.",
        bodyZh: "米埔等濕地過濾水、棲息候鳥，是生態健康的敏感指標。",
        qEn: "Wetlands are important for…", qZh: "濕地對…很重要",
        opts: [{ en: "Biodiversity and water quality", zh: "生物多樣性和水質" }, { en: "Only building land", zh: "只有建地" }, { en: "Burning fossil fuels", zh: "燃燒化石燃料" }], a: 0,
        whyEn: "Ramsar site value.", whyZh: "拉姆薩爾濕地價值。" },
      { titleEn: "Simulator", titleZh: "模擬器",
        bodyEn: "Adjust grass, rabbit and fox populations to keep the ecosystem stable.",
        bodyZh: "調整草、兔子和狐狸數量，維持生態系穩定。",
        qEn: "Too many foxes with few rabbits leads to…", qZh: "狐狸太多、兔子太少會…",
        opts: [{ en: "Fox starvation", zh: "狐狸餓死" }, { en: "More grass forever", zh: "草永遠增多" }, { en: "No change", zh: "無變化" }], a: 0,
        whyEn: "Predators depend on prey.", whyZh: "捕食者依賴獵物。" }
    ];

    const GUIDED = [
      { qEn: "Energy in food chains flows…", qZh: "食物鏈能量流向…",
        opts: [{ en: "One way (lost as heat)", zh: "單向（以熱散失）" }, { en: "Back to sun", zh: "回到太陽" }, { en: "In circles forever", zh: "永遠循環" }], a: 0,
        hintEn: "10% rule between trophic levels.", hintZh: "營養級之間約 10% 規則。" },
      { qEn: "Keystone species…", qZh: "關鍵物種…",
        opts: [{ en: "Have outsized ecosystem impact", zh: "對生態系影響特大" }, { en: "Are always largest", zh: "總是最大" }, { en: "Do not eat", zh: "不吃東西" }], a: 0,
        hintEn: "e.g. sea otters and kelp forests.", hintZh: "如海獺與海藻林。" },
      { qEn: "Invasive species often…", qZh: "入侵物種通常…",
        opts: [{ en: "Outcompete natives", zh: "勝過本地物種" }, { en: "Help all natives", zh: "幫助所有本地種" }, { en: "Create more oxygen only", zh: "只產生更多氧" }], a: 0,
        hintEn: "No natural predators.", hintZh: "無天然捕食者。" },
      { qEn: "Sustainable fishing means…", qZh: "可持續漁業指…",
        opts: [{ en: "Harvest within regeneration", zh: "在再生能力內捕撈" }, { en: "Catch everything now", zh: "現在捕盡" }, { en: "Ignore quotas", zh: "忽略配額" }], a: 0,
        hintEn: "Long-term stock health.", hintZh: "長期魚群健康。" }
    ];

    const SUMMARY = [
      { en: "Food webs link chains; energy flows one way.", zh: "食物網連結食物鏈；能量單向流動。" },
      { en: "Predator-prey populations oscillate.", zh: "捕食者-獵物族群波動。" },
      { en: "Humans can disrupt or restore balance.", zh: "人類可破壞或恢復平衡。" },
      { en: "HK wetlands = biodiversity hotspots.", zh: "香港濕地 = 生物多樣性熱點。" }
    ];

    const REVIEW = [
      { qEn: "Producers are usually…", qZh: "生產者通常是…",
        opts: [{ en: "Plants", zh: "植物" }, { en: "Lions", zh: "獅子" }, { en: "Fungi only", zh: "只有真菌" }], a: 0 },
      { qEn: "Removing a top predator may cause…", qZh: "移除頂級捕食者可能導致…",
        opts: [{ en: "Prey overpopulation", zh: "獵物過剩" }, { en: "More predators", zh: "更多捕食者" }, { en: "No effect ever", zh: "永無影響" }], a: 0 },
      { qEn: "Food web vs chain:", qZh: "食物網與鏈：",
        opts: [{ en: "Web is interconnected", zh: "網是互相連結" }, { en: "Same thing", zh: "相同" }, { en: "Chain is always bigger", zh: "鏈總是更大" }], a: 0 },
      { qEn: "Conservation protects…", qZh: "保育保護…",
        opts: [{ en: "Habitats and species", zh: "棲地與物種" }, { en: "Only buildings", zh: "只有建築" }, { en: "Pollution", zh: "污染" }], a: 0 },
      { qEn: "Energy between levels is mostly…", qZh: "營養級之間能量多數…",
        opts: [{ en: "Lost as heat", zh: "以熱散失" }, { en: "100% transferred", zh: "100% 轉移" }, { en: "Created new", zh: "新創造" }], a: 0 }
    ];

    function EcosystemLab({ isZh }) {
      const [grass, setGrass] = useState(60);
      const [rabbits, setRabbits] = useState(40);
      const [foxes, setFoxes] = useState(15);
      const t = window.JSLGER.t;
      const health = Math.max(0, Math.min(100, grass * 0.4 + (100 - Math.abs(rabbits - grass * 0.6)) * 0.3 + (100 - Math.abs(foxes - rabbits * 0.25)) * 0.3));
      const status = health > 70 ? t("平衡", "Balanced", isZh) : health > 40 ? t("不穩定", "Unstable", isZh) : t("崩潰風險", "Collapse risk", isZh);
      const colour = health > 70 ? "#16a34a" : health > 40 ? "#d97706" : "#dc2626";
      return (
        <div className="space-y-4">
          <label className="block text-sm font-bold">{t("草量", "Grass")} · {grass}%
            <input type="range" min="0" max="100" value={grass} onChange={e => setGrass(+e.target.value)} className="w-full mt-1" style={{ accentColor: ACCENT }} />
          </label>
          <label className="block text-sm font-bold">{t("兔子", "Rabbits")} · {rabbits}%
            <input type="range" min="0" max="100" value={rabbits} onChange={e => setRabbits(+e.target.value)} className="w-full mt-1" style={{ accentColor: ACCENT }} />
          </label>
          <label className="block text-sm font-bold">{t("狐狸", "Foxes")} · {foxes}%
            <input type="range" min="0" max="100" value={foxes} onChange={e => setFoxes(+e.target.value)} className="w-full mt-1" style={{ accentColor: ACCENT }} />
          </label>
          <div className="p-6 rounded-2xl text-center text-white" style={{ background: colour }}>
            <p className="text-sm opacity-90">{t("生態健康指數", "Ecosystem health index", isZh)}</p>
            <p className="text-4xl font-black">{Math.round(health)}%</p>
            <p className="mt-2 font-semibold">{status}</p>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <Shell
          meta={{ appId: "s3_ecosystem", titleEn: "Ecosystem Balance", titleZh: "生態平衡", unit: "Form 3 · Environment Bridge" }}
          accent={ACCENT} backHref="../index.html"
          learnSteps={LEARN} guidedBank={GUIDED} reviewSummary={SUMMARY} reviewQuiz={REVIEW}
          experiment={p => <EcosystemLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
