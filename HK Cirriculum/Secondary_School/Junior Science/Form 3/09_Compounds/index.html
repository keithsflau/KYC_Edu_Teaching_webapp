<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compounds · 化合物 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #f5f3ff; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>說明化合物有固定組成，和混合物不同。</li><li>知道電解水得到氫和氧約 2:1，而且只可在課室由老師處理。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect } = React;
    const ACCENT = "#5b21b6";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Not elements", titleZh: "不是元素",
    bodyEn: "Many common substances — water, table salt, carbon dioxide — are not elements. They are compounds made from two or more different elements.",
    bodyZh: "許多常見物質——水、食鹽、二氧化碳——不是元素，而是由兩種或以上元素組成的化合物。",
    qEn: "Water (H₂O) is a…", qZh: "水 (H₂O) 是…",
    opts: ["Compound 化合物", "Element 元素", "Mixture 混合物", "Metal alloy 金屬合金"], a: "Compound 化合物",
    why: "Opening distinction PPT Ch3. 第3章開篇區分。" },
  { titleEn: "What is a compound?", titleZh: "甚麼是化合物？",
    bodyEn: "A compound is a substance made up of two or more elements chemically combined in a fixed proportion.",
    bodyZh: "化合物是由兩種或以上的元素以固定比例化學結合而成的物質。",
    qEn: "A compound contains…", qZh: "化合物含有…",
    opts: ["Two or more elements combined 兩種或以上元素結合", "Only one kind of atom 只有一種原子", "Random proportions 隨機比例", "No chemical bonds 沒有化學鍵"], a: "Two or more elements combined 兩種或以上元素結合",
    why: "Definition from teaching slides. 教學簡報定義。" },
  { titleEn: "Experiment 13.4 — Electrolysis", titleZh: "實驗13.4——電解水",
    bodyEn: "Pure water with a little dilute sulphuric acid is electrolysed. After 10 minutes, gases collect in test tubes A (cathode) and B (anode).",
    bodyZh: "這是螢幕上的電解水模型：陰極收集氫、陽極收集氧，體積約 2:1。稀硫酸和可燃的氫氣只由教師在課室處理，不可在家用市電電解食鹽水（會產生氯氣）。",
    qEn: "Electrolysis uses…", qZh: "電解需要…",
    opts: ["Electricity to break down water 電流分解水", "Heat only 只有加熱", "Magnetism 磁力", "Light only 只有光"], a: "Electricity to break down water 電流分解水",
    why: "Exp 13.4 setup from PPT. 簡報實驗裝置。" },
  { titleEn: "Gases collected", titleZh: "收集到的氣體",
    bodyEn: "Tube A: glowing splint relights → oxygen (O₂). Tube B: burning splint gives a 'pop' sound → hydrogen (H₂). Volume ratio H₂ : O₂ ≈ 2 : 1.",
    bodyZh: "試管A：有餘燼木條復燃→氧(O₂)。試管B：燃燒木條爆鳴→氫(H₂)。體積比 H₂:O₂ ≈ 2:1。",
    qEn: "The 'pop' sound indicates…", qZh: "爆鳴聲表示…",
    opts: ["Hydrogen gas 氫氣", "Oxygen gas 氧氣", "Carbon dioxide 二氧化碳", "Nitrogen 氮氣"], a: "Hydrogen gas 氫氣",
    why: "Pop test for H₂ from PPT. 簡報氫氣檢驗。" },
  { titleEn: "Breaking down compounds", titleZh: "分解化合物",
    bodyEn: "Water can be broken down into hydrogen and oxygen by electricity. Compounds can be decomposed by chemical methods, but elements cannot be broken down further by chemical means.",
    bodyZh: "水可被電流分解為氫和氧。化合物可用化學方法分解，但元素不能用化學方法再分解。",
    qEn: "Can elements be broken down chemically?", qZh: "元素能否用化學方法分解？",
    opts: ["No — only compounds can 不能——只有化合物可以", "Yes — all substances 能——所有物質", "Only metals 只有金屬", "Only gases 只有氣體"], a: "No — only compounds can 不能——只有化合物可以",
    why: "Key distinction PPT Ch3. 第3章關鍵區分。" },
  { titleEn: "Common compounds", titleZh: "常見化合物",
    bodyEn: "Water (H₂O) = hydrogen + oxygen. Table salt (NaCl) = sodium + chlorine. Carbon dioxide (CO₂) = carbon + oxygen. Iron sulphide (FeS) forms when iron and sulphur are heated together.",
    bodyZh: "水(H₂O)=氫+氧。食鹽(NaCl)=鈉+氯。二氧化碳(CO₂)=碳+氧。鐵與硫加熱生成硫化鐵(II)(FeS)。",
    qEn: "NaCl contains the elements…", qZh: "NaCl 含有元素…",
    opts: ["Sodium and chlorine 鈉和氯", "Sodium only 只有鈉", "Nitrogen and oxygen 氮和氧", "Iron and sulphur 鐵和硫"], a: "Sodium and chlorine 鈉和氯",
    why: "Constituent elements from PPT. 簡報成分元素。" },
];
const GUIDED = [
  { qEn: "A compound has a…", qZh: "化合物有…",
    opts: ["Fixed composition 固定成分", "Random composition 隨機成分", "No elements 沒有元素", "Only one element 只有一種元素"], a: "Fixed composition 固定成分",
    hint: "Fixed ratio of elements. 元素固定比例。" },
  { qEn: "O₂ relights a glowing splint because it is…", qZh: "O₂使餘燼木條復燃，因為是…",
    opts: ["Oxygen (supports combustion) 氧（助燃）", "Hydrogen 氫", "Carbon dioxide 二氧化碳", "Nitrogen 氮"], a: "Oxygen (supports combustion) 氧（助燃）",
    hint: "Tube A test from Exp 13.4. 實驗13.4試管A。" },
  { qEn: "Water is a compound of…", qZh: "水是…的化合物",
    opts: ["Hydrogen and oxygen 氫和氧", "Hydrogen only 只有氫", "Oxygen only 只有氧", "Sodium and chlorine 鈉和氯"], a: "Hydrogen and oxygen 氫和氧",
    hint: "H₂O formula. 化學式 H₂O。" },
  { qEn: "Heating iron + sulphur produces…", qZh: "加熱鐵+硫生成…",
    opts: ["Iron(II) sulphide (compound) 硫化鐵(II)（化合物）", "Pure iron only 只有純鐵", "A mixture only 只是混合物", "An element 一種元素"], a: "Iron(II) sulphide (compound) 硫化鐵(II)（化合物）",
    hint: "Fe + S → FeS from PPT. 簡報 Fe+S→FeS。" },
];
const SUMMARY = [
  { en: "A compound is made of two or more elements chemically combined in fixed proportions.", zh: "化合物由兩種或以上元素以固定比例化學結合而成。" },
  { en: "Electrolysis of water (Exp 13.4) produces H₂ (pop sound) and O₂ (relights splint) in a 2:1 volume ratio.", zh: "電解水產生氫和氧，體積比約 2:1。氫氣可燃，只可在教師示範中檢驗。" },
  { en: "Compounds can be broken down by chemical methods; elements cannot.", zh: "化合物可用化學方法分解；元素不能。" },
  { en: "Common compounds: H₂O, NaCl, CO₂, FeS — each has a specific chemical formula.", zh: "常見化合物：H₂O、NaCl、CO₂、FeS——各有特定化學式。" },
];
const REVIEW = [
  { qEn: "H₂O is a…", qZh: "H₂O 是…",
    opts: ["Compound 化合物", "Element 元素", "Mixture 混合物", "Alloy 合金"], a: "Compound 化合物" },
  { qEn: "Gas with 'pop' sound is…", qZh: "爆鳴聲的氣體是…",
    opts: ["Hydrogen 氫", "Oxygen 氧", "Chlorine 氯", "Helium 氦"], a: "Hydrogen 氫" },
  { qEn: "H₂ : O₂ volume ratio from electrolysis is…", qZh: "電解水 H₂:O₂ 體積比是…",
    opts: ["2 : 1 2:1", "1 : 1 1:1", "1 : 2 1:2", "3 : 1 3:1"], a: "2 : 1 2:1" },
  { qEn: "Elements CANNOT be broken down by…", qZh: "元素不能用…分解",
    opts: ["Chemical methods 化學方法", "Nuclear reactions 核反應", "Physical crushing 物理粉碎", "Heating to high temperature 高溫加熱"], a: "Chemical methods 化學方法" },
  { qEn: "NaCl is made of…", qZh: "NaCl 由…組成",
    opts: ["Na and Cl 鈉和氯", "Na and O 鈉和氧", "N and Cl 氮和氯", "Na and H 鈉和氫"], a: "Na and Cl 鈉和氯" },
];

function ExperimentLab({ isZh, accent }) {
  const [on, setOn] = useState(false);
  const [tSec, setTSec] = useState(0);
  const t = window.JSLGER.t;
  useEffect(() => {
    if (!on) return;
    const id = setInterval(() => setTSec(s => Math.min(600, s + 15)), 200);
    return () => clearInterval(id);
  }, [on]);
  useEffect(() => { if (!on) setTSec(0); }, [on]);
  const hVol = Math.round((tSec / 600) * 200);
  const oVol = Math.round(hVol / 2);
  const pct = Math.round((tSec / 600) * 100);
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("開啟電源，觀察 H₂ 和 O₂ 在陰/陽極的體積比 2:1。", "Turn on power; observe H₂ and O₂ volumes at cathode/anode — ratio 2:1.", isZh)}</p>
      <button type="button" onClick={() => setOn(!on)} className="w-full px-4 py-3 rounded-xl text-white font-bold min-h-[48px]" style={{ background: on ? "#dc2626" : accent }}>
        {on ? t("關閉電源","Turn OFF power",isZh) : t("開啟電源（電解）","Turn ON power (electrolysis)",isZh)}
      </button>
      <div className="w-full bg-slate-200 rounded-full h-2"><div className="h-2 rounded-full transition-all" style={{ width: pct + "%", background: accent }} /></div>
      <p className="text-xs text-center text-slate-500">{t("時間","Time",isZh)}: {Math.round(tSec/60)} min · {pct}%</p>
      <svg viewBox="0 0 280 200" className="w-full max-w-sm mx-auto">
        <rect x="90" y="10" width="100" height="50" rx="6" fill="#dbeafe" stroke={accent} strokeWidth="2" />
        <text x="140" y="40" textAnchor="middle" fontSize="11" fill="#334155">{t("電解池 H₂O + H₂SO₄","Cell: H₂O + H₂SO₄",isZh)}</text>
        <line x1="140" y1="60" x2="80" y2="120" stroke={accent} strokeWidth="2" />
        <line x1="140" y1="60" x2="200" y2="120" stroke={accent} strokeWidth="2" />
        <rect x="50" y="120" width="60" height="70" rx="4" fill="white" stroke={accent} strokeWidth="2" />
        <rect x="50" y={190 - oVol*0.25} width="60" height={oVol*0.25} fill="#93c5fd" opacity="0.7" />
        <text x="80" y="115" textAnchor="middle" fontSize="10" fontWeight="bold" fill={accent}>A · O₂</text>
        <rect x="170" y="120" width="60" height="70" rx="4" fill="white" stroke={accent} strokeWidth="2" />
        <rect x="170" y={190 - hVol*0.25} width="60" height={hVol*0.25} fill="#c4b5fd" opacity="0.8" />
        <text x="200" y="115" textAnchor="middle" fontSize="10" fontWeight="bold" fill={accent}>B · H₂</text>
        {on && hVol > 20 && <text x="200" y="145" textAnchor="middle" fontSize="9" fill="#7c3aed">{t("爆鳴!","Pop!",isZh)}</text>}
        {on && oVol > 10 && <text x="80" y="145" textAnchor="middle" fontSize="9" fill="#2563eb">{t("復燃","Relights",isZh)}</text>}
      </svg>
      <div className="grid grid-cols-2 gap-2 text-center text-sm">
        <div className="p-3 rounded-xl bg-blue-50 border border-blue-200">
          <p className="font-bold text-blue-700">O₂ (A)</p>
          <p className="text-2xl font-black">{oVol}</p>
          <p className="text-xs text-slate-500">{t("復燃木條","Glowing splint relights",isZh)}</p>
        </div>
        <div className="p-3 rounded-xl bg-violet-50 border border-violet-200">
          <p className="font-bold text-violet-700">H₂ (B)</p>
          <p className="text-2xl font-black">{hVol}</p>
          <p className="text-xs text-slate-500">{t("爆鳴聲","Pop sound",isZh)}</p>
        </div>
      </div>
      {hVol > 0 && oVol > 0 && <p className="text-center text-sm font-bold" style={{ color: accent }}>H₂ : O₂ = {hVol} : {oVol} ≈ 2 : 1</p>}
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_compounds", titleEn: "Compounds", titleZh: "化合物", unit: "Form 3 · Book 13 Matter" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
