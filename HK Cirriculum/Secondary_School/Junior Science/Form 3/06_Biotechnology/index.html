<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>舉出利用生物製造食品或藥物的例子。</li><li>分別說出利益和風險，不把倫理問題收成口號。</li></ul></aside>

    why: "Definition from PPT Ch6. 第6章定義。" },
  { titleEn: "GM food", titleZh: "基因改造食物",

    why: "GM food application in PPT. 簡報GM食物應用。" },
  { titleEn: "Insulin production", titleZh: "胰島素生產",
    bodyEn: "Genetically modified E. coli bacteria carrying human insulin DNA can produce large amounts of human insulin for diabetes treatment.",
    bodyZh: "載有人類胰島素DNA的基因改造大腸桿菌可大量生產人類胰島素，用於治療糖尿病。",
    qEn: "Modern insulin is produced using…", qZh: "現代胰島素利用…生產",

    qEn: "Genetic testing detects…", qZh: "基因檢測可偵測…",
    opts: ["DNA mutations  DNA突變", "Sound waves 聲波", "Light reflection 光的反射", "Metal reactivity 金屬活性"], a: "DNA mutations  DNA突變",

    qEn: "Pathogens can be identified by detecting their…", qZh: "可透過檢測病原體的…來鑑定",
    opts: ["Unique DNA or proteins 獨特DNA或蛋白質", "Body mass index 身體質量指數", "Food pyramid level 食物金字塔層級", "Mirror image 鏡中影像"], a: "Unique DNA or proteins 獨特DNA或蛋白質",
    why: "Pathogen ID from PPT. 簡報病原體鑑定。" },
  { titleEn: "Benefits and ethics", titleZh: "效益與倫理",
    bodyEn: "Biotechnology offers benefits (medicine, food) but raises ethical questions about GM food safety and genetic privacy.",
    bodyZh: "生物工程帶來益處（醫藥、食物），亦引發關於基因改造食物安全和基因私隱的倫理問題。",
    qEn: "Using GM bacteria for insulin…", qZh: "用改造細菌生產胰島素…",
    opts: ["Reduces cost and allergy risk vs animal insulin 較動物胰島素成本低且過敏風險低", "Is slower and more expensive 更慢更貴", "Has no medical use 沒有醫學用途", "Destroys all bacteria globally 消滅全球細菌"], a: "Reduces cost and allergy risk vs animal insulin 較動物胰島素成本低且過敏風險低",
    why: "Insulin comparison in PPT. 簡報胰島素比較。" },
];
const GUIDED = [
  { qEn: "Biotechnology involves…", qZh: "生物工程涉及…",

const SUMMARY = [
  { en: "Biotechnology is the use of living organisms or biological processes to make useful products or develop new technologies.", zh: "生物工程是指利用生物或生物過程，來製造產品或發展新的技術。" },
  { en: "GM food is produced by changing the genetic materials of crops or livestock to give desirable traits — e.g. herbicide-resistant soya beans.", zh: "基因改造食物透過改變農作物或牲畜的遺傳物質以獲得理想特性，例如抗除草劑大豆。" },
  { en: "Genetically modified E. coli bacteria carrying human insulin DNA can produce large amounts of human insulin for diabetes treatment.", zh: "載有人類胰島素DNA的基因改造大腸桿菌可大量生產人類胰島素，用於治療糖尿病。" },
  { en: "Biotechnology can test for DNA mutations in blood or cell samples — e.g. detecting Down syndrome in a foetus from the mother's blood.", zh: "生物工程可從血液或細胞樣本檢測DNA突變，例如從孕婦血液檢測胎兒是否患有唐氏綜合症。" },
];
const REVIEW = [
  { qEn: "Biotechnology involves…", qZh: "生物工程涉及…",
    opts: ["Living organisms or biological processes 生物或生物過程", "Only mechanical machines 只有機械", "Chemical explosives only 只有化學爆炸物", "Non-living plastics only 只有非生物塑膠"], a: "Living organisms or biological processes 生物或生物過程" },
  { qEn: "GM crops are modified to…", qZh: "基因改造作物被改造以…",
    opts: ["Give desirable traits 獲得理想特性", "Remove all DNA 移除所有DNA", "Stop photosynthesis 停止光合作用", "Eliminate all proteins 消除所有蛋白質"], a: "Give desirable traits 獲得理想特性" },
  { qEn: "Modern insulin is produced using…", qZh: "現代胰島素利用…生產",
    opts: ["GM bacteria with human insulin DNA 含人類胰島素DNA的改造細菌", "Only coal mining 只有採煤", "Glass manufacture 製造玻璃", "Metal smelting 冶煉金屬"], a: "GM bacteria with human insulin DNA 含人類胰島素DNA的改造細菌" },
  { qEn: "Genetic testing detects…", qZh: "基因檢測可偵測…",
    opts: ["DNA mutations  DNA突變", "Sound waves 聲波", "Light reflection 光的反射", "Metal reactivity 金屬活性"], a: "DNA mutations  DNA突變" },
  { qEn: "Pathogens can be identified by detecting their…", qZh: "可透過檢測病原體的…來鑑定",
    opts: ["Unique DNA or proteins 獨特DNA或蛋白質", "Body mass index 身體質量指數", "Food pyramid level 食物金字塔層級", "Mirror image 鏡中影像"], a: "Unique DNA or proteins 獨特DNA或蛋白質" },
];


function ExperimentLab({ isZh, accent }) {
  const branches = [
    { id: "gm", zh: "基因改造食物", en: "GM food", detailZh: "抗除草劑大豆、快速生長三文魚", detailEn: "Herbicide-resistant soya; fast-growing salmon" },
    { id: "ferment", zh: "發酵工業", en: "Fermentation", detailZh: "利用微生物製造乳酪、啤酒", detailEn: "Microbes make yoghurt, beer" },
    { id: "medicine", zh: "醫學應用", en: "Medicine", detailZh: "改造大腸桿菌生產人類胰島素", detailEn: "GM E. coli produces human insulin" },
  ];
  const [branch, setBranch] = useState("gm");
  const [benefit, setBenefit] = useState(60);
  const [risk, setRisk] = useState(30);
  const t = window.JSLGER.t;
  const b = branches.find(x => x.id === branch);
  const score = Math.round(benefit - risk * 0.5);
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("選擇生物科技分支，平衡效益與風險。", "Choose a biotech branch; balance benefits vs risks.", isZh)}</p>
      <div className="flex flex-wrap gap-2">{branches.map(br => (
        <button key={br.id} type="button" onClick={() => setBranch(br.id)} className={"px-3 py-2 rounded-lg text-sm min-h-[44px] " + (branch===br.id?"text-white font-bold":"bg-slate-100")} style={branch===br.id?{background:accent}:{}}>{t(br.zh, br.en, isZh)}</button>
      ))}</div>
      <p className="text-sm text-center text-slate-600">{t(b.detailZh, b.detailEn, isZh)}</p>
      <label className="block text-sm font-semibold">{t("效益","Benefits")}: {benefit}</label>
      <input type="range" min="0" max="100" value={benefit} onChange={e => setBenefit(+e.target.value)} className="w-full" style={{accentColor:accent}} />
      <label className="block text-sm font-semibold">{t("風險/倫理顧慮","Risks/ethics")}: {risk}</label>
      <input type="range" min="0" max="100" value={risk} onChange={e => setRisk(+e.target.value)} className="w-full" />
      <p className="font-bold text-center" style={{color:accent}}>{t("淨評估","Net assessment")}: {score > 30 ? t("值得討論採用","Worth adopting with care",isZh) : t("需更多研究","Needs more research",isZh)}</p>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_biotechnology", titleEn: "Biotechnology", titleZh: "生物科技", unit: "Form 3 · Book 12 Health & Biotechnology" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
