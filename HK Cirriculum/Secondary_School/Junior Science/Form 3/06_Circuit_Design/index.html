<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuit Design · 電路設計 | S3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #fffbeb; }</style>
  <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#d97706";
    const { Shell } = window.JSLGER;

    const LEARN = [
      { titleEn: "Series vs parallel", titleZh: "串聯與並聯",
        bodyEn: "Series: one path — one break stops all. Parallel: branches — each lamp has own path.",
        bodyZh: "串聯：單一路徑——一處斷開全停。並聯：支路——每盞燈有獨立路徑。",
        qEn: "Home lights are usually wired in…", qZh: "家居電燈通常以…連接",
        opts: [{ en: "Parallel", zh: "並聯" }, { en: "Series only", zh: "只有串聯" }, { en: "No wires", zh: "無電線" }], a: 0,
        whyEn: "Independent switching.", whyZh: "可獨立開關。" },
      { titleEn: "Ohm's law review", titleZh: "歐姆定律複習",
        bodyEn: "V = IR. For fixed voltage, more resistance → less current.",
        bodyZh: "V = IR。電壓固定時，電阻越大 → 電流越小。",
        qEn: "Double resistance at same V → current…", qZh: "電壓不變，電阻加倍 → 電流…",
        opts: [{ en: "Halves", zh: "減半" }, { en: "Doubles", zh: "加倍" }, { en: "Unchanged", zh: "不變" }], a: 0,
        whyEn: "I = V/R.", whyZh: "I = V/R。" },
      { titleEn: "Power and energy", titleZh: "功率與能量",
        bodyEn: "P = VI (watts). Energy E = Pt. High power devices use more electricity per second.",
        bodyZh: "P = VI（瓦特）。能量 E = Pt。高功率電器每秒用更多電。",
        qEn: "1000 W kettle vs 100 W lamp for 1 h — which uses more energy?", qZh: "1000 W 電壺與 100 W 燈用 1 小時——哪個用更多電？",
        opts: [{ en: "Kettle", zh: "電壺" }, { en: "Lamp", zh: "燈" }, { en: "Same", zh: "相同" }], a: 0,
        whyEn: "E = P×t.", whyZh: "E = P×t。" },
      { titleEn: "Design constraints", titleZh: "設計限制",
        bodyEn: "Choose wire gauge, fuse rating, and layout for safety — avoid overload and short circuits.",
        bodyZh: "選擇線徑、保險絲額定和佈局以保安全——避免過載和短路。",
        qEn: "Fuse protects by…", qZh: "保險絲靠…保護",
        opts: [{ en: "Melting when current too high", zh: "電流過大時熔斷" }, { en: "Increasing voltage", zh: "升高電壓" }, { en: "Storing charge forever", zh: "永遠儲電" }], a: 0,
        whyEn: "Breaks circuit on overload.", whyZh: "過載時斷開電路。" },
      { titleEn: "HK domestic supply", titleZh: "香港家居供電",
        bodyEn: "HK mains ~220 V AC. Earth wire, RCCB, and proper plugs reduce shock risk.",
        bodyZh: "香港市電約 220 V 交流。地線、漏电保護裝置和正確插頭減少觸電風險。",
        qEn: "RCCB detects…", qZh: "漏电保護裝置檢測…",
        opts: [{ en: "Current leakage to earth", zh: "漏電至地" }, { en: "Colour of wire only", zh: "只有電線顏色" }, { en: "Light brightness", zh: "燈光亮度" }], a: 0,
        whyEn: "Trips before dangerous shock.", whyZh: "在危險觸電前跳閘。" },
      { titleEn: "Circuit builder", titleZh: "電路構建器",
        bodyEn: "Toggle series/parallel and switches to light bulbs correctly.",
        bodyZh: "切換串聯/並聯和開關，正確點亮燈泡。",
        qEn: "Parallel: one lamp off, others…", qZh: "並聯：一盞燈熄，其他…",
        opts: [{ en: "Can still work", zh: "仍可亮" }, { en: "All must off", zh: "全部必須熄" }, { en: "Explode", zh: "爆炸" }], a: 0,
        whyEn: "Independent branches.", whyZh: "獨立支路。" }
    ];

    const GUIDED = [
      { qEn: "Series current is…", qZh: "串聯電流…",
        opts: [{ en: "Same everywhere", zh: "各處相同" }, { en: "Zero always", zh: "總是零" }, { en: "Different in each lamp magically", zh: "每燈神奇地不同" }], a: 0,
        hintEn: "Single loop.", hintZh: "單一回路。" },
      { qEn: "Parallel voltage across branches…", qZh: "並聯支路電壓…",
        opts: [{ en: "Same as supply", zh: "與電源相同" }, { en: "Always zero", zh: "總是零" }, { en: "Adds up infinitely", zh: "無限相加" }], a: 0,
        hintEn: "Common rails.", hintZh: "共用電源線。" },
      { qEn: "Short circuit is dangerous because…", qZh: "短路危險因為…",
        opts: [{ en: "Very high current", zh: "電流極大" }, { en: "No current", zh: "無電流" }, { en: "Voltage becomes zero always safe", zh: "電壓變零總是安全" }], a: 0,
        hintEn: "Low resistance path.", hintZh: "低電阻路徑。" },
      { qEn: "LED needs…", qZh: "LED 需要…",
        opts: [{ en: "Correct polarity", zh: "正確極性" }, { en: "AC only always", zh: "總是只要交流" }, { en: "No resistor ever", zh: "永不需要電阻" }], a: 0,
        hintEn: "Diode direction matters.", hintZh: "二極管方向重要。" }
    ];

    const SUMMARY = [
      { en: "Series: one path; parallel: branches.", zh: "串聯：單路；並聯：支路。" },
      { en: "V = IR; P = VI; E = Pt.", zh: "V = IR；P = VI；E = Pt。" },
      { en: "Fuses, earth, RCCB for safety.", zh: "保險絲、地線、漏电保護裝置保安全。" },
      { en: "Design for HK 220 V domestic use.", zh: "為香港 220 V 家居用電設計。" }
    ];

    const REVIEW = [
      { qEn: "Home wiring is mainly…", qZh: "家居佈線主要是…",
        opts: [{ en: "Parallel", zh: "並聯" }, { en: "Series", zh: "串聯" }, { en: "Wireless", zh: "無線" }], a: 0 },
      { qEn: "12 V battery, 4 Ω → I = …", qZh: "12 V 電池，4 Ω → I = …",
        opts: ["3 A", "48 A", "0.33 A"], a: 0 },
      { qEn: "Higher power means…", qZh: "功率越高表示…",
        opts: [{ en: "More energy per second", zh: "每秒更多能量" }, { en: "Less current always", zh: "總是較小電流" }, { en: "No heat", zh: "無熱" }], a: 0 },
      { qEn: "Overload can cause…", qZh: "過載可導致…",
        opts: [{ en: "Overheating/fire risk", zh: "過熱/火災風險" }, { en: "More safety", zh: "更安全" }, { en: "Free electricity", zh: "免費電" }], a: 0 },
      { qEn: "Earth wire connects casing to…", qZh: "地線將外殼連至…",
        opts: [{ en: "Ground", zh: "大地" }, { en: "Live only", zh: "只有火線" }, { en: "Sky", zh: "天空" }], a: 0 }
    ];

    function CircuitLab({ isZh }) {
      const [mode, setMode] = useState("parallel");
      const [sw1, setSw1] = useState(true);
      const [sw2, setSw2] = useState(true);
      const t = window.JSLGER.t;
      const lit1 = mode === "series" ? (sw1 && sw2) : sw1;
      const lit2 = mode === "series" ? (sw1 && sw2) : sw2;
      return (
        <div className="space-y-4">
          <div className="flex gap-2">
            <button type="button" onClick={() => setMode("series")} className={"px-4 py-2 rounded-xl font-bold min-h-[44px] " + (mode === "series" ? "text-white" : "bg-slate-100")} style={mode === "series" ? { background: ACCENT } : {}}>{t("串聯", "Series", isZh)}</button>
            <button type="button" onClick={() => setMode("parallel")} className={"px-4 py-2 rounded-xl font-bold min-h-[44px] " + (mode === "parallel" ? "text-white" : "bg-slate-100")} style={mode === "parallel" ? { background: ACCENT } : {}}>{t("並聯", "Parallel", isZh)}</button>
          </div>
          <div className="flex justify-center gap-8 py-6">
            <div className="text-center">
              <button type="button" onClick={() => setSw1(!sw1)} className={"block mb-2 px-3 py-2 rounded-lg text-sm font-semibold " + (sw1 ? "bg-emerald-500 text-white" : "bg-slate-200")}>{t("開關 1", "SW1", isZh)}</button>
              <i className={"fa-solid fa-lightbulb text-5xl " + (lit1 ? "text-yellow-400" : "text-slate-300")} />
            </div>
            <div className="text-center">
              <button type="button" onClick={() => setSw2(!sw2)} className={"block mb-2 px-3 py-2 rounded-lg text-sm font-semibold " + (sw2 ? "bg-emerald-500 text-white" : "bg-slate-200")}>{t("開關 2", "SW2", isZh)}</button>
              <i className={"fa-solid fa-lightbulb text-5xl " + (lit2 ? "text-yellow-400" : "text-slate-300")} />
            </div>
          </div>
          <p className="text-sm text-center text-slate-600">{mode === "series" ? t("串聯：兩開關都閉合才全亮", "Series: both switches on for both bulbs", isZh) : t("並聯：各燈獨立控制", "Parallel: each lamp independent", isZh)}</p>
        </div>
      );
    }

    function App() {
      return (
        <Shell
          meta={{ appId: "s3_circuit_design", titleEn: "Circuit Design Challenge", titleZh: "電路設計挑戰", unit: "Form 3 · Electricity Bridge" }}
          accent={ACCENT} backHref="../index.html"
          learnSteps={LEARN} guidedBank={GUIDED} reviewSummary={SUMMARY} reviewQuiz={REVIEW}
          experiment={p => <CircuitLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
