<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alloys & Materials · 合金與物料 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #fafaf9; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#57534e";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Modern materials", titleZh: "現代材料",
    bodyEn: "Many objects today are made from modern materials — alloys and plastics — rather than pure metals or stone.",
    bodyZh: "現今許多物件由現代材料——合金和塑膠——製成，而非純金屬或石頭。",
    qEn: "Modern building frames often use…", qZh: "現代建築支架常用…",
    opts: ["Steel (alloy) 鋼（合金）", "Pure gold 純金", "Pure sulphur 純硫", "Distilled water 蒸餾水"], a: "Steel (alloy) 鋼（合金）",
    why: "Opening from PPT Ch5. 第5章開篇。" },
  { titleEn: "What is an alloy?", titleZh: "甚麼是合金？",
    bodyEn: "An alloy is a mixture of a metal and one or a few other elements (which may be metals or non-metals).",
    bodyZh: "合金由金屬與一種或多種其他元素（可以是金屬或非金屬）混合而成。",
    qEn: "An alloy is…", qZh: "合金是…",
    opts: ["Metal + other element(s) 金屬+其他元素", "Pure metal only 只有純金屬", "Only non-metals 只有非金屬", "A compound with fixed formula 固定化學式的化合物"], a: "Metal + other element(s) 金屬+其他元素",
    why: "Definition from teaching slides. 教學簡報定義。" },
  { titleEn: "Making alloys", titleZh: "製造合金",
    bodyEn: "Alloys are usually made by heating the metal and other elements together until they melt and mix. The mixture solidifies on cooling.",
    bodyZh: "合金通常把金屬和其他元素一起加熱至熔化混合，冷卻後凝固成合金。",
    qEn: "Alloys are made by…", qZh: "合金由…製成",
    opts: ["Melting and mixing elements 熔化並混合元素", "Only crushing rocks 只有粉碎岩石", "Freezing water 冰凍水", "Burning wood 燃燒木材"], a: "Melting and mixing elements 熔化並混合元素",
    why: "Manufacturing from PPT. 簡報製造方法。" },
  { titleEn: "Steel", titleZh: "鋼",
    bodyEn: "Steel is an alloy of iron (~95% iron + ~5% carbon). It is stronger and harder than pure iron, widely used for building frames and bridges.",
    bodyZh: "鋼是鐵的合金（約95%鐵+5%碳）。比純鐵更堅硬，廣泛用於建築支架和橋樑。",
    qEn: "Steel is stronger than pure iron because…", qZh: "鋼比純鐵更堅硬，因為…",
    opts: ["Carbon is mixed in (alloy) 混合了碳（合金）", "It contains only iron 只含鐵", "It is a compound 是化合物", "It has no carbon 不含碳"], a: "Carbon is mixed in (alloy) 混合了碳（合金）",
    why: "Steel composition from PPT. 簡報鋼的成分。" },
  { titleEn: "Stainless steel & brass", titleZh: "不銹鋼與黃銅",
    bodyEn: "Stainless steel (~70% Fe, ~20% Cr, ~9.5% Ni, ~0.5% C) resists corrosion — used for cooking utensils and surgical tools. Brass is an alloy of copper and zinc.",
    bodyZh: "不銹鋼（約70%鐵、20%鉻、9.5%鎳、0.5%碳）抗腐蝕——用於煮食用具和手術工具。黃銅是銅和鋅的合金。",
    qEn: "Stainless steel is used for surgical tools because it…", qZh: "不銹鋼用於手術工具，因為…",
    opts: ["Resists corrosion 抗腐蝕", "Is softer than pure iron 比純鐵更軟", "Conducts no heat 不導熱", "Melts at room temperature 室溫下熔化"], a: "Resists corrosion 抗腐蝕",
    why: "Stainless steel uses from PPT. 不銹鋼用途。" },
  { titleEn: "Alloys vs pure metals", titleZh: "合金 vs 純金屬",
    bodyEn: "Alloys usually have more useful properties than any single constituent metal — e.g. bronze (Cu+Sn) is harder than copper; carat gold is harder and shinier than pure gold.",
    bodyZh: "合金的性質通常比任何單一成分金屬更優越——如青銅(Cu+Sn)比銅更硬；K金比純金更堅硬及有光澤。",
    qEn: "Alloys generally have…", qZh: "合金通常有…",
    opts: ["Better properties than pure metals 比純金屬更優越的性質", "Worse properties always 永遠更差的性質", "Same properties only 只有相同性質", "No practical uses 沒有實際用途"], a: "Better properties than pure metals 比純金屬更優越的性質",
    why: "Comparison from PPT Ch5. 第5章比較。" },
];
const GUIDED = [
  { qEn: "Brass contains…", qZh: "黃銅含有…",
    opts: ["Copper and zinc 銅和鋅", "Iron and carbon 鐵和碳", "Gold and silver 金銀", "Aluminium only 只有鋁"], a: "Copper and zinc 銅和鋅",
    hint: "Brass = Cu + Zn from PPT. 黃銅 = 銅+鋅。" },
  { qEn: "Steel is mainly…", qZh: "鋼主要是…",
    opts: ["Iron + carbon 鐵+碳", "Copper + tin 銅+錫", "Sodium + chlorine 鈉+氯", "Hydrogen + oxygen 氫+氧"], a: "Iron + carbon 鐵+碳",
    hint: "~95% Fe, ~5% C. 約95%鐵、5%碳。" },
  { qEn: "Bronze statues are hard and resist corrosion because bronze is…", qZh: "青銅雕像堅硬抗腐蝕，因為青銅是…",
    opts: ["An alloy (Cu + Sn) 合金（銅+錫）", "Pure copper 純銅", "A plastic 塑膠", "A gas 氣體"], a: "An alloy (Cu + Sn) 合金（銅+錫）",
    hint: "Bronze properties from PPT. 簡報青銅性質。" },
  { qEn: "Plastics are made from…", qZh: "塑膠來自…",
    opts: ["Crude oil 原油", "Pure gold 純金", "Stone only 只有石頭", "Distilled water 蒸餾水"], a: "Crude oil 原油",
    hint: "Modern materials section PPT. 第5章現代材料。" },
];
const SUMMARY = [
  { en: "An alloy = metal + one or more other elements, made by melting and mixing.", zh: "合金 = 金屬 + 一種或多種其他元素，由熔化混合製成。" },
  { en: "Steel (~95% Fe + 5% C) is stronger than iron; used in buildings and bridges.", zh: "鋼（約95%鐵+5%碳）比鐵更堅硬；用於建築和橋樑。" },
  { en: "Stainless steel resists corrosion; brass (Cu+Zn) and bronze (Cu+Sn) are common alloys.", zh: "不銹鋼抗腐蝕；黃銅(Cu+Zn)和青銅(Cu+Sn)是常見合金。" },
  { en: "Alloys usually have better properties than pure constituent metals.", zh: "合金的性質通常比成分純金屬更優越。" },
];
const REVIEW = [
  { qEn: "An alloy is…", qZh: "合金是…",
    opts: ["Metal mixed with other element(s) 金屬與其他元素混合", "Pure element 純元素", "Only a compound 只是化合物", "Only a gas 只是氣體"], a: "Metal mixed with other element(s) 金屬與其他元素混合" },
  { qEn: "Steel contains mainly…", qZh: "鋼主要含…",
    opts: ["Iron and carbon 鐵和碳", "Copper and zinc 銅和鋅", "Gold and silver 金銀", "Hydrogen and oxygen 氫氧"], a: "Iron and carbon 鐵和碳" },
  { qEn: "Stainless steel is used for cooking utensils because it…", qZh: "不銹鋼用於煮食用具，因為…",
    opts: ["Resists corrosion 抗腐蝕", "Is very soft 非常軟", "Is transparent 透明", "Floats on water 浮在水面"], a: "Resists corrosion 抗腐蝕" },
  { qEn: "Brass is an alloy of…", qZh: "黃銅是…的合金",
    opts: ["Copper and zinc 銅和鋅", "Iron and carbon 鐵和碳", "Tin and lead 錫和鉛", "Sodium and chlorine 鈉和氯"], a: "Copper and zinc 銅和鋅" },
  { qEn: "Compared to pure iron, steel is…", qZh: "與純鐵相比，鋼…",
    opts: ["Stronger and harder 更堅硬", "Softer and weaker 更軟更弱", "Identical 完全相同", "A non-metal 是非金屬"], a: "Stronger and harder 更堅硬" },
];

const RECIPES = {
  pure: { zh: "純鐵", en: "Pure iron", strength: 4, hardness: 3, corr: 2 },
  steel: { zh: "鋼 (Fe+C)", en: "Steel (Fe+C)", strength: 8, hardness: 8, corr: 3 },
  stainless: { zh: "不銹鋼 (Fe+Cr+Ni)", en: "Stainless steel", strength: 7, hardness: 7, corr: 9 },
  brass: { zh: "黃銅 (Cu+Zn)", en: "Brass (Cu+Zn)", strength: 6, hardness: 5, corr: 6 },
  bronze: { zh: "青銅 (Cu+Sn)", en: "Bronze (Cu+Sn)", strength: 7, hardness: 7, corr: 7 },
};

function ExperimentLab({ isZh, accent }) {
  const [mix, setMix] = useState("steel");
  const t = window.JSLGER.t;
  const r = RECIPES[mix];
  const bar = (v, zh, en) => (
    <div key={en} className="flex items-center gap-2 text-xs">
      <span className="w-20 text-slate-500">{t(zh, en, isZh)}</span>
      <div className="flex-1 bg-slate-200 rounded-full h-4"><div className="h-4 rounded-full transition-all" style={{ width: v*10+"%", background: accent }} /></div>
      <span className="w-4 font-bold">{v}</span>
    </div>
  );
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("選擇合金配方，比較強度、硬度和抗腐蝕性。", "Select an alloy recipe; compare strength, hardness and corrosion resistance.", isZh)}</p>
      <div className="grid grid-cols-2 gap-2">
        {Object.entries(RECIPES).map(([k, v]) => (
          <button key={k} type="button" onClick={() => setMix(k)} className={"p-3 rounded-xl border text-xs font-bold min-h-[48px] " + (mix === k ? "text-white" : "bg-white text-slate-700")}
            style={mix === k ? { background: accent, borderColor: accent } : { borderColor: "#e7e5e4" }}>{t(v.zh, v.en, isZh)}</button>
        ))}
      </div>
      <svg viewBox="0 0 240 80" className="w-full max-w-xs mx-auto">
        <rect x="20" y="20" width="200" height="40" rx="8" fill={accent} opacity="0.15" stroke={accent} strokeWidth="2" />
        <text x="120" y="45" textAnchor="middle" fontSize="13" fontWeight="bold" fill={accent}>{t(r.zh, r.en, isZh)}</text>
      </svg>
      <div className="p-4 rounded-2xl bg-white border-2 space-y-3" style={{ borderColor: accent }}>
        {bar(r.strength, "強度", "Strength")}
        {bar(r.hardness, "硬度", "Hardness")}
        {bar(r.corr, "抗腐蝕", "Corrosion resistance")}
      </div>
      <p className="text-xs text-center text-slate-500">{t("合金通常比純金屬有更優越的綜合性質。","Alloys usually outperform pure metals overall.",isZh)}</p>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_alloys_materials", titleEn: "Alloys & Materials", titleZh: "合金與物料", unit: "Form 3 · Book 13 Matter" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
