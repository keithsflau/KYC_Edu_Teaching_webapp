<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refraction of Light · 光的折射 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #fffbeb; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>說明光進入玻璃會偏向法線，因為速度變慢。</li><li>解釋水看起來較淺是視深。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#f59e0b";
    const { Shell } = window.JSLGER;
    const N_GLASS = 1.5;

const LEARN = [
  { titleEn: "What is refraction?", titleZh: "甚麼是折射？",
    bodyEn: "When a light ray travels from one medium to another at an angle with the normal, it bends at the boundary. This is refraction of light.",
    bodyZh: "當光線由一種介質進入另一種介質（以傾斜角度），會在兩種介質之間的界面改變方向，即光的折射。",
    qEn: "Part of a glass rod in water looks bent because of…", qZh: "水中玻璃棒看似彎曲因…",
    opts: ["Refraction 折射", "Reflection only 只有反射", "Shadow formation 形成影子", "Magnetism 磁性"], a: "Refraction 折射",
    why: "Light speed changes at air-glass boundary. 光在氣-玻璃界面速度改變。" },
  { titleEn: "Air to glass", titleZh: "空氣到玻璃",
    bodyEn: "Experiment 14.3: when light enters a glass block from air, it bends towards the normal.",
    bodyZh: "實驗14.3：光線進入玻璃塊時，向法線偏折。",
    qEn: "Air → glass: the ray bends… the normal", qZh: "空氣→玻璃：光線向…法線偏折",
    opts: ["Towards 向", "Away from 離開", "Parallel to 平行", "Not at all 不偏折"], a: "Towards 向",
    why: "Glass is optically denser than air. 玻璃比空氣光學密度較高。" },
  { titleEn: "Glass to air", titleZh: "玻璃到空氣",
    bodyEn: "When light leaves the glass block into air, it bends away from the normal.",
    bodyZh: "光線離開玻璃塊進入空氣時，離開法線偏折。",
    qEn: "Glass → air: the ray bends… the normal", qZh: "玻璃→空氣：光線…法線偏折",
    opts: ["Away from 離開", "Towards 向", "Along the surface 沿表面", "Stops 停止"], a: "Away from 離開",
    why: "Entering less dense medium. 進入較疏介質。" },
  { titleEn: "Along the normal", titleZh: "沿法線",
    bodyEn: "If light travels along the normal, it does not bend on entering or leaving the glass block.",
    bodyZh: "光線沿法線射向界面時，進入和離開玻璃塊都不會偏折。",
    qEn: "Light along the normal at a boundary…", qZh: "光沿法線射向界面時…",
    opts: ["Does not bend 不偏折", "Always bends 90° 總是偏折90°", "Is absorbed 被吸收", "Reverses 反向"], a: "Does not bend 不偏折",
    why: "No change in direction along normal. 沿法線方向不變。" },
  { titleEn: "Energy conservation", titleZh: "能量守恆",
    bodyEn: "At a boundary, refraction and reflection occur together. The sum of refracted and reflected energy equals the incident energy.",
    bodyZh: "光線在界面同時發生折射和反射。折射線與反射線能量之和等於入射線能量，遵從能量守恆定律。",
    qEn: "A dimmer refracted ray means…", qZh: "較暗的折射線表示…",
    opts: ["Some light is also reflected 部分光亦被反射", "Energy disappears 能量消失", "Light stops 光停止", "No reflection occurs 無反射"], a: "Some light is also reflected 部分光亦被反射",
    why: "Both refraction and reflection at boundary. 界面同時折射和反射。" },
  { titleEn: "Apparent depth", titleZh: "視深",
    bodyEn: "Refraction makes a pool bottom look shallower than it really is — light bends at the water surface.",
    bodyZh: "折射使泳池底部看起來比實際淺——光在水面偏折。",
    qEn: "A coin at the bottom of a beaker of water looks…", qZh: "燒杯底硬幣看起來…",
    opts: ["Higher (shallower) than actual 比實際較高（較淺）", "Deeper than actual 比實際更深", "Invisible 不可見", "On the surface 在水面"], a: "Higher (shallower) than actual 比實際較高（較淺）",
    why: "Apparent depth effect. 視深效應。" },
];
const GUIDED = [
  { qEn: "Refraction occurs at…", qZh: "折射發生在…",
    opts: ["Boundary between media 介質界面", "Only in vacuum 只在真空", "Inside opaque blocks 不透明物體內", "Only in mirrors 只在鏡中"], a: "Boundary between media 介質界面",
    hint: "Speed change at boundary. 界面光速改變。" },
  { qEn: "Into denser medium, light bends…", qZh: "進入較密介質，光…",
    opts: ["Towards normal 向法線", "Away from normal 離開法線", "Not at all 不偏折", "Backwards 向後"], a: "Towards normal 向法線",
    hint: "Air to glass/water. 空氣到玻璃/水。" },
  { qEn: "Glass has n ≈ 1.5, so light is… in glass than air", qZh: "玻璃 n ≈ 1.5，光在玻璃中比空氣…",
    opts: ["Slower 較慢", "Faster 較快", "Same speed 同速", "Zero speed 零速"], a: "Slower 較慢",
    hint: "Higher refractive index → slower. 折射率較高→較慢。" },
  { qEn: "Bent straw in a glass of water is due to…", qZh: "杯中彎曲吸管因…",
    opts: ["Refraction at air-water boundary 氣-水界面折射", "Echo 回聲", "Magnetism 磁性", "Only reflection 只有反射"], a: "Refraction at air-water boundary 氣-水界面折射",
    hint: "Light changes direction. 光改變方向。" },
];
const SUMMARY = [
  { en: "Refraction: bending of light at the boundary between two media.", zh: "折射：光在兩種介質界面偏折。" },
  { en: "Into denser medium → towards normal; into less dense → away from normal.", zh: "進入較密介質→向法線；進入較疏→離開法線。" },
  { en: "Along the normal: no bending. Refraction + reflection conserve energy.", zh: "沿法線：不偏折。折射+反射守恆能量。" },
  { en: "Explains apparent depth of pools and bent objects in water.", zh: "解釋泳池視深和水中物體看似彎曲。" },
];
const REVIEW = [
  { qEn: "Experiment 14.3 uses a…", qZh: "實驗14.3使用…",
    opts: ["Glass block and ray box 玻璃塊和光線箱", "Plane mirror only 只有平面鏡", "Magnet 磁鐵", "Thermometer 溫度計"], a: "Glass block and ray box 玻璃塊和光線箱" },
  { qEn: "Air to glass: bends…", qZh: "空氣到玻璃：向…",
    opts: ["Towards normal 法線", "Away from normal 離開法線", "Not at all 不偏折", "Randomly 隨機"], a: "Towards normal 法線" },
  { qEn: "Along normal at boundary: light…", qZh: "沿法線射向界面：光…",
    opts: ["Does not bend 不偏折", "Always bends 90° 總是偏折90°", "Stops 停止", "Doubles speed 速度加倍"], a: "Does not bend 不偏折" },
  { qEn: "Pool bottom looks shallower due to…", qZh: "池底看起來較淺因…",
    opts: ["Refraction 折射", "Gravity only 只有重力", "Sound 聲", "Magnetism 磁性"], a: "Refraction 折射" },
  { qEn: "Denser refracted + reflected rays together…", qZh: "折射線+反射線合計…",
    opts: ["Equal incident energy 等於入射能量", "Zero energy 零能量", "Infinite energy 無限能量", "No reflection 無反射"], a: "Equal incident energy 等於入射能量" },
];

function ExperimentLab({ isZh, accent }) {
  const [angle, setAngle] = useState(40);
  const t = window.JSLGER.t;
  const rad = a => (a * Math.PI) / 180;
  const rGlass = Math.round(Math.asin(Math.sin(rad(angle)) / N_GLASS) * 180 / Math.PI * 10) / 10;
  const cx = 260, top = 50, bot = 170;
  const len = 90;
  const ix = cx - len * Math.sin(rad(angle));
  const iy = top + 20;
  const jx = cx + len * Math.sin(rad(rGlass));
  const jy = bot - 20;
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("玻璃塊折射模擬（n ≈ 1.5，實驗14.3）。","Glass block refraction sim (n ≈ 1.5, Exp 14.3).",isZh)}</p>
      <label className="block text-sm font-semibold">{t("入射角 i (°)","Incident angle i (°)")}: {angle}°</label>
      <input type="range" min="10" max="70" value={angle} onChange={e => setAngle(+e.target.value)} className="w-full" style={{accentColor: accent}} />
      <svg viewBox="0 0 520 220" className="w-full rounded-xl border bg-slate-50">
        <rect x="140" y="50" width="240" height="120" fill="#bae6fd" stroke="#0ea5e9" strokeWidth="2" opacity="0.7" />
        <text x="260" y="115" textAnchor="middle" fontSize="12" fill="#0369a1">{t("玻璃 n≈1.5","Glass n≈1.5",isZh)}</text>
        <text x="80" y="40" fontSize="11" fill="#64748b">{t("空氣","Air",isZh)}</text>
        <line x1={cx} y1="30" x2={cx} y2="190" stroke="#94a3b8" strokeDasharray="5 4" />
        <line x1={ix} y1={iy} x2={cx} y2="50" stroke="#2563eb" strokeWidth="3" />
        <line x1={cx} y1="50" x2={jx} y2={jy} stroke={accent} strokeWidth="3" />
        <line x1={jx} y1={jy} x2={jx + len * Math.sin(rad(rGlass))} y2={jy + len * Math.cos(rad(rGlass))} stroke="#2563eb" strokeWidth="2" opacity="0.7" />
        <text x={ix - 5} y={iy - 5} fontSize="11" fill="#2563eb">i = {angle}°</text>
        <text x={jx + 8} y={jy} fontSize="11" fill={accent}>r = {rGlass}°</text>
      </svg>
      <p className="font-bold text-center text-sm" style={{color: accent}}>{t("空氣→玻璃：向法線偏折","Air→glass: bends towards normal",isZh)} · n = sin i / sin r ≈ {N_GLASS}</p>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_refraction", titleEn: "Refraction of Light", titleZh: "光的折射", unit: "Form 3 · Book 14 Light & Electromagnetic Spectrum" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
