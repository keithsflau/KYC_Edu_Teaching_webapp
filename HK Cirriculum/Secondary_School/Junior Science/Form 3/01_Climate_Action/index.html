<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Climate Action · 氣候行動 | S3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #ecfdf5; }</style>
  <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#059669";
    const { Shell } = window.JSLGER;

    const LEARN = [
      { titleEn: "Greenhouse gases", titleZh: "溫室氣體",
        bodyEn: "CO₂, methane, and water vapour trap outgoing infrared radiation, warming the lower atmosphere.",
        bodyZh: "二氧化碳、甲烷和水蒸氣困住向外紅外輻射，使低層大氣升溫。",
        qEn: "Main human-added greenhouse gas from burning fossil fuels?", qZh: "燃燒化石燃料主要增加哪種溫室氣體？",
        opts: [{ en: "CO₂", zh: "二氧化碳" }, { en: "O₂", zh: "氧氣" }, { en: "N₂", zh: "氮氣" }], a: 0,
        whyEn: "Combustion releases CO₂.", whyZh: "燃燒釋放 CO₂。" },
      { titleEn: "Carbon footprint", titleZh: "碳足跡",
        bodyEn: "Your carbon footprint is the total greenhouse gases caused by your activities (transport, electricity, food).",
        bodyZh: "碳足跡是你的活動（交通、用電、飲食）所產生的溫室氣體總量。",
        qEn: "Which action usually lowers footprint most at home?", qZh: "家中哪項行動通常最能減少碳足跡？",
        opts: [{ en: "Save electricity", zh: "節省用電" }, { en: "Leave lights on", zh: "長開燈" }, { en: "Overfill kettle always", zh: "總是過量烧水" }], a: 0,
        whyEn: "HK grid still uses fossil fuels.", whyZh: "香港電網仍用化石燃料。" },
      { titleEn: "Renewable vs fossil", titleZh: "再生與化石能源",
        bodyEn: "Solar/wind produce little CO₂ in use; coal/oil/gas release stored carbon when burned.",
        bodyZh: "太陽能/風能使用時幾乎不排放 CO₂；煤/油/氣燃燒時釋放儲存碳。",
        qEn: "Burning coal mainly adds… to air", qZh: "燃燒煤炭主要向空氣增加…",
        opts: [{ en: "CO₂", zh: "二氧化碳" }, { en: "Pure oxygen", zh: "純氧" }, { en: "Nitrogen only", zh: "只有氮" }], a: 0,
        whyEn: "Fossil fuels are carbon-rich.", whyZh: "化石燃料富含碳。" },
      { titleEn: "HK context", titleZh: "香港情境",
        bodyEn: "HK faces urban heat island, typhoons, and coastal flooding risks linked to climate change.",
        bodyZh: "香港面對城市熱島、颱風及與氣候變化相關的海岸淹沒風險。",
        qEn: "Urban heat island means city is… than countryside", qZh: "城市熱島指城市比郊區…",
        opts: [{ en: "Warmer", zh: "較暖" }, { en: "Colder", zh: "較冷" }, { en: "Same", zh: "相同" }], a: 0,
        whyEn: "Concrete stores heat.", whyZh: "混凝土儲熱。" },
      { titleEn: "Mitigation", titleZh: "減緩措施",
        bodyEn: "Mitigation = cut emissions (renewables, efficiency, public transport). Adaptation = cope with impacts (drainage, early warning).",
        bodyZh: "減緩 = 減少排放（再生能源、效率、公共交通）。適應 = 應對影響（排水、預警）。",
        qEn: "Planting trees helps because trees…", qZh: "植樹有助因為樹木…",
        opts: [{ en: "Absorb CO₂", zh: "吸收二氧化碳" }, { en: "Produce CO₂", zh: "產生二氧化碳" }, { en: "Block all rain", zh: "阻擋所有雨" }], a: 0,
        whyEn: "Photosynthesis stores carbon.", whyZh: "光合作用儲存碳。" },
      { titleEn: "Simulator", titleZh: "模擬器",
        bodyEn: "Adjust transport, energy, and diet sliders to see how annual CO₂ changes.",
        bodyZh: "調整交通、能源和飲食滑桿，觀察年排放量如何變化。",
        qEn: "Taking MTR instead of private car generally… emissions", qZh: "乘搭港鐵代替私家車通常…排放",
        opts: [{ en: "Lowers", zh: "降低" }, { en: "Raises", zh: "升高" }, { en: "No effect", zh: "無影響" }], a: 0,
        whyEn: "Mass transit per passenger is efficient.", whyZh: "公共交通人均效率高。" }
    ];

    const GUIDED = [
      { qEn: "Greenhouse effect is…", qZh: "溫室效應是…",
        opts: [{ en: "Trapping heat by gases", zh: "氣體困住熱量" }, { en: "Plants in houses", zh: "屋内植物" }, { en: "Only in summer", zh: "只在夏天" }], a: 0,
        hintEn: "IR radiation reflected back.", hintZh: "紅外輻射被反射回。" },
      { qEn: "Fossil fuels are…", qZh: "化石燃料是…",
        opts: [{ en: "Non-renewable", zh: "不可再生" }, { en: "Unlimited", zh: "無限" }, { en: "Made of iron", zh: "鐵製" }], a: 0,
        hintEn: "Form over millions of years.", hintZh: "需數百萬年形成。" },
      { qEn: "Recycling aluminium saves…", qZh: "回收鋁節省…",
        opts: [{ en: "Energy and emissions", zh: "能源與排放" }, { en: "Nothing", zh: "無" }, { en: "Only water", zh: "只有水" }], a: 0,
        hintEn: "Less mining and smelting.", hintZh: "減少開採和冶煉。" },
      { qEn: "Climate adaptation example in HK:", qZh: "香港氣候適應例子：",
        opts: [{ en: "Better drainage", zh: "改善排水" }, { en: "More coal plants", zh: "更多煤電" }, { en: "Ignore typhoons", zh: "忽略颱風" }], a: 0,
        hintEn: "Cope with heavier rain.", hintZh: "應對更強降雨。" }
    ];

    const SUMMARY = [
      { en: "Greenhouse gases trap heat; CO₂ from fossil fuels is key.", zh: "溫室氣體困住熱量；化石燃料的 CO₂ 是關鍵。" },
      { en: "Renewables and efficiency reduce emissions.", zh: "再生能源和效率可減少排放。" },
      { en: "Mitigation cuts causes; adaptation manages impacts.", zh: "減緩針對成因；適應管理影響。" },
      { en: "HK: urban heat, typhoons, coastal risks.", zh: "香港：城市熱島、颱風、海岸風險。" }
    ];

    const REVIEW = [
      { qEn: "Main greenhouse gas from cars (fuel burn)?", qZh: "汽車（燃燒燃料）主要排放？",
        opts: ["CO₂", "O₂", "He"], a: 0 },
      { qEn: "Solar power in use emits…", qZh: "使用太陽能排放…",
        opts: [{ en: "Very little CO₂", zh: "極少 CO₂" }, { en: "Lots of CO₂", zh: "大量 CO₂" }, { en: "Only methane", zh: "只有甲烷" }], a: 0 },
      { qEn: "Trees help climate by…", qZh: "樹木助氣候靠…",
        opts: [{ en: "Absorbing CO₂", zh: "吸收 CO₂" }, { en: "Making CO₂", zh: "製造 CO₂" }, { en: "Stopping wind only", zh: "只擋風" }], a: 0 },
      { qEn: "Urban heat island → city …", qZh: "城市熱島→城市…",
        opts: [{ en: "Warmer", zh: "較暖" }, { en: "Colder", zh: "較冷" }, { en: "Darker", zh: "較暗" }], a: 0 },
      { qEn: "Mitigation means…", qZh: "減緩指…",
        opts: [{ en: "Reducing emissions", zh: "減少排放" }, { en: "Ignoring problem", zh: "忽略問題" }, { en: "More fossil fuel", zh: "更多化石燃料" }], a: 0 }
    ];

    function ClimateLab({ isZh }) {
      const [car, setCar] = useState(50);
      const [elec, setElec] = useState(50);
      const [diet, setDiet] = useState(50);
      const t = window.JSLGER.t;
      const co2 = Math.round(2 + car * 0.08 + elec * 0.05 + diet * 0.04);
      const level = co2 < 4 ? "low" : co2 < 7 ? "mid" : "high";

      return (
        <div className="space-y-4">
          <label className="block text-sm font-bold">{t("私家車依賴", "Car dependence", isZh)} · {car}%
            <input type="range" min="0" max="100" value={car} onChange={e => setCar(+e.target.value)} className="w-full mt-1" style={{ accentColor: ACCENT }} />
          </label>
          <label className="block text-sm font-bold">{t("家居用電", "Home electricity", isZh)} · {elec}%
            <input type="range" min="0" max="100" value={elec} onChange={e => setElec(+e.target.value)} className="w-full mt-1" style={{ accentColor: ACCENT }} />
          </label>
          <label className="block text-sm font-bold">{t("高碳飲食", "High-carbon diet", isZh)} · {diet}%
            <input type="range" min="0" max="100" value={diet} onChange={e => setDiet(+e.target.value)} className="w-full mt-1" style={{ accentColor: ACCENT }} />
          </label>
          <div className={`p-6 rounded-2xl text-center text-white ${level === "low" ? "bg-emerald-500" : level === "mid" ? "bg-amber-500" : "bg-rose-500"}`}>
            <p className="text-sm opacity-90">{t("估計年碳足跡", "Est. annual footprint", isZh)}</p>
            <p className="text-4xl font-black">{co2} t CO₂e</p>
            <p className="text-sm mt-2">{level === "low" ? t("較低", "Lower", isZh) : level === "mid" ? t("中等", "Moderate", isZh) : t("偏高 — 試減少滑桿", "High — try lowering sliders", isZh)}</p>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <Shell
          meta={{ appId: "s3_climate_action", titleEn: "Climate Action Simulator", titleZh: "氣候行動模擬", unit: "Form 3 · Earth & Environment" }}
          accent={ACCENT}
          backHref="../index.html"
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ClimateLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
