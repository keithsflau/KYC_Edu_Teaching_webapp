<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atoms & Elements · 原子與元素 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #f5f3ff; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#7c3aed";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Atoms — building blocks", titleZh: "原子——構成物質的積木",
    bodyEn: "There are only a few kinds of atoms, but over one hundred different kinds combine in many ways to form millions of substances. Atoms are the smallest units of matter.",
    bodyZh: "原子只有一百多種，但卻可組合成世上所有的物質。原子是構成物質的最小粒子。",
    qEn: "Atoms are…", qZh: "原子是…",
    opts: ["The smallest units of matter 構成物質的最小粒子", "Visible with naked eye 肉眼可見", "Only found in plants 只在植物中", "Larger than molecules 比分子大"], a: "The smallest units of matter 構成物質的最小粒子",
    why: "Toy-brick analogy from PPT Ch1. 課本第1章積木比喻。" },
  { titleEn: "What is an element?", titleZh: "甚麼是元素？",
    bodyEn: "An element is a substance made up of only one kind of atom. Gold contains only gold atoms; iron contains only iron atoms.",
    bodyZh: "元素是只由一種原子組成的物質。金只含金原子；鐵只含鐵原子。",
    qEn: "An element contains…", qZh: "元素含有…",
    opts: ["Only one kind of atom 只有一種原子", "Any mixture of atoms 任何原子混合物", "Only water molecules 只有水分子", "Two or more elements 兩種或以上元素"], a: "Only one kind of atom 只有一種原子",
    why: "Definition from teaching slides. 教學簡報定義。" },
  { titleEn: "Molecules of elements", titleZh: "元素的分子",
    bodyEn: "Some elements exist as molecules — small particles of the same kind of atoms bonded together (e.g. hydrogen H₂, oxygen O₂, sulphur S₈).",
    bodyZh: "有些元素以分子形式存在——相同種類的原子結合而成的細小粒子（如氫 H₂、氧 O₂、硫 S₈）。",
    qEn: "A molecule of an element consists of…", qZh: "元素的分子由…組成",
    opts: ["Atoms of the same kind 相同種類的原子", "Atoms of different kinds 不同種類的原子", "Only protons 只有質子", "Only electrons 只有電子"], a: "Atoms of the same kind 相同種類的原子",
    why: "PPT: molecules of elements. 簡報：元素的分子。" },
  { titleEn: "118 known elements", titleZh: "118 種已知元素",
    bodyEn: "By 2017, scientists had identified a total of 118 elements. They can be classified as metals, non-metals and semi-metals.",
    bodyZh: "直至2017年，科學家已發現了118種元素。元素可按物理性質分為金屬、非金屬和半金屬。",
    qEn: "How many elements were known by 2017?", qZh: "2017年已知多少種元素？",
    opts: ["118 118種", "63 63種", "500 500種", "12 12種"], a: "118 118種",
    why: "Count from PPT Ch1. 第1章數字。" },
  { titleEn: "Chemical symbols", titleZh: "化學符號",
    bodyEn: "Scientists use chemical symbols (usually one or two letters) as shorthand for elements — e.g. H hydrogen, O oxygen, Na sodium, Fe iron.",
    bodyZh: "科學家使用化學符號（通常一或兩個字母）代表元素——如 H 氫、O 氧、Na 鈉、Fe 鐵。",
    qEn: "The symbol Na stands for…", qZh: "Na 代表…",
    opts: ["Sodium 鈉", "Nitrogen 氮", "Neon 氖", "Nickel 鎳"], a: "Sodium 鈉",
    why: "Na from Latin Natrium. 來自拉丁文 Natrium。" },
  { titleEn: "Chemical formulae", titleZh: "化學式",
    bodyEn: "A molecule can be represented by a chemical formula. The subscript number tells how many atoms of each element — e.g. H₂ means two hydrogen atoms per molecule.",
    bodyZh: "分子可用化學式表示。下標數字代表各元素的原子數——如 H₂ 表示每個分子含兩個氫原子。",
    qEn: "In H₂, the subscript 2 means…", qZh: "H₂ 中的下標 2 表示…",
    opts: ["Two hydrogen atoms per molecule 每分子兩個氫原子", "Two different elements 兩種不同元素", "Double the mass only 質量加倍", "Two molecules total 共兩個分子"], a: "Two hydrogen atoms per molecule 每分子兩個氫原子",
    why: "Subscript meaning from PPT. 簡報下標意義。" },
];
const GUIDED = [
  { qEn: "An element contains…", qZh: "元素含有…",
    opts: ["Only one kind of atom 只有一種原子", "Any mixture 任何混合物", "Only compounds 只有化合物", "Only ions 只有離子"], a: "Only one kind of atom 只有一種原子",
    hint: "Pure substance definition. 純物質定義。" },
  { qEn: "Hydrogen gas (H₂) is…", qZh: "氫氣 (H₂) 是…",
    opts: ["An element (molecular) 元素（分子形式）", "A compound 化合物", "A mixture 混合物", "A metal alloy 金屬合金"], a: "An element (molecular) 元素（分子形式）",
    hint: "Same kind of atoms bonded. 相同原子結合。" },
  { qEn: "The symbol Fe stands for…", qZh: "Fe 代表…",
    opts: ["Iron 鐵", "Fluorine 氟", "Francium 鈁", "Fermium 鐨"], a: "Iron 鐵",
    hint: "From Latin Ferrum. 來自拉丁文 Ferrum。" },
  { qEn: "All matter is made up of…", qZh: "所有物質由…組成",
    opts: ["Atoms 原子", "Only light 只有光", "Empty space 空間", "Sound waves 聲波"], a: "Atoms 原子",
    hint: "Fundamental particle model. 基本粒子模型。" },
];
const SUMMARY = [
  { en: "Atoms are the smallest units of matter; over 100 kinds combine to form millions of substances.", zh: "原子是構成物質的最小粒子；一百多種原子可組合成數百萬種物質。" },
  { en: "An element contains only one kind of atom; some elements exist as molecules (e.g. H₂, O₂).", zh: "元素只含一種原子；有些元素以分子形式存在（如 H₂、O₂）。" },
  { en: "118 elements are known; each has a chemical symbol (H, O, Na, Fe) and molecules have chemical formulae.", zh: "已知118種元素；各有化學符號（H、O、Na、Fe），分子有化學式。" },
  { en: "Elements can be classified as metals, non-metals and semi-metals.", zh: "元素可按物理性質分為金屬、非金屬和半金屬。" },
];
const REVIEW = [
  { qEn: "Atoms are the…", qZh: "原子是…",
    opts: ["Smallest units of matter 構成物質的最小粒子", "Largest particles 最大粒子", "Only in gases 只在氣體中", "Same as compounds 與化合物相同"], a: "Smallest units of matter 構成物質的最小粒子" },
  { qEn: "Gold is an element because it contains…", qZh: "金是元素，因為它只含…",
    opts: ["Only gold atoms 只有金原子", "Gold and silver atoms 金銀原子", "Gold and oxygen 金與氧", "Any metal atoms 任何金屬原子"], a: "Only gold atoms 只有金原子" },
  { qEn: "O₂ is a molecule of…", qZh: "O₂ 是…的分子",
    opts: ["Oxygen (element) 氧（元素）", "Water (compound) 水（化合物）", "Salt (compound) 食鹽（化合物）", "Air (mixture) 空氣（混合物）"], a: "Oxygen (element) 氧（元素）" },
  { qEn: "How many elements by 2017?", qZh: "2017年已知多少種元素？",
    opts: ["118 118種", "50 50種", "200 200種", "8 8種"], a: "118 118種" },
  { qEn: "In H₂O, how many elements?", qZh: "H₂O 含有多少種元素？",
    opts: ["Two (H and O) 兩種（H和O）", "One 一種", "Three 三種", "Zero 零種"], a: "Two (H and O) 兩種（H和O）" },
];

const ELEMENTS = { 1:"H",2:"He",3:"Li",4:"Be",5:"B",6:"C",7:"N",8:"O",9:"F",10:"Ne",11:"Na",12:"Mg",13:"Al",14:"Si",15:"P",16:"S",17:"Cl",18:"Ar",19:"K",20:"Ca" };
const NAMES = { H:"Hydrogen", He:"Helium", Li:"Lithium", Be:"Beryllium", B:"Boron", C:"Carbon", N:"Nitrogen", O:"Oxygen", F:"Fluorine", Ne:"Neon", Na:"Sodium", Mg:"Magnesium", Al:"Aluminium", Si:"Silicon", P:"Phosphorus", S:"Sulphur", Cl:"Chlorine", Ar:"Argon", K:"Potassium", Ca:"Calcium" };

function ExperimentLab({ isZh, accent }) {
  const [p, setP] = useState(6);
  const [n, setN] = useState(6);
  const t = window.JSLGER.t;
  const e = p;
  const mass = p + n;
  const sym = ELEMENTS[p] || "?";
  const name = NAMES[sym] || t("未知","Unknown",isZh);
  const r = 28 + Math.min(p, 8) * 4;
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("調節質子、中子和電子，觀察元素身份與質量數。", "Adjust protons, neutrons and electrons; see element identity and mass number.", isZh)}</p>
      <label className="block text-sm font-bold">{t("質子數 Z","Protons Z",isZh)}: {p}
        <input type="range" min="1" max="20" value={p} onChange={ev => setP(+ev.target.value)} className="w-full mt-1" style={{ accentColor: accent }} />
      </label>
      <label className="block text-sm font-bold">{t("中子數 N","Neutrons N",isZh)}: {n}
        <input type="range" min="0" max="24" value={n} onChange={ev => setN(+ev.target.value)} className="w-full mt-1" style={{ accentColor: accent }} />
      </label>
      <svg viewBox="0 0 200 200" className="w-full max-w-xs mx-auto">
        <circle cx="100" cy="100" r={r + 20} fill="none" stroke={accent} strokeWidth="1" opacity="0.3" />
        <circle cx="100" cy="100" r={r + 36} fill="none" stroke={accent} strokeWidth="1" opacity="0.2" />
        {[0,1,2].slice(0, Math.min(3, Math.ceil(e/2))).map((_,i) => {
          const orbit = r + 14 + i * 16;
          const angle = (Date.now()/800 + i) % (Math.PI*2);
          return Array.from({length: Math.max(1, Math.floor(e/(i+1)))}).map((__,j) => {
            const a = angle + j * (Math.PI*2 / Math.max(1, Math.floor(e/(i+1))));
            return <circle key={i+"-"+j} cx={100 + orbit*Math.cos(a)} cy={100 + orbit*Math.sin(a)} r="4" fill={accent} opacity="0.8" />;
          });
        })}
        <circle cx="100" cy="100" r={r} fill={accent} opacity="0.25" stroke={accent} strokeWidth="2" />
        <text x="100" y="95" textAnchor="middle" fontSize="22" fontWeight="bold" fill={accent}>{sym}</text>
        <text x="100" y="115" textAnchor="middle" fontSize="10" fill="#64748b">{p}+ {n}n</text>
      </svg>
      <div className="grid grid-cols-3 gap-2 text-center text-xs">
        {[["質子","Protons",p],["中子","Neutrons",n],["電子","Electrons",e]].map(([zh,en,v]) => (
          <div key={en} className="p-2 rounded-xl bg-white border"><p className="text-slate-500">{t(zh,en,isZh)}</p><p className="text-xl font-black" style={{color:accent}}>{v}</p></div>
        ))}
      </div>
      <div className="p-4 rounded-2xl bg-white border-2 text-center" style={{ borderColor: accent }}>
        <p className="text-3xl font-black">{sym}</p>
        <p className="text-sm font-semibold">{name}</p>
        <p className="text-xs text-slate-500">{t("質量數 A =","Mass number A =",isZh)} {mass} · Z = {p}</p>
      </div>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_atoms_elements", titleEn: "Atoms & Elements", titleZh: "原子與元素", unit: "Form 3 · Book 13 Matter" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
