<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Total Internal Reflection · 全內反射 | Form 3 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #fffbeb; }</style>
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) { display: none !important; }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") btn.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({ chromePath: "../../../../_shared/ncs-chrome.json", target: document.body }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>說明光從玻璃射向空氣，入射角大於臨界角才會全內反射。</li><li>知道玻璃到空氣的臨界角約 42°，光纖利用這個現象。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState } = React;
    const ACCENT = "#f59e0b";
    const { Shell } = window.JSLGER;
    const CRITICAL = 49;

const LEARN = [
  { titleEn: "Water to air — small angle", titleZh: "水→空氣——小入射角",
    bodyEn: "Experiment 14.5: when light hits the water surface from below at a small angle, both refraction and reflection occur; the refracted angle is larger than the incidence angle.",
    bodyZh: "實驗14.5：光由下而上射向液面且入射角較小時，同時發生折射和反射；折射角大於入射角。",
    qEn: "Water → air at small i: refracted angle is… than i", qZh: "水→空氣，i 較小時：折射角…入射角",
    opts: ["Larger 較大", "Smaller 較小", "Always zero 總是零", "Always 90° 總是90°"], a: "Larger 較大",
    why: "Entering less dense medium. 進入較疏介質。" },
  { titleEn: "Increasing the angle", titleZh: "增大入射角",
    bodyEn: "As incidence angle increases, the refracted ray becomes dimmer and the reflected ray becomes brighter.",
    bodyZh: "入射角增大時，折射線變暗，反射線變亮。",
    qEn: "When i increases, brightness of refracted ray…", qZh: "i 增大時，折射線亮度…",
    opts: ["Decreases 減弱", "Always increases 總是增強", "Stays same always 總是不變", "Becomes infinite 變無限"], a: "Decreases 減弱",
    why: "More energy goes to reflection. 更多能量轉入反射。" },
  { titleEn: "Critical angle", titleZh: "臨界角",
    bodyEn: "At the critical angle, the refracted ray in air is parallel to the surface (refraction angle = 90°).",
    bodyZh: "入射角增至臨界角時，空氣中的折射線與液面平行（折射角 = 90°）。",
    qEn: "At critical angle, refracted ray is… to the boundary", qZh: "臨界角時，折射線與界面…",
    opts: ["Parallel 平行", "Perpendicular 垂直", "Absent always 總是不存在", "Reversed 反向"], a: "Parallel 平行",
    why: "r = 90° at critical angle. 臨界角時 r = 90°。" },
  { titleEn: "Total internal reflection", titleZh: "全內反射",
    bodyEn: "Beyond the critical angle, there is no refracted ray above the surface — only a reflected ray with the same brightness as the incident ray. This is total internal reflection (TIR).",
    bodyZh: "入射角大於臨界角時，液面以上沒有折射線，只有與入射線亮度相同的反射線，這是全內反射。",
    qEn: "TIR occurs when i is… critical angle (water → air)", qZh: "全內反射發生於 i…臨界角（水→空氣）",
    opts: ["Greater than 大於", "Less than 小於", "Equal to zero 等於零", "Unrelated 無關"], a: "Greater than 大於",
    why: "No refracted ray beyond c. 超過 c 無折射線。" },
  { titleEn: "Conditions for TIR", titleZh: "全內反射條件",
    bodyEn: "TIR needs: (1) light travels from a denser to a less dense medium, (2) incidence angle > critical angle.",
    bodyZh: "全內反射條件：(1) 光從較密介質進入較疏介質；(2) 入射角 > 臨界角。",
    qEn: "TIR cannot occur when light enters water from…", qZh: "光從…進入水時不會發生全內反射",
    opts: ["Air (less dense → denser) 空氣（疏→密）", "Glass to water 玻璃到水", "Water to air 水到空氣", "Diamond to air 鑽石到空氣"], a: "Air (less dense → denser) 空氣（疏→密）",
    why: "Must leave denser medium. 須離開較密介質。" },
  { titleEn: "Optical fibres", titleZh: "光纖",
    bodyEn: "Optical fibres use repeated TIR to carry light signals for internet and phone data — the backbone of HK broadband.",
    bodyZh: "光纖利用重複全內反射傳輸光信號，承載互聯網和電話數據——香港寬頻骨幹。",
    qEn: "Light stays inside a fibre because of…", qZh: "光留在光纖內因…",
    opts: ["Repeated total internal reflection 重複全內反射", "Only external mirrors 只有外部鏡", "Sound insulation 隔音", "Magnetic fields 磁場"], a: "Repeated total internal reflection 重複全內反射",
    why: "Core-cladding boundary TIR. 芯-包層界面全內反射。" },
];
const GUIDED = [
  { qEn: "At TIR, reflected ray brightness is… incident", qZh: "全內反射時，反射線亮度與入射線…",
    opts: ["The same 相同", "Always zero 總是零", "Always half 總是一半", "Unrelated 無關"], a: "The same 相同",
    hint: "Energy conservation in TIR. 全內反射守恆能量。" },
  { qEn: "Coin under beaker disappears when water added because…", qZh: "加水後燒杯底硬幣消失因…",
    opts: ["TIR at water-glass boundary 水-玻璃界面全內反射", "Coin dissolves 硬幣溶解", "Light stops 光停止", "Only UV absorbed 只有紫外被吸收"], a: "TIR at water-glass boundary 水-玻璃界面全內反射",
    hint: "Bottom acts like mirror. 底部像鏡面。" },
  { qEn: "Diamond sparkles partly because…", qZh: "鑽石閃耀部分因…",
    opts: ["High n → small critical angle 高折射率→臨界角小", "Diamond emits light 鑽石發光", "Only reflection outside 只有外部反射", "No refraction 無折射"], a: "High n → small critical angle 高折射率→臨界角小",
    hint: "Many internal reflections. 多次內反射。" },
  { qEn: "Experiment 14.5 uses light from… to air", qZh: "實驗14.5用光由…到空氣",
    opts: ["Water/liquid below 下方的水/液體", "Vacuum only 只有真空", "Metal surface 金屬面", "Sound source 聲源"], a: "Water/liquid below 下方的水/液體",
    hint: "Liquid-to-air boundary. 液-氣界面。" },
];
const SUMMARY = [
  { en: "Small i (water→air): refraction + reflection; r > i.", zh: "小 i（水→空氣）：折射+反射；r > i。" },
  { en: "Critical angle: refracted ray parallel to surface.", zh: "臨界角：折射線與表面平行。" },
  { en: "i > critical: total internal reflection — no refracted ray.", zh: "i > 臨界角：全內反射——無折射線。" },
  { en: "Optical fibres use TIR for high-speed data transmission.", zh: "光纖利用全內反射高速傳輸數據。" },
];
const REVIEW = [
  { qEn: "TIR needs light from… medium to less dense", qZh: "全內反射需要光從…介質到較疏介質",
    opts: ["Denser 較密", "Less dense 較疏", "Opaque 不透明", "Vacuum only 只有真空"], a: "Denser 較密" },
  { qEn: "At critical angle r = …", qZh: "臨界角時 r = …",
    opts: ["90°", "0°", "45° always 總是45°", "180°"], a: "90°" },
  { qEn: "Beyond critical angle, above surface there is…", qZh: "超過臨界角，界面上方…",
    opts: ["No refracted ray 無折射線", "Brighter refracted ray 更亮折射線", "Only refraction 只有折射", "Sound wave 聲波"], a: "No refracted ray 無折射線" },
  { qEn: "Fibre optic internet uses…", qZh: "光纖上網用…",
    opts: ["TIR in glass/plastic fibres 玻璃/塑料光纖中全內反射", "Copper electrons only 只有銅電子", "Water flow 水流", "Air pressure 氣壓"], a: "TIR in glass/plastic fibres 玻璃/塑料光纖中全內反射" },
  { qEn: "As i increases before TIR, refracted ray becomes…", qZh: "全內反射前 i 增大，折射線變…",
    opts: ["Dimmer 較暗", "Brighter always 總是較亮", "Same always 總是相同", "Invisible instantly 立刻不可見"], a: "Dimmer 較暗" },
];

function ExperimentLab({ isZh, accent }) {
  const [angle, setAngle] = useState(35);
  const t = window.JSLGER.t;
  const tir = angle > CRITICAL;
  const rad = a => (a * Math.PI) / 180;
  const cx = 260, surf = 80;
  const len = 100;
  const sx = cx - len * Math.sin(rad(angle));
  const sy = surf + 60;
  const rx = cx + len * Math.sin(rad(angle));
  const ry = surf + 60;
  const tx = cx + len * Math.sin(rad(Math.min(90, angle * 1.3)));
  const ty = surf - len * Math.cos(rad(Math.min(90, angle * 1.3)));
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("調整水下光線入射角（實驗14.5）。臨界角 ≈ 49°（水→空氣）。","Adjust underwater incidence angle (Exp 14.5). Critical angle ≈ 49° (water→air).",isZh)}</p>
      <label className="block text-sm font-semibold">{t("入射角 i (°)","Incident angle i (°)")}: {angle}°</label>
      <input type="range" min="20" max="65" value={angle} onChange={e => setAngle(+e.target.value)} className="w-full" style={{accentColor: accent}} />
      <svg viewBox="0 0 520 200" className="w-full rounded-xl border bg-slate-50">
        <rect x="40" y={surf} width="440" height="110" fill="#7dd3fc" opacity="0.5" />
        <rect x="40" y="20" width="440" height={surf - 20} fill="#e0f2fe" />
        <line x1="40" y1={surf} x2="480" y2={surf} stroke="#0284c7" strokeWidth="2" />
        <text x="450" y={surf - 8} fontSize="10" fill="#0369a1">{t("空氣","Air",isZh)}</text>
        <text x="450" y={surf + 20} fontSize="10" fill="#0369a1">{t("水","Water",isZh)}</text>
        <line x1={sx} y1={sy} x2={cx} y2={surf} stroke="#1d4ed8" strokeWidth="3" />
        {!tir && <line x1={cx} y1={surf} x2={tx} y2={ty} stroke="#f59e0b" strokeWidth="2" opacity="0.6" strokeDasharray="4 3" />}
        <line x1={cx} y1={surf} x2={rx} y2={ry} stroke={tir ? accent : "#64748b"} strokeWidth={tir ? 3 : 2} />
        {tir && (
          <path d="M 80 120 Q 260 60 440 120" fill="none" stroke={accent} strokeWidth="2" strokeDasharray="6 4" opacity="0.5" />
        )}
        <text x="60" y="185" fontSize="11" fill={tir ? accent : "#64748b"}>
          {tir ? t("全內反射 — 光纖原理","TIR — fibre optic principle",isZh) : t("折射 + 反射","Refraction + reflection",isZh)}
        </text>
      </svg>
      <p className="font-bold text-center" style={{color: accent}}>
        {tir ? t("i > 臨界角：100% 內反射","i > critical: 100% internal reflection",isZh) : t("i < 臨界角：部分光折射出去","i < critical: some light refracts out",isZh)}
      </p>
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "f3_tir", titleEn: "Total Internal Reflection", titleZh: "全內反射", unit: "Form 3 · Book 14 Light & Electromagnetic Spectrum" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
