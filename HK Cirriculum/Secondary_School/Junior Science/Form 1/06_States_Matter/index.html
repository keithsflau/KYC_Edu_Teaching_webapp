</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>用水的 0 °C 和 100 °C 分辨固態、液態和氣態。</li><li>說明熔化或沸騰時溫度可以保持不變。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useRef } = React;
    const ACCENT = "#06b6d4";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Three states of water", titleZh: "水的三種狀態",
    bodyEn: "Water can exist as solid (ice), liquid (water) or gas (steam/water vapour). These are physical states — the substance is still H₂O.",
    bodyZh: "水可以固態（冰）、液態（水）或氣態（水蒸氣）存在。這些是物理狀態——物質仍然是 H₂O。",
    qEn: "How many common physical states can water show?", qZh: "水常見有多少種物理狀態？",
    opts: ["Three 三種", "Two 兩種", "One 一種", "Four 四種"], a: "Three 三種",
    why: "Solid, liquid and gas. 固、液、氣。" },
  { titleEn: "Particle arrangement", titleZh: "粒子排列",
    bodyEn: "In solids, particles are closely packed and vibrate in fixed positions. In liquids they slide past each other. In gases they move freely and are far apart.",
    bodyZh: "固態粒子緊密排列，在固定位置振動。液態粒子可互相滑動。氣態粒子自由移動且相距甚遠。",
    qEn: "In which state do particles move most freely?", qZh: "哪種狀態的粒子移動最自由？",
    opts: ["Gas 氣態", "Solid 固態", "Liquid 液態", "All equal 一樣"], a: "Gas 氣態",
    why: "Gas particles have most space and energy. 氣態粒子間距最大。" },
  { titleEn: "Melting and freezing", titleZh: "熔化和凝固",
    bodyEn: "Ice melts to water at 0 °C. Water freezes to ice at 0 °C. During melting/freezing, temperature stays constant while energy breaks or forms bonds between particles.",
    bodyZh: "冰在 0 °C 熔化成水；水在 0 °C 凝固成冰。熔化/凝固期間，溫度保持不變，能量用於改變粒子間的作用力。",
    qEn: "At what temperature does pure water freeze?", qZh: "純水在什麼溫度凝固？",
    opts: ["0 °C", "100 °C", "25 °C", "-10 °C"], a: "0 °C",
    why: "Freezing point of water. 水的凝固點。" },
  { titleEn: "Boiling and evaporation", titleZh: "沸騰和蒸發",
    bodyEn: "Water boils at 100 °C (at standard pressure) to form steam. Evaporation can happen below 100 °C at the surface — e.g. wet clothes drying in Hong Kong humidity.",
    bodyZh: "水在 100 °C（標準大氣壓）沸騰成水蒸氣。蒸發可在 100 °C 以下於表面發生——例如潮濕天氣下晾乾的濕衣服。",
    qEn: "Boiling point of water at standard pressure:", qZh: "標準大氣壓下水的沸點：",
    opts: ["100 °C", "0 °C", "50 °C", "212 K only 只有 212 K"], a: "100 °C",
    why: "Standard boiling point. 標準沸點。" },
  { titleEn: "Heating curve", titleZh: "加熱曲線",
    bodyEn: "When ice is heated, temperature rises until 0 °C (melting plateau), then rises again until 100 °C (boiling plateau), then steam temperature keeps rising. Flat sections = change of state.",
    bodyZh: "加熱冰時，溫度升至 0 °C 後保持不變（熔化平台），再升至 100 °C 後又保持不變（沸騰平台），之後水蒸氣溫度繼續上升。平坦部分代表物態改變。",
    qEn: "During melting, temperature of pure ice/water mixture…", qZh: "純冰/水混合物熔化期間，溫度…",
    opts: ["Stays constant 保持不變", "Rises quickly 快速上升", "Falls 下降", "Becomes random 隨機"], a: "Stays constant 保持不變",
    why: "Energy goes into breaking bonds. 能量用於改變物態。" },
  { titleEn: "Ready for the lab", titleZh: "準備進入實驗",
    bodyEn: "Use the heating simulator to watch particles and read the state at each temperature.",
    bodyZh: "使用加熱模擬器觀察粒子運動，並讀取各溫度下的物態。",
    qEn: "The Experiment tab unlocks after…", qZh: "實驗分頁在…之後解鎖",
    opts: ["Learn section 學習部分", "Closing browser 關閉瀏覽器", "Nothing 無需"], a: "Learn section 學習部分",
    why: "LGER flow: Learn → Guided → Experiment → Review." },
];
const GUIDED = [
  { qEn: "Which change is physical, not chemical?", qZh: "哪項是物理變化而非化學變化？",
    opts: ["Ice melting to water 冰熔化成水", "Wood burning 木柴燃燒", "Iron rusting 鐵生鏽", "Food digesting 食物消化"], a: "Ice melting to water 冰熔化成水",
    hint: "Same substance H₂O. 仍是 H₂O。" },
  { qEn: "Steam condensing on a cold mirror is…", qZh: "水蒸氣在冷鏡上凝結是…",
    opts: ["Gas → liquid 氣→液", "Solid → gas 固→氣", "Liquid → solid 液→固", "Liquid → gas 液→氣"], a: "Gas → liquid 氣→液",
    hint: "Condensation. 凝結。" },
  { qEn: "Particles in ice compared to steam:", qZh: "冰的粒子與水蒸氣的粒子相比：",
    opts: ["Closer together, less movement 較緊密、較少移動", "Farther apart, less movement 較疏、較少移動", "Same spacing 間距相同", "No particles 沒有粒子"], a: "Closer together, less movement 較緊密、較少移動",
    hint: "Solid vs gas model. 固態與氣態模型。" },
  { qEn: "On a heating curve, flat sections mean…", qZh: "加熱曲線上的平坦部分表示…",
    opts: ["Change of state 物態改變", "Thermometer broken 溫度計壞了", "No energy added 沒有加入能量", "Chemical reaction 化學反應"], a: "Change of state 物態改變",
    hint: "Plateau during melting/boiling. 熔化/沸騰平台。" },
];
const SUMMARY = [
  { en: "Water exists as solid (0 °C and below), liquid, and gas (steam above 100 °C at standard pressure).", zh: "水以固態（0 °C 及以下）、液態和氣態（標準大氣壓下 100 °C 以上為水蒸氣）存在。" },
  { en: "Particle model: packed in solids → sliding in liquids → far apart in gases.", zh: "粒子模型：固態緊密 → 液態可流動 → 氣態相距甚遠。" },
  { en: "Melting/freezing at 0 °C and boiling at 100 °C show temperature plateaus on a heating curve.", zh: "0 °C 熔化/凝固和 100 °C 沸騰在加熱曲線上出現溫度平台。" },
  { en: "State changes are physical — the chemical identity (H₂O) stays the same.", zh: "物態改變是物理變化——化學身份（H₂O）不變。" },
];
const REVIEW = [
  { qEn: "State of water at 25 °C:", qZh: "25 °C 時水的狀態：",
    opts: ["Liquid 液態", "Solid 固態", "Gas 氣態", "Plasma 電漿"], a: "Liquid 液態" },
  { qEn: "Evaporation happens…", qZh: "蒸發發生於…",
    opts: ["At the liquid surface, below boiling point 液體表面、低於沸點", "Only at 100 °C 只在 100 °C", "Only inside ice 只在冰內部", "Only in a vacuum 只在真空中"], a: "At the liquid surface, below boiling point 液體表面、低於沸點" },
  { qEn: "When steam cools to water, this is…", qZh: "水蒸氣冷卻成水是…",
    opts: ["Condensation 凝結", "Melting 熔化", "Freezing 凝固", "Sublimation 昇華"], a: "Condensation 凝結" },
  { qEn: "During boiling at 100 °C, temperature…", qZh: "100 °C 沸騰期間，溫度…",
    opts: ["Stays at 100 °C 維持 100 °C", "Keeps rising above 100 °C 持續升超過 100 °C", "Drops to 0 °C 降至 0 °C", "Is undefined 無定義"], a: "Stays at 100 °C 維持 100 °C" },
  { qEn: "Which has the most kinetic energy per particle?", qZh: "哪种狀態的粒子平均動能最大？",
    opts: ["Steam 水蒸氣", "Ice 冰", "Water at 4 °C 4 °C 的水", "All the same 一樣"], a: "Steam 水蒸氣" },
];

function ParticleBox({ temp, accent }) {
  const n = 24;
  const phase = temp < 0 ? "solid" : temp < 100 ? "liquid" : "gas";
  const dots = [];
  for (let i = 0; i < n; i++) {
    let x, y, r;
    if (phase === "solid") {
      x = 12 + (i % 6) * 14; y = 12 + Math.floor(i / 6) * 14; r = 2;
    } else if (phase === "liquid") {
      x = 10 + (i % 6) * 14 + (i % 3); y = 28 + Math.floor(i / 6) * 10 + (i % 2) * 4; r = 3;
    } else {
      x = 8 + (i * 17) % 88; y = 8 + (i * 23) % 72; r = 3 + (i % 2);
    }
    dots.push(React.createElement("circle", { key: i, cx: x, cy: y, r: r, fill: accent, opacity: phase === "gas" ? 0.85 : 1 }));
  }
  return (
    <svg viewBox="0 0 100 80" className="w-full max-w-xs mx-auto rounded-2xl border-2 bg-white" style={{ borderColor: accent + "66" }}>
      {dots}
      {phase === "solid" && <text x="50" y="76" textAnchor="middle" fontSize="6" fill="#64748b">fixed lattice</text>}
      {phase === "liquid" && <text x="50" y="76" textAnchor="middle" fontSize="6" fill="#64748b">slide</text>}
      {phase === "gas" && <text x="50" y="76" textAnchor="middle" fontSize="6" fill="#64748b">free</text>}
    </svg>
  );
}

function ExperimentLab({ isZh, accent }) {
  const [temp, setTemp] = useState(25);
  const t = window.JSLGER.t;
  const state = temp < 0 ? t("固態（冰）", "Solid (ice)", isZh) : temp < 100 ? t("液態（水）", "Liquid (water)", isZh) : t("氣態（水蒸氣）", "Gas (steam)", isZh);
  const process = temp === 0 ? t("熔化/凝固中", "Melting/freezing", isZh) : temp === 100 ? t("沸騰/凝結中", "Boiling/condensing", isZh) : "";
  const markers = [{ x: 0, l: "0°C" }, { x: 100, l: "100°C" }];
  const pct = Math.max(0, Math.min(100, ((temp + 20) / 140) * 100));
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("拖動溫度滑桿，觀察粒子模型和物態。", "Drag the temperature slider to see the particle model and state.", isZh)}</p>
      <ParticleBox temp={temp} accent={accent} />
      <label className="text-sm font-semibold">{t("溫度 (°C)", "Temperature (°C)")}: {temp}</label>
      <input type="range" min="-20" max="120" value={temp} onChange={e => setTemp(+e.target.value)} className="w-full" style={{ accentColor: accent }} />
      <div className="relative h-3 bg-slate-200 rounded-full">
        <div className="absolute h-3 rounded-full" style={{ width: pct + "%", background: accent }} />
        {markers.map(m => (
          <span key={m.l} className="absolute -top-5 text-[10px] text-slate-500" style={{ left: ((m.x + 20) / 140 * 100) + "%", transform: "translateX(-50%)" }}>{m.l}</span>
        ))}
      </div>
      <p className="text-2xl font-bold text-center" style={{ color: accent }}>{state}</p>
      {process && <p className="text-sm text-center font-semibold text-amber-600">{process} — {t("溫度平台", "temperature plateau", isZh)}</p>}
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "s1_states", titleEn: "States of Matter", titleZh: "物質的狀態", unit: "Form 1 · Water" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
