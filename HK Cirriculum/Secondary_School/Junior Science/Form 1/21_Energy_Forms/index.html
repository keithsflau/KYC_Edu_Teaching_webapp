<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Energy Forms · 能量形式 | S1 Junior Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../common/vendor/react.production.min.js"></script>
  <script src="../../../../common/vendor/react-dom.production.min.js"></script>
  <script src="../../../../common/vendor/babel.min.js"></script>
  <script src="../../../../common/babel-react-classic.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="../../../../common/junior-science-lger.js"></script>
  <style>body { font-family: "Outfit", sans-serif; background: #f0f9ff; }</style>
  <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../../common/ncs-i18n.css" />
  <script src="../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function wireLgerI18n() {
      if (window.JSLGER && window.JSLGER.registerShellStrings) window.JSLGER.registerShellStrings();
    }
    if (window.NcsI18n && window.NcsI18n.onChange) window.NcsI18n.onChange(wireLgerI18n);
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(function () {
        hideLegacyToggles();
        wireLgerI18n();
      });
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
<body>
<aside id="js-goals" aria-label="學習目標"><h2>學習目標</h2><ul><li>分辨動能、位能、化學能、電能、光能和熱能。</li><li>說明能量可以轉換，不會無故產生或消失。</li></ul></aside>
<script src="../../shared/task-audio.js"></script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useRef } = React;
    const ACCENT = "#f59e0b";
    const { Shell } = window.JSLGER;

const LEARN = [
  { titleEn: "Why energy matters", titleZh: "為何需要能量",
    bodyEn: "Energy is needed for every activity — walking, talking, thinking, growing. The word 'energy' appears on food labels (kJ) because food provides energy for life.",
    bodyZh: "能量是各種活動所需——走路、說話、思考、生長。「能量」一詞常見於食品標籤（kJ），因為食物為生命提供能量。",
    qEn: "We need energy mainly to…", qZh: "我們主要需要能量來…",
    opts: ["Do work and stay alive 做功和維持生命", "Increase mass only 只增加質量", "Produce oxygen only 只產生氧", "Cool the body 冷卻身體"], a: "Do work and stay alive 做功和維持生命",
    why: "Energy enables life processes. 能量支持生命活動。" },
  { titleEn: "Forms of energy", titleZh: "能量形式",
    bodyEn: "Energy exists in many forms: kinetic (moving), potential (stored position), chemical (food/fuel), thermal (heat), light, sound, electrical and nuclear.",
    bodyZh: "能量有多種形式：動能（運動）、位能（儲存位置）、化學能（食物/燃料）、熱能、光能、聲能、電能和核能。",
    qEn: "Energy in a moving MTR train is mainly…", qZh: "行駛中的港鐵列車能量主要是…",
    opts: ["Kinetic 動能", "Chemical only 只有化學能", "Nuclear only 只有核能", "Light only 只有光能"], a: "Kinetic 動能",
    why: "Moving object → kinetic. 運動物體 → 動能。" },
  { titleEn: "Chemical energy in food", titleZh: "食物中的化學能",
    bodyEn: "Food stores chemical energy. During respiration, chemical energy is released for muscles and cells. Plants store energy from photosynthesis as starch.",
    bodyZh: "食物儲存化學能。呼吸作用釋放化學能供肌肉和細胞使用。植物將光合作用所得能量儲存為澱粉。",
    qEn: "Rice provides energy mainly as…", qZh: "米飯提供的能量主要是…",
    opts: ["Chemical energy 化學能", "Kinetic energy 動能", "Sound energy 聲能", "Electrical energy 電能"], a: "Chemical energy 化學能",
    why: "Food = chemical store. 食物 = 化學儲存。" },
  { titleEn: "Energy conversion", titleZh: "能量轉換",
    bodyEn: "Energy changes form but is not created or destroyed (conservation). Example: torch — chemical → electrical → light + thermal.",
    bodyZh: "能量會轉換形式但不會無故產生或消失（守恆）。例子：電筒——化學能 → 電能 → 光能 + 熱能。",
    qEn: "In a torch, battery energy becomes…", qZh: "電筒中電池的能量變成…",
    opts: ["Light and heat 光和熱", "Only sound 只有聲", "Only kinetic 只有動能", "Nothing 無"], a: "Light and heat 光和熱",
    why: "Typical conversion chain. 典型轉換鏈。" },
  { titleEn: "Useful vs wasted", titleZh: "有用與耗散",
    bodyEn: "No device is 100% efficient — some energy is always wasted as heat (e.g. light bulb gets hot). Sankey diagrams show useful and wasted energy flows.",
    bodyZh: "沒有裝置是 100% 有效——部分能量總會以熱等形式耗散（如燈泡發熱）。桑基圖顯示有用和耗散的能量流。",
    qEn: "Wasted energy in a bulb often appears as…", qZh: "燈泡中耗散的能量常表現為…",
    opts: ["Heat 熱", "More light only 更多光", "Kinetic only 只有動能", "Chemical 化學能"], a: "Heat 熱",
    why: "Thermal waste is common. 熱耗散很常見。" },
  { titleEn: "Ready for the lab", titleZh: "準備進入實驗",
    bodyEn: "Pick a Hong Kong scenario and trace how energy converts step by step.",
    bodyZh: "選擇香港情境，逐步追蹤能量如何轉換。",
    qEn: "The Experiment tab unlocks after…", qZh: "實驗分頁在…之後解鎖",
    opts: ["Learn section 學習部分", "Closing browser 關閉瀏覽器", "Nothing 無需"], a: "Learn section 學習部分",
    why: "LGER flow: Learn → Guided → Experiment → Review." },
];
const GUIDED = [
  { qEn: "Sun → plant → rice → student: main energy form in rice?", qZh: "太陽→植物→米→學生：米中主要能量形式？",
    opts: ["Chemical 化學能", "Kinetic 動能", "Sound 聲能", "Nuclear 核能"], a: "Chemical 化學能",
    hint: "Stored in food. 儲存於食物。" },
  { qEn: "A falling book gains ___ energy as it speeds up.", qZh: "下墜的書加速時獲得___能。",
    opts: ["Kinetic 動能", "Chemical 化學能", "Light 光能", "Nuclear 核能"], a: "Kinetic 動能",
    hint: "Motion → kinetic. 運動 → 動能。" },
  { qEn: "MTR brakes warm up because energy becomes…", qZh: "港鐵剎車變熱因能量變成…",
    opts: ["Thermal (heat) 熱能", "Light only 只有光", "Sound only 只有聲", "Chemical 化學能"], a: "Thermal (heat) 熱能",
    hint: "Friction → heat. 摩擦 → 熱。" },
  { qEn: "Energy cannot be created or destroyed — this is…", qZh: "能量不能無故產生或消失——這是…",
    opts: ["Conservation of energy 能量守恆", "Photosynthesis 光合作用", "Evaporation 蒸發", "Density 密度"], a: "Conservation of energy 能量守恆",
    hint: "Fundamental law. 基本定律。" },
];
const SUMMARY = [
  { en: "Energy forms: kinetic, potential, chemical, thermal, light, sound, electrical, nuclear.", zh: "能量形式：動、位、化學、熱、光、聲、電、核。" },
  { en: "Food and fuels store chemical energy; moving objects have kinetic energy.", zh: "食物和燃料儲存化學能；運動物體具有動能。" },
  { en: "Energy converts between forms (e.g. torch: chemical → light + heat).", zh: "能量可在形式間轉換（如電筒：化學 → 光 + 熱）。" },
  { en: "Some energy is always wasted as heat; Sankey diagrams show energy flows.", zh: "部分能量總以熱等形式耗散；桑基圖顯示能量流。" },
];
const REVIEW = [
  { qEn: "Main energy in wind:", qZh: "風的主要能量：",
    opts: ["Kinetic 動能", "Chemical 化學能", "Nuclear 核能", "Light only 只有光"], a: "Kinetic 動能" },
  { qEn: "Battery in phone stores…", qZh: "手機電池儲存…",
    opts: ["Chemical energy 化學能", "Kinetic energy 動能", "Sound energy 聲能", "Light energy 光能"], a: "Chemical energy 化學能" },
  { qEn: "Loudspeaker converts electrical to…", qZh: "喇叭將電能轉為…",
    opts: ["Sound (+ some heat) 聲（+ 少量熱）", "Only chemical 只有化學", "Only nuclear 只有核", "Only light 只有光"], a: "Sound (+ some heat) 聲（+ 少量熱）" },
  { qEn: "kJ on food label measures…", qZh: "食品標籤上的 kJ 量度…",
    opts: ["Energy content 能量含量", "Mass 質量", "Volume 體積", "pH 酸鹼度"], a: "Energy content 能量含量" },
  { qEn: "Efficiency < 100% because…", qZh: "效率 < 100% 因為…",
    opts: ["Energy wasted as heat 能量以熱耗散", "Energy destroyed 能量被消滅", "No conversion occurs 無轉換", "Mass is lost 質量消失"], a: "Energy wasted as heat 能量以熱耗散" },
];

const SCENARIOS = [
  { id: "torch", zh: "電筒", en: "Torch", chain: [{ zh: "化學能", en: "Chemical" }, { zh: "電能", en: "Electrical" }, { zh: "光+熱", en: "Light+Heat" }] },
  { id: "mtr", zh: "港鐵", en: "MTR", chain: [{ zh: "電能", en: "Electrical" }, { zh: "動能", en: "Kinetic" }, { zh: "熱（剎車）", en: "Heat (brakes)" }] },
  { id: "lunch", zh: "午餐", en: "Lunch", chain: [{ zh: "化學能（飯）", en: "Chemical (rice)" }, { zh: "化學能（細胞）", en: "Chemical (cells)" }, { zh: "動+熱", en: "Kinetic+Heat" }] },
];

function ExperimentLab({ isZh, accent }) {
  const [scenario, setScenario] = useState("torch");
  const [step, setStep] = useState(0);
  const t = window.JSLGER.t;
  const sc = SCENARIOS.find(s => s.id === scenario);
  const chain = sc.chain;
  return (
    <div className="space-y-4">
      <p className="text-sm text-slate-600">{t("選擇情境，逐步點擊追蹤能量轉換。", "Pick a scenario and tap each step to trace energy conversion.", isZh)}</p>
      <div className="flex gap-2 flex-wrap">
        {SCENARIOS.map(s => (
          <button key={s.id} type="button" onClick={() => { setScenario(s.id); setStep(0); }}
            className={"px-3 py-2 rounded-xl text-sm font-bold min-h-[44px] border " + (scenario === s.id ? "text-white" : "bg-white")}
            style={scenario === s.id ? { background: accent, borderColor: accent } : { borderColor: "#e2e8f0" }}>{t(s.zh, s.en, isZh)}</button>
        ))}
      </div>
      <div className="flex items-center justify-center gap-2 flex-wrap py-4">
        {chain.map((c, i) => (
          <React.Fragment key={i}>
            <button type="button" onClick={() => setStep(i)}
              className={"px-4 py-3 rounded-xl min-h-[48px] text-sm font-bold border-2 transition-all " + (step === i ? "text-white scale-105" : step > i ? "bg-emerald-50 border-emerald-300" : "bg-slate-50 border-slate-200")}
              style={step === i ? { background: accent, borderColor: accent } : {}}>{t(c.zh, c.en, isZh)}</button>
            {i < chain.length - 1 && <span className="text-slate-400 font-bold">→</span>}
          </React.Fragment>
        ))}
      </div>
      {step === chain.length - 1 && (
        <p className="text-center font-bold text-emerald-600">{t("完整能量鏈！", "Full energy chain!", isZh)}</p>
      )}
    </div>
  );
}

    function App() {
      return (
        <Shell
          meta={{ appId: "s1_energy", titleEn: "Energy Forms", titleZh: "能量形式", unit: "Form 1 · Energy" }}
          accent={ACCENT}
          learnSteps={LEARN}
          guidedBank={GUIDED}
          reviewSummary={SUMMARY}
          reviewQuiz={REVIEW}
          experiment={p => <ExperimentLab {...p} />}
        />
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
