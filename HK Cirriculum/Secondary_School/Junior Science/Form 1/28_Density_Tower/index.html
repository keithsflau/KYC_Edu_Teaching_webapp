function ExperimentLab({ isZh, accent }) {
  const objs = [{n:"Wood",zh:"木",d:0.6},{n:"Water",zh:"水",d:1},{n:"Iron",zh:"鐵",d:7.8}];
  const [sel,setSel]=useState(0);

  const floats=objs[sel].d<1;
  return (
    <div className="space-y-4">

  );
