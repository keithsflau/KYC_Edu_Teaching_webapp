<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python 練習 | 高中程式編寫</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f8fafc; color: #334155; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
      .lab { display: flex; height: 100vh; }
      .nav, .keywords { width: 280px; background: #fff; overflow: auto; flex: 0 0 280px; }
      .nav { border-right: 1px solid #e2e8f0; }
      .keywords { border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; }
      .brand { background: #4f46e5; color: #fff; padding: 16px 18px; }
      .brand.purple { background: #7c3aed; }
      .brand h1, .brand h2 { margin: 0; font-size: 20px; }
      .brand p { margin: 6px 0 0; font-size: 12px; opacity: 0.85; }
      .topics { padding: 8px 0 24px; }
      .topics h2 { margin: 12px 16px 4px; font-size: 13px; }
      .topic { display: block; width: 100%; text-align: left; border: 0; border-left: 4px solid transparent; background: transparent; color: #64748b; padding: 8px 16px 8px 28px; cursor: pointer; }
      .topic.active { background: #eff6ff; color: #1d4ed8; border-left-color: #3b82f6; font-weight: 700; }
      main { flex: 1; min-width: 0; overflow: auto; padding: 20px 24px 32px; }
      .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
      .toolbar h2 { margin: 0; font-size: 24px; color: #1e293b; }
      .muted { margin: 4px 0 0; color: #64748b; font-size: 14px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      button { border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
      button.amber { background: #f59e0b; color: #fff; border-color: #f59e0b; }
      button.green { background: #22c55e; color: #fff; border-color: #22c55e; }
      button:disabled { opacity: 0.6; cursor: wait; }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
      .card h3 { margin: 12px 0 6px; font-size: 14px; }
      .pre, .task, .answer, .output, .editor { white-space: pre-wrap; }
      .task { background: #fefce8; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; }
      .answer { background: #f1f5f9; border-radius: 8px; padding: 10px 12px; overflow: auto; }
      .panes { display: flex; gap: 12px; min-height: 360px; }
      .pane { flex: 1; display: flex; flex-direction: column; background: #0f172a; border-radius: 12px; overflow: hidden; min-width: 0; }
      .pane-bar { color: #cbd5e1; font-size: 12px; padding: 8px 12px; background: #1e293b; }
      .editor, .output { flex: 1; margin: 0; padding: 12px; border: 0; background: #0f172a; color: #e2e8f0; font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.5; }
      .editor { color: #fbbf24; resize: none; min-height: 280px; }
      .keyword-list, .all-keys { padding: 12px; }
      .keyword { background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
      .keyword code { background: #f3e8ff; color: #7e22ce; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
      .keyword p { margin: 6px 0; font-size: 12px; }
      .syntax { background: #0f172a; color: #fde68a; font-family: Consolas, monospace; font-size: 11px; padding: 6px; border-radius: 6px; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .chip { border: 1px solid #e2e8f0; border-radius: 4px; padding: 2px 4px; font-size: 10px; color: #64748b; }
      .chip.on { background: #f3e8ff; color: #7e22ce; border-color: #e9d5ff; font-weight: 700; }
      @media (max-width: 960px) {
        .lab { flex-direction: column; height: auto; }
        .nav, .keywords { width: auto; flex-basis: auto; }
        .panes { flex-direction: column; }
      }
    </style>
    <link rel="stylesheet" href="../../../common/ncs-i18n.css" />
    <script src="../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
    <style data-ncs-kit="fleet-bridge">
      body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
      body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
        display: none !important;
      }
    </style>
    <script data-ncs-kit="fleet-init">
    (function () {
      function hideLegacyToggles() {
        document.body.classList.add("ncs-fleet-mounted");
        document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
          var label = (btn.textContent || "").trim();
          if (label === "EN" || label === "\u4E2D") {
            btn.classList.add("ncs-hide-when-ncs-fleet");
          }
        });
        document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
          el.classList.add("ncs-hide-when-ncs-fleet");
        });
      }
      function boot() {
        if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
        window.NcsI18n.init({
          chromePath: "../../../_shared/ncs-chrome.json",
          target: document.body
        }).then(hideLegacyToggles);
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
    </script>
  </head>
  <body>
    <div id="app">
      <h1>Python 練習</h1>
      <p>正在準備練習……</p>
    </div>
    <script src="data.js"></script>
    <script src="lab.js"></script>
    <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
    <aside data-ict-lesson-frame data-ict-topic="prog" lang="zh-HK">
      <h2>學習目標</h2>
      <p data-ict-goal>程式編寫要能追蹤變數、選擇和重複。Python 3 的 print 要加括號。</p>
      <p data-ict-task>你要做的一件事：按「執行程式」，直到輸出區出現結果而不是錯誤。</p>
      <p data-ict-feedback hidden></p>
    </aside>
    <style>
      [data-ict-lesson-frame]{position:fixed;right:12px;bottom:12px;z-index:99999;width:min(340px,calc(100vw - 24px));max-height:46vh;overflow:auto;background:#fff;color:#0f172a;border:1px solid #bae6fd;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(15,23,42,.18);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;text-align:left}
      [data-ict-lesson-frame] h2{margin:0 0 6px;font-size:15px}
      [data-ict-lesson-frame] p{margin:0 0 8px;font-size:13px;line-height:1.45}
      [data-ict-feedback]{background:#ecfeff;border-radius:8px;padding:6px 8px}
    </style>
  </body>
</html>
