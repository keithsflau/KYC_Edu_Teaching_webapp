<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重複與總和</title>
  <style>
    body{margin:0;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:#f8fafc;color:#0f172a}
    main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
    a{color:#0369a1}
    h1{font-size:1.6rem;margin-bottom:.2rem}
    .meta{color:#475569;margin-top:0}
    section{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}
    button,input{font:inherit}
    button{margin:4px;padding:8px 12px;border-radius:10px;border:1px solid #99f6e4;background:#f0fdfa;cursor:pointer}
    input{padding:8px;border:1px solid #cbd5e1;border-radius:8px;width:min(100%,280px)}
    .ok{background:#ecfdf5}
    .bad{background:#fff1f2}
    [data-ict-feedback]{min-height:1.2em}
  </style>
</head>
<body>
<main data-ict-lesson-frame data-ict-topic="prog" lang="zh-HK">
  <p><a href="../index.html">返回 ICT 課題目錄</a></p>
  <h1>重複與總和</h1>
  <p class="meta">中二 · 程式編寫</p>
  <h2>學習目標</h2>
  <p data-ict-goal>追蹤重複結構，算出循環結束後的總和。</p>
  <h2>你要做的一件事</h2>
  <p data-ict-task>總和由 0 開始，依序加上 1、2、3。輸入最後的總和。</p>
  <section><pre>總和 = 0
對 數字 從 1 到 3
    總和 = 總和 + 數字</pre><form id="f"><input id="n" inputmode="numeric" aria-label="總和" /><button type="submit">檢查</button></form></section>
  <p data-ict-feedback hidden></p>
</main>
<script>
function ictTone(ok){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;var ctx=new AC();var o=ctx.createOscillator();var g=ctx.createGain();o.type="sine";o.frequency.value=ok?880:196;o.connect(g);g.connect(ctx.destination);var t=ctx.currentTime;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.07,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.start(t);o.stop(t+0.2);}
function showFb(ok, message){
  var fb=document.querySelector("[data-ict-feedback]");
  fb.hidden=false;
  fb.className=ok?"ok":"bad";
  fb.textContent=message;
  ictTone(ok);
}

        document.getElementById("f").addEventListener("submit",function(e){
          e.preventDefault();
          var ok=Number(document.getElementById("n").value)===6;
          showFb(ok, ok?"正確。0+1=1，1+2=3，3+3=6。":"再追蹤一次：加 1 後是 1，加 2 後是 3，加 3 後是 6。");
        });
      
</script>
</body>
</html>
