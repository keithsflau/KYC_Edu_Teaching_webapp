  <h2>學習目標</h2>
  <p data-ict-goal>IPv4 位址是四組 0 至 255 的數字。公共 Wi-Fi 沒有可靠加密時，不要輸入密碼或身分證號碼。</p>
  <p data-ict-task>你要做的一件事：哪一項是無效的 IPv4 位址？</p>
         <div data-ict-choices><button type="button" data-ict-choice="0">172.16.256.1</button><button type="button" data-ict-choice="1">192.168.1.1</button><button type="button" data-ict-choice="2">10.0.0.8</button><button type="button" data-ict-choice="3">8.8.8.8</button></div>
         <p data-ict-feedback hidden></p>
         <script type="application/json" data-ict-json>{"answer":0,"ok":"正確。每一組只可以是 0 至 255，256 超出範圍。","bad":"256 不能出現在 IPv4 的任何一組。"}</script>
         <script>
         (function () {
           var root = document.currentScript.previousElementSibling.parentElement;
           var data = JSON.parse(root.querySelector("[data-ict-json]").textContent);
           function tone(ok) {
             var AC = window.AudioContext || window.webkitAudioContext;
             if (!AC) return;
             var ctx = new AC();
             var o = ctx.createOscillator();
             var g = ctx.createGain();
             o.type = "sine";
             o.frequency.value = ok ? 880 : 196;
             o.connect(g); g.connect(ctx.destination);
             var t = ctx.currentTime;
             g.gain.setValueAtTime(0.0001, t);
             g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
             g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
             o.start(t); o.stop(t + 0.2);
           }
           root.querySelectorAll("[data-ict-choice]").forEach(function (btn) {
             btn.addEventListener("click", function () {
               var ok = Number(btn.getAttribute("data-ict-choice")) === data.answer;
               var fb = root.querySelector("[data-ict-feedback]");
               fb.hidden = false;
               fb.textContent = ok ? data.ok : data.bad;
               tone(ok);
             });
           });
         })();
         </script>
