  <h2>學習目標</h2>
  <p data-ict-goal>HTTP 是網頁傳輸協定，HTTPS 會加密。圖片應放在網站資料夾，用相對路徑引用，不要寫某一部電腦桌面的路徑。</p>
  <p data-ict-task>你要做的一件事：為甚麼網頁圖片不應使用某一部電腦桌面的 file:/// 路徑？</p>
         <div data-ict-choices><button type="button" data-ict-choice="0">其他電腦和網站伺服器都沒有該桌面路徑</button><button type="button" data-ict-choice="1">因為瀏覽器不能顯示圖片</button><button type="button" data-ict-choice="2">因為 PNG 已停用</button><button type="button" data-ict-choice="3">因為相對路徑一定比較慢</button></div>
         <p data-ict-feedback hidden></p>
         <script type="application/json" data-ict-json>{"answer":0,"ok":"正確。應把圖片放在網站資料夾，用相對路徑引用。","bad":"問題在於路徑只存在於原來那部電腦。"}</script>
         <script>
         (function () {
           var root = document.currentScript.previousElementSibling.parentElement;
           var data = JSON.parse(root.querySelector("[data-ict-json]").textContent);
           function tone(ok) {
             var AC = window.AudioContext || window.webkitAudioContext;
             if (!AC) return;
             var ctx = new AC();
             var o = ctx.createOscillator();
             var g = ctx.createGain();
             o.type = "sine";
             o.frequency.value = ok ? 880 : 196;
             o.connect(g); g.connect(ctx.destination);
             var t = ctx.currentTime;
             g.gain.setValueAtTime(0.0001, t);
             g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
             g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
             o.start(t); o.stop(t + 0.2);
           }
           root.querySelectorAll("[data-ict-choice]").forEach(function (btn) {
             btn.addEventListener("click", function () {
               var ok = Number(btn.getAttribute("data-ict-choice")) === data.answer;
               var fb = root.querySelector("[data-ict-feedback]");
               fb.hidden = false;
               fb.textContent = ok ? data.ok : data.bad;
               tone(ok);
             });
           });
         })();
         </script>
