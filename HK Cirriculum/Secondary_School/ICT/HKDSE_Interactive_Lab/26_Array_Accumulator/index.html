  <h2>學習目標</h2>
  <p data-ict-goal>用追蹤表按順序記錄變數。若循環的計數沒有向前走，循環可能不會結束。Python 3 的 print 要加括號。</p>
  <p data-ict-task>你要做的一件事：Python 3 要在螢幕顯示文字，哪一種寫法正確？</p>
         <div data-ict-choices><button type="button" data-ict-choice="0">print("你好")</button><button type="button" data-ict-choice="1">print 你好</button><button type="button" data-ict-choice="2">echo 你好</button><button type="button" data-ict-choice="3">顯示 你好</button></div>
         <p data-ict-feedback hidden></p>
         <script type="application/json" data-ict-json>{"answer":0,"ok":"正確。Python 3 的 print 是函數，文字要加引號和括號。","bad":"Python 3 不使用沒有括號的 print 語句。"}</script>
         <script>
         (function () {
           var root = document.currentScript.previousElementSibling.parentElement;
           var data = JSON.parse(root.querySelector("[data-ict-json]").textContent);
           function tone(ok) {
             var AC = window.AudioContext || window.webkitAudioContext;
             if (!AC) return;
             var ctx = new AC();
             var o = ctx.createOscillator();
             var g = ctx.createGain();
             o.type = "sine";
             o.frequency.value = ok ? 880 : 196;
             o.connect(g); g.connect(ctx.destination);
             var t = ctx.currentTime;
             g.gain.setValueAtTime(0.0001, t);
             g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
             g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
             o.start(t); o.stop(t + 0.2);
           }
           root.querySelectorAll("[data-ict-choice]").forEach(function (btn) {
             btn.addEventListener("click", function () {
               var ok = Number(btn.getAttribute("data-ict-choice")) === data.answer;
               var fb = root.querySelector("[data-ict-feedback]");
               fb.hidden = false;
               fb.textContent = ok ? data.ok : data.bad;
               tone(ok);
             });
           });
         })();
         </script>
