  <h2>學習目標</h2>
  <p data-ict-goal>AND 閘要全部輸入為 1，輸出才是 1。OR 閘任一輸入為 1，輸出就是 1。NOT 閘把 0 和 1 對調。</p>
  <p data-ict-task>你要做的一件事：AND 閘在甚麼時候輸出 1？</p>
         <div data-ict-choices><button type="button" data-ict-choice="0">全部輸入都是 1</button><button type="button" data-ict-choice="1">任一輸入是 1</button><button type="button" data-ict-choice="2">全部輸入都是 0</button><button type="button" data-ict-choice="3">輸入不同就一定是 1</button></div>

         (function () {
           var root = document.currentScript.previousElementSibling.parentElement;
           var data = JSON.parse(root.querySelector("[data-ict-json]").textContent);
           function tone(ok) {
             var AC = window.AudioContext || window.webkitAudioContext;
             if (!AC) return;
             var ctx = new AC();
             var o = ctx.createOscillator();
             var g = ctx.createGain();
             o.type = "sine";
             o.frequency.value = ok ? 880 : 196;
             o.connect(g); g.connect(ctx.destination);
             var t = ctx.currentTime;
             g.gain.setValueAtTime(0.0001, t);
             g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
             g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
             o.start(t); o.stop(t + 0.2);
           }
           root.querySelectorAll("[data-ict-choice]").forEach(function (btn) {
             btn.addEventListener("click", function () {
               var ok = Number(btn.getAttribute("data-ict-choice")) === data.answer;
               var fb = root.querySelector("[data-ict-feedback]");
               fb.hidden = false;
               fb.textContent = ok ? data.ok : data.bad;
               tone(ok);
             });
           });
         })();
         </script>
