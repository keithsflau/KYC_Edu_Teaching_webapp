<aside data-ict-lesson-frame data-ict-topic="info" lang="zh-HK">
  <h2>學習目標</h2>
  <p data-ict-goal>資訊處理包括數據、編碼、試算表、資料庫和多媒體。做題前先確認題目要的是計算、查詢還是表示方法。</p>
  <p data-ict-task>你要做的一件事：1 byte 等於多少 bits？</p>
         <div data-ict-choices><button type="button" data-ict-choice="0">8</button><button type="button" data-ict-choice="1">1024</button><button type="button" data-ict-choice="2">4</button><button type="button" data-ict-choice="3">1000</button></div>
         <p data-ict-feedback hidden></p>
         <script type="application/json" data-ict-json>{"answer":0,"ok":"正確。1 byte = 8 bits。","bad":"1 byte 是 8 bits。"}</script>
         <script>
         (function () {
           var root = document.currentScript.previousElementSibling.parentElement;
           var data = JSON.parse(root.querySelector("[data-ict-json]").textContent);
           function tone(ok) {
             var AC = window.AudioContext || window.webkitAudioContext;
             if (!AC) return;
             var ctx = new AC();
             var o = ctx.createOscillator();
             var g = ctx.createGain();
             o.type = "sine";
             o.frequency.value = ok ? 880 : 196;
             o.connect(g); g.connect(ctx.destination);
             var t = ctx.currentTime;
             g.gain.setValueAtTime(0.0001, t);
             g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
             g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
             o.start(t); o.stop(t + 0.2);
           }
           root.querySelectorAll("[data-ict-choice]").forEach(function (btn) {
             btn.addEventListener("click", function () {
               var ok = Number(btn.getAttribute("data-ict-choice")) === data.answer;
               var fb = root.querySelector("[data-ict-feedback]");
               fb.hidden = false;
               fb.textContent = ok ? data.ok : data.bad;
               tone(ok);
             });
           });
         })();
         </script>
