<aside data-ict-lesson-frame data-ict-topic="sys" lang="zh-HK">
  <h2>學習目標</h2>
  <p data-ict-goal>驅動程式讓作業系統能夠使用硬件。RAID 1 用鏡像提高備援。作業系統負責管理硬件、檔案和程式，但不能代替備份。</p>
  <p data-ict-task>你要做的一件事：RAID 1 的主要目的是？</p>
         <div data-ict-choices><button type="button" data-ict-choice="0">用鏡像保留另一份資料，提高備援</button><button type="button" data-ict-choice="1">把 CPU 時脈加倍</button><button type="button" data-ict-choice="2">取代 HTTPS</button><button type="button" data-ict-choice="3">自動撰寫程式</button></div>
         <p data-ict-feedback hidden></p>
         <script type="application/json" data-ict-json>{"answer":0,"ok":"正確。鏡像着重拷貝，不是把兩塊碟的容量加起來存不同的資料。","bad":"RAID 1 是鏡像備援，不是網絡加密，也不是超頻。"}</script>
         <script>
         (function () {
           var root = document.currentScript.previousElementSibling.parentElement;
           var data = JSON.parse(root.querySelector("[data-ict-json]").textContent);
           function tone(ok) {
             var AC = window.AudioContext || window.webkitAudioContext;
             if (!AC) return;
             var ctx = new AC();
             var o = ctx.createOscillator();
             var g = ctx.createGain();
             o.type = "sine";
             o.frequency.value = ok ? 880 : 196;
             o.connect(g); g.connect(ctx.destination);
             var t = ctx.currentTime;
             g.gain.setValueAtTime(0.0001, t);
             g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
             g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
             o.start(t); o.stop(t + 0.2);
           }
           root.querySelectorAll("[data-ict-choice]").forEach(function (btn) {
             btn.addEventListener("click", function () {
               var ok = Number(btn.getAttribute("data-ict-choice")) === data.answer;
               var fb = root.querySelector("[data-ict-feedback]");
               fb.hidden = false;
               fb.textContent = ok ? data.ok : data.bad;
               tone(ok);
             });
           });
         })();
         </script>
