<aside data-ict-lesson-frame data-ict-topic="info" lang="zh-HK">
  <h2>學習目標</h2>
  <p data-ict-goal>文字要有編碼才能儲存。ASCII 不能表示全部中文，UTF-8 可以表示中文，也常用於網頁。</p>
  <p data-ict-task>你要做的一件事：要在網頁正確顯示中文，較穩妥的做法是？</p>
         <div data-ict-choices><button type="button" data-ict-choice="0">使用 UTF-8 等能表示中文的編碼</button><button type="button" data-ict-choice="1">只靠 ASCII</button><button type="button" data-ict-choice="2">把中文存成顏色深淺</button><button type="button" data-ict-choice="3">不需要任何編碼</button></div>
         <p data-ict-feedback hidden></p>
         <script type="application/json" data-ict-json>{"answer":0,"ok":"正確。UTF-8 能表示中文，也是現時網頁的常見編碼。","bad":"ASCII 只覆蓋基本英文與符號，不足夠表示一般中文句子。"}</script>
         <script>
         (function () {
           var root = document.currentScript.previousElementSibling.parentElement;
           var data = JSON.parse(root.querySelector("[data-ict-json]").textContent);
           function tone(ok) {
             var AC = window.AudioContext || window.webkitAudioContext;
             if (!AC) return;
             var ctx = new AC();
             var o = ctx.createOscillator();
             var g = ctx.createGain();
             o.type = "sine";
             o.frequency.value = ok ? 880 : 196;
             o.connect(g); g.connect(ctx.destination);
             var t = ctx.currentTime;
             g.gain.setValueAtTime(0.0001, t);
             g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
             g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
             o.start(t); o.stop(t + 0.2);
           }
           root.querySelectorAll("[data-ict-choice]").forEach(function (btn) {
             btn.addEventListener("click", function () {
               var ok = Number(btn.getAttribute("data-ict-choice")) === data.answer;
               var fb = root.querySelector("[data-ict-feedback]");
               fb.hidden = false;
               fb.textContent = ok ? data.ok : data.bad;
               tone(ok);
             });
           });
         })();
         </script>
