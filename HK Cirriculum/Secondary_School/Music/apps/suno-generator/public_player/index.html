<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Music Player | AI Creations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- NCS i18n fleet kit (auto-injected) -->
  <link rel="stylesheet" href="../../../../../common/ncs-i18n.css" />
  <script src="../../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
  <style data-ncs-kit="fleet-bridge">
    body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
    body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
      display: none !important;
    }
  </style>
  <script data-ncs-kit="fleet-init">
  (function () {
    function hideLegacyToggles() {
      document.body.classList.add("ncs-fleet-mounted");
      document.querySelectorAll("header button[type=\"button\"]").forEach(function (btn) {
        var label = (btn.textContent || "").trim();
        if (label === "EN" || label === "\u4E2D") {
          btn.classList.add("ncs-hide-when-ncs-fleet");
        }
      });
      document.querySelectorAll(".fixed.top-4.right-4.z-50").forEach(function (el) {
        el.classList.add("ncs-hide-when-ncs-fleet");
      });
    }
    function boot() {
      if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
      window.NcsI18n.init({
        chromePath: "../../../../../_shared/ncs-chrome.json",
        target: document.body
      }).then(hideLegacyToggles);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</head>
  <body
    class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 min-h-screen text-white font-['Inter']"
  >
    <div class="container mx-auto px-4 py-8 max-w-4xl">
      <header class="text-center mb-10">
        <h1
          class="text-4xl font-bold mb-2 bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent"
        >
          Class Music Gallery
        </h1>
        <p class="text-purple-200 opacity-80">AI Generated Masterpieces</p>
      </header>

      <div
        class="glass-panel rounded-3xl p-6 shadow-2xl backdrop-blur-xl bg-white/10 border border-white/20 flex flex-col md:flex-row gap-8"
      >
        <!-- Player Section -->
        <div
          class="w-full md:w-1/3 flex flex-col items-center justify-center p-4 border-b md:border-b-0 md:border-r border-white/10"
        >
          <div
            class="w-48 h-48 rounded-2xl bg-gradient-to-tr from-pink-500 to-violet-600 shadow-lg mb-6 flex items-center justify-center relative overflow-hidden group"
          >
            <div
              id="visualizer"
              class="absolute inset-0 flex items-end justify-center gap-1 p-4 opacity-50"
            >
              <!-- Bars generated by JS -->
            </div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="64"
              height="64"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="text-white drop-shadow-md z-10"
            >
              <path
                d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"
              />
            </svg>
          </div>

          <h2
            id="current-title"
            class="text-xl font-bold text-center mb-1 line-clamp-2"
          >
            Select a Song
          </h2>
          <p id="current-date" class="text-xs text-purple-300 mb-6">--/--/--</p>

          <audio id="audio-player" class="w-full mb-4" controls></audio>

          <!-- Lyrics Section -->
          <div class="w-full mt-2 flex-1 min-h-0 flex flex-col items-center">
            <button
              onclick="document.getElementById('lyrics-container').classList.toggle('hidden')"
              class="text-xs text-purple-300 hover:text-white mb-2 flex items-center gap-1 transition-colors"
            >
              <span class="opacity-70">Show/Hide Lyrics</span>
            </button>
            <div
              id="lyrics-container"
              class="w-full h-40 overflow-y-auto bg-black/20 rounded-xl p-4 text-sm text-center text-white/80 whitespace-pre-wrap custom-scrollbar border border-white/5 font-light leading-relaxed hidden"
            >
              Select a song to view lyrics...
            </div>
          </div>
        </div>

        <!-- Playlist Section -->
        <div class="w-full md:w-2/3">
          <h3
            class="text-lg font-semibold mb-4 text-purple-200 flex items-center gap-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            Playlist
          </h3>

          <div
            id="playlist"
            class="space-y-2 h-[400px] overflow-y-auto pr-2 custom-scrollbar"
          >
            <!-- Song Items -->
            <div class="text-center py-10 text-white/30 italic">
              Loading songs...
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  
      
      <!-- Footer -->
      <footer style="text-align:center;padding:1rem;font-size:0.8rem;opacity:0.7;">@HKSTEAMAI All Copy-Right Reserved.</footer>
</body>
</html>
