<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>初中音樂 · 聽賞</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../../../../common/ncs-i18n.css" />
    <script src="../../../../../common/ncs-i18n.js" defer data-ncs-kit="fleet"></script>
    <style data-ncs-kit="fleet-bridge">
      body.ncs-fleet-mounted .ncs-hide-when-ncs-fleet,
      body.ncs-fleet-mounted .ncs-lang-btn:not(.ncs-lang-switcher *) {
        display: none !important;
      }
    </style>
    <script data-ncs-kit="fleet-init">
      (function () {
        function hideLegacyToggles() {
          document.body.classList.add("ncs-fleet-mounted");
          document.querySelectorAll('header button[type="button"]').forEach(function (btn) {
            var label = (btn.textContent || "").trim();
            if (label === "EN" || label === "\u4E2D") {
              btn.classList.add("ncs-hide-when-ncs-fleet");
            }
          });
        }
        function boot() {
          if (!window.NcsI18n || window.NcsI18n.isInitialized()) return;
          window.NcsI18n.init({
            chromePath: "../../../../../_shared/ncs-chrome.json",
            target: document.body,
          }).then(hideLegacyToggles);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="../../../index.html">← 返回初中音樂</a>
      <p class="back">初中 · 聽賞</p>
      <h1>音階、音程、節拍</h1>
      <p class="lead">
        這一頁用瀏覽器發聲。C 大調是 C D E F G A B C。G 大調是 G A B C D E F♯ G，第七音是 F♯，不是 F。
        大三度有 4 個半音，小三度有 3 個半音。
      </p>
      <p id="status"></p>

      <section class="panel">
        <h2>大調音階</h2>
        <div class="row">
          <button class="primary" id="play-scale-c" type="button">播放 C 大調</button>
          <button class="primary" id="play-scale-g" type="button">播放 G 大調</button>
        </div>
        <div class="notes" id="scale-notes"></div>
      </section>

      <section class="panel">
        <h2>音程</h2>
        <div class="row">
          <label>低音
            <select id="root-select">
              <option>C</option>
              <option>D</option>
              <option>E</option>
              <option>F</option>
              <option>G</option>
              <option>A</option>
              <option>B</option>
            </select>
          </label>
          <label>音程 <select id="interval-select"></select></label>
          <button class="primary" id="play-interval" type="button">先後再同時播放</button>
        </div>
        <p id="interval-label"></p>
      </section>

      <section class="panel">
        <h2>節拍</h2>
        <p>2/4 是強弱，3/4 是強弱弱，4/4 課堂上常用強、弱、次強、弱。下面連續奏兩小節。</p>
        <div class="row">
          <select id="metre-select">
            <option value="2">2/4</option>
            <option value="3">3/4</option>
            <option value="4" selected>4/4</option>
          </select>
          <button class="primary" id="play-metre" type="button">播放節拍</button>
        </div>
        <div class="beats" id="beats"></div>
      </section>
      <footer>@HKSTEAMAI All Copy-Right Reserved.</footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
