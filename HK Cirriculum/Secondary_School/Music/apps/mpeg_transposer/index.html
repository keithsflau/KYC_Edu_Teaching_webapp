<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>初中音樂 · 調性判斷</title>
    <style>
      :root { color-scheme: light; --ink: #1c1917; --muted: #57534e; --accent: #6d28d9; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Microsoft JhengHei", "PingFang HK", sans-serif;
        color: var(--ink);
        background: #f5f3ff;
      }
      .wrap { max-width: 760px; margin: 0 auto; padding: 24px 18px 64px; }
      a { color: var(--accent); }
      .back { color: var(--muted); text-decoration: none; }
      h1 { margin: 12px 0 8px; }
      p { color: var(--muted); line-height: 1.7; }
      .panel { margin-top: 16px; padding: 18px; background: #fff; border: 1px solid #ddd6fe; border-radius: 16px; }
      .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .result { padding: 12px; border-radius: 12px; background: #faf5ff; }
      .result strong { display: block; font-size: 1.4rem; color: var(--ink); }
      button, input { font: inherit; }
      button {
        margin: 6px 8px 0 0;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      #status { color: var(--accent); font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="../../index.html">← 返回初中音樂</a>
      <p>初中 · 演奏</p>
      <h1>調性判斷</h1>
      <p>大調與小調分開顯示。C 大調顯示 C，G 大調顯示 G，不會把 G 標成 F。分析不到就寫「未能判斷」，不會當成 C。</p>
      <p id="status">按下面的音階，就可以聽見並看到結果。</p>
      <section class="panel">
        <div class="results">
          <div class="result"><span>大調</span><strong id="major-result">—</strong></div>
          <div class="result"><span>小調</span><strong id="minor-result">—</strong></div>
        </div>
        <p>
          <button id="play-scale-c" type="button">聽 C 大調並分析</button>
          <button id="play-scale-g" type="button">聽 G 大調並分析</button>
        </p>
      </section>
      <section class="panel">
        <h2>分析自己的錄音</h2>
        <input id="file-input" type="file" accept="audio/*" />
        <p>只使用本機檔案，不會上傳。</p>
        <p><a href="./dist/legacy.html">進階移調（下載的是 MP3）</a></p>
      </section>
    </div>
    <script src="./dist/student-key.js"></script>
    <script>
      const WEIGHTS = [6.35, 3.48, 4.38, 4.09, 5.19, 3.66, 2.88];
      const SCALES = {
        C: { name: "C 大調", midi: [72, 74, 76, 77, 79, 81, 83] },
        G: { name: "G 大調", midi: [67, 69, 71, 72, 74, 76, 78] },
      };
      let audioCtx = null;

      function pretty(note) {
        if (!note) return "未能判斷";
        return note.replaceAll("#", "♯").replaceAll("b", "♭") + (arguments[1] || "");
      }
      function show(result) {
        document.getElementById("major-result").textContent = result && result.major
          ? pretty(result.major) + " 大調"
          : "未能判斷";
        document.getElementById("minor-result").textContent = result && result.minor
          ? pretty(result.minor) + " 小調"
          : "未能判斷";
      }
      function chord(midis, sampleRate) {
        const length = Math.floor(sampleRate * 2.4);
        const data = new Float32Array(length);
        midis.forEach((midi, index) => {
          const freq = 440 * 2 ** ((midi - 69) / 12);
          const amp = 0.16 * (WEIGHTS[index] / WEIGHTS[0]);
          for (let n = 0; n < length; n++) {
            data[n] += amp * Math.sin((2 * Math.PI * freq * n) / sampleRate);
          }
        });
        return data;
      }
      function melody(midis, sampleRate) {
        const noteLength = Math.floor(sampleRate * 0.34);
        const data = new Float32Array(noteLength * midis.length);
        midis.forEach((midi, index) => {
          const freq = 440 * 2 ** ((midi - 69) / 12);
          for (let n = 0; n < noteLength; n++) {
            const env = Math.min(1, n / 200) * Math.min(1, (noteLength - n) / 400);
            data[index * noteLength + n] = 0.25 * env * Math.sin((2 * Math.PI * freq * n) / sampleRate);
          }
        });
        return data;
      }
      async function context() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state !== "running") await audioCtx.resume();
        if (audioCtx.state !== "running") throw new Error("blocked");
        return audioCtx;
      }
      async function playSamples(samples, sampleRate) {
        const ac = await context();
        const buffer = ac.createBuffer(1, samples.length, sampleRate);
        buffer.getChannelData(0).set(samples);
        const source = ac.createBufferSource();
        source.buffer = buffer;
        source.connect(ac.destination);
        source.start();
      }
      async function runScale(id) {
        const scale = SCALES[id];
        const sampleRate = 44100;
        const heard = melody(scale.midi.concat([scale.midi[0] + 12]), sampleRate);
        const analysed = chord(scale.midi, sampleRate);
        const result = StudentKey.detectFromSamples(analysed, sampleRate);
        show(result);
        document.getElementById("status").textContent =
          "正在播放" + scale.name + "。大調結果是 " + (result.major || "未能判斷");
        try {
          await playSamples(heard, sampleRate);
        } catch (error) {
          document.getElementById("status").textContent = "瀏覽器未允許發聲，但分析已完成。";
        }
      }
      document.getElementById("play-scale-c").addEventListener("click", () => runScale("C"));
      document.getElementById("play-scale-g").addEventListener("click", () => runScale("G"));
      document.getElementById("file-input").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        document.getElementById("status").textContent = "正在分析…";
        try {
          const ac = await context();
          const decoded = await ac.decodeAudioData(await file.arrayBuffer());
          const result = StudentKey.detectFromSamples(decoded.getChannelData(0), decoded.sampleRate);
          show(result);
          document.getElementById("status").textContent = result.ok
            ? "分析完成。大調與小調分開顯示。"
            : "分析失敗，不會標成 C。";
        } catch (error) {
          show(null);
          document.getElementById("status").textContent = "這個檔案分析不到，不會標成 C。";
        }
      });
    </script>
  </body>
</html>
