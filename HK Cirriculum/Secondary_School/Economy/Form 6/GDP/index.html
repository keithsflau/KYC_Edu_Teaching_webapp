    <p class="kicker">中六</p>
    <h1>本地生產總值</h1>
    <p class="lead">本地生產總值是一段時期內，在香港境內生產的最終貨物和服務的市場價值。支出面是消費、投資、政府消費開支，加上出口，再減去進口。二手資產和轉移支付不計入；買入已發行股票也不是這裡所說的投資。</p>
    <div id="quiz"></div>
    <footer>@HKSTEAMAI All Copy-Right Reserved.</footer>
  </div>
  <script src="../../shared/sfx.js"></script>
  <script src="../../shared/quiz.js"></script>
  <script>
    window.startChoices(document.getElementById("quiz"), [
      {
        title: "今年新落成的居屋",
        html: "<p>一個住戶買入今年新落成的居屋單位。問的是這個新建住宅，不是十年前的二手樓。</p>",
        options: [
          { ok: true, label: "計入投資：新建住宅是固定資本形成", why: "正確。當年新建的住宅是新生產的資本財，計入投資，不是把舊樓再算一次。" },
          { ok: false, label: "不計入，因為樓宇買賣都只是轉名", why: "不對。不計成交價的是二手樓。今年新落成的住宅是當期生產。" },
          { ok: false, label: "計入政府消費開支", why: "不對。政府消費是政府購買當期貨物和服務。新建住宅是資本形成，歸入投資。" }
        ]
      },
      {
        title: "二手樓的成交價",
        html: "<p>一伙十年樓齡的私人住宅以 $800 萬轉手。這題只問成交價本身。</p>",
        options: [
          { ok: true, label: "不計入這 $800 萬", why: "正確。二手住宅只是既有資產轉手。樓在落成那年已經計過，現在再計成交價會重複計算。" },
          { ok: false, label: "計入投資，因為買樓就是投資", why: "不對。本地生產總值裡的投資是新資本形成。買入已經存在的住宅，不是今年的新生產。" },
          { ok: false, label: "計入消費，因為家庭花了錢", why: "不對。這 $800 萬買的不是今年新生產的消費品，而是舊資產的業權。" }
        ]
      },
      {
        title: "地產代理的佣金",
        html: "<p>上一宗二手成交裡，買家支付地產代理佣金。佣金是今年的服務。</p>",
        options: [
          { ok: true, label: "計入私人消費：購買代理服務", why: "正確。樓價本身不計，但代理今年提供了中介服務。家庭購買這項服務，計入私人消費。" },
          { ok: false, label: "不計入，因為整宗二手買賣都不算", why: "不對。不計的是舊樓的成交價。佣金是當期生產的服務，要分開計算。" },
          { ok: false, label: "計入出口", why: "不對。服務提供給香港的買家，不是售予非居民，所以不是出口。" }
        ]
      },
      {
        title: "綜援",
        html: "<p>政府向合資格家庭發放綜合社會保障援助。</p>",
        options: [
          { ok: true, label: "不計入。這是轉移支付", why: "正確。綜援把購買力轉給家庭，政府沒有因此換取當期貨物或服務，所以不是政府消費開支。" },
          { ok: false, label: "計入政府消費開支", why: "不對。政府消費開支是政府購買貨物和服務，例如公營醫療。綜援是轉移，不是購買服務。" },
          { ok: false, label: "計入投資", why: "不對。綜援沒有形成新的機器、樓宇或其他資本。" }
        ]
      },
      {
        title: "醫管局醫生的薪金",
        html: "<p>醫院管理局支付醫生薪金，醫生在香港公營醫院應診。</p>",
        options: [
          { ok: true, label: "計入政府消費開支", why: "正確。這筆薪金對應的是在香港提供的公營醫療服務，計入政府消費開支。它不是綜援那種轉移支付。" },
          { ok: false, label: "不計入，因為薪金只是內部調撥", why: "不對。公營醫療是當期生產的服務，要計入本地生產總值，不像綜援那樣剔除。" },
          { ok: false, label: "計入出口", why: "不對。服務的使用者是香港的病人，不是非居民在境外購買香港的輸出。" }
        ]
      },
      {
        title: "旅客在銅鑼灣買藥妝",
        html: "<p>非香港居民在銅鑼灣購買藥妝。這題問的是旅客這次購買。</p>",
        options: [
          { ok: true, label: "計入出口", why: "正確。非居民在香港購買貨物，計入香港的出口。貨物當初運入香港是另一筆進口，不要把旅客這次購買記成進口。" },
          { ok: false, label: "不計入，因為買家不是香港人", why: "不對。本地生產總值看生產和銷售發生在哪裡。售予非居民，正是出口。" },
          { ok: false, label: "計入進口", why: "不對。進口是香港向境外購買。旅客在香港付款取貨，是香港的出口。" }
        ]
      },
      {
        title: "一家到深圳吃晚飯",
        html: "<p>香港居民過境到深圳，晚餐花了 $600。</p>",
        options: [
          { ok: true, label: "不增加香港的本地生產總值", why: "正確。晚餐在香港境外生產。支出面即使先把居民消費算進去，也會把這筆外地消費作為服務進口扣除，淨效果不增加香港的本地生產總值。" },
          { ok: false, label: "計入香港消費，所以香港的本地生產總值上升", why: "不對。如果只加消費、不扣除在外地的開支，就會把深圳生產的晚餐算進香港。" },
          { ok: false, label: "計入香港的出口", why: "不對。出口是非居民向香港購買。這是香港居民向深圳購買。" }
        ]
      },
      {
        title: "外傭在香港工作的薪金",
        html: "<p>外籍家庭傭工在香港雇主家中工作，雇主支付薪金。</p>",
        options: [
          { ok: true, label: "計入私人消費，因為服務在香港生產", why: "正確。本地生產總值按生產所在地，不按護照。家務服務在香港境內生產，家庭購買這項服務，計入私人消費。" },
          { ok: false, label: "不計入，因為外傭不是香港永久居民", why: "不對。國籍或居留身份不是這條界線。服務在香港生產，就要計入香港的本地生產總值。" },
          { ok: false, label: "計入出口", why: "不對。服務的使用者是香港家庭，不是非居民，所以不是出口。" }
        ]
      },
      {
        title: "買入已發行的股票",
        html: "<p>投資者在聯交所買入一家公司早已發行的股票，支付股價。這題只問股價本身。</p>",
        options: [
          { ok: true, label: "股價不計入。它不是新生產，也不是資本形成", why: "正確。買入已發行股票只是金融資產轉手，不是新的貨物或服務。本地生產總值裡的投資指新機器、新住宅這類資本形成。券商佣金才是中介服務，要另計，但股價本身不計。" },
          { ok: false, label: "計入投資，因為股票就是投資", why: "不對。日常所說的股票投資，不是本地生產總值裡的投資。買舊股票沒有生產新的資本財。" },
          { ok: false, label: "計入消費", why: "不對。股價不是購買當期生產的消費品。" }
        ]
      },
      {
        title: "支出面的等式",
        html: "<p>用 C 表示消費，I 表示投資，G 表示政府消費開支，X 表示出口，M 表示進口。</p>",
        options: [
          { ok: true, label: "C + I + G + X − M", why: "正確。出口加上去，進口要減去，否則會把外地生產也算進香港。" },
          { ok: false, label: "C + I + G + X + M", why: "不對。進口要扣除。加進進口會把境外生產算進香港的本地生產總值。" },
          { ok: false, label: "只計 C + I + G", why: "不對。香港是開放經濟，出口和進口都不能漏掉。" }
        ],
        closing: "新建住宅計入投資，二手樓價不計，代理佣金要計。綜援是轉移支付。公營醫療、旅客在港購物、以及在香港提供的家務服務都要計。已發行股票的股價不是本地生產總值裡的投資。"
      }
    ]);
  </script>
</body>
