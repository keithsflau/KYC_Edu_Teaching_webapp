<!DOCTYPE html>
<html lang="zh-HK">
<head>

  <style>
    :root {
      --ink: #0a1f33;
      --ink-soft: #1a3a52;
      --teal: #0f6b5c;
      --teal-deep: #0a4f44;
      --copper: #b87333;
      --muted: rgba(10, 31, 51, 0.58);
      --line: rgba(10, 31, 51, 0.12);
      --font: "Noto Sans TC", system-ui, sans-serif;
      --display: "Fraunces", "Noto Sans TC", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 15% -5%, rgba(15, 107, 92, 0.16), transparent 55%),
        linear-gradient(180deg, #d9e6ef, #f2f6f9 42%, #e8f0f4);
      line-height: 1.5;
    }
    .shell { width: min(920px, calc(100% - 1.5rem)); margin: 0 auto; padding: 1.1rem 0 2rem; }
    .top {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem; padding: 0.35rem 0 1rem;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 0.55rem;
      font-family: var(--display); font-weight: 700; font-size: 1.2rem;
      text-decoration: none; color: inherit; letter-spacing: -0.02em;
    }
    .brand span { color: var(--teal); }
    .mark {
      width: 2.1rem; height: 2.1rem; border-radius: 4px;
      background: linear-gradient(145deg, var(--teal), var(--teal-deep));
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
    }
    .nav { display: flex; flex-wrap: wrap; gap: 0.75rem; font-size: 0.85rem; font-weight: 700; }
    .nav a { color: var(--muted); text-decoration: none; }
    .nav a:hover { color: var(--teal); }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .sub { margin: 0.4rem 0 0; color: var(--muted); font-size: 0.92rem; }
    .sub .en { display: block; margin-top: 0.2rem; font-size: 0.85rem; }
    .badge {
      display: inline-block; margin-top: 0.65rem; padding: 0.28rem 0.65rem;
      border-radius: 999px; background: rgba(15, 107, 92, 0.12); color: var(--teal-deep);
      font-size: 0.72rem; font-weight: 800;
    }
    .badge.demo { background: rgba(184, 115, 51, 0.12); color: #8a4b12; }
    .stats {
      display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      margin: 1.25rem 0;
    }
    .stat {
      background: #fff; border: 1px solid var(--line); border-radius: 4px;
      padding: 1rem; box-shadow: 0 10px 28px rgba(10, 31, 51, 0.08);
    }
    .stat .label { font-size: 0.78rem; color: var(--muted); font-weight: 700; }
    .stat .value { font-size: 1.75rem; font-weight: 900; color: var(--teal-deep); margin-top: 0.15rem; }
    .stat .hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }
    .panel {
      background: #fff; border: 1px solid var(--line); border-radius: 4px;
      padding: 1.15rem 1.2rem; margin-bottom: 0.85rem;
      box-shadow: 0 10px 28px rgba(10, 31, 51, 0.08);
    }
    .panel h2 { margin: 0 0 0.65rem; font-size: 1rem; font-weight: 900; color: var(--teal-deep); }
    .weak-list { margin: 0; padding: 0; list-style: none; }
    .weak-list li {
      padding: 0.55rem 0; border-bottom: 1px dashed var(--line);
      font-size: 0.88rem; display: flex; justify-content: space-between; gap: 0.5rem;
    }
    .weak-list li:last-child { border-bottom: 0; }
    .weak-list .topic { color: var(--muted); font-size: 0.8rem; }
    .empty { color: var(--muted); font-size: 0.88rem; margin: 0; }
    .cta-row { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 1rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.65rem 1rem; border-radius: 4px; font-weight: 700; font-size: 0.88rem;
      text-decoration: none; border: 2px solid transparent; min-height: 44px;
    }
    .btn-primary { background: var(--copper); color: #fff; }
    .btn-primary:hover { background: #d4893a; }
    .btn-ghost { background: transparent; color: var(--ink); border-color: rgba(10,31,51,0.22); }
    .btn-ghost:hover { border-color: var(--ink); background: rgba(255,255,255,0.45); }
    .fine { margin-top: 1.25rem; font-size: 0.8rem; color: var(--muted); }
    .demo-grid {
      display: grid; gap: 0.55rem; grid-template-columns: 1fr;
    }
    @media (min-width: 640px) { .demo-grid { grid-template-columns: 1fr 1fr; } }
    .demo-grid a {
      display: block; padding: 0.65rem 0.85rem; border-radius: 4px;
      background: rgba(15, 107, 92, 0.08); border: 1px solid rgba(15, 107, 92, 0.2);
      text-decoration: none; color: var(--teal-deep); font-weight: 700; font-size: 0.85rem;
    }
    .demo-grid a:hover { background: rgba(15, 107, 92, 0.14); }
    .demo-grid a span { display: block; font-weight: 500; font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
    footer { text-align: center; padding: 1rem; font-size: 0.8rem; opacity: 0.7; }
    .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem; }
  </style>

  <script>
    (function () {
      var DEMO = {
        today: 6,
        streak: 3,
        attempted: 42,
        correct: 34,
        wrong: 8,
        weak: [
          { label: "分數加法", topic: "P3 數學", module: "practice" },
          { label: "光合作用", topic: "F1 科學", module: "practice" },
          { label: "被動語態", topic: "英國語文", module: "practice" }
        ],
        apps: [
          { id: "p3-math", attempted: 18, correct: 14 },
          { id: "f1-science", attempted: 12, correct: 10 },
          { id: "eng-grammar", attempted: 12, correct: 10 }
        ]
      };

      function todayStr() { return new Date().toISOString().slice(0, 10); }

      function readJson(key, fallback) {
        try {
          var v = JSON.parse(localStorage.getItem(key));
          return v == null ? fallback : v;
        } catch (e) { return fallback; }
      }

      function collectProgress() {
        var apps = [];
        var totalAttempted = 0;
        var totalCorrect = 0;
        var wrongBook = [];
        var todayDrills = 0;
        var today = todayStr();

        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (!key || key.indexOf("hkc_progress_") !== 0 || key.slice(-3) !== "_v1") continue;
          var p = readJson(key, null);
          if (!p) continue;
          var appId = key.replace("hkc_progress_", "").replace("_v1", "");
          apps.push({
            id: appId,
            attempted: p.drillsAttempted || 0,
            correct: p.drillsCorrect || 0,
            modules: (p.modulesCompleted || []).length,
            wrong: (p.wrongBook || []).length
          });
          totalAttempted += p.drillsAttempted || 0;
          totalCorrect += p.drillsCorrect || 0;
          (p.wrongBook || []).forEach(function (w) {
            wrongBook.push({ label: w.label, topic: w.topic || "", module: w.module || "", appId: appId, at: w.at });
          });
        }

        for (var j = 0; j < localStorage.length; j++) {
          var dkey = localStorage.key(j);
          if (!dkey || dkey.indexOf("hkc_drillday_") !== 0 || dkey.slice(-3) !== "_v1") continue;
          var d = readJson(dkey, null);
          if (d && d.day === today) todayDrills += d.n || 0;
        }

        wrongBook.sort(function (a, b) {
          return (b.at || "").localeCompare(a.at || "");
        });

        var streak = 0;
        var check = new Date();
        for (var day = 0; day < 30; day++) {
          var ds = check.toISOString().slice(0, 10);
          var found = false;
          for (var k = 0; k < localStorage.length; k++) {
            var dk = localStorage.key(k);
            if (!dk || dk.indexOf("hkc_drillday_") !== 0) continue;
            var dd = readJson(dk, null);
            if (dd && dd.day === ds && (dd.n || 0) > 0) { found = true; break; }
          }
          if (!found && day > 0) break;
          if (found) streak += 1;
          check.setDate(check.getDate() - 1);
        }

        return {
          live: apps.length > 0,
          today: todayDrills,
          streak: streak,
          attempted: totalAttempted,
          correct: totalCorrect,
          wrong: wrongBook.length,
          weak: wrongBook.slice(0, 6),
          apps: apps.sort(function (a, b) { return b.attempted - a.attempted; })
        };
      }

      function render() {
        var data = collectProgress();
        var badge = document.getElementById("data-badge");

        if (!data.live) {
          data = {
            live: false,
            today: DEMO.today,
            streak: DEMO.streak,
            attempted: DEMO.attempted,
            correct: DEMO.correct,
            wrong: DEMO.wrong,
            weak: DEMO.weak,
            apps: DEMO.apps
          };
          badge.textContent = NcsI18n.t("示範數據 — 完成一節課後會顯示真實進度", "Demo preview — complete a lesson for live data");
          badge.className = "badge demo";
          badge.hidden = false;
        } else {
          badge.textContent = NcsI18n.t("本機真實數據", "Live local data");
          badge.className = "badge";
          badge.hidden = false;
        }

        document.getElementById("stat-today").textContent = data.today;
        document.getElementById("stat-streak").textContent = data.streak;
        document.getElementById("stat-acc").textContent =
          data.attempted ? Math.round(100 * data.correct / data.attempted) + "%" : "—";
        document.getElementById("stat-wrong").textContent = data.wrong;

        var weakList = document.getElementById("weak-list");
        var weakEmpty = document.getElementById("weak-empty");
        weakList.innerHTML = "";
        if (!data.weak.length) {
          weakEmpty.hidden = false;
        } else {
          weakEmpty.hidden = true;
          data.weak.forEach(function (w) {
            var li = document.createElement("li");
            li.innerHTML = "<span>" + (w.label || "—") + "</span><span class=\"topic\">" +
              (w.topic || w.appId || "") + "</span>";
            weakList.appendChild(li);
          });
        }

        var appList = document.getElementById("app-list");
        var appEmpty = document.getElementById("app-empty");
        appList.innerHTML = "";
        if (!data.apps.length) {
          appEmpty.hidden = false;
        } else {
          appEmpty.hidden = true;
          data.apps.forEach(function (a) {
            var acc = a.attempted ? Math.round(100 * a.correct / a.attempted) : 0;
            var li = document.createElement("li");
            li.innerHTML = "<span>" + a.id + "</span><span class=\"topic\">" +
              a.attempted + " drills · " + acc + "%</span>";
            appList.appendChild(li);
          });
        }
      }

      render();
      window.addEventListener("storage", render);
      document.addEventListener("hkc:progress", render);
      document.addEventListener("ncs:langchange", function () {
        NcsI18n.applyDataI18n();
        render();
      });
    })();

          statToday: "今日練習",

        },
        en: {

          navSecondary: "Secondary",
          navPricing: "Pricing",

          navLogin: "Sign in",
          navRegister: "Register",
          navHome: "Home",

          statToday: "Today",
          hintDrills: "drills",
          statStreak: "Streak",
          hintDays: "🔥 days",
          statAcc: "Accuracy",
          hintAllApps: "all apps",
          statWrong: "Wrong book",
          hintItems: "items saved",
          weakTitle: "Areas to revisit",
          weakEmpty: "No wrong answers yet. Try an interactive lesson and data will appear automatically.",
          appsTitle: "Apps with progress",
          appsEmpty: "No local progress detected. Try a demo lesson and come back.",
          demoTitle: "Try a demo",
          demoLead: "Complete a lesson, then return — progress updates automatically.",
          ctaPrimary: "Primary school",
          ctaSecondary: "Secondary school",
          ctaPricing: "Plans & pricing",
          ctaRegister: "Register",
          ctaLogin: "Sign in",
          fine: "Local data · Not an official EDB/HKEAA site ·",
          privacy: "Privacy policy"
        }
      }
    });
