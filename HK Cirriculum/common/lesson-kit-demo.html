<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LessonKit 示範</title>
  <style>
    body {
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      font-family: "IBM Plex Sans", "Outfit", "Noto Sans TC", system-ui, sans-serif;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 20px 20px 40px;
    }
    .lead {
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      min-height: 48px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 3px solid #1d4ed8;
      outline-offset: 2px;
    }
    #btn-correct { background: #059669; color: #fff; }
    #btn-wrong { background: #dc2626; color: #fff; }
    #btn-done { background: #1d4ed8; color: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="lead">按下其中一顆按鈕，就會聽到對應的聲音，並在上方固定回饋區看到繁體中文原因。第一次按下之前不會建立音效。</p>
    <div class="actions">
      <button type="button" id="btn-correct">答對</button>
      <button type="button" id="btn-wrong">答錯</button>
      <button type="button" id="btn-done">完成</button>
    </div>
  </main>
  <script src="lesson-kit.js"></script>
  <script>
    LessonKit.mount({
      subject: "全科共用",
      grade: "各年級",
      topic: "課件聲效與回饋",
      objective: "答題後立刻聽到對錯或完成的聲音，並在固定位置讀到繁體中文原因。"
    });

    document.getElementById("btn-correct").addEventListener("click", function () {
      LessonKit.correct();
      LessonKit.feedback("答對了。兩個短上行音表示這次答案正確。", true);
    });

    document.getElementById("btn-wrong").addEventListener("click", function () {
      LessonKit.wrong();
      LessonKit.feedback("答錯了。低音表示這次不正確，請對照學習目標再試一次。", false);
    });

    document.getElementById("btn-done").addEventListener("click", function () {
      LessonKit.done();
      LessonKit.feedback("這部分已完成。三個上行音表示課題收結。", true);
    });
  </script>
</body>
</html>
