<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中文字煙花 | 漢字學習遊戲</title>
    <meta
      name="description"
      content="透過煙花動畫學習中文字，適合小學生的互動學習遊戲"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #ff6b6b;
        --secondary: #4ecdc4;
        --accent: #ffe66d;
        --dark: #1a1a2e;
        --darker: #0f0f1a;
        --text: #ffffff;
        --text-dim: rgba(255, 255, 255, 0.7);
        --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        --glow: 0 0 20px rgba(255, 107, 107, 0.5);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans TC", sans-serif;
        background: var(--darker);
        min-height: 100vh;
        overflow-x: hidden;
        color: var(--text);
      }

      /* Animated Background */
      .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f0f1a 100%
        );
        overflow: hidden;
      }

      .stars {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      .star {
        position: absolute;
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
        animation: twinkle 2s infinite ease-in-out;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      /* Fireworks Canvas */
      #fireworks-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      /* Main Container */
      .container {
        position: relative;
        z-index: 2;
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
        min-height: 100vh;
      }

      /* Header */
      header {
        text-align: center;
        padding: 2rem 0 3rem;
      }

      .logo {
        font-size: 3.5rem;
        font-weight: 900;
        background: linear-gradient(135deg, #ff6b6b, #ffe66d, #4ecdc4, #667eea);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 5s ease infinite;
        text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        margin-bottom: 0.5rem;
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .subtitle {
        font-size: 1.2rem;
        color: var(--text-dim);
        letter-spacing: 3px;
      }

      /* Game Stats */
      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 1rem 2rem;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }

      .stat-item:hover {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .stat-icon {
        font-size: 1.5rem;
      }

      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent);
      }

      .stat-label {
        font-size: 0.9rem;
        color: var(--text-dim);
      }

      /* Game Area */
      .game-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-bottom: 2rem;
      }

      @media (max-width: 900px) {
        .game-area {
          grid-template-columns: 1fr;
        }
      }

      /* Character Display */
      .character-display {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border-radius: 30px;
        padding: 3rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }

      .character-display::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 107, 107, 0.1) 0%,
          transparent 50%
        );
        animation: pulse 4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.8;
        }
      }

      .character-label {
        font-size: 1rem;
        color: var(--text-dim);
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 3px;
      }

      .main-character {
        font-size: 10rem;
        font-weight: 900;
        line-height: 1;
        background: var(--gradient-2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 1;
        transition: all 0.3s ease;
      }

      .main-character.correct {
        animation: celebrate 0.5s ease;
      }

      @keyframes celebrate {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      .pinyin {
        font-size: 2rem;
        color: var(--secondary);
        margin-bottom: 0.5rem;
      }

      .meaning {
        font-size: 1.2rem;
        color: var(--text-dim);
      }

      /* Answer Section */
      .answer-section {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border-radius: 30px;
        padding: 3rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .section-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .options-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }

      .option-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 1.5rem;
        font-size: 3rem;
        font-family: "Noto Sans TC", sans-serif;
        color: var(--text);
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .option-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s ease;
      }

      .option-btn:hover::before {
        left: 100%;
      }

      .option-btn:hover {
        transform: translateY(-5px);
        border-color: var(--secondary);
        box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
      }

      .option-btn.correct {
        background: linear-gradient(135deg, #00b894, #00cec9);
        border-color: #00b894;
        animation: correctPulse 0.5s ease;
      }

      .option-btn.wrong {
        background: linear-gradient(135deg, #d63031, #e17055);
        border-color: #d63031;
        animation: shake 0.5s ease;
      }

      @keyframes correctPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-10px);
        }
        75% {
          transform: translateX(10px);
        }
      }

      /* Progress Bar */
      .progress-section {
        margin-top: 2rem;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        color: var(--text-dim);
      }

      .progress-bar {
        height: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--gradient-3);
        border-radius: 10px;
        transition: width 0.5s ease;
      }

      /* Mode Selection */
      .mode-selection {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .mode-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 50px;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        font-family: "Noto Sans TC", sans-serif;
        color: var(--text);
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .mode-btn:hover {
        border-color: var(--primary);
      }

      .mode-btn.active {
        background: var(--gradient-1);
        border-color: transparent;
      }

      /* Streak Display */
      .streak-container {
        position: fixed;
        top: 2rem;
        right: 2rem;
        z-index: 100;
      }

      .streak-badge {
        background: linear-gradient(135deg, #f093fb, #f5576c);
        padding: 1rem 1.5rem;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .streak-fire {
        font-size: 1.5rem;
      }

      .streak-number {
        font-size: 1.5rem;
        font-weight: 700;
      }

      /* Result Modal */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        z-index: 1000;
        display: none;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .modal-overlay.active {
        display: flex;
        opacity: 1;
      }

      .modal-content {
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        border-radius: 30px;
        padding: 3rem;
        text-align: center;
        max-width: 500px;
        width: 90%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transform: scale(0.9);
        transition: transform 0.3s ease;
      }

      .modal-overlay.active .modal-content {
        transform: scale(1);
      }

      .modal-icon {
        font-size: 5rem;
        margin-bottom: 1rem;
      }

      .modal-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1rem;
        background: var(--gradient-2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .modal-stats {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin: 2rem 0;
      }

      .modal-stat {
        text-align: center;
      }

      .modal-stat-value {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--accent);
      }

      .modal-stat-label {
        font-size: 0.9rem;
        color: var(--text-dim);
      }

      .modal-btn {
        background: var(--gradient-1);
        border: none;
        border-radius: 50px;
        padding: 1rem 3rem;
        font-size: 1.2rem;
        font-family: "Noto Sans TC", sans-serif;
        color: var(--text);
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 1rem;
      }

      .modal-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      }

      /* Footer */
      footer {
        text-align: center;
        padding: 2rem;
        color: var(--text-dim);
        font-size: 0.9rem;
      }

      footer a {
        color: var(--secondary);
        text-decoration: none;
      }

      /* Responsive */
      @media (max-width: 600px) {
        .logo {
          font-size: 2.5rem;
        }

        .main-character {
          font-size: 6rem;
        }

        .stats-bar {
          gap: 1rem;
        }

        .stat-item {
          padding: 0.75rem 1.25rem;
        }

        .option-btn {
          font-size: 2rem;
          padding: 1rem;
        }

        .streak-container {
          top: 1rem;
          right: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-animation">
      <div class="stars" id="stars"></div>
    </div>

    <canvas id="fireworks-canvas"></canvas>

    <div class="streak-container" id="streak-container" style="display: none">
      <div class="streak-badge">
        <span class="streak-fire">🔥</span>
        <span class="streak-number" id="streak-number">0</span>
      </div>
    </div>

    <div class="container">
      <header>
        <h1 class="logo">🎆 中文字煙花 🎆</h1>
        <p class="subtitle">看拼音選漢字 · 答對放煙花</p>
      </header>

      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-icon">✅</span>
          <div>
            <div class="stat-value" id="correct-count">0</div>
            <div class="stat-label">正確</div>
          </div>
        </div>
        <div class="stat-item">
          <span class="stat-icon">❌</span>
          <div>
            <div class="stat-value" id="wrong-count">0</div>
            <div class="stat-label">錯誤</div>
          </div>
        </div>
        <div class="stat-item">
          <span class="stat-icon">🎯</span>
          <div>
            <div class="stat-value" id="accuracy">0%</div>
            <div class="stat-label">準確率</div>
          </div>
        </div>
      </div>

      <div class="mode-selection">
        <button class="mode-btn active" data-mode="p1">小一</button>
        <button class="mode-btn" data-mode="p2">小二</button>
        <button class="mode-btn" data-mode="p3">小三</button>
        <button class="mode-btn" data-mode="p4">小四</button>
        <button class="mode-btn" data-mode="p5">小五</button>
        <button class="mode-btn" data-mode="p6">小六</button>
      </div>

      <div class="game-area">
        <div class="character-display">
          <div class="character-label">請選擇正確的漢字</div>
          <div class="pinyin" id="pinyin">zì</div>
          <div class="main-character" id="main-character">?</div>
          <div class="meaning" id="meaning">等待選擇...</div>
        </div>

        <div class="answer-section">
          <h2 class="section-title">🎯 選擇答案</h2>
          <div class="options-grid" id="options-grid">
            <button class="option-btn" data-index="0">字</button>
            <button class="option-btn" data-index="1">子</button>
            <button class="option-btn" data-index="2">自</button>
            <button class="option-btn" data-index="3">紫</button>
          </div>

          <div class="progress-section">
            <div class="progress-header">
              <span>進度</span>
              <span id="progress-text">0 / 10</span>
            </div>
            <div class="progress-bar">
              <div
                class="progress-fill"
                id="progress-fill"
                style="width: 0%"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <footer>
        <p>💡 小提示：仔細看拼音，選擇正確的漢字 💡</p>
      </footer>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="result-modal">
      <div class="modal-content">
        <div class="modal-icon">🎊</div>
        <h2 class="modal-title">恭喜完成！</h2>
        <div class="modal-stats">
          <div class="modal-stat">
            <div class="modal-stat-value" id="final-correct">0</div>
            <div class="modal-stat-label">正確</div>
          </div>
          <div class="modal-stat">
            <div class="modal-stat-value" id="final-accuracy">0%</div>
            <div class="modal-stat-label">準確率</div>
          </div>
          <div class="modal-stat">
            <div class="modal-stat-value" id="final-streak">0</div>
            <div class="modal-stat-label">最高連擊</div>
          </div>
        </div>
        <button class="modal-btn" id="restart-btn">再玩一次 🎮</button>
      </div>
    </div>

</body>
</html>
