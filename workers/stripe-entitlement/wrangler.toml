# HK Cirriculum ??Stripe entitlement Worker
# Owner: create KV namespace, paste id below, deploy, then set secrets (see CEO_WEBHOOK_OWNER.md)

name = "hkc-stripe-entitlement"
main = "src/index.js"
compatibility_date = "2024-06-01"

# Owner replaces placeholder after: wrangler kv namespace create HKC_ENTITLEMENTS
[[kv_namespaces]]
binding = "ENTITLEMENTS"
id = "29deea582942425d8e0f474aa0f1b7bb"

[vars]
# Comma-separated origins allowed for CORS (no secrets here)
ALLOWED_ORIGINS = "https://hksteamai.github.io,http://127.0.0.1:8787,http://localhost:8787,http://localhost:5173,http://127.0.0.1:5173"

# Secrets (wrangler secret put ??never commit):
# STRIPE_WEBHOOK_SECRET   ??whsec_??from Stripe Dashboard webhook endpoint
# STRIPE_SECRET_KEY       ??sk_live_??or sk_test_??for redeem fallback verify
# ENTITLEMENT_SIGNING_SECRET ??optional HMAC key for signed tokens (defaults to webhook secret)
